syntax = "proto3";

package vrooli.scenario_to_desktop.v1.domain;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "scenario-to-desktop/v1/shared/common.proto";
import "scenario-to-desktop/v1/shared/operation_results.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/scenario-to-desktop/v1/domain;domain";

// =============================================================================
// BUILD AND SMOKE TEST RESULTS
// =============================================================================
//
// @stability beta
//
// Types for tracking build operations and smoke test results. Supports
// multi-platform builds where each platform has independent status.
//
// USAGE CONTEXTS:
//   - Pipeline: Build and smoke test stages populate these types
//   - Status API: Poll endpoints return BuildStatusResponse
//   - UI: Display build progress per platform
//
// =============================================================================

// =============================================================================
// BUILD REQUESTS AND RESPONSES
// =============================================================================

// BuildRequest initiates a build operation.
//
message BuildRequest {
  // Path to the generated desktop wrapper.
  // @format path
  string desktop_path = 1;

  // Target platforms to build.
  // Empty means current platform only.
  repeated vrooli.scenario_to_desktop.v1.shared.Platform platforms = 2;

  // Whether to sign the built artifacts.
  optional bool sign = 3;

  // Whether to publish after building.
  optional bool publish = 4;
}

// ScenarioBuildRequest initiates a scenario-specific build.
//
message ScenarioBuildRequest {
  // Scenario name to build.
  string scenario_name = 1;

  // Path to the generated desktop wrapper.
  // @format path
  string desktop_path = 2;

  // Target platforms to build.
  repeated vrooli.scenario_to_desktop.v1.shared.Platform platforms = 3;

  // Whether to clean existing build output first.
  optional bool clean = 4;
}

// BuildResponse is returned when a build is started.
//
message BuildResponse {
  // Unique build operation identifier.
  // @format uuid
  string build_id = 1;

  // Initial build status.
  string status = 2;

  // URL to poll for status updates.
  // @format uri
  string status_url = 3;
}

message BuildStatusRequest {
  string build_id = 1 [(buf.validate.field).string.min_len = 1];
}

// =============================================================================
// SMOKE TEST TYPES
// =============================================================================

// SmokeTestStartRequest initiates a smoke test.
//
message SmokeTestStartRequest {
  // Scenario name to test.
  string scenario_name = 1;

  // Target platform to test.
  // Optional - defaults to current platform.
  optional vrooli.scenario_to_desktop.v1.shared.Platform platform = 2;

  // Built desktop artifact to execute. This is explicit so evidence always
  // identifies the exact package that was tested.
  string artifact_path = 3 [(buf.validate.field).string.min_len = 1];

  // When enabled, the server owns an Xvfb demo recording and runs the
  // user-visible journey after protocol validation.
  optional bool record_desktop = 4;
}

// SmokeTestStartResponse is returned when a smoke test is started.
//
message SmokeTestStartResponse {
  // Unique smoke test identifier.
  // @format uuid
  string smoke_test_id = 1;

  // Scenario being tested.
  string scenario_name = 2;

  // vrooli.scenario_to_desktop.v1.shared.Platform being tested.
  vrooli.scenario_to_desktop.v1.shared.Platform platform = 3;

  // Initial status.
  vrooli.scenario_to_desktop.v1.shared.SmokeTestStatus status = 4;

  // Artifact being tested.
  // @format path
  optional string artifact_path = 5;

  // When the test started.
  google.protobuf.Timestamp started_at = 6;

  // Initial logs.
  repeated string logs = 7;
}

// SmokeTestCancelResponse is returned when a smoke test is cancelled.
//
message SmokeTestCancelResponse {
  // Resulting status after cancellation.
  string status = 1;
}

message SmokeTestStatusRequest {
  string smoke_test_id = 1 [(buf.validate.field).string.min_len = 1];
}

message SmokeTestCancelRequest {
  string smoke_test_id = 1 [(buf.validate.field).string.min_len = 1];
}

service BuildService {
  rpc StartBuild(BuildRequest) returns (BuildResponse);
  rpc StartScenarioBuild(ScenarioBuildRequest) returns (BuildResponse);
  rpc GetBuild(BuildStatusRequest) returns (vrooli.scenario_to_desktop.v1.shared.BuildStatusResponse);
}

service SmokeTestService {
  rpc StartSmokeTest(SmokeTestStartRequest) returns (SmokeTestStartResponse);
  rpc GetSmokeTest(SmokeTestStatusRequest) returns (vrooli.scenario_to_desktop.v1.shared.SmokeTestStatusResponse);
  rpc CancelSmokeTest(SmokeTestCancelRequest) returns (SmokeTestCancelResponse);
}
