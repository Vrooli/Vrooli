syntax = "proto3";

package vrooli.scenario_to_desktop.v1.domain;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "scenario-to-desktop/v1/shared/common.proto";
import "scenario-to-desktop/v1/shared/preflight_results.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/scenario-to-desktop/v1/domain;domain";

// =============================================================================
// PREFLIGHT SERVICE
//
// @stability beta
//
// Request and job-control contracts for bundle preflight validation. The result
// vocabulary lives in shared/preflight_results.proto because pipeline retains it.
//
// =============================================================================

message PreflightRequest {
  string bundle_manifest_path = 1;
  optional string bundle_root = 2;
  map<string, string> secrets = 3;
  optional int32 timeout_seconds = 4 [(buf.validate.field).int32 = {
    gte: 10
    lte: 300
  }];
  optional bool start_services = 5;
  optional int32 log_tail_lines = 6;
  optional bool status_only = 7;
  optional string session_id = 8;
  optional int32 session_ttl = 9;
  optional bool session_stop = 10;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_COMPLETED = 3;
  JOB_STATUS_FAILED = 4;
}

message JobStep {
  string id = 1;
  string name = 2;
  vrooli.scenario_to_desktop.v1.shared.CheckStatus state = 3;
  optional string detail = 4;
}

message JobStartResponse {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  JobStatus status = 2;
  repeated JobStep steps = 3;
  optional vrooli.scenario_to_desktop.v1.shared.PreflightResponse result = 4;
  optional string error = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message ManifestRequest {
  string manifest_path = 1;
}

message ManifestResponse {
  map<string, string> manifest = 1;
  optional string schema_version = 2;
  repeated vrooli.scenario_to_desktop.v1.shared.ValidationError errors = 3;
}

message GetPreflightJobRequest {
  string job_id = 1 [(buf.validate.field).string.min_len = 1];
}

service PreflightService {
  rpc RunPreflight(PreflightRequest) returns (vrooli.scenario_to_desktop.v1.shared.PreflightResponse);
  rpc GetPreflightJob(GetPreflightJobRequest) returns (JobStatusResponse);
  rpc InspectManifest(ManifestRequest) returns (ManifestResponse);
}
