syntax = "proto3";

package vrooli.scenario_to_desktop.v1.domain;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "scenario-to-desktop/v1/shared/common.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/scenario-to-desktop/v1/domain;domain";

// =============================================================================
// CODE SIGNING CONFIGURATION
// =============================================================================
//
// @stability beta
//
// Configuration types for code signing across Windows, macOS, and Linux.
// Enables secure, verified distribution of desktop applications.
//
// USAGE CONTEXTS:
//   - Build: SigningConfig determines if/how to sign artifacts
//   - Validation: SigningValidationResult reports readiness
//   - UI: Forms collect signing credentials and validate setup
//
// =============================================================================

// =============================================================================
// CERTIFICATE SOURCE ENUM
// =============================================================================

// CertificateSource enumerates where signing certificates are stored.
//
enum CertificateSource {
  // Default/unknown source. Should not be used.
  CERTIFICATE_SOURCE_UNSPECIFIED = 0;

  // Certificate stored in a local file (PFX, P12).
  CERTIFICATE_SOURCE_FILE = 1;

  // Certificate in Windows Certificate Store.
  CERTIFICATE_SOURCE_STORE = 2;

  // Certificate stored in Azure Key Vault.
  CERTIFICATE_SOURCE_AZURE_KEY_VAULT = 3;

  // Certificate stored in AWS KMS.
  CERTIFICATE_SOURCE_AWS_KMS = 4;
}

// SignAlgorithm enumerates supported signing hash algorithms.
//
enum SignAlgorithm {
  // Default/unknown algorithm. Treat as SHA256.
  SIGN_ALGORITHM_UNSPECIFIED = 0;

  // SHA-256 (recommended for modern systems).
  SIGN_ALGORITHM_SHA256 = 1;

  // SHA-384.
  SIGN_ALGORITHM_SHA384 = 2;

  // SHA-512.
  SIGN_ALGORITHM_SHA512 = 3;
}

// =============================================================================
// WINDOWS SIGNING
// =============================================================================

// WindowsSigningConfig configures code signing for Windows executables.
//
// Supports multiple certificate sources and timestamp servers for
// long-term validity.
//
message WindowsSigningConfig {
  // Whether Windows signing is enabled.
  bool enabled = 1;

  // Where the certificate is stored.
  CertificateSource certificate_source = 2;

  // Path to certificate file (for FILE source).
  // @format path
  optional string certificate_path = 3;

  // Certificate thumbprint (for STORE source).
  // SHA-1 fingerprint of the certificate.
  optional string certificate_thumbprint = 4;

  // Subject name for certificate lookup.
  optional string certificate_subject_name = 5;

  // Environment variable containing the certificate password.
  // @example "WIN_CERT_PASSWORD"
  optional string password_env = 6;

  // Signing hash algorithm.
  SignAlgorithm sign_algorithm = 7;

  // RFC 3161 timestamp server URL.
  // @format uri
  // @default "http://timestamp.digicert.com"
  optional string timestamp_server = 8;

  // Description shown in UAC dialogs.
  optional string description = 9;

  // URL shown in UAC dialogs.
  // @format uri
  optional string description_url = 10;

  // Azure Key Vault URL (for AZURE_KEY_VAULT source).
  // @format uri
  optional string azure_key_vault_url = 11;

  // Azure Key Vault certificate name.
  optional string azure_certificate_name = 12;

  // Azure tenant ID for authentication.
  optional string azure_tenant_id = 13;

  // Azure client ID for authentication.
  optional string azure_client_id = 14;

  // Environment variable containing Azure client secret.
  optional string azure_client_secret_env = 15;
}

// =============================================================================
// MACOS SIGNING
// =============================================================================

// MacOSSigningConfig configures code signing and notarization for macOS.
//
// Requires an Apple Developer account and certificates installed in the
// system keychain.
//
message MacOSSigningConfig {
  // Whether macOS signing is enabled.
  bool enabled = 1;

  // Signing identity (Developer ID Application certificate).
  // @example "Developer ID Application: Company Name (TEAM_ID)"
  optional string identity = 2;

  // Apple Developer Team ID.
  // 10-character alphanumeric identifier.
  optional string team_id = 3;

  // Whether to notarize the application.
  // Requires Apple ID credentials.
  bool notarize = 4;

  // Apple ID for notarization.
  // @format email
  optional string apple_id = 5;

  // Environment variable containing Apple ID password or app-specific password.
  optional string apple_password_env = 6;

  // Path to entitlements.plist file.
  // @format path
  optional string entitlements_path = 7;

  // Whether to enable hardened runtime.
  // Required for notarization.
  // @default true
  optional bool hardened_runtime = 8;

  // App-specific password name in keychain.
  optional string keychain_profile = 9;

  // Provisioning profile for distribution.
  // @format path
  optional string provisioning_profile = 10;
}

// =============================================================================
// LINUX SIGNING
// =============================================================================

// LinuxSigningConfig configures GPG signing for Linux packages.
//
message LinuxSigningConfig {
  // Whether Linux signing is enabled.
  bool enabled = 1;

  // GPG key ID for signing.
  optional string gpg_key_id = 2;

  // Environment variable containing GPG passphrase.
  optional string passphrase_env = 3;

  // Path to GPG keyring.
  // @format path
  optional string keyring_path = 4;
}

// =============================================================================
// TOP-LEVEL SIGNING CONFIG
// =============================================================================

// SigningConfig is the complete code signing configuration.
//
// Contains per-platform signing settings. Only platforms that need
// signing should have their configuration populated.
//
message SigningConfig {
  // Whether any code signing is enabled.
  bool enabled = 1;

  // Windows signing configuration.
  optional WindowsSigningConfig windows = 2;

  // macOS signing configuration.
  optional MacOSSigningConfig macos = 3;

  // Linux signing configuration.
  optional LinuxSigningConfig linux = 4;

  // Schema version for configuration compatibility.
  optional string schema_version = 5;
}

// =============================================================================
// VALIDATION RESULTS
// =============================================================================

// CertificateInfo contains details about a discovered certificate.
//
message CertificateInfo {
  // Certificate subject name.
  string subject = 1;

  // Certificate issuer name.
  string issuer = 2;

  // Certificate thumbprint/fingerprint.
  string thumbprint = 3;

  // Certificate expiration date.
  google.protobuf.Timestamp expires_at = 4;

  // Whether the certificate is currently valid.
  bool is_valid = 5;

  // Whether the certificate is expired.
  bool is_expired = 6;

  // Days until expiration (negative if expired).
  int32 days_until_expiry = 7;
}

// PlatformValidation contains validation results for a single platform.
//
message PlatformValidation {
  // Target platform.
  vrooli.scenario_to_desktop.v1.shared.Platform platform = 1;

  // Whether signing is properly configured for this platform.
  bool valid = 2;

  // Whether signing is enabled for this platform.
  bool enabled = 3;

  // Certificate details (if discovered).
  optional CertificateInfo certificate = 4;

  // Validation errors that block signing.
  repeated vrooli.scenario_to_desktop.v1.shared.ValidationError errors = 5;

  // Validation warnings that don't block signing.
  repeated vrooli.scenario_to_desktop.v1.shared.ValidationWarning warnings = 6;

  // Whether required tools are installed.
  bool tools_available = 7;

  // Missing tool names.
  repeated string missing_tools = 8;
}

// SigningValidationResult is the complete signing validation report.
//
// Returned by validation endpoints to indicate signing readiness.
//
message SigningValidationResult {
  // Whether all enabled platforms are ready for signing.
  bool valid = 1;

  // Whether any signing is enabled.
  bool signing_enabled = 2;

  // Per-platform validation results.
  // Key: vrooli.scenario_to_desktop.v1.shared.Platform name (win, mac, linux)
  map<string, PlatformValidation> platforms = 3;

  // Global validation errors.
  repeated vrooli.scenario_to_desktop.v1.shared.ValidationError errors = 4;

  // Global validation warnings.
  repeated vrooli.scenario_to_desktop.v1.shared.ValidationWarning warnings = 5;

  // Timestamp of validation.
  google.protobuf.Timestamp validated_at = 6;
}

// =============================================================================
// READINESS CHECK
// =============================================================================

// PlatformStatus indicates signing readiness for a single platform.
//
message PlatformStatus {
  // Target platform.
  vrooli.scenario_to_desktop.v1.shared.Platform platform = 1;

  // Whether signing is ready.
  bool ready = 2;

  // Whether signing is enabled in config.
  bool enabled = 3;

  // Human-readable status message.
  string message = 4;
}

// ReadinessResponse indicates overall signing readiness.
//
message ReadinessResponse {
  // Whether signing is ready for all enabled platforms.
  bool ready = 1;

  // Per-platform readiness status.
  repeated PlatformStatus platforms = 2;

  // Human-readable summary message.
  string message = 3;
}

// SigningConfigResponse returns the current signing configuration.
//
// Sensitive values (passwords, secrets) are redacted.
//
message SigningConfigResponse {
  // Current signing configuration (with secrets redacted).
  SigningConfig config = 1;

  // Validation result for the current config.
  SigningValidationResult validation = 2;
}

message SigningScenarioRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpsertSigningConfigRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  SigningConfig config = 2;
}

message ValidateSigningRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  SigningConfig config = 2;
}

// PatchSigningPlatformRequest replaces one platform configuration while
// preserving the other platforms in the scenario signing configuration.
message PatchSigningPlatformRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  vrooli.scenario_to_desktop.v1.shared.Platform platform = 2;
  oneof config {
    WindowsSigningConfig windows = 3;
    MacOSSigningConfig macos = 4;
    LinuxSigningConfig linux = 5;
  }
}

message DeleteSigningConfigRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteSigningPlatformRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  vrooli.scenario_to_desktop.v1.shared.Platform platform = 2;
}

message DeleteSigningResponse {
  string scenario_name = 1;
  optional vrooli.scenario_to_desktop.v1.shared.Platform platform = 2;
}

// GenerateLinuxSigningKeyRequest creates a signing key and persists only its
// public identifier plus environment-variable references, never a passphrase.
message GenerateLinuxSigningKeyRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string email = 3 [(buf.validate.field).string.email = true];
  optional string passphrase_env = 4;
  optional string key_type = 5;
  optional string expiry = 6;
  optional string homedir = 7;
  bool force = 8;
  bool export_public = 9;
}

message GenerateLinuxSigningKeyResponse {
  string key_id = 1;
  string fingerprint = 2;
  string homedir = 3;
  optional string public_key = 4;
  optional string public_key_path = 5;
}

message SigningToolStatus {
  vrooli.scenario_to_desktop.v1.shared.Platform platform = 1;
  string tool = 2;
  bool installed = 3;
  optional string path = 4;
  optional string version = 5;
  optional string diagnostic = 6;
  optional string remediation = 7;
}

message ListSigningPrerequisitesResponse {
  repeated SigningToolStatus tools = 1;
}

message DiscoverSigningCertificatesRequest {
  vrooli.scenario_to_desktop.v1.shared.Platform platform = 1;
}

message DiscoveredSigningCertificate {
  string id = 1;
  string name = 2;
  optional string subject = 3;
  optional string issuer = 4;
  optional string expires_at = 5;
  int32 days_to_expiry = 6;
  bool expired = 7;
  bool code_signing = 8;
  optional string type = 9;
  vrooli.scenario_to_desktop.v1.shared.Platform platform = 10;
  optional string usage_hint = 11;
}

message DiscoverSigningCertificatesResponse {
  repeated DiscoveredSigningCertificate certificates = 1;
}

service SigningService {
  rpc GetSigningConfig(SigningScenarioRequest) returns (SigningConfigResponse);
  rpc PutSigningConfig(UpsertSigningConfigRequest) returns (SigningConfigResponse);
  rpc ValidateSigningConfig(ValidateSigningRequest) returns (SigningValidationResult);
  rpc GetSigningReadiness(SigningScenarioRequest) returns (ReadinessResponse);
  rpc PatchSigningPlatform(PatchSigningPlatformRequest) returns (SigningConfigResponse);
  rpc DeleteSigningConfig(DeleteSigningConfigRequest) returns (DeleteSigningResponse);
  rpc DeleteSigningPlatform(DeleteSigningPlatformRequest) returns (DeleteSigningResponse);
  rpc GenerateLinuxSigningKey(GenerateLinuxSigningKeyRequest) returns (GenerateLinuxSigningKeyResponse);
  rpc ListSigningPrerequisites(google.protobuf.Empty) returns (ListSigningPrerequisitesResponse);
  rpc DiscoverSigningCertificates(DiscoverSigningCertificatesRequest) returns (DiscoverSigningCertificatesResponse);
}
