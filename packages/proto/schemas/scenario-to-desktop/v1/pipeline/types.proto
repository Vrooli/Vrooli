syntax = "proto3";

package vrooli.scenario_to_desktop.v1.pipeline;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "scenario-to-desktop/v1/domain/config.proto";
import "scenario-to-desktop/v1/shared/common.proto";
import "scenario-to-desktop/v1/shared/metadata.proto";
import "scenario-to-desktop/v1/shared/operation_results.proto";
import "scenario-to-desktop/v1/shared/preflight_results.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/scenario-to-desktop/v1/pipeline;pipeline";

// =============================================================================
// PIPELINE ORCHESTRATION
// =============================================================================
//
// @stability beta
//
// Pipeline orchestration types for managing the desktop deployment workflow.
// Coordinates stages: bundle -> preflight -> generate -> build -> smoke_test -> distribution.
//
// USAGE CONTEXTS:
//   - API: Pipeline run/status/cancel endpoints
//   - UI: Pipeline progress display and control
//   - CLI: vrooli pipeline run/status commands
//
// =============================================================================

// =============================================================================
// PIPELINE CONFIGURATION
// =============================================================================

// PipelineConfig defines the configuration for a pipeline run.
//
// All settings are optional with sensible defaults. The only required
// field is scenario_name.
//
message PipelineConfig {
  // Name of the scenario to deploy (required).
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];

  // Target platforms to build for.
  // Empty means current platform only.
  repeated vrooli.scenario_to_desktop.v1.shared.Platform platforms = 2;

  // Whether to skip preflight validation.
  // @default false
  optional bool skip_preflight = 3;

  // Whether to skip smoke testing.
  // @default false
  optional bool skip_smoke_test = 4;

  // Whether to stop pipeline if any stage fails.
  // @default true
  optional bool stop_on_failure = 5;

  // Deployment mode for the desktop application.
  vrooli.scenario_to_desktop.v1.shared.DeploymentMode deployment_mode = 6;

  // Target desktop framework.
  vrooli.scenario_to_desktop.v1.shared.Framework framework = 7;

  // Application template type.
  vrooli.scenario_to_desktop.v1.shared.TemplateType template_type = 8;

  // Webhook URL for pipeline notifications.
  // @format uri
  optional string webhook_url = 9;

  // Proxy URL for proxy deployment mode.
  // Required when deployment_mode is PROXY.
  // @format uri
  optional string proxy_url = 10;

  // Override path to bundle manifest.
  // @format path
  optional string bundle_manifest_path = 11;

  // Verified Vrooli release directory that contains resource artifacts.
  optional string resource_artifact_root = 24;

  // Output placement mode: proper, staging, or custom.
  optional string location_mode = 25;

  // Whether to clean existing output before building.
  // @default false
  optional bool clean = 12;

  // Whether to sign built artifacts.
  // @default false
  optional bool sign = 13;

  // Whether to publish after building.
  // @default false
  optional bool publish = 14;

  // Whether to distribute artifacts after building.
  // @default false
  optional bool distribute = 15;

  // Specific distribution targets to upload to.
  // Empty means all enabled targets.
  repeated string distribution_targets = 16;

  // Release version for distribution path.
  optional string version = 17;

  // Timeout in seconds for preflight validation.
  // @default 60
  optional int32 preflight_timeout_seconds = 18;

  // Secrets for preflight validation.
  // Key: Secret name, Value: Secret value
  map<string, string> preflight_secrets = 19;

  // Stage to stop after (for partial runs).
  // Empty means run all stages.
  optional vrooli.scenario_to_desktop.v1.shared.StageName stop_after_stage = 20;

  // Stage to resume from (requires prior stop_after_stage run).
  optional vrooli.scenario_to_desktop.v1.shared.StageName resume_from_stage = 21;

  // Parent pipeline ID when resuming.
  // @format uuid
  optional string parent_pipeline_id = 22;

  // Client-provided key for request deduplication.
  // If a pipeline with this key already exists and is running/completed,
  // returns existing pipeline instead of starting new one.
  optional string idempotency_key = 23;

  // Explicit stage selection. Empty means run the complete pipeline.
  repeated vrooli.scenario_to_desktop.v1.shared.StageName stages = 26;

  // Required for bundled resource artifacts: development-local verifies staged
  // bytes without release promotion; production requires the release authority.
  optional string artifact_trust_mode = 27;

  // Auto-update configuration embedded in the generated desktop application.
  // Generic update URLs may use HTTP only for development-local evidence; a
  // production pipeline requires an HTTPS endpoint.
  optional vrooli.scenario_to_desktop.v1.domain.UpdateConfig update_config = 28;
}

// =============================================================================
// STAGE RESULT
// =============================================================================

// StageResult contains the outcome of a single pipeline stage.
//
message StageResult {
  // Stage name.
  vrooli.scenario_to_desktop.v1.shared.StageName stage = 1;

  // Stage execution status.
  vrooli.scenario_to_desktop.v1.shared.StageStatus status = 2;

  // When the stage started.
  google.protobuf.Timestamp started_at = 3;

  // When the stage completed (success or failure).
  optional google.protobuf.Timestamp completed_at = 4;

  // Error message if stage failed.
  optional string error = 5;

  // Field 6 formerly held untyped JSON output. The desktop deployment
  // contract is greenfield and requires every stage result to be explicit.
  reserved 6;

  // Log messages from stage execution.
  repeated string logs = 7;

  // Typed stage-specific output data.
  optional StageDetails details = 8;
}

// StageDetails is the complete set of outputs a pipeline stage may publish.
// A stage publishes exactly one result kind; consumers must not infer shape
// from a stage name or decode untyped JSON.
message StageDetails {
  oneof kind {
    ResourceDeploymentPlan resolve_deployment = 1;
    BundleStageDetails bundle = 2;
    vrooli.scenario_to_desktop.v1.shared.PreflightResponse preflight = 3;
    GenerateResponse generate = 4;
    vrooli.scenario_to_desktop.v1.shared.BuildStatusResponse build = 5;
    vrooli.scenario_to_desktop.v1.shared.SmokeTestStatusResponse smoke_test = 6;
    DeployStageDetails deploy = 7;
  }
}

message ResourceDeploymentPlan {
  string schema_version = 1;
  repeated ResourceDeploymentPlanItem resources = 2;
  string artifact_trust_mode = 3;
  bool promotable = 4;
  repeated HostRequirementPlanItem host_requirements = 5;
}

message HostRequirementPlanItem {
  string name = 1;
  string kind = 2;
  string os = 3;
  string privilege = 4;
  string bundling = 5;
  bool required = 6;
  string verdict = 7;
  string reason = 8;
  repeated string provenance = 9;
}

message ResourceDeploymentPlanItem {
  string requested_resource = 1;
  string resource = 2;
  string os = 3;
  string architecture = 4;
  string mode = 5;
  string support = 6;
  repeated string requires = 7;
  repeated string limitations = 8;
  repeated string evidence = 9;
  optional ResourceDeploymentFallback selected_fallback = 10;
  optional string artifact = 11;
  repeated ResourceDeploymentArtifact files = 12;
  optional ResourceDeploymentService service = 13;
  string privilege = 14;
  string bundling = 15;
  string eligibility = 16;
  string eligibility_reason = 17;
}

message ResourceDeploymentFallback {
  string resource = 1;
  string reason = 2;
}

message ResourceDeploymentArtifact {
  string name = 1;
  string sha256 = 2;
}

message ResourceDeploymentService {
  ResourceProviderPolicy provider_policy = 1;
  string artifact = 2;
  string version = 3;
  string sha256 = 4;
  repeated string arguments = 5;
  map<string, string> environment = 6;
  repeated ResourceDeploymentServicePort ports = 7;
  repeated ResourceDeploymentHealthCheck health_checks = 8;
  repeated ResourceDeploymentArtifact files = 9;
  optional ResourceDeploymentServiceConfig config = 10;
}

message ResourceProviderPolicy {
  string default_mode = 1;
  map<string, string> target_defaults = 2;
  repeated string allowed_modes = 3;
  bool shared_reuse_requires_consent = 4;
  string external_management = 5;
  repeated string external_access_capabilities = 6;
}

message ResourceDeploymentServiceConfig {
  string path = 1;
  string content = 2;
}

message ResourceDeploymentServicePort {
  string name = 1;
  int32 host = 2;
}

message ResourceDeploymentHealthCheck {
  string type = 1;
  string target = 2;
  repeated int32 expected_status = 3;
  int32 timeout_seconds = 4;
}

message BundleStageDetails {
  string bundle_dir = 1;
  string manifest_path = 2;
  map<string, string> runtime_binaries = 3;
  repeated string copied_artifacts = 4;
  int64 total_size_bytes = 5;
  string total_size_human = 6;
  optional BundleSizeWarning size_warning = 7;
}

message BundleSizeWarning {
  string level = 1;
  string message = 2;
  int64 total_bytes = 3;
  string total_human = 4;
  repeated BundleLargeFile large_files = 5;
}

message BundleLargeFile {
  string path = 1;
  int64 size_bytes = 2;
  string size_human = 3;
}

message DeployStageDetails {
  repeated DeployArtifactResult artifacts = 1;
  optional string update_url = 2;
}

message DeployArtifactResult {
  int64 artifact_id = 1;
  vrooli.scenario_to_desktop.v1.shared.Platform platform = 2;
}

// =============================================================================
// PIPELINE STATUS
// =============================================================================

// PipelineStatus contains the complete state of a pipeline run.
//
message PipelineStatus {
  // Unique pipeline run identifier.
  // @format uuid
  string pipeline_id = 1;

  // Scenario being deployed.
  string scenario_name = 2;

  // Overall pipeline status.
  vrooli.scenario_to_desktop.v1.shared.StageStatus status = 3;

  // Currently executing stage.
  optional vrooli.scenario_to_desktop.v1.shared.StageName current_stage = 4;

  // Progress percentage (0-100).
  // Calculated from completed stages / total stages.
  int32 progress_percent = 5;

  // Human-readable progress message.
  // @example "Running build stage (3/6)"
  optional string progress_message = 6;

  // Fine-grained orchestration state, such as "gate_blocked".
  // This supplements the overall stage status for clients that render approval
  // and execution-state guidance.
  optional string current_state = 17;

  // Per-stage results.
  // Key: Stage name (bundle, preflight, generate, build, smoketest, distribution)
  map<string, StageResult> stages = 7;

  // Ordered list of stages to execute.
  repeated vrooli.scenario_to_desktop.v1.shared.StageName stage_order = 8;

  // Pipeline configuration used.
  PipelineConfig config = 9;

  // When the pipeline started.
  google.protobuf.Timestamp started_at = 10;

  // When the pipeline completed.
  optional google.protobuf.Timestamp completed_at = 11;

  // Error message if pipeline failed.
  optional string error = 12;

  // Final build artifacts.
  // Key: vrooli.scenario_to_desktop.v1.shared.Platform or artifact name, Value: File path
  map<string, string> final_artifacts = 13;

  // Stage the pipeline was stopped after (if intentionally stopped).
  optional vrooli.scenario_to_desktop.v1.shared.StageName stopped_after_stage = 14;

  // Parent pipeline ID if this is a resumed run.
  // @format uuid
  optional string parent_pipeline_id = 15;

  // Idempotency key used for this pipeline.
  optional string idempotency_key = 16;
}

// =============================================================================
// API REQUEST/RESPONSE TYPES
// =============================================================================

// PipelineRunRequest is the request to start a pipeline.
// Alias for PipelineConfig with identical structure.
//
message PipelineRunRequest {
  // Embedded configuration.
  PipelineConfig config = 1;
}

// PipelineRunResponse is returned when a pipeline is started.
//
message PipelineRunResponse {
  // Unique pipeline identifier.
  // @format uuid
  string pipeline_id = 1;

  // Informational message. Read the pipeline with PipelineService.Get.
  optional string message = 2;
}

message PipelineGetRequest {
  string pipeline_id = 1 [(buf.validate.field).string.min_len = 1];
}

message PipelineResumeRequest {
  string pipeline_id = 1 [(buf.validate.field).string.min_len = 1];
  PipelineConfig config = 2;
}

message PipelineCancelRequest {
  string pipeline_id = 1 [(buf.validate.field).string.min_len = 1];
}

message PipelineListRequest {
  optional string scenario_name = 1;
}

// PipelineCancelResponse is returned when a pipeline is cancelled.
//
message PipelineCancelResponse {
  // Resulting status after cancellation.
  string status = 1;

  // Informational message.
  optional string message = 2;
}

// PipelineResumeResponse is returned when a pipeline is resumed.
//
message PipelineResumeResponse {
  // New pipeline identifier for the resumed run.
  // @format uuid
  string pipeline_id = 1;

  // Parent pipeline that was resumed from.
  // @format uuid
  string parent_pipeline_id = 2;

  // Stage the resumed pipeline starts from.
  vrooli.scenario_to_desktop.v1.shared.StageName resume_from_stage = 3;

  // Informational message.
  optional string message = 4;
}

// PipelineListItem is a summary of a pipeline for list views.
//
message PipelineListItem {
  // Pipeline identifier.
  // @format uuid
  string pipeline_id = 1;

  // Scenario name.
  string scenario_name = 2;

  // Pipeline status.
  vrooli.scenario_to_desktop.v1.shared.StageStatus status = 3;

  // Progress percentage.
  int32 progress_percent = 4;

  // Current stage (if running).
  optional vrooli.scenario_to_desktop.v1.shared.StageName current_stage = 5;

  // When the pipeline was created.
  google.protobuf.Timestamp created_at = 6;

  // When the pipeline was last updated.
  optional google.protobuf.Timestamp updated_at = 7;

  // When the pipeline completed.
  optional google.protobuf.Timestamp completed_at = 8;

  // Whether this pipeline can be resumed.
  bool can_resume = 9;
}

// PipelineListResponse contains a list of pipelines.
//
message PipelineListResponse {
  // List of pipeline summaries.
  repeated PipelineListItem pipelines = 1;

  // Total number of pipelines (for pagination).
  optional int32 total = 2;
}

// ScenarioPipelineRequest identifies the scenario whose durable active-pipeline
// slot is being managed.
message ScenarioPipelineRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
}

message GetActivePipelineRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  // Creates a new idle pipeline when no active slot exists.
  bool auto_create = 2;
}

message ActivePipelineResponse {
  optional PipelineStatus pipeline = 1;
  bool created = 2;
}

message CreatePipelineRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  optional PipelineConfig config = 2;
}

message CreatePipelineResponse {
  PipelineStatus pipeline = 1;
  optional string archived_pipeline_id = 2;
}

message ResetPipelineResponse {
  optional string archived_pipeline_id = 1;
  bool cleared = 2;
}

message PipelineHistoryRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  optional int32 limit = 2;
}

message PipelineHistoryResponse {
  repeated PipelineStatus pipelines = 1;
  int32 total = 2;
}

message StartActivePipelineRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  optional PipelineConfig config_overrides = 2;
}

message StartActivePipelineResponse {
  PipelineStatus pipeline = 1;
  // Read the returned pipeline with PipelineService.Get as it progresses.
  optional string message = 2;
}

// BundleCleanRequest removes the generated bundle payload for one scenario.
// It is intentionally Electron-only: framework selection is not a client
// choice in the mature desktop deployment contract.
message BundleCleanRequest {
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];
  optional string location_mode = 2;
  optional string pipeline_id = 3;
}

message BundleCleanResponse {
  string scenario_name = 1;
  string location_mode = 2;
  optional string pipeline_id = 3;
  string path = 4;
  bool removed = 5;
}

// =============================================================================
// GENERATE RESPONSE
// =============================================================================

// GenerateResponse is returned after the generate stage completes.
//
message GenerateResponse {
  // Pipeline identifier.
  // @format uuid
  string pipeline_id = 1;

  // Initial status.
  string status = 2;

  // Scenario that was generated.
  string scenario_name = 3;

  // Path to the generated desktop wrapper.
  // @format path
  optional string desktop_path = 4;

  // Detected scenario metadata.
  optional vrooli.scenario_to_desktop.v1.shared.ScenarioMetadata detected_metadata = 5;

  // Instructions for installing dependencies.
  optional string install_instructions = 6;

  // Command to test the generated application.
  optional string test_command = 7;
}

service PipelineService {
  rpc Run(PipelineRunRequest) returns (PipelineRunResponse);
  rpc Get(PipelineGetRequest) returns (PipelineStatus);
  // GetReleaseGate returns the deployment approval state for a pipeline.
  // It is intentionally separate from Get: callers use it to make an
  // approval decision, rather than to render general pipeline progress.
  rpc GetReleaseGate(PipelineGetRequest) returns (PipelineStatus);
  rpc Resume(PipelineResumeRequest) returns (PipelineResumeResponse);
  rpc Cancel(PipelineCancelRequest) returns (PipelineCancelResponse);
  rpc List(PipelineListRequest) returns (PipelineListResponse);
  rpc GetActive(GetActivePipelineRequest) returns (ActivePipelineResponse);
  rpc CreateActive(CreatePipelineRequest) returns (CreatePipelineResponse);
  rpc ResetActive(ScenarioPipelineRequest) returns (ResetPipelineResponse);
  rpc GetHistory(PipelineHistoryRequest) returns (PipelineHistoryResponse);
  rpc StartActive(StartActivePipelineRequest) returns (StartActivePipelineResponse);
  rpc CleanBundle(BundleCleanRequest) returns (BundleCleanResponse);
}
