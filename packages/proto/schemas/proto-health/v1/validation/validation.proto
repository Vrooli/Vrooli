syntax = "proto3";

package vrooli.proto_health.v1.validation;

import "common/v1/maturity.proto";
import "proto-health/v1/shared/surface.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/proto-health/v1/validation;validation_v1";

// =============================================================================
// VALIDATION DOMAIN - proto contract health
// =============================================================================
//
// @stability stable
//
// Wire contract for the ProtoHealthService Connect-RPC service. Validates one
// scenario's proto contracts and exposes the same scenario-scoped surface facts
// to downstream tools. Cross-scenario graph construction is intentionally out
// of scope for this service.
// =============================================================================

service ProtoHealthService {
  rpc ValidateScenario(ValidateScenarioRequest) returns (ValidateScenarioResponse);
  rpc DescribeScenarioProtos(DescribeScenarioProtosRequest) returns (DescribeScenarioProtosResponse);
  rpc DescribeScenariosProtos(DescribeScenariosProtosRequest) returns (DescribeScenariosProtosResponse);
}

// Severity classifies a Finding for filtering and rendering. ERROR causes
// `passed=false`; WARNING and INFO are advisory.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_ERROR = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_INFO = 3;
}

// Finding is a single validation result tied to a location inside the scenario.
message Finding {
  Severity severity = 1;
  string code = 2;
  string location = 3;
  string message = 4;
  string suggestion = 5;
}

// Summary is a rollup of Finding counts by severity.
message Summary {
  int32 errors = 1;
  int32 warnings = 2;
  int32 infos = 3;
}

// ValidateScenarioRequest names a scenario by its directory slug.
message ValidateScenarioRequest {
  string scenario = 1;
}

// ValidateScenarioResponse reports proto-health findings for the scenario.
message ValidateScenarioResponse {
  string scenario = 1;
  bool passed = 2;
  repeated Finding findings = 3;
  Summary summary = 4;
  // Shared provider-owned maturity assessment. Automation should consume this
  // structural object; humans should use the default CLI rendering.
  common.v1.MaturityAssessment assessment = 5;
}

// DescribeScenarioProtosRequest names a scenario by its directory slug.
message DescribeScenarioProtosRequest {
  string scenario = 1;
}

// DescribeScenarioProtosResponse returns the scenario-scoped proto surface.
message DescribeScenarioProtosResponse {
  vrooli.proto_health.v1.shared.ProtoSurface surface = 1;
}

// DescribeScenariosProtosRequest requests proto surfaces for many scenarios.
// An empty scenario list means all scenarios present in the descriptor image.
message DescribeScenariosProtosRequest {
  repeated string scenarios = 1;
  int32 limit = 2;
  string stability_filter = 3;
}

// ProtoSurfaceResult wraps one scenario's surface or per-scenario error.
message ProtoSurfaceResult {
  string scenario = 1;
  vrooli.proto_health.v1.shared.ProtoSurface surface = 2;
  string error = 3;
}

// DescribeScenariosProtosResponse returns independent per-scenario results.
message DescribeScenariosProtosResponse {
  repeated ProtoSurfaceResult results = 1;
}
