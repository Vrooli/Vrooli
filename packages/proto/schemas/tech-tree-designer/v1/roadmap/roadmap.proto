syntax = "proto3";

package vrooli.tech_tree_designer.v1.roadmap;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/tech-tree-designer/v1/roadmap;roadmap_v1";

// =============================================================================
// ROADMAP DOMAIN
// =============================================================================
//
// @stability beta
//
// Metadata overlay for grouping scenario graph nodes into sectors, tiers, and
// milestones. This is not a competing dependency backbone.
// =============================================================================

service RoadmapService {
  rpc ListSectors(ListSectorsRequest) returns (ListSectorsResponse);
  rpc UpsertSector(UpsertSectorRequest) returns (Sector);
  rpc ListMilestones(ListMilestonesRequest) returns (ListMilestonesResponse);
  rpc UpsertMilestone(UpsertMilestoneRequest) returns (Milestone);
  rpc GetProgress(GetProgressRequest) returns (ProgressRollup);
}

message Sector {
  string slug = 1;
  string name = 2;
  string description = 3;
}

message Milestone {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string required_scenarios = 4;
}

message ProgressRollup {
  repeated ProgressBucket buckets = 1;
}

message ProgressBucket {
  string sector = 1;
  string tier = 2;
  int32 planned = 3;
  int32 live = 4;
  int32 beta = 5;
  int32 stable = 6;
}

message ListSectorsRequest {}

message ListSectorsResponse {
  repeated Sector sectors = 1;
}

message UpsertSectorRequest {
  Sector sector = 1;
}

message ListMilestonesRequest {}

message ListMilestonesResponse {
  repeated Milestone milestones = 1;
}

message UpsertMilestoneRequest {
  Milestone milestone = 1;
}

message GetProgressRequest {
  string sector = 1;
  string tier = 2;
}
