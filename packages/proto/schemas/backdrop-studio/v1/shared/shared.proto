syntax = "proto3";

package vrooli.backdrop_studio.v1.shared;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/backdrop-studio/v1/shared;shared_v1";

message ReservedRegion {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
  string kind = 5;
  string text_color = 6;
}

message ScaffoldBinding {
  string preset = 1;
  string conditioner = 2;
  string params_json = 3;
}

// GenerationBlock is a style's model-backed source declaration.
//
// It deliberately carries no model id, provider URL or credential: image-tools
// owns model selection, and a catalog that named a concrete model would pin
// every install to whatever was available the day the style was written.
//
// Fields 1 and 2 were `role` and `profile`. They were validated on write and
// then never sent, because image-tools' AIParams has no such fields and derives
// the role server-side — so the message advertised routing that did not exist.
// They are reserved rather than reused so an old client cannot silently bind a
// new meaning to a field it still remembers.
message GenerationBlock {
  reserved 1, 2;
  reserved "role", "profile";
  string prompt_template = 3;
  string negative = 4;
  string model = 5;
  string provider_url = 6;
  string credential = 7;
}

message Style {
  string id = 1;
  string name = 2;
  int32 version = 3;
  string role = 4;
  string subject = 5;
  repeated string treatments = 6;
  string lineage = 7;
  repeated string placements = 8;
  string strategy = 9;
  repeated ReservedRegion regions = 10;
  double contrast_threshold = 11;
  ScaffoldBinding scaffold = 12;
  GenerationBlock generation = 13;
}
