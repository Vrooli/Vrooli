syntax = "proto3";
package vrooli.backdrop_studio.v1.scaffold;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/backdrop-studio/v1/scaffold;scaffold_v1";

service ScaffoldService {
  rpc ListPresets(ListPresetsRequest) returns (ListPresetsResponse);
  rpc Render(RenderRequest) returns (RenderResponse);
}

message ListPresetsRequest {}
message Preset {
  string id = 1;
  string name = 2;
  string subject = 3;
  repeated string parameters = 4;
}
message ListPresetsResponse {
  repeated Preset presets = 1;
}
message ReservedRegion {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}
message RenderRequest {
  string preset = 1;
  int32 width = 2;
  int32 height = 3;
  int64 seed = 4;
  string conditioner = 5;
  string params_json = 6;
  repeated ReservedRegion reserved_regions = 7;
}
message RenderResponse {
  bytes image_png = 1;
  string sha256 = 2;
  int32 width = 3;
  int32 height = 4;
  string conditioner = 5;
}
