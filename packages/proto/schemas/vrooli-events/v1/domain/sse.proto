syntax = "proto3";

package vrooli.vrooli_events.v1.domain;

import "google/protobuf/timestamp.proto";
import "vrooli-events/v1/domain/envelope.proto";
import "vrooli-events/v1/domain/policy.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/vrooli-events/v1/domain;domain";

// EventNotification is the SSE transport wrapper; the envelope itself remains
// the sole event contract.
message EventNotification {
  int64 stream_sequence = 1;
  EventEnvelope envelope = 2;
}

// PolicySnapshot atomically replaces the API Core capture allow-list.
message PolicySnapshot {
  string version = 1;
  google.protobuf.Timestamp generated_at = 2;
  repeated ReceiptCapturePolicy receipt_capture_policies = 3;
}

message HeartbeatMessage {
  google.protobuf.Timestamp timestamp = 1;
  int64 dropped_count = 2;
}
