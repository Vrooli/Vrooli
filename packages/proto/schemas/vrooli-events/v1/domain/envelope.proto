syntax = "proto3";

package vrooli.vrooli_events.v1.domain;

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/vrooli-events/v1/domain;domain";

// Canonical, typed audit observation contract. Event-specific facts are packed
// in data; routing, attribution and correlation are never hidden in metadata.
message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  google.protobuf.Timestamp occurred_at = 3;
  EventSource source = 4;
  EventTarget target = 5;
  EventCorrelation correlation = 6;
  EventAttribution attribution = 7;
  google.protobuf.Any data = 8;
  // Producer-declared, normalized links to external work systems. These links
  // are evidence edges; they never imply ownership or authorship by themselves.
  repeated WorkReference work_references = 9;
}

message EventSource {
  string scenario = 1;
  string actor_kind = 2;
}

message EventTarget {
  string scenario = 1;
  string operation = 2;
  string protocol = 3;
}

message EventCorrelation {
  string request_id = 1;
  string agent_run_id = 2;
  string task_id = 3;
  string workflow_execution_id = 4;
  string workflow_node_id = 5;
  uint32 attempt = 6;
}

message EventAttribution {
  string subject_kind = 1;
  string subject_id = 2;
  bool verified = 3;
}

// WorkReference is a producer-neutral relation to a work item. Producers may
// use plan, issue, incident, experiment, task, or future kinds without adding
// scenario-specific fields to the event contract.
message WorkReference {
  string kind = 1;
  string id = 2;
  string revision = 3;
  string relationship = 4;
  string source_event_id = 5;
  string source_run_id = 6;
  bool verified = 7;
  WorkReferenceVisibility visibility = 8;
  string evidence_digest = 9;
  WorkReferenceState state = 10;
  string unavailable_reason = 11;
}

enum WorkReferenceVisibility {
  WORK_REFERENCE_VISIBILITY_UNSPECIFIED = 0;
  WORK_REFERENCE_VISIBILITY_PUBLIC = 1;
  WORK_REFERENCE_VISIBILITY_PRIVATE = 2;
}

enum WorkReferenceState {
  WORK_REFERENCE_STATE_UNSPECIFIED = 0;
  WORK_REFERENCE_STATE_ACTIVE = 1;
  WORK_REFERENCE_STATE_EXPIRED = 2;
  WORK_REFERENCE_STATE_UNAVAILABLE = 3;
  WORK_REFERENCE_STATE_PROJECTION_MISMATCH = 4;
}

message ReceiptData {
  string outcome = 1;
  uint32 status_code = 2;
  uint64 duration_ms = 3;
  string policy_version = 4;
  string idempotency_key = 5;
  google.protobuf.Struct projection = 6;
}
