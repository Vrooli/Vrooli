syntax = "proto3";

package vrooli.vrooli_events.v1.domain;

import "vrooli-events/v1/domain/envelope.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/vrooli-events/v1/domain;domain";

// ReceiptCapturePolicy is the sole registry for automatic capture. A missing
// matching policy means no receipt; projection paths are explicit descriptor
// paths and are never inferred from a response body.
message ReceiptCapturePolicy {
  string policy_id = 1;
  bool enabled = 2;
  ReceiptOperationSelector selector = 3;
  string response_type = 4;
  repeated string response_projection_paths = 5;
  uint32 retention_days = 6;
  ReceiptAccessPolicy access = 7;
  string version = 8;
}

message ReceiptOperationSelector {
  string target_scenario = 1;
  string operation = 2;
  string protocol = 3;
  string event_type = 4;
}

message ReceiptAccessPolicy {
  repeated string read_principals = 1;
}

message ReceiptQueryFilter {
  string event_type = 1;
  string target_scenario = 2;
  string operation = 3;
  string agent_run_id = 4;
  string task_id = 5;
  string workflow_execution_id = 6;
  string workflow_node_id = 7;
  uint32 attempt = 8;
  bool verified_only = 9;
  string page_token = 10;
  uint32 page_size = 11;
}

message ReceiptQueryResult {
  repeated EventEnvelope events = 1;
  string next_page_token = 2;
}
