syntax = "proto3";

package vrooli.flow_verifier.v1.flows;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/flow-verifier/v1/flows;flows_v1";

// =============================================================================
// FLOWS DOMAIN — flow.json projection + lifecycle
// =============================================================================
//
// @layer 5  (api surface)
// @domain flows
// @imports none
// @stability stable
//
// Wire contract for the flow.json projection that the UI's flow-detail
// page renders. Mirrors api/internal/flows/contract.Contract field-for-
// field at the wire boundary so a Go-side rename in contract.go ripples
// to a UI compile error.
//
// Lifecycle methods (CreateFlow / ValidateFlow / ExplainFlow) replace
// the prior in-process CLI invocations so the CLI is a thin client.
// =============================================================================

service FlowsService {
  rpc ListFlows(ListFlowsRequest) returns (ListFlowsResponse);
  rpc GetFlow(GetFlowRequest) returns (GetFlowResponse);
  rpc CreateFlow(CreateFlowRequest) returns (CreateFlowResponse);
  rpc ValidateFlow(ValidateFlowRequest) returns (ValidateFlowResponse);
  rpc ExplainFlow(ExplainFlowRequest) returns (ExplainFlowResponse);
  rpc CodegenFlow(CodegenFlowRequest) returns (CodegenFlowResponse);
  rpc ReconcileFlow(ReconcileFlowRequest) returns (ReconcileFlowResponse);
  rpc GetNavigationStudio(GetNavigationStudioRequest) returns (GetNavigationStudioResponse);
}

// FlowSummary is the thin row returned by ListFlows: enough for the
// inventory grid and bulk-action selection without forcing the full
// contract projection across the wire.
message FlowSummary {
  string flow_id = 1;
  string contract_path = 2;
  // Runtime language ("go" or "typescript") for temporal flows; empty
  // for kinds that have no language concept (navigation, etc.).
  string language = 3;
  int32 schema_version = 4;
  // Stamped in when aggregating across scenarios; empty for single-
  // scenario listings.
  string scenario_id = 5;
  // Wire-stable identifier of the kind that owns this flow, e.g.
  // "temporal" or "navigation". UI uses it to pick a renderer.
  string kind = 6;
}

// FlowState mirrors contract.State.
message FlowState {
  string id = 1;
  string quint = 2;
  bool initial = 3;
  bool terminal = 4;
}

// FlowEvent mirrors contract.Event.
message FlowEvent {
  string id = 1;
  string quint = 2;
}

// FlowTransition mirrors contract.Transition. `want_error_set` carries
// the tri-state semantics of contract.Transition.WantError (a *bool):
// the field is treated as "unset" when want_error_set is false.
message FlowTransition {
  repeated string from = 1;
  repeated string event = 2;
  string to = 3;
  bool want_error = 4;
  bool want_error_set = 5;
}

message FlowInvariant {
  string id = 1;
  string quint = 2;
  string description = 3;
  string expression = 4;
}

message FlowTraceStep {
  string event = 1;
  string want = 2;
  bool want_error = 3;
}

message FlowTrace {
  string name = 1;
  string initial = 2;
  repeated FlowTraceStep steps = 3;
}

message FlowVerify { repeated string invariants = 1; }

message FlowModel {
  string module = 1;
  string seed = 2;
  int32 max_steps = 3;
  int32 trace_count = 4;
  FlowVerify verify = 5;
}

message GoRuntime {
  string package = 1;
  string status_type = 2;
  string event_type = 3;
  string constant_prefix = 4;
}

message TypeScriptRuntime {
  string status_type = 1;
  string event_type = 2;
  string statuses_const = 3;
  string events_const = 4;
  string formal_expectation_const = 5;
  string state_union_type = 6;
  string event_union_type = 7;
  map<string, string> payload_types = 8;
  // Each entry maps a state id to a map of variant field → variant type.
  // Modelled as message-typed map values via a wrapper so proto stays
  // legal (proto3 maps cannot have message values directly when the
  // value is itself a map).
  map<string, VariantFields> state_variants = 9;
  map<string, VariantFields> event_variants = 10;
}

// VariantFields is the wrapper around an inner map<string,string> so it
// can be used as the value type of an outer map. Mirrors the JSON shape
// {"<field>": "<type>"}.
message VariantFields { map<string, string> fields = 1; }

message FlowRuntime {
  GoRuntime go = 1;
  TypeScriptRuntime typescript = 2;
  repeated string side_effects = 3;
  string stale_completion = 4;
}

// FlowDetail is the structured projection of a single flow consumed by
// the UI's flow-detail page. Mirrors contract.Contract + the legacy
// flows.FlowDetail wrapper.
message FlowDetail {
  string flow_id = 1;
  string domain = 2;
  string description = 3;
  string contract_path = 4;
  string language = 5;
  int32 schema_version = 6;
  // Wire-stable kind identifier (e.g. "temporal").
  string kind = 16;
  string initial_state = 7;
  repeated FlowState states = 8;
  repeated FlowEvent events = 9;
  repeated FlowTransition transitions = 10;
  repeated FlowTrace traces = 11;
  repeated FlowInvariant invariants = 12;
  FlowModel model = 13;
  FlowRuntime runtime = 14;
  // Human-readable explain report for the CLI's `flows explain` and
  // the UI's Overview tab.
  string report = 15;
}

message ListFlowsRequest {
  // Optional Vrooli root override; falls back to server default.
  string root = 1;
  // Optional flow id filter; an unknown id is an error.
  string flow_id = 2;
  // Optional kind filter; empty means "every kind".
  string kind = 3;
}
message ListFlowsResponse { repeated FlowSummary flows = 1; }

message GetFlowRequest {
  string flow_id = 1;
  string root = 2;
}
message GetFlowResponse { FlowDetail flow = 1; }

message CreateFlowRequest {
  // Path of the directory the new flow's directory will be created
  // under, relative to root. Empty means "the root itself".
  string parent_dir = 1;
  string flow_id = 2;
  // "go" or "typescript". Required for temporal; ignored by kinds that
  // have no language concept.
  string language = 3;
  string root = 4;
  // Which kind to scaffold. Empty defaults to "temporal".
  string kind = 5;
}
message CreateFlowResponse {
  // Path of the created flow directory, relative to root.
  string flow_dir = 1;
}

message ValidateFlowRequest {
  // Optional flow id filter; empty validates every flow under root.
  string flow_id = 1;
  string root = 2;
}
message ValidateFlowResponse { repeated FlowSummary flows = 1; }

message ExplainFlowRequest {
  string flow_id = 1;
  string root = 2;
}
message ExplainFlowResponse { string report = 1; }

// CodegenFlow emits kind-specific source artifacts (e.g. navigation's
// routes.generated.ts) derived from the spec. The response carries the
// generated files keyed by their repo-relative destination path so the
// CLI/UI can either write-through or display them.
message CodegenFlowRequest {
  string flow_id = 1;
  string root = 2;
  // Target language. Empty defaults to the kind's preferred language
  // (TypeScript for navigation).
  string language = 3;
  // When true, write generated files to disk under root; otherwise the
  // response is informational and disk is untouched.
  bool write = 4;
}

message CodegenArtifact {
  // Repo-relative destination path the file should be written to.
  string path = 1;
  // File contents.
  bytes content = 2;
}

message CodegenFlowResponse {
  repeated CodegenArtifact artifacts = 1;
  // Paths actually written to disk; empty when write=false.
  repeated string written = 2;
}

// ReconcileFlow walks a scenario's source tree and asserts the source
// and the spec agree: every route declared in code is in the spec,
// every <Link to=>/useNavigate target resolves to a registered route,
// and no spec route is orphaned (declared but never referenced).
message ReconcileFlowRequest {
  string flow_id = 1;
  string root = 2;
  // Scenario root (the directory holding ui/, api/, etc.). The
  // reconciler walks scenario_root/ui/src/**/*.{ts,tsx,js,jsx}.
  string scenario_root = 3;
}

message ReconcileFinding {
  // Stable identifier for the discrepancy (e.g. "missing_route:/foo").
  string id = 1;
  string severity = 2; // "error" | "warning" | "info"
  string message = 3;
  // Source file the finding originated in; empty for spec-side findings.
  string source_file = 4;
  int32 source_line = 5;
}

message ReconcileFlowResponse {
  bool passed = 1;
  repeated ReconcileFinding findings = 2;
  int32 files_scanned = 3;
}

// =============================================================================
// Flow Studio rendering — navigation kind
// =============================================================================
//
// GetNavigationStudio returns a kind-specific descriptor of a navigation
// flow's graph for Flow Studio to render: nodes (routes), edges
// (affordances), context toggles (viewport, auth, ...) and the
// pass/fail status of every declared reachability invariant. Temporal
// flows render via the existing GetFlow projection; this RPC is the
// navigation-kind equivalent.
// =============================================================================

message NavigationStudioRoute {
  string id = 1;
  string path = 2;
  string page = 3;
  // Predicate string in the navigation DSL (AND/OR/NOT/=/!=/IN/CONTAINS).
  // Empty means unconditional. UI evaluates against the active context to
  // decide whether the route is currently reachable.
  string requires = 4;
  repeated string parents = 5;
}

message NavigationStudioPresentation {
  // Container or route id where the affordance is rendered.
  string in = 1;
  string label = 2;
  string test_id = 3;
}

message NavigationStudioAffordance {
  string id = 1;
  // Target route id (resolves to a NavigationStudioRoute.id).
  string to = 2;
  string show_when = 3;
  string side_effect = 4;
  repeated NavigationStudioPresentation presentations = 5;
}

message NavigationStudioContainer {
  string id = 1;
  string kind = 2;
  // Whether the container is currently visible: empty means
  // "always_visible"; otherwise the predicate the UI evaluates against
  // the active context.
  string show_when = 3;
  string disclosure = 4;
  repeated string host_routes = 5;
}

message NavigationStudioContext {
  string name = 1;
  string kind = 2; // "enum" | "bool"
  // Populated for enum contexts; empty for bool.
  repeated string values = 3;
  // JSON-encoded default value (string for enum, "true"/"false" for bool).
  string default_value = 4;
}

message NavigationStudioInvariant {
  string id = 1;
  bool passed = 2;
  string message = 3;
}

message NavigationStudioDescriptor {
  // Renderer plugin name (matches kind.StudioDescriptor.Renderer).
  string renderer = 1;
  repeated NavigationStudioRoute routes = 2;
  repeated NavigationStudioAffordance affordances = 3;
  repeated NavigationStudioContainer containers = 4;
  repeated NavigationStudioContext contexts = 5;
  repeated NavigationStudioInvariant invariants = 6;
}

message GetNavigationStudioRequest {
  string flow_id = 1;
  string root = 2;
}

message GetNavigationStudioResponse {
  NavigationStudioDescriptor descriptor = 1;
}
