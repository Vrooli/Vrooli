syntax = "proto3";

package vrooli.program_runtime.v1.programs;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/program-runtime/v1/programs;programs_v1";

enum Provenance {
  PROVENANCE_UNSPECIFIED = 0;
  PROVENANCE_AGENT = 1;
  PROVENANCE_OPERATOR = 2;
  PROVENANCE_TEST = 3;
  PROVENANCE_REPLAY = 4;
}

enum ProgramStatus {
  PROGRAM_STATUS_UNSPECIFIED = 0;
  PROGRAM_STATUS_ACCEPTED = 1;
  PROGRAM_STATUS_RUNNING = 2;
  PROGRAM_STATUS_SUCCEEDED = 3;
  PROGRAM_STATUS_FAILED = 4;
  PROGRAM_STATUS_CANCELLED = 5;
}

enum FailureCause {
  FAILURE_CAUSE_UNSPECIFIED = 0;
  FAILURE_CAUSE_UNRESOLVED_NAME = 1;
  FAILURE_CAUSE_UNKNOWN_FIELD = 2;
  FAILURE_CAUSE_AMBIGUOUS_RESPONSE = 3;
  FAILURE_CAUSE_UNREACHABLE_SCENARIO = 4;
  FAILURE_CAUSE_REFUSED_NO_GRANT = 5;
  FAILURE_CAUSE_REFUSED_NOT_RUN_ELIGIBLE = 6;
  FAILURE_CAUSE_INFERENCE_SPEND_EXCEEDED = 7;
  FAILURE_CAUSE_DELEGATED_RUN_SPEND_EXCEEDED = 8;
  FAILURE_CAUSE_DEADLINE_EXCEEDED = 9;
  FAILURE_CAUSE_KERNEL_SYNTAX = 10;
  FAILURE_CAUSE_KERNEL_RUNTIME = 11;
  FAILURE_CAUSE_BRIDGE_TRANSPORT = 12;
  FAILURE_CAUSE_UNCLASSIFIED = 13;
}

message Program {
  string id = 1;
  string session_id = 2;
  string source = 3;
  Provenance provenance = 4;
  ProgramStatus status = 5;
  string stdout = 6;
  string failure_detail = 7;
  string failure_shape = 8;
  int64 context_bytes = 9;
  string created_at = 10;
  int64 output_limit_bytes = 11;
  int64 agent_bytes = 12;
  string completed_at = 13;
  int64 wall_time_millis = 14;
  int64 cpu_time_millis = 15;
  string library_version = 16;
  FailureCause failure_cause = 17;
}

message Diagnostic {
  string severity = 1;
  int32 line = 2;
  string name = 3;
  string message = 4;
  string nearest_match = 5;
}

message SubmitProgramRequest {
  string session_id = 1;
  string source = 2;
  Provenance provenance = 3;
  bool include_materialized = 4;
  bool async = 5;
  bool explain = 6;
}
message SubmitProgramResponse {
  Program program = 1;
  repeated Diagnostic diagnostics = 2;
}
message GetProgramRequest {
  string id = 1;
}
message GetProgramResponse {
  Program program = 1;
}
message ListProgramsRequest {
  string session_id = 1;
  bool include_operator = 2;
}
message ListProgramsResponse {
  repeated Program programs = 1;
}
message MineFailuresRequest {
  bool include_operator = 1;
}
message FailureShape {
  string shape = 1;
  int64 count = 2;
  string first_seen = 3;
  string last_seen = 4;
  string sample_program_id = 5;
}
message MineFailuresResponse {
  repeated FailureShape shapes = 1;
  int64 count = 2;
}
message MineRefusalsRequest {
  bool include_operator = 1;
}
message RefusalShape {
  string binding_id = 1;
  string reason = 2;
  int64 count = 3;
  string last_seen = 4;
}
message MineRefusalsResponse {
  repeated RefusalShape shapes = 1;
  int64 count = 2;
}
message MineUnresolvedBindingsRequest {}
message UnresolvedBindingShape {
  string attempted_name = 1;
  int64 count = 2;
  string last_seen = 3;
}
message MineUnresolvedBindingsResponse {
  repeated UnresolvedBindingShape shapes = 1;
  int64 count = 2;
}

message RunAuthoringEvalRequest {
  string suite = 1;
  int32 max_cases = 2;
}

message AuthoringCaseResult {
  string case_id = 1;
  bool authored = 2;
  bool first_attempt_ok = 3;
  string cause = 4;
  int64 agent_bytes = 5;
  string model = 6;
}

message RunAuthoringEvalResponse {
  string suite = 1;
  string status = 2;
  string reason = 3;
  int32 cases = 4;
  int32 met = 5;
  int32 missed = 6;
  int32 wrong_result = 7;
  int32 unavailable = 8;
  int32 floor = 9;
  repeated AuthoringCaseResult results = 10;
}

service ProgramService {
  rpc SubmitProgram(SubmitProgramRequest) returns (SubmitProgramResponse);
  rpc GetProgram(GetProgramRequest) returns (GetProgramResponse);
  rpc ListPrograms(ListProgramsRequest) returns (ListProgramsResponse);
  rpc MineFailures(MineFailuresRequest) returns (MineFailuresResponse);
  rpc MineRefusals(MineRefusalsRequest) returns (MineRefusalsResponse);
  rpc MineUnresolvedBindings(MineUnresolvedBindingsRequest) returns (MineUnresolvedBindingsResponse);
  rpc RunAuthoringEval(RunAuthoringEvalRequest) returns (RunAuthoringEvalResponse);
}
