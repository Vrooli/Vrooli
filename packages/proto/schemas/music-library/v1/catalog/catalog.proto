syntax = "proto3";
package vrooli.music_library.v1.catalog;
option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/music-library/v1/catalog;catalog_v1";

service CatalogService {
  rpc PutTrack(PutTrackRequest) returns (PutTrackResponse);
  rpc ListTracks(ListTracksRequest) returns (ListTracksResponse);
  rpc RecordUse(RecordUseRequest) returns (RecordUseResponse);
  rpc ReserveTrack(ReserveTrackRequest) returns (ReserveTrackResponse);
  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
  rpc CommitReservation(CommitReservationRequest) returns (CommitReservationResponse);
  rpc RollbackReservation(RollbackReservationRequest) returns (RollbackReservationResponse);
}
message Track {
  string sha256 = 1;
  string title = 2;
  string source_path = 3;
  string take_id = 4;
  string receipt_path = 5;
  repeated string tags = 6;
  string approval = 7;
  string feedback = 8;
  repeated TrackUse uses = 9;
  repeated string purposes = 10;
  string bank_state = 11;
  int32 bank_priority = 12;
}
message TrackUse {
  string project = 1;
  string revision = 2;
  string status = 3;
  string purpose = 4;
}
message PutTrackRequest { Track track = 1; }
message PutTrackResponse { Track track = 1; }
message ListTracksRequest { string tag = 1; bool unused_only = 2; string project = 3; string purpose = 4; }
message ListTracksResponse { repeated Track tracks = 1; }
message RecordUseRequest { string sha256 = 1; TrackUse use = 2; }
message RecordUseResponse { Track track = 1; }
message ReserveTrackRequest {
  string purpose = 1;
  string project = 2;
  string revision = 3;
  string consumer = 4;
  int32 lease_seconds = 5;
  string sha256 = 6;
}
message ReserveTrackResponse {
  Track track = 1;
  string reservation_id = 2;
  string expires_at = 3;
}
message ReleaseReservationRequest { string reservation_id = 1; string consumer = 2; }
message ReleaseReservationResponse { Track track = 1; }
message CommitReservationRequest { string reservation_id = 1; string consumer = 2; string status = 3; }
message CommitReservationResponse { Track track = 1; TrackUse use = 2; }
message RollbackReservationRequest { string reservation_id = 1; string consumer = 2; }
message RollbackReservationResponse { Track track = 1; }
