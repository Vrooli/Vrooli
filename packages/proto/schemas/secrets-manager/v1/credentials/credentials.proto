syntax = "proto3";

package vrooli.secrets_manager.v1.credentials;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/secrets-manager/v1/credentials;credentials_v1";

// CredentialBrokerService is the typed agent/runtime surface. It exposes
// metadata and bounded broker results; it never exposes a vault item or
// credential value through its request/response messages.
service CredentialBrokerService {
  // Creates a durable request for a grant-approved operation.
  rpc RequestAccess(RequestAccessRequest) returns (AccessRequest);
  // Reads the durable status of a request without exposing credential data.
  rpc GetAccessRequest(GetAccessRequestRequest) returns (AccessRequest);
  // Waits for a durable decision or bounded timeout.
  rpc WaitAccessRequest(WaitAccessRequestRequest) returns (WaitAccessRequestResponse);
  // Mints a bounded broker capability for an already-approved use grant.
  rpc CreateBrokerSession(CreateBrokerSessionRequest) returns (BrokerSession);
  // Executes one bounded operation against the session's pinned origin.
  rpc ExecuteBrokerOperation(ExecuteBrokerOperationRequest) returns (BrokerOperationResult);
  // Revokes a session created by the current verified principal.
  rpc RevokeBrokerSession(RevokeBrokerSessionRequest) returns (RevokeBrokerSessionResponse);
}

message RequestAccessRequest {
  string grant_id = 1;
  string item_id = 2;
  string operation = 3;
  int32 duration_seconds = 4;
}

message AccessRequest {
  string id = 1;
  string workspace_id = 2;
  string grant_id = 3;
  string item_id = 4;
  string operation = 5;
  string request_digest = 6;
  string status = 7;
  string requested_by = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetAccessRequestRequest {
  string request_id = 1;
}

message WaitAccessRequestRequest {
  string request_id = 1;
  int32 timeout_seconds = 2;
}

message WaitAccessRequestResponse {
  AccessRequest request = 1;
  bool timed_out = 2;
}

message CreateBrokerSessionRequest {
  string grant_id = 1;
  string item_id = 2;
  string target_origin = 3;
  bool allow_internal = 4;
  int32 duration_seconds = 5;
  bool one_use = 6;
}

message BrokerSession {
  string session_id = 1;
  string session_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  string target_origin = 4;
  string secret_exposure = 5;
}

message ExecuteBrokerOperationRequest {
  string session_id = 1;
  string session_token = 2;
  string method = 3;
  string path = 4;
  map<string, string> headers = 5;
  string body = 6;
}

message BrokerOperationResult {
  int32 status = 1;
  map<string, string> headers = 2;
  string body = 3;
  bool body_truncated = 4;
  string projection = 5;
}

message RevokeBrokerSessionRequest {
  string session_id = 1;
}

message RevokeBrokerSessionResponse {
  string session_id = 1;
  string status = 2;
}
