syntax = "proto3";

package vrooli.data_backup_manager.v1.runs;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/data-backup-manager/v1/runs;runs_v1";

// =============================================================================
// RUNS DOMAIN — plan executions, run history, last-success-per-target
// =============================================================================
//
// @layer 5  (api surface)
// @domain runs
// @stability stable
//
// Wire contract for RunsService. A run is one execution of a plan: for each
// member target × destination it captures the source, checks the destination
// cap, writes a kopia snapshot, applies retention, and records a per-target
// outcome. A single target's failure does not abort the others — the run is
// partial_failed. Runs surface last-success-per-target for the catalog and
// health views (OT-P0-005/009/010).
//
// Run/target lifecycle states are modeled at Level 2 in
// api/internal/runs/flow/ per docs/concepts/FLOWS.md.
// =============================================================================

service RunsService {
  rpc TriggerRun(TriggerRunRequest) returns (TriggerRunResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc ListTargetStatus(ListTargetStatusRequest) returns (ListTargetStatusResponse);
  rpc BrowseSnapshot(BrowseSnapshotRequest) returns (BrowseSnapshotResponse);
}

// RunStatus is the lifecycle state of a run.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_PENDING = 1;
  RUN_STATUS_CAPTURING = 2;
  RUN_STATUS_SNAPSHOTTING = 3;
  RUN_STATUS_COMPLETED = 4;
  RUN_STATUS_PARTIAL_FAILED = 5;
  RUN_STATUS_FAILED = 6;
}

// TriggerSource records who started a run.
enum TriggerSource {
  TRIGGER_SOURCE_UNSPECIFIED = 0;
  TRIGGER_SOURCE_SCHEDULER = 1;
  TRIGGER_SOURCE_MANUAL = 2;
}

// TargetOutcome is the per (target × destination) result within a run.
enum TargetOutcomeStatus {
  TARGET_OUTCOME_STATUS_UNSPECIFIED = 0;
  TARGET_OUTCOME_STATUS_SUCCEEDED = 1;
  TARGET_OUTCOME_STATUS_FAILED = 2;
  // Blocked by the destination storage cap (alert+block); no bytes written.
  TARGET_OUTCOME_STATUS_BLOCKED = 3;
}

message TargetOutcome {
  string target_id = 1;
  string destination_id = 2;
  TargetOutcomeStatus status = 3;
  // kopia snapshot reference produced on success; empty otherwise.
  string snapshot_id = 4;
  int64 bytes = 5;
  // Human-readable failure/block reason; empty on success.
  string error = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
}

// Run is the canonical wire shape for one plan execution.
message Run {
  string id = 1;
  string plan_id = 2;
  TriggerSource trigger = 3;
  RunStatus status = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  repeated TargetOutcome outcomes = 7;
}

// TargetStatus is the last-success / last-run rollup for one target, derived
// from run history (powers the catalog and the health overdue check).
message TargetStatus {
  string target_id = 1;
  google.protobuf.Timestamp last_success_at = 2;
  RunStatus last_run_status = 3;
  google.protobuf.Timestamp last_run_at = 4;
}

message TriggerRunRequest {
  string plan_id = 1 [(buf.validate.field).string.min_len = 1];
}

message TriggerRunResponse {
  Run run = 1;
}

message GetRunRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetRunResponse {
  Run run = 1;
}

message ListRunsRequest {
  // Optional plan filter.
  string plan_id = 1;
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];
  string page_token = 3;
}

message ListRunsResponse {
  repeated Run runs = 1;
  string next_page_token = 2;
}

message ListTargetStatusRequest {
  string owner = 1;
}

message ListTargetStatusResponse {
  repeated TargetStatus statuses = 1;
}

// SnapshotEntry is one path within a snapshot's content listing.
message SnapshotEntry {
  string path = 1;
  int64 size_bytes = 2;
  bool is_dir = 3;
}

message BrowseSnapshotRequest {
  string destination_id = 1 [(buf.validate.field).string.min_len = 1];
  string snapshot_id = 2 [(buf.validate.field).string.min_len = 1];
  // Optional path prefix within the snapshot.
  string path = 3;
}

message BrowseSnapshotResponse {
  repeated SnapshotEntry entries = 1;
}
