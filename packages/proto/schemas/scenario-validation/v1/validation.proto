syntax = "proto3";

package vrooli.scenario_validation.v1;

import "common/v1/maturity.proto";
import "common/v1/metrics.proto";
import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/scenario-validation/v1;scenariovalidationv1";

// =============================================================================
// SCENARIO VALIDATION SERVICE
// =============================================================================
//
// @layer 0
// @domain scenario-validation
// @stability beta
//
// ScenarioValidationService is the shared Connect-RPC contract implemented by
// health-style provider scenarios and consumed by test-genie. Test Genie reads
// only status and the common maturity assessment; provider-specific rich detail
// remains opaque in native_detail for the provider's own UI/CLI.
// =============================================================================

service ScenarioValidationService {
  rpc ValidateScenario(ValidateScenarioRequest) returns (ValidateScenarioResponse);

  // PreviewFix reports the deterministic remediations the provider could apply
  // for the requested scenario without writing anything (dry-run). Providers
  // that ship no fixers leave this unimplemented; consumers treat an
  // Unimplemented response as "no deterministic fixer" and skip the provider.
  rpc PreviewFix(FixRequest) returns (FixResponse);

  // ApplyFix applies the provider's deterministic remediations and reports what
  // changed. Apply is never implicit: callers reach this RPC only when the user
  // explicitly opts into writing (e.g. `--apply`).
  rpc ApplyFix(FixRequest) returns (FixResponse);
}

// DurableValidationRunService is an opt-in provider contract for validation
// whose execution may outlive an HTTP request. It deliberately sits beside
// ScenarioValidationService: ValidateScenario remains the fast, terminal
// static-validation contract implemented by existing providers.
service DurableValidationRunService {
  rpc StartValidationRun(StartValidationRunRequest) returns (StartValidationRunResponse);
  rpc GetValidationRun(GetValidationRunRequest) returns (GetValidationRunResponse);
  rpc WaitValidationRun(WaitValidationRunRequest) returns (WaitValidationRunResponse);
  rpc AbortValidationRun(AbortValidationRunRequest) returns (AbortValidationRunResponse);
}

message ValidateScenarioRequest {
  // Scenario slug, normally the directory name under scenarios/.
  string scenario = 1;
  // Optional explicit scenario path for callers that already resolved it.
  string path = 2;
  // Execution-mode switch for providers that can both inspect and measure.
  // false => readiness/inspection only (no process spawned, no build run);
  // true => the provider runs its deterministic measurements (e.g. unit-health
  // executes the suite; performance-health benchmarks the build + bundle and
  // runs Lighthouse-if-UI, persisting a sample), then gates on the result.
  // Providers that only inspect ignore this flag.
  bool include_execution = 3;
}

enum ValidationStatus {
  VALIDATION_STATUS_UNSPECIFIED = 0;
  VALIDATION_STATUS_PASSED = 1;
  VALIDATION_STATUS_FAILED = 2;
  VALIDATION_STATUS_DEGRADED = 3;
  VALIDATION_STATUS_ERROR = 4;
  VALIDATION_STATUS_SKIPPED = 5;
}

message ValidateScenarioResponse {
  string scenario = 1;
  // Canonical provider verdict for Test Genie's gate.
  ValidationStatus status = 2;
  // Mandatory shared assessment. Findings live here.
  common.v1.MaturityAssessment assessment = 3;
  // Optional provider-native response packed for provider-owned surfaces.
  google.protobuf.Any native_detail = 4;
  // Optional execution metrics (timing, stages, resources, host environment)
  // for this validation. Absent for providers that have not adopted metrics.
  common.v1.ExecutionMetrics metrics = 5;
}

// ValidationRunState is provider-neutral lifecycle state. A provider persists
// these states in its own ledger; no central run database is implied.
enum ValidationRunState {
  VALIDATION_RUN_STATE_UNSPECIFIED = 0;
  VALIDATION_RUN_STATE_QUEUED = 1;
  VALIDATION_RUN_STATE_RUNNING = 2;
  VALIDATION_RUN_STATE_SUCCEEDED = 3;
  VALIDATION_RUN_STATE_FAILED = 4;
  VALIDATION_RUN_STATE_CANCELED = 5;
  VALIDATION_RUN_STATE_RECOVERY_FAILED = 6;
}

// ValidationRunErrorCode classifies lifecycle failures so callers can select a
// recovery path without parsing text. Invalid transitions are never encoded as
// a terminal validation status.
enum ValidationRunErrorCode {
  VALIDATION_RUN_ERROR_CODE_UNSPECIFIED = 0;
  VALIDATION_RUN_ERROR_CODE_INVALID_TRANSITION = 1;
  VALIDATION_RUN_ERROR_CODE_NOT_FOUND = 2;
  VALIDATION_RUN_ERROR_CODE_IDEMPOTENCY_CONFLICT = 3;
  VALIDATION_RUN_ERROR_CODE_ABORT_REJECTED = 4;
  VALIDATION_RUN_ERROR_CODE_EXECUTION_FAILED = 5;
  VALIDATION_RUN_ERROR_CODE_RECOVERY_FAILED = 6;
  VALIDATION_RUN_ERROR_CODE_WAIT_TIMEOUT = 7;
}

message ValidationRunError {
  ValidationRunErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
}

// ValidationRun is the durable, reattachable provider-owned record. Terminal
// results use the existing shared response so direct and delegated consumers
// receive identical provider-owned findings, presentation, and metrics.
message ValidationRun {
  string run_id = 1;
  string scenario = 2;
  string path = 3;
  string idempotency_key = 4;
  string parent_run_id = 5;
  ValidationRunState state = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  google.protobuf.Duration estimated_remaining = 10;
  ValidateScenarioResponse preliminary_static_result = 11;
  ValidateScenarioResponse terminal_result = 12;
  ValidationRunError error = 13;
  repeated google.protobuf.Any artifact_references = 14;
  bool cancellation_requested = 15;
}

message StartValidationRunRequest {
  string scenario = 1;
  string path = 2;
  // The same key and target must return the same provider-owned run. Reusing a
  // key with a different target is an idempotency conflict.
  string idempotency_key = 3;
  // Optional Test Genie parent/attempt identity. Providers retain this only as
  // a durable linkage reference; it is not their source of truth.
  string parent_run_id = 4;
}

message StartValidationRunResponse { ValidationRun run = 1; }

message GetValidationRunRequest { string run_id = 1; }
message GetValidationRunResponse { ValidationRun run = 1; }

message WaitValidationRunRequest {
  string run_id = 1;
  // Zero leaves the caller's timeout policy in control. A wait timeout never
  // cancels provider work; callers may reattach with Get or Wait.
  google.protobuf.Duration timeout = 2;
}
message WaitValidationRunResponse { ValidationRun run = 1; }

message AbortValidationRunRequest {
  string run_id = 1;
  string reason = 2;
}
message AbortValidationRunResponse { ValidationRun run = 1; }

// FixRequest selects the deterministic remediations to preview or apply for a
// scenario. It mirrors ValidateScenarioRequest's target-resolution fields so a
// consumer that just validated a scenario can fix it without re-resolving.
message FixRequest {
  // Scenario slug, normally the directory name under scenarios/.
  string scenario = 1;
  // Optional explicit scenario path for callers that already resolved it.
  string path = 2;
  // Optional rule/finding codes to restrict the fix; empty means every rule the
  // provider can deterministically remediate.
  repeated string rule_ids = 3;
}

// FixCandidate is a single proposed (dry-run) or applied file edit. It mirrors
// the shared maturity-go autofix.Candidate shape so providers built on that
// registry map straight through.
message FixCandidate {
  // Rule/finding code that produced this edit.
  string rule_id = 1;
  // Absolute or scenario-relative path of the file the edit targets.
  string file_path = 2;
  // Human-readable description of the change.
  string description = 3;
  // File contents before the edit (may be empty when creating a new file).
  string before = 4;
  // File contents after the edit.
  string after = 5;
  // True when this edit was written to disk (ApplyFix), false for previews.
  bool applied = 6;
}

// FixResponse reports the candidates a provider previewed or applied.
message FixResponse {
  // Scenario the fix targeted.
  string scenario = 1;
  // True when candidates were written to disk (ApplyFix), false for previews.
  bool applied = 2;
  // The proposed or applied edits, ordered deterministically by file then rule.
  repeated FixCandidate candidates = 3;
  // Optional human-readable notes (e.g. "no auto-fixable findings available").
  repeated string messages = 4;
}
