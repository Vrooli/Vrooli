syntax = "proto3";

package vrooli.content_desk.v1.artifacts;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/content-desk/v1/artifacts;artifacts_v1";

// ArtifactsService owns drafts and their constrained lifecycle.
service ArtifactsService {
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);
  rpc CreateDraft(CreateDraftRequest) returns (CreateDraftResponse);
  rpc UpdateDraftBody(UpdateDraftBodyRequest) returns (UpdateDraftBodyResponse);
  rpc SubmitReleaseDraft(SubmitReleaseDraftRequest) returns (SubmitReleaseDraftResponse);
  rpc RecordReleaseOutcome(RecordReleaseOutcomeRequest) returns (RecordReleaseOutcomeResponse);
  rpc TransitionDraft(TransitionDraftRequest) returns (TransitionDraftResponse);
  rpc ApproveDraft(ApproveDraftRequest) returns (ApproveDraftResponse);
}

message Draft {
  string id = 1;
  string campaign_id = 2;
  string status = 3;
  string post_type_id = 4;
  string body = 5;
  string channel = 6;
  string format = 7;
  string lane = 8;
  string sku = 9;
}

message ListDraftsRequest {}

message ListDraftsResponse {
  repeated Draft drafts = 1;
}

message CreateDraftRequest {
  string campaign_id = 1;
  string post_type_id = 2;
  string body = 3;
  string channel = 4;
  string format = 5;
  string lane = 6;
  string sku = 7;
}

message CreateDraftResponse {
  Draft draft = 1;
}

message UpdateDraftBodyRequest {
  string id = 1;
  string body = 2;
}
message UpdateDraftBodyResponse {
  Draft draft = 1;
}

// SubmitReleaseDraft asks Channel Manager to own a durable release action.
// It does not assert that a platform post exists; that outcome returns later
// through Content Desk's idempotent release-receipt inbox.
message SubmitReleaseDraftRequest {
  string id = 1;
  string identity_id = 2;
  string lane = 3;
  string idempotency_key = 4;
}
message SubmitReleaseDraftResponse {
  Draft draft = 1;
  string release_id = 2;
  string action_id = 3;
  string release_status = 4;
}

// RecordReleaseOutcome is Channel Manager's idempotent completion callback.
// It is accepted only for a real published or partial platform outcome.
message RecordReleaseOutcomeRequest {
  string receipt_id = 1;
  string draft_id = 2;
  string status = 3;
  string platform_post_id = 4;
  string published_url = 5;
  string published_at = 6;
}
message RecordReleaseOutcomeResponse {
  Draft draft = 1;
  string publish_record_id = 2;
}

message TransitionDraftRequest {
  string id = 1;
  string event = 2;
}

message TransitionDraftResponse {
  Draft draft = 1;
}

message ApproveDraftRequest {
  string id = 1;
  string identity_id = 2;
  string lane = 3;
}
message ApproveDraftResponse {
  Draft draft = 1;
}
