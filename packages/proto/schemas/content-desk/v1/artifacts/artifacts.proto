syntax = "proto3";

package vrooli.content_desk.v1.artifacts;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/content-desk/v1/artifacts;artifacts_v1";

// ArtifactsService owns drafts and their constrained lifecycle.
service ArtifactsService {
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);
  rpc CreateDraft(CreateDraftRequest) returns (CreateDraftResponse);
  rpc UpdateDraftBody(UpdateDraftBodyRequest) returns (UpdateDraftBodyResponse);
  rpc AttachReleasedAsset(AttachReleasedAssetRequest) returns (AttachReleasedAssetResponse);
  rpc ListDraftAttachments(ListDraftAttachmentsRequest) returns (ListDraftAttachmentsResponse);
  rpc CommissionAgentWork(CommissionAgentWorkRequest) returns (CommissionAgentWorkResponse);
  rpc GetAgentWorkResult(GetAgentWorkResultRequest) returns (GetAgentWorkResultResponse);
  rpc AdoptAgentSuggestion(AdoptAgentSuggestionRequest) returns (AdoptAgentSuggestionResponse);
  rpc SubmitReleaseDraft(SubmitReleaseDraftRequest) returns (SubmitReleaseDraftResponse);
  rpc RecordReleaseOutcome(RecordReleaseOutcomeRequest) returns (RecordReleaseOutcomeResponse);
  rpc TransitionDraft(TransitionDraftRequest) returns (TransitionDraftResponse);
  rpc ApproveDraft(ApproveDraftRequest) returns (ApproveDraftResponse);
  rpc GetDraftCurrentRevision(GetDraftCurrentRevisionRequest) returns (GetDraftCurrentRevisionResponse);
}

message Draft {
  string id = 1;
  string campaign_id = 2;
  string status = 3;
  string post_type_id = 4;
  string body = 5;
  string channel = 6;
  string format = 7;
  string lane = 8;
  string sku = 9;
  string scenario_name = 10;
}

message ListDraftsRequest {}

message ListDraftsResponse {
  repeated Draft drafts = 1;
}

message CreateDraftRequest {
  string campaign_id = 1;
  string post_type_id = 2;
  string body = 3;
  string channel = 4;
  string format = 5;
  string lane = 6;
  string sku = 7;
  string scenario_name = 8;
}

message CreateDraftResponse {
  Draft draft = 1;
}

message UpdateDraftBodyRequest {
  string id = 1;
  string body = 2;
}
message UpdateDraftBodyResponse {
  Draft draft = 1;
}

// DraftAttachment carries Asset Studio metadata only. Artifact bytes remain
// behind the Asset Studio BlobStore boundary.
message DraftAttachment {
  string id = 1;
  string draft_id = 2;
  string asset_id = 3;
  string role = 4;
  string aspect_ratio = 5;
  string alt_text = 6;
  int32 position = 7;
}
message AttachReleasedAssetRequest {
  string draft_id = 1;
  string asset_id = 2;
  string role = 3;
  string aspect_ratio = 4;
  string alt_text = 5;
  int32 position = 6;
}
message AttachReleasedAssetResponse {
  DraftAttachment attachment = 1;
}
message ListDraftAttachmentsRequest {
  string draft_id = 1;
}
message ListDraftAttachmentsResponse {
  repeated DraftAttachment attachments = 1;
}

// CommissionAgentWork starts only a declared, read-only Agent Manager profile.
// Its output remains an operator-editable suggestion and can never approve or publish.
message CommissionAgentWorkRequest {
  string draft_id = 1;
  string action = 2;
}
message CommissionAgentWorkResponse {
  string commission_id = 1;
  string task_id = 2;
  string run_id = 3;
  string status = 4;
}
message GetAgentWorkResultRequest {
  string commission_id = 1;
}
message GetAgentWorkResultResponse {
  string run_id = 1;
  string status = 2;
  string body = 3;
}
message AdoptAgentSuggestionRequest {
  string commission_id = 1;
  string body = 2;
}
message AdoptAgentSuggestionResponse {
  Draft draft = 1;
}

// SubmitReleaseDraft asks Channel Manager to own a durable release action.
// It does not assert that a platform post exists; that outcome returns later
// through Content Desk's idempotent release-receipt inbox.
message SubmitReleaseDraftRequest {
  string id = 1;
  string identity_id = 2;
  string lane = 3;
  string idempotency_key = 4;
  // Confirmation from the descriptor-derived preview. This must be true for
  // a persona identity whose target platform requires AI disclosure.
  bool disclosure_visible = 5;
}
message SubmitReleaseDraftResponse {
  Draft draft = 1;
  string release_id = 2;
  string action_id = 3;
  string release_status = 4;
}

// RecordReleaseOutcome is Channel Manager's idempotent completion callback.
// It is accepted only for a real published or partial platform outcome.
message RecordReleaseOutcomeRequest {
  string receipt_id = 1;
  string draft_id = 2;
  string status = 3;
  string platform_post_id = 4;
  string published_url = 5;
  string published_at = 6;
}
message RecordReleaseOutcomeResponse {
  Draft draft = 1;
  string publish_record_id = 2;
}

message TransitionDraftRequest {
  string id = 1;
  string event = 2;
}

message TransitionDraftResponse {
  Draft draft = 1;
}

message ApproveDraftRequest {
  string id = 1;
  string identity_id = 2;
  string lane = 3;
}
message ApproveDraftResponse {
  Draft draft = 1;
}

// DraftCurrentRevision is an artifact's effective body plus only the editorial
// authority that still applies to exactly that body. The latest stored revision
// is selected only when it matches the live draft; a review that was invalidated
// or superseded, or an approval withdrawn by a revision, resolves to an empty
// field (and has_* = false) instead of to stale evidence. A consumer deciding
// whether to release must read this, not the prior review/approval.
message DraftCurrentRevision {
  string draft_id = 1;
  string status = 2;
  string body = 3;
  string revision_id = 4;
  string revision_actor_kind = 5;
  string revision_capacity = 6;
  string created_at = 7;
  string review_run_id = 8;
  string review_at = 9;
  string approval_actor_kind = 10;
  string approval_capacity = 11;
  string approved_at = 12;
  bool has_stored_revision = 13;
  bool has_applicable_review = 14;
  bool has_applicable_approval = 15;
}
message GetDraftCurrentRevisionRequest {
  string id = 1;
}
message GetDraftCurrentRevisionResponse {
  DraftCurrentRevision current_revision = 1;
}
