syntax = "proto3";

package vrooli.content_desk.v1.claims;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/content-desk/v1/claims;claims_v1";

// ClaimsService owns the reusable claim library and its evidence lifecycle.
service ClaimsService {
  rpc ListClaims(ListClaimsRequest) returns (ListClaimsResponse);
  rpc ListDraftClaims(ListDraftClaimsRequest) returns (ListDraftClaimsResponse);
  rpc CreateClaim(CreateClaimRequest) returns (CreateClaimResponse);
  rpc CiteClaim(CiteClaimRequest) returns (CiteClaimResponse);
  rpc VerifyClaim(VerifyClaimRequest) returns (VerifyClaimResponse);
  rpc SweepClaims(SweepClaimsRequest) returns (SweepClaimsResponse);
  rpc GetClaimCoverage(GetClaimCoverageRequest) returns (GetClaimCoverageResponse);
  rpc ExtractClaimProposals(ExtractClaimProposalsRequest) returns (ExtractClaimProposalsResponse);
  rpc ListClaimProposals(ListClaimProposalsRequest) returns (ListClaimProposalsResponse);
  rpc DecideClaimProposal(DecideClaimProposalRequest) returns (DecideClaimProposalResponse);
  rpc SetClaimQualification(SetClaimQualificationRequest) returns (SetClaimQualificationResponse);
}

message Claim {
  string id = 1;
  string statement = 2;
  string verification_status = 3;
  string kind = 4;
  // qualification is the reviewed evidence verdict and is distinct from
  // verification_status, which is the re-runnable check lifecycle. Closed
  // set: asserted | supported | captured-review-pending | verified | stale.
  // Empty is reported as asserted. This is how a citation-backed claim that
  // a reviewer has judged supported (or whose captured artifact still awaits
  // review) is representable in the ledger.
  string qualification = 5;
}

message SetClaimQualificationRequest {
  string id = 1;
  string qualification = 2;
}
message SetClaimQualificationResponse {
  Claim claim = 1;
}

message ListClaimsRequest {}

message ListClaimsResponse {
  repeated Claim claims = 1;
}
message ListDraftClaimsRequest {
  string draft_id = 1;
}
message ListDraftClaimsResponse {
  repeated Claim claims = 1;
}

message CreateClaimRequest {
  string statement = 1;
  string kind = 2;
  string evidence_kind = 3;
  string reference = 4;
  string command = 5;
  string expected_result = 6;
  string observed_at = 7;
}
message CreateClaimResponse {
  Claim claim = 1;
}

message CiteClaimRequest {
  string draft_id = 1;
  string claim_id = 2;
  int32 span_start = 3;
  int32 span_end = 4;
  string body = 5;
}
message CiteClaimResponse {}

message VerifyClaimRequest {
  string id = 1;
}
message VerifyClaimResponse {
  Claim claim = 1;
}
message SweepClaimsRequest {}
message SweepClaimsResponse {
  repeated Claim claims = 1;
}

message TextSpan {
  int32 start = 1;
  int32 end = 2;
  string claim_id = 3;
  bool supported = 4;
}
message GetClaimCoverageRequest {
  string draft_id = 1;
  string body = 2;
}
message GetClaimCoverageResponse {
  repeated TextSpan supported_spans = 1;
  repeated TextSpan uncovered_spans = 2;
}

// ClaimProposal is advisory extracted text. It is not a claim and does not
// satisfy the approval gate until an operator creates and verifies a claim.
message ClaimProposal {
  string id = 1;
  string draft_id = 2;
  string statement = 3;
  string status = 4;
  string created_at = 5;
  string decided_at = 6;
}
message ExtractClaimProposalsRequest {
  string draft_id = 1;
  string body = 2;
}
message ExtractClaimProposalsResponse {
  repeated ClaimProposal proposals = 1;
}
message ListClaimProposalsRequest {
  string draft_id = 1;
}
message ListClaimProposalsResponse {
  repeated ClaimProposal proposals = 1;
}
message DecideClaimProposalRequest {
  string id = 1;
  string status = 2;
}
message DecideClaimProposalResponse {
  ClaimProposal proposal = 1;
}
