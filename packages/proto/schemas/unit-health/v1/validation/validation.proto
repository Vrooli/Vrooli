syntax = "proto3";

package vrooli.unit_health.v1.validation;

import "common/v1/maturity.proto";
import "unit-health/v1/validation/test_quality.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/unit-health/v1/validation;validation_v1";

// =============================================================================
// UNIT HEALTH — validation contract
// =============================================================================
//
// @stability beta
//
// Wire contract for Unit Health's primary surface. Unit Health owns test
// discovery, execution, test architecture, test quality, coverage, and
// flake/runtime diagnostics, and emits provider-local test maturity through the
// shared common.v1.MaturityAssessment contract. Test Genie's `unit` phase shells
// `unit-health validate scenario <name> --json` and ingests
// ValidateScenarioResponse.assessment.
//
// Naming convention: the `Service` suffix and `<Service><Verb>Request` request
// shape match buf's DEFAULT lint rules and the rest of `packages/proto/`.
//
// Consumed by:
//   - API: handlers/validation/connect_handler.go implements the generated
//          ValidationServiceHandler from the validation_v1connect Go package.
//   - UI:  ui/src/api/validation.ts exposes the generated Connect-Web client.
//   - CLI: cli/domains/validate/handlers.go calls the generated Connect-Go
//          client and renders via cliapp.ListReport.
// =============================================================================

// ValidationService is Unit Health's test-maturity validation surface.
service ValidationService {
  // ValidateScenario discovers test surfaces, plans and (optionally) runs the
  // canonical test commands, analyzes coverage/architecture/quality, and
  // returns normalized findings plus a shared maturity assessment.
  rpc ValidateScenario(ValidateScenarioRequest) returns (ValidateScenarioResponse);

  // RunCalibration compares the authored development corpus, or a reviewed
  // holdout when explicitly requested, with adapter observations.
  rpc RunCalibration(RunCalibrationRequest) returns (RunCalibrationResponse);

  // Read one bounded, redacted test body for governed sampled review.
  rpc ReadTestBody(ReadTestBodyRequest) returns (ReadTestBodyResponse);

  // Run a bounded owner-side mutation pilot in disposable workspaces.
  rpc RunMutationPilot(RunMutationPilotRequest) returns (RunMutationPilotResponse);
}

// ValidateScenarioRequest identifies the target to validate.
message ValidateScenarioRequest {
  // Scenario slug, such as "unit-health". Optional when path is set.
  string scenario = 1;

  // Filesystem path to validate. Optional when scenario is set.
  string path = 2;

  // Optional workspace ids to restrict the validation.
  repeated string workspaces = 3;

  // Whether planned test commands should be executed. When false the response
  // describes the plan without running anything.
  bool include_execution = 4;

  // Whether upstream Code Facts discovery may use cached facts.
  bool use_cache = 5;

  // Run only the fast test command and reuse no coverage artifact. The default
  // remains the historical coverage-capable execution path; this explicit mode
  // lets callers collect lightweight test evidence separately from coverage
  // evidence without weakening either cache contract.
  bool fast_test_only = 6;

  // Optional sampled-review cohort attached to this validation run. Review
  // evidence is supplied only when the cohort has a source identity and at
  // least one observed label.
  string reviewed_cohort_id = 7;
  string reviewed_source_identity = 8;
  uint32 reviewed_observation_count = 9;
}

message ValidateScenarioResponse {
  // Stable run identifier for this validation invocation.
  string run_id = 1;

  // Overall status. Canonical planned values: passed, failed, degraded, error.
  string status = 2;

  // Human-readable summary for CLI and UI preview surfaces.
  string summary = 3;

  string scenario = 4;
  string target_kind = 5;
  string target_path = 6;
  string degraded_reason = 7;

  repeated TestSurface surfaces = 8;
  repeated TestWorkspace workspaces = 9;
  ExecutionPlan plan = 10;
  repeated CommandResult command_results = 11;
  repeated CoverageTarget coverage = 12;
  repeated ValidationFinding findings = 13;
  repeated Diagnostic diagnostics = 14;
  MaturitySummary maturity = 15;
  ValidationCounts counts = 16;
  repeated string next_steps = 17;
  common.v1.MaturityAssessment assessment = 18;

  // Labeled references into this run's outputs (the run id, per-command working
  // directories, coverage artifact locations) so operators and UIs can answer
  // "where is this run / where are its outputs" without reconstructing paths
  // from the other fields. Derived from the response; never authoritative state.
  repeated Artifact artifacts = 19;

  // Inspectable unit-infrastructure policy projections. These rows compare the
  // resolved unit.policy_profile expectation against the native file/config
  // evidence Unit Health observed, including passing rows so operators can see
  // which parts of the testing contract are actually enforced.
  repeated ProjectionCheck projection_checks = 20;

  // Findings suppressed by a validated unit-policy waiver. Suppression is
  // visible and separate from active findings so operators can audit every
  // exception without counting it as an active maturity failure.
  repeated ValidationFinding suppressed_findings = 21;
  bool cache_hit = 22;
  string cache_miss_reason = 23;
  repeated string cache_invalidated_dimensions = 24;
  int64 cache_saved_wall_time_ms = 25;
  int64 cache_saved_cpu_time_ms = 26;
  int64 cache_retained_bytes = 27;
  // Optional scoped test-quality analysis. Absent historical data is unknown.
  TestQualityReport test_quality = 28;
  RequirementTraceabilityReport traceability = 29;
  EvidenceStages evidence_stages = 30;
}

// RunCalibrationRequest selects a governed calibration read.
message RunCalibrationRequest {
  // Corpus partition: development, reviewed-holdout, or inventory.
  string partition = 1;
  // Reviewed holdout identity. Required for the reviewed-holdout partition.
  string holdout_id = 2;
  // Include native-profile observations when the selected corpus supports them.
  bool include_native = 3;
  // Restrict holdout comparison to one catalog rule.
  string rule_id = 4;
}

// FamilyCount is the bounded case count for one calibration family.
message FamilyCount {
  string family = 1;
  uint32 specified = 2;
  uint32 implemented = 3;
  uint32 retired = 4;
}

// CorpusInventory describes the authored calibration surface.
message CorpusInventory {
  uint32 specified = 1;
  uint32 implemented = 2;
  uint32 retired = 3;
  repeated FamilyCount families = 4;
  uint32 spec_codes_without_emitter = 5;
  string development_floor = 6;
}

// CaseOutcome is the bounded result for one calibration case.
message CaseOutcome {
  string id = 1;
  string rule_id = 2;
  bool matched = 3;
  repeated string differences = 4;
  string status = 5;
}

// HoldoutComparison contains independent-label agreement metrics.
message HoldoutComparison {
  string rule_id = 1;
  string holdout_id = 2;
  uint32 labelled = 3;
  uint32 observed = 4;
  uint32 false_positives = 5;
  uint32 false_negatives = 6;
  uint32 unknown = 7;
  double fp_rate = 8;
  double fn_rate = 9;
  double budget = 10;
  bool within_budget = 11;
  bool promotion_allowed = 12;
}

// RunCalibrationResponse is a governed, non-promoting calibration report.
message RunCalibrationResponse {
  string run_id = 1;
  string partition = 2;
  CorpusInventory corpus = 3;
  repeated CaseOutcome cases = 4;
  repeated HoldoutComparison holdout = 5;
  repeated string limitations = 6;
}

// ReadTestBodyRequest identifies one test body within a discovered workspace.
message ReadTestBodyRequest {
  string scenario = 1;
  string workspace = 2;
  string file = 3;
  string test_id = 4;
  uint32 max_bytes = 5;
}

// ReadTestBodyResponse is a bounded source excerpt. The full file never leaves
// the owner boundary and privacy-pattern files are refused.
message ReadTestBodyResponse {
  string test_identity = 1;
  string body_excerpt = 2;
  uint32 body_bytes = 3;
  uint32 redactions = 4;
  bool refused = 5;
  string refusal_reason = 6;
}

message RunMutationPilotRequest {
  string scenario = 1;
  string workspace = 2;
  string package = 3;
  repeated string operators = 4;
  uint32 max_mutants = 5;
  string seed = 6;
}

message MutantReceipt {
  string id = 1;
  string operator = 2;
  string file = 3;
  uint32 line = 4;
  string disposition = 5;
  string detail = 6;
  string owning_test = 7;
}

message MutationSummary {
  uint32 generated = 1;
  uint32 killed = 2;
  uint32 survived = 3;
  uint32 invalid = 4;
  uint32 equivalent = 5;
  uint32 out_of_contract = 6;
  uint32 infrastructure_failure = 7;
  uint32 unknown = 8;
  double kill_rate = 9;
}

message RunMutationPilotResponse {
  string run_id = 1;
  string workspace_path = 2;
  repeated MutantReceipt receipts = 3;
  MutationSummary summary = 4;
  repeated string limitations = 5;
}

// Missing historical stages are unknown, not executed or reviewed evidence.
message EvidenceStages {
  string configured = 1;
  string analyzed = 2;
  string executed = 3;
  string reviewed = 4;
  string source_run_id = 5;
}

// ProjectionCheck is one policy-vs-native comparison for unit-test
// infrastructure.
message ProjectionCheck {
  // Stable row id, e.g. "ui:vitest.environment".
  string id = 1;

  // Workspace/surface this projection belongs to.
  string workspace_id = 2;
  string surface_id = 3;

  // Short machine label for the projected setting.
  string key = 4;

  // Owning native config surface, e.g. "vite.config.ts test.coverage".
  string owner = 5;

  // File containing the native projection, or the expected file when missing.
  string file_path = 6;

  // Expected value from unit.policy_profile or Unit Health's default resolver.
  string policy_value = 7;

  // Observed value in the native config/filesystem.
  string native_value = 8;

  // Canonical statuses: pass, drift, missing, unknown.
  string status = 9;

  // Human-readable remediation hint for non-pass rows.
  string remediation = 10;

  // Finding code emitted when this row is enforcement-relevant.
  string finding_code = 11;
}

// Artifact is a labeled, typed reference into a validation run's outputs.
message Artifact {
  // Human-readable name, such as "Coverage (api)" or "go test (api)".
  string label = 1;

  // Canonical kinds: run (the run id), target (the validated root), command
  // (a command's working directory), coverage (a coverage artifact location).
  string kind = 2;

  // The locator: a run id for kind=run, otherwise a filesystem path.
  string reference = 3;
}

// TestSurface is a discovered scenario surface (api/cli/ui/worker/...) as
// reported by Code Facts.
message TestSurface {
  string id = 1;
  string kind = 2;
  string language = 3;
  string framework = 4;
  string root_path = 5;
  string package_manager = 6;
  string status = 7;
  double confidence = 8;
}

// TestWorkspace is a testable unit (Go module, TypeScript/Vite UI, Python
// package) with its canonical framework and resolved test commands.
message TestWorkspace {
  string id = 1;
  string language = 2;
  string root_path = 3;
  string framework = 4;
  string canonical_framework = 5;
  string test_command = 6;
  string coverage_command = 7;
  string package_manager = 8;
  string status = 9;
  string degraded_reason = 10;
  string runner_profile = 11;
  ResourceLimits resources = 12;
  string adapter_id = 13;
  string adapter_version = 14;
  string test_kind = 15;
}

// ExecutionPlan is the bounded set of commands Unit Health would run.
message ExecutionPlan {
  repeated PlannedCommand commands = 1;
  string notes = 2;
}

message PlannedCommand {
  string workspace_id = 1;
  string name = 2;
  // Deprecated display form retained for human-readable diagnostics only.
  string command = 3;
  string working_directory = 4;
  int32 timeout_seconds = 5;
  // The executable and argv are the execution authority. No shell parsing is
  // permitted for adapter commands.
  string executable = 6;
  repeated string args = 7;
  map<string, string> environment = 8;
  repeated CommandArtifact artifacts = 9;
  ResourceLimits resources = 10;
  string kind = 11;
  int32 no_output_timeout_seconds = 12;
  string test_kind = 13;
  HermeticPolicy hermetic = 14;
}

message CommandArtifact {
  string label = 1;
  string kind = 2;
  string path = 3;
}

message ResourceLimits {
  int32 cpu_weight = 1;
  int64 memory_bytes = 2;
  int32 max_workers = 3;
}

message HermeticPolicy {
  string network = 1;
  string filesystem = 2;
  bool temporary_root = 3;
  bool restore_environment = 4;
  bool detect_child_leaks = 5;
  bool detect_open_handles = 6;
  bool order_independent = 7;
}

message CommandResult {
  string name = 1;
  string command = 2;
  string working_directory = 3;
  string status = 4;
  int32 exit_code = 5;
  string stdout_excerpt = 6;
  string stderr_excerpt = 7;
  int32 timeout_seconds = 8;
  string failure_reason = 9;
  // Canonical classes: test_failure, missing_dependency, misconfiguration,
  // timeout, no_output_stall, system.
  string failure_class = 10;
  int64 duration_ms = 11;
  int64 cpu_time_ms = 12;
  int64 peak_rss_bytes = 13;
}

message CoverageTarget {
  string id = 1;
  string language = 2;
  string surface_id = 3;
  string file_path = 4;
  int64 covered_lines = 5;
  int64 total_lines = 6;
  double coverage_percent = 7;
  double threshold = 8;
  string status = 9;
}

message ValidationFinding {
  string id = 1;
  string scenario = 2;
  string surface_id = 3;
  string workspace_id = 4;
  string language = 5;
  string framework = 6;
  // Finding code; maps to a `.vrooli/maturity.json` finding entry.
  string code = 7;
  string category = 8;
  string severity = 9;
  string file_path = 10;
  string symbol = 11;
  string message = 12;
  string evidence = 13;
  string expected = 14;
  string observed = 15;
  string why_it_matters = 16;
  string remediation = 17;
  string source_command = 18;
  string created_at = 19;
  // Validated exceptions, separate from the original finding evidence.
  repeated SuppressionReason suppression_reasons = 20;
}

message SuppressionReason {
  string reason = 1;
  string owner = 2;
  string evidence = 3;
  string expires_at = 4;
  string revisit = 5;
}

message Diagnostic {
  // Canonical kinds: flake, runtime_growth, hang_culprit, slow_command.
  string kind = 1;
  string workspace_id = 2;
  string message = 3;
  string evidence = 4;
  string severity = 5;
  ReliabilityObservation reliability = 6;
}

// Explicitly command-scoped history; absence is unknown, never proof of stability.
message ReliabilityObservation {
  string state = 1;
  string scope = 2;
  string cohort_digest = 3;
  int32 sample_count = 4;
  int32 passed = 5;
  int32 failed = 6;
  int32 excluded_infrastructure = 7;
  int32 excluded_incompatible = 8;
  optional string seed = 9;
  optional int32 retry_ordinal = 10;
}

message MaturitySummary {
  int32 rung = 1;
  string label = 2;
  string rationale = 3;
}

message ValidationCounts {
  int32 errors = 1;
  int32 warnings = 2;
  int32 infos = 3;
  int32 surfaces = 4;
  int32 workspaces = 5;
  int32 coverage_targets = 6;
  int32 suppressed_findings = 7;
}
