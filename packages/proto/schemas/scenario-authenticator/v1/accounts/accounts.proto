syntax = "proto3";

package vrooli.scenario_authenticator.v1.accounts;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/scenario-authenticator/v1/accounts;accounts_v1";

// =============================================================================
// ACCOUNTS DOMAIN — multi-tenant Identity Provider account lifecycle
// =============================================================================
//
// @stability stable
//
// Wire contract for AccountsService, the P0 core of the authenticator's
// Identity Provider surface: register, sign in, refresh, sign out, and validate
// owner tokens. Relying parties (e.g. device-sync-hub) verify the issued RS256
// tokens LOCALLY against the published JWKS and never call Validate per request;
// Validate exists for diagnostic / non-RP callers.
//
// FROZEN wire invariants (changing any silently breaks device-sync-hub):
//   - the issued JWT's `iss` is "scenario-authenticator"
//   - the JWT's primary identity claim is `user_id` (not `sub`; sub is mirrored
//     additively)
//   - tokens are `aud`-scoped to the realm; the default realm's aud is
//     "scenario-authenticator:default"
//
// Realm is the multi-tenant primitive. At P0 a single "default" realm exists;
// the `realm` request field is carried now (additive-friendly) so explicit
// realm selection (P1) lands without a wire break. An empty realm resolves to
// the default.
//
// Consumed by:
//   - API: handlers/auth/connect_handler.go implements the generated
//          AccountsServiceHandler.
//   - CLI: cli/domains/auth calls the generated Connect-Go client.
//   - RP:  device-sync-hub internal/identity forwards Login/Register via the
//          generated Connect client.
// =============================================================================

service AccountsService {
  // Register creates an account in a realm and returns it auto-signed-in
  // (access + refresh token issued). A duplicate email yields ALREADY_EXISTS;
  // weak/invalid input yields INVALID_ARGUMENT. Responses never disclose
  // account existence beyond these documented codes.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Login verifies credentials and issues a fresh access + refresh token.
  // Invalid credentials and unknown accounts both yield UNAUTHENTICATED with an
  // identical message (anti-enumeration). A locked account yields
  // PERMISSION_DENIED.
  rpc Login(LoginRequest) returns (LoginResponse);

  // ChangePassword verifies the current password, stores a new Argon2id hash,
  // and revokes every live session for the authenticated account.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // Refresh rotates a refresh token single-use and mints a new access token.
  // Presenting an already-rotated token revokes the entire token family
  // (reuse detection) and yields UNAUTHENTICATED.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);

  // Logout revokes the caller's current session and blacklists the access
  // token until its own expiry. Idempotent.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Validate verifies an access token server-side and returns its claims.
  // Honors the realm aud-scoping: a token minted for a different realm is
  // rejected. RPs should prefer local JWKS verification; this is for callers
  // that cannot verify locally.
  rpc Validate(ValidateRequest) returns (ValidateResponse);

  // GrantScope assigns an opaque authorization scope to a principal.
  rpc GrantScope(GrantScopeRequest) returns (ScopeResponse);

  // RevokeScope removes an opaque authorization scope from a principal.
  rpc RevokeScope(RevokeScopeRequest) returns (ScopeResponse);

  // ListScopes returns the opaque scopes assigned to a principal.
  rpc ListScopes(ListScopesRequest) returns (ListScopesResponse);

  // SetRoles replaces the coarse realm roles for a principal. Only an
  // administrator may target another principal; the service prevents the
  // last realm administrator from removing its own administrator role.
  rpc SetRoles(SetRolesRequest) returns (Account);

  // LinkMachineAccount binds an operator's current local principal to an
  // account. The local exchange listener supplies the peer credential; this
  // RPC is also exposed to the signed-in CLI for explicit linking.
  rpc LinkMachineAccount(LinkMachineAccountRequest) returns (LinkMachineAccountResponse);

  // RevokeMachineAccount removes the selected machine binding. The caller may
  // revoke its own binding; an administrator may target another principal.
  // The operation is idempotent when the binding is already absent.
  rpc RevokeMachineAccount(RevokeMachineAccountRequest) returns (RevokeMachineAccountResponse);

  // ExchangeMachinePrincipal trades a verified local-socket peer credential
  // for a normal short-lived JWT. It is refused unless the socket listener has
  // injected a bound principal into the request context.
  rpc ExchangeMachinePrincipal(ExchangeMachinePrincipalRequest) returns (LoginResponse);

  // Issue a short-lived offline credential from already-provisioned local
  // break-glass material. The caller must save the response owner-only.
  rpc IssueBreakGlass(IssueBreakGlassRequest) returns (IssueBreakGlassResponse);

  // IssueServicePrincipal mints, or rotates, the credential of one
  // operator-configured service principal. The caller must be a verified human
  // named as an issuer in that profile, or a realm administrator. The principal's audience and scopes come only from the
  // operator-owned profile; the request cannot widen them. The credential is
  // written to the credential authority and is never returned on the wire.
  rpc IssueServicePrincipal(IssueServicePrincipalRequest) returns (IssueServicePrincipalResponse);

  // ExchangeServiceCredential trades a service-principal credential for a
  // short-lived access token (actor_kind "service") bound to the principal's
  // single configured resource audience. No refresh token is issued.
  rpc ExchangeServiceCredential(ExchangeServiceCredentialRequest) returns (ExchangeServiceCredentialResponse);

  // MintSessionDelegation mints a short-lived, session-scoped human-owner
  // delegation token for a verified human. Web Console calls this from its
  // verified Cloudflare-Access human context when it opens a terminal session,
  // then injects the token into the session environment so a coding agent
  // launched in that session can forward it on attach and have agent-manager
  // attribute the attached run to the operator. The token is a pure ATTRIBUTION
  // credential: actor_kind "human", subject = the verified operator, audience
  // the named relying resource (agent-manager), a wc_session_id claim binding it
  // to the exact session, a tight expiry, and NO capability scopes. It is
  // refused unless the access_token resolves to a verified human (service/agent
  // callers cannot mint, and a human cannot delegate on behalf of someone else).
  rpc MintSessionDelegation(MintSessionDelegationRequest) returns (MintSessionDelegationResponse);

}

// Account is the wire shape for a single account resource. Never carries a
// password or any hash.
message Account {
  // UUID assigned by the API on create.
  string id = 1;
  // Login identifier, unique within a realm.
  string email = 2;
  // Optional display name.
  string username = 3;
  // Coarse realm roles (e.g. "user", "admin"). Fine-grained authorization is
  // the relying party's concern.
  repeated string roles = 4;
  // Realm (tenant) the account belongs to. "default" at P0.
  string realm = 5;
  // Whether the email has been verified (P1 flows set this; false at P0).
  bool email_verified = 6;
  // Server time the account was first persisted.
  google.protobuf.Timestamp created_at = 7;
  // Opaque scopes assigned to the account.
  repeated string scopes = 8;
}

// TokenPair is the issued access + refresh token, plus the access token's
// expiry so a caller can schedule a refresh without decoding the JWT.
message TokenPair {
  // RS256 JWT bearer access token (short-lived).
  string access_token = 1;
  // Opaque refresh token (longer-lived, single-use, rotated on refresh).
  string refresh_token = 2;
  // Access-token expiry.
  google.protobuf.Timestamp access_token_expires_at = 3;
  // Audience stamped into the access token. Empty is never returned for a
  // successful token issuance.
  string audience = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3;
  // Realm to create the account in. Empty resolves to the default realm.
  string realm = 4;
  // Optional registered resource id. Empty preserves the default realm
  // audience during the migration window.
  string resource = 5;
}

message RegisterResponse {
  Account account = 1;
  TokenPair tokens = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  // Realm to authenticate against. Empty resolves to the default realm.
  string realm = 3;
  // Optional second-factor response for an MFA challenge returned by a prior
  // password-valid login attempt.
  string totp_code = 4;
  string recovery_code = 5;
  string mfa_challenge = 6;
  // Optional registered resource id.
  string resource = 7;
}

message LoginResponse {
  Account account = 1;
  TokenPair tokens = 2;
  bool mfa_required = 3;
  string mfa_challenge = 4;
}

message ChangePasswordRequest {
  // Access token identifying the account whose password is changing.
  string access_token = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  int64 revoked_sessions = 1;
}

message RefreshRequest {
  string refresh_token = 1;
  // Reserved for additive clients; the refresh family preserves the original
  // registered resource audience and ignores this field when empty.
  string resource = 2;
}

message RefreshResponse {
  TokenPair tokens = 1;
}

message LogoutRequest {
  // The access token to invalidate (blacklisted until its own expiry).
  string access_token = 1;
}

message LogoutResponse {}

message ValidateRequest {
  string access_token = 1;
}

message ValidateResponse {
  // True only when the token's signature, expiry, issuer, and realm aud all
  // check out and it is not blacklisted.
  bool valid = 1;
  // The frozen primary identity claim.
  string user_id = 2;
  string email = 3;
  repeated string roles = 4;
  // Realm the token is scoped to.
  string realm = 5;
  // Token expiry.
  google.protobuf.Timestamp expires_at = 6;
  // Explicitly present even when the principal has no scopes.
  repeated string scopes = 7;
  string audience = 8;
}

message GrantScopeRequest {
  string access_token = 1;
  string principal_id = 2;
  string scope = 3;
}

message RevokeScopeRequest {
  string access_token = 1;
  string principal_id = 2;
  string scope = 3;
}

message ListScopesRequest {
  string access_token = 1;
  string principal_id = 2;
}

message ScopeResponse {
  string principal_id = 1;
  repeated string scopes = 2;
}

message ListScopesResponse {
  string principal_id = 1;
  repeated string scopes = 2;
}

message SetRolesRequest {
  string access_token = 1;
  string principal_id = 2;
  repeated string roles = 3;
}

message LinkMachineAccountRequest {
  string access_token = 1;
  string machine_id = 2;
  string local_principal = 3;
  string realm = 4;
  bool is_default = 5;
}

message LinkMachineAccountResponse {
  string machine_id = 1;
  string local_principal = 2;
  string account_id = 3;
  string realm = 4;
  bool is_default = 5;
  google.protobuf.Timestamp linked_at = 6;
}

message RevokeMachineAccountRequest {
  string access_token = 1;
  string machine_id = 2;
  string local_principal = 3;
  string principal_id = 4;
}

message RevokeMachineAccountResponse {
  int64 revoked_count = 1;
}

message ExchangeMachinePrincipalRequest {
  string machine_id = 1;
  // Optional registered resource id. Empty preserves the default realm
  // audience; callers may request a resource-specific audience without
  // handling account passwords.
  string resource = 2;
}

message IssueBreakGlassRequest {
  string access_token = 1;
  repeated string scopes = 2;
}

message IssueBreakGlassResponse {
  string credential = 1;
  int64 expires_at = 2;
}

message IssueServicePrincipalRequest {
  // Access token of the verified human issuing the principal.
  string access_token = 1;
  // Name of an operator-configured service principal profile.
  string name = 2;
}

// IssueServicePrincipalResponse describes where the credential was stored. It
// never carries the credential itself.
message IssueServicePrincipalResponse {
  string name = 1;
  string audience = 2;
  repeated string scopes = 3;
  string credential_identity = 4;
  string credential_field = 5;
  google.protobuf.Timestamp issued_at = 6;
}

message ExchangeServiceCredentialRequest {
  string credential = 1;
}

message ExchangeServiceCredentialResponse {
  string access_token = 1;
  google.protobuf.Timestamp access_token_expires_at = 2;
  string audience = 3;
  string subject = 4;
  repeated string scopes = 5;
}

message MintSessionDelegationRequest {
  // Access token of the verified human the delegation is minted for. The minted
  // token's subject is taken from this token, never from the request body, so a
  // caller cannot mint a delegation naming a different operator.
  string access_token = 1;
  // The Web Console session the delegation is bound to (wc_session_id claim).
  // agent-manager accepts the delegation only when this equals the attaching
  // harness session, so a delegation cannot be replayed onto another session.
  string wc_session_id = 2;
  // Optional registered resource id the delegation is audience-scoped to. Empty
  // resolves to the realm's default audience — what a relying party (e.g.
  // agent-manager with no explicit audience override) accepts out of the box.
  // A non-empty value must be a registered resource audience.
  string resource = 3;
}

message MintSessionDelegationResponse {
  // RS256 JWT: actor_kind "human", subject = the verified operator, the
  // requested resource audience, a wc_session_id claim, a tight expiry, and no
  // capability scopes.
  string delegation_token = 1;
  // Delegation expiry.
  google.protobuf.Timestamp expires_at = 2;
}
