syntax = "proto3";

package vrooli.react_component_library.v1.versions;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/react-component-library/v1/versions;versions_v1";

service VersionLifecycleService {
  rpc ListVersionLedger(ListVersionLedgerRequest) returns (ListVersionLedgerResponse);
  rpc ListRetireCandidates(ListRetireCandidatesRequest) returns (ListRetireCandidatesResponse);
  rpc DeprecateVersion(VersionLifecycleRequest) returns (VersionLifecycleResponse);
  rpc ArchiveVersion(VersionLifecycleRequest) returns (VersionLifecycleResponse);
  rpc RetireVersion(VersionLifecycleRequest) returns (VersionLifecycleResponse);
}

message ListVersionLedgerRequest { string library_id = 1; string window = 2; }
message VersionLedgerRow {
  string library_id = 1;
  string version = 2;
  string created_at = 3;
  string released_at = 4;
  string retired_at = 5;
  string lifecycle_state = 6;
  int32 gate_pass_count = 7;
  int32 gate_fail_count = 8;
  int32 test_runs = 9;
  double test_pass_rate = 10;
  int32 adoption_current = 11;
  int32 adoption_peak = 12;
  int32 file_count = 13;
  int32 lines_of_code = 14;
  int32 dependency_count = 15;
}
message ListVersionLedgerResponse { repeated VersionLedgerRow rows = 1; }

message ListRetireCandidatesRequest { string component_id = 1; }
message RetireCandidate { string component_id = 1; string library_id = 2; string version = 3; string status = 4; }
message ListRetireCandidatesResponse { repeated RetireCandidate candidates = 1; }
message VersionLifecycleRequest { string component_id = 1; string version = 2; bool confirm = 3; }
message VersionLifecycleResponse { RetireCandidate version = 1; string lifecycle_state = 2; }
