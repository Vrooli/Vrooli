syntax = "proto3";

package vrooli.react_component_library.v1.adoptions;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/react-component-library/v1/adoptions;adoptions_v1";

// =============================================================================
// ADOPTIONS DOMAIN — tracks which scenarios have adopted which components
// =============================================================================
//
// @layer 5  (api surface)
// @domain adoptions
// @stability experimental
//
// Wire contract for the AdoptionsService Connect-RPC service. An
// adoption record is a soft link from a registry component (by id) to a
// concrete copy of its source under a target scenario's tree. Refresh
// compares the adopted bytes against the library's current snapshot to
// compute a drift status: current / behind / modified / unknown.
//
// Consumed by:
//   - API: handlers/adoptions/connect_handler.go implements
//          AdoptionsServiceHandler.
//   - UI:  ui/src/api/adoptions.ts (Connect-Web client).
//   - CLI: cli/domains/adoptions/handlers.go (Connect-Go client).
// =============================================================================

service AdoptionsService {
  rpc ListAdoptions(ListAdoptionsRequest) returns (ListAdoptionsResponse);
  rpc ApplyAdoption(ApplyAdoptionRequest) returns (ApplyAdoptionResponse);
  rpc ReapplyAdoption(ReapplyAdoptionRequest) returns (ReapplyAdoptionResponse);
  rpc DeleteAdoption(DeleteAdoptionRequest) returns (DeleteAdoptionResponse);
  rpc RefreshAdoptions(RefreshAdoptionsRequest) returns (RefreshAdoptionsResponse);
  // ResolveAdoptionPath returns the canonical filesystem path for an adopted
  // component, computed from the target scenario's UI manifest (or a
  // heuristic / fallback when the manifest is missing). Read-only.
  rpc ResolveAdoptionPath(ResolveAdoptionPathRequest) returns (ResolveAdoptionPathResponse);
}

enum LibraryVersionStatus {
  LIBRARY_VERSION_STATUS_UNSPECIFIED = 0;
  LIBRARY_VERSION_STATUS_CURRENT = 1;
  LIBRARY_VERSION_STATUS_BEHIND = 2;
  LIBRARY_VERSION_STATUS_DEPRECATED = 3;
  LIBRARY_VERSION_STATUS_MISSING = 4;
  LIBRARY_VERSION_STATUS_UNKNOWN = 5;
}

enum LocalStatus {
  LOCAL_STATUS_UNSPECIFIED = 0;
  LOCAL_STATUS_CLEAN = 1;
  LOCAL_STATUS_MODIFIED = 2;
  LOCAL_STATUS_MISSING = 3;
  LOCAL_STATUS_UNKNOWN = 4;
}

message Adoption {
  // UUID assigned by the API on create.
  string id = 1;

  // Soft FK to components.id. No SQL constraint, per per-domain rule.
  string component_id = 2;

  // Echoed @libraryId of the component at the time of create. Lets
  // the UI render rows whose component_id has since been deleted.
  string library_id = 3;

  // Target scenario name (e.g., "swarm-manager"). Free-form string;
  // the library does not validate against a scenario registry here.
  string scenario = 4;

  // Filesystem path within the target scenario where the adopted
  // copy lives. Resolved relative to a configured scenarios root by
  // the refresh service.
  string adopted_path = 5;

  // Library version stamped on the adopted copy at apply time.
  string adopted_version = 6;

  // Version drift from the most recent Refresh.
  LibraryVersionStatus library_version_status = 7;

  // Local edit drift from the most recent Refresh.
  LocalStatus local_status = 8;

  // Notes attached by Refresh, such as the newer version or missing path.
  string status_detail = 11;

  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp refreshed_at = 10;

  string source_sha256 = 12;
  string applied_at = 13;
}

message ListAdoptionsRequest {
  // Optional filter: only return adoptions for this component.
  string component_id = 1;
  // Optional filter: only return adoptions in this target scenario.
  string scenario = 2;
  // Max rows. 0 = server default.
  int32 limit = 3;
}

message ListAdoptionsResponse {
  repeated Adoption adoptions = 1;
}

message ApplyAdoptionRequest {
  // Required. Soft FK to components.id; server validates the
  // component exists at create time.
  string component_id = 1;
  // Required. Target scenario name.
  string scenario = 2;
  // Required. Adopted path within the target scenario.
  string adopted_path = 3;
  // Optional. Defaults to component.latest.
  string version = 4;
  // Required to overwrite an existing target file.
  bool confirm_overwrite = 5;
}

message ApplyAdoptionResponse {
  Adoption adoption = 1;
  string written_path = 2;
}

message ReapplyAdoptionRequest {
  string id = 1;
  // Optional. Defaults to component.latest.
  string version = 2;
  // Required when the adopted target has local modifications.
  bool confirm_local_overwrite = 3;
}

message ReapplyAdoptionResponse {
  Adoption adoption = 1;
  string written_path = 2;
}

message DeleteAdoptionRequest {
  string id = 1;
}

message DeleteAdoptionResponse {}

message RefreshAdoptionsRequest {
  // Optional: scope the refresh to a single component_id. Empty =
  // every adoption in the registry.
  string component_id = 1;
}

// Source enum for ResolveAdoptionPath. The UI renders this as a badge so users
// know whether to trust the pre-filled path.
enum ResolveSource {
  RESOLVE_SOURCE_UNSPECIFIED = 0;
  RESOLVE_SOURCE_EXPLICIT = 1;            // Caller supplied an override.
  RESOLVE_SOURCE_TEMPLATE_MANIFEST = 2;   // Resolved via the template's ui/manifest.json.
  RESOLVE_SOURCE_HEURISTIC = 3;           // Manifest absent; matched directory by name.
  RESOLVE_SOURCE_FALLBACK = 4;            // No manifest, no heuristic match — last resort.
}

message ResolveAdoptionPathRequest {
  // Required. Soft FK to components.id.
  string component_id = 1;
  // Required. Target scenario name.
  string scenario = 2;
  // Optional. When non-empty, bypasses the manifest and is returned as-is
  // (after a path-safety check) with source = EXPLICIT.
  string override_path = 3;
  // Optional. Feature folder name; required when the slot's manifest entry
  // sets requiresFeature.
  string feature = 4;
}

message ResolveAdoptionPathResponse {
  // Resolved path, relative to the scenario root.
  string path = 1;
  // How the resolver arrived at the path.
  ResolveSource source = 2;
  // Slot name used during resolution (echoed for UI badge rendering).
  string slot = 3;
  // Non-fatal warnings (e.g. "manifest unavailable; using heuristic match").
  repeated string warnings = 4;
}

message RefreshAdoptionsResponse {
  // Updated rows after the refresh, in the same order ListAdoptions
  // would return them.
  repeated Adoption adoptions = 1;
  // Summary counters for CLI/UI display.
  int32 library_current = 2;
  int32 library_behind = 3;
  int32 library_deprecated = 4;
  int32 library_missing = 5;
  int32 library_unknown = 6;
  int32 local_clean = 7;
  int32 local_modified = 8;
  int32 local_missing = 9;
  int32 local_unknown = 10;
}
