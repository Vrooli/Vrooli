syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";
import "swarm-manager/v1/domain/agent_session.proto";
import "swarm-manager/v1/domain/plan_ref.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/domain;domain";

// =============================================================================
// INITIATIVE DOMAIN
// =============================================================================
//
// @layer 1
// @domain initiative
// @imports agent_session
// @stability beta
//
// Initiatives group related backlog items into coherent work streams.
// Each initiative tracks completion status through rollup of its items.
//
// USAGE CONTEXTS:
//   - API responses for initiative CRUD endpoints
//   - UI data models (initiative list and details)
//
// =============================================================================

// Initiative represents a named grouping of backlog items.
message Initiative {
  // Unique identifier (folder-safe name).
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable title.
  string title = 2 [(buf.validate.field).string.min_len = 1];

  // Detailed description of the initiative.
  string description = 3;

  // Lifecycle state for the initiative.
  // @constraint one of: active, in_review, review_pending, completed, failed, needs_followup
  string status = 4 [(buf.validate.field).string = {
    in: [
      "active",
      "in_review",
      "review_pending",
      "completed",
      "failed",
      "needs_followup"
    ]
  }];

  // Backlog item references as "kind/name" strings.
  repeated string items = 5;

  // RFC3339 timestamp of creation.
  // @format rfc3339
  string created = 6;

  // RFC3339 timestamp of last update.
  // @format rfc3339
  string updated = 7;

  // Personal annotation — a user note for tracking context.
  optional string note = 8;

  // RFC3339 timestamp when the initiative was archived. Null/unset means not archived.
  // Archiving is orthogonal to status — initiatives retain their status when archived.
  // @format rfc3339
  optional string archived_at = 9;

  // Manual priority (1-10, lower = higher priority). 0 or unset = unprioritized.
  // Combined with unblocking-score to produce effective priority for sorting.
  int32 priority = 10;

  // Upstream initiative names this initiative depends on. Creates a directed
  // edge in the initiative DAG; dependents cannot start until upstreams complete.
  repeated string depends_on = 11;

  // Operating mode that owns initiative execution semantics.
  // @constraint one of: item-level, holistic-loop, phased-plan-drain
  string mode = 12 [(buf.validate.field).string = {
    in: [
      "item-level",
      "holistic-loop",
      "phased-plan-drain"
    ]
  }];

  // Initiative-scoped acceptance criteria used by non-item-level modes.
  repeated string acceptance_criteria = 13;

  // Verified provenance for the actor/session that created this initiative.
  optional AgentSessionAttribution created_by = 14;

  // Canonical plan-manager plan backing this initiative or operating mode.
  optional PlanRef plan_ref = 15;

  // Source initiative name when this initiative was recreated. This preserves
  // lifecycle lineage without changing the source's archived history.
  string spawned_from = 16;
}

// InitiativeRollup provides aggregated status counts for initiative items.
message InitiativeRollup {
  // Total number of referenced items.
  int32 total = 1;

  // Number of items with status "completed".
  int32 completed = 2;

  // Number of items with status "in_progress", "queued", or "researching".
  int32 in_progress = 3;

  // Number of items with status "failed".
  int32 failed = 4;

  // Number of items with status "backlog" or "ready".
  int32 pending = 5;

  // Number of items that are archived (regardless of their terminal status).
  int32 archived = 6;
}
