syntax = "proto3";

package vrooli.swarm_manager.v1.domain;

import "buf/validate/validate.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/domain;domain";

// =============================================================================
// GRAPH DOMAIN
// =============================================================================
//
// @stability beta
//
// Graph domain types back the Swarm Manager graph workspace and keep the
// graph-first UI/API seam strongly typed.
//
// USAGE CONTEXTS:
//   - API graph projection responses
//   - UI graph workspace parsing and normalization
//
// =============================================================================

// GraphPosition is a 2D coordinate used by the graph workspace.
message GraphPosition {
  double x = 1;
  double y = 2;
}

// GraphGoalRollup summarizes the derived backlog state for a goal.
message GraphGoalRollup {
  int32 total = 1 [(buf.validate.field).int32.gte = 0];
  int32 completed = 2 [(buf.validate.field).int32.gte = 0];
  int32 in_progress = 3 [(buf.validate.field).int32.gte = 0];
  int32 failed = 4 [(buf.validate.field).int32.gte = 0];
  int32 pending = 5 [(buf.validate.field).int32.gte = 0];
  // Items the operator decided not to do: neither an achievement (completed)
  // nor outstanding work (pending).
  int32 dropped = 6 [(buf.validate.field).int32.gte = 0];
}

// GraphBacklogNodeData describes a backlog item node.
message GraphBacklogNodeData {
  string kind = 1 [(buf.validate.field).string = {
    in: [
      "idea",
      "research",
      "fix",
      "execute",
      "chore"
    ]
  }];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string title = 3 [(buf.validate.field).string.min_len = 1];
  // Backlog lifecycle status. Not constrained to an inline allowlist — see the
  // note on BacklogItem.status in domain/backlog.proto. This list is the reason
  // for that note: it had drifted from the real vocabulary, omitting
  // `suggested` and admitting `archived`, which is not a status at all (archival
  // is the separate archived_at timestamp).
  string status = 4 [(buf.validate.field).string.min_len = 1];
  int32 priority = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];
  // Cross-lens execution status annotation (topology enrichment).
  optional string active_execution_status = 6;
  int32 active_execution_count = 7;
}

// GraphGoalNodeData describes a goal node.
message GraphGoalNodeData {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string title = 2 [(buf.validate.field).string.min_len = 1];
  string status = 3 [(buf.validate.field).string.min_len = 1];
  GraphGoalRollup rollup = 4;
  reserved 5, 6;
}

// GraphCaptureNodeData describes a capture node.
message GraphCaptureNodeData {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string text = 2 [(buf.validate.field).string.min_len = 1];
  string status = 3 [(buf.validate.field).string = {
    in: [
      "classifying",
      "classified",
      "failed"
    ]
  }];
}

// GraphScenarioNodeData describes a scenario node.
message GraphScenarioNodeData {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string status = 2 [(buf.validate.field).string = {
    in: [
      "running",
      "stopped",
      "error",
      "unknown"
    ]
  }];
}

// GraphExecutionNodeData describes an execution node.
message GraphExecutionNodeData {
  string execution_id = 1 [(buf.validate.field).string.min_len = 1];
  string backlog_kind = 2 [(buf.validate.field).string = {
    in: [
      "idea",
      "research",
      "fix",
      "execute",
      "chore",
      "spec-sync"
    ]
  }];
  string backlog_name = 3 [(buf.validate.field).string.min_len = 1];
  string status = 4 [(buf.validate.field).string = {
    in: [
      "pending",
      "starting",
      "running",
      "needs_review",
      "validating",
      "needs_fixup",
      "completed",
      "failed",
      "canceled"
    ]
  }];
  string mode = 5 [(buf.validate.field).string = {
    in: [
      "manual",
      "yolo"
    ]
  }];
  optional string run_id = 6;
}

// GraphAgentActivityNodeData describes a tracked agent activity node.
message GraphAgentActivityNodeData {
  string activity_id = 1 [(buf.validate.field).string.min_len = 1];
  string owner_type = 2 [(buf.validate.field).string = {
    in: [
      "backlog",
      "capture",
      "scenario",
      "initiative",
      "session"
    ]
  }];
  optional string owner_kind = 3;
  string owner_name = 4 [(buf.validate.field).string.min_len = 1];
  optional string owner_title = 5;
  optional string execution_id = 6;
  string purpose = 7 [(buf.validate.field).string = {
    in: [
      "initialize",
      "workshop",
      "finalize",
      "research",
      "process",
      "fixup",
      "followup",
      "spec_sync",
      "classify",
      "clarify",
      "feedback",
      "feedback_continue",
      "review"
    ]
  }];
  string interaction_type = 8 [(buf.validate.field).string = {
    in: [
      "spawn",
      "continue"
    ]
  }];
  string status = 9 [(buf.validate.field).string = {
    in: [
      "pending",
      "starting",
      "running",
      "needs_review",
      "complete",
      "failed",
      "cancelled",
      "unspecified"
    ]
  }];
  optional string run_id = 10;
  optional string task_id = 11;
  string requested_at = 12 [(buf.validate.field).string.min_len = 1];
}

// GraphRunNodeData describes an agent-manager run node.
message GraphRunNodeData {
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string task_id = 2;
  string status = 3 [(buf.validate.field).string.min_len = 1];
}

// GraphNodeData is the typed payload for a graph node.
message GraphNodeData {
  oneof value {
    GraphBacklogNodeData backlog = 1;
    GraphGoalNodeData goal = 2;
    GraphCaptureNodeData capture = 3;
    GraphScenarioNodeData scenario = 4;
    GraphExecutionNodeData execution = 5;
    GraphAgentActivityNodeData activity = 6;
    GraphRunNodeData run = 7;
  }
}

// GraphNode is a node in the graph workspace.
message GraphNode {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string type = 2 [(buf.validate.field).string = {
    in: [
      "BacklogItem",
      "Goal",
      "Capture",
      "Scenario",
      "ExecutionRecord",
      "AgentActivity",
      "Run"
    ]
  }];
  GraphNodeData data = 3;
  GraphPosition position = 4;
}

// GraphEdge is an edge in the graph workspace.
message GraphEdge {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string source = 2 [(buf.validate.field).string.min_len = 1];
  string target = 3 [(buf.validate.field).string.min_len = 1];
  string type = 4 [(buf.validate.field).string = {
    in: [
      "depends_on",
      "member_of",
      "classified_as",
      "targets",
      "executes",
      "follow_up",
      "activity_for",
      "records_activity",
      "spawned_run",
      "continued_run"
    ]
  }];
}

// GraphMeta describes the graph projection metadata.
message GraphMeta {
  string lens = 1 [(buf.validate.field).string = {
    in: [
      "topology",
      "flow",
      "operations"
    ]
  }];
  int32 node_count = 2 [(buf.validate.field).int32.gte = 0];
  int32 edge_count = 3 [(buf.validate.field).int32.gte = 0];
  string generated_at = 4 [(buf.validate.field).string.min_len = 1];
  optional bool agent_manager_available = 5;
  // Focus-based drill-down fields (flow and operations lenses).
  optional string focus_node_id = 6;
  optional string focus_node_type = 7;
  optional string hint = 8;
}
