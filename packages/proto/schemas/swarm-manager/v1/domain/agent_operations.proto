syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";
import "swarm-manager/v1/domain/operating_mode.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/domain;domain";

// =============================================================================
// AGENT OPERATIONS DOMAIN (declarative agent operations)
// =============================================================================
//
// @stability experimental
//
// The wire vocabulary for the declarative agent-operations model
// (EXECUTION-MODES.md D1-D8): operation contracts, target capabilities, layered
// bindings, immutable execution provenance, durable domain workflow instances,
// transition policies over a closed domain-action registry, and initiative
// member-item strategy configuration. These messages mirror the authored JSON
// contracts under
// scenarios/swarm-manager/api/internal/agentops/schemas/*.json; the JSON
// schemas govern the on-disk documents at author/load time and this proto is
// the API wire contract later phases serve to the UI and CLI. Both encode the
// same generic, provider-neutral vocabulary — a contract never names a mode, a
// Go function, a service, a shell command, or a file path.
//
// Doctrine and vocabulary:
// scenarios/swarm-manager/docs/concepts/AGENT-OPERATIONS.md
//
// =============================================================================

// AgentOpsCapability is a closed-vocabulary target-adapter capability. An
// operation contract requires capabilities; a target adapter provides them;
// compilation fails closed on a mismatch.
enum AgentOpsCapability {
  AGENT_OPS_CAPABILITY_UNSPECIFIED = 0;
  AGENT_OPS_CAPABILITY_PROVIDES_PLAN_REF = 1;
  AGENT_OPS_CAPABILITY_PROVIDES_PLAN_CONTEXT = 2;
  AGENT_OPS_CAPABILITY_PROVIDES_SPEC_DOCUMENT = 3;
  AGENT_OPS_CAPABILITY_PROVIDES_REVIEW_ARTIFACTS = 4;
  AGENT_OPS_CAPABILITY_PROVIDES_EVIDENCE_LEDGER = 5;
  AGENT_OPS_CAPABILITY_PROVIDES_MEMBER_ITEMS = 6;
  AGENT_OPS_CAPABILITY_PROVIDES_ACCEPTANCE_CRITERIA = 7;
  AGENT_OPS_CAPABILITY_PROVIDES_CLARIFICATION_THREAD = 8;
  AGENT_OPS_CAPABILITY_PROVIDES_EXECUTION_WORKSPACE = 9;
}

// AgentOpsBindingLayer is a precedence layer for operation bindings; higher
// precedence wins (authorized-invocation > backlog-item-override >
// initiative-override > system-default).
enum AgentOpsBindingLayer {
  AGENT_OPS_BINDING_LAYER_UNSPECIFIED = 0;
  AGENT_OPS_BINDING_LAYER_SYSTEM_DEFAULT = 1;
  AGENT_OPS_BINDING_LAYER_INITIATIVE_OVERRIDE = 2;
  AGENT_OPS_BINDING_LAYER_BACKLOG_ITEM_OVERRIDE = 3;
  AGENT_OPS_BINDING_LAYER_AUTHORIZED_INVOCATION = 4;
}

// AgentOpsWorkflowState is the coordination-layer lifecycle state of a domain
// workflow instance. It never restates the domain entity's own status.
enum AgentOpsWorkflowState {
  AGENT_OPS_WORKFLOW_STATE_UNSPECIFIED = 0;
  AGENT_OPS_WORKFLOW_STATE_OPEN = 1;
  AGENT_OPS_WORKFLOW_STATE_RUNNING = 2;
  AGENT_OPS_WORKFLOW_STATE_AWAITING_DECISION = 3;
  AGENT_OPS_WORKFLOW_STATE_BLOCKED = 4;
  AGENT_OPS_WORKFLOW_STATE_TERMINAL_COMPLETE = 5;
  AGENT_OPS_WORKFLOW_STATE_TERMINAL_ABANDONED = 6;
  AGENT_OPS_WORKFLOW_STATE_TERMINAL_FAILED = 7;
}

// AgentOpsDomainAction is the CLOSED registry of legal domain actions. A
// transition policy may select an action ONLY from this set; it can never name
// a Go function, shell command, service, or file path. Domain code owns what
// each action does and its invariants.
enum AgentOpsDomainAction {
  AGENT_OPS_DOMAIN_ACTION_UNSPECIFIED = 0;
  AGENT_OPS_DOMAIN_ACTION_SAVE_DECISIONS = 1;
  AGENT_OPS_DOMAIN_ACTION_COMMIT_WORKSHOP_ROUND = 2;
  AGENT_OPS_DOMAIN_ACTION_START_CLARIFICATION = 3;
  AGENT_OPS_DOMAIN_ACTION_RESOLVE_CLARIFICATION = 4;
  AGENT_OPS_DOMAIN_ACTION_BIND_PLAN = 5;
  AGENT_OPS_DOMAIN_ACTION_QUEUE_PLAN_EXECUTION = 6;
  AGENT_OPS_DOMAIN_ACTION_START_EXECUTION = 7;
  AGENT_OPS_DOMAIN_ACTION_COMMIT_REVIEW_ROUND = 8;
  AGENT_OPS_DOMAIN_ACTION_REQUEST_REVISION = 9;
  AGENT_OPS_DOMAIN_ACTION_REQUEST_EVIDENCE = 10;
  AGENT_OPS_DOMAIN_ACTION_COMPLETE_ITEM = 11;
  AGENT_OPS_DOMAIN_ACTION_FAIL_ITEM = 12;
  AGENT_OPS_DOMAIN_ACTION_CREATE_FOLLOWUP = 13;
  AGENT_OPS_DOMAIN_ACTION_OPEN_REVIEW = 14;
  AGENT_OPS_DOMAIN_ACTION_ESCALATE_NEEDS_ATTENTION = 15;
  AGENT_OPS_DOMAIN_ACTION_MARK_INITIATIVE_REVIEWED = 16;
}

// AgentOpsMemberItemStrategy is how an initiative schedules work across its
// member items. This replaces the phase-less item-level mode; it is workflow
// strategy configuration, not an operating mode.
enum AgentOpsMemberItemStrategy {
  AGENT_OPS_MEMBER_ITEM_STRATEGY_UNSPECIFIED = 0;
  AGENT_OPS_MEMBER_ITEM_STRATEGY_PARALLEL_ITEMS = 1;
  AGENT_OPS_MEMBER_ITEM_STRATEGY_SEQUENTIAL_ITEMS = 2;
  AGENT_OPS_MEMBER_ITEM_STRATEGY_PRIORITIZED_ITEMS = 3;
}

// AgentOpsTargetCapabilityDescriptor declares the capabilities one target kind
// provides (target-capability.schema.json).
message AgentOpsTargetCapabilityDescriptor {
  OperatingModeTargetKind target_kind = 1;
  string description = 2;
  repeated AgentOpsCapability provides = 3;
}

// AgentOpsCallerInput is one typed caller input an operation accepts.
message AgentOpsCallerInput {
  string name = 1 [(buf.validate.field).string.pattern = "^[A-Z][A-Z0-9_]*$"];
  string type = 2;
  bool required = 3;
  string sensitivity = 4;
  string retention = 5;
  string description = 6;
}

// AgentOpsResultField is one typed field of an operation's structured result.
message AgentOpsResultField {
  string name = 1;
  string type = 2;
  bool required = 3;
  repeated string enum = 4;
  string description = 5;
}

// AgentOpsOutcome is one standard terminal/branch outcome an operation reports.
message AgentOpsOutcome {
  string name = 1;
  // How the workflow treats the outcome: success, continue, needs-decision,
  // blocked, failed, or abstain.
  string disposition = 2;
  string description = 3;
}

// AgentOpsOperationContract is a named, versioned operation contract
// (operation-contract.schema.json).
message AgentOpsOperationContract {
  string id = 1 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"];
  string version = 2 [(buf.validate.field).string.pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"];
  string summary = 3 [(buf.validate.field).string.min_len = 1];
  string description = 4;
  repeated AgentOpsCapability required_capabilities = 5;
  repeated AgentOpsCallerInput inputs = 6;
  repeated AgentOpsResultField result_fields = 7;
  repeated AgentOpsOutcome outcomes = 8;
}

// AgentOpsBindingOwner is the scope that owns a binding override.
message AgentOpsBindingOwner {
  // Owner kind: backlog-item, initiative, or invocation.
  string kind = 1;
  string id = 2;
}

// AgentOpsOperationBinding selects which mode implements an operation for a
// scope, at a pinned revision (operation-binding.schema.json).
message AgentOpsOperationBinding {
  string operation = 1;
  string operation_version = 2;
  AgentOpsBindingLayer layer = 3;
  AgentOpsBindingOwner owner = 4;
  string mode = 5;
  string mode_revision = 6;
  bool disabled = 7;
}

// AgentOpsProvenanceBinding records which binding selected the mode.
message AgentOpsProvenanceBinding {
  AgentOpsBindingLayer layer = 1;
  // Owner kind: backlog-item, initiative, invocation, or system.
  string owner_kind = 2;
  string owner_id = 3;
}

// AgentOpsProvenanceTarget is the resolved target identity of an execution.
message AgentOpsProvenanceTarget {
  OperatingModeTargetKind kind = 1;
  string id = 2;
}

// AgentOpsExecutionProvenance is the immutable provenance pinned when an
// operation execution starts (execution-provenance.schema.json). Every field is
// required before a run is allowed to start.
message AgentOpsExecutionProvenance {
  string operation = 1;
  string operation_version = 2;
  AgentOpsProvenanceBinding binding = 3;
  string mode = 4;
  string mode_revision = 5;
  string compiled_mode_digest = 6 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  string prompt_catalog_revision = 7;
  string prompt_catalog_digest = 8 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  AgentOpsProvenanceTarget target = 9;
  string caller_input_digest = 10 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  string policy_revision = 11;
  string workflow_instance_id = 12;
}

// AgentOpsOperationExecutionRecord correlates one operation execution under a
// workflow instance.
message AgentOpsOperationExecutionRecord {
  string operation = 1;
  string execution_id = 2;
  string idempotency_key = 3;
  string provenance_digest = 4 [(buf.validate.field).string.pattern = "^sha256:[0-9a-f]{64}$"];
  // Execution state: running, completed, canceled, failed, or needs-attention.
  string state = 5;
  string outcome = 6;
  // run_id is the live agent-run id the operation's round was dispatched under
  // (empty on the synchronous simulation path and until a run association
  // exists). It correlates a delivered round back to this record.
  string run_id = 7;
}

// AgentOpsHumanDecision is a human decision recorded against a workflow.
message AgentOpsHumanDecision {
  string decision = 1;
  string actor = 2;
  int32 at_version = 3;
  string note = 4;
}

// AgentOpsScheduledIntent is a timed intent firing a registered domain action.
message AgentOpsScheduledIntent {
  string intent = 1;
  AgentOpsDomainAction action = 2;
  string not_before = 3;
}

// AgentOpsMemberItemStrategyConfig configures how an initiative coordinates its
// member items (member-item-strategy.schema.json).
message AgentOpsMemberItemStrategyConfig {
  AgentOpsMemberItemStrategy strategy = 1;
  string item_operation = 2;
  int32 max_concurrency = 3;
  bool stop_on_first_failure = 4;
  // Which member items to schedule: all-eligible or ready-only.
  string item_selection = 5;
}

// AgentOpsWorkflowInstance is the durable domain workflow instance correlating a
// target's operation executions, decisions, timers, and terminal state
// (workflow-instance.schema.json). It never replaces the domain entity's own
// truth.
message AgentOpsWorkflowInstance {
  string schema_version = 1;
  string instance_id = 2;
  // Domain kind this workflow coordinates: backlog-item or initiative.
  string domain_kind = 3;
  string domain_id = 4;
  AgentOpsMemberItemStrategyConfig strategy = 5;
  AgentOpsWorkflowState state = 6;
  repeated AgentOpsOperationExecutionRecord operations = 7;
  repeated AgentOpsHumanDecision decisions = 8;
  repeated AgentOpsScheduledIntent timers = 9;
  repeated AgentOpsDomainAction legal_actions = 10;
  repeated string idempotency_keys = 11;
  int32 version = 12;
}

// AgentOpsPolicyTransition is one rule of a transition policy: in from_state,
// when the correlating operation reports on_outcome (or unconditionally when
// empty), fire action and move to to_state.
message AgentOpsPolicyTransition {
  AgentOpsWorkflowState from_state = 1;
  string on_outcome = 2;
  AgentOpsDomainAction action = 3;
  AgentOpsWorkflowState to_state = 4;
}

// AgentOpsTransitionPolicy is a data-authored transition policy over a domain
// workflow (transition-policy.schema.json).
message AgentOpsTransitionPolicy {
  string id = 1;
  string version = 2;
  // Domain kind this policy governs: backlog-item or initiative.
  string domain_kind = 3;
  repeated AgentOpsPolicyTransition transitions = 4;
}
