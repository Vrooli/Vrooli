syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/domain;domain";

// =============================================================================
// AGENT SESSION DOMAIN
// =============================================================================
//
// @layer 1
// @domain agent_session
// @imports none (external only: buf.validate)
// @stability beta
//
// Agent sessions are durable Swarm Manager-owned conversations with Agent
// Manager runs. They support typed conversational workflows such as
// meta-orchestration and operating-mode authoring, proposal review/apply, and
// artifact attribution.
//
// =============================================================================

// AgentSessionAttribution captures the verified actor that created or changed
// an entity, optionally joined to the owning Swarm Manager agent session.
message AgentSessionAttribution {
  // Actor type.
  // @constraint one of: operator, agent
  string type = 1 [(buf.validate.field).string = {
    in: [
      "operator",
      "agent"
    ]
  }];

  // Verified Agent Manager run ID when type=agent.
  optional string run_id = 2;

  // Verified Agent Manager task ID when type=agent.
  optional string task_id = 3;

  // Verified Agent Manager profile key when type=agent.
  optional string profile_key = 4;

  // Swarm Manager agent session ID when the run belongs to a session.
  optional string session_id = 5;

  // Swarm Manager session kind when the run belongs to a session.
  // @constraint one of: empty, meta_orchestration, operating_mode_authoring, swarm_operations
  optional string session_kind = 6 [(buf.validate.field).string = {
    in: [
      "",
      "meta_orchestration",
      "operating_mode_authoring",
      "swarm_operations"
    ]
  }];

  // Source marker for observability, such as session/<session_id>.
  optional string source = 7;
}

// AgentSessionMessage is a single conversation turn persisted for a session.
message AgentSessionMessage {
  // Unique message identifier within the session.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Sender role.
  // @constraint one of: user, assistant, system
  string role = 2 [(buf.validate.field).string = {
    in: [
      "user",
      "assistant",
      "system"
    ]
  }];

  // Markdown text.
  string content = 3;

  // RFC3339 timestamp.
  // @format rfc3339
  string created_at = 4 [(buf.validate.field).string.min_len = 1];

  // Optional attachment IDs associated with this turn.
  repeated string attachment_ids = 5;

  // Server-resolved context snapshots attached to this turn.
  repeated AgentSessionContextItem context = 6;
}

// AgentSessionContextItem is a bounded server-resolved snapshot of an existing
// Swarm Manager record attached to a single session message.
message AgentSessionContextItem {
  // Context type.
  // @constraint one of: backlog_item, initiative, capture, execution, agent_activity, scenario, operating_mode, session, operations_briefing, startup_brief
  string type = 1 [(buf.validate.field).string = {
    in: [
      "backlog_item",
      "initiative",
      "capture",
      "execution",
      "agent_activity",
      "scenario",
      "operating_mode",
      "session",
      "operations_briefing",
      "startup_brief"
    ]
  }];

  // Stable entity reference.
  string ref = 2 [(buf.validate.field).string.min_len = 1];

  // Server-resolved display title.
  string title = 3 [(buf.validate.field).string.min_len = 1];

  // Bounded server-resolved summary.
  string summary = 4;

  // Optional graph/detail routing hint.
  optional string node_id = 5;

  // Optional bounded JSON metadata with small display/prompt facts.
  optional string metadata_json = 6;

  // RFC3339 timestamp for when the ref was selected/resolved.
  // @format rfc3339
  string selected_at = 7 [(buf.validate.field).string.min_len = 1];
}

// AgentSessionAttachment describes an uploaded or generated attachment.
message AgentSessionAttachment {
  // Unique attachment identifier.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Display filename.
  string filename = 2 [(buf.validate.field).string.min_len = 1];

  // MIME type when known.
  optional string content_type = 3;

  // Size in bytes.
  optional int64 size_bytes = 4 [(buf.validate.field).int64.gte = 0];

  // RFC3339 timestamp.
  // @format rfc3339
  string created_at = 5 [(buf.validate.field).string.min_len = 1];
}

// AgentSessionProposal is a machine-validated draft produced by a session.
message AgentSessionProposal {
  // Unique proposal identifier.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Proposal kind.
  // @constraint one of: backlog_batch_import, operating_mode_draft, operating_mode_implementation_plan
  string kind = 2 [(buf.validate.field).string = {
    in: [
      "backlog_batch_import",
      "operating_mode_draft",
      "operating_mode_implementation_plan"
    ]
  }];

  // Proposal lifecycle.
  // @constraint one of: draft, ready, applied, rejected, superseded, failed
  string status = 3 [(buf.validate.field).string = {
    in: [
      "draft",
      "ready",
      "applied",
      "rejected",
      "superseded",
      "failed"
    ]
  }];

  // Human-readable proposal summary.
  string summary = 4 [(buf.validate.field).string.min_len = 1];

  // Machine-readable proposal payload as canonical JSON.
  string payload_json = 5 [(buf.validate.field).string.min_len = 1];

  // RFC3339 timestamp.
  // @format rfc3339
  string created_at = 6 [(buf.validate.field).string.min_len = 1];

  // RFC3339 timestamp.
  // @format rfc3339
  string updated_at = 7 [(buf.validate.field).string.min_len = 1];

  // Provenance for the agent/operator that produced the proposal.
  optional AgentSessionAttribution attribution = 8;
}

// AgentSessionArtifact links a session to a proposed or applied artifact.
message AgentSessionArtifact {
  // Unique artifact link identifier.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Owning session ID.
  string session_id = 2 [(buf.validate.field).string.min_len = 1];

  // Artifact type.
  // @constraint one of: backlog_item, initiative, operating_mode_proposal, operating_mode_definition, capture, file, agent_activity
  string artifact_type = 3 [(buf.validate.field).string = {
    in: [
      "backlog_item",
      "initiative",
      "operating_mode_proposal",
      "operating_mode_definition",
      "capture",
      "file",
      "agent_activity"
    ]
  }];

  // Link action.
  // @constraint one of: proposed, created, updated, deleted, linked
  string action = 4 [(buf.validate.field).string = {
    in: [
      "proposed",
      "created",
      "updated",
      "deleted",
      "linked"
    ]
  }];

  // Stable entity reference, such as execute/my-item, initiative-name, or a file path.
  string entity_ref = 5 [(buf.validate.field).string.min_len = 1];

  // Optional human-readable title for display.
  optional string title = 6;

  // Proposal that produced this artifact, when applicable.
  optional string proposal_id = 7;

  // Agent activity record associated with this artifact, when applicable.
  optional string activity_id = 8;

  // Agent Manager run associated with this artifact, when applicable.
  optional string run_id = 9;

  // API endpoint or service entrypoint that created the link.
  optional string mutation_source = 10;

  // Provenance for the mutation that produced the artifact link.
  optional AgentSessionAttribution attribution = 11;

  // RFC3339 timestamp.
  // @format rfc3339
  string created_at = 12 [(buf.validate.field).string.min_len = 1];
}

// AgentSession stores the indexable session snapshot. Messages, proposals,
// and artifacts may also be streamed from append-only logs.
message AgentSession {
  // Unique session identifier, usually sess_<id>.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable title.
  string title = 2 [(buf.validate.field).string.min_len = 1];

  // Session kind.
  // @constraint one of: meta_orchestration, operating_mode_authoring, swarm_operations
  string kind = 3 [(buf.validate.field).string = {
    in: [
      "meta_orchestration",
      "operating_mode_authoring",
      "swarm_operations"
    ]
  }];

  // Session lifecycle.
  // @constraint one of: draft, starting, running, waiting_for_user, proposal_ready, applying, complete, failed, canceled
  string status = 4 [(buf.validate.field).string = {
    in: [
      "draft",
      "starting",
      "running",
      "waiting_for_user",
      "proposal_ready",
      "applying",
      "complete",
      "failed",
      "canceled"
    ]
  }];

  // Prompt Manager skill ID used to guide the session.
  string skill_id = 5 [(buf.validate.field).string.min_len = 1];

  // Agent Manager task ID for the current/initial run.
  optional string task_id = 6;

  // Agent Manager run ID for the current/initial run.
  optional string run_id = 7;

  // Agent Manager profile key for the current/initial run.
  optional string profile_key = 8;

  // Most recent failure text, if any.
  optional string failure_reason = 9;

  // RFC3339 timestamp.
  // @format rfc3339
  string created_at = 10 [(buf.validate.field).string.min_len = 1];

  // RFC3339 timestamp.
  // @format rfc3339
  string updated_at = 11 [(buf.validate.field).string.min_len = 1];

  // Conversation transcript included in detail responses.
  repeated AgentSessionMessage messages = 12;

  // Proposal snapshots included in detail responses.
  repeated AgentSessionProposal proposals = 13;

  // Artifact links included in detail responses.
  repeated AgentSessionArtifact artifacts = 14;

  // Initial creator attribution.
  optional AgentSessionAttribution created_by = 15;

  // Uploaded or generated attachments owned by this session.
  repeated AgentSessionAttachment attachments = 16;
}
