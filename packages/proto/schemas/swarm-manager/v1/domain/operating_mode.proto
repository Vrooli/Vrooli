syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/domain;domain";

// =============================================================================
// OPERATING MODE DOMAIN
// =============================================================================
//
// @stability experimental
//
// The wire vocabulary for a swarm-manager operating mode expressed as data — a
// reusable, inspectable, testable methodology loop for agentic software
// engineering. These messages mirror the authoring contract
// `.vrooli/schemas/operating-mode.schema.json` ($id operating-mode/v1): the
// JSON Schema governs the on-disk `modes/<id>/mode.json` files at author/load
// time; this proto is the API wire contract the operating-mode service serves to
// the UI (replacing the legacy bespoke JSON surface). Both are encodings of the
// same generic vocabulary and are kept in agreement — there is NO shape bespoke
// to a named mode.
//
// The OperatingModeService RPC surface and its operational projection responses
// (catalog/workspace/round/simulation/render) live in
// `swarm-manager/v1/api/operating_mode.proto` and are authored alongside the
// Connect service implementation.
//
// USAGE CONTEXTS:
//   - swarm-manager API: serves mode data as typed Connect messages.
//   - swarm-manager UI: renders the Operating Modes surfaces from this data.
//
// Doctrine and vocabulary: scenarios/swarm-manager/docs/concepts/EXECUTION-MODES.md
//
// =============================================================================

// OperatingModeTargetKind is the mode's declared unit of work — the thing one
// run of the loop operates on. Each kind has a target adapter supplying the
// target-specific reads, artifact scope, and lock identity; initiative is one
// adapter among several, not the base case.
enum OperatingModeTargetKind {
  OPERATING_MODE_TARGET_KIND_UNSPECIFIED = 0;
  // A canonical, provider-neutral plan execution (resolved instance carries
  // plan id + execution id). Renamed from the pre-cutover PLAN_MANAGER_PLAN;
  // the wire number is unchanged.
  OPERATING_MODE_TARGET_KIND_PLAN_EXECUTION = 1;
  // A swarm-manager initiative and its member items.
  OPERATING_MODE_TARGET_KIND_INITIATIVE = 3;
  // A single swarm-manager backlog item. Vocabulary is pinned; the runtime
  // adapter arrives in a later phase.
  OPERATING_MODE_TARGET_KIND_BACKLOG_ITEM = 4;
  // A plain scenario repository workspace, identified by scenario name (the
  // spec-sync target). Unlike the other kinds, a scenario is a directory that
  // already exists on disk; its workflow lives under a dedicated scope root.
  OPERATING_MODE_TARGET_KIND_SCENARIO = 5;

  // 2 was the pre-cutover unmanaged plan-ref target kind, now removed
  // (EXECUTION-MODES.md D6). Reserved so the number and name are never reused.
  reserved 2;
  reserved "OPERATING_MODE_TARGET_KIND_PLAN_REF";
}

// OperatingModeRunStrategyKind controls how rounds are dispatched and gated.
enum OperatingModeRunStrategyKind {
  OPERATING_MODE_RUN_STRATEGY_KIND_UNSPECIFIED = 0;
  // item-level: owned by the backlog execution flow; no mode rounds.
  OPERATING_MODE_RUN_STRATEGY_KIND_EXISTING_ITEM_FLOW = 1;
  // One phase at a time with no cross-round handoff requirement.
  OPERATING_MODE_RUN_STRATEGY_KIND_SINGLE_PHASE_RUN = 2;
  // Each non-start phase requires durable handoff/progress context from the
  // prior completed round.
  OPERATING_MODE_RUN_STRATEGY_KIND_SEQUENTIAL_HANDOFF = 3;
  // The operator advances the loop between rounds.
  OPERATING_MODE_RUN_STRATEGY_KIND_OPERATOR_GATED_LOOP = 4;
}

// OperatingModePhaseKind classifies a phase. Lane assignment, Operations Center
// column placement, and per-lane metric grouping key off this axis.
enum OperatingModePhaseKind {
  OPERATING_MODE_PHASE_KIND_UNSPECIFIED = 0;
  OPERATING_MODE_PHASE_KIND_INVESTIGATE = 1;
  OPERATING_MODE_PHASE_KIND_EXECUTE = 2;
  OPERATING_MODE_PHASE_KIND_REVIEW = 3;
  OPERATING_MODE_PHASE_KIND_RECONCILE = 4;
}

// OperatingModeGuardOp is the generic field-predicate operator vocabulary. Leaf
// ops compare a field-path against a value; ALWAYS is the unconditional edge;
// EXISTS/NOT_EXISTS test presence; ALL/ANY/NOT compose sub-guards into any
// boolean expression. This closed operator set expresses any phase DAG with no
// mode-specific branch kinds.
enum OperatingModeGuardOp {
  OPERATING_MODE_GUARD_OP_UNSPECIFIED = 0;
  OPERATING_MODE_GUARD_OP_ALWAYS = 1;
  OPERATING_MODE_GUARD_OP_EQ = 2;
  OPERATING_MODE_GUARD_OP_NE = 3;
  OPERATING_MODE_GUARD_OP_GT = 4;
  OPERATING_MODE_GUARD_OP_GTE = 5;
  OPERATING_MODE_GUARD_OP_LT = 6;
  OPERATING_MODE_GUARD_OP_LTE = 7;
  OPERATING_MODE_GUARD_OP_IN = 8;
  OPERATING_MODE_GUARD_OP_NOT_IN = 9;
  OPERATING_MODE_GUARD_OP_EXISTS = 10;
  OPERATING_MODE_GUARD_OP_NOT_EXISTS = 11;
  OPERATING_MODE_GUARD_OP_ALL = 12;
  OPERATING_MODE_GUARD_OP_ANY = 13;
  OPERATING_MODE_GUARD_OP_NOT = 14;
}

// OperatingModeOutputFieldType is the JSON type of a declared output field.
enum OperatingModeOutputFieldType {
  OPERATING_MODE_OUTPUT_FIELD_TYPE_UNSPECIFIED = 0;
  OPERATING_MODE_OUTPUT_FIELD_TYPE_STRING = 1;
  OPERATING_MODE_OUTPUT_FIELD_TYPE_BOOLEAN = 2;
  OPERATING_MODE_OUTPUT_FIELD_TYPE_INTEGER = 3;
  OPERATING_MODE_OUTPUT_FIELD_TYPE_NUMBER = 4;
  OPERATING_MODE_OUTPUT_FIELD_TYPE_OBJECT = 5;
  OPERATING_MODE_OUTPUT_FIELD_TYPE_ARRAY = 6;
}

// OperatingModeBacklogCapability enumerates what a mode may do to the backlog.
enum OperatingModeBacklogCapability {
  OPERATING_MODE_BACKLOG_CAPABILITY_UNSPECIFIED = 0;
  OPERATING_MODE_BACKLOG_CAPABILITY_READ_ONLY = 1;
  OPERATING_MODE_BACKLOG_CAPABILITY_PROPOSE_MUTATIONS = 2;
  OPERATING_MODE_BACKLOG_CAPABILITY_MARK_COMPLETE = 3;
  OPERATING_MODE_BACKLOG_CAPABILITY_CREATE_FOLLOWUPS = 4;
  OPERATING_MODE_BACKLOG_CAPABILITY_UPDATE_SCOPE = 5;
}

// OperatingModeApplyMode controls how reconcile proposals are committed. Only
// OPERATOR_GATED is implemented; the auto-apply variants fail loudly at the
// apply seam.
enum OperatingModeApplyMode {
  OPERATING_MODE_APPLY_MODE_UNSPECIFIED = 0;
  OPERATING_MODE_APPLY_MODE_OPERATOR_GATED = 1;
  OPERATING_MODE_APPLY_MODE_AUTO_APPLY_SAFE = 2;
  OPERATING_MODE_APPLY_MODE_AUTO_APPLY_ALL = 3;
}

// OperatingModeResultBindingKind is the kind of durable result binding.
enum OperatingModeResultBindingKind {
  OPERATING_MODE_RESULT_BINDING_KIND_UNSPECIFIED = 0;
  // Writes the round's progress state to a JSON artifact.
  OPERATING_MODE_RESULT_BINDING_KIND_PROGRESS_ARTIFACT = 1;
}

// OperatingMode is one operating mode expressed as data — identity + decision
// metadata, target (unit of work), run strategy, the phase graph, and
// per-concern policy blocks.
// Mirrors a `modes/<id>/mode.json` (schema kind: operating-mode).
message OperatingMode {
  // Stable mode id and the folder name under `modes/` (kebab-case).
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Human-facing mode name shown in the picker and detail page.
  string label = 2 [(buf.validate.field).string.min_len = 1];

  // One-paragraph description of the methodology and when to use it.
  string description = 3 [(buf.validate.field).string.min_len = 1];

  // Work shapes this mode is the right pick for (decision support; >=1).
  repeated string best_for = 4 [(buf.validate.field).repeated.min_items = 1];

  // Work shapes this mode handles poorly (>=1).
  repeated string not_for = 5 [(buf.validate.field).repeated.min_items = 1];

  // Structural tradeoffs an operator accepts by choosing this mode (>=1).
  repeated string tradeoffs = 6 [(buf.validate.field).repeated.min_items = 1];

  // Mode id to pick instead when unsure; empty when this mode is the safe
  // default. The engine verifies it references a registered mode and is not self.
  string when_in_doubt_pick_instead = 7;

  OperatingModeTarget target = 8;
  OperatingModeRunStrategy run_strategy = 9;

  // The phase state-machine. Absent for modes owned by the backlog execution
  // flow (run strategy existing_item_flow, i.e. item-level).
  OperatingModePhaseGraph phase_graph = 10;

  OperatingModePromptPolicy prompt = 11;
  OperatingModeArtifactPolicy artifact = 12;
  OperatingModeProfilePolicy profile = 13;
  OperatingModeBacklogSyncPolicy backlog_sync = 14;
  OperatingModeMetricsPolicy metrics = 15;
  OperatingModeLockPolicy lock = 16;
  OperatingModeUiPolicy ui = 17;

  // Optional semantic version of the mode document, independent of the schema id.
  string schema_version = 18;
}

// OperatingModeTarget declares the unit of work plus adapter-specific
// configuration. The nested plan_ref block is initiative-adapter
// configuration (the bound plan-manager plan contract), deliberately distinct
// from the plan-ref target kind.
message OperatingModeTarget {
  OperatingModeTargetKind kind = 1;
  OperatingModePlanRefPolicy plan_ref = 2;
}

// OperatingModePlanRefPolicy is the initiative adapter's bound-plan contract:
// when required, non-start phases refuse to run until the initiative binds a
// canonical plan-manager reference, consumed through the PLAN_CONTEXT_JSON
// read.
message OperatingModePlanRefPolicy {
  bool required = 1;
  // Semantic role of the referenced plan (operating_mode_plan).
  string role = 2;
}

// OperatingModeRunStrategy declares how rounds are dispatched and gated.
message OperatingModeRunStrategy {
  OperatingModeRunStrategyKind kind = 1;
}

// OperatingModePhaseGraph is the phase state-machine: nodes, start, terminals.
// The engine derives the static adjacency from the union of every transition's
// `to`.
message OperatingModePhaseGraph {
  // The first phase; must be one of `phases`.
  string start_phase = 1;
  // Phases that end the loop; each must be one of `phases`.
  repeated string terminal = 2;
  // The phase nodes, in a natural reading order.
  repeated OperatingModePhaseDefinition phases = 3 [(buf.validate.field).repeated.min_items = 1];
}

// OperatingModePhaseDefinition is one node in the phase graph.
message OperatingModePhaseDefinition {
  // Phase node id within the mode's graph.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  OperatingModePhaseKind kind = 2;

  // Sub-mode id that executes this phase (phase delegation, `executed_by`,
  // EXECUTION-MODES.md D3). Empty for regular phases. A delegated phase
  // declares NO reads/prompt/declared_output/artifacts/purposes/profile of
  // its own — the sub-mode's phases own the execution surface — and exactly
  // one composition level is allowed (the loader rejects nesting,
  // self-delegation, unknown sub-modes, and target-incompatible delegation).
  string executed_by = 16;

  // Stable activity purpose token for the spawned agent run (audit
  // provenance). Required on regular phases; empty on delegated phases (the
  // sub-mode's phases carry the purposes).
  string activity_purpose = 3;

  // The phase's declared input contract: the named variables its prompt
  // template may reference (generic-base provider ∪ target-adapter provider).
  // Load-validated against the mode's composed provider set.
  repeated string reads = 15;

  // Lock purpose token; defaults to activity_purpose when empty.
  string lock_purpose = 4;

  // Single predecessor phase whose completion auto-starts this phase (len <= 1).
  repeated string auto_start_after = 5 [(buf.validate.field).repeated.max_items = 1];

  // True when the phase's agent modifies the repository.
  bool writes_repo = 6;

  // True when the phase cannot start without initiative acceptance criteria.
  bool requires_criteria = 7;

  // AgentManager profile for this phase; falls back to the mode default.
  string profile_key = 8;

  OperatingModePhasePrompt prompt = 9;
  OperatingModeDeclaredOutput declared_output = 10;

  // Files the phase is expected to produce under the mode's artifact root.
  repeated OperatingModeArtifact output_artifacts = 11;

  // Bindings that persist a structured-result field into a durable artifact.
  repeated OperatingModeResultBinding result_bindings = 12;

  // Ordered guarded edges out of this phase; the first matching guard selects
  // the next phase(s). Empty for a terminal phase.
  repeated OperatingModeTransition transitions = 13;

  OperatingModePhaseMetrics metrics = 14;
}

// OperatingModePhasePrompt is prompt routing for a phase.
message OperatingModePhasePrompt {
  // Prompt template filename relative to the mode's `prompts/` folder.
  string template = 1;
  // Catalog/skill id suffix; the id is `<mode prompt.catalog_prefix>-<suffix>`.
  string suffix = 2;
  string title = 3;
  string trigger = 4;
  string purpose = 5;
}

// OperatingModeDeclaredOutput is the per-phase contract for what a round emits —
// the single artifact that validates a round's result AND steers the resolution
// ladder.
message OperatingModeDeclaredOutput {
  // Top-level JSON key the structured result nests under. Defaults to
  // "operating_mode_result".
  // @default "operating_mode_result"
  string envelope_key = 1;

  // Whether a structured result envelope is required at all.
  bool requires_structured_result = 2;

  // The declared fields of the structured result; guards reference these paths.
  repeated OperatingModeOutputField fields = 3;

  OperatingModeResolutionPolicy resolution = 4;
}

// OperatingModeOutputField is one declared output field: name/type/required/
// enum/bounds, with optional nested fields for object types.
message OperatingModeOutputField {
  // Field name, or dotted path for a nested leaf (e.g. "progress.decision").
  string name = 1 [(buf.validate.field).string.min_len = 1];

  OperatingModeOutputFieldType type = 2;

  // Whether L3 validation fails when the field is absent.
  bool required = 3;

  // Closed set of permitted values (scalars).
  repeated google.protobuf.Value enum_values = 4;

  // Inclusive numeric bounds (integer/number fields).
  optional double minimum = 5;
  optional double maximum = 6;

  // Length bounds (string/array fields).
  optional int64 min_length = 7;
  optional int64 max_length = 8;

  // What the field means; also steers the L2 classifier.
  string description = 9;

  // Nested fields for an object-typed field.
  repeated OperatingModeOutputField fields = 10;
}

// OperatingModeResolutionPolicy is per-phase resolution-ladder tuning.
message OperatingModeResolutionPolicy {
  // L0: scan the last N agent messages for the declared output shape to find the
  // true final message. False opts out (last message is treated as final).
  // @default true
  optional bool detect_true_final_message = 1;

  // How many trailing agent messages L0 scans.
  // @default 5
  optional int32 scan_last_n_messages = 2 [(buf.validate.field).int32.gte = 1];

  // L2: allow the AI-classifier fallback when L1 extraction cannot cleanly
  // extract. False makes an L1 miss an honest abstain with no model call.
  // @default true
  optional bool allow_classifier = 3;
}

// OperatingModeTransition is a guarded edge. When `when` matches the completed
// round's output, the loop routes to `to`.
message OperatingModeTransition {
  OperatingModeGuard when = 1;
  // Target phase(s). Empty = a guarded stop (no onward phase).
  repeated string to = 2;
}

// OperatingModeGuard is a generic field-predicate over a round's structured
// output. Leaf forms (EQ/NE/GT/GTE/LT/LTE/IN/NOT_IN/EXISTS/NOT_EXISTS) compare a
// field-path; ALWAYS always matches; ALL/ANY/NOT compose sub-guards. A guard's
// shape is determined by its `op`.
message OperatingModeGuard {
  OperatingModeGuardOp op = 1;

  // Dotted field-path the leaf op reads (e.g. "progress.decision"). Empty for
  // ALWAYS and the compose ops.
  string field = 2;

  // Scalar compared by EQ/NE/GT/GTE/LT/LTE.
  google.protobuf.Value value = 3;

  // Permitted values for IN/NOT_IN.
  repeated google.protobuf.Value values = 4;

  // Sub-guards for ALL/ANY (>=1) and NOT (exactly 1).
  repeated OperatingModeGuard guards = 5;
}

// OperatingModeArtifact is a file a phase produces or a binding writes.
message OperatingModeArtifact {
  // Path relative to the mode's artifact root.
  string path = 1 [(buf.validate.field).string.min_len = 1];
  // MIME type (e.g. text/markdown, application/json).
  string content_type = 2;
  // Whether the phase output contract requires this artifact.
  bool required = 3;
}

// OperatingModeResultBinding persists a structured-result field into a durable
// artifact.
message OperatingModeResultBinding {
  OperatingModeResultBindingKind kind = 1;
  OperatingModeArtifact artifact = 2;
}

// OperatingModePhaseMetrics carries per-phase flags aggregated into the mode's
// metrics policy.
message OperatingModePhaseMetrics {
  bool counts_replan_sample = 1;
  bool counts_acceptance_sample = 2;
}

// OperatingModePromptPolicy is mode-level prompt routing.
message OperatingModePromptPolicy {
  // Prefix for every phase's catalog/skill id.
  string catalog_prefix = 1;
}

// OperatingModeArtifactPolicy is mode-level artifact roots.
message OperatingModeArtifactPolicy {
  // Base directory for mode artifacts (e.g. modes/holistic-loop).
  string root = 1;
  // Per-round artifact directory; defaults to `<root>/rounds`.
  string round_root = 2;
}

// OperatingModeProfilePolicy is mode-level profile defaults.
message OperatingModeProfilePolicy {
  // Fallback AgentManager profile for phases that don't declare one.
  string default_profile_key = 1;
}

// OperatingModeBacklogSyncPolicy declares how a mode reads and reconciles the
// initiative backlog.
message OperatingModeBacklogSyncPolicy {
  repeated OperatingModeBacklogCapability capabilities = 1;
  bool requires_run_id = 2;
  bool requires_membership = 3;
  // Event-source tag; defaults to the mode id.
  string event_source = 4;
  // How reconcile proposals are committed; required on initiative-scoped modes.
  OperatingModeApplyMode apply_mode = 5;
}

// OperatingModeMetricsPolicy is mode-level metrics configuration. Sample-phase
// lists are derived from per-phase metrics flags.
message OperatingModeMetricsPolicy {
  // Event-source tag; defaults to the mode id.
  string event_source = 1;
  // Verdict strings that count as acceptance (case-insensitive at match time).
  repeated string accepted_verdicts = 2;
}

// OperatingModeLockPolicy is the initiative locking posture.
message OperatingModeLockPolicy {
  // True when only one mode round may run against the initiative at a time.
  bool initiative_exclusive = 1;
}

// OperatingModeUiPolicy carries UI surfacing hints.
message OperatingModeUiPolicy {
  // Which initiative workspace tab this mode's controls render under.
  string workspace_tab_id = 1;
}

// OperatingModeExampleRun is a mode-owned simulation fixture: it seeds each
// step's phase output and asserts the phase path the real generic guard
// evaluator produces. Mirrors an `example-runs/*.json` (schema kind:
// operating-mode-example-run). Never spawns agents, acquires locks, or persists
// state.
message OperatingModeExampleRun {
  // Preset id; the fixture's stable handle (e.g. "replan-loop").
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // The mode this fixture exercises.
  string mode = 2 [(buf.validate.field).string.min_len = 1];
  // Human-facing preset name shown in the Flow tab's data-source control.
  string label = 3;
  // What branch/scenario this preset illustrates.
  string description = 4;
  // Ordered seeded rounds. The walk starts at the mode's start_phase.
  repeated OperatingModeExampleRunStep steps = 5;
  // The exact ordered phase path the guards must produce for this fixture.
  repeated string expected_path = 6 [(buf.validate.field).repeated.min_items = 1];
}

// OperatingModeExampleRunStep is one seeded round in an example-run.
message OperatingModeExampleRunStep {
  // The phase this step runs; must be a declared phase of the mode.
  string phase = 1 [(buf.validate.field).string.min_len = 1];
  // Seeded structured output for this round (declared_output envelope contents),
  // fed to the source phase's transition guards.
  google.protobuf.Struct output = 2;
  // Optional human note explaining what this step demonstrates.
  string note = 3;
}
