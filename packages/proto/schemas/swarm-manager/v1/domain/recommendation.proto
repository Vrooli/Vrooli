syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/domain;domain";

// =============================================================================
// RECOMMENDATIONS DOMAIN
// =============================================================================
//
// @layer 1
// @domain recommendations
// @imports none (external only: buf.validate)
// @stability beta
//
// Recommendations capture improvement suggestions generated by Swarm Manager
// for scenarios, including optional metadata when a recommendation is started.
//
// USAGE CONTEXTS:
//   - API responses for recommendations endpoints
//   - UI data models (recommendations list and details)
//
// =============================================================================

// Recommendation represents a suggestion for improving a scenario.
message Recommendation {
  // Unique identifier.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Target scenario name.
  string scenario_name = 2 [(buf.validate.field).string.min_len = 1];

  // Recommendation type: test, feature, refactor, docs.
  string type = 3 [(buf.validate.field).string = { in: ["test", "feature", "refactor", "docs"] }];

  // Human-readable recommendation description.
  string description = 4 [(buf.validate.field).string.min_len = 1];

  // Recommendation status: pending, approved, rejected.
  string status = 5 [(buf.validate.field).string = { in: ["pending", "approved", "rejected"] }];

  // Priority level (1 = highest, 5 = lowest).
  int32 priority = 6 [(buf.validate.field).int32 = { gte: 1, lte: 5 }];

  // RFC3339 timestamp of creation.
  // @format rfc3339
  string created = 7 [(buf.validate.field).string.min_len = 1];

  // Source of the recommendation (generated, manual).
  optional string source = 8;

  // Optional agent-manager task id when started.
  optional string task_id = 9;

  // Optional agent-manager run id when started.
  optional string run_id = 10;

  // RFC3339 timestamp when started.
  // @format rfc3339
  optional string started_at = 11;

  // Source of start action (user, yolo).
  optional string started_by = 12;

  // Whether auto-approved in yolo mode.
  optional bool auto_approved = 13;
}
