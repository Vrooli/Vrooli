syntax = "proto3";

package vrooli.swarm_manager.v1.domain;

import "buf/validate/validate.proto";
import "swarm-manager/v1/shared/agent_session.proto";
import "swarm-manager/v1/shared/plan_ref.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/domain;domain";

// =============================================================================
// BACKLOG DOMAIN
// =============================================================================
//
// @stability beta
//
// Backlog items capture all work types for Swarm Manager:
// ideas, research, fixes, and execution tasks. Items are stored as
// git-tracked folders under their kind-specific directories.
//
// USAGE CONTEXTS:
//   - API responses for backlog CRUD endpoints
//   - UI data models (backlog list and details)
//
// =============================================================================

// BacklogItem represents a tracked unit of work for the swarm.
message BacklogItem {
  // Unique identifier (folder name).
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable title.
  string title = 2 [(buf.validate.field).string.min_len = 1];

  // Detailed description of the work item.
  string description = 3;

  // Lifecycle state for the backlog item.
  //
  // Intentionally NOT constrained to an inline allowlist. The vocabulary's
  // single source of truth is the server's status table
  // (swarm-manager/api/internal/backlogstatus/statuses.go), which validates
  // every write. Duplicating the list here meant adding a status required
  // editing three .proto files in lockstep, and they had already drifted apart
  // — one omitted `suggested` and admitted a bogus `archived`.
  string status = 4 [(buf.validate.field).string.min_len = 1];

  // Priority level (1 = highest, 10 = lowest).
  // @constraint 1-10
  int32 priority = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];

  // Categorization tags.
  repeated string tags = 6 [(buf.validate.field).repeated = {unique: true}];

  // RFC3339 timestamp of creation.
  // @format rfc3339
  string created = 7 [(buf.validate.field).string.min_len = 1];

  // RFC3339 timestamp of last update.
  // @format rfc3339
  string updated = 8 [(buf.validate.field).string.min_len = 1];

  // Backlog kind: idea, research, fix, execute.
  string kind = 9 [(buf.validate.field).string = {
    in: [
      "idea",
      "research",
      "fix",
      "execute",
      "chore"
    ]
  }];

  reserved 10; // research_target — removed; research items execute directly.

  // Dependencies as "kind/name" references. Item won't process until all deps complete.
  repeated string depends_on = 11;

  // Owned goal/milestone reference this item belongs to.
  optional string milestone = 12;

  // Effort estimate: XS, S, M, L, XL.
  optional string effort = 13 [(buf.validate.field).string = {
    in: [
      "XS",
      "S",
      "M",
      "L",
      "XL"
    ]
  }];

  reserved 14; // scope — removed; acceptance_allow/deny are the sole boundary definitions.

  // Glob patterns for file paths expected to be modified (e.g., ["scenarios/web-console/api/**"]).
  // Used as sandbox acceptance allowlist, post-execution review targeting, and scenario identification.
  repeated string acceptance_allow = 15;

  // Glob patterns for file paths that must NOT be modified (e.g., ["api/internal/auth/**"]).
  // Used as sandbox acceptance denylist.
  repeated string acceptance_deny = 16;

  // Origin reference in "kind/name" format, tracking which item spawned this one.
  optional string spawned_from = 17;

  // Personal annotation — a user note for tracking context (e.g., why the item is paused).
  optional string note = 18;

  // RFC3339 timestamp when the item was archived. Null/unset means not archived.
  // Archiving is orthogonal to status — items retain their terminal status when archived.
  // @format rfc3339
  optional string archived_at = 19;

  reserved 20; // plan_validation_json — removed; plan quality is owned by plan-manager.

  // Skill IDs recommended by the creating agent. Workshop and execution agents
  // should read these skills before proceeding.
  repeated string suggested_skills = 21;

  // Glob patterns for file paths the work plans to create. Same syntax as
  // acceptance_allow. Used by the workshop validator to allow forward-looking
  // paths in acceptance_allow that don't yet exist on disk. Absence means
  // "no declared new paths."
  repeated string creates = 22;

  // Verified provenance for the actor/session that created this item.
  optional shared.AgentSessionAttribution created_by = 23;

  // Items-ahead in the pending queue: this item's zero-based index within the
  // ranked pending set (backlogrank order). Surfaced on CreateItem/GetItem so
  // feedback-contract consumers can show "N items ahead" without computing the
  // ranking themselves. Unset when the item is not pending (e.g. completed,
  // failed, in_progress, archived) — there is no position to report.
  // @constraint 0+
  optional int32 queue_position = 24 [(buf.validate.field).int32.gte = 0];

  // Canonical plan-manager plan backing this work item.
  optional shared.PlanRef plan_ref = 25;

  // Stable programmatic finding ID that produced this item, when auto-filed.
  optional string finding_ref = 26;

  // Deterministic operator signal. It is computed on read from item age,
  // review age, plan/acceptance validity, and is never persisted in spec.json.
  bool stale = 27;

  // Most recent explicit decision that the item remains valid without a
  // content mutation. This is distinct from `updated`, which tracks changes
  // to the work specification itself.
  optional BacklogReviewRecord last_review = 28;

  // Explicit operator authorization for the current canonical plan frontier.
  // A changed content hash or work-contract version makes this record stale.
  optional PlanAcceptance plan_acceptance = 29;
}

message PlanAcceptance {
  string actor = 1 [(buf.validate.field).string.min_len = 1];
  string accepted_at = 2 [(buf.validate.field).string.min_len = 1];
  string plan_content_hash = 3 [(buf.validate.field).string.min_len = 1];
  string subject_version = 4 [(buf.validate.field).string.min_len = 1];
}

message BacklogReviewRecord {
  // RFC3339 timestamp of the accepted review.
  string reviewed_at = 1 [(buf.validate.field).string.min_len = 1];

  // Source session and proposal preserve an auditable decision trail.
  string session_id = 2 [(buf.validate.field).string.min_len = 1];
  string proposal_id = 3 [(buf.validate.field).string.min_len = 1];

  // The reviewer-facing rationale for keeping the item unchanged.
  string rationale = 4;
}


// =============================================================================
// CLARIFICATION DOMAIN
// =============================================================================
//
// @stability beta
//
// Clarification threads capture multi-turn conversations between operators and
// agents about individual workshop decision items. Each thread is scoped to a
// single decision within a single workshop round.
//
// =============================================================================

// ClarificationMessage is a single turn in a clarification conversation.
message ClarificationMessage {
  // Who sent this message.
  // @constraint one of: user, assistant
  string role = 1 [(buf.validate.field).string = {
    in: [
      "user",
      "assistant"
    ]
  }];

  // Message content (markdown text).
  string content = 2;

  // RFC3339 timestamp.
  // @format rfc3339
  string created_at = 3 [(buf.validate.field).string.min_len = 1];

  // Optional attachment IDs (uploaded via agent-manager).
  repeated string attachment_ids = 4;
}

// ClarificationImpact is the structured impact assessment parsed from an
// assistant's clarification response.
message ClarificationImpact {
  // Impact level of the clarification on the workshop.
  // @constraint one of: none, decision, round
  string level = 1 [(buf.validate.field).string = {
    in: [
      "none",
      "decision",
      "round"
    ]
  }];

  // Why this impact level was chosen.
  string reasoning = 2;

  // Distilled learning about the user's intent, carried forward to future rounds.
  string context_note = 3;

  // Suggested rewrite of the decision item (topic/context/options) if applicable.
  string suggested_update = 4;
}

// ClarificationThread stores the full conversation for a single decision item.
message ClarificationThread {
  // Unique thread identifier.
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // Workshop round this clarification belongs to.
  int32 round_number = 2 [(buf.validate.field).int32.gte = 1];

  // Decision item ID within the round.
  string item_id = 3 [(buf.validate.field).string.min_len = 1];

  // Agent-manager run ID for continue-run support.
  string run_id = 4;

  // Ordered conversation messages.
  repeated ClarificationMessage messages = 5;

  // Parsed impact from the latest assistant response (nil if unparseable).
  optional ClarificationImpact latest_impact = 6;

  // Thread lifecycle state.
  // @constraint one of: active, resolved, dismissed
  string status = 7 [(buf.validate.field).string = {
    in: [
      "active",
      "resolved",
      "dismissed"
    ]
  }];

  // RFC3339 timestamp of thread creation.
  // @format rfc3339
  string created_at = 8 [(buf.validate.field).string.min_len = 1];

  // RFC3339 timestamp of last update.
  // @format rfc3339
  string updated_at = 9 [(buf.validate.field).string.min_len = 1];
}
