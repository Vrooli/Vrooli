syntax = "proto3";

package vrooli.swarm_manager.v1.domain;

import "buf/validate/validate.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/domain;domain";

// =============================================================================
// SETTINGS DOMAIN
// =============================================================================
//
// @stability beta
//
// User-configurable settings for Swarm Manager. These values are persisted
// locally and surfaced through the settings API for the UI.
//
// USAGE CONTEXTS:
//   - API responses for settings endpoints
//   - UI data models (settings page)
//
// =============================================================================

// Confirmation level for delete operations.
enum DeleteConfirmLevel {
  // Unset value. Runtime settings normalize this to the system default for the
  // entity type, which is currently simple confirmation for missing values.
  DELETE_CONFIRM_LEVEL_UNSPECIFIED = 0;
  // Simple OK/Cancel dialog.
  DELETE_CONFIRM_LEVEL_SIMPLE = 1;
  // No confirmation — delete immediately on click.
  DELETE_CONFIRM_LEVEL_NONE = 2;
  // Strong confirmation — user must type the entity name.
  DELETE_CONFIRM_LEVEL_STRONG = 3;
}

// Per-entity-type delete confirmation settings.
//
// DEPRECATED: replaced by the open-ended Settings.delete_confirmation_levels
// map keyed by entity-type string. Retained only so older persisted JSON and
// any in-flight clients keep parsing; new code must use the map. No field of
// this message is read by the current API.
message DeleteConfirmationSettings {
  DeleteConfirmLevel backlog = 1;
  DeleteConfirmLevel initiative = 2;
  DeleteConfirmLevel capture = 3;
}

// AutoFilerSettings controls governed automatic filing of maintenance findings
// into the backlog.
message AutoFilerSettings {
  bool enabled = 1;
  string mode = 2 [(buf.validate.field).string = {
    in: [
      "suggest",
      "auto_add"
    ]
  }];
  string strategy = 3 [(buf.validate.field).string = {
    in: [
      "feature_pending",
      "importance"
    ]
  }];
  int32 max_open_auto_filed = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 velocity_window_days = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 90
  }];
  int32 min_velocity_transitions = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }];
  int32 interval_minutes = 7 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1440
  }];
  string goal_name = 8 [(buf.validate.field).string.min_len = 1];
}

// Settings captures persisted configuration for Swarm Manager.
message Settings {
  // UI theme preference.
  string theme = 1 [(buf.validate.field).string = {
    in: [
      "dark",
      "light",
      "system"
    ]
  }];

  reserved 2, 3, 4;

  // Execution defaults (absorbed from ExecutionPolicy).
  string default_mode = 5 [(buf.validate.field).string = {
    in: [
      "manual",
      "yolo"
    ]
  }];
  reserved 6;
  bool auto_fixup = 7;
  int32 max_fixup_attempts = 8 [(buf.validate.field).int32 = {
    gte: 0
    lte: 5
  }];
  bool review_agent_enabled = 31;

  // Retired workshop automation fields. Workshops are now explicitly started
  // by an operator and are represented by Plan Workshop sessions.
  reserved 9, 16, 17, 18, 32;
  reserved "max_auto_rounds", "auto_initialize_workshop", "auto_advance_workshop", "auto_cascade_workshop", "auto_advance_delay_seconds";

  // Agent behavior settings.
  int32 agent_max_turns = 10 [(buf.validate.field).int32 = {
    gte: 5
    lte: 1000
  }];
  int32 agent_timeout_seconds = 11 [(buf.validate.field).int32 = {
    gte: 60
    lte: 3600
  }];
  reserved 12;
  reserved "agent_requires_approval";

  // UI preference settings.
  int32 search_debounce_ms = 13 [(buf.validate.field).int32 = {
    gte: 100
    lte: 2000
  }];
  int32 toast_duration_ms = 14 [(buf.validate.field).int32 = {
    gte: 1000
    lte: 30000
  }];
  reserved 15;
  reserved "confirm_destructive_actions";
  // Field 33 held the fixed-shape DeleteConfirmationSettings message
  // (backlog/initiative/capture). Replaced by the open-ended map below so any
  // deletable entity type can carry its own level. Reserved to prevent reuse.
  reserved 33;
  reserved "delete_confirmation";
  // Per-entity-type delete confirmation levels, keyed by entity-type string
  // (the UI's DeletableEntityType: "session", "scenario", "backlog",
  // "initiative", "capture", "backlogFile", ...). Missing keys default to the
  // entity's registry default. Unknown keys are preserved on save for
  // forward-compatibility with newer UIs.
  map<string, DeleteConfirmLevel> delete_confirmation_levels = 37;

  // Review thresholds.
  double review_code_quality_min_score = 19 [(buf.validate.field).double = {
    gte: 0
    lte: 100
  }];
  double review_test_min_pass_rate = 20 [(buf.validate.field).double = {
    gte: 0
    lte: 1
  }];
  int32 review_max_blocking_violations = 21 [(buf.validate.field).int32.gte = 0];
  int32 review_max_warnings = 22 [(buf.validate.field).int32.gte = -1];
  bool review_require_screenshots = 23;
  bool review_require_tests = 24;

  // Concurrency and governance settings.
  // Per-phase-kind concurrency caps. Keys are lane names matching
  // operatingmode.PhaseKind values: "investigate", "execute", "review",
  // "reconcile". Replaces the legacy single global cap (reserved 25).
  map<string, int32> lane_concurrency_limits = 34;
  int32 max_queue_depth = 26 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  int32 circuit_breaker_threshold = 27 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];
  int32 circuit_breaker_cooldown_minutes = 28 [(buf.validate.field).int32 = {
    gte: 5
    lte: 1440
  }];
  double execution_cost_cap_per_run = 29 [(buf.validate.field).double.gte = 0];
  double cost_per_turn_estimate = 30 [(buf.validate.field).double = {
    gte: 0
    lte: 5
  }];

  // Fix-before-feature gate. "off" | "suggest" (default) | "block": when a
  // feature item (kind=execute) is queued onto a scenario with open fix/chore
  // items, advise or block accordingly.
  string fix_before_feature = 35 [(buf.validate.field).string = {
    in: [
      "off",
      "suggest",
      "block"
    ]
  }];
  AutoFilerSettings auto_filer = 38;

  reserved 25, 36;
  reserved "max_concurrent_executions";
}
