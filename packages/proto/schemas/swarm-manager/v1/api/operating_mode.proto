syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/api;api";

// =============================================================================
// OPERATING MODE SERVICE (Connect RPC)
// =============================================================================
//
// @layer 5
// @domain api
// @imports none (external only: buf.validate, google.protobuf.struct)
// @stability experimental
//
// Typed contract for the swarm-manager operating-mode subsystem — the catalog,
// per-initiative workspace, phase rounds, simulation, and prompt-render
// surfaces the UI and CLI consume. This replaces the bespoke gorilla/mux JSON
// surface (`writeOperatingModeJSON`) so cross-boundary calls flow through Proto
// + Connect like swarm-manager's other domains (backlog, audio, discovery,
// measures).
//
// These messages are the OPERATIONAL PROJECTIONS the engine serves at runtime
// (usage counts, live rounds, startability, readiness scores). The mode-as-DATA
// authoring vocabulary — the shape of a `modes/<id>/mode.json` — lives in
// `swarm-manager/v1/domain/operating_mode.proto`; the two are distinct layers
// (definition vs. projection) and are intentionally not shared.
//
// Doctrine and vocabulary: scenarios/swarm-manager/docs/concepts/EXECUTION-MODES.md
//
// =============================================================================

// OperatingModeService is the Connect surface for the operating-mode subsystem.
// Every RPC is unary; the mode/initiative/round selectors that were path
// parameters on the REST surface are request fields here.
service OperatingModeService {
  // Catalog lists every registered mode with overlay merged in and current
  // usage counts. Backs the Operating Modes sidebar.
  rpc Catalog(OperatingModeCatalogRequest) returns (OperatingModeCatalogResponse);

  // GetMode returns a single mode's catalog entry plus the initiatives bound to
  // it. Backs the operating-mode details page.
  rpc GetMode(OperatingModeGetRequest) returns (OperatingModeDetailResponse);

  // UpdateMode persists user-editable overlay fields (label, description).
  rpc UpdateMode(OperatingModeUpdateRequest) returns (OperatingModeDetailResponse);

  // SimulateMode deterministically walks a phase-based mode against an ephemeral
  // mock initiative, returning the same round projection live rounds use — no
  // locks, agents, or artifacts.
  rpc SimulateMode(OperatingModeSimulateRequest) returns (OperatingModeSimulationResponse);

  // RenderSimulationPrompt renders the literal agent prompt for one step of a
  // preset simulation trace with fixture data substituted.
  rpc RenderSimulationPrompt(OperatingModeRenderSimulationRequest) returns (OperatingModeRenderPromptResponse);

  // GetWorkspace returns the initiative-scoped mode workspace (definition, lock,
  // artifacts, rounds).
  rpc GetWorkspace(OperatingModeWorkspaceRequest) returns (OperatingModeWorkspace);

  // SwitchMode changes the initiative's active mode, optionally cancelling
  // in-flight item executions.
  rpc SwitchMode(OperatingModeSwitchRequest) returns (OperatingModeSwitchResult);

  // StartPhase reserves and dispatches a round for one phase of a linked
  // initiative.
  rpc StartPhase(OperatingModeStartPhaseRequest) returns (OperatingModeRoundEnvelope);

  // RenderLivePrompt renders the literal agent prompt for one phase of a real
  // linked initiative with its live data substituted.
  rpc RenderLivePrompt(OperatingModeRenderLiveRequest) returns (OperatingModeRenderPromptResponse);

  // RefreshRound re-reads a round's agent run state and advances its status.
  rpc RefreshRound(OperatingModeRoundActionRequest) returns (OperatingModeRoundEnvelope);

  // CancelRound cancels a reserved or running round.
  rpc CancelRound(OperatingModeRoundActionRequest) returns (OperatingModeRoundEnvelope);

  // CompleteItems marks the named backlog items complete against a round.
  rpc CompleteItems(OperatingModeCompleteItemsRequest) returns (OperatingModeBacklogSyncResult);

  // ApplyBacklogSync applies an operator-accepted reconcile proposal for a round.
  rpc ApplyBacklogSync(OperatingModeApplyBacklogSyncRequest) returns (OperatingModeBacklogSyncResult);

  // ScaffoldMode writes a new mode folder (mode.json + a happy-path example-run)
  // from the built-in template. Self-serve authoring entry point — the mode is
  // simulatable immediately and executable after a restart, with no Go edits.
  rpc ScaffoldMode(OperatingModeScaffoldRequest) returns (OperatingModeScaffoldResponse);

  // ValidateMode loads a mode fresh from disk through the real loader/validator
  // and reports whether it is valid, so an author gets immediate structural
  // feedback without a restart.
  rpc ValidateMode(OperatingModeValidateRequest) returns (OperatingModeValidateResponse);
}

// -----------------------------------------------------------------------------
// Requests
// -----------------------------------------------------------------------------

// OperatingModeCatalogRequest has no parameters; the catalog is global.
message OperatingModeCatalogRequest {}

// OperatingModeGetRequest selects one mode by id.
message OperatingModeGetRequest {
  string mode = 1 [(buf.validate.field).string.min_len = 1];
}

// OperatingModeUpdateRequest edits overlay fields. Absent fields are left
// unchanged; label may not be set to empty.
message OperatingModeUpdateRequest {
  string mode = 1 [(buf.validate.field).string.min_len = 1];
  optional string label = 2;
  optional string description = 3;
}

// OperatingModeSimulateRequest selects a mode and (optionally) a preset; an
// empty preset resolves to the mode's happy path. When draft is set the mode is
// loaded fresh from disk instead of the process registry, so an author can
// simulate a scaffolded, not-yet-registered mode without a restart.
message OperatingModeSimulateRequest {
  string mode = 1 [(buf.validate.field).string.min_len = 1];
  string preset = 2;
  bool draft = 3;
}

// OperatingModeScaffoldRequest names the mode to create. Only id is required;
// label/description default from the id. force overwrites an existing folder.
message OperatingModeScaffoldRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string label = 2;
  string description = 3;
  bool force = 4;
}

// OperatingModeValidateRequest selects a mode to validate from disk.
message OperatingModeValidateRequest {
  string mode = 1 [(buf.validate.field).string.min_len = 1];
}

// OperatingModeRenderSimulationRequest selects one step of a preset trace to
// render.
message OperatingModeRenderSimulationRequest {
  string mode = 1 [(buf.validate.field).string.min_len = 1];
  string preset = 2;
  int32 step_index = 3;
}

// OperatingModeWorkspaceRequest selects an initiative's mode workspace.
message OperatingModeWorkspaceRequest {
  string initiative_name = 1 [(buf.validate.field).string.min_len = 1];
}

// OperatingModeSwitchRequest changes an initiative's active mode.
message OperatingModeSwitchRequest {
  string initiative_name = 1 [(buf.validate.field).string.min_len = 1];
  string mode = 2 [(buf.validate.field).string.min_len = 1];
  bool cancel_active_item_executions = 3;
  string requested_by = 4;
}

// OperatingModeStartPhaseRequest dispatches a round for a phase.
message OperatingModeStartPhaseRequest {
  string initiative_name = 1 [(buf.validate.field).string.min_len = 1];
  string phase = 2 [(buf.validate.field).string.min_len = 1];
  string note = 3;
  bool override = 4;
  string requested_by = 5;
}

// OperatingModeRenderLiveRequest renders a live phase prompt for an initiative.
message OperatingModeRenderLiveRequest {
  string initiative_name = 1 [(buf.validate.field).string.min_len = 1];
  string phase = 2 [(buf.validate.field).string.min_len = 1];
  int32 round = 3;
  string note = 4;
}

// OperatingModeRoundActionRequest addresses one round of an initiative for
// refresh/cancel. Mode is optional; the server resolves it from the initiative
// when empty.
message OperatingModeRoundActionRequest {
  string initiative_name = 1 [(buf.validate.field).string.min_len = 1];
  string mode = 2;
  int32 round = 3 [(buf.validate.field).int32.gt = 0];
}

// OperatingModeCompleteItemsRequest marks backlog items complete against a round.
message OperatingModeCompleteItemsRequest {
  string initiative_name = 1 [(buf.validate.field).string.min_len = 1];
  string mode = 2;
  int32 round = 3 [(buf.validate.field).int32.gt = 0];
  string run_id = 4 [(buf.validate.field).string.min_len = 1];
  repeated string item_refs = 5;
  string requested_by = 6;
}

// OperatingModeApplyBacklogSyncRequest applies an accepted reconcile proposal.
message OperatingModeApplyBacklogSyncRequest {
  string initiative_name = 1 [(buf.validate.field).string.min_len = 1];
  string mode = 2;
  int32 round = 3 [(buf.validate.field).int32.gt = 0];
  string run_id = 4 [(buf.validate.field).string.min_len = 1];
  repeated string accepted_mutation_ids = 5;
  string requested_by = 6;
}

// -----------------------------------------------------------------------------
// Shared projection building blocks
// -----------------------------------------------------------------------------

// OperatingModeCapabilities flags what a mode's runtime supports; drives which
// operator affordances the UI renders.
message OperatingModeCapabilities {
  bool supports_phases = 1;
  bool can_start_phases = 2;
  bool can_complete_items = 3;
  bool can_apply_backlog_sync_proposals = 4;
  bool requires_acceptance_criteria = 5;
  bool supports_artifacts = 6;
  bool supports_handoffs = 7;
  bool uses_item_execution_flow = 8;
}

// OperatingModeArtifactDefinition is a declared output file (projection view).
message OperatingModeArtifactDefinition {
  string path = 1;
  string content_type = 2;
  bool required = 3;
}

// OperatingModeResultBindingSummary projects a phase's durable result binding;
// kind is a stable token (e.g. "progress_artifact").
message OperatingModeResultBindingSummary {
  string kind = 1;
  OperatingModeArtifactDefinition artifact = 2;
}

// OperatingModePhaseOutputContractSummary is the flat catalog view of a phase's
// output contract; per-artifact metadata lives on the phase's output_artifacts.
message OperatingModePhaseOutputContractSummary {
  bool requires_structured_result = 1;
  bool requires_progress = 2;
  bool requires_verdict = 3;
  bool requires_handoff = 4;
  bool requires_backlog_sync = 5;
  int32 required_artifact_count = 6;
}

// OperatingModeReadinessDimension is one scored readiness axis.
message OperatingModeReadinessDimension {
  string key = 1;
  string label = 2;
  double score = 3;
  string rationale = 4;
}

// OperatingModeReadinessReport is a round's aggregate readiness assessment.
message OperatingModeReadinessReport {
  repeated OperatingModeReadinessDimension dimensions = 1;
  double overall_score = 2;
  bool ready = 3;
}

// OperatingModeHandoff is the durable context one round hands to the next.
message OperatingModeHandoff {
  string summary = 1;
  repeated string completed_phases = 2;
  repeated string changed_files = 3;
  repeated string tests = 4;
  repeated string blockers = 5;
  string next_step = 6;
  string created_at = 7;
}

// OperatingModeRoundItem is one backlog item attached to a round.
message OperatingModeRoundItem {
  string ref = 1;
  string title = 2;
  string status = 3;
  int32 priority = 4;
  string effort = 5;
}

// OperatingModeArtifactUpdate records an artifact a round produced/refreshed.
message OperatingModeArtifactUpdate {
  string path = 1;
  string content_type = 2;
  bool required = 3;
  string updated_at = 4;
  string source = 5;
}

// OperatingModeArtifactSnapshot is a stored artifact's content + metadata.
message OperatingModeArtifactSnapshot {
  string path = 1;
  string content_type = 2;
  bool required = 3;
  string content = 4;
  string updated_at = 5;
  int64 size_bytes = 6;
}

// OperatingModeInitiativeSnapshot is the compact initiative view fixtures and
// live rounds carry.
message OperatingModeInitiativeSnapshot {
  string name = 1;
  string title = 2;
  string description = 3;
  string mode = 4;
  repeated string items = 5;
  repeated string acceptance_criteria = 6;
}

// OperatingModeProgressState is a round's progress decision snapshot.
message OperatingModeProgressState {
  string decision = 1;
  repeated string completed_phases = 2;
  string current_phase = 3;
  string rationale = 4;
  string updated_at = 5;
}

// OperatingModeArtifactResult is an artifact emitted in a phase result.
message OperatingModeArtifactResult {
  string path = 1;
  string content = 2;
  string content_type = 3;
}

// OperatingModeBacklogSyncPlan is a phase result's proposed backlog changes.
message OperatingModeBacklogSyncPlan {
  repeated string completed_items = 1;
  repeated string created_items = 2;
  repeated string updated_items = 3;
  // Opaque reconcile proposal, structured per the backlog reconcile contract.
  google.protobuf.Struct proposal = 4;
  string rationale = 5;
}

// -----------------------------------------------------------------------------
// Round envelope
// -----------------------------------------------------------------------------

// OperatingModeRoundEnvelope is the durable record of one dispatched round —
// the shared projection StartPhase/RefreshRound/CancelRound return and the
// workspace lists.
message OperatingModeRoundEnvelope {
  int32 round = 1;
  string mode = 2;
  string scope_kind = 3;
  string scope_id = 4;
  string initiative_name = 5;
  string phase = 6;
  string run_strategy = 7;
  string agent_profile_key = 8;
  string generated_at = 9;
  string run_id = 10;
  string status = 11;
  OperatingModeReadinessReport readiness = 12;
  repeated OperatingModeRoundItem items = 13;
  repeated OperatingModeArtifactUpdate artifact_updates = 14;
  repeated OperatingModeHandoff handoffs = 15;
  // Free-form structured payload carried through from the round's agent result.
  google.protobuf.Struct payload = 16;
  string error = 17;
}

// -----------------------------------------------------------------------------
// Catalog + detail
// -----------------------------------------------------------------------------

// OperatingModeCatalogPhase projects one phase inside a mode's catalog entry.
message OperatingModeCatalogPhase {
  string phase = 1;
  string phase_kind = 2;
  string label = 3;
  string title = 4;
  string purpose = 5;
  string trigger = 6;
  string profile_key = 7;
  bool writes_repo = 8;
  bool requires_criteria = 9;
  bool is_start = 10;
  bool is_terminal = 11;
  repeated OperatingModeArtifactDefinition output_artifacts = 12;
  OperatingModePhaseOutputContractSummary output_contract = 13;
  string catalog_id = 14;
  string skill_id = 15;
  string activity_purpose = 16;
  string lock_purpose = 17;
  repeated OperatingModeResultBindingSummary result_bindings = 18;
  bool samples_replan_rate = 19;
  bool samples_acceptance_rate = 20;
  repeated string auto_start_after = 21;
}

// OperatingModeCatalogTransition is one rendered edge of a mode's phase graph.
message OperatingModeCatalogTransition {
  string from = 1;
  string to = 2;
  string condition_kind = 3;
  string label = 4;
  string field = 5;
  string value = 6;
}

// OperatingModeCatalogPhaseGraph carries a mode's phase graph for DAG rendering.
message OperatingModeCatalogPhaseGraph {
  string start_phase = 1;
  repeated string terminal = 2;
  repeated OperatingModeCatalogTransition transitions = 3;
  repeated string accepted_verdicts = 4;
}

// OperatingModeCatalogEntry is a single mode's overlay-merged catalog projection.
message OperatingModeCatalogEntry {
  string mode = 1;
  string label = 2;
  string description = 3;
  repeated string best_for = 4;
  repeated string not_for = 5;
  repeated string tradeoffs = 6;
  string when_in_doubt_pick_instead = 7;
  int32 usage_count = 8;
  string scope_kind = 9;
  string run_strategy = 10;
  string workspace_tab_id = 11;
  OperatingModeCapabilities capabilities = 12;
  bool default = 13;
  bool switchable = 14;
  bool supports_phases = 15;
  repeated OperatingModeCatalogPhase phases = 16;
  OperatingModeCatalogPhaseGraph phase_graph = 17;
}

// OperatingModeCatalogResponse is the full mode catalog.
message OperatingModeCatalogResponse {
  repeated OperatingModeCatalogEntry modes = 1;
}

// OperatingModeInitiativeRef is the compact view of an initiative bound to a
// mode.
message OperatingModeInitiativeRef {
  string name = 1;
  string title = 2;
  string status = 3;
  string updated = 4;
}

// OperatingModeDetailResponse pairs a mode's catalog entry with the initiatives
// bound to it.
message OperatingModeDetailResponse {
  OperatingModeCatalogEntry entry = 1;
  repeated OperatingModeInitiativeRef linked_initiatives = 2;
}

// -----------------------------------------------------------------------------
// Workspace
// -----------------------------------------------------------------------------

// OperatingModeStringList wraps a repeated string so it can be a proto map value
// (the transitions adjacency: phase -> next phases).
message OperatingModeStringList {
  repeated string values = 1;
}

// OperatingModeWorkspacePhase projects one phase for the initiative workspace,
// with live startability.
message OperatingModeWorkspacePhase {
  string phase = 1;
  string phase_kind = 2;
  string activity_purpose = 3;
  string profile_key = 4;
  bool writes_repo = 5;
  repeated OperatingModeArtifactDefinition output_artifacts = 6;
  bool requires_criteria = 7;
  bool startable = 8;
  string reason = 9;
  bool next = 10;
  repeated string auto_start_after = 11;
}

// OperatingModeWorkspaceMode is the mode definition projected for the workspace.
message OperatingModeWorkspaceMode {
  string mode = 1;
  string label = 2;
  string description = 3;
  string scope_kind = 4;
  OperatingModeCapabilities capabilities = 5;
  repeated OperatingModeWorkspacePhase phases = 6;
  repeated string terminal = 7;
  map<string, OperatingModeStringList> transitions = 8;
  string run_strategy = 9;
}

// OperatingModeLockHolder projects the initiative feedback lock holder.
message OperatingModeLockHolder {
  string run_id = 1;
  string purpose = 2;
  int32 round_number = 3;
  string acquired_at = 4;
  string acquired_by = 5;
  string initiative_name = 6;
}

// OperatingModeWorkspace is the initiative-scoped mode workspace projection.
message OperatingModeWorkspace {
  string initiative_name = 1;
  string mode = 2;
  OperatingModeWorkspaceMode definition = 3;
  OperatingModeLockHolder lock = 4;
  repeated OperatingModeArtifactSnapshot artifacts = 5;
  repeated OperatingModeRoundEnvelope rounds = 6;
}

// -----------------------------------------------------------------------------
// Switch result
// -----------------------------------------------------------------------------

// OperatingModeActiveItemExecution is an in-flight item execution attached to an
// initiative.
message OperatingModeActiveItemExecution {
  string item_ref = 1;
  string execution_id = 2;
  string run_id = 3;
  string status = 4;
}

// OperatingModeSwitchResult reports the outcome of a mode switch.
message OperatingModeSwitchResult {
  string initiative_name = 1;
  string from_mode = 2;
  string to_mode = 3;
  repeated OperatingModeActiveItemExecution canceled_item_executions = 4;
  repeated OperatingModeActiveItemExecution active_item_executions = 5;
  bool requires_cancellation = 6;
  string operating_mode_workspace_id = 7;
}

// -----------------------------------------------------------------------------
// Backlog sync result
// -----------------------------------------------------------------------------

// OperatingModeBacklogCompletionResult records one item's status transition.
message OperatingModeBacklogCompletionResult {
  string item_ref = 1;
  string from_status = 2;
  string to_status = 3;
}

// OperatingModeProposalOutcome is one mutation's apply outcome.
message OperatingModeProposalOutcome {
  string mutation_id = 1;
  string op = 2;
  string target = 3;
  bool applied = 4;
  bool skipped = 5;
  string error = 6;
}

// OperatingModeProposalApplyResult tallies a reconcile proposal application.
message OperatingModeProposalApplyResult {
  repeated OperatingModeProposalOutcome outcomes = 1;
  int32 applied = 2;
  int32 failed = 3;
  int32 skipped = 4;
  int32 created = 5;
  int32 updated = 6;
}

// OperatingModeBacklogSyncResult is the outcome of CompleteItems/ApplyBacklogSync.
message OperatingModeBacklogSyncResult {
  string initiative_name = 1;
  string mode = 2;
  string phase = 3;
  int32 round = 4;
  string run_id = 5;
  repeated OperatingModeBacklogCompletionResult completed_items = 6;
  OperatingModeProposalApplyResult proposal_result = 7;
  bool noop = 8;
}

// -----------------------------------------------------------------------------
// Simulation + prompt render
// -----------------------------------------------------------------------------

// OperatingModePhaseResult is one simulated phase's structured output.
message OperatingModePhaseResult {
  repeated OperatingModeArtifactResult artifacts = 1;
  OperatingModeHandoff handoff = 2;
  repeated OperatingModeHandoff handoffs = 3;
  OperatingModeReadinessReport readiness = 4;
  OperatingModeProgressState progress = 5;
  string verdict = 6;
  bool replan_needed = 7;
  OperatingModeBacklogSyncPlan backlog_sync = 8;
}

// OperatingModeSimulationInputs is the fixture context a simulated phase saw.
message OperatingModeSimulationInputs {
  OperatingModeInitiativeSnapshot initiative = 1;
  repeated OperatingModeRoundItem items = 2;
  repeated OperatingModeArtifactSnapshot artifacts = 3;
  repeated OperatingModeRoundEnvelope prior_rounds = 4;
  repeated string acceptance_criteria = 5;
}

// OperatingModeSimulationTransition describes the guarded edge a simulated round
// took, rendered generically from the guard.
message OperatingModeSimulationTransition {
  string from = 1;
  string to = 2;
  string condition_kind = 3;
  string label = 4;
  string field = 5;
  string value = 6;
}

// OperatingModeSimulationStep is one step of a deterministic simulation trace.
message OperatingModeSimulationStep {
  int32 index = 1;
  string phase = 2;
  string phase_kind = 3;
  OperatingModeSimulationInputs inputs = 4;
  OperatingModePhaseResult output = 5;
  OperatingModeRoundEnvelope round = 6;
  OperatingModeSimulationTransition transition = 7;
  bool terminal = 8;
  string skill_id = 9;
  string profile_key = 10;
  map<string, string> prompt_variables = 11;
}

// OperatingModeSimulationPreset is operator-facing metadata for one preset.
message OperatingModeSimulationPreset {
  string id = 1;
  string label = 2;
  string description = 3;
  string branch = 4;
  string scenario = 5;
}

// OperatingModeSimulationResponse is a full deterministic simulation walk.
message OperatingModeSimulationResponse {
  string mode = 1;
  string label = 2;
  repeated OperatingModeSimulationPreset presets = 3;
  string active_preset = 4;
  OperatingModeInitiativeSnapshot initiative = 5;
  repeated OperatingModeSimulationStep trace = 6;
}

// OperatingModeRenderPromptResponse is the literal prompt an agent would receive
// for one step/phase, plus the substituted variables. When the prompt-manager
// seam is unavailable the response is degraded (prompt empty, variables set).
message OperatingModeRenderPromptResponse {
  string mode = 1;
  string preset = 2;
  int32 step_index = 3;
  string phase = 4;
  string skill_id = 5;
  string profile_key = 6;
  map<string, string> variables = 7;
  string prompt = 8;
  bool degraded = 9;
  string degraded_reason = 10;
}

// -----------------------------------------------------------------------------
// Authoring (scaffold + validate)
// -----------------------------------------------------------------------------

// OperatingModeScaffoldResponse reports the mode folder a scaffold wrote.
message OperatingModeScaffoldResponse {
  string mode = 1;
  string dir = 2;
  repeated string created_files = 3;
}

// OperatingModeValidateResponse is the typed result of validating a mode from
// disk. An invalid mode is ok=false with typed errors — a normal outcome of a
// validate call, not a transport error.
message OperatingModeValidateResponse {
  string mode = 1;
  bool ok = 2;
  repeated string errors = 3;
  int32 phase_count = 4;
  int32 example_runs = 5;
  string summary = 6;
}
