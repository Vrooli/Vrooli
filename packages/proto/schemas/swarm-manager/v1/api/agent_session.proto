syntax = "proto3";

package vrooli.swarm_manager.v1.api;

import "buf/validate/validate.proto";
import "swarm-manager/v1/domain/agent_session.proto";
import "swarm-manager/v1/shared/agent_session.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/api;api";

// =============================================================================
// AGENT SESSION API
// =============================================================================
//
// @stability beta
//
// HTTP API contracts for durable Swarm Manager agent sessions.
//
// =============================================================================

// ListAgentSessionsRequest filters the session sidebar list.
message ListAgentSessionsRequest {
  // Optional session kind filter.
  // @constraint one of: empty, meta_orchestration, swarm_operations, workflow_authoring
  optional string kind = 1 [(buf.validate.field).string = {
    in: [
      "",
      "meta_orchestration",
      "swarm_operations",
      "workflow_authoring"
    ]
  }];

  // Optional session status filter.
  // @constraint one of: empty, draft, starting, running, waiting_for_user, proposal_ready, applying, complete, failed, canceled
  optional string status = 2 [(buf.validate.field).string = {
    in: [
      "",
      "draft",
      "starting",
      "running",
      "waiting_for_user",
      "proposal_ready",
      "applying",
      "complete",
      "failed",
      "canceled"
    ]
  }];

  // Active sessions only.
  bool active_only = 3;

  // Maximum number of sessions to return. Zero means server default.
  optional int32 limit = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

// ListAgentSessionsResponse returns sidebar-ready session snapshots.
message ListAgentSessionsResponse {
  repeated domain.AgentSession sessions = 1;
}

// GetAgentSessionRequest fetches one session by ID.
message GetAgentSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetAgentSessionResponse returns a detailed session.
message GetAgentSessionResponse {
  domain.AgentSession session = 1;
}

// CreateAgentSessionRequest creates a pre-spawn typed draft session.
message CreateAgentSessionRequest {
  reserved 3, 4;

  // Session kind.
  // @constraint one of: meta_orchestration, swarm_operations, workflow_authoring
  string kind = 1 [(buf.validate.field).string = {
    in: [
      "meta_orchestration",
      "swarm_operations",
      "workflow_authoring"
    ]
  }];

  // Human-readable title.
  string title = 2 [(buf.validate.field).string.min_len = 1];
}

// CreateAgentSessionResponse returns the created session.
message CreateAgentSessionResponse {
  domain.AgentSession session = 1;
}

// StartAgentSessionRequest sends the first real operator prompt and spawns
// the Agent Manager run for a draft session.
message StartAgentSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  string message = 2;
  repeated string attachment_ids = 3;
  repeated AgentSessionContextRef context_refs = 4;
  // Auto context policy.
  // @constraint one of: empty, default, none
  optional string auto_context_policy = 5 [(buf.validate.field).string = {
    in: [
      "",
      "default",
      "none"
    ]
  }];
}

// StartAgentSessionResponse returns the spawned session.
message StartAgentSessionResponse {
  domain.AgentSession session = 1;
}

// ContinueAgentSessionRequest appends a user message and continues the run.
message ContinueAgentSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  string message = 2;
  repeated string attachment_ids = 3;
  repeated AgentSessionContextRef context_refs = 4;
}

// ContinueAgentSessionResponse returns the updated session.
message ContinueAgentSessionResponse {
  domain.AgentSession session = 1;
}

// AgentSessionContextRef identifies an existing Swarm Manager record selected
// as context for a single session message.
message AgentSessionContextRef {
  // Context type.
  // @constraint one of: backlog_item, goal, capture, execution, agent_activity, scenario, operating_mode, session, operations_briefing, startup_brief
  string type = 1 [(buf.validate.field).string = {
    in: [
      "backlog_item",
      "goal",
      "capture",
      "execution",
      "agent_activity",
      "scenario",
      "operating_mode",
      "session",
      "operations_briefing",
      "startup_brief"
    ]
  }];

  // Stable entity reference.
  string ref = 2 [(buf.validate.field).string.min_len = 1];
}

// GetAgentSessionStartupBriefRequest returns the bounded startup context that
// should be attached to a draft session before the first agent run starts.
message GetAgentSessionStartupBriefRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  bool refresh = 2;
}

// GetAgentSessionStartupBriefResponse returns one server-resolved startup
// context item. The item type is startup_brief and the metadata_json field
// carries kind, freshness, source counts, and drill-down commands.
message GetAgentSessionStartupBriefResponse {
  shared.AgentSessionContextItem brief = 1;
}

// UploadAgentSessionAttachmentsResponse returns uploaded session attachments.
message UploadAgentSessionAttachmentsResponse {
  repeated shared.AgentSessionAttachment attachments = 1;
}

// ListAgentSessionEventsRequest reads Agent Manager run events through Swarm
// Manager session ownership.
message ListAgentSessionEventsRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  optional int64 after_sequence = 2;
  optional int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }];
}

// AgentSessionRunEvent is the bounded session-owned timeline event shape.
message AgentSessionRunEvent {
  string id = 1;
  string run_id = 2;
  int64 sequence = 3;
  string created_at = 4;
  string event_type = 5;
  string role = 6;
  string content = 7;
  string tool_name = 8;
  string tool_call_id = 9;
  string input = 10;
  string output = 11;
  string error = 12;
  string status = 13;
  string previous_status = 14;
  string progress_phase = 15;
  int32 progress_percent = 16;
  string progress_message = 17;
  string summary = 18;
  string raw_json = 19;
}

// ListAgentSessionEventsResponse returns bounded Agent Manager run events.
message ListAgentSessionEventsResponse {
  repeated AgentSessionRunEvent events = 1;
  bool has_more = 2;
  int64 next_after_sequence = 3;
}

// RefreshAgentSessionRequest refreshes session state from Agent Manager.
message RefreshAgentSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// RefreshAgentSessionResponse returns the refreshed session.
message RefreshAgentSessionResponse {
  domain.AgentSession session = 1;
}

// CancelAgentSessionRequest cancels a running session.
message CancelAgentSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// CancelAgentSessionResponse returns the canceled session.
message CancelAgentSessionResponse {
  domain.AgentSession session = 1;
}

// DeleteAgentSessionRequest permanently removes a session-owned record.
message DeleteAgentSessionRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// DeleteAgentSessionResponse returns the deleted session ID.
message DeleteAgentSessionResponse {
  string session_id = 1;
}

// ApplyAgentSessionProposalRequest applies an approved proposal.
message ApplyAgentSessionProposalRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
  string proposal_id = 2 [(buf.validate.field).string.min_len = 1];
}

// ApplyAgentSessionProposalResponse returns updated session state and artifacts.
message ApplyAgentSessionProposalResponse {
  domain.AgentSession session = 1;
  repeated shared.AgentSessionArtifact artifacts = 2;
}

// ListAgentSessionArtifactsRequest filters artifacts for one session.
message ListAgentSessionArtifactsRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ListAgentSessionArtifactsResponse returns artifact links for one session.
message ListAgentSessionArtifactsResponse {
  repeated shared.AgentSessionArtifact artifacts = 1;
}

// GetArtifactsByEntityRequest finds session links for an entity.
message GetArtifactsByEntityRequest {
  // Artifact type.
  // @constraint one of: backlog_item, milestone, operating_mode_proposal, operating_mode_definition, capture, file, agent_activity
  string artifact_type = 1 [(buf.validate.field).string = {
    in: [
      "backlog_item",
      "milestone",
      "operating_mode_proposal",
      "operating_mode_definition",
      "capture",
      "file",
      "agent_activity"
    ]
  }];

  // Stable entity reference, such as execute/my-item or goal-name.
  string entity_ref = 2 [(buf.validate.field).string.min_len = 1];
}

// GetArtifactsByEntityResponse returns artifact links for one entity.
message GetArtifactsByEntityResponse {
  repeated shared.AgentSessionArtifact artifacts = 1;
}
