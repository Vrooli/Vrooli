syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";
import "swarm-manager/v1/domain/agent_operations.proto";
import "swarm-manager/v1/domain/operating_mode.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/api;api";

// =============================================================================
// AGENT OPERATIONS SERVICE (Connect RPC) — public projections + binding controls
// =============================================================================
//
// @layer 5
// @domain api
// @stability experimental
//
// The public operator surface over the declarative agent-operations runtime
// (scenarios/swarm-manager/api/internal/opsrunner): resolve which mode a binding
// selects for a target, dry-run-validate an invocation before it starts, inspect
// the durable workflow instance and the immutable execution provenance a run
// pinned, browse the operation catalog and per-target mode compatibility, read
// and administer the layered binding overrides, and observe migration state.
// Every RPC delegates the decision to the runtime (opsrunner / agentops); the
// CLI and UI clients render the typed result and never re-implement precedence,
// compatibility, or digest logic.
//
// Every RPC is read-only except PutBindingOverride / DeleteBindingOverride,
// which administer the override documents in domain storage. Binding resolution
// is SNAPSHOT-at-Invoke: an override change affects only operations started
// afterwards; a running operation keeps the provenance it pinned.
//
// Doctrine: scenarios/swarm-manager/docs/concepts/AGENT-OPERATIONS.md
// =============================================================================

// AgentOperationsService is the operator surface for the agent-operations
// runtime. Every RPC is unary.
service AgentOperationsService {
  // ResolveBinding resolves the winning binding for an operation against a
  // target by deterministic precedence, or returns a fail-closed error
  // (no-binding / invalid-override / deleted-revision / incompatible-mode).
  rpc ResolveBinding(AgentOpsResolveBindingRequest) returns (AgentOpsResolveBindingResponse);

  // ValidateInvocation dry-runs an invocation: it checks the operation is
  // declared, compatible with the target, and resolvable to a binding, without
  // starting a run or mutating state.
  rpc ValidateInvocation(AgentOpsValidateInvocationRequest) returns (AgentOpsValidateInvocationResponse);

  // InspectWorkflow returns the durable domain workflow instance correlating a
  // target's operation executions, decisions, timers, and terminal state.
  rpc InspectWorkflow(AgentOpsInspectWorkflowRequest) returns (AgentOpsInspectWorkflowResponse);

  // InspectExecution returns the immutable provenance and outcome a specific
  // execution pinned, and whether its self-contained snapshot still reproduces.
  rpc InspectExecution(AgentOpsInspectExecutionRequest) returns (AgentOpsInspectExecutionResponse);

  // ListOperationCatalog returns every authored operation contract in the
  // loaded catalog with its pinned content revision and the target kinds able
  // to run it. Read-only; no target is required.
  rpc ListOperationCatalog(AgentOpsListOperationCatalogRequest) returns (AgentOpsListOperationCatalogResponse);

  // ListCompatibleModes reports, for a target, which authored operating modes
  // can perform which catalog operations on it. Every verdict is computed
  // server-side by the SAME compatibility checks the live invocation path uses
  // (operation↔target capabilities + mode↔operation/target); a mode is never
  // exposed without a validated verdict.
  rpc ListCompatibleModes(AgentOpsListCompatibleModesRequest) returns (AgentOpsListCompatibleModesResponse);

  // GetResolvedBindings resolves, for every catalog operation compatible with
  // the target, the winning binding with full provenance plus the contributing
  // layers, so a UI can render inherited-vs-overridden. A fail-closed
  // resolution error surfaces as a typed per-operation result, never a
  // transport error.
  rpc GetResolvedBindings(AgentOpsGetResolvedBindingsRequest) returns (AgentOpsGetResolvedBindingsResponse);

  // ListBindingOverrides returns the raw override documents stored at one
  // owner's layer (a backlog item or an initiative) with file-level provenance.
  rpc ListBindingOverrides(AgentOpsListBindingOverridesRequest) returns (AgentOpsListBindingOverridesResponse);

  // PutBindingOverride writes (idempotent-replace) one binding override at the
  // owner's layer. Validation is fail-closed BEFORE the write: owner-kind↔layer,
  // the operation exists in the catalog at the pinned version, the mode exists
  // at the pinned revision and is compatible with the operation and the owner's
  // target kind, and the write introduces no same-layer ambiguity (exactly one
  // override per operation+version per owner). The write is atomic
  // (temp+rename). Resolution is SNAPSHOT-at-Invoke: the new override affects
  // only operations started afterwards.
  rpc PutBindingOverride(AgentOpsPutBindingOverrideRequest) returns (AgentOpsPutBindingOverrideResponse);

  // DeleteBindingOverride removes the owner's override for an operation (+
  // optional exact version pin). Deleting an absent override reports
  // found=false rather than erroring. Resolution is SNAPSHOT-at-Invoke: running
  // operations keep the binding they pinned.
  rpc DeleteBindingOverride(AgentOpsDeleteBindingOverrideRequest) returns (AgentOpsDeleteBindingOverrideResponse);

  // GetWorkflowProjection returns THE canonical workflow projection for the UI:
  // the durable instance (state, decisions, timers, legal actions) plus each
  // operation execution enriched from its immutable snapshot (contract version,
  // mode + revision, binding layer, run id, timestamps, attempt/retry linkage).
  // Sourced from the canonical workflow.json + execution snapshots, never a
  // legacy store.
  rpc GetWorkflowProjection(AgentOpsGetWorkflowProjectionRequest) returns (AgentOpsGetWorkflowProjectionResponse);

  // ListExecutionHistory returns execution provenance summaries for a target,
  // newest first.
  rpc ListExecutionHistory(AgentOpsListExecutionHistoryRequest) returns (AgentOpsListExecutionHistoryResponse);

  // GetMigrationStatus reads the persisted-state migration status document
  // (written by the Phase-8 migration tooling). An absent document is the
  // not-started state, so a UI can always render partial-migration state.
  rpc GetMigrationStatus(AgentOpsGetMigrationStatusRequest) returns (AgentOpsGetMigrationStatusResponse);

  // RunReconciliation runs the SAME orphan-snapshot sweep the API performs at
  // startup (opsrunner.ReconcileOrphanSnapshots): execution snapshots that no
  // workflow operation record references and that are older than the in-flight
  // grace period are removed. Idempotent and race-safe — a referenced snapshot
  // is never touched and a young orphan is skipped — so invoking it live is
  // exactly as safe as the startup sweep. MUTATING (deletes orphan files).
  rpc RunReconciliation(AgentOpsRunReconciliationRequest) returns (AgentOpsRunReconciliationResponse);
}

// AgentOpsTargetSelector identifies a target: a kind plus its domain id
// (a backlog item "kind/name" ref or an initiative name).
message AgentOpsTargetSelector {
  OperatingModeTargetKind kind = 1;
  string id = 2 [(buf.validate.field).string.min_len = 1];
}

message AgentOpsResolveBindingRequest {
  AgentOpsTargetSelector target = 1;
  string operation = 2 [(buf.validate.field).string.min_len = 1];
  string operation_version = 3;
}

message AgentOpsResolveBindingResponse {
  // resolved is the winning binding when resolution succeeds.
  AgentOpsOperationBinding resolved = 1;
  // policy_id / policy_revision pin the transition policy governing the target's
  // domain, when one is authored.
  string policy_id = 2;
  string policy_revision = 3;
}

message AgentOpsValidateInvocationRequest {
  AgentOpsTargetSelector target = 1;
  string operation = 2 [(buf.validate.field).string.min_len = 1];
  string operation_version = 3;
}

message AgentOpsValidateInvocationResponse {
  // operation_declared is true when the catalog declares the operation.
  bool operation_declared = 1;
  // target_compatible is true when the target kind provides every required
  // capability.
  bool target_compatible = 2;
  // binding_resolved is true when a binding resolves fail-closed.
  bool binding_resolved = 3;
  // resolved is the winning binding when binding_resolved is true.
  AgentOpsOperationBinding resolved = 4;
  // missing_capabilities names the capabilities the target lacks, when
  // incompatible.
  repeated AgentOpsCapability missing_capabilities = 5;
}

message AgentOpsInspectWorkflowRequest {
  AgentOpsTargetSelector target = 1;
}

message AgentOpsInspectWorkflowResponse {
  bool found = 1;
  AgentOpsWorkflowInstance workflow = 2;
}

message AgentOpsInspectExecutionRequest {
  AgentOpsTargetSelector target = 1;
  string execution_id = 2 [(buf.validate.field).string.min_len = 1];
}

message AgentOpsInspectExecutionResponse {
  bool found = 1;
  AgentOpsExecutionProvenance provenance = 2;
  string outcome = 3;
  // reproducible is true when the persisted snapshot's recomputed digests still
  // equal the pinned provenance digests.
  bool reproducible = 4;
  string recorded_at = 5;
}

// ---------------------------------------------------------------------------
// Operation catalog
// ---------------------------------------------------------------------------

message AgentOpsListOperationCatalogRequest {}

// AgentOpsCatalogEntry is one authored operation contract plus the catalog
// provenance the loader pinned for it.
message AgentOpsCatalogEntry {
  // contract carries the full authored declaration: id, version,
  // summary/description, required target capabilities, typed caller-input
  // specs, declared result fields, and closed outcomes.
  AgentOpsOperationContract contract = 1;
  // revision is the canonical sha256 digest of the authored document.
  string revision = 2;
  // compatible_targets lists the target kinds whose provided capabilities
  // satisfy the contract's requirements, in canonical order.
  repeated OperatingModeTargetKind compatible_targets = 3;
}

message AgentOpsListOperationCatalogResponse {
  // entries are ordered by operation id, then version.
  repeated AgentOpsCatalogEntry entries = 1;
}

// ---------------------------------------------------------------------------
// Mode compatibility
// ---------------------------------------------------------------------------

message AgentOpsListCompatibleModesRequest {
  AgentOpsTargetSelector target = 1;
  // operation optionally narrows the verdicts to one catalog operation id.
  string operation = 2;
}

// AgentOpsModeOperationVerdict is the server-computed compatibility verdict for
// one mode × operation pair against the requested target.
message AgentOpsModeOperationVerdict {
  string operation = 1;
  // operation_version is the catalog version the verdict was computed against
  // (the highest authored version).
  string operation_version = 2;
  bool compatible = 3;
  // reason explains an incompatible verdict (which check failed and why);
  // empty when compatible.
  string reason = 4;
}

// AgentOpsCompatibleMode is one authored mode with its per-operation verdicts.
// A mode is never listed without validated verdicts.
message AgentOpsCompatibleMode {
  string mode = 1;
  // mode_revision is the mode's current content-derived revision (equal to
  // mode_digest; the mode registry pins revisions by content).
  string mode_revision = 2;
  // mode_digest is the canonical sha256 digest of the mode definition as
  // currently registered — the value a fresh invocation would pin as its
  // compiled-mode digest source.
  string mode_digest = 3;
  // target_kind is the target kind the mode is authored for.
  OperatingModeTargetKind target_kind = 4;
  repeated AgentOpsModeOperationVerdict verdicts = 5;
}

message AgentOpsListCompatibleModesResponse {
  // modes are ordered by mode id.
  repeated AgentOpsCompatibleMode modes = 1;
}

// ---------------------------------------------------------------------------
// Resolved bindings per target
// ---------------------------------------------------------------------------

message AgentOpsGetResolvedBindingsRequest {
  AgentOpsTargetSelector target = 1;
}

// AgentOpsBindingContribution is one in-scope candidate binding at some layer.
// The winning flag marks the candidate deterministic precedence selected.
message AgentOpsBindingContribution {
  AgentOpsOperationBinding binding = 1;
  bool winning = 2;
}

// AgentOpsResolvedOperationBinding is the per-operation resolution result. A
// fail-closed resolution error is a typed result (error/error_message), never a
// transport error, so one broken override does not hide the rest of the table.
message AgentOpsResolvedOperationBinding {
  string operation = 1;
  // operation_version is the catalog version resolution ran against (the
  // highest authored version).
  string operation_version = 2;
  bool resolved = 3;
  // binding is the winning binding when resolved is true.
  AgentOpsOperationBinding binding = 4;
  // policy_id / policy_revision pin the transition policy governing the
  // target's domain, when one is authored.
  string policy_id = 5;
  string policy_revision = 6;
  // error is the fail-closed resolution error code when resolved is false:
  // no-binding, invalid-override, deleted-revision, incompatible-mode, or
  // internal.
  string error = 7;
  string error_message = 8;
  // contributions lists every in-scope candidate binding (system default +
  // override layers), so a UI can render inherited-vs-overridden.
  repeated AgentOpsBindingContribution contributions = 9;
}

message AgentOpsGetResolvedBindingsResponse {
  // operations covers every catalog operation compatible with the target,
  // ordered by operation id.
  repeated AgentOpsResolvedOperationBinding operations = 1;
}

// ---------------------------------------------------------------------------
// Binding override administration
// ---------------------------------------------------------------------------

// AgentOpsBindingOverrideDocument is one raw override document stored at an
// owner's layer, with file-level provenance.
message AgentOpsBindingOverrideDocument {
  AgentOpsOperationBinding binding = 1;
  // file is the document's basename within the owner's binding-overrides/
  // directory.
  string file = 2;
  // revision is the canonical sha256 digest of the stored bytes.
  string revision = 3;
  // updated_at is the file's last-modified time (RFC3339). The document schema
  // stores no creation timestamp, so none is reported.
  string updated_at = 4;
}

message AgentOpsListBindingOverridesRequest {
  // owner is the entity whose layer is being listed: a backlog item
  // (backlog-item-override layer) or an initiative (initiative-override layer).
  AgentOpsTargetSelector owner = 1;
}

message AgentOpsListBindingOverridesResponse {
  // overrides are ordered by file name (deterministic per operation+version).
  repeated AgentOpsBindingOverrideDocument overrides = 1;
}

message AgentOpsPutBindingOverrideRequest {
  // owner is the entity whose layer the override is written at. The layer and
  // the binding owner are DERIVED server-side from this selector (backlog-item
  // -> backlog-item-override, initiative -> initiative-override); a client can
  // never claim a mismatched layer.
  AgentOpsTargetSelector owner = 1;
  string operation = 2 [(buf.validate.field).string.min_len = 1];
  // operation_version optionally pins an exact contract version; empty binds
  // the operation id across versions.
  string operation_version = 3;
  string mode = 4 [(buf.validate.field).string.min_len = 1];
  string mode_revision = 5 [(buf.validate.field).string.min_len = 1];
  // disabled writes an explicit fail-closed veto: the operation is refused for
  // this scope rather than falling through to a lower layer.
  bool disabled = 6;
}

message AgentOpsPutBindingOverrideResponse {
  // stored is the binding document as persisted.
  AgentOpsOperationBinding stored = 1;
  string file = 2;
  // revision is the canonical sha256 digest of the stored bytes.
  string revision = 3;
}

message AgentOpsDeleteBindingOverrideRequest {
  AgentOpsTargetSelector owner = 1;
  string operation = 2 [(buf.validate.field).string.min_len = 1];
  // operation_version must match the stored override's pin (empty matches the
  // version-agnostic override).
  string operation_version = 3;
}

message AgentOpsDeleteBindingOverrideResponse {
  // found is false when no matching override existed (not an error).
  bool found = 1;
}

// ---------------------------------------------------------------------------
// Workflow projection
// ---------------------------------------------------------------------------

message AgentOpsGetWorkflowProjectionRequest {
  AgentOpsTargetSelector target = 1;
}

// AgentOpsOperationProjection is one workflow operation record enriched from
// its immutable execution snapshot: what ran, which mode at which revision,
// selected by which binding layer, when it was recorded, and its retry lineage.
message AgentOpsOperationProjection {
  string operation = 1;
  // operation_version is the contract version the execution pinned (from its
  // snapshot; empty when the snapshot is unavailable).
  string operation_version = 2;
  string execution_id = 3;
  // run_id is the live agent-run id the round was dispatched under (empty on
  // the synchronous path).
  string run_id = 4;
  // state: running, completed, canceled, failed, or needs-attention.
  string state = 5;
  string outcome = 6;
  string idempotency_key = 7;
  string provenance_digest = 8;
  string mode = 9;
  string mode_revision = 10;
  AgentOpsBindingLayer binding_layer = 11;
  string binding_owner_kind = 12;
  string binding_owner_id = 13;
  // recorded_at is the snapshot's pin timestamp (RFC3339).
  string recorded_at = 14;
  // snapshot_found is false when the execution snapshot is missing on disk;
  // the mode/binding fields are then empty and only the workflow record's own
  // fields are populated.
  bool snapshot_found = 15;
  // attempt is the 1-based ordinal of this record among records of the same
  // operation, in workflow order — the retry linkage (a retry is always a new
  // record, never an in-place mutation).
  int32 attempt = 16;
  // prior_execution_id is the previous attempt's execution id when attempt > 1.
  string prior_execution_id = 17;
}

message AgentOpsGetWorkflowProjectionResponse {
  bool found = 1;
  // workflow is the canonical durable instance: state, correlated operations,
  // human decisions, timers/waits, legal actions, and version.
  AgentOpsWorkflowInstance workflow = 2;
  // operations enriches each workflow operation record with its snapshot
  // provenance, in workflow (chronological) order.
  repeated AgentOpsOperationProjection operations = 3;
  // policy_id / policy_revision pin the transition policy governing the
  // target's domain, when one is authored.
  string policy_id = 4;
  string policy_revision = 5;
}

// ---------------------------------------------------------------------------
// Execution history
// ---------------------------------------------------------------------------

message AgentOpsListExecutionHistoryRequest {
  AgentOpsTargetSelector target = 1;
  // limit caps the number of summaries returned; 0 or negative means no cap.
  int32 limit = 2;
}

// AgentOpsExecutionSummary is one immutable execution provenance summary.
message AgentOpsExecutionSummary {
  string execution_id = 1;
  string operation = 2;
  string operation_version = 3;
  string mode = 4;
  string mode_revision = 5;
  AgentOpsBindingLayer binding_layer = 6;
  string compiled_mode_digest = 7;
  string prompt_catalog_digest = 8;
  string caller_input_digest = 9;
  string outcome = 10;
  // reproducible is true when the snapshot's recomputed digests still equal
  // the pinned provenance digests.
  bool reproducible = 11;
  string recorded_at = 12;
}

message AgentOpsListExecutionHistoryResponse {
  // executions are ordered newest-first by recorded_at.
  repeated AgentOpsExecutionSummary executions = 1;
}

// ---------------------------------------------------------------------------
// Migration status
// ---------------------------------------------------------------------------

message AgentOpsGetMigrationStatusRequest {}

// ---------------------------------------------------------------------------
// Reconciliation
// ---------------------------------------------------------------------------

message AgentOpsRunReconciliationRequest {}

// AgentOpsRunReconciliationResponse is the orphan-snapshot sweep report — the
// same shape the startup sweep logs.
message AgentOpsRunReconciliationResponse {
  // dirs_scanned is the number of agentops directories examined.
  int32 dirs_scanned = 1;
  // snapshots_seen is the total execution snapshot files found across those dirs.
  int32 snapshots_seen = 2;
  // reaped lists the snapshot file paths removed (orphans past the grace period).
  repeated string reaped = 3;
  // skipped_too_recent counts orphan snapshots left in place because they were
  // younger than the grace period (a concurrent in-flight Invoke may still be
  // between writing its snapshot and committing its operation record).
  int32 skipped_too_recent = 4;
}

// AgentOpsGetMigrationStatusResponse projects the Phase-8 persisted-state
// migration status document. An absent document is state=not-started with
// document_found=false — never an error — so a UI can always render
// partial-migration state.
message AgentOpsGetMigrationStatusResponse {
  // state: not-started, staged, promoted, or quarantined.
  string state = 1;
  // epoch is the migration epoch marker number (0 when not started).
  int32 epoch = 2;
  int32 staged_count = 3;
  int32 promoted_count = 4;
  int32 quarantined_count = 5;
  string started_at = 6;
  string updated_at = 7;
  // report_path points at the epoch report document, when written.
  string report_path = 8;
  bool document_found = 9;
}
