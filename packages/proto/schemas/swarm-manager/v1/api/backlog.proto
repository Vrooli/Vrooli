syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";
import "swarm-manager/v1/domain/backlog.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/api;api";

// =============================================================================
// BACKLOG API
// =============================================================================
//
// @layer 5
// @domain api
// @imports backlog
// @stability beta
//
// HTTP API contracts for Swarm Manager backlog operations.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// CreateBacklogItemRequest defines the payload for creating a new backlog item.
message CreateBacklogItemRequest {
  // Unique identifier (folder name).
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable title.
  string title = 2 [(buf.validate.field).string.min_len = 1];

  // Optional description.
  optional string description = 3;

  // Optional priority level (1-10).
  optional int32 priority = 4 [(buf.validate.field).int32 = { gte: 1, lte: 10 }];

  // Optional tags for categorization.
  repeated string tags = 5 [(buf.validate.field).repeated = { unique: true }];

  // Required backlog kind.
  string kind = 6 [(buf.validate.field).string = { in: ["idea", "research", "fix", "execute"] }];

  // Optional research target for research items.
  optional string research_target = 7 [(buf.validate.field).string = { in: ["idea", "fix", "execute", "unspecified"] }];
}

// UpdateBacklogItemRequest defines the payload for updating a backlog item.
message UpdateBacklogItemRequest {
  // Human-readable title.
  string title = 1 [(buf.validate.field).string.min_len = 1];

  // Optional description.
  string description = 2;

  // Lifecycle status.
  // @constraint one of: backlog, researching, ready, queued, in_progress, completed, archived
  string status = 3 [(buf.validate.field).string = { in: [
    "backlog",
    "researching",
    "ready",
    "queued",
    "in_progress",
    "completed",
    "archived"
  ] }];

  // Priority level (1-10).
  int32 priority = 4 [(buf.validate.field).int32 = { gte: 1, lte: 10 }];

  // Tags for categorization.
  repeated string tags = 5 [(buf.validate.field).repeated = { unique: true }];

  // Optional research target for research items.
  optional string research_target = 6 [(buf.validate.field).string = { in: ["idea", "fix", "execute", "unspecified"] }];
}

// ListBacklogItemsResponse returns all backlog items.
message ListBacklogItemsResponse {
  repeated BacklogItem items = 1;
}

// BacklogItemResponse returns a single backlog item.
message BacklogItemResponse {
  BacklogItem item = 1;
}

// BacklogFilesResponse returns the file tree for a backlog item.
message BacklogFilesResponse {
  repeated BacklogFile files = 1;
}

// BacklogFileResponse returns a single file node.
message BacklogFileResponse {
  BacklogFile file = 1;
}

// BacklogFileOperationRequest applies a filesystem operation within a backlog item.
message BacklogFileOperationRequest {
  // Operation to apply.
  // @constraint one of: rename, move, copy, delete
  string operation = 1 [(buf.validate.field).string = { in: [
    "rename",
    "move",
    "copy",
    "delete"
  ] }];

  // Source path relative to backlog item root.
  string source_path = 2 [(buf.validate.field).string.min_len = 1];

  // Destination path relative to backlog item root.
  // Required for rename/move/copy. Ignored for delete.
  optional string destination_path = 3;
}

// BacklogFileOperationResponse reports the result of a file operation.
message BacklogFileOperationResponse {
  // Result file node for rename/move/copy operations.
  optional BacklogFile file = 1;

  // Deleted path for delete operations.
  optional string deleted_path = 2;
}

// QueueBacklogItemRequest queues a backlog item for processing.
message QueueBacklogItemRequest {
  // Optional operation hint for idea processing.
  optional string operation = 1 [(buf.validate.field).string = { in: ["generator", "improver"] }];
  // Execution mode override (defaults to policy default).
  optional string mode = 2 [(buf.validate.field).string = { in: ["manual", "scheduled", "yolo"] }];
  // Delay in seconds before scheduled start (mode=scheduled).
  optional int64 delay_seconds = 3 [(buf.validate.field).int64.gte = 0];
  // Human or agent identifier that initiated the queue action.
  optional string started_by = 4;
  // Explicit confirmation to execute queue mutation. If false or unset, request
  // is treated as a preview/dry-run and no mutation occurs.
  optional bool confirm = 5;
  // Override queue readiness feedback gates (unanswered questions / pending
  // suggestions). API-level safety checks remain for non-overridable constraints.
  optional bool force = 6;
}

// QueueBacklogItemResponse returns queue results.
message QueueBacklogItemResponse {
  BacklogItem item = 1;
  string task_id = 2;
  string run_id = 3;
  string base_url = 4;
  string created = 5;
  // True when request ran in preview mode and no mutation occurred.
  bool dry_run = 6;
  // True when a queue mutation actually occurred.
  bool queued = 7;
  // Human-readable summary of outcome.
  string message = 8;
  // Blocking reasons when queue did not execute.
  repeated string blocking_reasons = 9;
  // Number of unanswered clarification questions detected.
  int32 unanswered_questions = 10;
  // Number of suggestions still pending user decision.
  int32 pending_suggestions = 11;
}

// BacklogResearchRequest captures optional fields for spawning a research agent.
message BacklogResearchRequest {
  // Additional prompt context.
  optional string prompt = 1;

  // Optional scope path override.
  optional string scope_path = 2;

  // Optional project root override.
  optional string project_root = 3;

  // Optional research mode.
  optional string mode = 4 [(buf.validate.field).string = { in: [
    "clarify",
    "suggest",
    "enhance",
    "research",
    "explore",
    "investigate"
  ] }];

  // Optional research target for research items.
  optional string target_kind = 5 [(buf.validate.field).string = { in: [
    "idea",
    "fix",
    "execute",
    "unspecified"
  ] }];

  // File paths within the backlog item to include as agent context (by reference).
  repeated string context_paths = 6;

  // Operational target IDs to attach as agent context.
  repeated string context_target_ids = 7;

  // Requirement IDs to attach as agent context.
  repeated string context_requirement_ids = 8;
}

// BacklogResearchResponse returns agent-manager identifiers for research runs.
message BacklogResearchResponse {
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  string base_url = 3 [(buf.validate.field).string.min_len = 1];
  string created = 4 [(buf.validate.field).string.min_len = 1];
}

// ConvertBacklogItemRequest moves a backlog item to another kind.
message ConvertBacklogItemRequest {
  // Target kind to move into.
  string target_kind = 1 [(buf.validate.field).string = { in: ["idea", "research", "fix", "execute"] }];

  // Optional new name for the moved item.
  optional string target_name = 2;
}

// ExportBacklogRequest defines filter criteria for exporting backlog items to markdown.
message ExportBacklogRequest {
  // Optional kinds to include (empty = all).
  repeated string kinds = 1;

  // Optional statuses to include (empty = all non-archived).
  repeated string statuses = 2;

  // Optional specific item keys (kind/name pairs) to export.
  repeated string names = 3;

  // Only include items with priority <= this value.
  optional int32 priority_max = 4 [(buf.validate.field).int32 = { gte: 1, lte: 10 }];

  // Only include items with any of these tags.
  repeated string tags = 5;

  // Whether to include PRD content in the export (default true).
  optional bool include_prd = 6;

  // Whether to include requirements in the export (default false).
  optional bool include_requirements = 7;

  // Whether to include clarify questions in the export (default true).
  optional bool include_clarify_questions = 8;

  // Whether to include suggestions in the export (default true).
  optional bool include_suggestions = 9;

  // Whether to include notes in the export (default true).
  optional bool include_notes = 10;

  // Whether to include the new-item template in the export (default true).
  optional bool include_template = 11;
}

// ImportBacklogResponse reports the results of importing an edited markdown export.
message ImportBacklogResponse {
  // Whether this was a dry-run (no changes applied).
  bool dry_run = 1;

  // List of changes detected or applied.
  repeated ImportChange changes = 2;

  // Any errors encountered during parsing.
  repeated string errors = 3;

  // Human-readable summary of the import.
  string summary = 4;
}

// ImportChange describes a single change from an import operation.
message ImportChange {
  // Item key (kind/name).
  string item = 1;

  // Action taken: "update" or "create".
  string action = 2;

  // Details of what changed.
  repeated string details = 3;
}
