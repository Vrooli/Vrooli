syntax = "proto3";

package vrooli.swarm_manager.v1.api;

import "buf/validate/validate.proto";
import "swarm-manager/v1/domain/backlog.proto";
import "swarm-manager/v1/domain/execution.proto";
// ImportChange describes a single change from an import operation.
import "swarm-manager/v1/shared/backlog.proto";
import "swarm-manager/v1/shared/plan_ref.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/api;api";

// =============================================================================
// BACKLOG API
// =============================================================================
//
// @stability beta
//
// HTTP API contracts for Swarm Manager backlog operations.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// CreateBacklogItemRequest defines the payload for creating a new backlog item.
message CreateBacklogItemRequest {
  // Unique identifier (folder name).
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable title.
  string title = 2 [(buf.validate.field).string.min_len = 1];

  // Optional description.
  optional string description = 3;

  // Optional priority level (1-10).
  optional int32 priority = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];

  // Optional tags for categorization.
  repeated string tags = 5 [(buf.validate.field).repeated = {unique: true}];

  // Required backlog kind.
  string kind = 6 [(buf.validate.field).string = {
    in: [
      "idea",
      "research",
      "fix",
      "execute",
      "chore"
    ]
  }];

  reserved 7; // research_target — removed; research items execute directly.

  // Dependencies as "kind/name" references.
  repeated string depends_on = 8;

  // Owned goal/milestone reference this item belongs to.
  optional string milestone = 9;

  reserved 10; // auto_workshop removed — use settings.auto_initialize_workshop instead.

  // Effort estimate: XS, S, M, L, XL.
  optional string effort = 11 [(buf.validate.field).string = {
    in: [
      "XS",
      "S",
      "M",
      "L",
      "XL"
    ]
  }];

  reserved 12; // scope — removed; acceptance_allow/deny are the sole boundary definitions.

  // Glob patterns for file paths expected to be modified.
  repeated string acceptance_allow = 13;

  // Glob patterns for file paths that must NOT be modified.
  repeated string acceptance_deny = 14;

  // Origin reference in "kind/name" format, tracking which item spawned this one.
  optional string spawned_from = 15;

  // Personal annotation — a user note for tracking context.
  optional string note = 16;

  // Glob patterns for file paths the work plans to create. Same syntax as
  // acceptance_allow. Used by the workshop validator to allow forward-looking
  // paths in acceptance_allow that don't yet exist on disk. Absence means
  // "no declared new paths."
  repeated string creates = 17;

  // Canonical plan-manager plan backing this work item.
  optional shared.PlanRef plan_ref = 18;

  // Typed, stable acceptance criteria present at item creation.
  repeated shared.BacklogCriterion acceptance_criteria = 19;
}

// UpdateBacklogItemRequest defines the payload for updating a backlog item.
//
// PATCH semantics:
// - omitted fields remain unchanged
// - provided scalar/optional fields replace the stored value
// - provided repeated fields replace the stored list
// - providing an empty repeated list clears that field
message UpdateBacklogItemRequest {
  // Human-readable title.
  optional string title = 1 [(buf.validate.field).string.min_len = 1];

  // Description. Set to the empty string to clear.
  optional string description = 2;

  // Lifecycle status.
  //
  // Not constrained to an inline allowlist — see the note on
  // domain.BacklogItem.status in domain/backlog.proto. The server's status table is
  // the single source of truth and rejects unknown values, including the
  // narrower rule that most statuses are not settable by a client at all.
  optional string status = 3 [(buf.validate.field).string.min_len = 1];

  // Priority level (1-10).
  optional int32 priority = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];

  // Tags for categorization.
  repeated string tags = 5 [(buf.validate.field).repeated = {unique: true}];

  reserved 6; // research_target — removed; research items execute directly.

  // Dependencies as "kind/name" references.
  repeated string depends_on = 7;

  // Owned goal/milestone reference this item belongs to. Set to the empty string to clear.
  optional string milestone = 8;

  // Effort estimate: XS, S, M, L, XL. Set to the empty string to clear.
  optional string effort = 9 [(buf.validate.field).string = {
    in: [
      "",
      "XS",
      "S",
      "M",
      "L",
      "XL"
    ]
  }];

  reserved 10; // scope — removed; acceptance_allow/deny are the sole boundary definitions.

  // Glob patterns for file paths expected to be modified.
  repeated string acceptance_allow = 11;

  // Glob patterns for file paths that must NOT be modified.
  repeated string acceptance_deny = 12;

  // Origin reference in "kind/name" format. Set to empty string to clear.
  optional string spawned_from = 13;

  // Personal annotation. Set to empty string to clear.
  optional string note = 14;

  // Glob patterns for file paths the work plans to create. Same syntax as
  // acceptance_allow. Empty list clears the field.
  repeated string creates = 15;

  // Canonical plan-manager plan backing this work item. Set empty strings to clear.
  optional shared.PlanRef plan_ref = 16;

  // Typed, stable acceptance criteria. Supplying this field replaces the
  // complete criterion list; an empty list explicitly clears it.
  repeated shared.BacklogCriterion acceptance_criteria = 17;
}

// UpdateItemRequest identifies an item and preserves PATCH presence through
// fields. Each entry is a snake_case field name from UpdateBacklogItemRequest;
// repeated fields may be intentionally empty when named here.
message UpdateItemRequest {
  string kind = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  UpdateBacklogItemRequest patch = 3 [(buf.validate.field).required = true];
  repeated string fields = 4 [(buf.validate.field).repeated.min_items = 1];
}

// A single blocking reason with forceability metadata.
message BlockingReason {
  // Human-readable description of the blocking condition.
  string message = 1;
  // Whether this reason can be overridden with force=true.
  bool forceable = 2;
}

// Per-item blocking summary for list views.
message ItemBlockingInfo {
  // Whether the item is currently blocked by dependencies.
  bool blocked = 1;
  // The "kind/name" keys of dependencies causing the block.
  repeated string blocking_dep_keys = 2;
  // Whether all blocking reasons are forceable (override available).
  bool all_forceable = 3;
}

// ListBacklogItemsResponse returns all backlog items.
message ListBacklogItemsResponse {
  repeated domain.BacklogItem items = 1;
  // Per-item blocking state keyed by "kind/name". Only includes items that
  // have dependencies; items without deps are omitted (not blocked).
  map<string, ItemBlockingInfo> blocking = 2;
}

// ArchivedFilter controls whether archived backlog items are excluded, shown
// exclusively, or included with active items.
enum ArchivedFilter {
  ARCHIVED_FILTER_UNSPECIFIED = 0;
  ARCHIVED_FILTER_EXCLUDE = 1;
  ARCHIVED_FILTER_ONLY = 2;
  ARCHIVED_FILTER_ALL = 3;
}

// ListBacklogItemsRequest carries every filter supported by the operator list
// surface. Optional booleans distinguish an omitted filter from false.
message ListBacklogItemsRequest {
  repeated string kinds = 1;
  repeated string statuses = 2;
  ArchivedFilter archived = 3;
  repeated string scenarios = 4;
  optional string spawned_from = 5;
  optional bool has_plan_ref = 6;
  optional string plan_ref = 7;
  optional bool stale = 8;
  // Verified team-member/profile identity that filed the item.
  optional string actor_id = 9;
}

// DeleteBacklogItemRequest identifies one backlog item to delete. Deletion is
// idempotent: deleting an item that no longer exists succeeds with deleted=false.
message DeleteBacklogItemRequest {
  string kind = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
}

// DeleteBacklogItemResponse reports whether an item was removed.
message DeleteBacklogItemResponse {
  bool deleted = 1;
}

// ReviewFollowUp is the typed recovery instruction required by a followup
// decision. It mirrors the durable backlog follow-up record without exposing a
// free-form JSON envelope.
message ReviewFollowUp {
  string steering = 1 [(buf.validate.field).string.min_len = 1];
  string disposition = 2 [(buf.validate.field).string = {
    in: [
      "follow_up_run",
      "replan",
      "new_items"
    ]
  }];
  repeated ReviewFollowUpItem items = 3;
}

message ReviewFollowUpItem {
  string kind = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string title = 3 [(buf.validate.field).string.min_len = 1];
}

// DecideAttemptRequest is the common operator decision envelope for a durable
// transition attempt. subject_kind and subject_ref identify the owning domain;
// round_num identifies the immutable attempt projection being decided.
message DecideAttemptRequest {
  string subject_kind = 1 [(buf.validate.field).string.min_len = 1];
  string subject_ref = 2 [(buf.validate.field).string.min_len = 1];
  uint32 round_num = 3 [(buf.validate.field).uint32.gt = 0];
  string decision = 4 [(buf.validate.field).string = {
    in: [
      "accept",
      "fail",
      "followup",
      "drop"
    ]
  }];
  string actor = 5 [(buf.validate.field).string.min_len = 1];
  string rationale = 6;
  repeated string accepted_proposal_ids = 7;
  optional ReviewFollowUp follow_up = 8;
}

message DecideAttemptResponse {
  domain.BacklogItem item = 1;
  string decision = 2;
  string status = 3;
  string rationale = 4;
  string decided_at = 5;
  optional string record_id = 6;
}

// VerifyAttemptEvidenceRequest records an operator's evidence verification or
// revocation against one durable attempt. Both changes require a real actor
// and reason so the canonical evidence ledger remains auditable.
message VerifyAttemptEvidenceRequest {
  string subject_kind = 1 [(buf.validate.field).string.min_len = 1];
  string subject_ref = 2 [(buf.validate.field).string.min_len = 1];
  uint32 round_num = 3 [(buf.validate.field).uint32.gt = 0];
  string evidence_id = 4 [(buf.validate.field).string.min_len = 1];
  bool verified = 5;
  string actor = 6 [(buf.validate.field).string.min_len = 1];
  string reason = 7 [(buf.validate.field).string.min_len = 1];
}

message VerifyAttemptEvidenceResponse {
  bool verified = 1;
}

// BacklogItemResponse returns a single backlog item.
message BacklogItemResponse {
  domain.BacklogItem item = 1;

  // True when CreateItem returned a pre-existing open item for the same
  // target + signature instead of creating a duplicate (creation-time dedup).
  // Always false on read paths (GetItem). Lets feedback-contract consumers tell
  // the user "this was already filed" rather than implying a fresh report.
  bool deduped = 2;
}

// GetBacklogItemRequest identifies a single backlog item by kind + name for the
// BacklogService.GetItem RPC.
message GetBacklogItemRequest {
  // Backlog kind: idea, research, fix, execute, chore.
  string kind = 1 [(buf.validate.field).string.min_len = 1];

  // Item name (folder name).
  string name = 2 [(buf.validate.field).string.min_len = 1];
}

// =============================================================================
// BACKLOG SERVICE (Connect RPC)
// =============================================================================
//
// Typed contract for the cross-scenario feedback flow: scenarios that detect a
// problem (triage-class) file a backlog item via CreateItem and poll its status
// + queue_position via GetItem. The shared generated client is what prevents the
// per-consumer wire drift that plagued the old hand-rolled issue-tracker
// clients. Operations migrate only when the typed contract preserves the full
// operator behavior; the UI may continue to consume the REST surface.
//
// @stability beta
service BacklogService {
  // ListItems returns the filtered operator backlog projection.
  rpc ListItems(ListBacklogItemsRequest) returns (ListBacklogItemsResponse);

  // CreateItem files a backlog item, applying creation-time dedup: if an open
  // item already exists for the same target + signature, the existing item is
  // returned with deduped=true instead of creating a duplicate.
  rpc CreateItem(CreateBacklogItemRequest) returns (BacklogItemResponse);

  // GetItem returns a single backlog item with its current status and computed
  // queue_position (items-ahead in the ranked pending set).
  rpc GetItem(GetBacklogItemRequest) returns (BacklogItemResponse);

  // UpdateItem applies an explicit field-preserving patch.
  rpc UpdateItem(UpdateItemRequest) returns (BacklogItemResponse);

  // DeleteItem removes an item and cleans dependent references. It is idempotent.
  rpc DeleteItem(DeleteBacklogItemRequest) returns (DeleteBacklogItemResponse);

  // DecideAttempt applies an auditable decision to a durable attempt. The
  // subject-specific domain validates allowed decisions and proposals.
  rpc DecideAttempt(DecideAttemptRequest) returns (DecideAttemptResponse);

  // VerifyAttemptEvidence records an auditable operator verification change
  // for evidence attached to the addressed attempt.
  rpc VerifyAttemptEvidence(VerifyAttemptEvidenceRequest) returns (VerifyAttemptEvidenceResponse);
}

// AutoFilerService exposes the governed backlog auto-filer operator surface.
//
// @stability beta
service AutoFilerService {
  // GetStatus returns the current policy settings plus the latest cycle
  // outcome and brake/cap accounting.
  rpc GetStatus(AutoFilerStatusRequest) returns (AutoFilerStatusResponse);

  // DismissSuggestion archives a suggested auto-filed item and remembers its
  // finding_ref so the same finding is not suggested again.
  rpc DismissSuggestion(DismissAutoFilerSuggestionRequest) returns (DismissAutoFilerSuggestionResponse);

  // RunNow forces one governed auto-filer cycle immediately and returns the
  // resulting status snapshot.
  rpc RunNow(AutoFilerRunNowRequest) returns (AutoFilerStatusResponse);
}

message AutoFilerStatusRequest {}

message AutoFilerRunNowRequest {}

message AutoFilerBrakeState {
  int32 window_days = 1;
  int32 minimum = 2;
  int32 observed = 3;
  bool braked = 4;
  string window_start_utc = 5;
  string window_end_utc = 6;
}

message AutoFilerStatusResponse {
  bool enabled = 1;
  string mode = 2;
  string strategy = 3;
  string last_cycle_time = 4;
  string last_error = 5;
  int32 candidates = 6;
  int32 findings = 7;
  int32 created = 8;
  int32 skipped_dismissed = 9;
  int32 open_auto_filed = 10;
  int32 max_open_auto_filed = 11;
  int32 remaining_budget = 12;
  AutoFilerBrakeState brake = 13;
  int32 dismissal_count = 14;
  int32 reconciled_closed = 15;
  int32 reconciled_noted = 16;
}

message DismissAutoFilerSuggestionRequest {
  string kind = 1 [(buf.validate.field).string = {
    in: [
      "idea",
      "research",
      "fix",
      "execute",
      "chore"
    ]
  }];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  optional string reason = 3;
}

message DismissAutoFilerSuggestionResponse {
  domain.BacklogItem item = 1;
  bool dismissed = 2;
}

// BacklogFilesResponse returns the file tree for a backlog item.
message BacklogFilesResponse {
  repeated shared.BacklogFile files = 1;
}

// BacklogFileResponse returns a single file node.
message BacklogFileResponse {
  shared.BacklogFile file = 1;
}

// BacklogFileOperationRequest applies a filesystem operation within a backlog item.
message BacklogFileOperationRequest {
  // Operation to apply.
  // @constraint one of: rename, move, copy, delete
  string operation = 1 [(buf.validate.field).string = {
    in: [
      "rename",
      "move",
      "copy",
      "delete"
    ]
  }];

  // Source path relative to backlog item root.
  string source_path = 2 [(buf.validate.field).string.min_len = 1];

  // Destination path relative to backlog item root.
  // Required for rename/move/copy. Ignored for delete.
  optional string destination_path = 3;
}

// BacklogFileOperationResponse reports the result of a file operation.
message BacklogFileOperationResponse {
  // Result file node for rename/move/copy operations.
  optional shared.BacklogFile file = 1;

  // Deleted path for delete operations.
  optional string deleted_path = 2;
}

// QueueBacklogItemRequest queues a backlog item for processing.
message QueueBacklogItemRequest {
  // Optional operation hint for idea processing.
  optional string operation = 1 [(buf.validate.field).string = {
    in: [
      "generator",
      "improver"
    ]
  }];
  // Execution mode override (defaults to policy default).
  optional string mode = 2 [(buf.validate.field).string = {
    in: [
      "manual",
      "yolo"
    ]
  }];
  reserved 3;
  // Human or agent identifier that initiated the queue action.
  optional string started_by = 4;
  // Explicit confirmation to execute queue mutation. If false or unset, request
  // is treated as a preview/dry-run and no mutation occurs.
  optional bool confirm = 5;
  // Override queue readiness feedback gates (unanswered questions / pending
  // suggestions). API-level safety checks remain for non-overridable constraints.
  optional bool force = 6;
  // Declared execution strategy. Omitted selects the sole default strategy.
  optional string strategy = 7;
  // Maximum plan slices for this execution, inclusive range 1..6.
  optional int32 max_slices = 8 [(buf.validate.field).int32 = {
    gte: 1
    lte: 6
  }];
}

// QueueBacklogItemResponse returns queue results.
message QueueBacklogItemResponse {
  domain.BacklogItem item = 1;
  string task_id = 2;
  string run_id = 3;
  string base_url = 4;
  string created = 5;
  // True when request ran in preview mode and no mutation occurred.
  bool dry_run = 6;
  // True when a queue mutation actually occurred.
  bool queued = 7;
  // Human-readable summary of outcome.
  string message = 8;
  // Blocking reasons when queue did not execute.
  repeated BlockingReason blocking_reasons = 9;
  // Number of unanswered clarification questions detected.
  int32 unanswered_questions = 10;
  // Number of suggestions still pending user decision.
  int32 pending_suggestions = 11;
  // Non-blocking advisories surfaced to the caller (e.g. the
  // fix-before-feature gate in "suggest" mode). The queue still proceeds.
  repeated string advisories = 12;
}

// BacklogResearchRequest captures optional fields for spawning a research agent.
message BacklogResearchRequest {
  // Additional prompt context.
  optional string prompt = 1;

  reserved 2; // scope_path — removed; sandbox always uses project root.

  // Optional project root override.
  optional string project_root = 3;

  // Optional research mode.
  optional string mode = 4 [(buf.validate.field).string = {
    in: [
      "clarify",
      "suggest",
      "enhance",
      "finalize",
      "initialize",
      "workshop"
    ]
  }];

  reserved 5; // target_kind — removed; research items execute directly.

  // File paths within the backlog item to include as agent context (by reference).
  repeated string context_paths = 6;

  // Operational target IDs to attach as agent context.
  repeated string context_target_ids = 7;

  // Requirement IDs to attach as agent context.
  repeated string context_requirement_ids = 8;

  // Explicit confirmation to execute research. If false/unset, request is
  // treated as a preview/dry-run and no agent is spawned.
  optional bool confirm = 9;
  // Override forceable blocking reasons (e.g. unmet dependencies).
  optional bool force = 10;
}

// BacklogResearchResponse returns agent-manager identifiers for research runs.
message BacklogResearchResponse {
  string task_id = 1;
  string run_id = 2;
  string base_url = 3;
  string created = 4;
  // True when request ran in preview mode and no agent was spawned.
  bool dry_run = 5;
  // True when an agent was actually spawned.
  bool started = 6;
  // Human-readable summary of outcome.
  string message = 7;
  // Blocking reasons when research did not execute.
  repeated BlockingReason blocking_reasons = 8;
}

// ExportBacklogRequest defines filter criteria for exporting backlog items to markdown.
message ExportBacklogRequest {
  // Optional kinds to include (empty = all).
  repeated string kinds = 1;

  // Optional statuses to include (empty = all non-archived).
  repeated string statuses = 2;

  // Optional specific item keys (kind/name pairs) to export.
  repeated string names = 3;

  // Only include items with priority <= this value.
  optional int32 priority_max = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];

  // Only include items with any of these tags.
  repeated string tags = 5;

  // Whether to include PRD content in the export (default true).
  optional bool include_prd = 6;

  // Whether to include requirements in the export (default false).
  optional bool include_requirements = 7;

  // Whether to include clarify questions in the export (default true).
  optional bool include_clarify_questions = 8;

  // Whether to include suggestions in the export (default true).
  optional bool include_suggestions = 9;

  // Whether to include notes in the export (default true).
  optional bool include_notes = 10;

  // Whether to include the new-item template in the export (default true).
  optional bool include_template = 11;

  // Include archived records. Archived records are excluded by default.
  bool include_archived = 12;
}

// ImportBacklogResponse reports the results of importing an edited markdown export.
message ImportBacklogResponse {
  // Whether this was a dry-run (no changes applied).
  bool dry_run = 1;

  // List of changes detected or applied.
  repeated ImportChange changes = 2;

  // Any errors encountered during parsing.
  repeated string errors = 3;

  // Human-readable summary of the import.
  string summary = 4;
}
message ImportChange {
  // Item key (kind/name).
  string item = 1;

  // Action taken: "update" or "create".
  string action = 2;

  // Details of what changed.
  repeated string details = 3;
}

// =============================================================================
// WORKSHOP SAVE
// =============================================================================

// WorkshopSaveRequest saves a workshop round's responses and optionally
// auto-triggers the next round if the item is not yet ready.
message WorkshopSaveRequest {
  // The round number being saved.
  int32 round_number = 1 [(buf.validate.field).int32.gte = 1];

  // The round content as a JSON string.
  string content = 2 [(buf.validate.field).string.min_len = 1];

  reserved 3; // auto_workshop removed — use settings.auto_advance_workshop instead.
}

// WorkshopSaveResponse returns the result of saving a workshop round.
message WorkshopSaveResponse {
  // The saved file node.
  shared.BacklogFile file = 1;

  // Auto-advance decision metadata.
  WorkshopAutoAdvance auto_advance = 2;
}

// WorkshopAutoAdvance reports whether and why auto-advance was triggered.
message WorkshopAutoAdvance {
  // Whether the next round was auto-triggered.
  bool triggered = 1;

  // Agent-manager run ID (set only when triggered=true).
  optional string run_id = 2;

  // Agent-manager task ID (set only when triggered=true).
  optional string task_id = 3;

  // Reason for the decision: "not_ready", "finalizing", "max_rounds",
  // "pending_decisions", "disabled", "error", "no_rounds".
  string reason = 4;

  // The recommended next mode when manual follow-up is required.
  optional string next_mode = 5 [(buf.validate.field).string = {
    in: [
      "workshop",
      "finalize"
    ]
  }];

  // Whether an advance is pending (countdown active, not yet spawned).
  bool pending = 6;

  // When the pending advance will fire (RFC 3339 timestamp). Set when pending=true.
  optional string advance_at = 7;

  // Configured delay in seconds. Set when pending=true.
  int32 delay_seconds = 8;
}

// WorkshopDeleteRoundRequest deletes an entire workshop round and renumbers
// subsequent rounds to maintain contiguous numbering.
message WorkshopDeleteRoundRequest {
  // The round number to delete.
  int32 round_number = 1 [(buf.validate.field).int32.gte = 1];
}

// WorkshopDeleteRoundResponse reports the result of deleting a workshop round.
message WorkshopDeleteRoundResponse {
  // The round number that was deleted.
  int32 deleted_round = 1;

  // Total rounds remaining after deletion.
  int32 remaining_rounds = 2;
}

// WorkshopResetRequest resets an entire workshop, deleting all rounds,
// clarifications, attachments, and deliverables while preserving spec.json.
// Kind and name come from the URL path.
message WorkshopResetRequest {}

// WorkshopResetResponse reports the result of resetting a workshop.
message WorkshopResetResponse {
  // Number of rounds that were deleted.
  int32 deleted_rounds = 1;

  // Whether the item status was reverted from "ready" to "backlog".
  bool status_reverted = 2;
}

// =============================================================================
// CLARIFICATION API
// =============================================================================

// CreateClarificationRequest starts a new clarification thread for a decision.
message CreateClarificationRequest {
  // Workshop round number containing the decision.
  int32 round_number = 1 [(buf.validate.field).int32.gte = 1];

  // Decision item ID within the round.
  string item_id = 2 [(buf.validate.field).string.min_len = 1];

  // User's clarification question. Empty triggers a generic "explain this decision" prompt.
  string message = 3;

  // Optional attachment IDs (uploaded via agent-manager).
  repeated string attachment_ids = 4;
}

// CreateClarificationResponse returns the newly created thread.
message CreateClarificationResponse {
  domain.ClarificationThread thread = 1;
}

// ContinueClarificationRequest sends a follow-up message in an existing thread.
message ContinueClarificationRequest {
  // Follow-up message text.
  string message = 1 [(buf.validate.field).string.min_len = 1];

  // Optional attachment IDs.
  repeated string attachment_ids = 2;
}

// ContinueClarificationResponse returns the updated thread.
message ContinueClarificationResponse {
  domain.ClarificationThread thread = 1;
}

// GetClarificationResponse returns an existing clarification thread.
message GetClarificationResponse {
  domain.ClarificationThread thread = 1;
}

// ClarificationActionRequest applies a post-clarification action.
message ClarificationActionRequest {
  // Action to apply.
  // @constraint one of: got_it, update_decision, remove_decision, invalidate_round
  string action = 1 [(buf.validate.field).string = {
    in: [
      "got_it",
      "update_decision",
      "remove_decision",
      "invalidate_round"
    ]
  }];

  // For update_decision: JSON-encoded updated item (topic, context, options).
  optional string updated_item_json = 2;
}

// ClarificationActionResponse reports the result of a clarification action.
message ClarificationActionResponse {
  // The action that was applied.
  string action = 1;

  // Whether the action succeeded.
  bool success = 2;

  // Human-readable result message.
  string message = 3;

  // Agent-manager run ID (set when invalidate_round spawns a new agent).
  optional string run_id = 4;

  // Agent-manager task ID (set when invalidate_round spawns a new agent).
  optional string task_id = 5;
}

// =============================================================================
// REVIEW EVIDENCE API
// =============================================================================

// ListReviewRoundsResponse returns all review evidence rounds for a backlog item.
message ListReviewRoundsResponse {
  repeated domain.ReviewEvidenceRound rounds = 1;
}

// VerifyEvidenceRequest marks an evidence item as verified or unverified.
message VerifyEvidenceRequest {
  bool verified = 1;
}

// RequestMoreEvidenceRequest asks the review agent for additional evidence.
message RequestMoreEvidenceRequest {
  string message = 1 [(buf.validate.field).string.min_len = 1];
  // Optionally scope the request to a specific evidence item.
  optional string evidence_id = 2;
}

// RequestMoreEvidenceResponse returns the created thread ID.
message RequestMoreEvidenceResponse {
  string thread_id = 1;
}

// ContinueEvidenceRequestRequest sends a follow-up message in a request thread.
message ContinueEvidenceRequestRequest {
  string message = 1 [(buf.validate.field).string.min_len = 1];
}
