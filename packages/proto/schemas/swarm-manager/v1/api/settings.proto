syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";
import "swarm-manager/v1/domain/settings.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/api;api";

// =============================================================================
// SETTINGS API
// =============================================================================
//
// @layer 5
// @domain api
// @imports settings
// @stability beta
//
// HTTP API contracts for Swarm Manager settings.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// SettingsResponse returns current settings.
message SettingsResponse {
  Settings settings = 1;
}

// UpdateSettingsRequest applies partial settings updates.
message UpdateSettingsRequest {
  // Optional theme override.
  optional string theme = 1 [(buf.validate.field).string = { in: ["", "dark", "light", "system"] }];

  reserved 2, 3, 4;

  // Execution defaults.
  optional string default_mode = 5 [(buf.validate.field).string = { in: ["", "manual", "scheduled", "yolo"] }];
  optional int64 default_delay_seconds = 6;
  optional bool auto_fixup = 7;
  optional int32 max_fixup_attempts = 8;

  // Workshop settings.
  optional int32 max_auto_rounds = 9;
  optional bool auto_initialize_workshop = 16;
  optional bool auto_advance_workshop = 17;
  optional bool auto_cascade_workshop = 18;

  // Agent behavior settings.
  optional int32 agent_max_turns = 10;
  optional int32 agent_timeout_seconds = 11;
  optional bool agent_requires_approval = 12;

  // UI preference settings.
  optional int32 search_debounce_ms = 13;
  optional int32 toast_duration_ms = 14;
  optional bool confirm_destructive_actions = 15;
}
