syntax = "proto3";

package vrooli.swarm_manager.v1.api;

import "buf/validate/validate.proto";
import "swarm-manager/v1/domain/settings.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/api;api";

// =============================================================================
// SETTINGS API
// =============================================================================
//
// @stability beta
//
// HTTP API contracts for Swarm Manager settings.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// SettingsResponse returns current settings plus the derived policy-control
// projection (which controls are policy-level vs pure user preference, and
// their effective values for the operation runner's transition policies).
message SettingsResponse {
  domain.Settings settings = 1;
  SettingsPolicyProjection policy_projection = 2;
}

// SettingsFieldRole classifies a persisted settings field's role in the
// declarative agent-operations model.
enum SettingsFieldRole {
  SETTINGS_FIELD_ROLE_UNSPECIFIED = 0;
  // Pure user preference (UI behavior); never consumed by orchestration.
  SETTINGS_FIELD_ROLE_USER_PREFERENCE = 1;
  // Policy control: consumed by the operation runner's transition-policy /
  // binding-default seam. Retained user-facing, read through PolicyControls.
  SETTINGS_FIELD_ROLE_POLICY_CONTROL = 2;
  // System governance (concurrency lanes, queue depth, circuit breaker, cost
  // caps); consumed via the governance seam, not transition policies.
  SETTINGS_FIELD_ROLE_GOVERNANCE = 3;
  // Persisted but currently has no runtime reader. Kept for compatibility;
  // Phase 8 decides its migration alongside its projected destination.
  SETTINGS_FIELD_ROLE_DORMANT = 4;
}

// SettingsFieldClassification maps one persisted settings field to its role
// and (for policy controls) its destination path inside PolicyControlsView.
message SettingsFieldClassification {
  // Persisted JSON field name in domain.Settings (e.g. "auto_advance_workshop").
  string field = 1;
  SettingsFieldRole role = 2;
  // Destination control path (e.g. "auto_advance.delay_seconds"); empty for
  // non-policy fields.
  string control = 3;
  // Short human-readable explanation.
  string note = 4;
}

// PolicyControlsView is the effective policy-control projection derived from
// current settings — the typed values orchestration consumers (review
// spawning, fixup/retry, execution posture) read.
message PolicyControlsView {
  // Execution posture.
  string default_mode = 1;
  reserved 2, 3, 4, 5, 6;
  reserved "auto_initialize", "auto_advance_enabled", "cascade_enabled", "auto_advance_delay_seconds", "max_auto_rounds";
  // Retry/fixup group.
  bool auto_fixup = 7;
  int32 max_fixup_attempts = 8;
  // Review group.
  bool review_agent_enabled = 9;
  double review_code_quality_min_score = 10;
  double review_test_min_pass_rate = 11;
  int32 review_max_blocking_violations = 12;
  int32 review_max_warnings = 13;
  bool review_require_screenshots = 14;
  bool review_require_tests = 15;
  // Agent budget group.
  int32 agent_max_turns = 16;
  int32 agent_timeout_seconds = 17;
  map<string, string> autonomy_gate_modes = 18;
}

// SettingsPolicyProjection carries the effective policy controls plus the
// per-field classification table so clients can label which settings are
// policy-level versus user preference.
message SettingsPolicyProjection {
  PolicyControlsView effective_controls = 1;
  repeated SettingsFieldClassification classifications = 2;
}

// AutoFilerSettingsPatch applies partial updates to domain.Settings.auto_filer.
message AutoFilerSettingsPatch {
  optional bool enabled = 1;
  optional string mode = 2 [(buf.validate.field).string = {
    in: [
      "",
      "suggest",
      "auto_add"
    ]
  }];
  optional string strategy = 3 [(buf.validate.field).string = {
    in: [
      "",
      "feature_pending",
      "importance"
    ]
  }];
  optional int32 max_open_auto_filed = 4;
  optional int32 velocity_window_days = 5;
  optional int32 min_velocity_transitions = 6;
  optional int32 interval_minutes = 7;
  optional string goal_name = 8;
}

// UpdateSettingsRequest applies partial settings updates.
message UpdateSettingsRequest {
  // Optional theme override.
  optional string theme = 1 [(buf.validate.field).string = {
    in: [
      "",
      "dark",
      "light",
      "system"
    ]
  }];

  reserved 2, 3, 4;

  // Execution defaults.
  optional string default_mode = 5 [(buf.validate.field).string = {
    in: [
      "",
      "manual",
      "yolo"
    ]
  }];
  reserved 6;
  optional bool auto_fixup = 7;
  optional int32 max_fixup_attempts = 8;
  optional bool review_agent_enabled = 31;

  // Retired Plan Workshop automation settings. Sessions are explicitly
  // started by an operator.
  reserved 9, 16, 17, 18;
  reserved "max_auto_rounds", "auto_initialize_workshop", "auto_advance_workshop", "auto_cascade_workshop";

  // Agent behavior settings.
  optional int32 agent_max_turns = 10;
  optional int32 agent_timeout_seconds = 11;
  reserved 12;
  reserved "agent_requires_approval";

  // UI preference settings.
  optional int32 search_debounce_ms = 13;
  optional int32 toast_duration_ms = 14;
  reserved 15;
  reserved "confirm_destructive_actions";
  // Field 33 held the fixed-shape domain.DeleteConfirmationSettings message.
  // Replaced by the open-ended map below. Reserved to prevent reuse.
  reserved 33;
  reserved "delete_confirmation";
  // Per-entity-type delete confirmation levels, keyed by entity-type string.
  // Absent map = leave delete confirmation untouched; a present map fully
  // replaces the known-entity level set (unknown keys are preserved by the
  // API for forward-compat).
  map<string, domain.DeleteConfirmLevel> delete_confirmation_levels = 37;

  // Review thresholds.
  optional double review_code_quality_min_score = 19;
  optional double review_test_min_pass_rate = 20;
  optional int32 review_max_blocking_violations = 21;
  optional int32 review_max_warnings = 22;
  optional bool review_require_screenshots = 23;
  optional bool review_require_tests = 24;

  // Concurrency and governance settings.
  // Per-phase-kind concurrency caps. Keys are lane names matching
  // operatingmode.PhaseKind values: "investigate", "execute", "review",
  // "reconcile". Empty map means leave each lane at its current value;
  // present keys overwrite. Replaces the legacy single global cap
  // (reserved 25).
  map<string, int32> lane_concurrency_limits = 34;
  optional int32 max_queue_depth = 26;
  optional int32 circuit_breaker_threshold = 27;
  optional int32 circuit_breaker_cooldown_minutes = 28;
  optional double execution_cost_cap_per_run = 29;
  optional double cost_per_turn_estimate = 30;

  // Fix-before-feature gate controls (see domain domain.Settings).
  optional string fix_before_feature = 35 [(buf.validate.field).string = {
    in: [
      "",
      "off",
      "suggest",
      "block"
    ]
  }];
  AutoFilerSettingsPatch auto_filer = 38;
  map<string, string> autonomy_gate_modes = 39;

  reserved 25, 36;
  reserved "max_concurrent_executions";
}
