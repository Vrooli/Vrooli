syntax = "proto3";

package swarm_manager.v1;

import "buf/validate/validate.proto";
import "swarm-manager/v1/domain/recommendation.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/api;api";

// =============================================================================
// RECOMMENDATIONS API
// =============================================================================
//
// @layer 5
// @domain api
// @imports recommendations
// @stability beta
//
// HTTP API contracts for Swarm Manager recommendations.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// ListRecommendationsResponse returns all recommendations.
message ListRecommendationsResponse {
  repeated Recommendation recommendations = 1;
}

// RecommendationResponse returns a single recommendation.
message RecommendationResponse {
  Recommendation recommendation = 1;
}

// CreateRecommendationRequest accepts manual recommendation creation.
message CreateRecommendationRequest {
  // Target scenario name.
  string scenario_name = 1 [(buf.validate.field).string.min_len = 1];

  // Recommendation type.
  string type = 2 [(buf.validate.field).string = { in: ["test", "feature", "refactor", "docs"] }];

  // Recommendation description.
  string description = 3 [(buf.validate.field).string.min_len = 1];

  // Priority level (1 = highest, 5 = lowest).
  int32 priority = 4 [(buf.validate.field).int32 = { gte: 1, lte: 5 }];
}

// UpdateRecommendationRequest updates recommendation status.
message UpdateRecommendationRequest {
  // New recommendation status.
  optional string status = 1 [(buf.validate.field).string = { in: ["pending", "approved", "rejected"] }];
}

// StartRecommendationRequest allows optional overrides when starting a recommendation.
message StartRecommendationRequest {
  // Additional prompt context.
  optional string prompt = 1;

  // Optional scope path override.
  optional string scope_path = 2;

  // Optional project root override.
  optional string project_root = 3;

  // Optional creator identity.
  optional string created_by = 4;
}
