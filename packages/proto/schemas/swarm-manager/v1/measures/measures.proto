syntax = "proto3";

package vrooli.swarm_manager.v1.measures;

import "measures/v1/measures.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/swarm-manager/v1/measures;measures_v1";

// =============================================================================
// MEASURES DOMAIN
// =============================================================================
//
// @stability beta
//
// swarm-manager's declared analytical measures — the granular, individually
// addressable replacement for the monolithic /stats blob (see
// docs/plans measures-federated-metrics-layer). Each RPC answers ONE
// question-family ("how many backlog items were completed this week"),
// parameterized by the shared canonical vrooli.measures.v1.TimeWindow so that
// natural-language date extraction targets a typed, deterministically-resolvable
// field (no LLM) instead of a freeform string.
//
// Every method is read-only and run-eligible (governance.effect=read), so
// search-hub may auto-execute it at high confidence. The same compute path
// backs both these RPCs and the packages/measures-go serve registry mounted at
// /measures (GET /measures/declarations + POST /measures/execute), so a measure
// and its RPC can never report different numbers.
//
// All counts are computed over the append-only event log
// (api/internal/eventlog) — the existing CQRS substrate — via real SQL
// aggregates (SELECT COUNT(*) … WHERE timestamp IN [from, to)), never a
// list-and-filter.
//
// Procedure paths:
//   /vrooli.swarm_manager.v1.measures.MeasuresService/CountBacklogCompleted
//   /vrooli.swarm_manager.v1.measures.MeasuresService/CountBacklogCreated
//   /vrooli.swarm_manager.v1.measures.MeasuresService/CountExecutionsCompleted
//   /vrooli.swarm_manager.v1.measures.MeasuresService/CountGoalsCreated
//   /vrooli.swarm_manager.v1.measures.MeasuresService/CountAgentSessionsCreated
// =============================================================================

// CountBacklogCompletedRequest scopes the backlog-completion count to a window.
message CountBacklogCompletedRequest {
  // Time window the count is scoped to. The shared canonical TimeWindow type
  // makes this the `time_window` measure param: the manifest annotates a
  // `this_week` default and packages/measures-go resolves the token to a
  // concrete [from, to) range deterministically. An unset window resolves to
  // the manifest default.
  vrooli.measures.v1.TimeWindow window = 1;
}

// CountBacklogCompletedResponse carries the scalar value_field `count`.
message CountBacklogCompletedResponse {
  // Number of backlog items whose status transitioned to "completed" within the
  // requested window (counted from backlog.status_changed events).
  int64 count = 1;
}

// CountBacklogCreatedRequest scopes the backlog-creation count to a window.
message CountBacklogCreatedRequest {
  // Time window the count is scoped to (see CountBacklogCompletedRequest).
  vrooli.measures.v1.TimeWindow window = 1;
}

// CountBacklogCreatedResponse carries the scalar value_field `count`.
message CountBacklogCreatedResponse {
  // Number of backlog items created within the requested window (counted from
  // backlog.created events).
  int64 count = 1;
}

// CountBacklogNetDeltaRequest scopes the created-minus-completed backlog flow
// to one deterministic time window.
message CountBacklogNetDeltaRequest {
  vrooli.measures.v1.TimeWindow window = 1;
}

// CountBacklogNetDeltaResponse carries the net change in backlog volume. A
// positive count means work entered faster than it completed; a negative count
// means the backlog shrank.
message CountBacklogNetDeltaResponse {
  sint64 count = 1;
}

// CountBacklogOpenRequest is empty because open backlog is a current-state
// gauge over the durable projection, not a historical event flow.
message CountBacklogOpenRequest {}

// CountBacklogOpenResponse carries the number of non-archived, non-terminal
// backlog items that remain actionable.
message CountBacklogOpenResponse {
  int64 count = 1;
}

// CountBacklogBlockedRequest is empty because blocking is evaluated over the
// current durable dependency graph.
message CountBacklogBlockedRequest {}

// CountBacklogBlockedResponse carries the number of non-archived backlog items
// with at least one unresolved dependency.
message CountBacklogBlockedResponse {
  int64 count = 1;
}

// BacklogLeadTimeRequest scopes creation-to-completion duration samples to
// completions in the requested time window.
message BacklogLeadTimeRequest {
  vrooli.measures.v1.TimeWindow window = 1;
}

// BacklogLeadTimeResponse preserves the average, median, and sample size
// previously exposed by the stats timing section.
message BacklogLeadTimeResponse {
  double average_hours = 1;
  double median_hours = 2;
  int64 sample_size = 3;
}

// CountExecutionsCompletedRequest scopes the execution-completion count.
message CountExecutionsCompletedRequest {
  // Time window the count is scoped to (see CountBacklogCompletedRequest).
  vrooli.measures.v1.TimeWindow window = 1;
}

// CountExecutionsCompletedResponse carries the scalar value_field `count`.
message CountExecutionsCompletedResponse {
  // Number of executions that completed within the requested window (counted
  // from execution.completed events).
  int64 count = 1;
}

// CountGoalsCreatedRequest scopes the goal-creation count.
message CountGoalsCreatedRequest {
  // Time window the count is scoped to (see CountBacklogCompletedRequest).
  vrooli.measures.v1.TimeWindow window = 1;
}

// CountGoalsCreatedResponse carries the scalar value_field `count`.
message CountGoalsCreatedResponse {
  // Number of goals created within the requested window (counted from
  // goal.created events).
  int64 count = 1;
}

// CountAgentSessionsCreatedRequest scopes the agent-session-creation count.
message CountAgentSessionsCreatedRequest {
  // Time window the count is scoped to (see CountBacklogCompletedRequest).
  vrooli.measures.v1.TimeWindow window = 1;
}

// CountAgentSessionsCreatedResponse carries the scalar value_field `count`.
message CountAgentSessionsCreatedResponse {
  // Number of agent sessions created within the requested window (counted from
  // agent_session.created events).
  int64 count = 1;
}

// CountPlanRefsRequest intentionally has no time window: plan references are
// a current-state gauge over persisted backlog items, not an event flow.
message CountPlanRefsRequest {}

// CountPlanRefsResponse carries the number of backlog items that currently
// reference a canonical plan-manager plan.
message CountPlanRefsResponse {
  int64 count = 1;
}

// GoalMilestoneHealthRequest is empty because milestone health is a current
// durable-projection table, not a historical event flow.
message GoalMilestoneHealthRequest {}

message MilestoneHealth {
  string milestone = 1;
  int64 total = 2;
  int64 completed = 3;
  int64 in_progress = 4;
  int64 blocked = 5;
}

// GoalMilestoneHealthResponse lists current delivery health per milestone.
message GoalMilestoneHealthResponse {
  repeated MilestoneHealth milestones = 1;
}

// AgentSessionProposalRateRequest scopes proposal conversion to a time window.
message AgentSessionProposalRateRequest {
  vrooli.measures.v1.TimeWindow window = 1;
}

// AgentSessionProposalRateResponse carries the proportion of created proposals
// that were applied, plus the created-proposal denominator.
message AgentSessionProposalRateResponse {
  double rate = 1;
  int64 sample_size = 2;
}

// ExecutionSuccessRateRequest scopes terminal execution outcomes to a window.
message ExecutionSuccessRateRequest {
  vrooli.measures.v1.TimeWindow window = 1;
}

// ExecutionSuccessRateResponse carries completed / (completed + failed), with
// the terminal-outcome denominator used to calculate the rate.
message ExecutionSuccessRateResponse {
  double rate = 1;
  int64 sample_size = 2;
}

// ExecutionDurationRequest scopes completed execution duration samples.
message ExecutionDurationRequest {
  vrooli.measures.v1.TimeWindow window = 1;
}

// ExecutionDurationResponse exposes the former stats timing aggregate in
// minutes for completed execution events in the requested window.
message ExecutionDurationResponse {
  double average_minutes = 1;
  double median_minutes = 2;
  int64 sample_size = 3;
}

// ExecutionReviewRateRequest scopes the terminal execution review-rate.
message ExecutionReviewRateRequest {
  vrooli.measures.v1.TimeWindow window = 1;
}

// ExecutionReviewRateResponse carries the share of terminal executions that
// completed at least one review round, plus its terminal-run denominator.
message ExecutionReviewRateResponse {
  double rate = 1;
  int64 sample_size = 2;
}

// MeasuresService exposes swarm-manager's declared analytical measures as
// read-only, run-eligible Connect-RPC methods. Each is bound from a manifest
// `measure` block (cli/manifest.json) and shares its compute path with the
// /measures serve registry.
service MeasuresService {
  // CountBacklogCompleted answers "how many backlog items were completed in
  // <window>" — the marquee measure. Bound to the `backlog completed` measure.
  rpc CountBacklogCompleted(CountBacklogCompletedRequest) returns (CountBacklogCompletedResponse);

  // CountBacklogCreated answers "how many backlog items were created in
  // <window>". Bound to the `backlog created` measure.
  rpc CountBacklogCreated(CountBacklogCreatedRequest) returns (CountBacklogCreatedResponse);

  // CountBacklogNetDelta answers whether backlog volume grew or shrank within
  // the requested window. It shares the created/completed event computations.
  rpc CountBacklogNetDelta(CountBacklogNetDeltaRequest) returns (CountBacklogNetDeltaResponse);

  // CountBacklogOpen answers how many actionable backlog items currently remain.
  rpc CountBacklogOpen(CountBacklogOpenRequest) returns (CountBacklogOpenResponse);

  // CountBacklogBlocked answers how many backlog items are currently blocked.
  rpc CountBacklogBlocked(CountBacklogBlockedRequest) returns (CountBacklogBlockedResponse);

  // BacklogLeadTime answers how long completed backlog items took from
  // creation to completion.
  rpc BacklogLeadTime(BacklogLeadTimeRequest) returns (BacklogLeadTimeResponse);

  // CountExecutionsCompleted answers "how many executions completed in
  // <window>". Bound to the `execution completed` measure.
  rpc CountExecutionsCompleted(CountExecutionsCompletedRequest) returns (CountExecutionsCompletedResponse);

  // CountGoalsCreated answers "how many goals were created in
  // <window>". Bound to the `goal created` measure.
  rpc CountGoalsCreated(CountGoalsCreatedRequest) returns (CountGoalsCreatedResponse);

  // CountAgentSessionsCreated answers "how many agent sessions were created in
  // <window>". Bound to the `agent_session created` measure.
  rpc CountAgentSessionsCreated(CountAgentSessionsCreatedRequest) returns (CountAgentSessionsCreatedResponse);

  // CountPlanRefs answers how many backlog items currently carry a canonical
  // plan reference. It is backed by the durable backlog projection.
  rpc CountPlanRefs(CountPlanRefsRequest) returns (CountPlanRefsResponse);

  // GoalMilestoneHealth answers the current completion and blocking state for
  // each durable milestone.
  rpc GoalMilestoneHealth(GoalMilestoneHealthRequest) returns (GoalMilestoneHealthResponse);

  // AgentSessionProposalRate answers how often agent-session proposals were
  // applied within a window.
  rpc AgentSessionProposalRate(AgentSessionProposalRateRequest) returns (AgentSessionProposalRateResponse);

  // ExecutionSuccessRate answers the completion success rate for terminal runs.
  rpc ExecutionSuccessRate(ExecutionSuccessRateRequest) returns (ExecutionSuccessRateResponse);

  // ExecutionDuration answers how long completed executions ran.
  rpc ExecutionDuration(ExecutionDurationRequest) returns (ExecutionDurationResponse);

  // ExecutionReviewRate answers how often terminal executions reached a
  // completed review round.
  rpc ExecutionReviewRate(ExecutionReviewRateRequest) returns (ExecutionReviewRateResponse);
}
