syntax = "proto3";

package vrooli.web_console.v1.discovery;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/web-console/v1/discovery;discovery_v1";

// =============================================================================
// DISCOVERY DOMAIN — runtime endpoint discovery for dependent scenarios
// =============================================================================
//
// @layer 5  (api surface)
// @domain discovery
// @stability stable
//
// Web-console resolves the base URLs of dependent scenarios (audio-tools,
// etc.) server-side via api-core/discovery and surfaces them here so the
// browser never composes its own scenario URLs. Mirrors the
// "no client-side proxy URL composition" feedback rule.
// =============================================================================

service DiscoveryService {
  rpc GetAudioToolsEndpoint(GetAudioToolsEndpointRequest) returns (GetAudioToolsEndpointResponse);
}

message GetAudioToolsEndpointRequest {}

message GetAudioToolsEndpointResponse {
  // Whether audio-tools is currently reachable from the server-side
  // discovery resolver. When false, base_url / ws_base_url are empty
  // and unavailable_reason holds an operator-readable explanation.
  bool available = 1;

  // HTTP(S) base URL for Connect-RPC traffic (no trailing slash).
  // Example: "http://localhost:15000"
  string base_url = 2;

  // ws:// or wss:// base URL for WebSocket transports (e.g. voice stream).
  // Derived from base_url by scheme rewrite. Empty when available=false.
  string ws_base_url = 3;

  // Operator-facing reason text when available=false. Mapped to the
  // AudioUnavailableBanner in the browser. Stable token strings, e.g.
  // "discovery_failed", "scenario_not_running", "env_misconfigured".
  string unavailable_reason = 4;
}
