syntax = "proto3";

package vrooli.web_console.v1.modelselection;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/web-console/v1/modelselection;modelselection_v1";

// Read-only view of a local coding runner's resource-owned role policy.
service ModelSelectionService {
  rpc GetRoleModelChoices(GetRoleModelChoicesRequest) returns (GetRoleModelChoicesResponse);
}

message GetRoleModelChoicesRequest {
  string agent_id = 1;
  string target_id = 2;
  // The shortcut command a launch would start from, to tell whether settings can
  // apply to it. Empty asks only about the runner.
  string launch_command = 3;
}

message RoleModelChoice {
  string model = 1;
  string source = 2;
  string provider = 3;
  string launch_model = 4;
  string effort = 5;
  string source_label = 6;
  bool is_default = 7;
  // This model's context window in tokens. Zero means unknown, never unlimited.
  int64 context_window_tokens = 8;
  // Compaction limits a launch of this model may request. None exceeds the window.
  repeated int64 context_limit_tokens = 9;
  // The choice bills per use, so a stale catalog keeps it unselectable.
  bool metered = 10;
  // What the operator reads. `model` stays the catalog ID.
  string display_name = 11;
}

message GetRoleModelChoicesResponse {
  // ready, stale, unknown, or unsupported.
  string policy_status = 1;
  // Provider runtime availability is never implied by static role policy.
  string availability = 2;
  string runner = 3;
  string role = 4;
  string provenance = 5;
  string observed_at = 6;
  string policy_digest = 7;
  repeated RoleModelChoice choices = 8;
  string detail = 9;
  string model_flag = 10;
  // The catalog is past its freshness budget. Unmetered choices stay selectable.
  bool catalog_stale = 11;
  // How the operator refreshes a list the RefreshCatalog action cannot. Empty
  // when the action can.
  string operator_command = 12;
  // The launch command is the operator's own: a wrapper, or one naming its own
  // model or limit. It runs as written, so a launch cannot apply these settings.
  bool command_literal = 13;
}
