syntax = "proto3";

package vrooli.web_console.v1.ai;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/web-console/v1/ai;ai_v1";

// =============================================================================
// AI DOMAIN — command generation, suggestions, provider configuration
// =============================================================================
//
// @layer 5  (api surface)
// @domain ai
// @stability stable
//
// Wire contract for the AIService Connect-RPC service. Covers AI command
// generation (Ollama -> OpenRouter failover chain), multi-command
// suggestions, and provider configuration/health.
//
// Consumed by:
//   - API: handlers/ai/connect_handler.go
//   - UI:  ui/src/api/ai.ts (Connect-Web client)
//   - CLI: cli/domains/ai/register.go (Connect-Go client)
// =============================================================================

service AIService {
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  rpc Suggest(SuggestRequest) returns (SuggestResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
}

// GenerateRequest asks the provider chain to produce a single shell command
// for the given natural-language prompt. context carries optional terminal
// state (cwd, recent output) the model can use.
message GenerateRequest {
  string prompt = 1;
  string context = 2;
}

message GenerateResponse {
  string command = 1;
  string provider = 2; // "ollama" or "openrouter"
}

// SuggestRequest asks for 1-3 candidate shell commands.
message SuggestRequest {
  string prompt = 1;
  string context = 2;
}

message SuggestResponse {
  repeated string commands = 1;
  string provider = 2;
}

// ProviderConfig is the persisted config for a single AI provider.
message ProviderConfig {
  string name = 1;
  bool enabled = 2;
  int32 priority = 3; // lower = tried first
  int32 timeout_sec = 4;
  int32 max_retries = 5;
}

// ProviderHealth is the runtime health snapshot for a single provider.
message ProviderHealth {
  string name = 1;
  bool available = 2;
  string last_check = 3;
  string last_latency = 4;
  int64 error_count = 5;
  int64 success_count = 6;
  double error_rate = 7;
}

message GetConfigRequest {}

message GetConfigResponse {
  repeated ProviderConfig providers = 1;
  repeated ProviderHealth health = 2;
}

// UpdateConfigRequest applies a partial update to one provider's config.
// Only fields with has_* = true are applied. timeout_sec must be 1..120 and
// max_retries must be 0..5 when set.
message UpdateConfigRequest {
  string name = 1;

  bool enabled = 2;
  bool has_enabled = 3;

  int32 priority = 4;
  bool has_priority = 5;

  int32 timeout_sec = 6;
  bool has_timeout_sec = 7;

  int32 max_retries = 8;
  bool has_max_retries = 9;
}

message UpdateConfigResponse {
  repeated ProviderConfig providers = 1;
  repeated ProviderHealth health = 2;
}

message GetHealthRequest {}

message GetHealthResponse {
  repeated ProviderHealth health = 1;
}
