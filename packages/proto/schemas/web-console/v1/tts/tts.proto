syntax = "proto3";

package vrooli.web_console.v1.tts;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/web-console/v1/tts;tts_v1";

// =============================================================================
// TTS DOMAIN — text-to-speech config, summarization config, synthesis, cache,
//              voices, runtime status, and playback events.
// =============================================================================
//
// @layer 5  (api surface)
// @domain tts
// @stability stable
//
// Wire contract for TTSService. Mirrors nine legacy REST routes:
//   GET    /api/v1/tts/config             -> GetConfig
//   PUT    /api/v1/tts/config             -> UpdateConfig
//   GET    /api/v1/tts/status             -> GetStatus
//   POST   /api/v1/tts/events             -> RecordPlaybackEvent
//   GET    /api/v1/tts/summarize/config   -> GetSummarizeConfig
//   PUT    /api/v1/tts/summarize/config   -> UpdateSummarizeConfig
//   POST   /api/v1/tts/synthesize         -> Synthesize   (returns audio bytes)
//   GET    /api/v1/tts/cache/{eventId}    -> GetCache     (returns audio bytes)
//   GET    /api/v1/tts/voices             -> ListVoices
//
// Audio responses (Synthesize, GetCache) return raw bytes + a content_type
// hint. Optional Update fields use the has_* pattern so callers can
// distinguish "field omitted" from "field set to zero".
//
// Consumed by:
//   - API: handlers/tts/connect_handler.go
//   - UI:  ui/src/api/tts.ts
//   - CLI: cli/domains/tts/register.go
// =============================================================================

service TTSService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc RecordPlaybackEvent(RecordPlaybackEventRequest) returns (RecordPlaybackEventResponse);
  rpc GetSummarizeConfig(GetSummarizeConfigRequest) returns (GetSummarizeConfigResponse);
  rpc UpdateSummarizeConfig(UpdateSummarizeConfigRequest) returns (UpdateSummarizeConfigResponse);
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);
  rpc GetCache(GetCacheRequest) returns (GetCacheResponse);
  rpc ListVoices(ListVoicesRequest) returns (ListVoicesResponse);
}

// -----------------------------------------------------------------------------
// Config
// -----------------------------------------------------------------------------

// Config holds the auto-TTS configuration.
message Config {
  bool auto_enabled = 1;
  string backend = 2;       // "auto" | "kokoro" | "browser"
  string kokoro_voice = 3;
  double kokoro_speed = 4;  // 0.5–4.0
}

message GetConfigRequest {}

message GetConfigResponse {
  Config config = 1;
}

// UpdateConfigRequest patches non-nil fields. has_* flags signal "set this
// field" (matches the legacy pointer-field patch behaviour).
message UpdateConfigRequest {
  bool auto_enabled = 1;
  bool has_auto_enabled = 2;
  string backend = 3;
  bool has_backend = 4;
  string kokoro_voice = 5;
  bool has_kokoro_voice = 6;
  double kokoro_speed = 7;
  bool has_kokoro_speed = 8;
}

message UpdateConfigResponse {
  Config config = 1;
}

// -----------------------------------------------------------------------------
// Summarize config
// -----------------------------------------------------------------------------

// SummarizeConfig controls long-response summarization before TTS.
message SummarizeConfig {
  bool enabled = 1;
  int32 char_threshold = 2;
  string level = 3;             // "light" | "moderate" | "heavy"
  string model = 4;
  int32 timeout_seconds = 5;
}

message GetSummarizeConfigRequest {}

message GetSummarizeConfigResponse {
  SummarizeConfig config = 1;
}

message UpdateSummarizeConfigRequest {
  bool enabled = 1;
  bool has_enabled = 2;
  int32 char_threshold = 3;
  bool has_char_threshold = 4;
  string level = 5;
  bool has_level = 6;
  string model = 7;
  bool has_model = 8;
  int32 timeout_seconds = 9;
  bool has_timeout_seconds = 10;
}

message UpdateSummarizeConfigResponse {
  SummarizeConfig config = 1;
}

// -----------------------------------------------------------------------------
// Status
// -----------------------------------------------------------------------------

// AppendResult mirrors conversation_store.ConversationAppendResult — embedded
// in TTS status snapshots that record where the most recent assistant event
// was routed and whether it actually landed in the conversation log.
message AppendResult {
  bool appended = 1;
  string code = 2;
  string reason = 3;
  string source = 4;
  string session_id = 5;
  string event_id = 6;
  int64 sequence = 7;
  bool duplicate = 8;
}

// ClientAck records terminal-side playback outcomes for a routed event.
message ClientAck {
  string event_id = 1;
  string source = 2;
  string session_id = 3;
  string stage = 4;
  string backend = 5;
  string message = 6;
}

// PlaybackEvent is what UI clients post to RecordPlaybackEvent.
message PlaybackEvent {
  string source = 1;
  string stage = 2;
  string backend = 3;
  string session_id = 4;
  string message = 5;
}

// Status is the full /tts/status snapshot.
message Status {
  Config config = 1;
  bool hook_registered = 2;
  string hook_code = 3;
  string hook_reason = 4;
  string hook_settings_path = 5;

  AppendResult last_routing = 6;
  string last_routing_at = 7;
  AppendResult last_hook_routing = 8;
  string last_hook_routing_at = 9;
  AppendResult last_tailer_routing = 10;
  string last_tailer_routing_at = 11;

  ClientAck last_ack = 12;
  string last_ack_at = 13;
  ClientAck last_hook_ack = 14;
  string last_hook_ack_at = 15;
  ClientAck last_tailer_ack = 16;
  string last_tailer_ack_at = 17;

  PlaybackEvent last_playback_event = 18;
  string last_playback_at = 19;

  string kokoro_capability = 20;
  string kokoro_capability_label = 21;
}

message GetStatusRequest {}

message GetStatusResponse {
  Status status = 1;
}

// -----------------------------------------------------------------------------
// Playback events
// -----------------------------------------------------------------------------

message RecordPlaybackEventRequest {
  PlaybackEvent event = 1;
}

message RecordPlaybackEventResponse {
  string status = 1;
}

// -----------------------------------------------------------------------------
// Synthesis, cache, voices
// -----------------------------------------------------------------------------

message SynthesizeRequest {
  string input = 1;
  string voice = 2;
  string response_format = 3;  // "mp3" | "wav" | "opus" | "flac"
  double speed = 4;
  // event_id + version are optional; when set, the server also stores the
  // synthesized audio in the on-disk cache for later replay via GetCache.
  string event_id = 5;
  string version = 6;
}

message SynthesizeResponse {
  bytes audio = 1;
  string content_type = 2;
}

message GetCacheRequest {
  string event_id = 1;
  string voice = 2;
  double speed = 3;
  string version = 4;          // defaults to "active"
}

message GetCacheResponse {
  bytes audio = 1;
  string content_type = 2;
}

message Voice {
  string id = 1;
  string name = 2;
}

message ListVoicesRequest {}

message ListVoicesResponse {
  repeated Voice voices = 1;
}
