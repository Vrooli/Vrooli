syntax = "proto3";

package vrooli.web_console.v1.events;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/web-console/v1/events;events_v1";

// =============================================================================
// EVENTS DOMAIN — lifecycle event ring buffer
// =============================================================================
//
// @layer 5  (api surface)
// @domain events
// @stability stable
//
// Wire contract for EventsService. Replaces the prior REST snapshot at
// /api/v1/events. Surfaces a bounded history of structured lifecycle
// events (session.created, ai.generate, workspace.layout_updated, ...)
// emitted by the api/EventLogger.
//
// Real-time streaming is intentionally not modeled here yet — when the
// SSE/WebSocket surface is migrated to Connect server-streaming, add a
// `Stream` RPC alongside `List` in this same service so the streaming
// pattern is decided once for the whole scenario.
// =============================================================================

service EventsService {
  // List returns the most recent events from the in-memory ring buffer,
  // newest last. Used by `web-console events` and any UI surface that
  // wants a one-shot snapshot.
  rpc List(ListRequest) returns (ListResponse);
}

// Event mirrors api/events.go Event field-for-field. Timestamp is
// encoded as RFC3339 so the wire shape matches the prior JSON.
message Event {
  // Event type, e.g., "session.created", "ai.generate".
  string type = 1;

  // Session that emitted the event; empty for non-session events.
  string session_id = 2;

  // RFC3339 timestamp at which the event was emitted.
  string timestamp = 3;

  // Free-form key/value details. Optional.
  map<string, string> details = 4;
}

message ListRequest {
  // Maximum number of events to return. Server caps at 1000; zero or
  // negative is treated as the default (50).
  int32 limit = 1;
}

message ListResponse {
  // Events in oldest-to-newest order.
  repeated Event events = 1;

  // Total events ever recorded since process start (may exceed
  // events.length when the ring buffer has wrapped).
  int32 total = 2;
}
