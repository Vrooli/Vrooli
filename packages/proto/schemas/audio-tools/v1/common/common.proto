syntax = "proto3";

package vrooli.audio_tools.v1.common;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/audio-tools/v1/common;common_v1";

// =============================================================================
// COMMON ENUMS — shared typed values used across audio-tools v1 domains.
// =============================================================================
//
// @layer 5  (api surface)
// @domain common
// @stability stable
//
// These enums replace the freeform string fields that previously carried
// the same semantics across stt/tts/summarize/session/settings/usage. Each
// has an explicit `*_UNSPECIFIED = 0` first value so the wire shape is
// proto3-safe (zero value is meaningful as "absent").
//
// -----------------------------------------------------------------------------
// Enum-ownership convention (audio-tools v1)
// -----------------------------------------------------------------------------
//
// Global / cross-domain enums (ProviderTier, AudioFormat, ResponseFormat)
// live in THIS file. They model values referenced by 2+ domains
// (stt/tts/summarize/audio/usage/...). Add a new global enum here only
// when the same semantics already exist in or are about to enter a
// second domain — until then, keep the enum in its owning domain proto.
//
// Domain-specific enums (e.g., stt.SpeakerMode, stt.StreamingMode,
// audio.NormalizationMethod, health_status.State) live in the owning
// domain's .proto file. They are never lifted to common.proto unless
// they cross domain boundaries.
//
// Capability values (STT / TTS / SUMMARIZE / TRANSCODE) live in
// diagnostics.proto because they were originally introduced there and
// the diagnostics domain owns the canonical list.
//
// Rule of thumb: freeform `string` fields modelling a closed set of
// values are a smell. Prefer a typed enum. If the closed set crosses
// domains, the enum belongs here; otherwise it belongs in the domain
// .proto. Either way: never `string`.
// =============================================================================

// ProviderTier identifies which routing tier handled a request. Fixed
// precedence: BYOK -> VROOLI -> LOCAL. ErrInsufficientCredits from the
// VROOLI tier short-circuits and does NOT fall through to LOCAL.
enum ProviderTier {
  PROVIDER_TIER_UNSPECIFIED = 0;
  PROVIDER_TIER_LOCAL = 1;
  PROVIDER_TIER_BYOK = 2;
  PROVIDER_TIER_VROOLI = 3;
}

// AudioFormat identifies a container/codec for raw audio bytes carried on
// the wire (Transcribe inputs, Transcode/Trim/Merge/etc inputs).
enum AudioFormat {
  AUDIO_FORMAT_UNSPECIFIED = 0;
  AUDIO_FORMAT_WAV = 1;
  AUDIO_FORMAT_MP3 = 2;
  AUDIO_FORMAT_FLAC = 3;
  AUDIO_FORMAT_OGG = 4;
  AUDIO_FORMAT_WEBM = 5;
  AUDIO_FORMAT_OPUS = 6;
  AUDIO_FORMAT_AAC = 7;
  // Raw 16-bit signed little-endian PCM with no container. This is the
  // canonical internal STT representation (mono, 16 kHz); declaring it on
  // a streaming session takes the ffmpeg-free fast-path. See the
  // audioformat substrate (internal/audioformat) for the normalization
  // contract.
  AUDIO_FORMAT_PCM_S16LE = 8;
}

// ResponseFormat constrains TTS-synthesis output formats. The set is
// narrower than AudioFormat because TTS adapters can't emit every input
// format we accept.
enum ResponseFormat {
  RESPONSE_FORMAT_UNSPECIFIED = 0;
  RESPONSE_FORMAT_MP3 = 1;
  RESPONSE_FORMAT_WAV = 2;
  RESPONSE_FORMAT_OPUS = 3;
  RESPONSE_FORMAT_FLAC = 4;
}

// AudioToolsFeature enumerates the discoverable features the audio-tools
// scenario exposes to consumer scenarios (web-console, swarm-manager, ...).
// Consumers register a capability under the scenario slug
// (see AUDIO_TOOLS_CAPABILITY_SLUG in the audio-tools client libs) and
// list the AudioToolsFeature values they care about.
//
// Wire convention: the values' canonical slug form (kebab-case, without
// the AUDIO_TOOLS_FEATURE_ prefix) is what travels on the wire as
// `repeated string features` in web-console's CapabilitiesService.
// Slug ↔ enum mapping lives in the audio-tools Go (clients/go/audiotools)
// and TS (ui/src/audio-integration/features.ts) clients. Adding a new
// feature: add the enum value here, run `make generate`, then add the
// slug entry in both client mapping tables.
//
// DO NOT renumber existing values; the enum number is the stable identity
// even though the wire format is the slug string.
enum AudioToolsFeature {
  AUDIO_TOOLS_FEATURE_UNSPECIFIED = 0;
  // STT — voice input via batch transcription (HTTP POST).
  AUDIO_TOOLS_FEATURE_VOICE_INPUT = 1;
  // STT — voice streaming (WebSocket / Connect bidi).
  AUDIO_TOOLS_FEATURE_VOICE_STREAMING = 2;
  // STT — per-speaker verification against an enrolled voice print.
  AUDIO_TOOLS_FEATURE_VOICE_SPEAKER_VERIFICATION = 3;
  // STT — voice-print enrollment for later verification.
  AUDIO_TOOLS_FEATURE_VOICE_ENROLLMENT = 4;
  // TTS — voice synthesis output.
  AUDIO_TOOLS_FEATURE_VOICE_OUTPUT = 5;
  // TTS — summarization step before synthesis for long inputs.
  AUDIO_TOOLS_FEATURE_TTS_SUMMARIZATION = 6;
  // TTS — synthesized-audio caching for repeated text.
  AUDIO_TOOLS_FEATURE_TTS_CACHE = 7;
  // TTS — paragraph-level splitting for chunked synthesis.
  AUDIO_TOOLS_FEATURE_TTS_PARAGRAPH_SPLIT = 8;
  // Routing — three-tier provider routing (BYOK → VROOLI → LOCAL).
  AUDIO_TOOLS_FEATURE_AUDIO_PROVIDER_ROUTING = 9;
}
