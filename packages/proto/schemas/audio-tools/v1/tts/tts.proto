syntax = "proto3";

package vrooli.audio_tools.v1.tts;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/audio-tools/v1/tts;tts_v1";

// =============================================================================
// TTS DOMAIN — text-to-speech synthesis, voice catalog, content-addressable
//              cache, default TTS config, and pure text-preparation helpers
//              (NormalizeForSpeech, SplitParagraphs).
// =============================================================================
//
// @layer 5  (api surface)
// @domain tts
// @stability stable
//
// Provider routing: BYOK -> Vrooli/LPBS -> Local (fixed precedence).
//
// Cache is content-addressable: key = SHA256(voice|speed|format|text-content).
// Web-console wraps this cache with an event->content-key map maintained in
// conversation glue. The on-disk cache lives in audio-tools state scope.
//
// Voice IDs are canonical:
//   voice.feminine.warm, voice.feminine.neutral,
//   voice.masculine.warm, voice.masculine.neutral,
//   voice.neutral.default
// voice_overrides["tier:provider-id"] wins over the canonical mapping.
// =============================================================================

service TTSService {
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);
  rpc ListVoices(ListVoicesRequest) returns (ListVoicesResponse);
  rpc GetCache(GetCacheRequest) returns (GetCacheResponse);

  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc RecordPlaybackEvent(RecordPlaybackEventRequest) returns (RecordPlaybackEventResponse);

  // Pure text-preparation helpers. Consumers normally batch these into a
  // single per-utterance call. Kept on TTSService rather than a separate
  // service because they are TTS-pipeline-specific.
  rpc NormalizeForSpeech(NormalizeForSpeechRequest) returns (NormalizeForSpeechResponse);
  rpc SplitParagraphs(SplitParagraphsRequest) returns (SplitParagraphsResponse);
}

// -----------------------------------------------------------------------------
// Synthesize
// -----------------------------------------------------------------------------

message SynthesizeRequest {
  string text = 1;
  // Canonical voice ID (e.g., "voice.feminine.warm"). The active adapter
  // resolves this to a backend voice name via the catalog + voice_overrides.
  string voice = 2;
  // Per-call overrides keyed by "tier:provider-id" (e.g., "byok:elevenlabs").
  // Wins over the canonical mapping for the chosen tier.
  map<string, string> voice_overrides = 3;
  double speed = 4;                   // 0.5–4.0
  string response_format = 5;         // "mp3" | "wav" | "opus" | "flac"
  // Optional cache control. When event_id is set, the server stores the
  // synthesized audio under a content-addressable + event index.
  string event_id = 6;
  string version = 7;
}

message SynthesizeResponse {
  bytes audio = 1;
  string content_type = 2;
  string content_hash = 3;            // SHA256 of the synthesis input key
  string provider_tier = 4;
  string provider_id = 5;
  string model_id = 6;
  string voice_used = 7;              // resolved backend voice name
  double latency_ms = 8;
}

// -----------------------------------------------------------------------------
// Voices
// -----------------------------------------------------------------------------

message Voice {
  string id = 1;                      // canonical id (e.g., voice.feminine.warm)
  string name = 2;                    // human label
  string description = 3;
  // Per-adapter mapping snapshot ("byok:openai-tts" -> "alloy").
  map<string, string> adapter_mappings = 4;
}

message ListVoicesRequest {}

message ListVoicesResponse {
  repeated Voice voices = 1;
}

// -----------------------------------------------------------------------------
// Cache
// -----------------------------------------------------------------------------

message GetCacheRequest {
  // Either event_id + version (web-console glue path) OR content_hash
  // (direct hit) are accepted. Voice + speed + format disambiguate event_id.
  string event_id = 1;
  string voice = 2;
  double speed = 3;
  string version = 4;                 // defaults to "active"
  string content_hash = 5;            // direct content-addressable lookup
  string response_format = 6;
}

message GetCacheResponse {
  bytes audio = 1;
  string content_type = 2;
  string content_hash = 3;
  bool hit = 4;
}

// -----------------------------------------------------------------------------
// Default config (per-instance defaults; per-user moves later)
// -----------------------------------------------------------------------------

message Config {
  bool auto_enabled = 1;
  string default_voice = 2;           // canonical voice id
  double default_speed = 3;
  string default_response_format = 4;
  // Summarization thresholds for the long-text path.
  bool summarize_enabled = 5;
  int32 summarize_char_threshold = 6;
  string summarize_level = 7;         // "light" | "moderate" | "heavy"
  string summarize_model = 8;
  int32 summarize_timeout_seconds = 9;
}

message GetConfigRequest {}

message GetConfigResponse {
  Config config = 1;
}

message UpdateConfigRequest {
  bool auto_enabled = 1;
  bool has_auto_enabled = 2;
  string default_voice = 3;
  bool has_default_voice = 4;
  double default_speed = 5;
  bool has_default_speed = 6;
  string default_response_format = 7;
  bool has_default_response_format = 8;
  bool summarize_enabled = 9;
  bool has_summarize_enabled = 10;
  int32 summarize_char_threshold = 11;
  bool has_summarize_char_threshold = 12;
  string summarize_level = 13;
  bool has_summarize_level = 14;
  string summarize_model = 15;
  bool has_summarize_model = 16;
  int32 summarize_timeout_seconds = 17;
  bool has_summarize_timeout_seconds = 18;
}

message UpdateConfigResponse {
  Config config = 1;
}

// -----------------------------------------------------------------------------
// Status + playback ack
// -----------------------------------------------------------------------------

message ProviderAvailability {
  string tier = 1;                    // "byok" | "vrooli" | "local"
  string provider_id = 2;
  bool available = 3;
  string error = 4;
  string checked_at = 5;
}

message Status {
  Config config = 1;
  repeated ProviderAvailability availability = 2;
  string capability = 3;
  string capability_label = 4;
}

message GetStatusRequest {}

message GetStatusResponse {
  Status status = 1;
}

message PlaybackEvent {
  string source = 1;
  string stage = 2;
  string backend = 3;
  string session_id = 4;
  string message = 5;
  string event_id = 6;
}

message RecordPlaybackEventRequest {
  PlaybackEvent event = 1;
}

message RecordPlaybackEventResponse {
  string status = 1;
}

// -----------------------------------------------------------------------------
// Pure helpers
// -----------------------------------------------------------------------------

message NormalizeForSpeechRequest {
  string text = 1;
  // Optional: target voice influences certain normalization rules (e.g., the
  // pronunciation hints for symbol-heavy text).
  string voice = 2;
}

message NormalizeForSpeechResponse {
  string text = 1;
}

message SplitParagraphsRequest {
  string text = 1;
  // Maximum characters per paragraph chunk; 0 = adapter default.
  int32 max_chars = 2;
}

message SplitParagraphsResponse {
  repeated string paragraphs = 1;
}
