syntax = "proto3";

package vrooli.code_facts.v1.shared;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/code-facts/v1/shared;shared_v1";

// =============================================================================
// SHARED ERROR ENVELOPE
// =============================================================================
//
// @stability stable
//
// Connect-RPC methods use Connect's canonical error envelope and code set.
// Deliberate REST exceptions return this shape for non-2xx responses so CLI
// and UI clients can decode a generated proto type instead of a parallel DTO.
// =============================================================================

message ErrorEnvelope {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}
