syntax = "proto3";
package vrooli.deployment_manager.v1.lpbs;

import "google/protobuf/struct.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/deployment-manager/v1/lpbs;lpbsv1";
service LPBSService {
  rpc GetConfig(google.protobuf.Value) returns (google.protobuf.Value);
  rpc SaveConfig(google.protobuf.Value) returns (google.protobuf.Value);
}
