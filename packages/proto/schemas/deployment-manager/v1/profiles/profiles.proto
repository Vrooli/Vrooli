syntax = "proto3";

package vrooli.deployment_manager.v1.profiles;

import "buf/validate/validate.proto";
import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/deployment-manager/v1/profiles;profilesv1";

// =============================================================================
// DEPLOYMENT PROFILES
// =============================================================================
//
// @stability beta
//
// Typed profile management contract for deployment-manager. Dynamic settings,
// secret references, and swap metadata remain JsonObject values because their
// shapes are intentionally supplied by the selected deployment target.
//
// Consumers must use the generated Connect client. The legacy JSON routes are
// retained only during the staged transport migration and are not the source
// of truth for this contract.
// =============================================================================

message Profile {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string scenario = 3 [(buf.validate.field).string.min_len = 1];
  repeated int32 tiers = 4;
  common.v1.JsonObject swaps = 5;
  common.v1.JsonObject secrets = 6;
  common.v1.JsonObject settings = 7;
  int32 version = 8 [(buf.validate.field).int32.gte = 1];
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string created_by = 11;
  string updated_by = 12;
}

message ProfileVersion {
  string profile_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 version = 2 [(buf.validate.field).int32.gte = 1];
  string name = 3;
  string scenario = 4;
  repeated int32 tiers = 5;
  common.v1.JsonObject swaps = 6;
  common.v1.JsonObject secrets = 7;
  common.v1.JsonObject settings = 8;
  google.protobuf.Timestamp created_at = 9;
  string created_by = 10;
  string change_description = 11;
}

message ListProfilesRequest {
  int32 page_size = 1 [(buf.validate.field).int32.gte = 0];
  string page_token = 2;
}

message ListProfilesResponse {
  repeated Profile profiles = 1;
  string next_page_token = 2;
}

message GetProfileRequest {
  string profile_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetProfileResponse {
  Profile profile = 1;
}

message CreateProfileRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string scenario = 2 [(buf.validate.field).string.min_len = 1];
  repeated int32 tiers = 3;
  common.v1.JsonObject swaps = 4;
  common.v1.JsonObject secrets = 5;
  common.v1.JsonObject settings = 6;
}

message CreateProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string profile_id = 1 [(buf.validate.field).string.min_len = 1];
  optional string name = 2;
  optional string scenario = 3;
  repeated int32 tiers = 4;
  common.v1.JsonObject swaps = 5;
  common.v1.JsonObject secrets = 6;
  common.v1.JsonObject settings = 7;
}

message UpdateProfileResponse {
  Profile profile = 1;
}

message DeleteProfileRequest {
  string profile_id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteProfileResponse {
  string profile_id = 1;
}

message ListProfileVersionsRequest {
  string profile_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 page_size = 2 [(buf.validate.field).int32.gte = 0];
  string page_token = 3;
}

message ListProfileVersionsResponse {
  repeated ProfileVersion versions = 1;
  string next_page_token = 2;
}

service ProfilesService {
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);
  rpc ListProfileVersions(ListProfileVersionsRequest) returns (ListProfileVersionsResponse);
}
