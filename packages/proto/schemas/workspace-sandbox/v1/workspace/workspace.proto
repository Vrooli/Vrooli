syntax = "proto3";

package workspace_sandbox.v1.workspace;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/workspace-sandbox/v1/workspace;workspace";

// WorkspaceSandboxService is the typed, governed change-path contract for
// workspace-sandbox. It wraps the existing domain service; it does not create
// a second persistence or lifecycle implementation.
service WorkspaceSandboxService {
  // ResolveWorkspace returns the host workspace root for an active sandbox.
  rpc ResolveWorkspace(ResolveWorkspaceRequest) returns (ResolveWorkspaceResponse);

  // CreateSandbox creates an isolated copy-on-write workspace.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);

  // GetSandboxDiff returns a bounded, reviewable diff for a sandbox.
  rpc GetSandboxDiff(GetSandboxDiffRequest) returns (GetSandboxDiffResponse);


  // PromoteSandbox applies an explicitly confirmed approved change set.
  rpc PromoteSandbox(PromoteSandboxRequest) returns (PromoteSandboxResponse);

  // Replay seals keep a candidate/reference snapshot manifest behind the
  // Workspace Sandbox owner. Create never returns the filesystem path.
  rpc CreateReplaySeal(CreateReplaySealRequest) returns (CreateReplaySealResponse);
  rpc ResolveReplaySeal(ResolveReplaySealRequest) returns (ResolveReplaySealResponse);
  rpc VerifyReplaySeal(VerifyReplaySealRequest) returns (VerifyReplaySealResponse);

  // Start/Wait run a frozen evaluator against an owner-resolved source, candidate, or reference seal.
  // The request contains evaluator bytes but never a host filesystem path or
  // shell command; Workspace Sandbox owns containment and execution identity.
  rpc StartReplayTest(StartReplayTestRequest) returns (StartReplayTestResponse);
  rpc WaitReplayTest(WaitReplayTestRequest) returns (WaitReplayTestResponse);
}

enum ReplayTestOutcome {
  REPLAY_TEST_OUTCOME_UNSPECIFIED = 0;
  REPLAY_TEST_OUTCOME_RUNNING = 1;
  REPLAY_TEST_OUTCOME_PASSED = 2;
  REPLAY_TEST_OUTCOME_ASSERTION_FAILED = 3;
  REPLAY_TEST_OUTCOME_INFRASTRUCTURE_FAILED = 4;
  REPLAY_TEST_OUTCOME_INTERRUPTED = 5;
}

message ReplayTestFile {
  string relative_path = 1;
  bytes content = 2;
  string sha256 = 3;
}
message StartReplayTestRequest {
  string operation_idempotency_key = 1;
  string case_id = 2;
  ReplaySealRole role = 3;
  string seal_digest = 4;
  string evaluator_bundle_id = 5;
  string evaluator_bundle_digest = 6;
  repeated ReplayTestFile files = 7;
  string entry_point = 8;
  uint32 timeout_seconds = 9;
}
message StartReplayTestResponse {
  bool success = 1;
  string operation_id = 2;
  string case_id = 3;
  ReplaySealRole role = 4;
  string seal_digest = 5;
  string evaluator_bundle_id = 6;
  string evaluator_bundle_digest = 7;
  string entry_point = 8;
  ReplayTestOutcome outcome = 9;
  string result_digest = 10;
  bool seal_intact_before = 11;
  bool seal_intact_after = 12;
  string detail = 13;
}
message WaitReplayTestRequest {
  string operation_id = 1;
  string case_id = 2;
  string seal_digest = 3;
  uint32 wait_seconds = 4;
}
message WaitReplayTestResponse {
  bool success = 1;
  string operation_id = 2;
  string case_id = 3;
  ReplaySealRole role = 4;
  string seal_digest = 5;
  string evaluator_bundle_id = 6;
  string evaluator_bundle_digest = 7;
  string entry_point = 8;
  ReplayTestOutcome outcome = 9;
  string result_digest = 10;
  bool seal_intact_before = 11;
  bool seal_intact_after = 12;
  string detail = 13;
}

enum ReplaySealRole {
  REPLAY_SEAL_ROLE_UNSPECIFIED = 0;
  REPLAY_SEAL_ROLE_SOURCE = 1;
  REPLAY_SEAL_ROLE_CANDIDATE = 2;
  REPLAY_SEAL_ROLE_REFERENCE = 3;
}

message CreateReplaySealRequest {
  string sandbox_id = 1;
  string case_id = 2;
  ReplaySealRole role = 3;
}
message CreateReplaySealResponse {
  bool success = 1;
  string case_id = 2;
  ReplaySealRole role = 3;
  string seal_digest = 4;
  uint64 file_count = 5;
  uint64 total_bytes = 6;
}
message ResolveReplaySealRequest {
  string case_id = 1;
  ReplaySealRole role = 2;
  string seal_digest = 3;
}
message ResolveReplaySealResponse {
  bool success = 1;
  string case_id = 2;
  ReplaySealRole role = 3;
  string seal_digest = 4;
  string workspace_root = 5;
}
message VerifyReplaySealRequest {
  string case_id = 1;
  ReplaySealRole role = 2;
  string seal_digest = 3;
}
message VerifyReplaySealResponse {
  bool success = 1;
  bool intact = 2;
  bool tamper_detected = 3;
  string case_id = 4;
  ReplaySealRole role = 5;
  string seal_digest = 6;
}

message ResolveWorkspaceRequest {
  string sandbox_id = 1;
}

message ResolveWorkspaceResponse {
  bool success = 1;
  string sandbox_id = 2;
  string workspace_root = 3;
  string isolation_mode = 4;
}

message CreateSandboxRequest {
  string name = 1;
  string scope_path = 2;
  string project_root = 3;
  string owner = 4;
  repeated string reserved_paths = 5;
  string idempotency_key = 6;
}

message SandboxSummary {
  string sandbox_id = 1;
  string status = 2;
  string workspace_root = 3;
  string isolation_mode = 4;
  string scope_path = 5;
  string project_root = 6;
}

message CreateSandboxResponse {
  bool success = 1;
  SandboxSummary sandbox = 2;
}

message GetSandboxDiffRequest {
  string sandbox_id = 1;
}

message DiffFile {
  string path = 1;
  string change_type = 2;
  int64 size = 3;
  string approval_status = 4;
}

message DiffStats {
  int32 files_changed = 1;
  int32 files_added = 2;
  int32 files_modified = 3;
  int32 files_deleted = 4;
  int32 lines_added = 5;
  int32 lines_removed = 6;
  int64 total_bytes = 7;
}

message GetSandboxDiffResponse {
  bool success = 1;
  string sandbox_id = 2;
  repeated DiffFile files = 3;
  string unified_diff = 4;
  DiffStats stats = 5;
  string archive_state = 6;
  // SHA-256 of exact unified_diff bytes; not a frozen source-tree identity.
  string patch_sha256 = 7;
}

message PromoteSandboxRequest {
  string sandbox_id = 1;
  string mode = 2;
  string actor = 3;
  string commit_message = 4;
  bool create_commit = 5;
  bool force = 6;
  bool override_acceptance = 7;
  bool confirm = 8;
  // If set, approve only this complete reviewed patch; force cannot bypass it.
  string expected_patch_sha256 = 9;
  reserved 10, 11;
  reserved "review_request_id", "expected_review_sha256";
}

message PromoteSandboxResponse {
  bool success = 1;
  string sandbox_id = 2;
  int32 applied = 3;
  int32 failed = 4;
  int32 remaining = 5;
  bool is_partial = 6;
  string commit_hash = 7;
  string error = 8;
  string diff_path = 9;
  string applied_patch_sha256 = 10;
}

