syntax = "proto3";

package system_monitor.v1;

import "google/protobuf/struct.proto";
import "system-monitor/v1/domain/investigations.proto";
import "system-monitor/v1/domain/types.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/system-monitor/v1/api;api";

// =============================================================================
// INVESTIGATION API MESSAGES
// =============================================================================
//
// @layer 5
// @domain system-monitor
// @imports domain/investigations.proto, domain/types.proto
// @stability beta
//
// Request/response wrappers for investigation API endpoints.
//
// =============================================================================

// TriggerInvestigationRequest starts a new investigation.
message TriggerInvestigationRequest {
  // Whether to automatically apply fixes.
  bool auto_fix = 1;

  // Optional user note providing context.
  string note = 2;
}

// TriggerInvestigationResponse returns the queued investigation.
message TriggerInvestigationResponse {
  // Status of the request.
  string status = 1;

  // ID of the created investigation.
  string investigation_id = 2;

  // API base URL for polling.
  string api_base_url = 3;

  // Confirmation message.
  string message = 4;

  // Whether auto-fix was requested.
  bool auto_fix = 5;

  // User note that was provided.
  string note = 6;
}

// GetInvestigationRequest retrieves a specific investigation.
message GetInvestigationRequest {
  // Investigation ID.
  string id = 1;
}

// GetInvestigationResponse returns a single investigation.
message GetInvestigationResponse {
  // The investigation.
  Investigation investigation = 1;
}

// GetLatestInvestigationRequest is empty - no parameters needed.
message GetLatestInvestigationRequest {}

// GetLatestInvestigationResponse returns the most recent investigation.
message GetLatestInvestigationResponse {
  // The latest investigation.
  Investigation investigation = 1;
}

// ListInvestigationsRequest lists investigations with pagination.
message ListInvestigationsRequest {
  // Maximum number of results.
  optional int32 limit = 1;
}

// ListInvestigationsResponse returns a list of investigations.
message ListInvestigationsResponse {
  // List of investigations.
  repeated Investigation investigations = 1;
}

// UpdateInvestigationStatusRequest updates an investigation's status.
message UpdateInvestigationStatusRequest {
  // Investigation ID.
  string id = 1;

  // New status.
  InvestigationStatus status = 2;
}

// UpdateInvestigationStatusResponse confirms the status update.
message UpdateInvestigationStatusResponse {
  // Confirmation.
  string status = 1;
}

// UpdateInvestigationFindingsRequest updates an investigation's findings.
message UpdateInvestigationFindingsRequest {
  // Investigation ID.
  string id = 1;

  // Updated findings text.
  string findings = 2;

  // Additional details.
  google.protobuf.Struct details = 3;
}

// UpdateInvestigationFindingsResponse confirms the findings update.
message UpdateInvestigationFindingsResponse {
  // Confirmation.
  string status = 1;
}

// UpdateInvestigationProgressRequest updates investigation progress.
message UpdateInvestigationProgressRequest {
  // Investigation ID.
  string id = 1;

  // Progress percentage (0-100).
  int32 progress = 2;
}

// UpdateInvestigationProgressResponse confirms the progress update.
message UpdateInvestigationProgressResponse {
  // Confirmation.
  string status = 1;
}

// AddInvestigationStepRequest adds a step to an investigation.
message AddInvestigationStepRequest {
  // Investigation ID.
  string id = 1;

  // Step to add.
  InvestigationStep step = 2;
}

// AddInvestigationStepResponse confirms the step was added.
message AddInvestigationStepResponse {
  // Confirmation.
  string status = 1;
}

// GetCooldownStatusRequest is empty - no parameters needed.
message GetCooldownStatusRequest {}

// GetCooldownStatusResponse returns cooldown status.
message GetCooldownStatusResponse {
  // The cooldown status.
  CooldownStatus cooldown = 1;
}

// GetTriggersRequest is empty - no parameters needed.
message GetTriggersRequest {}

// GetTriggersResponse returns trigger configurations.
message GetTriggersResponse {
  // Map of trigger ID to configuration.
  map<string, TriggerConfig> triggers = 1;
}

// UpdateTriggerRequest updates a trigger configuration.
message UpdateTriggerRequest {
  // Trigger ID.
  string id = 1;

  // Whether the trigger is enabled.
  optional bool enabled = 2;

  // Whether auto-fix is enabled.
  optional bool auto_fix = 3;

  // Threshold value.
  optional double threshold = 4;
}

// UpdateTriggerResponse confirms the trigger update.
message UpdateTriggerResponse {
  // Confirmation.
  string status = 1;
}
