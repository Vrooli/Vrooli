syntax = "proto3";

package system_monitor.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "system-monitor/v1/domain/types.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/system-monitor/v1/domain;domain";

// =============================================================================
// INVESTIGATION DOMAIN
// =============================================================================
//
// @layer 1
// @domain system-monitor
// @imports types.proto, google.protobuf.Timestamp, google.protobuf.Struct
// @stability beta
//
// Investigation models for anomaly detection and resolution.
// These types represent the core investigation workflow.
//
// USAGE CONTEXTS:
//   - API responses for investigation CRUD endpoints
//   - UI data models (investigation list and details)
//   - Agent-manager integration payloads
//
// =============================================================================

// Investigation represents an anomaly investigation.
message Investigation {
  // Unique investigation identifier.
  string id = 1;

  // Current lifecycle status.
  InvestigationStatus status = 2;

  // ID of the anomaly that triggered this investigation.
  string anomaly_id = 3;

  // When the investigation started.
  google.protobuf.Timestamp start_time = 4;

  // When the investigation ended (set on completion/failure).
  optional google.protobuf.Timestamp end_time = 5;

  // Human-readable summary of findings.
  string findings = 6;

  // Progress percentage (0-100).
  int32 progress = 7;

  // Arbitrary investigation details and metadata.
  google.protobuf.Struct details = 8;

  // Ordered steps in this investigation.
  repeated InvestigationStep steps = 9;

  // Reason for triggering this investigation.
  optional string trigger_reason = 10;

  // Confidence score of findings (0.0 to 1.0).
  optional double confidence_score = 11;

  // ID of the agent performing this investigation.
  optional string agent_id = 12;
}

// InvestigationStep represents a step in an investigation.
message InvestigationStep {
  // Step name/label.
  string name = 1;

  // Current status of this step.
  InvestigationStepStatus status = 2;

  // When this step started.
  google.protobuf.Timestamp start_time = 3;

  // When this step ended.
  optional google.protobuf.Timestamp end_time = 4;

  // Findings from this step.
  string findings = 5;
}

// InvestigationFinding represents a finding during investigation.
message InvestigationFinding {
  // Type of data source for this finding.
  FindingType type = 1;

  // Human-readable description.
  string description = 2;

  // Confidence level (0.0 to 1.0).
  double confidence = 3;

  // Supporting evidence.
  repeated string evidence = 4;

  // When this finding was recorded.
  google.protobuf.Timestamp timestamp = 5;

  // Impact severity of this finding.
  Severity impact = 6;
}

// RootCause represents the identified root cause of an issue.
message RootCause {
  // Category of the root cause.
  string category = 1;

  // Human-readable description.
  string description = 2;

  // Confidence level (0.0 to 1.0).
  double confidence = 3;

  // Supporting evidence.
  repeated string evidence = 4;

  // Timeline of events leading to the root cause.
  repeated TimelineEvent timeline = 5;
}

// TimelineEvent represents an event in the investigation timeline.
message TimelineEvent {
  // When this event occurred.
  google.protobuf.Timestamp timestamp = 1;

  // Description of the event.
  string event = 2;

  // Source system/component.
  string source = 3;

  // How relevant this event is to the investigation.
  Relevance relevance = 4;
}

// ImpactAssessment assesses the impact of an anomaly.
message ImpactAssessment {
  // Overall severity.
  Severity severity = 1;

  // Estimated number of affected users.
  int32 affected_users = 2;

  // Performance degradation percentage.
  double performance_loss = 3;

  // Estimated financial cost.
  double estimated_cost = 4;

  // Business impact descriptions.
  repeated string business_impact = 5;
}

// ResolutionPlan provides steps to resolve an issue.
message ResolutionPlan {
  // Ordered resolution steps.
  repeated ResolutionStep steps = 1;

  // Estimated time to complete.
  string estimated_time = 2;

  // Skills needed for resolution.
  repeated string required_skills = 3;

  // Risk level of executing this plan.
  RiskLevel risk_level = 4;

  // Whether this plan can be automatically executed.
  bool auto_executable = 5;
}

// ResolutionStep represents a single step in resolution.
message ResolutionStep {
  // Execution order.
  int32 order = 1;

  // Human-readable description.
  string description = 2;

  // Command to execute (if applicable).
  string command = 3;

  // Expected outcome.
  string expected = 4;

  // Risk description for this step.
  string risk = 5;
}

// TriggerConfig represents configuration for automatic investigation triggers.
message TriggerConfig {
  // Unique trigger identifier.
  string id = 1;

  // Display name.
  string name = 2;

  // Human-readable description.
  string description = 3;

  // Icon identifier for UI display.
  string icon = 4;

  // Whether this trigger is active.
  bool enabled = 5;

  // Whether to automatically apply fixes.
  bool auto_fix = 6;

  // Threshold value for triggering.
  double threshold = 7;

  // Unit of measurement for the threshold.
  string unit = 8;

  // Condition for triggering relative to threshold.
  TriggerCondition condition = 9;
}

// CooldownStatus represents the current investigation cooldown status.
message CooldownStatus {
  // Total cooldown period in seconds.
  int32 cooldown_period_seconds = 1;

  // Remaining seconds until cooldown expires.
  int32 remaining_seconds = 2;

  // When the last investigation was triggered.
  google.protobuf.Timestamp last_trigger_time = 3;

  // Whether a new investigation can be triggered.
  bool is_ready = 4;
}

// Anomaly represents a detected system anomaly.
message Anomaly {
  // Unique anomaly identifier.
  string id = 1;

  // Type of anomaly.
  string type = 2;

  // Severity of the anomaly.
  Severity severity = 3;

  // Human-readable description.
  string description = 4;

  // Metric data associated with this anomaly.
  google.protobuf.Struct metric_data = 5;

  // When the anomaly was detected.
  google.protobuf.Timestamp detected_at = 6;

  // When the anomaly was resolved (if applicable).
  optional google.protobuf.Timestamp resolved_at = 7;

  // Current status.
  InvestigationStatus status = 8;
}
