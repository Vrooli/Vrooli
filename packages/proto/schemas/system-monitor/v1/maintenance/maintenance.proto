syntax = "proto3";

package vrooli.system_monitor.v1.maintenance;

import "google/api/annotations.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/system-monitor/v1/maintenance;maintenance";

// =============================================================================
// MAINTENANCE API MESSAGES
// =============================================================================
//
// @stability beta
//
// Request/response wrappers for metrics-lifecycle maintenance operations:
// retention (prune old metrics) and compaction (reclaim SQLite file space).
//
// USAGE CONTEXTS:
//   - API maintenance endpoints
//   - CLI `system-monitor maintenance` commands
//
// =============================================================================

// DatabaseStats describes the storage footprint of the metrics database.
message DatabaseStats {
  // SQLite page size in bytes.
  int64 page_size = 1;

  // Total number of database pages.
  int64 page_count = 2;

  // Number of pages on the freelist (reclaimable by compaction).
  int64 freelist_count = 3;

  // Logical database size in bytes (page_size * page_count).
  int64 size_bytes = 4;

  // Number of rows in the metrics table.
  int64 metric_rows = 5;
}

// RetentionEstimate describes the rows a retention prune would remove.
message RetentionEstimate {
  // Number of metric rows older than the cutoff.
  int64 row_count = 1;

  // Approximate JSON payload bytes for the affected rows.
  int64 payload_bytes = 2;

  // Oldest affected timestamp (RFC3339), empty when no rows match.
  string oldest_affected = 3;

  // Newest affected timestamp (RFC3339), empty when no rows match.
  string newest_affected = 4;

  // Cutoff timestamp (RFC3339); rows strictly older than this are pruned.
  string cutoff = 5;
}

// RetentionResult describes the outcome of a retention apply.
message RetentionResult {
  // Number of metric rows deleted.
  int64 deleted_rows = 1;

  // Cutoff timestamp (RFC3339) used for the prune.
  string cutoff = 2;
}

// MetricsRetentionPreviewRequest previews a retention prune (read-only).
message MetricsRetentionPreviewRequest {
  // Retention window in days; rows older than now-retention_days are counted.
  int32 retention_days = 1;
}

// MetricsRetentionPreviewResponse returns the prune estimate and DB stats.
message MetricsRetentionPreviewResponse {
  bool success = 1;
  RetentionEstimate estimate = 2;
  DatabaseStats database_stats = 3;
  string error = 4;
}

// MetricsRetentionApplyRequest applies a retention prune. Destructive.
message MetricsRetentionApplyRequest {
  // Retention window in days.
  int32 retention_days = 1;

  // Must be true to perform the destructive prune.
  bool confirm = 2;
}

// MetricsRetentionApplyResponse confirms the prune and reports DB stats.
message MetricsRetentionApplyResponse {
  bool success = 1;
  RetentionResult result = 2;
  DatabaseStats database_stats_before = 3;
  DatabaseStats database_stats_after = 4;
  string error = 5;
}

// MetricsCompactionPreviewRequest previews compaction (read-only).
message MetricsCompactionPreviewRequest {}

// MetricsCompactionPreviewResponse returns DB stats and reclaimable estimate.
message MetricsCompactionPreviewResponse {
  bool success = 1;
  DatabaseStats database_stats = 2;

  // Approximate bytes reclaimable by compaction (freelist_count * page_size).
  int64 estimated_reclaimable_bytes = 3;
  string error = 4;
}

// MetricsCompactionApplyRequest applies compaction. Serializes with writes.
message MetricsCompactionApplyRequest {
  // Must be true to perform compaction.
  bool confirm = 1;
}

// MetricsCompactionApplyResponse reports DB stats before and after.
message MetricsCompactionApplyResponse {
  bool success = 1;
  DatabaseStats database_stats_before = 2;
  DatabaseStats database_stats_after = 3;
  int64 reclaimed_bytes = 4;
  string error = 5;
}

// MaintenanceService provides the maintenance RPC surface.
service MaintenanceService {
  // MetricsRetentionPreview previews a metrics retention prune.
  rpc MetricsRetentionPreview(MetricsRetentionPreviewRequest) returns (MetricsRetentionPreviewResponse) {
    option (google.api.http) = {get: "/api/v1/maintenance/metrics/retention/preview"};
  }

  // MetricsRetentionApply applies a metrics retention prune.
  rpc MetricsRetentionApply(MetricsRetentionApplyRequest) returns (MetricsRetentionApplyResponse) {
    option (google.api.http) = {
      post: "/api/v1/maintenance/metrics/retention/apply"
      body: "*"
    };
  }

  // MetricsCompactionPreview previews a database compaction.
  rpc MetricsCompactionPreview(MetricsCompactionPreviewRequest) returns (MetricsCompactionPreviewResponse) {
    option (google.api.http) = {get: "/api/v1/maintenance/metrics/compaction/preview"};
  }

  // MetricsCompactionApply applies a database compaction.
  rpc MetricsCompactionApply(MetricsCompactionApplyRequest) returns (MetricsCompactionApplyResponse) {
    option (google.api.http) = {
      post: "/api/v1/maintenance/metrics/compaction/apply"
      body: "*"
    };
  }
}
