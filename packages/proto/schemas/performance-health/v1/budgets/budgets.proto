syntax = "proto3";

package vrooli.performance_health.v1.budgets;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/performance-health/v1/budgets;budgets_v1";

// =============================================================================
// PERFORMANCE BUDGET SERVICE
// =============================================================================
//
// @layer 0
// @domain performance-health
// @stability beta
//
// BudgetService owns per-scenario performance budgets (build time, bundle size,
// LCP, startup, component-commit budgets) plus a ratchet. Budgets are
// declarative under the `performance.budgets` block of the scenario's
// .vrooli/testing.json — the single source of truth for every perf threshold
// (milliseconds/bytes). A regression vs. budget fails via baseline-diff exactly
// like any other health regression.
// =============================================================================

service BudgetService {
  // GetBudget returns the declared performance budget for a scenario.
  rpc GetBudget(GetBudgetRequest) returns (GetBudgetResponse);
  // SetBudget writes/updates the declared budget for a scenario (dry-run via
  // the X-Dry-Run header honored by cli-core --dry-run).
  rpc SetBudget(SetBudgetRequest) returns (SetBudgetResponse);
  // CheckBudget evaluates a scenario's latest measurements against its budget
  // and reports violations; this is the baseline-diff gate.
  rpc CheckBudget(CheckBudgetRequest) returns (CheckBudgetResponse);
}

// Budget is one scenario's declared performance thresholds.
message Budget {
  string scenario = 1;
  int64 go_build_max_ms = 2;
  int64 ui_build_max_ms = 3;
  int64 bundle_max_bytes = 4;
  int64 lcp_max_ms = 5;
  int64 startup_max_ms = 6;
  // Per-component commit budget in milliseconds (max for the slowest component).
  double component_commit_max_ms = 7;
  // Per-component average-commit budget in milliseconds (0 = unset).
  double component_commit_avg_max_ms = 9;
  // Ratchet: when true SetBudget may only tighten an existing budget, never
  // loosen it (a relaxation is rejected). Tighten-only protects against
  // silently regressing the budget after a measured improvement.
  bool ratchet = 10;
  // Per-interaction-flow budgets keyed by flow slug. Each gates a specific
  // targeted journey (driven by `audit run --workflow <slug>`) on the
  // continuous cadence, independently of the scenario aggregate. build/bundle/
  // startup remain scenario-level (no per-flow build).
  map<string, FlowBudget> flows = 11;
  // Field 8 was p95_max_ms — removed: no honest p95 latency producer exists, so
  // the axis could never trip. Reserved to prevent accidental reuse.
  reserved 8;
  reserved "p95_max_ms";
}

// FlowBudget is one interaction flow's declared thresholds — only the axes a
// targeted capture can measure (LCP and the slowest component's avg/max commit).
message FlowBudget {
  int64 lcp_max_ms = 1;
  double component_commit_avg_max_ms = 2;
  double component_commit_max_ms = 3;
}

message GetBudgetRequest {
  string scenario = 1;
}

message GetBudgetResponse {
  Budget budget = 1;
  // True when a budget is declared (false => defaults returned).
  bool declared = 2;
}

message SetBudgetRequest {
  Budget budget = 1;
  // When set, the budget's per-flow axes (lcp_max_ms, component_commit_*) are
  // written to budget.flows[flow], preserving scenario-level axes and sibling
  // flows. Empty = a scenario-level write (preserving any existing flows).
  string flow = 2;
}

message SetBudgetResponse {
  Budget budget = 1;
  bool dry_run = 2;
}

message CheckBudgetRequest {
  string scenario = 1;
  // When set, evaluate only this interaction flow's per-flow budget against its
  // latest flow-tagged sample. Empty = the scenario-level check.
  string flow = 2;
}

message CheckBudgetResponse {
  string scenario = 1;
  // True when every measured axis is within budget.
  bool passed = 2;
  repeated BudgetViolation violations = 3;
}

// BudgetViolation is one axis exceeding its budget.
message BudgetViolation {
  // Axis id, e.g. "go_build", "bundle", "lcp", "startup".
  string axis = 1;
  int64 measured = 2;
  int64 budget = 3;
  string unit = 4;
  // Flow slug when the violation is a per-flow breach; empty for scenario-level.
  string flow = 5;
}
