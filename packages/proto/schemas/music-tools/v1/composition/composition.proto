syntax = "proto3";

import "google/protobuf/timestamp.proto";

package vrooli.music_tools.v1.composition;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/music-tools/v1/composition;composition_v1";

service CompositionService {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc ListTakes(ListTakesRequest) returns (ListTakesResponse);
}

message Provenance {
  string model_id = 1;
  string license_lane = 2;
  string applied_rung = 3;
  int64 seed = 4;
  string caption_as_authored = 5;
  string caption_as_sent = 6;
}

message Take {
  string id = 1;
  string job_id = 2;
  string style_id = 3;
  string pool_state = 4;
  string blob_ref = 5;
  Provenance provenance = 6;
  int32 times_offered = 7;
  string reserved_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp reserved_at = 10;
}

message SubmitRequest {
  string style_id = 1;
  int32 takes = 2;
  int32 duration = 3;
  int64 seed = 4;
}

message SubmitResponse { string job_id = 1; }
message ListTakesRequest { string style_id = 1; string job_id = 2; }
message ListTakesResponse { repeated Take takes = 1; }
