syntax = "proto3";

package vrooli.prompt_manager.v1.worldscale;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/prompt-manager/v1/worldscale;worldscale_v1";

service WorldScaleService { rpc GetWorldScale(GetWorldScaleRequest) returns (WorldScale); rpc SetWorldScale(SetWorldScaleRequest) returns (WorldScale); }
message WorldScale { double agent = 1; double furniture = 2; double decoration = 3; double overlay = 4; }
message GetWorldScaleRequest {}
message SetWorldScaleRequest { WorldScale scale = 1; }
