syntax = "proto3";

package vrooli.prompt_manager.v1.metadata;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/prompt-manager/v1/metadata;metadata_v1";

service MetadataService { rpc FetchOpenGraph(FetchOpenGraphRequest) returns (OpenGraphMetadata); }
message FetchOpenGraphRequest { string url = 1; }
message OpenGraphMetadata { string url = 1; string title = 2; string description = 3; string image = 4; string site_name = 5; string type = 6; string favicon = 7; }
