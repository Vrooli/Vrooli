syntax = "proto3";

package vrooli.token_economy.v1.grants;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/token-economy/v1/grants;grantsv1";

import "google/protobuf/timestamp.proto";

// =============================================================================
// GRANTS
// =============================================================================
//
// @stability stable
//
// Owns mandate-shaped token grants and their closed-vocabulary rules.
//
// =============================================================================

enum GrantStatus {
  GRANT_STATUS_UNSPECIFIED = 0;
  GRANT_STATUS_DRAFT = 1;
  GRANT_STATUS_LIVE = 2;
  GRANT_STATUS_EXHAUSTED = 3;
  GRANT_STATUS_EXPIRED = 4;
  GRANT_STATUS_REVOKED = 5;
}

enum RuleCondition {
  RULE_CONDITION_UNSPECIFIED = 0;
  RULE_CONDITION_CATALOG_SCOPE_ALLOWED = 1;
  RULE_CONDITION_CATALOG_SCOPE_DENIED = 2;
  RULE_CONDITION_BEFORE_EXPIRY = 3;
  RULE_CONDITION_REQUIRED_EVIDENCE = 4;
  RULE_CONDITION_SUFFICIENT_BALANCE = 5;
}

message GrantRule {
  string id = 1;
  RuleCondition condition = 2;
  repeated string operands = 3;
  int64 amount_limit = 4;
}

message Grant {
  string id = 1;
  string token_type_id = 2;
  string grant_source_id = 3;
  string authorizer = 4;
  int64 amount_minor = 5;
  repeated string allowed_catalog_scopes = 7;
  repeated string denied_catalog_scopes = 8;
  google.protobuf.Timestamp expires_at = 9;
  google.protobuf.Timestamp issued_at = 11;
  GrantStatus status = 12;
  string idempotency_key = 13;
  repeated string required_evidence = 14;
  int64 recurrence_seconds = 15;
  google.protobuf.Timestamp next_issue_at = 16;
  google.protobuf.Timestamp cancelled_at = 17;
  string holder_id = 18;
  repeated GrantRule rules = 19;
}

message CreateGrantRequest {
  string token_type_id = 1;
  string grant_source_id = 2;
  string authorizer = 3;
  string holder_id = 4;
  int64 amount_minor = 5;
  repeated string allowed_catalog_scopes = 6;
  repeated string denied_catalog_scopes = 7;
  google.protobuf.Timestamp expires_at = 8;
  string idempotency_key = 9;
  repeated string required_evidence = 10;
  repeated GrantRule rules = 11;
}

message CreateGrantResponse {
  Grant grant = 1;
}

message GetGrantRequest {
  string id = 1;
}

message GetGrantResponse {
  Grant grant = 1;
}
