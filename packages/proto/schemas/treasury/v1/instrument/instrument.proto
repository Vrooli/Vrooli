syntax = "proto3";

package vrooli.treasury.v1.instrument;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/treasury/v1/instrument;instrument_v1";

message Instrument {
  string id = 1;
  string book_id = 2;
  string mandate_id = 3;
  string rail = 4;
  string credential_reference = 5;
  int64 cap_minor = 6;
  string currency = 7;
  string counterparty = 8;
  google.protobuf.Timestamp expires_at = 9;
}
