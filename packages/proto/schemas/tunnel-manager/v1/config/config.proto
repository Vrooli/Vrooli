syntax = "proto3";

package vrooli.tunnel_manager.v1.config;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/tunnel-manager/v1/config;config_v1";

// =============================================================================
// CONFIG DOMAIN — Cloudflare ingress & mode management
// =============================================================================
//
// @stability stable
//
// Wire contract for ConfigService. The adapter that makes exposure
// programmatic: remote mode pushes ingress via the Cloudflare API v4
// (hot-reload, no operator dashboard step); local mode generates
// ~/.cloudflared/config.yml from the manifest. Sync reconciles live ingress
// with the routes manifest; SwitchMode migrates between modes.
//
// Consumed by:
//   - API: handlers/config/connect_handler.go implements ConfigServiceHandler.
//   - CLI: cli/domains/config/handlers.go (config get|sync|mode).
// =============================================================================

service ConfigService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // Sync reconciles ingress (remote API or local config.yml) with the routes
  // manifest. Idempotent: a no-drift sync applies nothing.
  rpc Sync(SyncRequest) returns (SyncResponse);
  // SwitchMode migrates between "remote" and "local" management modes.
  rpc SwitchMode(SwitchModeRequest) returns (SwitchModeResponse);
}

// Mode is the tunnel management mode.
enum Mode {
  MODE_UNSPECIFIED = 0;
  // Ingress managed through the Cloudflare API v4 (hot reload).
  MODE_REMOTE = 1;
  // Ingress managed through a local cloudflared config.yml file.
  MODE_LOCAL = 2;
}

// TunnelConfig is the persisted configuration for the tunnel.
message TunnelConfig {
  Mode mode = 1;
  string tunnel_id = 2;
  string account_id = 3;
  // Reference (not the secret itself) to the Cloudflare API credential.
  string cred_ref = 4;
  // Prometheus metrics endpoint exposed by cloudflared (e.g.
  // "127.0.0.1:20241").
  string prom_endpoint = 5;
}

// ConfigReadiness reports whether the current process has enough
// non-secret configuration to operate each mode. It is safe to return to UI
// clients: it reports presence/source only, never the API token value.
message ConfigReadiness {
  // Desired mode after applying first-run defaults.
  Mode desired_mode = 1;
  // True when Cloudflare account, tunnel, and token inputs are all present.
  bool remote_available = 2;
  // Canonical missing inputs, e.g. CLOUDFLARE_API_TOKEN.
  repeated string missing_fields = 3;
  // Human-readable source label such as "env:CLOUDFLARE_*",
  // "env:CF_*", "env:mixed", or "none".
  string credential_source = 4;
  // Non-secret token reference, e.g. "env:CLOUDFLARE_API_TOKEN".
  string credential_ref = 5;
  // Local cloudflared config path used in local mode.
  string local_config_path = 6;
  // True when config sync can execute in the desired/current mode.
  bool sync_ready = 7;
  // Short operator explanation for the current mode/readiness.
  string mode_reason = 8;
}

message GetConfigRequest {
}

message GetConfigResponse {
  TunnelConfig config = 1;
  ConfigReadiness readiness = 2;
}

message SyncRequest {
  // When true, compute the diff but do not apply it.
  bool dry_run = 1;
}

message SyncResponse {
  Mode mode = 1;
  // Hostnames added to ingress this sync.
  repeated string added = 2;
  // Hostnames removed from ingress this sync.
  repeated string removed = 3;
  // True when the manifest and live ingress already matched.
  bool no_changes = 4;
  // True when dry-run detected missing setup and did not attempt live diff.
  bool setup_required = 5;
  // Canonical missing inputs when setup_required is true.
  repeated string missing_fields = 6;
  // Operator-facing explanation of the sync result.
  string message = 7;
}

message SwitchModeRequest {
  Mode target_mode = 1;
}

message SwitchModeResponse {
  Mode previous_mode = 1;
  Mode current_mode = 2;
}
