syntax = "proto3";

package vrooli.tunnel_manager.v1.config;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/tunnel-manager/v1/config;config_v1";

// =============================================================================
// CONFIG DOMAIN — Cloudflare ingress & mode management
// =============================================================================
//
// @stability stable
//
// Wire contract for ConfigService. The adapter that makes exposure
// programmatic: remote mode pushes ingress via the Cloudflare API v4
// (hot-reload, no operator dashboard step); local mode generates
// ~/.cloudflared/config.yml from the manifest. Sync reconciles live ingress
// with the routes manifest; SwitchMode migrates between modes.
//
// Consumed by:
//   - API: handlers/config/connect_handler.go implements ConfigServiceHandler.
//   - CLI: cli/domains/config/handlers.go (config get|sync|mode).
// =============================================================================

service ConfigService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  // GetCredentialStatus returns Cloudflare credential presence/source metadata.
  // It never returns credential values.
  rpc GetCredentialStatus(GetCredentialStatusRequest) returns (GetCredentialStatusResponse);
  // VerifyCredentials performs LIVE read-only Cloudflare probes (token verify,
  // account/tunnel read, apex zone lookup + DNS-records read) and returns a
  // per-check verdict with remediation. It is the opt-in counterpart to the
  // presence-only GetCredentialStatus and never returns credential values.
  rpc VerifyCredentials(VerifyCredentialsRequest) returns (VerifyCredentialsResponse);
  // SetCloudflareCredentials stores write-only Cloudflare credential values in
  // the configured operator secret store. Secret values are never echoed back.
  rpc SetCloudflareCredentials(SetCloudflareCredentialsRequest) returns (SetCloudflareCredentialsResponse);
  // ClearCloudflareCredentials removes one or more file-backed Cloudflare
  // credential values from the configured operator secret store.
  rpc ClearCloudflareCredentials(ClearCloudflareCredentialsRequest) returns (ClearCloudflareCredentialsResponse);
  // Sync reconciles ingress ADDITIVELY: it publishes desired hostnames merged
  // onto current live, never dropping unmanaged/ignored entries. Removal
  // happens only when prune is set (a batch prune removes orphaned entries).
  rpc Sync(SyncRequest) returns (SyncResponse);
  // SwitchMode migrates between "remote" and "local" management modes. It is
  // PURE: it persists the mode and performs zero ingress writes.
  rpc SwitchMode(SwitchModeRequest) returns (SwitchModeResponse);
  // GetDrift reconciles the desired manifest, the live tunnel, and the
  // ownership ledger into a classified read model (no writes). It answers
  // "what is live vs. what TM wants vs. what is unmanaged" in either mode.
  rpc GetDrift(GetDriftRequest) returns (GetDriftResponse);
  // AdoptIngress brings an unmanaged live hostname under management: as a
  // scenario route when it resolves to a known scenario, otherwise as an
  // external route. Records MANAGED/EXTERNAL ownership in the ledger.
  rpc AdoptIngress(AdoptIngressRequest) returns (AdoptIngressResponse);
  // IgnoreIngress acknowledges a live hostname as external and records it
  // IGNORED so reconcile never pushes or prunes it.
  rpc IgnoreIngress(IgnoreIngressRequest) returns (IgnoreIngressResponse);
  // PruneIngress removes a single named hostname from live ingress and the
  // ledger. This is the only path that removes a specific entry.
  rpc PruneIngress(PruneIngressRequest) returns (PruneIngressResponse);
}

// OwnershipState classifies one ingress hostname after reconciling the desired
// manifest, the live tunnel, and the ownership ledger (see drift.go).
enum OwnershipState {
  OWNERSHIP_STATE_UNSPECIFIED = 0;
  // Scenario-backed desired route that is live (healthy).
  OWNERSHIP_STATE_MANAGED = 1;
  // Desired route (scenario or external) not yet live — an add candidate.
  OWNERSHIP_STATE_MISSING = 2;
  // External desired/ledger route that is live — tracked, TM owns its ingress.
  OWNERSHIP_STATE_EXTERNAL_OK = 3;
  // Ledger-managed hostname whose route is gone — a prune candidate.
  OWNERSHIP_STATE_ORPHANED = 4;
  // Ledger-ignored hostname that is live — acknowledged, never touched.
  OWNERSHIP_STATE_IGNORED = 5;
  // Live hostname with no desired route and no ledger record — genuine drift.
  OWNERSHIP_STATE_UNMANAGED = 6;
}

// IngressSource is the provenance of a classified ingress entry.
enum IngressSource {
  INGRESS_SOURCE_UNSPECIFIED = 0;
  INGRESS_SOURCE_SCENARIO = 1;
  INGRESS_SOURCE_EXTERNAL = 2;
}

// IngressEntry is one fully-classified ingress hostname for the drift view.
message IngressEntry {
  string hostname = 1;
  // Local service the tunnel forwards to (e.g. http://localhost:21100).
  string service_target = 2;
  OwnershipState state = 3;
  IngressSource source = 4;
  // Scenario name when source == SCENARIO.
  string scenario = 5;
  // Lease identifier when the backing route is a lease.
  string lease_id = 6;
  // Operator note recorded with an ignore/adopt decision.
  string note = 7;
}

// DriftCounts is the per-state tally for the drift report.
message DriftCounts {
  int32 managed = 1;
  int32 missing = 2;
  int32 external_ok = 3;
  int32 orphaned = 4;
  int32 ignored = 5;
  int32 unmanaged = 6;
}

// Mode is the tunnel management mode.
enum Mode {
  MODE_UNSPECIFIED = 0;
  // Ingress managed through the Cloudflare API v4 (hot reload).
  MODE_REMOTE = 1;
  // Ingress managed through a local cloudflared config.yml file.
  MODE_LOCAL = 2;
}

// TunnelConfig is the persisted configuration for the tunnel.
message TunnelConfig {
  Mode mode = 1;
  string tunnel_id = 2;
  string account_id = 3;
  // Reference (not the secret itself) to the Cloudflare API credential.
  string cred_ref = 4;
  // Prometheus metrics endpoint exposed by cloudflared (e.g.
  // "127.0.0.1:20241").
  string prom_endpoint = 5;
}

// ConfigReadiness reports whether the current process has enough
// non-secret configuration to operate each mode. It is safe to return to UI
// clients: it reports presence/source only, never the API token value.
message ConfigReadiness {
  // Desired mode after applying first-run defaults.
  Mode desired_mode = 1;
  // True when Cloudflare account, tunnel, and token inputs are all present.
  bool remote_available = 2;
  // Canonical missing inputs, e.g. CLOUDFLARE_API_TOKEN.
  repeated string missing_fields = 3;
  // Human-readable source label such as "env:CLOUDFLARE_*",
  // "file:scenario", "file:user", "mixed", or "missing".
  string credential_source = 4;
  // Non-secret token reference, e.g. "env:CLOUDFLARE_API_TOKEN".
  string credential_ref = 5;
  // Local cloudflared config path used in local mode.
  string local_config_path = 6;
  // True when config sync can execute in the desired/current mode.
  bool sync_ready = 7;
  // Short operator explanation for the current mode/readiness.
  string mode_reason = 8;
  // Field-level status for the Cloudflare credential inputs.
  repeated CredentialFieldStatus credential_fields = 9;
}

message CredentialFieldStatus {
  // Canonical credential field name, e.g. CLOUDFLARE_API_TOKEN.
  string name = 1;
  // True when a non-empty value is available to the API process.
  bool present = 2;
  // Source label: env:CLOUDFLARE_*, file:scenario, file:user, or missing.
  string source = 3;
  // Non-secret reference to the value source. Never the secret value.
  string ref = 4;
  // True when Tunnel Manager can write this field's effective source.
  bool writable = 5;
}

message CredentialStatus {
  repeated CredentialFieldStatus fields = 1;
  repeated string missing_fields = 2;
  string source = 3;
  // Non-secret token reference. Never the token value.
  string ref = 4;
  bool ready = 5;
}

message GetConfigRequest {}

message GetConfigResponse {
  TunnelConfig config = 1;
  ConfigReadiness readiness = 2;
}

message GetCredentialStatusRequest {}

message GetCredentialStatusResponse {
  CredentialStatus status = 1;
}

// CheckState is the verdict of one live credential check. It never carries a
// secret value — only a coarse machine-readable outcome.
enum CheckState {
  CHECK_STATE_UNSPECIFIED = 0;
  // The check passed against the live Cloudflare account.
  CHECK_STATE_OK = 1;
  // The required input is absent (e.g. no token).
  CHECK_STATE_MISSING = 2;
  // The input is present but rejected (bad/expired token, unknown
  // account/tunnel, zone not found).
  CHECK_STATE_INVALID = 3;
  // The token authenticates but lacks the permission this check needs
  // (e.g. no Zone:DNS:Edit).
  CHECK_STATE_INSUFFICIENT_SCOPE = 4;
}

// CredentialCheck is one live verification result. Browser/CLI safe: a verdict
// plus a one-line remediation, never a secret value.
message CredentialCheck {
  // Stable check identifier, e.g. cloudflare.zone_dns_edit.
  string name = 1;
  CheckState state = 2;
  // Short non-secret explanation (e.g. the apex it resolved).
  string detail = 3;
  // One-line operator next-step when state != OK.
  string remediation = 4;
}

message VerifyCredentialsRequest {}

message VerifyCredentialsResponse {
  // Per-check live verification results, in a stable order.
  repeated CredentialCheck checks = 1;
  // True only when every check is OK.
  bool ready = 2;
}

message SetCloudflareCredentialsRequest {
  string account_id = 1;
  string tunnel_id = 2;
  // Write-only Cloudflare API token. The value is persisted in the operator
  // secret store and is never returned by any ConfigService response.
  string api_token = 3;
}

message SetCloudflareCredentialsResponse {
  CredentialStatus status = 1;
}

message ClearCloudflareCredentialsRequest {
  // Field names to clear. Empty or "all" clears every file-backed Cloudflare
  // credential field. Env-sourced fields are read-only and remain effective
  // until the process environment changes.
  repeated string fields = 1;
}

message ClearCloudflareCredentialsResponse {
  CredentialStatus status = 1;
}

message SyncRequest {
  // When true, compute the report but do not apply it.
  bool dry_run = 1;
  // When true, also remove orphaned entries (ledger-managed hostnames whose
  // routes are gone). Unmanaged drift is NEVER removed by a batch prune.
  bool prune = 2;
}

message SyncResponse {
  Mode mode = 1;
  // Hostnames added to ingress this sync (or that would be on a dry-run).
  repeated string added = 2;
  // Hostnames removed this sync (mirrors pruned; empty unless prune was set).
  repeated string removed = 3;
  // True when nothing would change.
  bool no_changes = 4;
  // True when dry-run detected missing setup and did not attempt a live read.
  bool setup_required = 5;
  // Canonical missing inputs when setup_required is true.
  repeated string missing_fields = 6;
  // Operator-facing explanation of the sync result.
  string message = 7;
  // Live hostnames TM does not manage and did not touch.
  repeated string drift_unmanaged = 8;
  // Ledger-managed hostnames whose routes are gone (prune candidates).
  repeated string orphaned = 9;
  // Hostnames actually removed this sync (empty unless prune was set).
  repeated string pruned = 10;
}

message SwitchModeRequest {
  Mode target_mode = 1;
}

message SwitchModeResponse {
  Mode previous_mode = 1;
  Mode current_mode = 2;
}

message GetDriftRequest {}

message GetDriftResponse {
  Mode mode = 1;
  // Every distinct live/desired/tracked hostname, classified, ordered by
  // hostname.
  repeated IngressEntry entries = 2;
  DriftCounts counts = 3;
}

message AdoptIngressRequest {
  // Full hostname to adopt (e.g. api.itsagitime.com).
  string hostname = 1;
  // Adopt as this scenario route. When empty and target is empty, the service
  // resolves scenario vs external automatically.
  string scenario = 2;
  // Adopt as an external route pointing at this service target (e.g.
  // http://127.0.0.1:9000). Takes precedence over scenario resolution.
  string target = 3;
}

message AdoptIngressResponse {
  IngressEntry entry = 1;
}

message IgnoreIngressRequest {
  string hostname = 1;
  // Optional operator note for why this external ingress is acknowledged.
  string note = 2;
}

message IgnoreIngressResponse {
  IngressEntry entry = 1;
}

message PruneIngressRequest {
  string hostname = 1;
}

message PruneIngressResponse {
  // True when the hostname was removed from live ingress and/or the ledger.
  bool pruned = 1;
}
