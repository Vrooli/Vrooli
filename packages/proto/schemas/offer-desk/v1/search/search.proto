syntax = "proto3";

package vrooli.offer_desk.v1.search;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/offer-desk/v1/search;search_v1";

// SearchService is Offer Desk's read-only federated retrieval leaf over its
// authoritative catalog. Search Hub routes to it but never stores offer,
// audience, or decision content.
service SearchService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchResult {
  string id = 1;
  string title = 2;
  string snippet = 3;
  double score = 4;
  // Record class: a node kind, edge, trigger, fact, evaluation, proposal, or
  // audit row.
  string kind = 5;
  // Canonical owner reference an agent follows to read the authoritative
  // record. Empty only for records with no owner read.
  string follow_up = 6;
  // fresh/stale/unknown for time-bounded facts; empty otherwise.
  string freshness = 7;
  // A superseded evaluation, an audit row, or any record that states what
  // happened rather than what is currently true.
  bool historical = 8;
}

message SearchResponse {
  repeated SearchResult results = 1;
  // Corpus generation the ranking read; changes only when record content
  // changes.
  string generation = 2;
  // RFC3339 timestamp of the newest observed catalog mutation, never the read
  // time.
  string materialized_at = 3;
}

message StatusRequest {}

message StatusResponse {
  bool available = 1;
  int32 indexed_count = 2;
  // RFC3339 timestamp of the live corpus materialization observed by Status.
  string last_indexed_at = 3;
  // Corpus generation; rereading status without a source change returns the
  // same value.
  string generation = 4;
}
