syntax = "proto3";

package vrooli.vrooli_bridge.v1.channel;

import "google/protobuf/timestamp.proto";
import "vrooli-bridge/v1/shared/shared.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/vrooli-bridge/v1/channel;channel_v1";

// =============================================================================
// CHANNEL — node-agent ↔ control-plane dial-out wire protocol
// =============================================================================
//
// @stability beta
//
// This file is the versioned wire contract for the persistent **dial-out**
// channel a node-agent holds back to the control plane (ARCHITECTURE.md "the
// fleet"). It is a message-only contract — it declares no service. The
// transport is split per DECISIONS.md / Contract Decisions §8:
//
//   - Control plane → node push (HandshakeAck, JobPush, ProvisionCommand,
//     ControlPing) rides the SSE stream the node opens; frames are wrapped in
//     a `ServerFrame` envelope so one stream multiplexes every push kind.
//   - Node → control plane actions (Handshake, Heartbeat, RunEvent) are
//     Connect-RPC calls on the presence/runs domain services; the `NodeFrame`
//     envelope documents the union those calls carry.
//
// Versioning / back-compat policy
// -------------------------------
// `protocol_version` is the single integer the handshake negotiates. The
// current version is CHANNEL_PROTOCOL_VERSION = 2 (mirrored as a Go const in
// the agent and api). Both sides parse with DiscardUnknown so a newer peer
// adding fields never breaks an older peer. A node whose protocol_version the
// control plane cannot drive is flagged NEEDS_UPDATE (or INCOMPATIBLE) in the
// HandshakeAck and is never silently mis-driven — it holds presence but
// receives no jobs until updated. Field numbers are never reused; removed
// fields are `reserved`. Add new push kinds to the `ServerFrame` oneof and new
// node actions to the `NodeFrame` oneof rather than overloading existing ones.
//
// Mutual auth (SECURITY.md boundary 2, DECISIONS.md 2026-06-18) is carried
// alongside these frames, not inside them: the node signs its Connect-RPC
// calls with its per-node Ed25519 key and the SSE token is bound to that key;
// the control plane's pushes are verifiable against the key the node pinned at
// bootstrap. The auth material therefore lives on the credential/transport
// edge, keeping these payloads transport-agnostic.
// =============================================================================

// Handshake is the first frame a node sends when it opens the channel. It
// establishes durable identity and negotiates the protocol version.
message Handshake {
  // Negotiated wire protocol version. Current peers send
  // CHANNEL_PROTOCOL_VERSION = 2.
  uint32 protocol_version = 1;

  // Durable node identity assigned at registration (registry domain).
  string node_id = 2;

  // The agent binary's build fingerprint, so the control plane can correlate
  // behaviour with a specific build.
  string agent_version = 3;

  // GOOS / GOARCH the agent was built for (e.g. "linux"/"amd64"). Drives the
  // cross-OS gate's per-OS fan-out (gate domain).
  string os = 4;
  string arch = 5;

  // Self-reported verb-namespace capabilities the node is willing to run
  // (e.g. "scenario test*"). Authoritative scopes live on the node record;
  // this is the node's advertisement, reconciled at dispatch.
  repeated string capabilities = 6;

  // True when the agent can participate in the bidirectional session wire.
  // False is valid: SSE job delivery remains the compatibility fallback.
  bool supports_websocket = 7;

  reserved 8 to 15; // forward growth (hardware facts, agent flags)
}

// HandshakeAck is the control plane's first push after a Handshake. It accepts
// or refuses the channel and reports the compatibility verdict.
message HandshakeAck {
  // True when the channel is accepted (compatibility OK or NEEDS_UPDATE with
  // presence-only). False with COMPATIBILITY_STATUS_INCOMPATIBLE refuses it.
  bool accepted = 1;

  // The control plane's verdict on the node's protocol_version.
  shared.CompatibilityStatus compatibility = 2;

  // The control plane's own protocol version, so the node can detect a
  // control plane it is itself too old to drive.
  uint32 control_plane_protocol_version = 3;

  // Opaque per-connection session id correlating subsequent frames in logs and
  // audit.
  string session_id = 4;

  // Human-readable reason, set when accepted=false or compatibility !=
  // OK (e.g. "agent protocol 0 < minimum 1; run the bootstrap installer").
  string reason = 5;
}

// HealthSnapshot is the node's self-reported readiness, sent on connect and on
// every Heartbeat. Dispatch only targets nodes whose snapshot shows they can
// do the work (OT-P0-003).
// Heartbeat is the node's periodic liveness + readiness ping (node → control
// plane). Absence of heartbeats past the liveness window flips the node
// offline (presence domain).
// JobPush is the typed job the control plane pushes for the node to run
// (OT-P0-004). It is NEVER a shell string: {scenario, verb, args} is validated
// against the scenario-CLI manifest + per-node scopes before it is pushed. The
// dispatch domain (Phase 3) owns that validation; this is only the wire shape.
message JobPush {
  // Server-owned durable run id; the node re-attaches and reports against it.
  string run_id = 1;

  // The target scenario, the manifest-declared verb, and its typed args.
  string scenario = 2;
  string verb = 3;
  repeated string args = 4;

  // Wall-clock budget after which the node aborts the run.
  int64 timeout_seconds = 5;

  // Typed output produced by the job. The node resolves the output path under
  // its private artifact directory, appends the declared output flag to argv,
  // and uploads the bounded bytes through ArtifactsService after the command
  // exits. This is output metadata, never an arbitrary command fragment.
  repeated ArtifactOutput outputs = 6;

  // Ephemeral credential mappings for exactly this job. The node resolves the
  // already-consented in-memory value and injects it into the child process
  // environment; values are never appended to argv or written to job state.
  repeated CredentialInjection credential_injections = 7;

  reserved 8 to 15; // future env scoping, artifact inputs, queue metadata
}

message CredentialInjection {
  string logical_id = 1;
  string field = 2;
  string env_name = 3;
}

// PrivilegedOperation is the closed vocabulary accepted by the separate
// privileged helper.  The enum is deliberately owned by the channel contract:
// the control plane cannot invent an operation that the helper has not been
// taught, and the helper never accepts a caller-provided argv or shell string.
enum PrivilegedOperation {
  PRIVILEGED_OPERATION_UNSPECIFIED = 0;
  PRIVILEGED_OPERATION_PROVISION = 1;
  PRIVILEGED_OPERATION_INVENTORY_INSTALLATION = 2;
  PRIVILEGED_OPERATION_PLAN_UNINSTALL = 3;
  PRIVILEGED_OPERATION_PROVISION_BREAK_GLASS = 4;
  PRIVILEGED_OPERATION_ISSUE_CLEANUP_CAPABILITY = 5;
  PRIVILEGED_OPERATION_APPLY_FROZEN_PLAN = 6;
  PRIVILEGED_OPERATION_VERIFY_RESULT = 7;
  PRIVILEGED_OPERATION_ROTATE_BREAK_GLASS = 8;
  PRIVILEGED_OPERATION_RESET_BREAK_GLASS = 9;
}

// CleanupCommand carries one typed request to the privileged helper.  The
// control plane may relay an opaque sealed envelope, but it cannot open or
// transform it.  Plan and apply are separate operations so the node can freeze
// its own installation ledger and later apply exactly that frozen plan.
message CleanupCommand {
  PrivilegedOperation operation = 1;
  string op_id = 2;
  string machine_id = 3;
  string node_id = 4;
  string target = 5;
  string scope = 6;
  string plan_id = 7;
  string plan_hash = 8;
  bytes sealed_passphrase = 9;
  bytes capability = 10;
  bool operator_confirmed = 11;
  string operator_id = 12;

  reserved 13 to 31;
}

message CredentialPush {
  string grant_id = 1;
  string node_id = 2;
  string logical_id = 3;
  string field = 4;
  int64 generation = 5;
  string retention = 6;
  bytes sealed_value = 7;
  bytes aad = 8;
}

message CredentialPurge {
  string node_id = 1;
  repeated string addresses = 2;
}

// CredentialGrant carries metadata-only local consent to a node. It never
// carries a credential value; the node stores this record before accepting a
// later CredentialPush for the same address.
message CredentialGrant {
  string grant_id = 1;
  string node_id = 2;
  string logical_id = 3;
  string field = 4;
  string class = 5;
  string retention = 6;
  int64 generation = 7;
  bool revoked = 8;
}

message CredentialReceipt {
  string grant_id = 1;
  string node_id = 2;
  string logical_id = 3;
  string field = 4;
  int64 generation = 5;
  bool accepted = 6;
  string reason = 7;
}

// ArtifactOutput describes one bounded file a typed job is allowed to produce.
// The output_flag is a fixed flag name selected by the control-plane manifest;
// it is not caller-supplied shell text.
message ArtifactOutput {
  string name = 1;
  string media_type = 2;
  string output_flag = 3;
  int64 max_bytes = 4;
}

// ProvisionCommand is the privileged-tier push that brings a node to a target
// revision (OT-P0-006). It is executed by the separate privileged provisioning
// helper, never the runner (DECISIONS.md two-trust-tiers). Phase 4 fills the
// helper; this is the wire shape.
message ProvisionCommand {
  // Server-owned provisioning op id, audited end to end.
  string op_id = 1;

  // The git revision to bring the node to (fetch@R + idempotent `vrooli
  // setup`).
  string target_revision = 2;

  // The prior revision to roll back to if setup fails; empty on first
  // provision.
  string rollback_revision = 3;

  reserved 4 to 15;
}

// ControlPing is a control-plane → node keepalive so the SSE stream stays warm
// through intermediaries and the node can detect a stalled control plane.
message ControlPing {
  google.protobuf.Timestamp sent_at = 1;
}

// AbortJob is the control-plane → node push that cancels an in-flight run
// (OT-P1-004 / the queue's node-side cancel). The operator's AbortRun marks the
// durable run terminal-ABORTED server-side AND pushes this frame so the node's
// runner stops the underlying process instead of running to completion as an
// ignored stale completion. The node best-effort kills the run's process group
// and stops reporting against run_id.
message AbortJob {
  // The server-owned run id to cancel; matches a prior JobPush.run_id.
  string run_id = 1;

  // Human-readable reason (operator abort, timeout, node-loss) surfaced in the
  // node's logs.
  string reason = 2;

  reserved 3 to 15;
}

// RelayRequest is a short-lived, typed request carried over the node's already
// authenticated outbound channel. The node executes the command through its
// local Vrooli transport and reports bounded response chunks over the signed
// node-to-control-plane channel; it never accepts a shell string or a direct
// inbound connection.
message RelayRequest {
  // Caller-owned correlation id. It is not a durable run id and is scoped to
  // this relay call only.
  string correlation_id = 1;

  // The local scenario and governed command to invoke, plus typed arguments.
  string scenario = 2;
  string command = 3;
  repeated string args = 4;

  // Finite execution budget. Zero uses the node's relay default.
  int64 timeout_seconds = 5;

  // Maximum aggregate response bytes. The node terminates the call with a
  // named limit reason rather than truncating silently.
  uint64 max_response_bytes = 6;

  reserved 7 to 15;
}

// RelayCancel terminates an in-flight relay request. It is separate from
// AbortJob because a relay correlation id is not a durable run id.
message RelayCancel {
  string correlation_id = 1;
  string reason = 2;

  reserved 3 to 15;
}

// RunEvent streams a durable run's progress back to the control plane (node →
// control plane, OT-P0-005). The runs domain proxies these to the block-once
// wait verb so a re-attaching client sees the same stream.
// ServerFrame is the multiplexed envelope every control-plane → node push is
// wrapped in over the SSE stream. New push kinds extend this oneof; the node
// parses with DiscardUnknown and ignores kinds it does not understand.
message ServerFrame {
  // Unique control-plane delivery identity. It is acknowledged by the node
  // before any work represented by the payload begins.
  string frame_id = 6;

  oneof payload {
    HandshakeAck ack = 1;
    JobPush job = 2;
    ProvisionCommand provision = 3;
    ControlPing ping = 4;
    AbortJob abort = 5;
    shared.SessionFrame session = 7;
    RelayRequest relay = 8;
    RelayCancel relay_cancel = 9;
    CleanupCommand cleanup = 10;
    CredentialPush credential_push = 11;
    CredentialPurge credential_purge = 12;
    CredentialGrant credential_grant = 13;
  }
}

// SignedServerFrame is the mutual-auth envelope EVERY control-plane → node push
// is wrapped in (SECURITY.md boundary 2, DECISIONS.md 2026-06-18). The control
// plane signs the serialized ServerFrame with its long-lived Ed25519 identity
// key (api internal/cpkeys); the node verifies the signature against the
// control-plane public key it pinned at pairing BEFORE it acts on the frame, and
// rejects anything unsigned or signed by the wrong key. This closes the CP→node
// direction of mutual auth (the node→CP direction is the per-node key on the
// heartbeat/token): a node never executes a job or provisioning command pushed
// by an impostor control plane.
//
// The signature covers the EXACT `frame` bytes carried on the wire (a
// proto-serialized ServerFrame); the node verifies over those bytes and only
// then parses them, so verification never depends on a re-serialization matching
// byte-for-byte. New push kinds need no change here — they extend the
// ServerFrame oneof, which rides opaquely inside `frame`.
message SignedServerFrame {
  // The proto-serialized ServerFrame the signature covers.
  bytes frame = 1;

  // Ed25519 signature over `frame` by the control plane's identity key.
  bytes signature = 2;
}

// NodeFrame documents the union of node → control-plane actions. In production
// each variant is a discrete Connect-RPC call on the presence/runs services
// (the node signs each with its Ed25519 key); this envelope keeps the contract
// discoverable in one place and is used by in-process channel tests.
message NodeFrame {
  oneof payload {
    Handshake handshake = 1;
    shared.Heartbeat heartbeat = 2;
    shared.RunEvent run_event = 3;
    shared.DeliveryAck delivery_ack = 4;
    shared.SessionFrame session = 5;
    shared.RelayResponse relay_response = 6;
    CredentialReceipt credential_receipt = 7;
  }
}
