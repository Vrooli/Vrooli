syntax = "proto3";

package vrooli.vrooli_bridge.v1.presence;

import "vrooli-bridge/v1/shared/shared.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/vrooli-bridge/v1/presence;presence_v1";

// =============================================================================
// PRESENCE DOMAIN — dial-out heartbeat intake (OT-P0-003)
// =============================================================================
//
// @stability beta
//
// PresenceService is the node → control-plane half of the dial-out channel: a
// node reports its liveness + self-reported readiness here as a Connect-RPC
// call (the control-plane → node push half rides the SSE stream the node opens;
// see handlers/channel/ and channel.proto). The wire types (Heartbeat,
// HealthSnapshot, CompatibilityStatus) are reused from the channel contract so
// the agent speaks one vocabulary.
//
// This RPC is node-facing, not operator-facing: it is omitted from the CLI
// manifest (no `nodes heartbeat` command — the agent calls it). Authentication
// in Phase 1 is the stub node credential; Phase 2 swaps in per-node Ed25519
// mutual auth (SECURITY.md boundary 2).
service PresenceService {
  // ReportHeartbeat records a node's liveness + health. The response carries the
  // control plane's compatibility verdict so an out-of-date agent learns it is
  // flagged NEEDS_UPDATE without a separate call.
  rpc ReportHeartbeat(ReportHeartbeatRequest) returns (ReportHeartbeatResponse);

  // ReportDeliveryAck confirms that a signed server frame reached the node and
  // was verified before the represented operation began.
  rpc ReportDeliveryAck(ReportDeliveryAckRequest) returns (ReportDeliveryAckResponse);

  // ReportSessionFrame carries node PTY output and terminal lifecycle events
  // back over the node's mutually-authenticated Connect channel.
  rpc ReportSessionFrame(ReportSessionFrameRequest) returns (ReportSessionFrameResponse);
}

message ReportHeartbeatRequest {
  // The node's heartbeat (node_id + sequence + health + sent_at).
  vrooli.vrooli_bridge.v1.shared.Heartbeat heartbeat = 1;
}

message ReportHeartbeatResponse {
  // The control plane's verdict on the node's protocol version (echoed from the
  // handshake negotiation). OK while the agent is current.
  vrooli.vrooli_bridge.v1.shared.CompatibilityStatus compatibility = 1;
}

message ReportDeliveryAckRequest {
  vrooli.vrooli_bridge.v1.shared.DeliveryAck ack = 1;
}

message ReportDeliveryAckResponse {
  bool accepted = 1;
}

message ReportSessionFrameRequest {
  vrooli.vrooli_bridge.v1.shared.SessionFrame frame = 1;
}

message ReportSessionFrameResponse {
  bool accepted = 1;
}
