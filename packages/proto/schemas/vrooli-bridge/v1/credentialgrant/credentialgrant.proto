syntax = "proto3";

package vrooli.vrooli_bridge.v1.credentialgrant;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/vrooli-bridge/v1/credentialgrant;credentialgrant_v1";

// CredentialGrantService is the owner-facing metadata surface for grant
// authoring. It never accepts or returns credential values.
service CredentialGrantService {
  rpc CreateGrant(CreateGrantRequest) returns (CredentialGrant);
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  rpc RevokeGrant(RevokeGrantRequest) returns (CredentialGrant);
  rpc RotateAddress(RotateAddressRequest) returns (RotationResponse);
  // Node-facing reconciliation. It authenticates the node proof and returns
  // metadata only so an offline node can purge grants revoked while it was
  // away without exposing a value or owner-only surface.
  rpc SyncNodeGrants(SyncNodeGrantsRequest) returns (ListGrantsResponse);
}

message CredentialGrant {
  string id = 1;
  string node_id = 2;
  string logical_id = 3;
  string field = 4;
  string class = 5;
  string retention = 6;
  int64 generation = 7;
  int64 acked_generation = 8;
  google.protobuf.Timestamp granted_at = 9;
  google.protobuf.Timestamp revoked_at = 10;
}

message CreateGrantRequest {
  string node_id = 1;
  string logical_id = 2;
  string field = 3;
  string class = 4;
  string retention = 5;
  int64 generation = 6;
}

message ListGrantsRequest {
  string node_id = 1;
}

message ListGrantsResponse {
  repeated CredentialGrant grants = 1;
}

message RevokeGrantRequest {
  string id = 1;
}

message SyncNodeGrantsRequest {
  string node_id = 1;
}

message RotateAddressRequest {
  string logical_id = 1;
  string field = 2;
}

message RotationResponse {
  string logical_id = 1;
  string field = 2;
  int64 generation = 3;
  repeated CredentialGrant grants = 4;
}
