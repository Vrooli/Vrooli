syntax = "proto3";

package vrooli.structure_health.v1.perf;

import "common/v1/metrics.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/structure-health/v1/perf;perf_v1";

// =============================================================================
// STRUCTURE STARTUP-PERFORMANCE SERVICE
// =============================================================================
//
// @layer 0
// @domain structure-health
// @stability beta
//
// PerfService measures scenario startup performance: it (re)starts a scenario
// behind a runner seam and records per-surface time-to-healthy plus a
// common.v1.ExecutionMetrics resource envelope (CPU/mem/GPU/host facts) into a
// persisted trend store. It is the measurement substrate for future lifecycle
// startup optimizations.
//
// IMPORTANT: this capability is intentionally decoupled from validation — it is
// NEVER invoked by any test-genie phase. It only runs via its own RPC / the
// `structure-health perf measure|trend` CLI, because it mutates lifecycle (it
// restarts the target scenario) and is resource-intensive.
// =============================================================================

service PerfService {
  // BenchmarkStartup (re)starts the target scenario, measures time-to-healthy +
  // the resource envelope, persists a trend row, and returns the measurement.
  rpc BenchmarkStartup(BenchmarkStartupRequest) returns (BenchmarkStartupResponse);
  // GetPerfTrend returns the persisted startup measurements for a scenario,
  // newest first.
  rpc GetPerfTrend(GetPerfTrendRequest) returns (GetPerfTrendResponse);
}

message BenchmarkStartupRequest {
  // Scenario slug to benchmark.
  string scenario = 1;
  // Maximum seconds to wait for the scenario to report healthy (0 = default).
  int32 timeout_seconds = 2;
}

message BenchmarkStartupResponse {
  PerfMeasurement measurement = 1;
}

message GetPerfTrendRequest {
  string scenario = 1;
  // Maximum measurements to return (0 = a server default).
  int32 limit = 2;
}

message GetPerfTrendResponse {
  string scenario = 1;
  // Persisted measurements, newest first.
  repeated PerfMeasurement measurements = 2;
}

// PerfMeasurement is one startup benchmark of one scenario.
message PerfMeasurement {
  string scenario = 1;
  // RFC3339Nano UTC capture time.
  string captured_at = 2;
  // Overall wall-clock from the restart trigger to the scenario reporting
  // healthy.
  int64 time_to_healthy_ms = 3;
  // True when the scenario reached healthy within the deadline.
  bool healthy = 4;
  // Per-surface reachability timings (e.g. api, ui ports).
  repeated SurfaceTiming surface_timings = 5;
  // Resource envelope of the benchmark operation (CPU/mem/GPU/host facts).
  common.v1.ExecutionMetrics metrics = 6;
  // Optional human note (e.g. degraded reason, timeout detail).
  string note = 7;
}

// SurfaceTiming is one surface's time-to-reachable during the benchmark.
message SurfaceTiming {
  // Surface id, e.g. "api" or "ui".
  string surface = 1;
  int64 time_to_healthy_ms = 2;
  bool healthy = 3;
}
