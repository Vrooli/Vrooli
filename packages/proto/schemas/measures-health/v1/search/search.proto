syntax = "proto3";

package vrooli.measures_health.v1.search;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/measures-health/v1/search;search_v1";

// =============================================================================
// SEARCH DOMAIN — the central measures index / federated measures provider
// =============================================================================
//
// @layer 5  (api surface)
// @domain index
// @stability unstable
//
// Wire contract for the SearchService Connect-RPC service: the single search-hub
// "measure" provider (federated-metrics layer, option b). It harvests every
// scenario's manifest `measure` blocks into a central index, matches a natural-
// language analytical question to the best measure, resolves its parameters
// (deterministic time_window first, constrained extraction for the rest), and —
// for a safe read-only measure resolved at high confidence — proxies execution to
// the owning scenario and returns the answer. The match/resolve/gate/execute
// brain is the shared packages/measures-go Engine; this service is the index +
// transport around it.
//
// The auto-execution contract is encoded in which MeasureHit fields are populated
// (this service never deviates from the gate keyed on `effect`):
//   - answer set + executed_query set  => auto-executed (only ever for
//     effect == "read" AND run_eligible AND confidence >= theta);
//   - needs non-empty                  => a required param was unresolved; NOT
//     executed (the consumer must ask, not guess);
//   - answer empty + needs empty + effect in {write, destructive} => params
//     resolved but execution withheld pending confirmation (never auto-run).
//
// IMPORTANT — wire shape for search-hub: the MeasureHit fields carry explicit
// snake_case `json_name` so the protojson the Connect server emits matches the
// keys search-hub's generic result adapter reads verbatim
// (scenarios/search-hub/.../providers/adapter.go decodeMeasureHit), and the
// registration descriptor's result_mapping.measure_field points at `measure`.
// This is the Go mirror of search-hub's routing.MeasureHit carrier.
//
// Consumed by:
//   - API: handlers/search/connect_handler.go implements SearchServiceHandler.
//   - CLI: cli/domains/search/handlers.go calls the generated Connect-Go client.
//   - search-hub: registered once via .vrooli/search.json (type "measure",
//     bucket STATE); the router fans analytical questions in here.
// =============================================================================

service SearchService {
  // Search matches an analytical question to the best-fitting measure, resolves
  // its params, and (for a safe read-only measure at high confidence) returns
  // the executed answer. Returns at most `limit` measure hits, best-first.
  rpc Search(SearchRequest) returns (SearchResponse);

  // Status reports backend availability (the measure index size + whether the
  // ollama extractor / qdrant index are reachable) so callers can degrade.
  rpc Status(StatusRequest) returns (StatusResponse);
}

// SearchRequest is the body accepted by SearchService.Search.
message SearchRequest {
  // Free-text natural-language analytical question
  // ("how many backlog items did we complete this week").
  string query = 1;
  // Maximum number of measure hits to return. Server clamps to a sane bound; a
  // measure provider typically returns the single best answer.
  int32 limit = 2;
}

// SearchResponse carries the matched measure hits.
message SearchResponse {
  // Best-first measure hits. `results` is the path the registration descriptor's
  // result_mapping.results_path points at; each item's `score` and `measure`
  // are the score_field / measure_field.
  repeated MeasureResult results = 1;
  // Which matcher answered ("lexical" | "ai" | "none") — for status/debug.
  string matcher = 2;
}

// MeasureResult is one matched measure: the retrieval similarity plus the
// structured measure answer/resolution.
message MeasureResult {
  // Retrieval similarity in [0,1] (the SearchHit.score search-hub normalizes).
  double score = 1;
  // The structured measure hit (the search-hub measure carrier).
  MeasureHit measure = 2;
}

// MeasureHit is the structured payload of a measure match — the Go mirror of
// search-hub's routing.MeasureHit. Every field carries an explicit snake_case
// `json_name` so the emitted protojson keys match search-hub's adapter contract.
message MeasureHit {
  // Stable measure identifier (the declaration name, "<domain>.<verb>").
  string measure_id = 1 [json_name = "measure_id"];
  // Owning scenario — who computes the answer (the execution-proxy target).
  string scenario = 2 [json_name = "scenario"];
  // Resolved parameter values (param name -> string value). Only successfully-
  // resolved params appear; an unresolved required param is in `needs` instead.
  map<string, string> params = 3 [json_name = "params"];
  // The computed answer rendered for presentation. Empty unless auto-executed.
  string answer = 4 [json_name = "answer"];
  // Required parameters that could not be resolved. Non-empty => not executed.
  repeated string needs = 5 [json_name = "needs"];
  // Side-effect class ("read" | "write" | "destructive"). The gate keys on this.
  string effect = 6 [json_name = "effect"];
  // The concrete query/aggregation that produced `answer` (provenance). Empty
  // unless executed.
  string executed_query = 7 [json_name = "executed_query"];
  // Extraction/match confidence in [0,1]; the gate compares it against theta.
  double confidence = 8 [json_name = "confidence"];
}

// StatusRequest is currently empty; reserved for future filters.
message StatusRequest {}

// StatusResponse reports measure-index + backend availability.
message StatusResponse {
  // True iff the provider can match a question end-to-end (index has measures).
  bool available = 1;
  // True iff the ollama extractor (constrained param extraction) is reachable.
  bool ollama = 2;
  // True iff the qdrant vector store is reachable (the future hybrid index leg).
  bool qdrant = 3;
  // Number of measures currently indexed across all scenarios.
  int32 indexed_count = 4;
  // Which matcher the provider is serving with ("lexical" | "ai").
  string matcher = 5;
}
