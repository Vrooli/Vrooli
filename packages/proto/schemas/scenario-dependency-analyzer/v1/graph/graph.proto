syntax = "proto3";

package vrooli.scenario_dependency_analyzer.v1.graph;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/scenario-dependency-analyzer/v1/graph;graph_v1";

// =============================================================================
// INTERFACE GRAPH DOMAIN
// =============================================================================
//
// @stability beta
//
// Wire contract for the fleet's actual cross-scenario interface graph. The
// graph is assembled from proto-health proto surfaces and code-facts import
// facts, then served from SDA's cached read model when fresh. Scenario
// Dependency Analyzer owns only the cross-scenario interpretation: it does not
// parse source files.
//
// Consumed by:
//   - CLI: graph actual uses the generated Connect client for machine-readable
//          graph output.
//   - tech-tree-designer consumes this seam to plan scenarios by their live
//     interface dependencies.
// =============================================================================

service InterfaceGraphService {
  // DescribeInterfaceGraph returns the actual interface graph.
  rpc DescribeInterfaceGraph(DescribeInterfaceGraphRequest) returns (DescribeInterfaceGraphResponse);

  // SearchInterfaceGraph is the federated AI-search leaf over the connection
  // graph: a natural-language query ("what does plan-manager depend on", "what
  // depends on prompt-manager") returns the scenarios whose connection record
  // best matches, ranked by relevance. It is Connection-only (what depends on
  // what) — purpose/anatomy queries belong to architecture-cartographer's
  // domain-map leaf. Backed by the .scenarios search corpus.
  rpc SearchInterfaceGraph(SearchInterfaceGraphRequest) returns (SearchInterfaceGraphResponse);
}

message DescribeInterfaceGraphRequest {
  // Optional scenario filter. Empty means all scenarios visible to the fact
  // providers.
  repeated string scenarios = 1;
  // Optional maximum number of scenarios to request from upstream fact
  // providers. Zero means no explicit limit.
  int32 limit = 2;
  // Optional proto-health stability filter such as "stable" or "experimental".
  string stability_filter = 3;
  // Optional code-facts language filter such as "go" or "typescript".
  repeated string language_filter = 4;
  // Optional neighborhood bound around scenarios. Zero means no neighborhood
  // bound. Only meaningful when scenarios are provided.
  int32 max_scenario_hops = 5;
}

message DescribeInterfaceGraphResponse {
  InterfaceGraph graph = 1;
  // RFC3339 timestamp for the cached graph used to serve the response. Empty
  // means the graph was built for this request and not served from cache.
  string computed_at = 2;
}

message SearchInterfaceGraphRequest {
  // Natural-language connection query.
  string query = 1;
  // Maximum hits to return. Zero means the service default.
  int32 limit = 2;
}

message SearchInterfaceGraphResponse {
  repeated ScenarioConnectionHit results = 1;
}

message ScenarioConnectionHit {
  // Scenario name (the natural ID / title).
  string scenario = 1;
  // Scenarios this scenario depends on (forward edges).
  repeated string depends_on = 2;
  // Scenarios that depend on this scenario (reverse edges).
  repeated string used_by = 3;
  // Human-readable connection summary, used as the federated snippet.
  string summary = 4;
  // Relevance score in [0,1] (cosine/rerank regime).
  double relevance_score = 5;
}

message InterfaceGraph {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  repeated GraphError errors = 3;
}

message GraphNode {
  string scenario = 1;
}

message GraphEdge {
  string from_scenario = 1;
  string to_scenario = 2;
  repeated GraphEvidence evidence = 3;
  string transport_world = 4;
  repeated string stability = 5;
}

message GraphEvidence {
  EvidenceSource source = 1;
  string import_path = 2;
  string from_file = 3;
  string to_file = 4;
  string path = 5;
  string analyzer = 6;
}

enum EvidenceSource {
  EVIDENCE_SOURCE_UNSPECIFIED = 0;
  EVIDENCE_SOURCE_PROTO_IMPORT = 1;
  EVIDENCE_SOURCE_GO_IMPORT = 2;
}

message GraphError {
  string source = 1;
  string scenario = 2;
  string message = 3;
}
