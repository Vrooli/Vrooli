syntax = "proto3";

package vrooli.architecture_cartographer.v1.migration;

import "architecture/v1/findings.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/architecture-cartographer/v1/migration;migration_v1";

// =============================================================================
// MIGRATION DOMAIN — the stateful tracker
// =============================================================================
//
// @layer 5  (api surface)
// @domain migration
// @stability beta
//
// Wire contract for the MigrationService Connect-RPC service. The migration
// domain is the PROJECT-PLAN half of the two-layer architecture-validation
// model: it ingests the shared ArchitectureFinding photograph produced by
// test-genie (the camera), tracks every finding through a lifecycle, hands
// the agent an ordered worklist, and on each re-audit reconciles by stable
// id (afid). Detection has no memory; this domain has all of it.
//
// It imports the NEUTRAL shared findings contract (vrooli.architecture.v1)
// so test-genie and the cartographer agree on one finding shape without a
// scenario→scenario proto dependency.
// =============================================================================

// TrackedFindingStatus mirrors the conflict lifecycle; the migration domain
// is now the canonical owner of this state machine.
enum TrackedFindingStatus {
  TRACKED_FINDING_STATUS_UNSPECIFIED = 0;
  TRACKED_FINDING_STATUS_DETECTED = 1;
  TRACKED_FINDING_STATUS_ASSIGNED = 2;
  TRACKED_FINDING_STATUS_SPLIT = 3;
  TRACKED_FINDING_STATUS_RESOLVED = 4;
  TRACKED_FINDING_STATUS_VALIDATED = 5;
  TRACKED_FINDING_STATUS_COMMITTED = 6;
  TRACKED_FINDING_STATUS_FORCE_RESOLVED = 7;
}

// MigrationLifecycle is the lifecycle of a whole migration.
enum MigrationLifecycle {
  MIGRATION_LIFECYCLE_UNSPECIFIED = 0;
  MIGRATION_LIFECYCLE_OPEN = 1;
  MIGRATION_LIFECYCLE_CLOSED = 2;
}

// TrackedFinding is one finding under migration, with the lifecycle state
// the tracker layers on top of the ingested ArchitectureFinding fields.
message TrackedFinding {
  string stable_id = 1;
  string scenario = 2;
  string source = 3; // cli, ui, docs, standards, architecture, structure, tidiness
  string code = 4;
  string severity = 5; // blocker, error, warn, info
  repeated string locations = 6;
  repeated string domains = 7;
  string message = 8;
  string suggestion = 9;
  TrackedFindingStatus status = 10;
  string resolution_note = 11;
  // True when this finding (re)appeared after the migration began — a
  // previously-terminal finding that came back, or a brand-new finding a
  // re-audit surfaced (introduced by the in-progress refactor).
  bool regressed = 12;
  google.protobuf.Timestamp first_seen_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// Migration is a tracked refactor of one scenario.
message Migration {
  string id = 1;
  string scenario = 2;
  string name = 3;
  MigrationLifecycle status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// MigrationStatus is the full projection: the migration plus every tracked
// finding and rollup counts.
message MigrationStatus {
  Migration migration = 1;
  repeated TrackedFinding findings = 2;
  int32 total = 3;
  int32 open = 4;
  int32 resolved = 5;
  int32 validated = 6;
  int32 regressions = 7;
  map<string, int32> by_severity = 8;
  map<string, int32> by_status = 9;
}

// =============================================================================
// MIGRATION SERVICE
// =============================================================================

service MigrationService {
  // CreateMigration opens a migration for a scenario and ingests the
  // initial findings (all start DETECTED).
  rpc CreateMigration(CreateMigrationRequest) returns (CreateMigrationResponse);
  // GetMigrationStatus returns the migration plus every tracked finding
  // and rollups.
  rpc GetMigrationStatus(GetMigrationStatusRequest) returns (GetMigrationStatusResponse);
  // NextMigrationStep returns the prioritized, dependency-aware worklist of
  // open findings (regressions first, then cycles, then severity).
  rpc NextMigrationStep(NextMigrationStepRequest) returns (NextMigrationStepResponse);
  // ResolveFinding marks one finding resolved with an operator note.
  rpc ResolveFinding(ResolveFindingRequest) returns (ResolveFindingResponse);
  // ApplyFinding records that a finding was fixed by hand (status-only
  // transition; no file write). Auto-execution of file-op fixes stays
  // deferred to the apply-execution plan.
  rpc ApplyFinding(ApplyFindingRequest) returns (ApplyFindingResponse);
  // ReauditMigration reconciles a fresh findings set against the tracked
  // set by stable id: absent→validated, present→stay, (re)appeared→regression.
  rpc ReauditMigration(ReauditMigrationRequest) returns (ReauditMigrationResponse);
  // CloseMigration marks the migration closed.
  rpc CloseMigration(CloseMigrationRequest) returns (CloseMigrationResponse);
}

message CreateMigrationRequest {
  string scenario = 1;
  string name = 2;
  repeated vrooli.architecture.v1.ArchitectureFinding findings = 3;
}
message CreateMigrationResponse {
  MigrationStatus status = 1;
}

message GetMigrationStatusRequest {
  string migration_id = 1;
}
message GetMigrationStatusResponse {
  MigrationStatus status = 1;
}

message NextMigrationStepRequest {
  string migration_id = 1;
}
message NextMigrationStepResponse {
  repeated TrackedFinding findings = 1;
}

message ResolveFindingRequest {
  string migration_id = 1;
  string stable_id = 2;
  string note = 3;
}
message ResolveFindingResponse {
  TrackedFinding finding = 1;
}

message ApplyFindingRequest {
  string migration_id = 1;
  string stable_id = 2;
}
message ApplyFindingResponse {
  TrackedFinding finding = 1;
}

message ReauditMigrationRequest {
  string migration_id = 1;
  repeated vrooli.architecture.v1.ArchitectureFinding findings = 2;
}
message ReauditMigrationResponse {
  repeated TrackedFinding validated = 1;
  repeated TrackedFinding still_open = 2;
  repeated TrackedFinding regressions = 3;
  MigrationStatus status = 4;
}

message CloseMigrationRequest {
  string migration_id = 1;
}
message CloseMigrationResponse {
  MigrationStatus status = 1;
}
