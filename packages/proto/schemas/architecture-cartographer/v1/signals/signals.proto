syntax = "proto3";

package vrooli.architecture_cartographer.v1.signals;

import "architecture-cartographer/v1/graph/graph.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/architecture-cartographer/v1/signals;signals_v1";

// =============================================================================
// SIGNALS DOMAIN
// =============================================================================
//
// @layer 5  (api surface)
// @domain signals
// @stability stable
//
// Wire contract for the SignalsService Connect-RPC service. The signals
// domain owns the pluggable, deterministic signal registry, per-signal
// scoring, and the aggregator that combines signal scores into an
// explainable verdict per chunk.
//
// Cross-cutting envelopes defined here and imported by other domains:
//   - Score    (per-signal output)
//   - Verdict  (aggregator output; consumed by conflicts and analytics)
//   - Tier     (auto_place / suggest / conflict)
//
// Signal invariants (enforced in code, asserted in tests):
//   1. Pure — given the same (chunk, graph, manifest), produces the same Score.
//   2. No mutation — never mutates the graph or manifest.
//   3. Self-explaining — every Score carries Evidence; aggregator refuses
//      empty Evidence and treats the signal as broken.
//   4. Bounded — Score.value is in [0, 1].
//   5. Cheap — signals are called per-chunk; caches (community detection,
//      glossary lookups) live on GraphContext, not on the signal.
// =============================================================================

// Tier classifies an aggregated verdict by confidence band.
//
//   - TIER_AUTO_PLACE: aggregator value >= manifest's auto_place threshold
//     (default 0.85). Cartographer may auto-place the chunk.
//   - TIER_SUGGEST:    aggregator value >= manifest's suggest threshold
//     (default 0.55) and below auto_place. Cartographer suggests but
//     defers to the operator.
//   - TIER_CONFLICT:   below suggest, or top-two within 0.10 of each
//     other (tied). Cartographer emits a conflict for human review.
enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_AUTO_PLACE = 1;
  TIER_SUGGEST = 2;
  TIER_CONFLICT = 3;
}

// Evidence is one piece of justification for a Score.
//
// Evidence kinds (extensible; v0.1 supports the following):
//   - "path_token"      — token match on the file path
//   - "import_cluster"  — community-detection cluster membership
//   - "symbol_glossary" — matched glossary term
//   - "importer_voting" — N importers, M agree on domain X
//   - "test_coupling"   — test/source file pairing
//   - "git_co_edit"     — co-edit frequency over the lookback window
message Evidence {
  // Stable kind identifier (see list above).
  string kind = 1;
  // Human-readable summary shown in CLI/UI (e.g., "8 of 10 importers
  // belong to 'conflicts'").
  string summary = 2;
  // Optional locator (e.g., path, edge string) the evidence references.
  string locator = 3;
  // Numeric weight contribution this piece of evidence supplied
  // (informational, in [0, 1]). Sum across Evidence is not required to
  // equal Score.value; the field exists for explainability tooling.
  double weight = 4;
}

// Score is one signal's output for one chunk.
message Score {
  // Signal name (e.g., "path-token", "import-cluster").
  string signal = 1;
  // Candidate domain this score endorses (e.g., "conflicts").
  string domain = 2;
  // Score value in [0, 1]. 0 means "no signal", 1 means "maximum
  // confidence."
  double value = 3;
  // Free-form short reason (e.g., "matched token 'conflict'").
  string reason = 4;
  // At least one Evidence entry is required by signal invariants.
  repeated Evidence evidence = 5;
}

// Verdict is the aggregator's output for one chunk.
message Verdict {
  // The chunk being scored.
  string chunk_id = 1;
  // Repo-relative path of the chunk (denormalized for log readability).
  string chunk_path = 2;
  // Tier classification.
  Tier tier = 3;
  // Top candidate domain (the highest-aggregated value).
  string top_domain = 4;
  // Top aggregated value, in [0, 1].
  double top_value = 5;
  // Runner-up candidate domain (for tie detection / CLI display).
  string runner_up_domain = 6;
  // Runner-up aggregated value, in [0, 1].
  double runner_up_value = 7;
  // Per-signal scores that contributed to the verdict. Order is
  // alphabetical by Score.signal then Score.domain for determinism.
  repeated Score scores = 8;
  // Aggregated values per candidate domain, alphabetical by domain.
  repeated DomainValue domain_values = 9;
  // True when the aggregator detected a tie (top-two within 0.10).
  bool tied = 10;
}

// DomainValue is one row of the aggregator's per-domain summary.
message DomainValue {
  string domain = 1;
  double value = 2;
}

// SignalDescriptor describes one registered signal.
message SignalDescriptor {
  // Signal name.
  string name = 1;
  // Default weight (before manifest overlay).
  double default_weight = 2;
  // Stability level (e.g., "stable", "beta").
  string stability = 3;
  // Short description.
  string description = 4;
  // True when the signal self-disabled for the current run (e.g.,
  // git-co-edit when `git` is unavailable).
  bool disabled = 5;
  // Reason for disablement when disabled=true.
  string disabled_reason = 6;
}

// =============================================================================
// SIGNALS SERVICE
// =============================================================================

service SignalsService {
  // ScoreChunk runs every enabled signal against the chunk and returns
  // both per-signal scores and the aggregated verdict.
  rpc ScoreChunk(ScoreChunkRequest) returns (ScoreChunkResponse);

  // ExplainVerdict re-runs scoring and returns the verdict with extra
  // explanation surface (per-evidence weights, runner-up details). v0.1
  // returns the same shape as ScoreChunk but is reserved for richer
  // diagnostics in later versions.
  rpc ExplainVerdict(ExplainVerdictRequest) returns (ExplainVerdictResponse);

  // ListSignals returns the registered signals + their default weights
  // + current enable/disable state.
  rpc ListSignals(ListSignalsRequest) returns (ListSignalsResponse);
}

message ScoreChunkRequest {
  // Target scenario name (resolves manifest + graph snapshot).
  string scenario = 1;
  // Either the chunk to score directly, or its file id (the service
  // looks up the chunk in the latest snapshot).
  vrooli.architecture_cartographer.v1.graph.Chunk chunk = 2;
  // When chunk is unset, use this file id from the latest snapshot.
  string file_id = 3;
}

message ScoreChunkResponse {
  Verdict verdict = 1;
}

message ExplainVerdictRequest {
  string scenario = 1;
  vrooli.architecture_cartographer.v1.graph.Chunk chunk = 2;
  string file_id = 3;
}

message ExplainVerdictResponse {
  Verdict verdict = 1;
}

message ListSignalsRequest {
  // Optional scenario filter — when set, the response reflects the
  // manifest-overlaid weights for that scenario.
  string scenario = 1;
}

message ListSignalsResponse {
  repeated SignalDescriptor signals = 1;
}
