syntax = "proto3";

package vrooli.architecture_cartographer.v1.manifest;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/architecture-cartographer/v1/manifest;manifest_v1";

// =============================================================================
// MANIFEST DOMAIN
// =============================================================================
//
// @layer 5  (api surface)
// @domain manifest
// @stability stable
//
// Wire contract for the ManifestService Connect-RPC service. The manifest
// domain owns parsing, validation, and overlay of the per-scenario
// architecture manifest that declares ideal domains, allowed_dependencies,
// shared substrate, glossaries, signal-weight overrides, confidence
// thresholds, and transitional declarations.
//
// Cross-cutting envelopes defined here and imported by other domains:
//   - ManifestDefinition        (root document)
//   - DomainSpec                (one declared domain)
//   - SignalWeights             (per-scenario weight overlay)
//   - Threshold                 (tier boundary value)
//   - TransitionalDeclaration   (intentional, dated deviations)
// =============================================================================

// ManifestVersion identifies a backwards-incompatible manifest shape.
// v0.1 ships MANIFEST_VERSION_V1 only; future versions ship alongside a
// `manifest migrate` command (out of scope for v0.1).
enum ManifestVersion {
  MANIFEST_VERSION_UNSPECIFIED = 0;
  MANIFEST_VERSION_V1 = 1;
}

// Severity classifies a manifest validation diagnostic.
enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_INFO = 1;
  DIAGNOSTIC_SEVERITY_WARN = 2;
  DIAGNOSTIC_SEVERITY_ERROR = 3;
}

// Threshold is a tier boundary for the aggregator.
message Threshold {
  // Tier name (e.g., "auto_place", "suggest", "conflict").
  string tier = 1;
  // Minimum aggregated verdict value to land in this tier, in [0, 1].
  double min_value = 2;
}

// SignalWeights is the per-scenario overlay applied on top of the
// day-one default weights documented in SIGNAL_LADDER.md.
message SignalWeights {
  // Map of signal name -> weight. Absent entries inherit the default.
  // Setting weight to 0 disables the signal for this scenario.
  map<string, double> weights = 1;
}

// TransitionalDeclaration marks an intentional deviation from the
// declared architecture as legitimate-for-now. Cartographer suppresses
// conflicts that match a non-expired declaration.
message TransitionalDeclaration {
  // Stable identifier within the manifest.
  string id = 1;
  // What kind of declaration (e.g., "allow_import", "allow_path",
  // "allow_cycle"). The value space is extensible; v0.1 supports the
  // three listed.
  string kind = 2;
  // Free-form locator interpreted by the declaration kind, e.g.,
  // "scenarios/foo/api/internal/x -> scenarios/foo/internal/y".
  string locator = 3;
  // Human-readable rationale shown in CLI/UI.
  string rationale = 4;
  // Expiry predicate (e.g., "after:2026-09-01", "until:branch-merges").
  // Empty means "no automatic expiry" — discouraged but allowed.
  string expires_when = 5;
}

// DomainSpec describes one declared domain in the target scenario.
message DomainSpec {
  // Domain name (e.g., "graph", "manifest", "conflicts").
  string name = 1;
  // Repo-relative path globs the domain owns (e.g.,
  // "api/internal/graph/**", "cli/domains/graph/**").
  repeated string paths = 2;
  // Names of domains this domain may import from. The implied
  // self-dependency is permitted without listing.
  repeated string allowed_dependencies = 3;
  // Per-domain glossary terms (canonical names like "Detector",
  // "Resolver"). Used by the symbol-glossary signal.
  repeated string glossary = 4;
  // Optional per-domain signal weight overrides (overlaid on top of
  // the manifest-level weights and the day-one defaults).
  SignalWeights signal_weight_overrides = 5;
}

// ManifestDefinition is the root document.
message ManifestDefinition {
  ManifestVersion manifest_version = 1;
  // Target scenario name (must match the directory name under scenarios/).
  string scenario = 2;
  // All declared domains.
  repeated DomainSpec domains = 3;
  // Repo-relative path globs treated as shared substrate (not owned by
  // any product domain — e.g., "api/internal/clock/**").
  repeated string shared_substrate = 4;
  // Manifest-level signal weight overlay (applies to every domain
  // unless a DomainSpec.signal_weight_overrides overrides it).
  SignalWeights signal_weights = 5;
  // Tier thresholds (e.g., auto_place=0.85, suggest=0.55). Missing
  // tiers inherit day-one defaults.
  repeated Threshold thresholds = 6;
  // Legitimate-for-now exemptions.
  repeated TransitionalDeclaration transitional = 7;
  // Server time at the moment this manifest was parsed/persisted.
  google.protobuf.Timestamp parsed_at = 8;
  // Content hash over the raw manifest source bytes.
  string content_hash = 9;
}

// Diagnostic is one validation finding emitted by ManifestService.
message Diagnostic {
  DiagnosticSeverity severity = 1;
  // Manifest path (e.g., "domains[3].allowed_dependencies[0]").
  string path = 2;
  // Source location in the raw manifest file (1-based).
  int32 line = 3;
  int32 column = 4;
  // Human-readable message.
  string message = 5;
  // Stable diagnostic code (e.g., "MANIFEST_UNKNOWN_DOMAIN").
  string code = 6;
}

// =============================================================================
// MANIFEST SERVICE
// =============================================================================

service ManifestService {
  // ValidateManifest parses the manifest at the requested location and
  // returns a diagnostics list. Returns the parsed ManifestDefinition
  // when validation succeeds at the structural level (even if
  // warning-severity diagnostics remain).
  rpc ValidateManifest(ValidateManifestRequest) returns (ValidateManifestResponse);

  // GetManifest returns the most recently parsed manifest for a
  // scenario.
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);

  // ListDomains returns the declared domains for a scenario without
  // requiring the caller to download the full manifest.
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse);
}

message ValidateManifestRequest {
  // Target scenario name.
  string scenario = 1;
  // Optional raw manifest bytes (YAML or JSON). When empty,
  // ManifestService reads from the scenario's default manifest path
  // (".cartographer/manifest.yaml").
  bytes source = 2;
  // Content type hint ("application/yaml", "application/json"). When
  // empty, the parser detects from the first non-whitespace byte.
  string content_type = 3;
}

message ValidateManifestResponse {
  ManifestDefinition manifest = 1;
  repeated Diagnostic diagnostics = 2;
  // True when no diagnostic has DIAGNOSTIC_SEVERITY_ERROR.
  bool valid = 3;
}

message GetManifestRequest {
  string scenario = 1;
}

message GetManifestResponse {
  ManifestDefinition manifest = 1;
}

message ListDomainsRequest {
  string scenario = 1;
}

message ListDomainsResponse {
  repeated DomainSpec domains = 1;
}
