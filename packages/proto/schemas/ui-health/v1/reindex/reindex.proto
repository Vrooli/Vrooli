syntax = "proto3";

package vrooli.ui_health.v1.reindex;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ui-health/v1/reindex;reindex_v1";

// =============================================================================
// REINDEX DOMAIN — async UI-surface reconciliation jobs
// =============================================================================
//
// @layer 5  (api surface)
// @domain reindex
// @stability unstable
//
// Long-running. Reindex starts a job and returns a job_id; ReindexStatus
// polls; ReindexCancel requests cooperative cancellation. ui-health discovers
// every scenario's framework from service.json and dispatches the per-scenario
// scan to the appropriate per-framework component-library scenario over the
// InventoryService Connect-RPC interface defined in inventory/inventory.proto.
// =============================================================================

service ReindexService {
  rpc Reindex(ReindexRequest) returns (ReindexResponse);
  rpc ReindexStatus(ReindexStatusRequest) returns (ReindexStatusResponse);
  rpc ReindexCancel(ReindexCancelRequest) returns (ReindexCancelResponse);
}

message ReindexRequest {
  string scenario = 1;
  bool dry_run = 2;
}

message ReindexResponse {
  string job_id = 1;
  int32 planned_upserts = 2;
  int32 planned_deletes = 3;
  bool dry_run = 4;
}

message ReindexStatusRequest {
  string job_id = 1;
}

message ReindexStatusResponse {
  string job_id = 1;
  string state = 2;
  int32 processed = 3;
  int32 total = 4;
  string error = 5;
  // Non-fatal advisory messages from the reindex job. Surfaced even on
  // state="succeeded_empty" so operators don't read a 0/0 no-op as healthy.
  repeated string warnings = 6;
  // Per-scenario dispatch outcomes. One entry per scenario the job
  // attempted to discover. Lets operators distinguish "dispatcher silently
  // returned zero surfaces" from "no scenarios were eligible".
  repeated ScenarioDispatchOutcome scenario_outcomes = 7;
}

// ScenarioDispatchOutcome reports the result of a single scenario's discovery
// pass. surfaces_found is the count returned by the framework dispatcher;
// error is set when discovery itself failed (template_id missing, dispatcher
// unreachable, etc).
message ScenarioDispatchOutcome {
  string scenario = 1;
  int32 surfaces_found = 2;
  string error = 3;
  // Framework template id (e.g. "react-vite") resolved from service.json.
  // Empty when the scenario has no generation.template.id.
  string template_id = 4;
}

message ReindexCancelRequest {
  string job_id = 1;
}

message ReindexCancelResponse {
  string job_id = 1;
  bool cancelled = 2;
}
