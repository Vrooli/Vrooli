syntax = "proto3";

package vrooli.ui_health.v1.visualhealth;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ui-health/v1/visualhealth;visualhealth_v1";

// =============================================================================
// VISUAL HEALTH DOMAIN
// =============================================================================
//
// @layer 5  (api surface)
// @domain visualhealth
// @stability unstable
//
// Canonical generic UI/browser-artifact judgment surface. BAS captures browser
// artifacts; ui-health analyzes them and emits normalized findings/metrics.
// Callers may pass artifact references for durable run artifacts, inline bytes
// for tests/small captures, or both.
// =============================================================================

service VisualHealthService {
  rpc AnalyzeArtifacts(AnalyzeArtifactsRequest) returns (AnalyzeArtifactsResponse);
  rpc CompareArtifacts(CompareArtifactsRequest) returns (CompareArtifactsResponse);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
}

enum VisualSeverity {
  VISUAL_SEVERITY_UNSPECIFIED = 0;
  VISUAL_SEVERITY_INFO = 1;
  VISUAL_SEVERITY_WARNING = 2;
  VISUAL_SEVERITY_ERROR = 3;
}

enum VisualCategory {
  VISUAL_CATEGORY_UNSPECIFIED = 0;
  VISUAL_CATEGORY_PIXEL = 1;
  VISUAL_CATEGORY_DOM = 2;
  VISUAL_CATEGORY_LAYOUT = 3;
  VISUAL_CATEGORY_ASSET = 4;
  VISUAL_CATEGORY_FOCUS = 5;
}

message ArtifactRef {
  string scenario = 1;
  string run_id = 2;
  string step_id = 3;
  string rel_path = 4;
  string uri = 5;
  string media_type = 6;
}

message Viewport {
  int32 width = 1;
  int32 height = 2;
  string device_profile = 3;
  double device_scale_factor = 4;
}

message ConsoleEntry {
  string level = 1;
  string message = 2;
}

message NetworkEntry {
  string url = 1;
  string method = 2;
  string resource_type = 3;
  int32 status = 4;
  string error_text = 5;
}

message PageError {
  string message = 1;
  string stack = 2;
}

message VisualStepArtifact {
  string step_id = 1;
  string label = 2;
  string url = 3;
  Viewport viewport = 4;

  ArtifactRef screenshot_ref = 5;
  bytes screenshot_png = 6;
  ArtifactRef dom_ref = 7;
  string dom_html = 8;
  ArtifactRef layout_ref = 9;
  string layout_json = 10;

  repeated ConsoleEntry console = 11;
  repeated NetworkEntry network = 12;
  repeated PageError page_errors = 13;
}

message VisualMetric {
  string name = 1;
  double value = 2;
}

message VisualFinding {
  string code = 1;
  VisualSeverity severity = 2;
  VisualCategory category = 3;
  string message = 4;
  string location = 5;
  string evidence = 6;
  string remediation = 7;
  string step_id = 8;
  repeated VisualMetric metrics = 9;
}

message StepVerdict {
  string step_id = 1;
  string status = 2;
  repeated VisualFinding findings = 3;
  repeated VisualMetric metrics = 4;
}

message AnalyzeArtifactsRequest {
  string scenario = 1;
  string run_id = 2;
  repeated VisualStepArtifact steps = 3;
}

message AnalyzeArtifactsResponse {
  string scenario = 1;
  string run_id = 2;
  string verdict = 3;
  repeated StepVerdict steps = 4;
  repeated VisualFinding findings = 5;
}

message CompareArtifact {
  string page = 1;
  string label = 2;
  ArtifactRef screenshot_ref = 3;
  bytes screenshot_png = 4;
}

message CompareArtifactsRequest {
  string scenario = 1;
  string base_run_id = 2;
  string current_run_id = 3;
  repeated CompareArtifact base = 4;
  repeated CompareArtifact current = 5;
}

message VisualDelta {
  string page = 1;
  string label = 2;
  string status = 3;
  double changed_fraction = 4;
}

message CompareArtifactsResponse {
  repeated VisualDelta deltas = 1;
}

message ListRulesRequest {}

message VisualRule {
  string id = 1;
  VisualCategory category = 2;
  VisualSeverity severity = 3;
  repeated string required_artifacts = 4;
  string remediation = 5;
}

message ListRulesResponse {
  repeated VisualRule rules = 1;
}
