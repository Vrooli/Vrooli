syntax = "proto3";

package vrooli.development_toolchain_validator.v1.golden;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/development-toolchain-validator/v1/golden;golden_v1";

// =============================================================================
// GOLDEN DOMAIN — Template-pristine reference scenario registry (OT-P0-001)
// =============================================================================
//
// @layer 5  (api surface)
// @domain golden
// @stability evolving
//
// Wire contract for the GoldenService Connect-RPC service. A Golden is a
// scenario that was generated by `vrooli scenario generate <template>` and
// has not been hand-modified since — i.e. it is template-pristine. Every
// skill validation run uses a Golden as its substrate.
//
// Consumed by:
//   - API: handlers/golden/connect_handler.go implements the generated
//          GoldenServiceHandler interface.
//   - UI:  ui/src/api/golden.ts exposes the generated Connect-Web client.
//   - CLI: cli/domains/golden/handlers.go drives the Connect-Go client.
// =============================================================================

service GoldenService {
  rpc ListGoldens(ListGoldensRequest) returns (ListGoldensResponse);
  rpc GetGolden(GetGoldenRequest) returns (GetGoldenResponse);
  rpc RegisterGolden(RegisterGoldenRequest) returns (RegisterGoldenResponse);
  rpc UpdateGolden(UpdateGoldenRequest) returns (UpdateGoldenResponse);
  rpc DeleteGolden(DeleteGoldenRequest) returns (DeleteGoldenResponse);
  rpc RegenerateGolden(RegenerateGoldenRequest) returns (RegenerateGoldenResponse);
}

// Golden is the canonical wire shape for a registered template-pristine
// scenario. The slug is the natural key (human-friendly, template-derived);
// the id is a UUID for stable cross-table reference.
message Golden {
  // UUID assigned by the API on register.
  string id = 1;

  // Human-friendly unique identifier (e.g. "reference-react-vite").
  string slug = 2;

  // Template the golden was generated from (e.g. "react-vite").
  string template_id = 3;

  // Template version recorded at last regeneration (e.g. "1.0.1").
  string template_version_pinned = 4;

  // Filesystem path relative to the repository root
  // (e.g. "scenarios/reference-react-vite").
  string path = 5;

  // Server time at first registration.
  google.protobuf.Timestamp created_at = 6;

  // Server time of the most recent regeneration (equals created_at on insert
  // when registered without an explicit regenerate step).
  google.protobuf.Timestamp last_regenerated_at = 7;
}

message ListGoldensRequest {}

message ListGoldensResponse {
  // Goldens ordered by slug ascending.
  repeated Golden goldens = 1;
}

message GetGoldenRequest {
  // Lookup key — accepts either the slug or the UUID id.
  string slug = 1;
}

message GetGoldenResponse {
  Golden golden = 1;
}

message RegisterGoldenRequest {
  string slug = 1;
  string template_id = 2;
  string template_version = 3;
  string path = 4;
}

message RegisterGoldenResponse {
  Golden golden = 1;
}

message UpdateGoldenRequest {
  // Required — identifies the record to update.
  string slug = 1;

  // Optional new path. Empty string means leave unchanged.
  string path = 2;

  // Optional new template version. Empty string means leave unchanged.
  string template_version = 3;
}

message UpdateGoldenResponse {
  Golden golden = 1;
}

message DeleteGoldenRequest {
  string slug = 1;
}

message DeleteGoldenResponse {}

message RegenerateGoldenRequest {
  string slug = 1;
}

message RegenerateGoldenResponse {
  Golden golden = 1;
}
