syntax = "proto3";

package agent_manager.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/agent-manager/v1/domain;domain";

// EpisodesService exposes bounded, deterministic friction evidence for one run.
service EpisodesService {
  rpc GetEpisodes(GetEpisodesRequest) returns (GetEpisodesResponse);
  rpc GetSelfReportSpans(GetSelfReportSpansRequest) returns (GetSelfReportSpansResponse);
  rpc GetCrossScenarioLedger(GetCrossScenarioLedgerRequest) returns (GetCrossScenarioLedgerResponse);
  rpc ImportTranscript(ImportTranscriptRequest) returns (ImportTranscriptResponse);
}

message FrictionEpisode {
  string episode_id = 1;
  string run_id = 2;
  string classifier_version = 3;
  string pattern = 4;
  string cause_scope = 5;
  string severity = 6;
  repeated string honesty_flags = 7;
  string start_event_id = 8;
  string end_event_id = 9;
  repeated string evidence_event_ids = 10;
  int64 turns = 11;
  int64 tokens = 12;
  int64 wall_clock_ms = 13;
  string suspected_owner_scenario = 14;
  string suspected_owner_command = 15;
  string owner_confidence = 16;
  string fingerprint = 17;
  int64 cycle_count = 18;
  string repeated_element = 19;
}

message GetEpisodesRequest {
  string run_id = 1;
}
message GetEpisodesResponse {
  string classifier_version = 1;
  repeated FrictionEpisode episodes = 2;
}

message GetSelfReportSpansRequest {
  string run_id = 1;
}
message SelfReportSpan {
  string classifier_version = 1;
  string event_id = 2;
  string rule_id = 3;
  string cause_scope = 4;
  int64 start_offset = 5;
  int64 end_offset = 6;
  string text = 7;
}
message GetSelfReportSpansResponse {
  string classifier_version = 1;
  repeated SelfReportSpan spans = 2;
}

message GetCrossScenarioLedgerRequest {
  string run_id = 1;
  bool with_projections = 2;
}
message Availability {
  string state = 1;
  string reason = 2;
}
message CrossScenarioCall {
  string occurred_at = 1;
  string target_scenario = 2;
  string operation = 3;
  string outcome = 4;
  uint32 status_code = 5;
  uint64 duration_ms = 6;
  string receipt_event_id = 7;
  bool verified = 8;
  google.protobuf.Struct projection = 9;
  int64 projection_drop_count = 10;
  string policy_version = 11;
}
message LedgerTargetRollup {
  string target_scenario = 1;
  int64 calls = 2;
  int64 failures = 3;
  uint64 total_duration_ms = 4;
  uint64 median_duration_ms = 5;
}
message GetCrossScenarioLedgerResponse {
  Availability ledger_availability = 1;
  Availability projection_availability = 2;
  repeated LedgerTargetRollup target_rollups = 3;
  repeated CrossScenarioCall calls = 4;
}

message ImportTranscriptRequest {
  string path = 1;
  string runner_type = 2;
  string label = 3;
}
message ImportTranscriptResponse {
  string run_id = 1;
  string status = 2;
  string execution_mode = 3;
}
