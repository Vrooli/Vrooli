syntax = "proto3";

package agent_manager.v1;

import "agent-manager/v1/domain/types.proto";
import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/agent-manager/v1/domain;domain";

// =============================================================================
// AGENT PROFILE
// =============================================================================
//
// @layer 1
// @domain agent-manager
// @imports types.proto
// @stability stable
//
// AgentProfile defines HOW an agent runs - the configuration template
// for agent execution. Profiles are reusable across many tasks.
//
// USAGE CONTEXTS:
//   - Profile Management: CRUD operations via API
//   - Run Creation: Profile ID references for consistent configuration
//   - Policy Enforcement: Runner restrictions, approval requirements
//
// =============================================================================

// AgentProfile defines the configuration for running an agent.
//
// This is a reusable definition that can be applied to many tasks.
// Profiles encapsulate runner settings, tool permissions, and policy flags.
//
// @usage POST /api/v1/profiles, referenced by Run.agent_profile_id
message AgentProfile {
  // Unique identifier for this profile.
  // @format uuid
  string id = 1;

  // Human-readable name for the profile.
  // @constraint 1-100 characters
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // Stable key used to reference the profile across scenarios and runs.
  // This is used for idempotent profile resolution.
  // @constraint 1-100 characters
  string profile_key = 18 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // Optional description of what this profile is used for.
  string description = 3;

  // Portable coding intent. Concrete runner/model selection is output-only
  // evidence in the immutable execution snapshot.
  string role_ref = 33 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // Maximum number of conversation turns before stopping.
  // 0 means unlimited (use with caution).
  // @constraint 0-1000
  int32 max_turns = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];

  // Maximum execution time for the agent.
  // Default: 30 minutes if not specified.
  google.protobuf.Duration timeout = 7;

  // Tools the agent is allowed to use.
  // Empty means use runner defaults.
  // Canonical values: read, write, edit, glob, grep, shell, web_search, web_fetch.
  repeated string allowed_tools = 8;

  // Tools explicitly denied even if in allowed_tools.
  repeated string denied_tools = 9;

  // Whether a runner that cannot enforce allowed_tools must refuse launch
  // (enforced, the default) or may proceed with an advisory warning.
  string tool_restriction_policy = 34;

  // Skip permission prompts during execution.
  // WARNING: Enables autonomous execution without user confirmation.
  bool skip_permission_prompt = 10;

  // Feature flags (typed, discoverable capabilities).
  FeatureFlags features = 23;

  // Extra CLI flags per runner type (validated escape hatch).
  // Key is runner type string (e.g., "claude-code").
  map<string, ExtraFlagList> extra_flags = 24;

  // Network access level for agent execution.
  NetworkAccess network_access = 25;

  // Scenario slug that owns this repo-sourced profile.
  string owner_scenario = 26;

  // Relative path to the source profile JSON within the owning scenario.
  string source_path = 27;

  // SHA-256 hash of the current source file content.
  string source_hash = 28;

  // SHA-256 hash last applied to this profile by reconciliation.
  string last_applied_hash = 29;

  // Modification time of the source file when it was last reconciled.
  google.protobuf.Timestamp source_updated_at = 30;

  // True when the profile has been edited locally since source reconciliation.
  bool local_override = 31;

  // Reserved to prevent accidental reuse of the wire IDs/names from
  // earlier schema iterations. SandboxConfig.mode is the single source
  // of truth for whether a run is sandboxed — see
  // scenarios/agent-manager/docs/internal/SEAMS.md (RunMode decision
  // boundary). Run-end apply behavior is controlled by
  // SandboxConfig (manual_review / auto_apply / apply_on_failure) per
  // the auditability contract.
  reserved 4, 5, 11, 12, 19, 22, 32;
  reserved "runner_type", "model", "policy_ref", "requires_sandbox", "requires_approval", "model_preset", "fallback_runner_types";

  // Sandbox lifecycle + acceptance configuration.
  SandboxConfig sandbox_config = 20;

  // Paths the agent is allowed to access.
  // Empty means no path restrictions.
  repeated string allowed_paths = 13;

  // Paths explicitly denied.
  repeated string denied_paths = 14;

  // User or system that created this profile.
  string created_by = 15;

  // When the profile was created.
  google.protobuf.Timestamp created_at = 16;

  // When the profile was last updated.
  google.protobuf.Timestamp updated_at = 17;

  // Canonical reasoning effort: low, medium, high, xhigh, or max.
  string effort = 35;
}

// =============================================================================
// RUN CONFIG
// =============================================================================

// RunConfig contains the resolved configuration for a run.
//
// This can be:
// - Loaded from a profile
// - Provided inline with the run request
// - A combination (profile as base, overrides applied)
//
// The orchestrator resolves the final config before execution.
//
// @usage Run.resolved_config, CreateRunRequest.inline_config
// ResultSpecKind selects the one canonical structured-result contract.
enum ResultSpecKind {
  RESULT_SPEC_KIND_UNSPECIFIED = 0;
  RESULT_SPEC_KIND_NONE = 1;
  RESULT_SPEC_KIND_JSON_SCHEMA = 2;
  RESULT_SPEC_KIND_CLASSIFICATION = 3;
}

// StructuredExtractionMode controls deterministic-only versus optional
// constrained fallback. Every fallback candidate is locally revalidated.
enum StructuredExtractionMode {
  STRUCTURED_EXTRACTION_MODE_UNSPECIFIED = 0;
  STRUCTURED_EXTRACTION_MODE_DETERMINISTIC_ONLY = 1;
  STRUCTURED_EXTRACTION_MODE_CONSTRAINED_FALLBACK = 2;
}

// ResultSpec is normalized before persistence. schema contains canonical JSON
// bytes and schema_digest identifies those exact bytes. classification_values
// is a create convenience compiled into schema and omitted after resolution.
message ResultSpec {
  string version = 1;
  ResultSpecKind kind = 2;
  bytes schema = 3;
  string schema_digest = 4;
  repeated string classification_values = 5;
  StructuredExtractionMode extraction_mode = 6;
  string extraction_role = 7;
  // Omitted means the workflow-safe default of one corrective continuation;
  // zero disables schema repair.
  optional int32 schema_repair_attempts = 8;
}

message RunConfig {
  // Which agent runner to use.
  RunnerType runner_type = 1;

  // Model to use for execution.
  string model = 2;

  // Portable role selected before policy_snapshot was created.
  string role_ref = 21;

  // Optional normalized typed-result request.
  ResultSpec result_spec = 22;

  // Maximum conversation turns.
  int32 max_turns = 3;

  // Maximum execution time.
  google.protobuf.Duration timeout = 4;

  // Tools the agent is allowed to use.
  repeated string allowed_tools = 5;

  // Tools explicitly denied.
  repeated string denied_tools = 6;

  string tool_restriction_policy = 23;

  // Canonical reasoning effort: low, medium, high, xhigh, or max.
  string effort = 24;

  // Skip permission prompts.
  bool skip_permission_prompt = 7;

  // Feature flags (typed, discoverable capabilities).
  FeatureFlags features = 16;

  // Extra CLI flags per runner type (validated escape hatch).
  map<string, ExtraFlagList> extra_flags = 17;

  // Network access level for agent execution.
  NetworkAccess network_access = 18;

  // Immutable policy resolution captured before the run is persisted. This is
  // output-only orchestration state: create surfaces accept RunConfigOverrides,
  // which deliberately has no policy_snapshot field.
  ExecutionPolicySnapshot policy_snapshot = 19;

  // Reserved to prevent accidental reuse of the wire IDs/names from
  // earlier schema iterations. SandboxConfig.mode is the single source
  // of truth for whether a run is sandboxed; run-end apply behavior is
  // controlled by SandboxConfig levers (manual_review / auto_apply /
  // apply_on_failure).
  reserved 8, 9, 12, 15, 20;
  reserved "policy_ref", "requires_sandbox", "requires_approval", "model_preset", "fallback_runner_types";

  // Sandbox lifecycle + acceptance configuration.
  SandboxConfig sandbox_config = 13;

  // Paths the agent is allowed to access.
  repeated string allowed_paths = 10;

  // Paths explicitly denied.
  repeated string denied_paths = 11;
}

// ExecutionCandidate is one immutable runner/model attempt in resolved order.
message ExecutionCandidate {
  RunnerType runner_type = 1;
  ModelSelectionType selection_type = 2;
  string model = 3;
  string resource_role = 4;
  repeated string fallbacks = 5;
  bool available = 6;
  string failure_code = 7;
  string failure = 8;
  ResourceProvenance provenance = 9;
  PermissionEnforcement enforcement = 10;
  string policy_path = 11;
  string policy_digest = 12;
}

// ResourceProvenance records the resource-owned policy authority that
// produced this concrete candidate.
message ResourceProvenance {
  string source = 1;
  string observed_at = 2;
}

// PermissionEnforcement reports the resource's real enforcement posture.
message PermissionEnforcement {
  string permissions = 1;
  repeated string caveats = 2;
}

// CandidatePreflight records creation-time availability evidence used to pick
// the initial candidate. Runtime attempts are recorded separately as events.
message CandidatePreflight {
  int32 index = 1;
  ExecutionCandidate candidate = 2;
  bool available = 3;
  string reason = 4;
}

// PolicyResolutionExplanation makes profile/override precedence and initial
// candidate selection inspectable without consulting mutable current policy.
message PolicyResolutionExplanation {
  string source = 1;
  string summary = 2;
  RunnerType requested_runner = 3;
  string requested_model = 4;
  string requested_role_ref = 8;
  repeated CandidatePreflight preflight = 6;
  reserved 5, 7;
  reserved "requested_preset", "requested_policy_ref";
}

// ExecutionPolicySnapshot pins the active catalog revision and complete
// ordered candidate sequence owned by a run.
message ExecutionPolicySnapshot {
  string catalog_digest = 1;
  repeated ExecutionCandidate candidates = 3;
  int32 selected_index = 4;
  ExecutionCandidate selected_candidate = 5;
  PolicyResolutionExplanation explanation = 6;
  string role_ref = 7;
  reserved 2;
  reserved "policy_ref";
}

// RunConfigOverrides contains optional overrides for run configuration.
//
// This is intended for inline run requests where fields should only override
// the profile when explicitly set.
//
// @usage CreateRunRequest.inline_config
message RunConfigOverrides {
  // Portable role intent. Concrete runner/model selection is resolved by the
  // active resource-owned role policy and persisted only in the run snapshot.
  optional string role_ref = 26;

  // Optional typed-result request. The server validates, canonicalizes, and
  // persists it with the resolved run configuration.
  ResultSpec result_spec = 27;

  // Maximum conversation turns.
  optional int32 max_turns = 3;

  // Maximum execution time.
  optional google.protobuf.Duration timeout = 4;

  // Tools the agent is allowed to use.
  repeated string allowed_tools = 5;

  // Tools explicitly denied.
  repeated string denied_tools = 6;

  // Skip permission prompts.
  optional bool skip_permission_prompt = 7;

  // Feature flags override.
  optional FeatureFlags features = 21;

  // Extra CLI flags per runner type override.
  map<string, ExtraFlagList> extra_flags = 22;

  // Clear extra flags inherited from profile.
  bool clear_extra_flags = 23;

  // Network access level override.
  optional NetworkAccess network_access = 24;

  // Canonical reasoning effort override.
  optional string effort = 28;

  // Reserved to prevent accidental reuse of wire IDs/names from earlier
  // schema iterations. SandboxConfig.mode is the single source of truth
  // for whether a run is sandboxed; run-end apply behavior is on
  // SandboxConfig levers.
  reserved 1, 2, 8, 9, 16, 19, 20, 25;
  reserved "runner_type", "model", "policy_ref", "requires_sandbox", "requires_approval", "model_preset", "fallback_runner_types", "clear_fallback_runner_types";

  // Sandbox lifecycle + acceptance configuration.
  SandboxConfig sandbox_config = 17;

  // Paths the agent is allowed to access.
  repeated string allowed_paths = 10;

  // Paths explicitly denied.
  repeated string denied_paths = 11;

  // Clear allowed tools inherited from profile.
  bool clear_allowed_tools = 12;

  // Clear denied tools inherited from profile.
  bool clear_denied_tools = 13;

  // Clear allowed paths inherited from profile.
  bool clear_allowed_paths = 14;

  // Clear denied paths inherited from profile.
  bool clear_denied_paths = 15;
}

// =============================================================================
// HEARTBEAT CONFIG
// =============================================================================

// HeartbeatConfig defines heartbeat behavior for long-running operations.
//
// Used for stale run detection and health monitoring.
//
// @usage internal orchestrator configuration
message HeartbeatConfig {
  // How often to send heartbeats.
  // Default: 30 seconds.
  google.protobuf.Duration interval = 1;

  // How long without a heartbeat before considering dead.
  // Default: 2 minutes.
  google.protobuf.Duration timeout = 2;

  // Number of missed heartbeats before termination.
  // Default: 3.
  int32 max_missed_beats = 3;
}
