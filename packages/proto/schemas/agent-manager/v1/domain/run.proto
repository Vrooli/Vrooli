syntax = "proto3";

package agent_manager.v1;

import "agent-manager/v1/domain/profile.proto";
import "agent-manager/v1/domain/types.proto";
import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/agent-manager/v1/domain;domain";

// =============================================================================
// RUN
// =============================================================================
//
// @layer 2
// @domain agent-manager
// @imports types.proto, profile.proto
// @stability stable
//
// Run represents a concrete execution attempt of a task.
// Links a Task (what) to an AgentProfile (how) with execution tracking.
//
// USAGE CONTEXTS:
//   - Run Management: CRUD operations via API
//   - Execution Tracking: Status, phase, progress, heartbeat
//   - Approval Workflow: Approval state, actor, timestamp
//   - Result Collection: Summary, diff, artifacts
//
// =============================================================================

// Run represents a single execution attempt of a task.
//
// A run is created by associating a task with a profile (or inline config).
// It tracks execution state, progress, and results.
//
// @usage POST /api/v1/runs, GET /api/v1/runs/{id}
message Run {
  // Unique identifier for this run.
  // @format uuid
  string id = 1;

  // Task being executed.
  // @format uuid
  string task_id = 2 [(buf.validate.field).string.uuid = true];

  // Agent profile used for this run.
  // Optional if inline config is provided.
  // @format uuid
  optional string agent_profile_id = 3;

  // Custom tag for identification.
  // Defaults to ID if not set.
  // Used for agent tracking, log filtering, external process identification.
  // Examples: "ecosystem-task-123", "test-genie-abc"
  string tag = 4;

  // Sandbox ID if running in sandboxed mode.
  // @format uuid
  optional string sandbox_id = 5;

  // Execution mode (sandboxed or in-place).
  RunMode run_mode = 6;

  // Current status.
  RunStatus status = 7;

  // When the run started executing.
  optional google.protobuf.Timestamp started_at = 8;

  // When the run finished (success, failure, or cancellation).
  optional google.protobuf.Timestamp ended_at = 9;

  // Detailed execution phase.
  RunPhase phase = 10;

  // ID of the last saved checkpoint for resumption.
  // @format uuid
  optional string last_checkpoint_id = 11;

  // Last heartbeat from the runner.
  // Used for stale run detection.
  optional google.protobuf.Timestamp last_heartbeat = 12;

  // Progress percentage (0-100).
  int32 progress_percent = 13 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];

  // Idempotency key for replay safety.
  string idempotency_key = 14;

  // Execution summary after completion.
  optional RunSummary summary = 15;

  // Error message if failed.
  string error_msg = 16;

  // Exit code from the runner process.
  optional int32 exit_code = 17;

  // Approval workflow state.
  ApprovalState approval_state = 18;

  // User who approved/rejected.
  string approved_by = 19;

  // When the approval decision was made.
  optional google.protobuf.Timestamp approved_at = 20;

  // Resolved configuration for this run.
  // Merged from profile + inline overrides.
  optional RunConfig resolved_config = 21;

  // Path to the generated diff file.
  string diff_path = 22;

  // Path to the execution log file.
  string log_path = 23;

  // Number of files changed by this run.
  int32 changed_files = 24;

  // Total size of changes in bytes.
  int64 total_size_bytes = 25;

  // Runner-specific session identifier for conversation resumption.
  // Populated from runner stream events:
  //   - Claude Code: session_id
  //   - Codex: thread_id
  //   - OpenCode: sessionID
  // Used with the Continue endpoint to resume conversations.
  string session_id = 28;

  // When the run was created.
  google.protobuf.Timestamp created_at = 26;

  // When the run was last updated.
  google.protobuf.Timestamp updated_at = 27;

  // Action availability for this run (computed).
  RunActions actions = 29;

  // First ~120 characters of the associated task description.
  // Populated on list/get responses for display purposes.
  string prompt_preview = 30;

  // Model requested when the run was created (may differ from actual).
  string requested_model = 31;

  // Model actually used for execution (populated at dispatch).
  string actual_model = 32;

  // Post-run sandbox finalization status.
  // Tracks apply/checkpoint effects separately from runner turn status.
  RunFinalizationStatus finalization_status = 33;

  // Error from post-run sandbox finalization, when finalization failed.
  string finalization_error = 34;

  // When post-run sandbox finalization reached a terminal state.
  optional google.protobuf.Timestamp finalized_at = 35;

  // Externally-owned async work this run is parked on (set only while
  // status == RUN_STATUS_PARKED; nil otherwise). Surfaced so operators see
  // what a parked run is waiting on and its ETA — a parked run is suspended,
  // not hung.
  optional AwaitHandle await_handle = 36;

  // Substrate agent-manager uses to drive the agent CLI (codec-pipe vs
  // interactive web-console session). Orthogonal to run_mode. Unset/UNSPECIFIED
  // is treated as EXECUTION_MODE_CODEC_PIPE. Surfaced so operators see the mode
  // on run records everywhere runs are listed.
  ExecutionMode execution_mode = 37;

  // Id of the web-console session hosting the interactive agent CLI. Set only
  // for interactive runs; backs the run-detail deep link to the live session.
  string web_console_session_id = 38;

  // Resolved deep link to the live web-console session (computed, not
  // persisted). Set only for interactive runs when the web-console UI base is
  // resolvable server-side; empty otherwise so the client can fall back to
  // showing web_console_session_id alone.
  string web_console_session_url = 39;

  // Canonical, provenance-bearing terminal result. Historical rows created
  // before RunResult adoption leave this absent; clients must not synthesize
  // provenance from summary or transcript tail position.
  optional RunResult result = 40;
}

// FinalOutputSelectionStatus describes whether provider evidence identifies a
// unique final assistant handoff.
enum FinalOutputSelectionStatus {
  FINAL_OUTPUT_SELECTION_STATUS_UNSPECIFIED = 0;
  FINAL_OUTPUT_SELECTION_STATUS_SELECTED = 1;
  FINAL_OUTPUT_SELECTION_STATUS_AMBIGUOUS = 2;
  FINAL_OUTPUT_SELECTION_STATUS_UNAVAILABLE = 3;
}

// FinalOutputCandidate is one assistant message considered by the resolver.
message FinalOutputCandidate {
  string id = 1;
  string event_id = 2;
  int64 sequence = 3;
  string content = 4;
  string message_id = 5;
  string conversation_id = 6;
  string turn_id = 7;
  string provider_origin = 8;
  string completion_reason = 9;
  bool terminal = 10;
  string parent_message_id = 11;
  string provider_event_type = 12;
  string raw_evidence_ref = 13;
  int32 evidence_tier = 14;
}

// FinalOutputSelection explains the deterministic resolver decision.
message FinalOutputSelection {
  FinalOutputSelectionStatus status = 1;
  string selected_candidate_id = 2;
  string rule = 3;
  string algorithm_version = 4;
  repeated string evidence = 5;
}

// RunResult is the canonical terminal result for one execute or continue turn.
message RunResult {
  string final_output = 1;
  FinalOutputSelection selection = 2;
  repeated FinalOutputCandidate candidates = 3;
  bool success = 4;
  int32 exit_code = 5;
  string terminal_reason = 6;
}

// AwaitHandle identifies the externally-owned async work a parked run is
// blocked on. agent-manager (which owns the agent process) performs the
// blocking wait on the agent's behalf via a per-producer Waiter and wakes the
// run when the handle resolves (or its deadline elapses). Present only on a
// parked run; observability for "parked != hung".
//
// @usage Run.await_handle
message AwaitHandle {
  // Producer that resolves this handle (e.g. "test-genie", "git-control-tower").
  string producer = 1;

  // Producer-scoped identifier of the awaited work (e.g. "<scenario>/<run-id>").
  string key = 2;

  // Wait deadline. When it elapses agent-manager wakes the run with a typed
  // timeout result rather than hanging. Always populated on a persisted handle
  // (the orchestrator default ParkTTL is applied at park time when no explicit
  // deadline is supplied).
  optional google.protobuf.Timestamp deadline = 3;

  // When the run was parked (for observability / ETA display).
  google.protobuf.Timestamp registered_at = 4;
}

// RunActions captures which operations are currently allowed for a run.
//
// @usage Run.actions
message RunActions {
  bool can_investigate = 1;
  bool can_apply_investigation = 2;
  bool can_delete = 3;
  bool can_stop = 4;
  bool can_retry = 5;
  bool can_continue = 6;
  bool can_approve = 7;
  bool can_reject = 8;
  bool can_review = 9;
  bool can_extract_recommendations = 10;
  bool can_regenerate_recommendations = 11;

  // Human-readable reason why continuation is unavailable.
  // Empty when can_continue is true.
  string can_continue_reason = 12;

  // Whether the run can be resumed from a prior failure.
  bool can_resume_from_failure = 13;

  // Human-readable reason why resume-from-failure is unavailable.
  // Empty when can_resume_from_failure is true.
  string can_resume_from_failure_reason = 14;

  // Human-readable warning when post-run sandbox finalization failed.
  string finalization_warning = 15;

  // Whether the run has failed finalization that can be retried or repaired.
  bool can_retry_finalization = 16;
}

// =============================================================================
// RUN SUMMARY
// =============================================================================

// RunSummary contains the structured summary from an agent run.
//
// Populated after successful execution with details about
// what was accomplished and resource usage.
//
// @usage Run.summary
message RunSummary {
  // Human-readable description of what was done.
  string description = 1;

  // Files that were modified.
  repeated string files_modified = 2;

  // Files that were created.
  repeated string files_created = 3;

  // Files that were deleted.
  repeated string files_deleted = 4;

  // Total tokens consumed (input + output).
  int32 tokens_used = 5;

  // Number of conversation turns.
  int32 turns_used = 6;

  // Estimated cost in USD.
  double cost_estimate = 7;

  // Last-turn input tokens — approximates current context window usage.
  int32 context_tokens = 8;
}

// =============================================================================
// RUN CHECKPOINT
// =============================================================================

// RunCheckpoint captures the state needed to resume a run.
//
// Checkpoints are saved at phase transitions and enable
// resumption after interruption.
//
// @usage internal resumption
message RunCheckpoint {
  // Run ID this checkpoint belongs to.
  // @format uuid
  string run_id = 1;

  // Current execution phase.
  RunPhase phase = 2;

  // Progress within the phase (0-indexed).
  int32 step_within_phase = 3;

  // Sandbox ID if created.
  // @format uuid
  optional string sandbox_id = 4;

  // Working directory path.
  string work_dir = 5;

  // Scope lock ID if acquired.
  // @format uuid
  optional string lock_id = 6;

  // Last event sequence number persisted.
  int64 last_event_sequence = 7;

  // When we last confirmed progress.
  google.protobuf.Timestamp last_heartbeat = 8;

  // How many times this phase has been retried.
  int32 retry_count = 9;

  // When this checkpoint was created.
  google.protobuf.Timestamp saved_at = 10;

  // Phase-specific state for resumption.
  map<string, string> metadata = 11;
}

// =============================================================================
// RUN PROGRESS
// =============================================================================

// RunProgress represents the current progress of a run for display.
//
// Provides human-readable progress information for UI display.
//
// @usage GET /api/v1/runs/{id}/progress, WebSocket progress events
message RunProgress {
  // Current execution phase.
  RunPhase phase = 1;

  // Human-readable phase description.
  string phase_description = 2;

  // Overall progress percentage (0-100).
  int32 percent_complete = 3;

  // What's happening now.
  string current_action = 4;

  // How long the run has been active.
  google.protobuf.Duration elapsed_time = 5;

  // Estimated time remaining (if known).
  optional google.protobuf.Duration estimated_remaining = 6;

  // When progress was last reported.
  google.protobuf.Timestamp last_update = 7;
}

// =============================================================================
// IDEMPOTENCY RECORD
// =============================================================================

// IdempotencyRecord tracks whether an operation has been performed.
//
// Prevents duplicate work when operations are retried.
// Records expire after a configurable TTL.
//
// @usage internal replay safety
message IdempotencyRecord {
  // Unique operation key.
  // Format: "run-create:task-{taskID}:profile-{profileID}:ts-{timestamp}"
  string key = 1;

  // Operation outcome.
  IdempotencyStatus status = 2;

  // ID of the created/affected entity.
  // @format uuid
  optional string entity_id = 3;

  // Type of entity (e.g., "Run", "Task").
  string entity_type = 4;

  // When this record was created.
  google.protobuf.Timestamp created_at = 5;

  // When this record can be garbage collected.
  google.protobuf.Timestamp expires_at = 6;

  // Cached response (JSON) for successful operations.
  bytes response = 7;
}

// =============================================================================
// RUNNER STATUS
// =============================================================================

// RunnerStatus provides status information for a runner type.
//
// Returned by the runner status endpoint to indicate availability.
//
// @usage GET /api/v1/runners
message RunnerStatus {
  // Which runner type.
  RunnerType runner_type = 1;

  // Whether the runner is available for use.
  bool available = 2;

  // Human-readable status message.
  string message = 3;

  // Installation hint if not available.
  string install_hint = 4;

  // Supported models for this runner.
  repeated string supported_models = 5;

  // Runner capabilities.
  RunnerCapabilities capabilities = 6;
}

// RunnerCapabilities describes what a runner supports.
//
// @usage RunnerStatus.capabilities
message RunnerCapabilities {
  // Supports streaming output.
  bool supports_streaming = 1;

  // Supports conversation messages.
  bool supports_messages = 2;

  // Supports tool call/result events.
  bool supports_tool_events = 3;

  // Supports cost tracking.
  bool supports_cost_tracking = 4;

  // Supports run cancellation.
  bool supports_cancellation = 5;

  // Maximum turns (0 = unlimited).
  int32 max_turns = 6;

  // Supports session continuation (resume/continue conversation).
  bool supports_continuation = 7;

  // Feature flags this runner supports (e.g., "EnableBrowser").
  repeated string supported_features = 8;

  // Extra CLI flags this runner allows (e.g., "--verbose").
  repeated string allowed_extra_flags = 9;
}

// =============================================================================
// PROBE RESULT
// =============================================================================

// ProbeResult contains the result of a runner connectivity probe.
//
// @usage POST /api/v1/runners/{type}/probe
message ProbeResult {
  // Whether the probe succeeded.
  bool success = 1;

  // Response time in milliseconds.
  int64 latency_ms = 2;

  // Error message if probe failed.
  string error = 3;

  // Additional probe details.
  map<string, string> details = 4;
}

// =============================================================================
// STOP ALL RESULT
// =============================================================================

// StopAllResult contains the result of stopping multiple runs.
//
// @usage POST /api/v1/runs/stop-all
message StopAllResult {
  // Number of runs stopped.
  int32 stopped_count = 1;

  // Runs that failed to stop.
  repeated StopFailure failures = 2;
}

// StopFailure describes a run that failed to stop.
message StopFailure {
  // Run ID that failed.
  // @format uuid
  string run_id = 1;

  // Error message.
  string error = 2;
}

// =============================================================================
// APPROVE RESULT
// =============================================================================

// ApproveResult contains the result of approving a run.
//
// @usage POST /api/v1/runs/{id}/approve
message ApproveResult {
  // Whether approval was successful.
  bool success = 1;

  // Number of files applied.
  int32 files_applied = 2;

  // Git commit hash if changes were committed.
  string commit_hash = 3;

  // Message describing what was applied.
  string message = 4;

  // Number of files remaining to be approved (for partial approve).
  int32 remaining = 5;

  // Whether this was a partial approval.
  bool is_partial = 6;
}

// =============================================================================
// RUN DIFF
// =============================================================================

// RunDiff contains the diff output for a run.
//
// @usage GET /api/v1/runs/{id}/diff
message RunDiff {
  // Run ID.
  // @format uuid
  string run_id = 1;

  // Unified diff content.
  string content = 2;

  // Individual file changes.
  repeated FileDiff files = 3;

  // When the diff was generated.
  google.protobuf.Timestamp generated_at = 4;
}

// FileDiff represents changes to a single file.
message FileDiff {
  // File path.
  string path = 1;

  // Change type: added, modified, deleted.
  string change_type = 2;

  // Lines added.
  int32 additions = 3;

  // Lines deleted.
  int32 deletions = 4;

  // Whether the file is binary.
  bool is_binary = 5;

  // Unified diff for this file.
  string patch = 6;

  // File change ID (for partial approve).
  // @format uuid
  string id = 7;
}

// =============================================================================
// ATTACHMENT
// =============================================================================

// Attachment represents an uploaded file (image, PDF, etc.) associated with a run.
//
// @usage POST /api/v1/attachments/upload response, ContinueRunRequest context
message Attachment {
  // Server-assigned unique identifier.
  // @format uuid
  string id = 1;

  // Original sanitized filename.
  string file_name = 2;

  // MIME type (e.g., "image/png").
  string content_type = 3;

  // Size in bytes.
  int64 file_size = 4;

  // Internal storage path (not exposed to clients in all contexts).
  string storage_path = 5;

  // Serving URL relative to API base.
  string url = 6;
}

// =============================================================================
// CONTINUE RUN REQUEST/RESPONSE
// =============================================================================

// ContinueRunRequest contains parameters for continuing a run's conversation.
//
// Sends a follow-up message to an existing run's session, resuming the
// conversation even after the runner process has ended (using stored session_id).
//
// @usage POST /api/v1/runs/{id}/continue
message ContinueRunRequest {
  // Run ID to continue.
  // @format uuid
  string run_id = 1 [(buf.validate.field).string.uuid = true];

  // Follow-up message to send to the agent.
  string message = 2 [(buf.validate.field).string.min_len = 1];

  // IDs of uploaded attachments to include with this message.
  repeated string attachment_ids = 3;
}

// ContinueRunResponse contains the result of continuing a run.
//
// @usage POST /api/v1/runs/{id}/continue response
message ContinueRunResponse {
  // Whether the continuation started successfully.
  bool success = 1;

  // Updated run with new session state.
  Run run = 2;

  // Error message if continuation failed.
  string error = 3;

  // Error code for programmatic handling.
  // Codes: "session_expired", "continuation_not_supported", "run_not_found"
  string error_code = 4;
}

// =============================================================================
// DELETE RUN MESSAGE REQUEST/RESPONSE
// =============================================================================

// DeleteRunMessageRequest marks a message event as deleted.
//
// This appends a message_deleted event instead of removing history.
//
// @usage POST /api/v1/runs/{id}/messages/{event_id}/delete
message DeleteRunMessageRequest {
  // Run ID containing the message event.
  // @format uuid
  string run_id = 1 [(buf.validate.field).string.uuid = true];

  // Message event ID to delete.
  // @format uuid
  string event_id = 2 [(buf.validate.field).string.uuid = true];
}

// DeleteRunMessageResponse confirms deletion.
//
// @usage POST /api/v1/runs/{id}/messages/{event_id}/delete response
message DeleteRunMessageResponse {
  // Whether the delete event was created.
  bool success = 1;
}

// =============================================================================
// PARK / WAKE REQUEST/RESPONSE (durable park/resume)
// =============================================================================

// ParkRunRequest suspends a running run on externally-owned async work.
//
// Called from inside an agent-manager-controlled run (the in-run CLI carries
// VROOLI_AGENT_IDENTITY_TOKEN) when the agent issues an async request whose
// result agent-manager can wait for on its behalf — e.g. a test-genie run or a
// git-control-tower baseline diff. The run transitions running→parked (process
// exits, zero tokens) and is woken with the resolved result injected as the next
// turn once the producer completes (or the park deadline elapses). The caller
// must be the owning, live run: the identity token's run_id must match the path.
//
// @usage POST /api/v1/runs/{id}/park
message ParkRunRequest {
  // Run ID to park.
  // @format uuid
  string run_id = 1 [(buf.validate.field).string.uuid = true];

  // Producer that will resolve the await-handle (e.g. "test-genie",
  // "git-control-tower"). Identifies the Waiter agent-manager drives.
  string producer = 2 [(buf.validate.field).string.min_len = 1];

  // Producer-scoped identifier of the awaited work (e.g. "<scenario>/<run-id>").
  string key = 3 [(buf.validate.field).string.min_len = 1];

  // Optional wait deadline as a Unix timestamp (seconds). 0 ⇒ now + default
  // park TTL. A handle that never resolves is woken with a typed timeout result
  // at this deadline rather than hanging forever.
  int64 deadline_unix = 4;

  // The owning run's VROOLI_AGENT_IDENTITY_TOKEN. Authenticates the caller as
  // the run being parked; the server rejects a token whose run_id differs from
  // the path or that fails verification.
  string identity_token = 5;
}

// ParkRunResponse confirms a park and carries the clean turn-ending message.
//
// @usage POST /api/v1/runs/{id}/park response
message ParkRunResponse {
  // Whether the run was parked.
  bool success = 1;

  // The parked run.
  Run run = 2;

  // Tool-result text the in-run command prints. On a successful park it is the
  // clean "parked, resuming later" message; on a refusal it is the steer message
  // (which embeds the cached result) so the agent stops re-running the work.
  string message = 3;

  // Whether agent-manager REFUSED to park because this is a no-progress re-park
  // on the same await key (the degenerate wake→re-run loop). When true the run is
  // NOT parked and the turn is NOT ended — the agent keeps running and should use
  // the cached result rather than re-running the blocking producer.
  bool refused = 4;

  // The cached awaited result, echoed back on a refusal so the agent has the data
  // inline even if it never saw the original wake injection.
  string result = 5;
}

// GetAwaitResultResponse returns a run's most recently resolved await result —
// the durable re-fetch path that lets a woken agent re-read what it parked on
// without re-running the blocking producer. Pure read; never parks or blocks.
//
// @usage GET /api/v1/runs/{id}/await-result response
message GetAwaitResultResponse {
  // Whether a resolved await result is recorded for the run.
  bool found = 1;

  // The "producer:key" identity of the resolved await.
  string key = 2;

  // The full result string that was injected into the woken turn.
  string result = 3;

  // When the await resolved (RFC3339). Empty when none recorded.
  string resolved_at = 4;
}

// WakeRunRequest resumes a parked run with the awaited result injected as the
// next user turn. Primarily orchestrator-internal (the waiter goroutine drives
// wake on resolve/timeout); the endpoint exists for manual/ops recovery.
//
// @usage POST /api/v1/runs/{id}/wake
message WakeRunRequest {
  // Run ID to wake.
  // @format uuid
  string run_id = 1 [(buf.validate.field).string.uuid = true];

  // The resolved awaited result, injected as the next user turn.
  string result = 2;

  // Whether the park deadline elapsed without resolution. When true the injected
  // message is framed as a typed timeout so the agent stays in control.
  bool timed_out = 3;
}

// WakeRunResponse confirms a wake.
//
// @usage POST /api/v1/runs/{id}/wake response
message WakeRunResponse {
  // Whether the wake started (false when the run was no longer parked — wake is
  // idempotent, so a no-op is reported as success=false without an error).
  bool success = 1;

  // The woken (or unchanged) run.
  Run run = 2;
}
