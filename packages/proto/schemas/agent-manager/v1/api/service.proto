  // When true, overwrite an existing profile row with the supplied defaults
  // on every dispatch. Use this when the caller treats its code-declared
  // profile as authoritative; otherwise the existing row wins and the
  // `defaults` field is only consulted on first creation.
  bool update_existing = 3;
}

// CreateRunRequest starts a new run.
message CreateRunRequest {
  // Task ID to execute.
  // @format uuid
  string task_id = 1 [(buf.validate.field).string.uuid = true];

  // Profile ID to use (optional if inline_config provided).
  // @format uuid
  optional string agent_profile_id = 2;

  // Custom tag for the run.
  // Defaults to run ID if not specified.
  optional string tag = 3;

  // Execution mode.
  optional RunMode run_mode = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // Inline configuration overrides (applied only when fields are set).
  optional RunConfigOverrides inline_config = 5;

  // Bypass capacity limits.
  bool force = 6;

  // Idempotency key for replay safety.
  optional string idempotency_key = 7;

  // Profile reference for key-based resolution (optional).
  optional ProfileRef profile_ref = 8;

  // Optional prompt override for this run.
  // If omitted, the task description is used.
  optional string prompt = 9;

  // Reuse an existing sandbox for this run (sandboxed mode only).
  // @format uuid
  optional string existing_sandbox_id = 10;

  // Custom environment variables injected into the agent process.
  // Keys must start with "VROOLI_" prefix. Merged with sandbox env vars;
  // sandbox variables take precedence on conflict.
  map<string, string> environment = 11;

  // Conversation/parent linking per Decision D7 of the auditability
  // contract. Spawn surfaces SHOULD populate these explicitly so
  // provenance readers can group by conversation without reverse-walking
  // the run graph. When parent_run_id is set and conversation_id is empty,
  // agent-manager inherits the parent's conversation_id; when both are
  // empty, agent-manager mints a fresh UUID.
  optional string conversation_id = 12;
  // @format uuid
  optional string parent_run_id = 13;

  // Substrate to drive the agent CLI (codec-pipe vs interactive web-console
  // session). Omitted defaults to codec-pipe. Interactive mode is rejected for
  // protected (sandboxed) runs at run-validation time with a clear error.
  optional ExecutionMode execution_mode = 14 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

