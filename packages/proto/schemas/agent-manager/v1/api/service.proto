syntax = "proto3";

package agent_manager.v1;

import "agent-manager/v1/domain/events.proto";
import "agent-manager/v1/domain/profile.proto";
import "agent-manager/v1/domain/run.proto";
import "agent-manager/v1/domain/task.proto";
import "agent-manager/v1/domain/types.proto";
import "agent-manager/v1/domain/workflow.proto";
import "buf/validate/validate.proto";
import "common/v1/types.proto";
import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/agent-manager/v1/api;api";

// =============================================================================
// AGENT MANAGER API SERVICE
// =============================================================================
//
// @layer 3
// @domain agent-manager
// @imports common, domain/*
// @stability experimental
//
// gRPC service definition for Agent Manager operations.
// Defines CRUD operations for profiles, tasks, and runs, plus execution control.
//
// This service is designed for both:
//   - gRPC clients: Native protobuf communication
//   - REST clients: HTTP/JSON via grpc-gateway annotations
//
// USAGE CONTEXTS:
//   - Scenario Integration: Other scenarios creating and monitoring runs
//   - UI: Dashboard, profile management, run monitoring
//   - CLI: Headless agent execution and status checking
//   - Automation: CI/CD pipelines, batch processing
//
// =============================================================================

// AgentManagerService provides agent orchestration and lifecycle management.
//
// Enables scenarios to create tasks, configure agent profiles, start runs,
// monitor progress, and manage approval workflows.
service AgentManagerService {
  // ==========================================================================
  // HEALTH
  // ==========================================================================

  // Health returns the service health status.
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {get: "/health"};
  }

  // ==========================================================================
  // PROFILES
  // ==========================================================================

  // CreateProfile creates a new agent profile.
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse) {
    option (google.api.http) = {
      post: "/api/v1/profiles"
      body: "*"
    };
  }

  // EnsureProfile resolves a profile by key, creating it with defaults if needed.
  rpc EnsureProfile(EnsureProfileRequest) returns (EnsureProfileResponse) {
    option (google.api.http) = {
      post: "/api/v1/profiles/ensure"
      body: "*"
    };
  }

  // ReconcileScenarioProfiles resolves all profile sources declared by a scenario.
  rpc ReconcileScenarioProfiles(ReconcileScenarioProfilesRequest) returns (ReconcileScenarioProfilesResponse) {
    option (google.api.http) = {
      post: "/api/v1/profiles/reconcile-scenario"
      body: "*"
    };
  }

  // ValidateWorkflow validates and canonicalizes one workflow without writes.
  rpc ValidateWorkflow(ValidateWorkflowRequest) returns (ValidateWorkflowResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflows/validate"
      body: "*"
    };
  }

  // ReconcileScenarioWorkflows atomically reloads scenario-owned sources.
  rpc ReconcileScenarioWorkflows(ReconcileScenarioWorkflowsRequest) returns (ReconcileScenarioWorkflowsResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflows/reconcile-scenario"
      body: "*"
    };
  }

  // PlanScenarioWorkflows validates every source but never changes the catalog.
  rpc PlanScenarioWorkflows(ReconcileScenarioWorkflowsRequest) returns (ReconcileScenarioWorkflowsResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflows/plan"
      body: "*"
    };
  }

  // ReconcileScenarioDeclarations reconciles a scenario's unified declaration
  // block (profiles and workflows) in one call, fanning out per source by
  // schemaVersion while preserving each kind's lifecycle semantics.
  rpc ReconcileScenarioDeclarations(ReconcileScenarioDeclarationsRequest) returns (ReconcileScenarioDeclarationsResponse) {
    option (google.api.http) = {
      post: "/api/v1/declarations/reconcile-scenario"
      body: "*"
    };
  }

  // PlanScenarioDeclarations validates every declaration source but never
  // changes profile or workflow state.
  rpc PlanScenarioDeclarations(ReconcileScenarioDeclarationsRequest) returns (ReconcileScenarioDeclarationsResponse) {
    option (google.api.http) = {
      post: "/api/v1/declarations/plan"
      body: "*"
    };
  }

  rpc ListWorkflowRevisions(ListWorkflowRevisionsRequest) returns (ListWorkflowRevisionsResponse) {
    option (google.api.http) = {get: "/api/v1/workflows"};
  }

  rpc GetWorkflowRevision(GetWorkflowRevisionRequest) returns (GetWorkflowRevisionResponse) {
    option (google.api.http) = {get: "/api/v1/workflows/{key}"};
  }

  rpc ReloadScenarioWorkflows(ReconcileScenarioWorkflowsRequest) returns (ReconcileScenarioWorkflowsResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflows/reload"
      body: "*"
    };
  }

  rpc ExplainWorkflow(GetWorkflowRevisionRequest) returns (GetWorkflowRevisionResponse) {
    option (google.api.http) = {get: "/api/v1/workflows/{key}/explain"};
  }

  rpc StartWorkflowExecution(StartWorkflowExecutionRequest) returns (WorkflowExecutionResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflow-executions"
      body: "*"
    };
  }

  // ListWorkflowExecutions returns bounded, metadata-only execution history.
  rpc ListWorkflowExecutions(ListWorkflowExecutionsRequest) returns (ListWorkflowExecutionsResponse) {
    option (google.api.http) = {get: "/api/v1/workflow-executions"};
  }

  rpc GetWorkflowExecution(GetWorkflowExecutionRequest) returns (WorkflowExecutionResponse) {
    option (google.api.http) = {get: "/api/v1/workflow-executions/{execution_id}"};
  }

  // GetWorkflowExecutionResult is the explicit payload-bearing inspection path.
  rpc GetWorkflowExecutionResult(GetWorkflowExecutionResultRequest) returns (WorkflowExecutionResponse) {
    option (google.api.http) = {get: "/api/v1/workflow-executions/{execution_id}/result"};
  }

  rpc AdvanceWorkflowExecution(GetWorkflowExecutionRequest) returns (WorkflowExecutionResponse) {
    option (google.api.http) = {post: "/api/v1/workflow-executions/{execution_id}/advance"};
  }

  // WaitWorkflowExecution long-polls until the execution is terminal or the
  // deadline passes. Canceling the waiter never cancels the execution.
  rpc WaitWorkflowExecution(WaitWorkflowExecutionRequest) returns (WaitWorkflowExecutionResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflow-executions/{execution_id}/wait"
      body: "*"
    };
  }

  rpc GetWorkflowExecutionTrace(GetWorkflowExecutionTraceRequest) returns (GetWorkflowExecutionTraceResponse) {
    option (google.api.http) = {get: "/api/v1/workflow-executions/{execution_id}/trace"};
  }

  // ListWorkflowExecutionRuns projects durable node attempts for one execution.
  // Consumers use it instead of scanning a full trace to find dispatched Runs.
  rpc ListWorkflowExecutionRuns(ListWorkflowExecutionRunsRequest) returns (ListWorkflowExecutionRunsResponse) {
    option (google.api.http) = {get: "/api/v1/workflow-executions/{execution_id}/runs"};
  }

  rpc SignalWorkflowExecution(SignalWorkflowExecutionRequest) returns (WorkflowExecutionOperationResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflow-executions/{execution_id}/signals"
      body: "*"
    };
  }

  rpc CancelWorkflowExecution(WorkflowExecutionOperationRequest) returns (WorkflowExecutionOperationResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflow-executions/{execution_id}/cancel"
      body: "*"
    };
  }

  rpc RetryWorkflowExecution(WorkflowExecutionOperationRequest) returns (WorkflowExecutionOperationResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflow-executions/{execution_id}/retry"
      body: "*"
    };
  }

  rpc ResumeWorkflowExecution(WorkflowExecutionOperationRequest) returns (WorkflowExecutionOperationResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflow-executions/{execution_id}/resume"
      body: "*"
    };
  }

  rpc SimulateWorkflow(SimulateWorkflowRequest) returns (SimulateWorkflowResponse) {
    option (google.api.http) = {
      post: "/api/v1/workflows/simulate"
      body: "*"
    };
  }

  // GetProfile retrieves a profile by ID.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option (google.api.http) = {get: "/api/v1/profiles/{profile_id}"};
  }

  // ListProfiles returns all agent profiles.
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse) {
    option (google.api.http) = {get: "/api/v1/profiles"};
  }

  // UpdateProfile updates an existing profile.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {
    option (google.api.http) = {
      put: "/api/v1/profiles/{profile_id}"
      body: "*"
    };
  }

  // DeleteProfile removes a profile.
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse) {
    option (google.api.http) = {delete: "/api/v1/profiles/{profile_id}"};
  }

  // ==========================================================================
  // TASKS
  // ==========================================================================

  // CreateTask creates a new task.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {
    option (google.api.http) = {
      post: "/api/v1/tasks"
      body: "*"
    };
  }

  // GetTask retrieves a task by ID.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option (google.api.http) = {get: "/api/v1/tasks/{task_id}"};
  }

  // ListTasks returns all tasks with optional filtering.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (google.api.http) = {get: "/api/v1/tasks"};
  }

  // UpdateTask updates an existing task.
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {
    option (google.api.http) = {
      put: "/api/v1/tasks/{task_id}"
      body: "*"
    };
  }

  // DeleteTask permanently removes a cancelled task.
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse) {
    option (google.api.http) = {delete: "/api/v1/tasks/{task_id}"};
  }

  // CancelTask cancels a queued or running task.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse) {
    option (google.api.http) = {post: "/api/v1/tasks/{task_id}/cancel"};
  }

  // ==========================================================================
  // RUNS
  // ==========================================================================

  // CreateRun starts a new run for a task.
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse) {
    option (google.api.http) = {
      post: "/api/v1/runs"
      body: "*"
    };
  }

  // GetRun retrieves a run by ID.
  rpc GetRun(GetRunRequest) returns (GetRunResponse) {
    option (google.api.http) = {get: "/api/v1/runs/{run_id}"};
  }

  // GetRunReport returns the bounded diagnostic projection used by CLI, UI,
  // and investigation workflows. Bulk payloads remain on their dedicated
  // progressive-disclosure endpoints.
  rpc GetRunReport(GetRunReportRequest) returns (RunReport) {
    option (google.api.http) = {get: "/api/v1/runs/{run_id}/report"};
  }

  // GetRunByTag retrieves a run by its custom tag.
  rpc GetRunByTag(GetRunByTagRequest) returns (GetRunByTagResponse) {
    option (google.api.http) = {get: "/api/v1/runs/tag/{tag}"};
  }

  // ListRuns returns runs with optional filtering.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (google.api.http) = {get: "/api/v1/runs"};
  }

  // DeleteRun permanently removes a run.
  rpc DeleteRun(DeleteRunRequest) returns (DeleteRunResponse) {
    option (google.api.http) = {delete: "/api/v1/runs/{run_id}"};
  }

  // StopRun stops a running run.
  rpc StopRun(StopRunRequest) returns (StopRunResponse) {
    option (google.api.http) = {post: "/api/v1/runs/{run_id}/stop"};
  }

  // StopRunByTag stops a run identified by its custom tag.
  rpc StopRunByTag(StopRunByTagRequest) returns (StopRunByTagResponse) {
    option (google.api.http) = {post: "/api/v1/runs/tag/{tag}/stop"};
  }

  // StopAllRuns stops all running runs, optionally filtered by tag prefix.
  rpc StopAllRuns(StopAllRunsRequest) returns (StopAllRunsResponse) {
    option (google.api.http) = {
      post: "/api/v1/runs/stop-all"
      body: "*"
    };
  }

  // QuiesceScenario drains in-flight runs targeting a scenario so a Baseline
  // Modes promote can re-point and restart its live instance without killing
  // in-flight agent work.
  rpc QuiesceScenario(QuiesceScenarioRequest) returns (QuiesceScenarioResponse) {
    option (google.api.http) = {
      post: "/api/v1/runs/quiesce"
      body: "*"
    };
  }

  // RecoverRun drains a durable transcript and reconciles the run outcome.
  rpc RecoverRun(RecoverRunRequest) returns (RecoverRunResponse) {
    option (google.api.http) = {post: "/api/v1/runs/{run_id}/recover"};
  }

  // ==========================================================================
  // RUN EVENTS
  // ==========================================================================

  // GetRunEvents returns the event stream for a run.
  rpc GetRunEvents(GetRunEventsRequest) returns (GetRunEventsResponse) {
    option (google.api.http) = {get: "/api/v1/runs/{run_id}/events"};
  }

  // GetRunDiff returns the diff for a sandboxed run.
  rpc GetRunDiff(GetRunDiffRequest) returns (GetRunDiffResponse) {
    option (google.api.http) = {get: "/api/v1/runs/{run_id}/diff"};
  }

  // ==========================================================================
  // APPROVAL WORKFLOW
  // ==========================================================================

  // ApproveRun approves and applies changes from a sandboxed run.
  rpc ApproveRun(ApproveRunRequest) returns (ApproveRunResponse) {
    option (google.api.http) = {
      post: "/api/v1/runs/{run_id}/approve"
      body: "*"
    };
  }

  // RejectRun rejects and discards changes from a sandboxed run.
  rpc RejectRun(RejectRunRequest) returns (RejectRunResponse) {
    option (google.api.http) = {
      post: "/api/v1/runs/{run_id}/reject"
      body: "*"
    };
  }

  // ==========================================================================
  // RUNNERS
  // ==========================================================================

  // GetRunnerStatus returns status of all runners.
  rpc GetRunnerStatus(GetRunnerStatusRequest) returns (GetRunnerStatusResponse) {
    option (google.api.http) = {get: "/api/v1/runners"};
  }

  // ProbeRunner sends a test request to verify runner connectivity.
  rpc ProbeRunner(ProbeRunnerRequest) returns (ProbeRunnerResponse) {
    option (google.api.http) = {post: "/api/v1/runners/{runner_type}/probe"};
  }

  // GetRolePolicyStatus returns activation state and the latest diagnostic.
  rpc GetRolePolicyStatus(GetRolePolicyStatusRequest) returns (GetRolePolicyStatusResponse) {
    option (google.api.http) = {get: "/api/v1/role-policy/status"};
  }

  // GetRolePolicyCatalog returns the active, immutable declared catalog.
  rpc GetRolePolicyCatalog(GetRolePolicyCatalogRequest) returns (GetRolePolicyCatalogResponse) {
    option (google.api.http) = {get: "/api/v1/role-policy/catalog"};
  }

  // ValidateRolePolicyCatalog validates the configured catalog without activation.
  rpc ValidateRolePolicyCatalog(ValidateRolePolicyCatalogRequest) returns (ValidateRolePolicyCatalogResponse) {
    option (google.api.http) = {post: "/api/v1/role-policy/validate"};
  }

  // ReloadRolePolicyCatalog validates and atomically activates declared state.
  rpc ReloadRolePolicyCatalog(ReloadRolePolicyCatalogRequest) returns (ReloadRolePolicyCatalogResponse) {
    option (google.api.http) = {post: "/api/v1/role-policy/reload"};
  }

  // ExplainRolePolicy explains current profile resolution or a persisted run snapshot.
  rpc ExplainRolePolicy(ExplainRolePolicyRequest) returns (ExplainRolePolicyResponse) {
    option (google.api.http) = {
      post: "/api/v1/role-policy/explain"
      body: "*"
    };
  }

  // GetPermissionPolicyStatus returns desired-permission activation state and
  // the last persisted reconcile outcome.
  rpc GetPermissionPolicyStatus(GetPermissionPolicyStatusRequest) returns (GetPermissionPolicyStatusResponse) {
    option (google.api.http) = {get: "/api/v1/permission-policy/status"};
  }

  // GetPermissionPolicyCatalog returns the active portable desired state.
  rpc GetPermissionPolicyCatalog(GetPermissionPolicyCatalogRequest) returns (GetPermissionPolicyCatalogResponse) {
    option (google.api.http) = {get: "/api/v1/permission-policy/catalog"};
  }

  // ValidatePermissionPolicyCatalog validates declared state without activation.
  rpc ValidatePermissionPolicyCatalog(ValidatePermissionPolicyCatalogRequest) returns (ValidatePermissionPolicyCatalogResponse) {
    option (google.api.http) = {post: "/api/v1/permission-policy/validate"};
  }

  // ReloadPermissionPolicyCatalog validates and atomically activates declared state.
  rpc ReloadPermissionPolicyCatalog(ReloadPermissionPolicyCatalogRequest) returns (ReloadPermissionPolicyCatalogResponse) {
    option (google.api.http) = {post: "/api/v1/permission-policy/reload"};
  }

  // PlanPermissionPolicy reports resource-owned native projection drift.
  rpc PlanPermissionPolicy(PlanPermissionPolicyRequest) returns (PlanPermissionPolicyResponse) {
    option (google.api.http) = {post: "/api/v1/permission-policy/plan"};
  }

  // ReconcilePermissionPolicy applies one whole desired document through each
  // owning resource after an explicit human authorization signal.
  rpc ReconcilePermissionPolicy(ReconcilePermissionPolicyRequest) returns (ReconcilePermissionPolicyResponse) {
    option (google.api.http) = {
      post: "/api/v1/permission-policy/reconcile"
      body: "*"
    };
  }

  // DoctorPermissionPolicy summarizes catalog readiness and resource planning
  // without changing native resource files.
  rpc DoctorPermissionPolicy(DoctorPermissionPolicyRequest) returns (DoctorPermissionPolicyResponse) {
    option (google.api.http) = {post: "/api/v1/permission-policy/doctor"};
  }

  // ==========================================================================
  // MAINTENANCE
  // ==========================================================================

  // PurgeData deletes profiles, tasks, or runs matching a regex pattern.
  rpc PurgeData(PurgeDataRequest) returns (PurgeDataResponse) {
    option (google.api.http) = {
      post: "/api/v1/maintenance/purge"
      body: "*"
    };
  }
}

// =============================================================================
// HEALTH MESSAGES
// =============================================================================

// HealthRequest is empty - no parameters needed.
message HealthRequest {}

// HealthResponse is the agent-manager health endpoint contract.
//
// Kept service-local to satisfy RPC message linting while preserving the
// shared JSON shape exposed by /health.
message HealthResponse {
  // Overall service health status.
  common.v1.HealthStatus status = 1;
  // Identifier for the service reporting health.
  string service = 2;
  // RFC3339 timestamp when the check was produced.
  string timestamp = 3;
  // Readiness indicator for load balancers.
  bool readiness = 4;
  // Optional service version string.
  string version = 5;
  reserved 6, 7;
  reserved "dependencies_untyped", "metrics_untyped";
  // Status of downstream dependencies.
  map<string, common.v1.JsonValue> dependencies = 8;
  // Additional health metrics for monitoring.
  map<string, common.v1.JsonValue> metrics = 9;
}

// =============================================================================
// PROFILE MESSAGES
// =============================================================================

// CreateProfileRequest creates a new agent profile.
message CreateProfileRequest {
  // Profile data.
  AgentProfile profile = 1 [(buf.validate.field).required = true];
}

// CreateProfileResponse returns the created profile.
message CreateProfileResponse {
  // The created profile with generated ID.
  AgentProfile profile = 1;
}

// EnsureProfileRequest resolves a profile by key, creating it with defaults if needed.
message EnsureProfileRequest {
  // Stable profile key for lookup or creation.
  string profile_key = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];

  // Default profile settings to use if the profile does not exist.
  AgentProfile defaults = 2;

  // Update an existing profile with defaults (opt-in).
  bool update_existing = 3;
}

// EnsureProfileResponse returns the resolved profile and creation metadata.
message EnsureProfileResponse {
  // The resolved profile.
  AgentProfile profile = 1;

  // True if the profile was created during this call.
  bool created = 2;

  // True if the profile was updated during this call.
  bool updated = 3;
}

// ReconcileScenarioProfilesRequest reconciles profile sources declared by a scenario.
message ReconcileScenarioProfilesRequest {
  // Scenario slug whose service manifest declares agent-manager profile sources.
  string scenario = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];

  // When true, validates and reports actions without writing to the database.
  bool dry_run = 2;
}

// ProfileReconcileStatus classifies the reconciliation result for one profile.
enum ProfileReconcileStatus {
  PROFILE_RECONCILE_STATUS_UNSPECIFIED = 0;
  PROFILE_RECONCILE_STATUS_CREATED = 1;
  PROFILE_RECONCILE_STATUS_UPDATED = 2;
  PROFILE_RECONCILE_STATUS_UNCHANGED = 3;
  PROFILE_RECONCILE_STATUS_SKIPPED = 4;
  PROFILE_RECONCILE_STATUS_CONFLICTED_LOCAL_OVERRIDE = 5;
  PROFILE_RECONCILE_STATUS_FAILED_VALIDATION = 6;
}

// ProfileReconcileResult reports the outcome for one source profile.
message ProfileReconcileResult {
  string profile_key = 1;
  string source_path = 2;
  string source_hash = 3;
  string profile_id = 4;
  ProfileReconcileStatus status = 5;
  string message = 6;
  repeated WorkflowDiagnostic diagnostics = 7;
}

// ReconcileScenarioProfilesResponse returns the full scenario reconciliation report.
message ReconcileScenarioProfilesResponse {
  string scenario = 1;
  repeated ProfileReconcileResult results = 2;
  int32 created = 3;
  int32 updated = 4;
  int32 unchanged = 5;
  int32 skipped = 6;
  int32 conflicted = 7;
  int32 failed = 8;
  bool dry_run = 9;
}

message ValidateWorkflowRequest {
  google.protobuf.Struct definition = 1 [(buf.validate.field).required = true];
}

message ValidateWorkflowResponse {
  bool valid = 1;
  string digest = 2;
  google.protobuf.Struct definition = 3;
  repeated WorkflowDiagnostic diagnostics = 4;
}

message ReconcileScenarioWorkflowsRequest {
  string scenario = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  bool dry_run = 2;
  bool validate_only = 3;
}

enum WorkflowReconcileStatus {
  WORKFLOW_RECONCILE_STATUS_UNSPECIFIED = 0;
  WORKFLOW_RECONCILE_STATUS_CREATED = 1;
  WORKFLOW_RECONCILE_STATUS_ACTIVATED = 2;
  WORKFLOW_RECONCILE_STATUS_UNCHANGED = 3;
  WORKFLOW_RECONCILE_STATUS_SKIPPED = 4;
  WORKFLOW_RECONCILE_STATUS_FAILED_VALIDATION = 5;
}

message WorkflowReconcileResult {
  string workflow_key = 1;
  string version = 2;
  string digest = 3;
  string source_path = 4;
  WorkflowReconcileStatus status = 5;
  string message = 6;
  repeated WorkflowDiagnostic diagnostics = 7;
}

message ReconcileScenarioWorkflowsResponse {
  string scenario = 1;
  repeated WorkflowReconcileResult results = 2;
  int32 created = 3;
  int32 activated = 4;
  int32 unchanged = 5;
  int32 skipped = 6;
  int32 failed = 7;
  bool dry_run = 8;
  bool validate_only = 9;
}

// ReconcileScenarioDeclarationsRequest reconciles a scenario's unified
// declaration block (profiles and workflows) in one call.
message ReconcileScenarioDeclarationsRequest {
  string scenario = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  bool dry_run = 2;
  bool validate_only = 3;
}

// ReconcileScenarioDeclarationsResponse aggregates the per-kind reconciliation
// outcomes; the legacy profile/workflow responses project their halves from it.
message ReconcileScenarioDeclarationsResponse {
  string scenario = 1;
  repeated ProfileReconcileResult profile_results = 2;
  repeated WorkflowReconcileResult workflow_results = 3;
  int32 profiles_created = 4;
  int32 profiles_updated = 5;
  int32 profiles_unchanged = 6;
  int32 profiles_skipped = 7;
  int32 profiles_conflicted = 8;
  int32 profiles_failed = 9;
  int32 workflows_created = 10;
  int32 workflows_activated = 11;
  int32 workflows_unchanged = 12;
  int32 workflows_skipped = 13;
  int32 workflows_failed = 14;
  bool dry_run = 15;
  bool validate_only = 16;
}

message ListWorkflowRevisionsRequest {
  string owner = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string key = 2;
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
}

message ListWorkflowRevisionsResponse {
  repeated WorkflowRevision revisions = 1;
}

message GetWorkflowRevisionRequest {
  string owner = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string key = 2;
  string digest = 3;
}

message GetWorkflowRevisionResponse {
  WorkflowRevision revision = 1;
}

message StartWorkflowExecutionRequest {
  string owner = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string workflow_key = 2;
  string definition_digest = 3;
  google.protobuf.Value input = 4 [(buf.validate.field).required = true];
  string idempotency_key = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
}

message GetWorkflowExecutionRequest {
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetWorkflowExecutionResultRequest {
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
  // The dedicated RPC still requires an explicit caller assertion so routine
  // tooling cannot reveal workflow input or output accidentally.
  bool explicitly_authorized = 2;
}

