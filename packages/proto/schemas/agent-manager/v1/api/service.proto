  PermissionPolicyMatcher matcher = 3;
  string rationale = 4;
  string owner = 5;
  string target_scope = 6;
  bool requires_hard_enforcement = 7;
}

message PermissionPolicyCatalog {
  int32 schema_version = 1;
  PermissionPolicyCatalogMetadata metadata = 2;
  repeated string target_scopes = 3;
  repeated PermissionPolicyRule rules = 4;
}

message PermissionPolicyEnforcement {
  string permissions = 1;
  repeated string caveats = 2;
}

message PermissionPolicyResourceResult {
  RunnerType runner_type = 1;
  string scope = 2;
  bool installed = 3;
  string status = 4;
  string error = 5;
  string desired_digest = 6;
  string desired_fingerprint = 7;
  string live_fingerprint = 8;
  bool drift = 9;
  repeated string changes = 10;
  repeated string native_paths = 11;
  PermissionPolicyEnforcement enforcement = 12;
  repeated PermissionPolicyMatcher unsupported_matchers = 13;
}

message PermissionPolicyPlan {
  string catalog_digest = 1;
  repeated PermissionPolicyResourceResult resources = 2;
  bool hard_enforcement_satisfied = 3;
  repeated string missing_hard_enforcement_rule_ids = 4;
}

message PermissionPolicyReconcileResult {
  string catalog_digest = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  bool explicitly_authorized = 4;
  bool success = 5;
  bool hard_enforcement_satisfied = 6;
  repeated string missing_hard_enforcement_rule_ids = 7;
  repeated PermissionPolicyResourceResult resources = 8;
}

message GetPermissionPolicyStatusRequest {}

message GetPermissionPolicyStatusResponse {
  PermissionPolicyStatus status = 1;
  PermissionPolicyReconcileResult last_reconcile = 2;
}

message GetPermissionPolicyCatalogRequest {}

message GetPermissionPolicyCatalogResponse {
  PermissionPolicyStatus status = 1;
  PermissionPolicyCatalog catalog = 2;
}

message ValidatePermissionPolicyCatalogRequest {}

message ValidatePermissionPolicyCatalogResponse {
  bool valid = 1;
  string candidate_digest = 2;
  string active_digest = 3;
  PermissionPolicyDiagnostic diagnostic = 4;
}

message ReloadPermissionPolicyCatalogRequest {}

message ReloadPermissionPolicyCatalogResponse {
  bool activated = 1;
  PermissionPolicyStatus status = 2;
  PermissionPolicyDiagnostic diagnostic = 3;
}

message PlanPermissionPolicyRequest {}

message PlanPermissionPolicyResponse {
  PermissionPolicyPlan plan = 1;
}

message ReconcilePermissionPolicyRequest {
  bool explicitly_authorized = 1;
}

message ReconcilePermissionPolicyResponse {
  PermissionPolicyReconcileResult result = 1;
}

message DoctorPermissionPolicyRequest {}

message DoctorPermissionPolicyResponse {
  PermissionPolicyStatus status = 1;
  PermissionPolicyPlan plan = 2;
  bool healthy = 3;
  string summary = 4;
}

// =============================================================================
// MAINTENANCE MESSAGES
// =============================================================================

// PurgeTarget identifies which entities to purge.
enum PurgeTarget {
  PURGE_TARGET_UNSPECIFIED = 0;
  PURGE_TARGET_PROFILES = 1;
  PURGE_TARGET_TASKS = 2;
  PURGE_TARGET_RUNS = 3;
}

// PurgeDataRequest requests a purge by regex pattern.
message PurgeDataRequest {
  // Regex pattern to match.
  string pattern = 1 [(buf.validate.field).string.min_len = 1];

  // Targets to purge.
  repeated PurgeTarget targets = 2 [(buf.validate.field).repeated.min_items = 1];

  // When true, only returns counts without deleting.
  bool dry_run = 3;
}

// PurgeCounts reports how many items were matched/deleted.
message PurgeCounts {
  int32 profiles = 1;
  int32 tasks = 2;
  int32 runs = 3;
}

// PurgeDataResponse returns purge counts.
message PurgeDataResponse {
  // Counts that match the pattern.
  PurgeCounts matched = 1;

  // Counts deleted (zero when dry_run=true).
  PurgeCounts deleted = 2;

  // Echoes dry_run for clarity.
  bool dry_run = 3;
}
