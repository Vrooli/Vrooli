syntax = "proto3";

package vrooli.typescript_code_graph.v1.errors;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/typescript-code-graph/v1/errors;errors_v1";

// =============================================================================
// ERROR ENVELOPES — typed payloads for product errors
// =============================================================================
//
// @layer 5  (api surface)
// @domain errors
// @stability stable
//
// Connect-RPC methods use Connect's canonical error envelope and code
// set; these typed payloads ride as `details` so callers can switch on
// `kind` without parsing free-form messages. REST exceptions (only
// /health today) return ErrorEnvelope.
//
// kind values are short snake_case strings; add new values by
// extending the documented list below. The wire format never changes.
// =============================================================================

// ErrorEnvelope is the canonical non-Connect (REST exception) error body.
message ErrorEnvelope {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// ExtractError describes a typed failure from the graph extraction path.
//
// kind values:
//   - "no_tsconfig_found"        project_path has no resolvable tsconfig.json
//   - "multiple_tsconfig_files"  ambiguity at the same level; consumer must
//                                point at one
//   - "workspace_unsupported"    pnpm workspace detected; P2
//   - "path_unreadable"          project_path can't be read by the API process
//   - "parse_failure"            ts-morph could not parse any source file
//                                (catastrophic; partial-graph warnings stay
//                                inline on ExtractResponse)
//   - "internal"                 unexpected
message ExtractError {
  string kind = 1;
  string message = 2;
  // Optional file path the error relates to, when applicable.
  string file_path = 3;
}

// RewriteError describes a typed failure from the rewrite path.
//
// kind values:
//   - "plan_not_found"           plan_id missing from store (expired or never
//                                registered)
//   - "project_mismatch"         apply called with a different project_path
//                                than the original plan
//   - "operation_unsupported"    operation type not implemented in v1
//   - "operation_failed"         a single operation failed during apply (per-op
//                                detail surfaced via OperationResult)
//   - "internal"                 unexpected
message RewriteError {
  string kind = 1;
  string message = 2;
  // The plan_id this error relates to, when applicable.
  string plan_id = 3;
}

// SidecarError describes a typed failure from the Node sidecar.
//
// kind values:
//   - "unavailable"              sidecar process is down / restarting
//   - "permanently_unhealthy"    backoff budget exhausted; supervisor gave up
//   - "timeout"                  IPC deadline exceeded
//   - "version_mismatch"         handshake rejected
//   - "internal"                 unexpected sidecar exception
message SidecarError {
  string kind = 1;
  string message = 2;
  // The sidecar's request_id for the failed call, if one was assigned.
  string request_id = 3;
}
