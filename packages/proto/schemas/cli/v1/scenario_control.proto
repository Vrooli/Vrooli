syntax = "proto3";

package vrooli.cli.v1;

import "cli/v1/scenario_list.proto";
import "cli/v1/scenario_status.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/cli/v1;cliv1";

// Typed control-plane surface consumed by program-runtime. The request
// messages deliberately stay small and reuse the established scenario output
// contracts rather than creating a parallel lifecycle model.
message ListScenariosRequest {
  bool include_ports = 1;
}

message GetScenarioStatusRequest {
  string name = 1;
}

message GetScenarioLogsRequest {
  string name = 1;
  int32 tail_lines = 2;
}

message StartScenarioRequest {
  string name = 1;
  int32 timeout_seconds = 2;
}

message StopScenarioRequest {
  string name = 1;
}

message RestartScenarioRequest {
  string name = 1;
  int32 timeout_seconds = 2;
}

message SetupScenarioRequest {
  string name = 1;
}

service ScenarioControlPlaneService {
  rpc ListScenarios(ListScenariosRequest) returns (ScenarioListResponse);
  rpc GetScenarioStatus(GetScenarioStatusRequest) returns (ScenarioStatusSingle);
  rpc GetScenarioLogs(GetScenarioLogsRequest) returns (ScenarioLogsResponse);
  rpc StartScenario(StartScenarioRequest) returns (ScenarioLifecycleResponse);
  rpc StopScenario(StopScenarioRequest) returns (ScenarioLifecycleResponse);
  rpc RestartScenario(RestartScenarioRequest) returns (ScenarioLifecycleResponse);
  rpc SetupScenario(SetupScenarioRequest) returns (ScenarioSetupResponse);
}
