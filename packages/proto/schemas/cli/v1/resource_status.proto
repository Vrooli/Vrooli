syntax = "proto3";

package vrooli.cli.v1;

import "cli/v1/common.proto";
import "cli/v1/resource_list.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/cli/v1;cliv1";

// =============================================================================
// VROOLI CLI — resource status/info output contracts
// =============================================================================
//
// @stability experimental
//
// Canonical wire shapes of `vrooli resource status [--json]` (single + fleet
// forms) and `vrooli resource info --json`. Marshaled with protojson
// (UseProtoNames=true, EmitUnpopulated=true). All messages are prefixed
// `Resource*` so they stay globally unique within the shared cliv1 package.
// Reuses the existing cliv1.Resource (resource_list.proto) and
// cliv1.DiscoveryFailure (common.proto) messages.
// =============================================================================

// ResourceStatus is one resource's runtime status (control.Status). It embeds
// the catalog Resource under the `resource` field, mirroring the internal
// `resources.Status` struct.
message ResourceStatus {
  // Catalog entry for the resource (reused cliv1.Resource message).
  Resource resource = 1;

  // True when the resource is installed on disk.
  bool installed = 2;

  // True when the resource is currently running.
  bool running = 3;

  // Tri-state health probe result (bool when evaluated, null when not). Backs
  // the internal *bool `healthy`; producer maps via structpb.NewValue(*v), nil->null.
  google.protobuf.Value healthy = 4;

  // Free-form health detail string; empty when unset.
  string health = 5;

  // Machine-readable status code (e.g. "ok", "unavailable", "timeout"); empty if unset.
  string status_code = 6;

  // Human-readable status message; empty if unset.
  string message = 7;

  // Probe error detail; empty unless a probe failed.
  string probe_error = 8;

  // Raw driver status payload as returned by the driver; null/absent when none.
  // Backs the internal json.RawMessage `raw` field.
  google.protobuf.Value raw = 9;
}

// ResourceStatusesResponse is the fleet form of `resource status --json`
// (envelope from WriteSuccessFields: success + resources + discovery_failures).
message ResourceStatusesResponse {
  // True when status enumeration completed; standard CLI success envelope.
  bool success = 1;

  // Per-resource runtime status, ordered as enumerated.
  repeated ResourceStatus resources = 2;

  // Resources skipped due to discovery errors; empty on a clean sweep.
  repeated DiscoveryFailure discovery_failures = 3;
}

// ResourceStatusResponse is the single-resource form of `resource status --json`
// (envelope from WriteSuccessFields: success + flattened convenience fields +
// the full resource status).
message ResourceStatusResponse {
  // True when the status was resolved; standard CLI success envelope.
  bool success = 1;

  // Resource slug (mirrors resource.resource.name for convenience).
  string name = 2;

  // True when the resource is installed (mirror of resource.installed).
  bool installed = 3;

  // True when the resource is running (mirror of resource.running).
  bool running = 4;

  // Tri-state health probe result (mirror of resource.healthy); bool when
  // evaluated, null when not. Backs the internal *bool; nil->null.
  google.protobuf.Value healthy = 5;

  // Human-readable status message (mirror of resource.message); empty if unset.
  string status = 6;

  // Full resource runtime status record.
  ResourceStatus resource = 7;
}

// ResourceInfoResponse is the shape of `vrooli resource info --json`
// (WriteSuccessJSON with key "resource"): success + the full status record.
message ResourceInfoResponse {
  // True when the resource info was resolved; standard CLI success envelope.
  bool success = 1;

  // Full resource runtime status record.
  ResourceStatus resource = 2;
}
