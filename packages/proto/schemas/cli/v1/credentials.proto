syntax = "proto3";

package vrooli.cli.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/cli/v1;cliv1";

// =============================================================================
// VROOLI CLI — credentials output contracts
// =============================================================================
//
// @stability experimental
//
// Credential command payloads intentionally contain status, presence, and
// recovery metadata only. No message in this file has a field for a secret,
// passphrase, private key, or credential value.
//
// The payload member retains the established address-shaped JSON object while
// the command boundary migrates legacy status structures to protobuf-backed
// output. New fields must remain additive and must not carry secret material.
// =============================================================================

message CliCredentialList {
  string inventory_basis = 1;
  bool managed_instances_included = 2;
  int32 credential_count = 3;
  int32 declaration_site_count = 4;
  repeated string uncovered = 5;
  repeated string required_absent = 6;
  repeated CliCredentialEntry credentials = 7;
}

message CliCredentialStatus {
  string checked_at = 1;
  bool configured = 2;
  string field = 3;
  string identity = 4;
  string provider = 5;
  string provider_state = 6;
}

message CliCredentialEntry {
  string resource = 1;
  string env = 2;
  string logical_id = 3;
  string field = 4;
  string label = 5;
  string description = 6;
  string provisioning = 7;
  string derived_from = 8;
  bool required = 9;
  bool configured = 10;
  string state = 11;
  string remediation = 12;
}

message CliCredentialDoctor {
  google.protobuf.Struct payload = 1;
}

message CliCredentialStoreStatus {
  google.protobuf.Struct payload = 1;
}

message CliCredentialKeyringStatus {
  google.protobuf.Struct payload = 1;
}

message CliCredentialRecovery {
  google.protobuf.Struct payload = 1;
}

message CliBreakGlassStatus {
  string account_id = 1;
  string audience = 2;
  bool complete = 3;
  bool metadata = 4;
  int64 provisioned_at = 5;
  bool public = 6;
  repeated string scopes = 7;
  bool wrapped_private = 8;
}
