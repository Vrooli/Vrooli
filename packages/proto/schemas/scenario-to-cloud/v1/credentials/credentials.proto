syntax = "proto3";

package vrooli.scenario_to_cloud.v1.credentials;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/scenario-to-cloud/v1/credentials;credentialsv1";

// =============================================================================
// CREDENTIALS — versioned credential bindings, rotation, revocation, recovery
// =============================================================================
//
// @stability beta
//
// A CredentialBinding ties one exact credential-authority descriptor
// (`logical_id:field`, preserved byte-for-byte from the closure) to one
// deployment. It references versions and consumers; no message in this file
// ever carries a credential value on the way out. The only inbound value
// fields are RotateCredentialRequest.value (an operator-supplied
// replacement for an external credential) and
// RecoverCredentialsRequest.passphrase; both are kept in memory by the
// server and never persisted, logged or echoed.
//
// A CredentialOperation is the durable lifecycle record. Its state follows
// design section I of the certification plan:
//   planned -> new_version_created -> provider_prepared -> consumers_updated
//   -> verified -> old_version_revoked -> complete, with recovering -> failed,
//   pending_operator_input for providers without a revocation API, and
//   revocation_incomplete for a revoke whose target was not reached.
// A non-terminal state is truthful: `unreached` names what is outstanding.
//
// USAGE CONTEXTS:
//   - api/credentialsvc: Connect handler beside the REST routes
//     GET  /api/v1/deployments/{id}/credentials
//     POST /api/v1/deployments/{id}/credentials/{binding}/rotate
//     POST /api/v1/deployments/{id}/credentials/{binding}/revoke
//     POST /api/v1/deployments/{id}/credentials/{binding}/break-glass
//     POST /api/v1/deployments/{id}/credentials/recover
//     GET  /api/v1/deployments/{id}/credentials/rotations/{rotation}
//     POST /api/v1/deployments/{id}/credentials/rotations/{rotation}/resume
//   - ui: renders bindings, versions and operation standing (metadata only).
//
// =============================================================================

service CredentialsService {
  // ListBindings returns every binding of a deployment with its
  // acknowledgements. Metadata only.
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  // RotateCredential starts (or replays by request key) a versioned rotation
  // and runs it as far as it can. The response state names what remains.
  rpc RotateCredential(RotateCredentialRequest) returns (CredentialOperationResponse);
  // RevokeCredential purges the active version from the target and denies
  // further distribution; an unreachable target is revocation_incomplete.
  rpc RevokeCredential(RevokeCredentialRequest) returns (CredentialOperationResponse);
  // RecoverCredentials re-provisions a deployment's bindings onto a
  // replacement host from an encrypted recovery bundle already on that host.
  rpc RecoverCredentials(RecoverCredentialsRequest) returns (CredentialOperationResponse);
  // GetRotation reads one lifecycle operation.
  rpc GetRotation(GetRotationRequest) returns (CredentialOperationResponse);
  // ResumeRotation continues an operation waiting on an operator step, an
  // overlap window, missing acknowledgements or an unreachable target.
  rpc ResumeRotation(ResumeRotationRequest) returns (CredentialOperationResponse);
  // BreakGlass issues a scoped, time-bounded, audited emergency version whose
  // predecessor is revoked automatically once the window closes.
  rpc BreakGlass(BreakGlassRequest) returns (CredentialOperationResponse);
}

// CredentialDescriptor is the exact credential-authority address.
message CredentialDescriptor {
  string logical_id = 1;
  string field = 2;
}

// CredentialVersion identifies one materialised value without carrying it.
// content_ref is an opaque token minted with the version, never derived from
// the value.
message CredentialVersion {
  int64 number = 1;
  string content_ref = 2;
  google.protobuf.Timestamp created_at = 3;
}

// CredentialBinding is one descriptor bound to one deployment.
message CredentialBinding {
  string id = 1;
  string deployment_id = 2;
  CredentialDescriptor descriptor = 3;
  // generated_database_password | external_api_credential | signing_key |
  // machine_enrollment_credential | encryption_recovery_key |
  // shared_dependency_credential
  string class = 4;
  // Manifest secret class the first value came from.
  string source_class = 5;
  string target_type = 6;
  string target_name = 7;
  CredentialVersion version = 8;
  CredentialVersion previous_version = 9;
  repeated string consumer_refs = 10;
  string grant_ref = 11;
  // logical_id:field reference the backup domain resolves the key by; set
  // only on encryption/recovery-key bindings.
  string recovery_key_ref = 12;
  // planned | materialized | revoked
  string state = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// CredentialAck records that a consumer verified use of a version.
message CredentialAck {
  string binding_id = 1;
  string consumer = 2;
  int64 version = 3;
  google.protobuf.Timestamp verified_at = 4;
}

message BindingView {
  CredentialBinding binding = 1;
  repeated CredentialAck acks = 2;
}

message ListBindingsRequest {
  string deployment_id = 1;
}

message ListBindingsResponse {
  string schema_version = 1;
  repeated BindingView bindings = 2;
}

// ConsumerProgress is one consumer's standing within an operation.
message ConsumerProgress {
  string consumer = 1;
  // pending | updated | acknowledged | unreachable | failed
  string state = 2;
  int64 version = 3;
  string reason = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// Receipt is one auditable step; details are metadata only.
message Receipt {
  string step = 1;
  string state = 2;
  string outcome = 3;
  google.protobuf.Timestamp at = 4;
  string target_receipt_ref = 5;
  google.protobuf.Struct details = 6;
  repeated string limitations = 7;
}

// OperatorHandoff is the durable reference for a resumable operator step.
message OperatorHandoff {
  string reference = 1;
  string provider = 2;
  string instruction = 3;
  string resume_with = 4;
  google.protobuf.Timestamp requested_at = 5;
}

// BreakGlassWindow bounds an emergency access grant.
message BreakGlassWindow {
  string scope = 1;
  string operator = 2;
  google.protobuf.Timestamp issued_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  string predecessor_ref = 5;
  google.protobuf.Timestamp auto_revoked_at = 6;
  string confirmation_ref = 7;
}

message OperationError {
  string code = 1;
  string message = 2;
}

// CredentialOperation is one durable lifecycle operation.
message CredentialOperation {
  string id = 1;
  string deployment_id = 2;
  string binding_id = 3;
  // rotate | revoke | recover | break_glass
  string kind = 4;
  int64 from_version = 5;
  int64 to_version = 6;
  string state = 7;
  repeated ConsumerProgress consumers = 8;
  // Nodes or consumers an incomplete operation could not confirm.
  repeated string unreached = 9;
  OperatorHandoff pending_operator_input = 10;
  google.protobuf.Timestamp resume_after = 11;
  BreakGlassWindow break_glass = 12;
  repeated Receipt receipts = 13;
  OperationError error = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  google.protobuf.Timestamp completed_at = 17;
}

message CredentialOperationResponse {
  string schema_version = 1;
  CredentialOperation operation = 2;
}

message RotateCredentialRequest {
  string deployment_id = 1;
  string binding_id = 2;
  // Replacement value for external credential classes. Inbound only; the
  // server keeps it in memory and never persists, logs or echoes it.
  string value = 3;
  string request_key = 4;
}

message RevokeCredentialRequest {
  string deployment_id = 1;
  string binding_id = 2;
  string request_key = 3;
}

message RecoverCredentialsRequest {
  string deployment_id = 1;
  // Path of the encrypted recovery bundle on the replacement host.
  string bundle_ref = 2;
  // Inbound only; travels to the replacement host on standard input.
  string passphrase = 3;
  string request_key = 4;
}

message GetRotationRequest {
  string deployment_id = 1;
  string rotation_id = 2;
}

message ResumeRotationRequest {
  string deployment_id = 1;
  string rotation_id = 2;
  // True once the operator completed the handed-off provider step.
  bool operator_confirmed = 3;
}

message BreakGlassRequest {
  string deployment_id = 1;
  string binding_id = 2;
  string scope = 3;
  int64 window_seconds = 4;
  // Must equal "BREAK-GLASS <binding_id>".
  string confirmation = 5;
  string operator = 6;
  string request_key = 7;
}
