syntax = "proto3";

package vrooli.image_tools.v1.ai;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/image-tools/v1/ai;ai_v1";

// =============================================================================
// AI DOMAIN — generation & enhancement operations (model-backed, async)
// =============================================================================
//
// @stability alpha
//
// Wire contract for the core AI image operations (IMG-P0-002 generation/editing
// and IMG-P0-003 enhancement): text-to-image, image-to-image, inpaint, object
// removal, upscale, background removal, and denoise. Unlike the deterministic
// ops domain, these are heavy and model-backed — they run through a standalone
// (non-ComfyUI) backend selected by hardware-fit, fall back Local-GPU →
// Local-CPU → BYOK, and execute asynchronously on the durable job Manager's
// GPU-serialized lane.
//
// Transport split (see docs/concepts/ARCHITECTURE.md):
//   - DISCOVERY is Connect-RPC: AIService.ListAIOperations returns the op
//     catalog (which ops need an input image, which need a mask, which are
//     prompt-driven) so the CLI/UI can build their surfaces.
//   - EXECUTION is a REST multipart edge (RESTReasonMultipartUpload):
//     POST /api/v1/ai/{operation} accepts the optional input image (`file`
//     part) + optional `mask` part + the typed parameters (a `params` part
//     carrying AIParams as protojson). Image bytes cannot ride a proto field,
//     but the PARAMETERS stay proto-typed (AIParams) and the SUBMIT result is
//     proto-typed (SubmitAIResponse).
//
// Execution is ASYNC: the run edge SUBMITS a durable job and returns its id +
// ETA + the resolved model/tier immediately (no polling). Callers then block
// once on JobsService.WaitJob and fetch the output blob by the job's result
// ref. This mirrors the test-genie run-lifecycle philosophy and keeps a client
// disconnect from destroying in-flight GPU work.
//
// Consumed by:
//   - API: handlers/ai/connect_handler.go (ListAIOperations) +
//          handlers/ai/rest.go (the multipart submit edge).
//   - CLI: cli/domains/ai submits the run edge and waits via the jobs verbs.
//   - UI:  ui/src/api/ai.ts wraps the discovery client + the submit edge.
// =============================================================================

service AIService {
  // ListAIOperations returns the model-backed operation catalog (stable order)
  // with the input/parameter shape each op expects.
  rpc ListAIOperations(ListAIOperationsRequest) returns (ListAIOperationsResponse);
}

// AIOperationInfo describes one model-backed operation for discovery.
message AIOperationInfo {
  // Canonical operation name (e.g. "text_to_image"); the {operation} segment.
  string name = 1;
  // Grouping for UIs: "generation" or "enhancement".
  string category = 2;
  // One-line human summary.
  string summary = 3;
  // RequiresImage is true when the op edits an input image (false for pure
  // text-to-image generation).
  bool requires_image = 4;
  // RequiresMask is true when the op needs a mask image (inpaint/object_removal).
  bool requires_mask = 5;
  // PromptDriven is true when a text prompt is a primary input (generation/edit).
  bool prompt_driven = 6;
  // DefaultModelId is the seeded default model for this op (for display).
  string default_model_id = 7;
}

message ListAIOperationsRequest {}

message ListAIOperationsResponse {
  repeated AIOperationInfo operations = 1;
}

// =============================================================================
// Execution payloads (REST multipart edge)
// =============================================================================

// AIParams is the typed parameter envelope sent as the `params` multipart part
// (protojson). Fields are shared across the AI ops; each op reads the subset it
// supports (e.g. text_to_image ignores `strength`; upscale reads only `scale`).
// Unset numeric fields fall back to per-op defaults.
message AIParams {
  // Prompt is the positive text prompt (generation/edit ops).
  string prompt = 1;
  // NegativePrompt steers generation away from unwanted content.
  string negative_prompt = 2;
  // Seed pins the RNG for reproducibility; 0 means "random, report the seed used".
  int64 seed = 3;
  // Width/Height of the generated canvas in px (generation ops); 0 = model default.
  int32 width = 4;
  int32 height = 5;
  // Steps is the sampler iteration count; 0 = model default.
  int32 steps = 6;
  // CfgScale is the prompt-adherence strength (generation); 0 = model default.
  double cfg_scale = 7;
  // Variations is the number of distinct outputs to produce (1..N); 0/1 = single.
  int32 variations = 8;
  // Strength is the img2img denoising strength 0..1 (how far from the input).
  double strength = 9;
  // Scale is the upscale factor (2/4); enhancement ops.
  int32 scale = 10;
  // ModelOverride forces a specific registry model id instead of the hardware
  // -fit default (still validated for op-support, enabled-state, runnability).
  string model_override = 11;
  // AllowByok permits falling back to a paid BYOK cloud provider when no local
  // backend is available. Off by default — BYOK is opt-in and metered.
  bool allow_byok = 12;
  // AutoScanNsfw runs an NSFW classification on the generated output and records
  // the verdict with the job. Off by default.
  bool auto_scan_nsfw = 13;
  // Realism is the naturalize fidelity↔realism knob 0..1: how much micro-texture,
  // local contrast, and film-grain to reintroduce into an over-smoothed
  // (restored/upscaled) image. 0/unset = a gentle default; 1 = maximum texture.
  // Only the naturalize op reads it.
  double realism = 14;
  // FaceAware biases naturalize's texture/grain toward midtone regions (where
  // skin sits) so faces de-plasticize more than flat backgrounds. A deterministic
  // luminance-band heuristic, not face detection (which lands with the segment /
  // face_restore ops in a later phase). Only the naturalize op reads it.
  bool face_aware = 15;
  // ConsentAffirmed records that the caller affirmed they have the right to edit
  // the subject of an identity-altering op. On a PUBLIC deployment tier the
  // Responsible-Use gate (internal/safety) REQUIRES this for high-consent-weight
  // ops (edit_instruct / inpaint / object_removal / image_to_image) and rejects
  // the submit without it; the affirmation is recorded to the consent log. On the
  // local/personal tier it is unenforced (personal use is unrestricted). Naturalize
  // is low-weight and never requires it. See docs/internal/SECURITY.md.
  bool consent_affirmed = 16;
  // Adapters is the ordered conditioning stack (LoRA / ControlNet / IP-Adapter)
  // to compose with the base model for this generation/edit. Typed (never the
  // params bag — decision C2): the resolver validates each against the chosen
  // model's architecture, enabled/installed/Ready state, and elevates the consent
  // weight to max(op, adapters...). An incompatible / not-yet-proven adapter is
  // rejected before any job runs (no vaporware). Empty for an unconditioned op.
  repeated AdapterRef adapters = 17;
}

// AdapterRef is one requested conditioning modifier on a generation.
message AdapterRef {
  // adapter_id is the catalog adapter id (`image-tools adapters list`).
  string adapter_id = 1;
  // scale is the conditioning strength; 0 = the adapter's default (clamped to its
  // allowed range).
  double scale = 2;
  // conditioning_image_key is the blob key of the control / reference image
  // (ControlNet / IP-Adapter). Empty for a LoRA, or for a ControlNet whose
  // conditioning map is auto-derived from the generation input via a preprocessor.
  string conditioning_image_key = 3;
  // preprocessor_override forces a specific ControlNet preprocessor
  // (canny|depth|pose|segment|none) instead of the adapter's declared one. Ignored
  // for non-ControlNet kinds.
  string preprocessor_override = 4;
}

// SubmitAIResponse is the protojson body returned by the REST submit edge. The
// op runs asynchronously; this carries the durable job's id + initial ETA plus
// the selection verdict so the caller can surface the chosen model/tier and any
// fallback warnings before the work finishes.
message SubmitAIResponse {
  // JobId identifies the durable job (resolve via JobsService.GetJob/WaitJob).
  string job_id = 1;
  // EstimatedSeconds is the initial ETA; 0 means "unknown".
  int32 estimated_seconds = 2;
  // ModelId is the registry model the selector chose.
  string model_id = 3;
  // Tier is where the op will run: "local-gpu", "local-cpu", or "byok-cloud".
  string tier = 4;
  // Warnings carries non-fatal selection cautions (CPU time warning,
  // conservative unknown-VRAM fallback, BYOK cost caution, …).
  repeated string warnings = 5;
}
