syntax = "proto3";

package vrooli.security_health.v1.validation;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/security-health/v1/validation;validation_v1";

// =============================================================================
// VALIDATION DOMAIN — language-aware security posture validation
// =============================================================================
//
// @layer 5  (api surface)
// @domain validation
// @stability unstable
//
// Wire contract for the ValidationService Connect-RPC service. Detects which
// substrates a target scenario actually contains (Go, pnpm UI, …) and runs the
// applicable security scanners (secrets, Go SAST, Go vuln-DB, JS deps),
// returning a normalized Finding list. Severity normalization is the
// load-bearing contract: critical/high -> ERROR (this is what gates the
// ecosystem-manager R1 ladder rung), medium -> WARNING, low/info -> INFO.
//
// Consumed by:
//   - API: handlers/validation/connect_handler.go implements ValidationServiceHandler.
//   - CLI: cli/domains/validate/handlers.go calls the generated Connect-Go client
//          and renders `security-health validate scenario <name> --json`.
//   - test-genie: the `security` phase shells the CLI --json and maps each
//          Finding to FINDING_SOURCE_SECURITY.
// =============================================================================

service ValidationService {
  rpc ValidateScenario(ValidateScenarioRequest) returns (ValidateScenarioResponse);
}

// Severity classifies a Finding for filtering, rendering, and downstream
// gating. ERROR causes `passed=false` and is the only level that gates R1;
// WARNING and INFO are advisory.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_ERROR = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_INFO = 3;
}

// Finding is a single normalized security result. The field set is the exact
// shape the test-genie `security` phase parses from `validate … --json`.
message Finding {
  // Stable machine code identifying the rule/check (e.g. "gosec.G101",
  // "gitleaks.generic-api-key", "osv.GO-2024-1234"). Tooling filters by this;
  // do not localize.
  string rule_id = 1;
  Severity severity = 2;
  // Short human-meaningful title.
  string title = 3;
  // Human-readable description of the issue.
  string description = 4;
  // Actionable remediation guidance (e.g. "rotate the exposed credential and
  // purge it from history; move it to vault", "bump golang.org/x/net to >=
  // v0.23.0"). Never empty.
  string remediation = 5;
  // File (optionally with :line) the finding is anchored to, relative to the
  // scenario root. Secrets are reported file:line only — never the raw value.
  string file_path = 6;
  // Which scanner produced this finding ("gitleaks", "gosec", "govulncheck",
  // "pnpm-audit", "osv-scanner"). Lets the UI group by tool.
  string scanner = 7;
}

// Summary is a rollup of Finding counts by normalized severity. Drives one-line
// renders and the CLI exit-code decision.
message Summary {
  int32 errors = 1;
  int32 warnings = 2;
  int32 infos = 3;
}

// ValidateScenarioRequest names a scenario by its scenario id (the directory
// name under scenarios/).
message ValidateScenarioRequest {
  string scenario = 1;
}

// ValidateScenarioResponse echoes the scenario id and reports findings.
// `passed` is true iff no Finding has SEVERITY_ERROR. `skipped_scanners` lists
// applicable-but-absent scanners (degraded, not failed).
message ValidateScenarioResponse {
  string scenario = 1;
  bool passed = 2;
  repeated Finding findings = 3;
  Summary summary = 4;
  // Names of scanners that applied to a detected substrate but whose binary was
  // not installed; surfaced as INFO context, never a failure.
  repeated string skipped_scanners = 5;
}
