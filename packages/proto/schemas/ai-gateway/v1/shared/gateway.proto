syntax = "proto3";

package vrooli.ai_gateway.v1.shared;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ai-gateway/v1/shared;shared_v1";

// RequestKind identifies the provider-neutral AI operation a caller needs.
enum RequestKind {
  REQUEST_KIND_UNSPECIFIED = 0;
  REQUEST_KIND_TEXT_GENERATION = 1;
  REQUEST_KIND_TEXT_EMBEDDING = 2;
  REQUEST_KIND_STRUCTURED_EXTRACTION = 3;
  // REQUEST_KIND_IMAGE_GENERATION requests a rendered still image. The
  // request remains provider-neutral: callers express intent and policy here,
  // while an image capability owns operation/model semantics and bytes.
  REQUEST_KIND_IMAGE_GENERATION = 4;
  // REQUEST_KIND_VIDEO_GENERATION requests rendered moving media. Video is a
  // first-class generic inference modality even while a dedicated video
  // production scenario does not exist.
  REQUEST_KIND_VIDEO_GENERATION = 5;
}

// PrivacyClass tells the gateway how sensitive the request metadata is.
enum PrivacyClass {
  PRIVACY_CLASS_UNSPECIFIED = 0;
  PRIVACY_CLASS_PUBLIC = 1;
  PRIVACY_CLASS_INTERNAL = 2;
  PRIVACY_CLASS_CONFIDENTIAL = 3;
  PRIVACY_CLASS_SECRET = 4;
}

// Profile is the policy stance used by routing preview and execution.
enum Profile {
  PROFILE_UNSPECIFIED = 0;
  PROFILE_LOCAL_ONLY = 1;
  PROFILE_LOCAL_FIRST = 2;
  PROFILE_REMOTE_ONLY = 3;
  PROFILE_QUALITY_FIRST = 4;
  PROFILE_CHEAP_FIRST = 5;
  PROFILE_PRIVACY_SENSITIVE = 6;
}

// Modality is the provider-neutral shape of an inference input or output.
// Video and audio are admitted by the vocabulary now so policy catalogs can
// describe them without forcing an untested implementation into this plan.
enum Modality {
  MODALITY_UNSPECIFIED = 0;
  MODALITY_TEXT = 1;
  MODALITY_IMAGE = 2;
  MODALITY_VECTOR = 3;
  MODALITY_VIDEO = 4;
  MODALITY_AUDIO = 5;
}

// Attachment carries ephemeral caller input across the gateway boundary. The
// gateway may resolve and forward it during one request, but never persists
// the payload. References are opaque application-owned identifiers, never
// provider URLs or credentials.
message Attachment {
  Modality modality = 1;
  string media_type = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint64 bytes = 5;
  oneof payload {
    bytes inline_bytes = 6;
    string reference = 7;
  }
}

// GatewayRequest is the caller-owned provider-neutral request envelope.
// It intentionally contains no provider name, provider URL, credential,
// concrete model slug, embedding dimensions, or context-window override.
message GatewayRequest {
  RequestKind kind = 1;
  string role = 2;
  Profile profile = 3;
  PrivacyClass privacy_class = 4;
  string operation = 5;
  string scenario = 6;
  int32 timeout_ms = 7;
  double max_cost_usd = 8;
  int32 max_output_tokens = 9;
  string request_id = 10;
  map<string, string> metadata = 11;
  repeated Attachment attachments = 12;
}

message ValidationIssue {
  string field = 1;
  string code = 2;
  string message = 3;
}
