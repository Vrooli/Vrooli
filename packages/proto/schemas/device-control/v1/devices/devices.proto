syntax = "proto3";
package vrooli.device_control.v1.devices;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/device-control/v1/devices;devices_v1";
service DeviceService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc ConnectDevice(ConnectDeviceRequest) returns (ConnectDeviceResponse);
  rpc ReconnectDevice(ReconnectDeviceRequest) returns (ReconnectDeviceResponse);
  rpc ExecuteVolume(ExecuteVolumeRequest) returns (ExecuteVolumeResponse);
  // One-call screenshot or recording of a named TV or phone: wakes the screen
  // when asked, selects a frame-bearing transport, retains evidence.
  rpc CaptureDevice(CaptureDeviceRequest) returns (CaptureDeviceResponse);
  // One-call app open by common name or exact package, verified by foreground.
  rpc LaunchApp(LaunchAppRequest) returns (LaunchAppResponse);
  // Install a local APK on a phone, verify it by package state, and optionally
  // open it and capture a screenshot: the whole "try my app on the phone" check.
  rpc InstallApp(InstallAppRequest) returns (InstallAppResponse);
  // Read-only hardware/runtime qualification. No arbitrary device commands.
  rpc InspectDevice(InspectDeviceRequest) returns (InspectDeviceResponse);
}
message InspectDeviceRequest { string device_id = 1; string transport = 2; }
message InspectDeviceResponse {
  string device_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  repeated string abis = 3;
  optional uint64 memory_total_bytes = 4;
  optional uint64 data_total_bytes = 5;
  optional uint64 data_available_bytes = 6;
  string webview_package = 7;
  string webview_version = 8;
  string home_component = 9;
  optional bool low_ram = 10;
  map<string, string> unavailable = 11;
  string transport = 12;
  VoiceInspection voice = 13;
  // Android-reported encoder capabilities; availability does not prove an
  // encoder will be chosen or achieve a particular frame rate.
  repeated VideoEncoder video_encoders = 14;
}
message VideoEncoder {
  string mime_type = 1;
  string name = 2;
  optional bool software_only = 3;
  optional bool hardware_accelerated = 4;
}
// Reported configuration only: no audio capture or claim of app microphone access.
message VoiceInspection {
  optional bool microphone_feature = 1;
  repeated string assistant_role_holders = 2;
  optional string assistant_component = 3;
  optional string voice_interaction_component = 4;
  repeated string voice_interaction_services = 5;
  // Names mentioned by OEM policy, not proof that an input is connected/usable.
  repeated string policy_input_types = 6;
  map<string, string> unavailable = 7;
}
message ListDevicesRequest {}
message ListDevicesResponse {
  repeated Device devices = 1;
}
message ConnectDeviceRequest {
  string kind = 1;
}
message ConnectDeviceResponse {
  repeated OnboardingRung rungs = 1;
  string first_next_action = 2;
}
message ReconnectDeviceRequest { string device_id = 1; }
message ReconnectDeviceResponse { Device device = 1; }
message ExecuteVolumeRequest {
  string device = 1;
  string actor = 2;
  string goal = 3;
  string operation = 4;
  optional double value = 5;
  string direction = 6;
  string verification_policy = 7;
  string operation_id = 8;
}
message ExecuteVolumeResponse {
  string status = 1;
  string operation_id = 2;
  string device_id = 3;
  string device_name = 4;
  google.protobuf.Struct plan = 5;
  google.protobuf.Struct before = 6;
  google.protobuf.Struct after = 7;
  string verification_class = 8;
  repeated string evidence = 9;
  int32 recovery_attempts = 10;
  string next_action = 11;
}
message CaptureDeviceRequest {
  string device = 1;
  string actor = 2;
  // screenshot, recording, or logs
  string kind = 3;
  int32 seconds = 4;
  string package = 5;
  bool wake = 6;
  bool home = 7;
}
message CaptureDeviceResponse {
  // passed, capability_gap, failed, or no_evidence
  string disposition = 1;
  string device_id = 2;
  // Retained evidence ids; fetch with `device-control device evidence <id>`.
  repeated string evidence_ids = 3;
  string message = 4;
  string failure_class = 5;
  // Exact commands that resolve a gap or failure, one per line. A single
  // scalar keeps evidence_ids the response's only repeated (primary) field.
  string next_action = 6;
}
message LaunchAppRequest {
  string device = 1;
  string actor = 2;
  // Common name (netflix, youtube) or exact Android package.
  string app = 3;
  bool wake = 4;
}
message LaunchAppResponse {
  // foreground_verified, launched_unverified, not_installed, or failed
  string status = 1;
  string device_id = 2;
  string package = 3;
  string foreground_package = 4;
  string detail = 5;
  // Exact commands that resolve a failure, one per line.
  string next_action = 6;
}
message InstallAppRequest {
  string device = 1;
  string actor = 2;
  // Absolute path of an APK readable by the Device Control host.
  string apk = 3;
  // Open the installed app and verify it reached the foreground.
  bool open = 4;
  // Capture a screenshot after opening (implies open).
  bool screenshot = 5;
}
message InstallAppResponse {
  // installed_verified or failed
  string status = 1;
  string device_id = 2;
  string package = 3;
  string version_name = 4;
  int64 version_code = 5;
  string detail = 6;
  // foreground_verified, launched_unverified, failed, or empty when not requested
  string launch_status = 7;
  string foreground_package = 8;
  // Exact commands that resolve a failure, one per line.
  string next_action = 9;
  // Screenshot evidence ids; fetch with `device-control device evidence <id>`.
  repeated string evidence_ids = 10;
}
message Device {
  string id = 1;
  string name = 2;
  string kind = 3;
  string strategy_id = 4;
  string status = 5;
  string health_reason = 6;
  string host_node_id = 7;
  repeated CapabilitySnapshot capabilities = 8;
  google.protobuf.Timestamp observed_at = 9;
  string serial = 10;
  string model = 11;
  string os_version = 12;
  string transport = 13;
  string health = 14;
  string first_seen_at = 15;
  string last_seen_at = 16;
  repeated TransportProfile transports = 17;
  string identity_key = 18;
  string identity_reason = 19;
}
message CapabilitySnapshot {
  string name = 1;
  string status = 2;
  string prerequisite = 3;
  string next_action = 4;
}
message TransportProfile {
  string strategy_id = 1;
  string name = 2;
  string role = 3;
  string endpoint = 4;
  string health = 5;
  string health_reason = 6;
  repeated CapabilitySnapshot capabilities = 7;
  repeated string operations = 8;
  repeated string endpoints = 9;
}
message OnboardingRung {
  string id = 1;
  string prerequisite = 2;
  string owner = 3;
  string status = 4;
  string next_action = 5;
}
