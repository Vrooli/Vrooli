syntax = "proto3";

package vrooli.dev_routing.v1.routing;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/dev-routing/v1/routing;routing_v1";

// =============================================================================
// DEV-ROUTING DOMAIN — runtime test-pool installation
// =============================================================================
//
// @layer 5  (api surface)
// @domain dev-routing
// @stability unstable
//
// Wire contract for RoutingService, the dev-only admin surface that lets an
// external orchestrator (test-genie) install and clear a runtime test DB pool
// on a running scenario without restarting it. The service is gated by
// projectmeta.IsDevelopment() and is *not* mounted in production-mode
// scenarios; the canonical handler lives in packages/api-core/devrouting.
//
// Consumed by:
//   - API: every scenario that uses packages/api-core/database.RoutedDB
//          embeds the reusable handler via devrouting.Register.
//   - test-genie: drives InstallTestPool / ClearTestPool around each routed
//          playbooks-phase run.
// =============================================================================

service RoutingService {
  // InstallTestPool opens a new database connection pool against dsn and
  // installs it as the active test pool on the receiving scenario. If a
  // previous test pool exists under a *different* lease_id the call is
  // rejected; under the *same* lease_id it is idempotent (retry-safe).
  rpc InstallTestPool(InstallTestPoolRequest) returns (InstallTestPoolResponse);

  // ClearTestPool closes the installed test pool and reverts routing to the
  // primary pool. The caller's lease_id must match the active install.
  // Idempotent under match: clearing when no pool is installed is a no-op success.
  rpc ClearTestPool(ClearTestPoolRequest) returns (ClearTestPoolResponse);
}

message InstallTestPoolRequest {
  // DSN is the connection string the scenario should open the test pool
  // against. Format follows the scenario's primary driver — Postgres URL or
  // SQLite file path. test-genie owns provisioning and migration of the
  // underlying database; the scenario only opens a pool.
  string dsn = 1;

  // lease_id identifies the orchestrator's per-run claim on the scenario.
  // The scenario rejects an install if the slot is already held under a
  // different lease_id. Same lease_id installs are idempotent.
  string lease_id = 2;
}

message InstallTestPoolResponse {
  // active_lease_id reports the lease that owns the installed pool. On a
  // successful install it equals the request's lease_id; on a conflict
  // response detail it reports the existing holder.
  string active_lease_id = 1;
}

message ClearTestPoolRequest {
  // lease_id must match the active install. Mismatch yields FailedPrecondition.
  string lease_id = 1;
}

message ClearTestPoolResponse {}
