syntax = "proto3";

package ecosystem_manager.v1;

import "ecosystem-manager/v1/domain/queue.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ecosystem-manager/v1/api;api";

// =============================================================================
// EXECUTIONS API
// =============================================================================
//
// @layer 5
// @domain api
// @imports queue
// @stability beta
//
// HTTP API contracts for Ecosystem Manager execution history endpoints.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// ExecutionHistoryListResponse returns a list of execution records.
message ExecutionHistoryListResponse {
  // Execution records.
  repeated ExecutionRecord executions = 1;

  // Number of records.
  int32 count = 2;
}

// ExecutionHistoryResponse wraps a single execution record.
message ExecutionHistoryResponse {
  // The execution record.
  ExecutionRecord execution = 1;
}

// ExecutionPromptResponse returns the prompt for a specific execution.
message ExecutionPromptResponse {
  // Prompt text.
  string prompt = 1;

  // Alternative field for content.
  string content = 2;

  // Prompt size in bytes.
  int32 size = 3;
}

// ExecutionOutputResponse returns the output for a specific execution.
message ExecutionOutputResponse {
  // Output text.
  string output = 1;

  // Alternative field for content.
  string content = 2;

  // Output size in bytes.
  int32 size = 3;
}
