syntax = "proto3";

package ecosystem_manager.v1;

import "ecosystem-manager/v1/domain/queue.proto";
import "ecosystem-manager/v1/domain/task.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ecosystem-manager/v1/api;api";

// =============================================================================
// QUEUE API
// =============================================================================
//
// @layer 5
// @domain api
// @imports queue, task
// @stability beta
//
// HTTP API contracts for Ecosystem Manager queue operations.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// QueueStatusResponse returns the current state of the queue processor.
message QueueStatusResponse {
  // Queue status.
  QueueStatus status = 1;
}

// ProcessListResponse returns a list of running processes.
message ProcessListResponse {
  // Running processes.
  repeated ProcessInfo processes = 1;

  // Number of processes.
  int32 count = 2;

  // Response timestamp (Unix epoch milliseconds).
  int64 timestamp = 3;
}

// QueueTriggerResponse represents the result of triggering queue processing.
message QueueTriggerResponse {
  // Whether the trigger succeeded.
  bool success = 1;

  // Descriptive message.
  string message = 2;

  // Response timestamp (Unix epoch milliseconds).
  int64 timestamp = 3;

  // Refreshed status (if available).
  optional QueueStatus status = 4;
}

// QueuePauseResponse represents the result of pausing/resuming the queue.
message QueuePauseResponse {
  // Whether the operation succeeded.
  bool success = 1;

  // Descriptive message.
  string message = 2;

  // Whether the queue is now paused.
  bool paused = 3;
}

// ResumeDiagnosticsResponse provides diagnostic information for troubleshooting.
message ResumeDiagnosticsResponse {
  // Whether diagnostics were collected successfully.
  bool success = 1;

  // Diagnostic data.
  google.protobuf.Struct diagnostics = 2;

  // RFC3339 timestamp of generation.
  // @format rfc3339
  string generated_at = 3;
}

// ResetResponse represents the result of a reset operation.
message ResetResponse {
  // Whether the reset succeeded.
  bool success = 1;

  // Descriptive message.
  string message = 2;

  // Summary of what was reset.
  string summary = 3;
}
