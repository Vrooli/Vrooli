syntax = "proto3";

package ecosystem_manager.v1;

import "buf/validate/validate.proto";
import "ecosystem-manager/v1/domain/settings.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ecosystem-manager/v1/api;api";

// =============================================================================
// SETTINGS API
// =============================================================================
//
// @layer 5
// @domain api
// @imports settings
// @stability beta
//
// HTTP API contracts for Ecosystem Manager settings.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// SettingsResponse returns current settings.
message SettingsResponse {
  // Current settings.
  Settings settings = 1;
}

// UpdateSettingsRequest applies partial settings updates.
// All fields are optional; only provided fields are updated.
message UpdateSettingsRequest {
  // Optional theme override.
  optional string theme = 1 [(buf.validate.field).string = {
    in: [
      "",
      "light",
      "dark",
      "system"
    ]
  }];

  // Optional condensed mode override.
  optional bool condensed_mode = 2;

  // Optional slots override.
  optional int32 slots = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 10
  }];

  // Optional cooldown override.
  optional int32 cooldown_seconds = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 3600
  }];

  // Optional active state override.
  optional bool active = 5;

  // Optional max turns override.
  optional int32 max_turns = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }];

  // Optional allowed tools override.
  optional string allowed_tools = 7;

  // Optional skip permissions override.
  optional bool skip_permissions = 8;

  // Optional task timeout override (minutes).
  optional int32 task_timeout = 9 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1440
  }];

  // Optional idle timeout cap override (minutes).
  optional int32 idle_timeout_cap = 10 [(buf.validate.field).int32 = {
    gte: 1
    lte: 120
  }];

  // Optional runner type override.
  optional string runner_type = 11 [(buf.validate.field).string = {
    in: [
      "",
      "claude-code",
      "codex",
      "opencode"
    ]
  }];

  // Optional recycler settings override.
  optional RecyclerSettings recycler = 12;
}
