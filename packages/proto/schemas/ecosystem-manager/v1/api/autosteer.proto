syntax = "proto3";

package ecosystem_manager.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "ecosystem-manager/v1/domain/autosteer.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ecosystem-manager/v1/api;api";

// =============================================================================
// AUTO STEER API
// =============================================================================
//
// @layer 5
// @domain api
// @imports autosteer
// @stability beta
//
// HTTP API contracts for Ecosystem Manager Auto Steer operations.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// ProfileCreateRequest defines the payload for creating a new Auto Steer profile.
message ProfileCreateRequest {
  // Optional explicit ID (auto-generated if omitted).
  optional string id = 1;

  // Profile display name.
  string name = 2 [(buf.validate.field).string = { min_len: 1, max_len: 100 }];

  // Profile description.
  string description = 3;

  // Ordered phases to execute.
  repeated SteerPhase phases = 4;

  // Quality gates between phases.
  repeated QualityGate quality_gates = 5;

  // Categorization tags.
  repeated string tags = 6;
}

// ProfileUpdateRequest defines the payload for updating an existing profile.
message ProfileUpdateRequest {
  // Updated name.
  optional string name = 1;

  // Updated description.
  optional string description = 2;

  // Updated phases.
  repeated SteerPhase phases = 3;

  // Updated quality gates.
  repeated QualityGate quality_gates = 4;

  // Updated tags.
  repeated string tags = 5;
}

// ProfileResponse wraps a single profile.
message ProfileResponse {
  // The profile.
  AutoSteerProfile profile = 1;
}

// ProfileListResponse returns a list of profiles.
message ProfileListResponse {
  // Profiles.
  repeated AutoSteerProfile profiles = 1;

  // Number of profiles.
  int32 count = 2;
}

// ExecutionStateResponse returns the current execution state.
message ExecutionStateResponse {
  // Execution state.
  ProfileExecutionState state = 1;
}

// ExecutionResetRequest defines the payload for resetting an execution.
message ExecutionResetRequest {
  // Task ID to reset execution for.
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
}

// ExecutionSeekRequest defines the payload for seeking to a specific phase/iteration.
message ExecutionSeekRequest {
  // Task ID.
  string task_id = 1 [(buf.validate.field).string.min_len = 1];

  // Target phase index.
  int32 phase_index = 2 [(buf.validate.field).int32.gte = 0];

  // Target phase iteration.
  int32 phase_iteration = 3 [(buf.validate.field).int32.gte = 0];

  // Optional profile ID override.
  optional string profile_id = 4;

  // Optional scenario name.
  optional string scenario_name = 5;
}

// HistoryListResponse returns a list of profile performance records.
message HistoryListResponse {
  // Performance history records.
  repeated ProfilePerformance history = 1;

  // Number of records.
  int32 count = 2;
}

// HistoryResponse wraps a single performance record.
message HistoryResponse {
  // Performance record.
  ProfilePerformance performance = 1;
}

// FeedbackEntryRequest defines the payload for submitting structured execution feedback.
message FeedbackEntryRequest {
  // Feedback category.
  string category = 1 [(buf.validate.field).string.min_len = 1];

  // Severity level.
  string severity = 2 [(buf.validate.field).string.min_len = 1];

  // Suggested action.
  optional string suggested_action = 3;

  // Additional comments.
  optional string comments = 4;

  // Arbitrary metadata.
  optional google.protobuf.Struct metadata = 5;
}

// IterationRequest represents a request for iteration evaluation.
message IterationRequest {
  // Execution ID.
  optional string execution_id = 1;

  // Agent output.
  optional string output = 2;

  // Metrics data.
  optional google.protobuf.Struct metrics = 3;
}

// TemplateListResponse returns a list of Auto Steer templates.
message TemplateListResponse {
  // Templates (profiles usable as starting points).
  repeated AutoSteerProfile templates = 1;

  // Number of templates.
  int32 count = 2;
}
