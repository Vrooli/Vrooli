syntax = "proto3";

package ecosystem_manager.v1;

import "buf/validate/validate.proto";
import "ecosystem-manager/v1/domain/task.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ecosystem-manager/v1/api;api";

// =============================================================================
// TASKS API
// =============================================================================
//
// @layer 5
// @domain api
// @imports task
// @stability beta
//
// HTTP API contracts for Ecosystem Manager task operations.
//
// USAGE CONTEXTS:
//   - UI services validating API responses
//   - API handlers enforcing request constraints
//
// =============================================================================

// TaskCreateRequest defines the payload for creating a new task.
message TaskCreateRequest {
  // Human-readable task title.
  string title = 1 [(buf.validate.field).string = { min_len: 1, max_len: 200 }];

  // Task type.
  string type = 2 [(buf.validate.field).string = { in: ["resource", "scenario"] }];

  // Task operation.
  string operation = 3 [(buf.validate.field).string = { in: ["generator", "improver"] }];

  // Primary target name.
  optional string target = 4;

  // Multi-target list.
  repeated string targets = 5;

  // Task category.
  optional string category = 6;

  // Priority level.
  optional string priority = 7 [(buf.validate.field).string = { in: ["", "low", "medium", "high", "critical"] }];

  // Effort estimate description.
  optional string effort_estimate = 8;

  // Urgency indicator.
  optional string urgency = 9;

  // Task IDs this depends on.
  repeated string dependencies = 10;

  // Related scenario names.
  repeated string related_scenarios = 11;

  // Related resource names.
  repeated string related_resources = 12;

  // Categorization tags.
  repeated string tags = 13;

  // Free-form notes.
  optional string notes = 14;

  // Manual steering mode.
  optional string steer_mode = 15;

  // Auto Steer profile ID.
  optional string auto_steer_profile_id = 16;
}

// TaskUpdateRequest defines the payload for updating an existing task.
message TaskUpdateRequest {
  // Updated title.
  optional string title = 1;

  // Updated priority.
  optional string priority = 2 [(buf.validate.field).string = { in: ["", "low", "medium", "high", "critical"] }];

  // Updated status.
  optional string status = 3 [(buf.validate.field).string = { in: [
    "",
    "pending",
    "in-progress",
    "completed",
    "failed",
    "completed-finalized",
    "failed-blocked",
    "archived"
  ] }];

  // Updated primary target.
  optional string target = 4;

  // Updated target list.
  repeated string targets = 5;

  // Updated tags.
  repeated string tags = 6;

  // Updated notes.
  optional string notes = 7;

  // Updated steering mode.
  optional string steer_mode = 8;

  // Updated Auto Steer profile ID.
  optional string auto_steer_profile_id = 9;
}

// TaskListResponse returns a list of tasks with metadata.
message TaskListResponse {
  // Tasks matching the query.
  repeated Task tasks = 1;

  // Number of tasks returned.
  int32 count = 2;

  // Total tasks available (for pagination).
  int32 total = 3;
}

// TaskDetailResponse includes runtime information in addition to persisted state.
message TaskDetailResponse {
  // Task data.
  Task task = 1;

  // Current running process (if any).
  optional ProcessInfo current_process = 2;

  // Current Auto Steer phase index (if active).
  optional int32 auto_steer_phase_index = 3;
}

// TaskActionResponse represents the result of an action on a task.
message TaskActionResponse {
  // Whether the action succeeded.
  bool success = 1;

  // Descriptive message.
  string message = 2;

  // Task ID affected.
  string task_id = 3;

  // Error message (if failed).
  string error = 4;
}
