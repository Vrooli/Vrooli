syntax = "proto3";

package vrooli.ecosystem_manager.v1.discovery;

import "buf/validate/validate.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ecosystem-manager/v1/discovery;discovery_v1";

// =============================================================================
// DISCOVERY SERVICE
// =============================================================================
//
// @layer 5
// @domain discovery
// @stability beta
//
// Connect-RPC contract for ecosystem-manager system discovery: enumerating the
// local resources and scenarios available to compose into tasks, plus the task
// operation types and category groupings the create-task form offers.
//
// This is the reference Connect-RPC vertical (see
// docs/internal/MIGRATION-GUIDE.md). It replaces the former message-only
// v1/api/discovery.proto + v1/domain/discovery.proto and the hand-registered
// REST routes under /api/{resources,scenarios,operations,categories}.
// =============================================================================

// Resource represents a discovered local resource.
message Resource {
  // Resource name (folder name).
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable display name.
  string display_name = 2;

  // Filesystem path.
  string path = 3;

  // Listening port (0 if not applicable).
  int32 port = 4;

  // Resource category.
  string category = 5;

  // Resource description.
  string description = 6;

  // Whether the resource is healthy.
  bool healthy = 7;

  // Version string.
  string version = 8;

  // Status indicator (e.g., "[UNREGISTERED]", "[MISSING]").
  string status = 9;
}

// Scenario represents a discovered scenario.
message Scenario {
  // Scenario name (folder name).
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Human-readable display name.
  string display_name = 2;

  // Filesystem path.
  string path = 3;

  // Scenario category.
  string category = 4;

  // Scenario description.
  string description = 5;

  // Version string.
  string version = 6;

  // Runtime status (e.g., "available", "running").
  string status = 7;
}

// Operation represents a task operation type (e.g., generator, improver).
message Operation {
  // Operation name.
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Operation description.
  string description = 2;
}

// ListResourcesRequest enumerates discovered resources.
message ListResourcesRequest {
  // Bypass the discovery cache and re-run discovery when true.
  bool refresh = 1;
}

// ListResourcesResponse returns all discovered resources.
message ListResourcesResponse {
  repeated Resource resources = 1;
  int32 count = 2;
}

// ListScenariosRequest enumerates discovered scenarios.
message ListScenariosRequest {
  // Bypass the discovery cache and re-run discovery when true.
  bool refresh = 1;
}

// ListScenariosResponse returns all discovered scenarios.
message ListScenariosResponse {
  repeated Scenario scenarios = 1;
  int32 count = 2;
}

// GetResourceRequest fetches one discovered resource by name.
message GetResourceRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  bool refresh = 2;
}

// GetScenarioRequest fetches one discovered scenario by name.
message GetScenarioRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  bool refresh = 2;
}

// ListOperationsRequest enumerates task operation types.
message ListOperationsRequest {}

// ListOperationsResponse returns the configured task operations.
message ListOperationsResponse {
  repeated Operation operations = 1;
}

// ListCategoriesRequest enumerates task category groupings.
message ListCategoriesRequest {}

// ListCategoriesResponse returns the category groupings the create-task form
// offers, keyed by category id → human-readable label.
message ListCategoriesResponse {
  map<string, string> resource_categories = 1;
  map<string, string> scenario_categories = 2;
}

// DiscoveryService enumerates the resources, scenarios, operations, and
// categories available to compose into ecosystem-manager tasks.
service DiscoveryService {
  // ListResources returns every discovered local resource.
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);

  // ListScenarios returns every discovered scenario.
  rpc ListScenarios(ListScenariosRequest) returns (ListScenariosResponse);

  // GetResource returns one discovered resource by name (NotFound if absent).
  rpc GetResource(GetResourceRequest) returns (Resource);

  // GetScenario returns one discovered scenario by name (NotFound if absent).
  rpc GetScenario(GetScenarioRequest) returns (Scenario);

  // ListOperations returns the configured task operation types.
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);

  // ListCategories returns the resource/scenario category groupings.
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
}
