syntax = "proto3";

package ecosystem_manager.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/ecosystem-manager/v1/domain;domain";

// =============================================================================
// PROMPT DOMAIN
// =============================================================================
//
// @layer 1
// @domain prompt
// @imports none (external only: buf.validate)
// @stability beta
//
// Prompt file management types for the Ecosystem Manager.
//
// USAGE CONTEXTS:
//   - API responses for prompt file endpoints
//   - UI prompt editor
//
// =============================================================================

// PromptFile represents a prompt file with its content.
message PromptFile {
  // File identifier (relative path).
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // File path relative to prompts directory.
  string path = 2 [(buf.validate.field).string.min_len = 1];

  // File content.
  string content = 3;

  // RFC3339 timestamp of last modification.
  // @format rfc3339
  string updated_at = 4;
}

// PromptFileInfo represents prompt file metadata (without content).
message PromptFileInfo {
  // File identifier (relative path).
  string id = 1 [(buf.validate.field).string.min_len = 1];

  // File path relative to prompts directory.
  string path = 2 [(buf.validate.field).string.min_len = 1];

  // File size in bytes.
  int64 size = 3;

  // RFC3339 timestamp of last modification.
  // @format rfc3339
  string updated_at = 4;
}
