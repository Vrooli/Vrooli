syntax = "proto3";

package vrooli.web_search.v1.research;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "web-search/v1/shared/search.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/web-search/v1/research;research_v1";

// ResearchService is the L2/L3 deep-research surface that sits above the L0/L1
// live-search path. L2 (RunL2) is a synchronous single-pass pipeline: it fetches
// the top-N result pages, extracts readable text, and produces ONE cited
// synthesis grounded in the full page content (not just snippets). L3 (RunL3)
// hands the harder, iterative research-and-reconcile loop to an agent-manager
// workflow and returns an execution handle for WaitResearch or GetResearchStatus.
//
// Auto-capture policy: L3 distills findings by default; L2 only when the caller
// opts in (capture=true); L0/L1 never persist.
service ResearchService {
  // Answer applies owner evidence policy before escalating to live research.
  rpc Answer(AnswerRequest) returns (AnswerResponse);
  // WaitResearch blocks once on the Agent Manager execution; timeout does not cancel work.
  rpc WaitResearch(WaitResearchRequest) returns (GetResearchStatusResponse);
  // CancelResearch explicitly cancels the owner execution; a client wait timeout never does.
  rpc CancelResearch(CancelResearchRequest) returns (GetResearchStatusResponse);
  // RunL2 runs the synchronous L2 fetch -> read -> single-pass cited synthesis
  // pipeline and returns a Brief plus the cited synthesis. With capture=true the
  // distilled claims are written to the findings store (FINDING_SOURCE_L2).
  rpc RunL2(RunL2Request) returns (RunL2Response);
  // RunL3 starts an agent-manager run that performs the iterative
  // research-and-reconcile loop and returns the run handle. The loop semantics
  // (gather nearby findings -> research the gap with L2 tools -> reconcile:
  // distill, supersede outdated, flag low-confidence contradictions) are encoded
  // in the agent task. Auto-capture is on for L3.
  rpc RunL3(RunL3Request) returns (RunL3Response);
  // GetResearchStatus reads a declared L3 execution by id.
  rpc GetResearchStatus(GetResearchStatusRequest) returns (GetResearchStatusResponse);
  // GatherRelatedFindings returns the findings semantically NEAR a query — the
  // bounded GATHER step of the research-and-reconcile loop (OT-P1-003). The
  // sweep is "near the query", never a whole-store scan: the server enforces a
  // hard cap (max 20) regardless of the requested max, so the L3 agent uses this
  // endpoint instead of a free-form findings search.
  rpc GatherRelatedFindings(GatherRelatedFindingsRequest) returns (GatherRelatedFindingsResponse);
  rpc GetCaptureStatus(GetCaptureStatusRequest) returns (GetCaptureStatusResponse);
  rpc GetEvidenceReceipt(GetEvidenceReceiptRequest) returns (GetEvidenceReceiptResponse);
  rpc GetEvidencePassage(GetEvidencePassageRequest) returns (GetEvidencePassageResponse);
  rpc GetEvidenceAssessment(GetEvidenceAssessmentRequest) returns (GetEvidenceAssessmentResponse);
  rpc GetMethodRelease(GetMethodReleaseRequest) returns (GetMethodReleaseResponse);
  rpc PromoteMethod(PromoteMethodRequest) returns (PromoteMethodResponse);
  rpc RollbackMethod(RollbackMethodRequest) returns (RollbackMethodResponse);
  rpc SuspendMethod(SuspendMethodRequest) returns (SuspendMethodResponse);
}

// Citation links a synthesis claim back to the fetched page that supports it.
message Citation {
  // result_index is the zero-based index into the fetched page set.
  int32 result_index = 1;
  string url = 2;
  string title = 3;
  string retrieved_at = 4;
}

// Brief is the research artifact a Run produced: the query, the level ("l2" |
// "l3"), the synthesized summary, and the citations that ground it.
message Brief {
  string query = 1;
  string level = 2; // "l2" | "l3"
  string summary = 3;
  repeated Citation citations = 4;
}

message RunL2Request {
  string query = 1;
  // top_n caps how many result pages are fetched and read (1..10). Defaults to a
  // server-side value when unset or non-positive.
  int32 top_n = 2;
  // capture opts in to persisting the distilled claims as findings (L2 default
  // is OFF; L0/L1 never capture, L3 always does).
  bool capture = 3;
  EvidencePolicy policy = 4;
  repeated ResearchQuestion questions = 5;
}

message RunL2Response {
  // brief carries the query, level, summary, and citations.
  Brief brief = 1;
  // synthesis is the cited synthesis text (== brief.summary; surfaced separately
  // for parity with the live-search response shape).
  string synthesis = 2;
  // abstained is set when the fetched pages were insufficient or in conflict; the
  // synthesis is then an explicit abstention rather than a guess.
  bool abstained = 3;
  // captured_finding_ids lists the findings written when capture was set. Empty
  // when capture was off or nothing was distilled.
  repeated string captured_finding_ids = 4;
  // degraded_engines lists upstream engines that did not contribute to the L0
  // candidate search backing this run (mirrors
  // livesearch.SearchResponse.degraded_engines). A weak synthesis with a
  // non-empty list usually means the inputs were partial, not that the web
  // lacks an answer.
  repeated vrooli.web_search.v1.shared.EngineIssue degraded_engines = 5;
  // abstain_reason explains WHICH collapse produced an abstention (empty when
  // abstained=false): "no_candidates" (the L0 search returned no usable
  // pages), "all_fetches_empty" (candidates existed but every fetch failed or
  // extracted no text), "model_abstained" (the model judged the documents
  // insufficient or in conflict), "reply_unparseable" (no parseable JSON in
  // the model reply), or "citations_invalid" (the answer was grounded in no
  // valid document index — treated as fabrication).
  string abstain_reason = 6;
  // excerpts mirrors, per fetched document, the text actually sent to the
  // synthesis model (post relevance-selection/truncation, transport-capped) —
  // the observability needed to debug a wrong or abstaining synthesis.
  repeated DocumentExcerpt excerpts = 7;
  repeated string evidence_receipt_ids = 8;
  repeated FetchFailure fetch_failures = 9;
  repeated ClaimAssessment assessments = 10;
  repeated QuestionCoverage coverage = 11;
}

message FetchFailure {
  string url = 1;
  string code = 2;
  string message = 3;
  bool retryable = 4;
  string receipt_id = 5;
}

// DocumentExcerpt is what the synthesis model actually read from one fetched
// document: the source url/title plus the (capped) excerpt text.
message DocumentExcerpt {
  string url = 1;
  string title = 2;
  string excerpt = 3;
}

message RunL3Request {
  string query = 1;
  string idempotency_key = 2;
  EvidencePolicy policy = 3;
  repeated ResearchQuestion questions = 4;
}

message RunL3Response {
  // run_id is the declared workflow execution handle for WaitResearch.
  string run_id = 1;
  // status is the initial run status (e.g. "pending", "running").
  string status = 2;
}

message GetResearchStatusRequest {
  string run_id = 1;
}

message GetResearchStatusResponse {
  string run_id = 1;
  // status is the current run status ("pending" | "running" | "complete" |
  // "failed" | "cancelled").
  string status = 2;
  // summary is the run's final summary when complete (may be empty otherwise).
  string summary = 3;
  // started_at / finished_at are populated when known.
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  // error_msg explains a failed run.
  string error_msg = 6;
  google.protobuf.Struct result = 7;
  bool timed_out = 8;
}

message GatherRelatedFindingsRequest {
  string query = 1;
  // max requests an upper bound on how many nearby findings to return. The
  // server clamps it to [1, 20]; an unset/non-positive value defaults to 20.
  // The bound is enforced server-side — a caller cannot widen the sweep.
  int32 max = 2;
}

// GatheredFinding is one finding semantically near the gather query, projected
// to the fields the reconcile step needs (no full citation payload).
message GatheredFinding {
  string finding_id = 1;
  string claim = 2;
  double confidence = 3;
  // status is the lifecycle state ("active" | "disputed"); superseded findings
  // are excluded from the gather (they are not in the semantic index).
  string status = 4;
  // score is the semantic relevance of this finding to the query.
  double score = 5;
}

message GatherRelatedFindingsResponse {
  repeated GatheredFinding findings = 1;
  // cap_applied is the effective bound the server enforced for this gather
  // (after clamping the requested max), so callers can see the sweep was
  // bounded.
  int32 cap_applied = 2;
}

message GetCaptureStatusRequest {}
message GetCaptureStatusResponse {
  int32 pending = 1;
  int32 delivered = 2;
  int32 failed = 3;
  string oldest_pending_at = 4;
  string status = 5;
}

message GetEvidenceReceiptRequest { string receipt_id = 1; }
message GetEvidenceReceiptResponse {
  string receipt_id = 1;
  string observation_id = 2;
  string original_url = 3;
  string retrieved_at = 4;
  string content_sha256 = 5;
  string artifact_id = 6;
  string extraction_revision = 7;
  string retention = 8;
  string failure_code = 9;
  string producer_execution_id = 10;
}

message GetEvidencePassageRequest { string passage_id = 1; }
message GetEvidencePassageResponse {
  string passage_id = 1;
  string receipt_id = 2;
  int32 start_byte = 3;
  int32 end_byte = 4;
  string content = 5;
  string content_sha256 = 6;
}

message GetEvidenceAssessmentRequest {
  string assessment_id = 1;
}

message GetEvidenceAssessmentResponse {
  string assessment_id = 1;
  string claim_id = 2;
  string disposition = 3;
  string policy_revision = 4;
  string reason = 5;
  string evidence_json = 6;
}

message MethodRevision {
  string id = 1;
  string program_hash = 2;
  string config_hash = 3;
}
message EvaluationReceipt {
  string id = 1;
  string candidate_hash = 2;
  string report_hash = 3;
  bool accepted = 4;
}
message EvaluationReport {
  bool accepted = 1;
  string reason = 2;
  string baseline_method = 3;
  string candidate_method = 4;
  int32 population = 5;
  double mean_baseline_effort = 6;
  double mean_candidate_effort = 7;
}
message MethodRelease {
  MethodRevision revision = 1;
  string evaluation_id = 2;
  string evaluation_hash = 3;
  string rollback_of = 4;
  string revision_hash = 5;
}
message GetMethodReleaseRequest {}
message GetMethodReleaseResponse { MethodRelease release = 1; bool found = 2; }
message PromoteMethodRequest {
  string expected_current_hash = 1;
  MethodRevision revision = 2;
  EvaluationReceipt receipt = 3;
  EvaluationReport report = 4;
  string grant = 5;
}
message PromoteMethodResponse { MethodRelease release = 1; }
message RollbackMethodRequest { string expected_current_hash = 1; string target_hash = 2; }
message RollbackMethodResponse { MethodRelease release = 1; }
message SuspendMethodRequest { string revision_hash = 1; string reason = 2; }
message SuspendMethodResponse { string revision_hash = 1; }

// An omitted max_age_seconds requires live evidence. Stored reuse is opt-in.
message AnswerRequest {
  string query = 1;
  string effort = 2; // l0, l1, l2 (default)
  int64 max_age_seconds = 3;
  repeated string source_domains = 4;
  int32 minimum_sources = 5;
  int32 top_n = 6;
  bool capture = 7;
  string finding_id = 8; // Explicitly selected relevant finding; otherwise query must match exactly.
  EvidencePolicy policy = 9;
  repeated ResearchQuestion questions = 10;
}
message AnswerResponse {
  string status = 1; // ok, partial, unavailable
  string answer_kind = 2; // stored_finding, cited_synthesis, raw_hits, none
  Brief brief = 3;
  repeated vrooli.web_search.v1.shared.SearchResult results = 4;
  repeated string finding_ids = 5;
  bool abstained = 6;
  string reason = 7;
  google.protobuf.Timestamp checked_at = 8;
  int32 live_calls = 9;
  bool cached = 10;
  repeated string gaps = 11;
  repeated string captured_finding_ids = 12;
  repeated ClaimAssessment assessments = 13;
  repeated QuestionCoverage coverage = 14;
}
message WaitResearchRequest {
  string run_id = 1;
  int32 timeout_seconds = 2;
}

message CancelResearchRequest {
  string run_id = 1;
  string reason = 2;
  string idempotency_key = 3;
}

// EvidencePolicy is the bounded policy shared by direct and delegated
// research. max_age_seconds=0 requires a fresh observation; reuse is opt-in.
message EvidencePolicy {
  int64 max_age_seconds = 1;
  repeated string source_domains = 2;
  int32 minimum_sources = 3;
  int32 top_n = 4;
  int32 max_questions = 5;
  int32 max_evidence_bytes = 6;
  bool require_independent_sources = 7;
}

// ResearchQuestion is one independently answerable requested part. A result
// is answered only when every required question is covered or explicitly
// unresolved with a reason.
message ResearchQuestion {
  string id = 1;
  string prompt = 2;
  bool required = 3;
}

enum AssessmentDisposition {
  ASSESSMENT_DISPOSITION_UNSPECIFIED = 0;
  ASSESSMENT_SUPPORTED = 1;
  ASSESSMENT_CONTRADICTED = 2;
  ASSESSMENT_UNRESOLVED = 3;
  ASSESSMENT_UNKNOWN = 4;
}

message EvidencePassageRef {
  string receipt_id = 1;
  string passage_id = 2;
  string content_hash = 3;
  string extraction_revision = 4;
}

message ClaimAssessment {
  string claim_id = 1;
  AssessmentDisposition disposition = 2;
  repeated EvidencePassageRef evidence = 3;
  string policy_revision = 4;
  string reason = 5;
  string assessment_id = 6;
}

message QuestionCoverage {
  string question_id = 1;
  string status = 2; // supported, partial, unresolved, unknown
  repeated string claim_ids = 3;
  string unresolved_reason = 4;
}

message EvidenceReceipt {
  string receipt_id = 1;
  string observation_id = 2;
  string url = 3;
  string retrieved_at = 4;
  string content_hash = 5;
  string extraction_revision = 6;
  string retention = 7;
  string failure_code = 8;
}
