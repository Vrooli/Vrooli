syntax = "proto3";

package vrooli.web_search.v1.findings;

import "google/protobuf/timestamp.proto";
import "measures/v1/measures.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/web-search/v1/findings;findings_v1";

// FindingsService is the self-curating, citation-backed knowledge store that
// retains what web research turns up. Findings are never hard-deleted in the
// normal flow: an outdated claim is SUPERSEDED (soft, status + superseded_by)
// and a low-confidence contradiction is FLAGGED into the DISPUTED state. The
// read path (SearchFindings/ListFindings) excludes superseded by default and
// surfaces disputed with a warning.
service FindingsService {
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);
  rpc GetFinding(GetFindingRequest) returns (GetFindingResponse);
  rpc AddFinding(AddFindingRequest) returns (AddFindingResponse);
  rpc EditFinding(EditFindingRequest) returns (EditFindingResponse);
  rpc SupersedeFinding(SupersedeFindingRequest) returns (SupersedeFindingResponse);
  rpc FlagFinding(FlagFindingRequest) returns (FlagFindingResponse);
  // ListDisputes returns the DISPUTED findings — the dispute review queue's read
  // side. A convenience over ListFindings(status=DISPUTED).
  rpc ListDisputes(ListDisputesRequest) returns (ListDisputesResponse);
  // ResolveDispute closes a DISPUTED finding. With resolution "keep" the finding
  // returns to ACTIVE and its dispute note is cleared; with "supersede" it is
  // retired in favor of replacement. Every resolution writes an audit row.
  rpc ResolveDispute(ResolveDisputeRequest) returns (ResolveDisputeResponse);
  rpc PruneFindings(PruneFindingsRequest) returns (PruneFindingsResponse);
  // SearchFindings runs the semantic (aisearch-go) read path over the findings
  // corpus. Default filter excludes superseded; disputed are returned flagged.
  rpc SearchFindings(SearchFindingsRequest) returns (SearchFindingsResponse);
  // CountFindings is the canonical measure: how many findings were captured in
  // a time window.
  rpc CountFindings(CountFindingsRequest) returns (CountFindingsResponse);
}

// FindingStatus is the lifecycle state of a finding.
enum FindingStatus {
  FINDING_STATUS_UNSPECIFIED = 0;
  FINDING_STATUS_ACTIVE = 1;
  FINDING_STATUS_DISPUTED = 2;
  FINDING_STATUS_SUPERSEDED = 3;
}

// FindingSource records how a finding entered the store.
enum FindingSource {
  FINDING_SOURCE_UNSPECIFIED = 0;
  FINDING_SOURCE_MANUAL = 1;
  FINDING_SOURCE_L2 = 2;
  FINDING_SOURCE_L3 = 3;
}

// Citation is one cited source backing a finding's claim.
message Citation {
  string id = 1;
  string url = 2;
  string title = 3;
  google.protobuf.Timestamp retrieved_at = 4;
}

// CitationInput is a citation supplied when adding a finding.
message CitationInput {
  string url = 1;
  string title = 2;
}

// Brief is the research artifact (L2/L3) a finding was distilled from.
message Brief {
  string id = 1;
  string query = 2;
  string level = 3; // "l2" | "l3"
  string summary = 4;
  string agent_run_id = 5;
  google.protobuf.Timestamp run_timestamp = 6;
  string metadata = 7; // JSON blob
}

// Finding is one citation-backed claim in the knowledge store.
message Finding {
  string id = 1;
  string claim = 2;
  string brief_id = 3;
  double confidence = 4;
  FindingStatus status = 5;
  google.protobuf.Timestamp retrieval_date = 6;
  string query = 7;
  // superseded_by points at the finding that replaced this one (set when
  // status == SUPERSEDED).
  string superseded_by = 8;
  // dispute_note explains why the finding is DISPUTED (sources conflict).
  string dispute_note = 9;
  FindingSource source = 10;
  repeated Citation citations = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message ListFindingsRequest {
  // status filters to a single lifecycle state. UNSPECIFIED returns active +
  // disputed (superseded excluded unless include_archived).
  FindingStatus status = 1;
  bool include_archived = 2; // include superseded
  int32 limit = 3;
}

message ListFindingsResponse {
  repeated Finding findings = 1;
}

message GetFindingRequest {
  string id = 1;
}

message GetFindingResponse {
  Finding finding = 1;
}

message AddFindingRequest {
  string claim = 1;
  double confidence = 2;
  string query = 3;
  FindingSource source = 4;
  string brief_id = 5;
  repeated CitationInput citations = 6;
}

message AddFindingResponse {
  Finding finding = 1;
}

message EditFindingRequest {
  string id = 1;
  string claim = 2;
  double confidence = 3;
}

message EditFindingResponse {
  Finding finding = 1;
}

message SupersedeFindingRequest {
  // id is the finding being retired.
  string id = 1;
  // replacement is the finding that supersedes it.
  string replacement = 2;
  string reason = 3;
}

message SupersedeFindingResponse {
  Finding finding = 1;
}

message FlagFindingRequest {
  string id = 1;
  string reason = 2;
}

message FlagFindingResponse {
  Finding finding = 1;
}

message ListDisputesRequest {
  int32 limit = 1;
}

message ListDisputesResponse {
  repeated Finding findings = 1;
}

message ResolveDisputeRequest {
  // id is the DISPUTED finding to resolve.
  string id = 1;
  // resolution is "keep" (return to ACTIVE, clear the dispute) or "supersede"
  // (retire in favor of replacement).
  string resolution = 2;
  // replacement is the finding that supersedes id; used only when resolution is
  // "supersede".
  string replacement = 3;
  // reason explains the resolution; recorded on the audit row.
  string reason = 4;
}

message ResolveDisputeResponse {
  Finding finding = 1;
}

message PruneFindingsRequest {
  // dry_run reports what would be pruned without archiving.
  bool dry_run = 1;
}

message PruneFindingsResponse {
  int32 pruned = 1;
  repeated string finding_ids = 2;
}

message SearchFindingsRequest {
  string query = 1;
  int32 limit = 2;
  bool include_archived = 3;
}

// FindingHit is one semantic-search result over the findings corpus.
message FindingHit {
  Finding finding = 1;
  double score = 2;
  bool weak = 3;
}

message SearchFindingsResponse {
  repeated FindingHit hits = 1;
  string method = 2; // which leg answered: "dense" | "hybrid" | "text"
}

message CountFindingsRequest {
  vrooli.measures.v1.TimeWindow window = 1;
}

message CountFindingsResponse {
  int64 count = 1;
}
