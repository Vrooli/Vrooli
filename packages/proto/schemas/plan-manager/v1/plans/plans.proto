syntax = "proto3";

package vrooli.plan_manager.v1.plans;

import "plan-manager/v1/shared/model.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/plan-manager/v1/plans;plans_v1";

// =============================================================================
// PLANS DOMAIN — the structured plan + phase record (SSOT)
// =============================================================================
//
// @stability draft
//
// PlansService owns the structured plan record as the single source of truth:
// CRUD, the rendered markdown *view* (never parsed back), lifecycle status
// transitions (phase status drives plan status), the supersession/dependency
// graph (via content_hash), per-surface templates, and the plan-source resolver
// (canonical write under the ~/.vrooli home store + import/migrate from the
// hygiene-blessed fallback locations). See docs/concepts/DOMAINS.md (plans) and
// docs/concepts/PLAN-MODEL.md.
//
// Authoring/execution/validation operate *on* plans but live in their own
// services; this service never owns their logic.
// =============================================================================

service PlansService {
  // ListPlans returns plans, optionally filtered by status (OT-P0-001).
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  // GetPlan returns one plan by id or slug.
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  // CreatePlan persists a new structured plan; the server assigns id, content
  // hash, status and timestamps (the computed fields).
  rpc CreatePlan(CreatePlanRequest) returns (CreatePlanResponse);
  // UpdatePlan replaces the authored fields of an existing plan; computed fields
  // are recomputed server-side.
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);
  // ArchivePlan soft-archives a plan (kept, hidden by default).
  rpc ArchivePlan(ArchivePlanRequest) returns (ArchivePlanResponse);
  // RenderMarkdown renders the structured record to its human-readable markdown
  // projection. Deterministic; the view is never parsed back into truth.
  rpc RenderMarkdown(RenderMarkdownRequest) returns (RenderMarkdownResponse);

  // AddPhase appends a first-class phase to a plan.
  rpc AddPhase(AddPhaseRequest) returns (AddPhaseResponse);
  // UpdatePhase replaces the authored fields of a phase. Status is a typed
  // transition — see ExecutionService.TransitionPhase for runtime transitions.
  rpc UpdatePhase(UpdatePhaseRequest) returns (UpdatePhaseResponse);
  // ListRelevantContext returns accepted setup context for a plan or one phase.
  rpc ListRelevantContext(ListRelevantContextRequest) returns (ListRelevantContextResponse);
  // UpdateRelevantContext replaces one structured setup item without rewriting
  // the whole plan.
  rpc UpdateRelevantContext(UpdateRelevantContextRequest) returns (UpdateRelevantContextResponse);
  // RemoveRelevantContext removes one structured setup item.
  rpc RemoveRelevantContext(RemoveRelevantContextRequest) returns (RemoveRelevantContextResponse);
  // ListReferences returns structured code/doc/req references for a plan or one
  // phase.
  rpc ListReferences(ListReferencesRequest) returns (ListReferencesResponse);
  // UpdateReference replaces one structured reference without rewriting the
  // whole plan.
  rpc UpdateReference(UpdateReferenceRequest) returns (UpdateReferenceResponse);
  // RemoveReference removes one structured reference.
  rpc RemoveReference(RemoveReferenceRequest) returns (RemoveReferenceResponse);

  // GetGraph returns the supersession/dependency edges, optionally scoped to one
  // plan's neighborhood (OT-P1-002).
  rpc GetGraph(GetGraphRequest) returns (GetGraphResponse);
  // LinkSupersession records that one plan supersedes another (PM-GRAPH-001).
  rpc LinkSupersession(LinkSupersessionRequest) returns (LinkSupersessionResponse);
  // LinkDependency records that one plan depends on another.
  rpc LinkDependency(LinkDependencyRequest) returns (LinkDependencyResponse);

  // ImportPlan canonicalizes a markdown plan from a configured source location into the
  // structured model (references parsed from the [CODE:]/[REQ:] grammar).
  rpc ImportPlan(ImportPlanRequest) returns (ImportPlanResponse);
  // MigratePlan canonicalizes a fallback-resolved plan into the home store
  // (non-destructive to the source).
  rpc MigratePlan(MigratePlanRequest) returns (MigratePlanResponse);
  // ReconcilePlans repairs rendered mirrors and canonicalizes misplaced markdown
  // sources non-destructively.
  rpc ReconcilePlans(ReconcilePlansRequest) returns (ReconcilePlansResponse);

  // ListTemplates returns the per-surface plan templates (CLI/proto/UI).
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  // CreateFromTemplate pre-scaffolds a plan from a template.
  rpc CreateFromTemplate(CreateFromTemplateRequest) returns (CreateFromTemplateResponse);
}

message ListPlansRequest {
  // Optional status filter; UNSPECIFIED returns all non-archived plans.
  shared.PlanStatus status = 1;
  // When true, archived plans are included in the result.
  bool include_archived = 2;
  WorkspaceScope workspace = 3;
}

message ListPlansResponse {
  repeated shared.Plan plans = 1;
}

message GetPlanRequest {
  // A plan id or slug; both resolve to the same plan.
  string id = 1;
  WorkspaceScope workspace = 2;
}

message GetPlanResponse {
  shared.Plan plan = 1;
}

message CreatePlanRequest {
  // The draft plan to persist. Only authored fields are read; the server
  // assigns id/status/content_hash/timestamps.
  shared.Plan plan = 1;
}

message CreatePlanResponse {
  shared.Plan plan = 1;
}

message UpdatePlanRequest {
  shared.Plan plan = 1;
}

message UpdatePlanResponse {
  shared.Plan plan = 1;
}

message ArchivePlanRequest {
  string id = 1;
  WorkspaceScope workspace = 2;
}

message ArchivePlanResponse {
  shared.Plan plan = 1;
}

message RenderMarkdownRequest {
  string id = 1;
  WorkspaceScope workspace = 2;
  // When true, omit provenance/debug sections and render the execution-facing
  // compact view. The full canonical mirror remains the default.
  bool compact = 3;
}

message RenderMarkdownResponse {
  string markdown = 1;
  shared.RenderedPlanMirror mirror = 2;
  bool repaired = 3;
  shared.Plan plan = 4;
  string quality_status = 5;
  repeated string quality_findings = 6;
}

message AddPhaseRequest {
  string plan_id = 1;
  shared.Phase phase = 2;
  WorkspaceScope workspace = 3;
}

message AddPhaseResponse {
  shared.Plan plan = 1;
}

message UpdatePhaseRequest {
  string plan_id = 1;
  shared.Phase phase = 2;
  WorkspaceScope workspace = 3;
}

message UpdatePhaseResponse {
  shared.Plan plan = 1;
}

message ListRelevantContextRequest {
  string id = 1;
  WorkspaceScope workspace = 2;
  string phase_id = 3;
}

message ListRelevantContextResponse {
  repeated shared.RelevantContextItem items = 1;
}

message UpdateRelevantContextRequest {
  string id = 1;
  WorkspaceScope workspace = 2;
  string phase_id = 3;
  string item_id = 4;
  shared.RelevantContextItem item = 5;
}

message UpdateRelevantContextResponse {
  shared.Plan plan = 1;
}

message RemoveRelevantContextRequest {
  string id = 1;
  WorkspaceScope workspace = 2;
  string phase_id = 3;
  string item_id = 4;
}

message RemoveRelevantContextResponse {
  shared.Plan plan = 1;
}

message ListReferencesRequest {
  string id = 1;
  WorkspaceScope workspace = 2;
  string phase_id = 3;
}

message ListReferencesResponse {
  repeated shared.Reference references = 1;
}

message UpdateReferenceRequest {
  string id = 1;
  WorkspaceScope workspace = 2;
  string phase_id = 3;
  string reference_id = 4;
  shared.Reference reference = 5;
}

message UpdateReferenceResponse {
  shared.Plan plan = 1;
}

message RemoveReferenceRequest {
  string id = 1;
  WorkspaceScope workspace = 2;
  string phase_id = 3;
  string reference_id = 4;
}

message RemoveReferenceResponse {
  shared.Plan plan = 1;
}

message GetGraphRequest {
  // Optional: scope the graph to one plan's neighborhood. Empty returns all.
  string plan_id = 1;
}

message GetGraphResponse {
  repeated shared.PlanEdge edges = 1;
}

message LinkSupersessionRequest {
  string superseding_plan_id = 1;
  string superseded_plan_id = 2;
}

message LinkSupersessionResponse {
  shared.Plan plan = 1;
}

message LinkDependencyRequest {
  string depending_plan_id = 1;
  string dependency_plan_id = 2;
}

message LinkDependencyResponse {
  shared.Plan plan = 1;
}

message ImportPlanRequest {
  // Path the markdown was read from (one of the fallback read locations).
  string source_path = 1;
  // Raw markdown to import; when empty the server reads source_path.
  string markdown = 2;
  // Optional title override used by CLI import flows.
  string title = 3;
  // Optional slug override used by CLI import flows.
  string slug = 4;
  WorkspaceScope workspace = 5;
}

message ImportPlanResponse {
  shared.Plan plan = 1;
}

message MigratePlanRequest {
  string id = 1;
}

message MigratePlanResponse {
  shared.Plan plan = 1;
}

enum ReconcileConflictPolicy {
  RECONCILE_CONFLICT_POLICY_UNSPECIFIED = 0;
  RECONCILE_CONFLICT_POLICY_REPORT_ONLY = 1;
  RECONCILE_CONFLICT_POLICY_SKIP_EXISTING = 2;
}

enum ReconcileAction {
  RECONCILE_ACTION_UNSPECIFIED = 0;
  RECONCILE_ACTION_ALREADY_CANONICAL = 1;
  RECONCILE_ACTION_MIRROR_FRESH = 2;
  RECONCILE_ACTION_MIRROR_REPAIR_NEEDED = 3;
  RECONCILE_ACTION_MIRROR_REPAIRED = 4;
  RECONCILE_ACTION_IMPORT_PLANNED = 5;
  RECONCILE_ACTION_IMPORTED = 6;
  RECONCILE_ACTION_SKIPPED_DUPLICATE = 7;
  RECONCILE_ACTION_PARSE_FAILED = 8;
  RECONCILE_ACTION_CONFLICT = 9;
}

message ReconcilePlansRequest {
  bool dry_run = 1;
  bool repair_mirrors = 2;
  bool source_intake = 3;
  bool include_archived = 4;
  bool include_archived_sources = 5;
  ReconcileConflictPolicy conflict_policy = 6;
  bool source_runtime_home_plans = 7;
  bool source_docs_plans = 8;
  bool source_repo_plans = 9;
  WorkspaceScope workspace = 10;
  bool retire_sources = 11;
}

message WorkspaceScope {
  string id = 1;
  string root = 2;
}

message ReconcilePlanItem {
  ReconcileAction action = 1;
  string plan_id = 2;
  string slug = 3;
  string title = 4;
  string source_path = 5;
  shared.RenderedPlanMirror mirror = 6;
  bool source_untouched = 7;
  string error = 8;
  bool source_retirement_planned = 9;
  bool source_removed = 10;
}

message ReconcilePlansResponse {
  bool dry_run = 1;
  repeated ReconcilePlanItem items = 2;
}

message ListTemplatesRequest {}

message ListTemplatesResponse {
  repeated PlanTemplate templates = 1;
}

// PlanTemplate is a per-surface starter plan (CLI/proto/UI) that pre-scaffolds
// the structured record so a plan starts with the right phase skeleton.
message PlanTemplate {
  string id = 1;
  string name = 2;
  string description = 3;
  // The surface this template targets: "cli" | "proto" | "ui" | "generic".
  string surface = 4;
}

message CreateFromTemplateRequest {
  string template_id = 1;
  string title = 2;
  string slug = 3;
}

message CreateFromTemplateResponse {
  shared.Plan plan = 1;
}
