syntax = "proto3";

package landing_page_business_suite.v1;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/landing-page-business-suite/v1;landing_page_business_suite_v1";

import "landing-page-business-suite/v1/variant.proto";

// VariantSectionService owns mutable JSON-backed landing sections. Keeping it
// separate from variant lifecycle keeps the editor transport small and avoids
// widening the public variant surface with administrative write operations.
service VariantSectionService {
  rpc GetVariantSections(GetVariantSectionsRequest) returns (VariantSectionsResponse);
  rpc GetVariantSection(GetVariantSectionRequest) returns (VariantSectionResponse);
  rpc CreateVariantSection(CreateVariantSectionRequest) returns (VariantSectionResponse);
  rpc UpdateVariantSection(UpdateVariantSectionRequest) returns (VariantSectionResponse);
  rpc DeleteVariantSection(DeleteVariantSectionRequest) returns (DeleteVariantSectionResponse);
}
