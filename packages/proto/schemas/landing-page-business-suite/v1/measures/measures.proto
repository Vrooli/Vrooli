syntax = "proto3";

package landing_page_business_suite.v1;

import "measures/v1/measures.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/landing-page-business-suite/v1/measures;measuresv1";

// MeasuresService exposes auditable, read-only commercial-volume measures.
// Each operation answers one independently addressable question over the
// authoritative Postgres domain state. The shared TimeWindow contract makes
// relative and explicit windows deterministic across CLI, API, and registry
// consumers.
service MeasuresService {
  rpc CountSubscriptionsCreated(CountSubscriptionsCreatedRequest) returns (CountSubscriptionsCreatedResponse);
  rpc CountCreditTransactionsCreated(CountCreditTransactionsCreatedRequest) returns (CountCreditTransactionsCreatedResponse);
  rpc CountCheckoutSessionsCreated(CountCheckoutSessionsCreatedRequest) returns (CountCheckoutSessionsCreatedResponse);
  rpc CountBundleProductsCreated(CountBundleProductsCreatedRequest) returns (CountBundleProductsCreatedResponse);
  rpc CountBundlePricesCreated(CountBundlePricesCreatedRequest) returns (CountBundlePricesCreatedResponse);
  rpc CountSubscriptionSchedulesCreated(CountSubscriptionSchedulesCreatedRequest) returns (CountSubscriptionSchedulesCreatedResponse);
  rpc CountIntroCouponUsageCreated(CountIntroCouponUsageCreatedRequest) returns (CountIntroCouponUsageCreatedResponse);
  rpc CountPaymentAnomaliesCreated(CountPaymentAnomaliesCreatedRequest) returns (CountPaymentAnomaliesCreatedResponse);
  rpc CountUsersCreated(CountUsersCreatedRequest) returns (CountUsersCreatedResponse);
  rpc CountUserSessionsCreated(CountUserSessionsCreatedRequest) returns (CountUserSessionsCreatedResponse);
  rpc CountAuthTokensCreated(CountAuthTokensCreatedRequest) returns (CountAuthTokensCreatedResponse);
  rpc CountAPIKeysCreated(CountAPIKeysCreatedRequest) returns (CountAPIKeysCreatedResponse);
  rpc CountCreditReservationsCreated(CountCreditReservationsCreatedRequest) returns (CountCreditReservationsCreatedResponse);
  rpc CountSubscriptionTierLimitsCreated(CountSubscriptionTierLimitsCreatedRequest) returns (CountSubscriptionTierLimitsCreatedResponse);
  rpc CountUsageRecordsCreated(CountUsageRecordsCreatedRequest) returns (CountUsageRecordsCreatedResponse);
  rpc CountAdminSessionsCreated(CountAdminSessionsCreatedRequest) returns (CountAdminSessionsCreatedResponse);
  rpc CountAdminUsersCreated(CountAdminUsersCreatedRequest) returns (CountAdminUsersCreatedResponse);
  rpc CountAssetsCreated(CountAssetsCreatedRequest) returns (CountAssetsCreatedResponse);
  rpc CountDownloadAppsCreated(CountDownloadAppsCreatedRequest) returns (CountDownloadAppsCreatedResponse);
  rpc CountDownloadArtifactsCreated(CountDownloadArtifactsCreatedRequest) returns (CountDownloadArtifactsCreatedResponse);
  rpc CountDownloadAssetsCreated(CountDownloadAssetsCreatedRequest) returns (CountDownloadAssetsCreatedResponse);
  rpc CountDownloadStorageSettingsCreated(CountDownloadStorageSettingsCreatedRequest) returns (CountDownloadStorageSettingsCreatedResponse);
  rpc CountFeedbackRequestsCreated(CountFeedbackRequestsCreatedRequest) returns (CountFeedbackRequestsCreatedResponse);
  rpc CountMetricsEventsCreated(CountMetricsEventsCreatedRequest) returns (CountMetricsEventsCreatedResponse);
  rpc CountRemoteProfilesCreated(CountRemoteProfilesCreatedRequest) returns (CountRemoteProfilesCreatedResponse);
  rpc CountWaitlistEmailsCreated(CountWaitlistEmailsCreatedRequest) returns (CountWaitlistEmailsCreatedResponse);
}

message CountSubscriptionsCreatedRequest {
  vrooli.measures.v1.TimeWindow window = 1;
}

message CountSubscriptionsCreatedResponse {
  int64 count = 1;
}

