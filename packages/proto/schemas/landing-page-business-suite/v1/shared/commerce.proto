syntax = "proto3";

package vrooli.landing_page_business_suite.v1.shared;

import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/landing-page-business-suite/v1/shared;shared_v1";

// Reusable commercial contracts shared by account, billing, bundles, pricing,
// and landing-config. Service-specific requests and commands remain in their
// owning domains; this file deliberately contains only value objects.
enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_ACTIVE = 1;
  SUBSCRIPTION_STATE_TRIALING = 2;
  SUBSCRIPTION_STATE_PAST_DUE = 3;
  SUBSCRIPTION_STATE_CANCELED = 4;
  SUBSCRIPTION_STATE_INACTIVE = 5;
}

message SubscriptionStatus {
  reserved 11;
  reserved "metadata_untyped";
  SubscriptionState state = 1;
  optional string subscription_id = 2;
  string user_identity = 3;
  optional string plan_tier = 4;
  optional string stripe_price_id = 5;
  optional string bundle_key = 6;
  google.protobuf.Timestamp cached_at = 7;
  int64 cache_age_ms = 8;
  google.protobuf.Timestamp canceled_at = 9;
  optional string message = 10;
  map<string, common.v1.JsonValue> metadata = 12;
}

message VerifySubscriptionResponse {
  SubscriptionStatus status = 1;
}

message CreditsBalance {
  string customer_email = 1;
  string bundle_key = 2;
  int64 balance_credits = 3;
  google.protobuf.Timestamp updated_at = 4;
}

enum PlanKind {
  PLAN_KIND_UNSPECIFIED = 0;
  PLAN_KIND_SUBSCRIPTION = 1;
  PLAN_KIND_CREDITS_TOPUP = 2;
  PLAN_KIND_SUPPORTER_CONTRIBUTION = 3;
}

enum BillingInterval {
  BILLING_INTERVAL_UNSPECIFIED = 0;
  BILLING_INTERVAL_MONTH = 1;
  BILLING_INTERVAL_YEAR = 2;
  BILLING_INTERVAL_ONE_TIME = 3;
}

enum IntroPricingType {
  INTRO_PRICING_TYPE_UNSPECIFIED = 0;
  INTRO_PRICING_TYPE_FLAT_AMOUNT = 1;
  INTRO_PRICING_TYPE_PERCENTAGE = 2;
}

message Bundle {
  reserved 8;
  reserved "metadata_untyped";
  string bundle_key = 1;
  string name = 2;
  string stripe_product_id = 3;
  int64 credits_per_usd = 4;
  double display_credits_multiplier = 5;
  string display_credits_label = 6;
  string environment = 7;
  map<string, common.v1.JsonValue> metadata = 9;
}

message PlanOption {
  reserved 21;
  reserved "metadata_untyped";
  string plan_name = 1;
  string plan_tier = 2;
  BillingInterval billing_interval = 3;
  int64 amount_cents = 4;
  string currency = 5;
  bool intro_enabled = 6;
  IntroPricingType intro_type = 7;
  optional int64 intro_amount_cents = 8;
  int32 intro_periods = 9;
  string intro_price_lookup_key = 10;
  string stripe_price_id = 11;
  int64 monthly_included_credits = 12;
  int64 one_time_bonus_credits = 13;
  int32 plan_rank = 14;
  string bonus_type = 15;
  PlanKind kind = 16;
  bool is_variable_amount = 17;
  bool display_enabled = 18;
  string bundle_key = 19;
  int32 display_weight = 20;
  map<string, common.v1.JsonValue> metadata = 22;
}

message PricingOverview {
  Bundle bundle = 1;
  repeated PlanOption monthly = 2;
  repeated PlanOption yearly = 3;
  google.protobuf.Timestamp updated_at = 4;
}
