syntax = "proto3";

package vrooli.money_ledger.v1.ingest;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "money-ledger/v1/shared/ledger_types.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/money-ledger/v1/ingest;ingest_v1";

enum AdapterKind {
  ADAPTER_KIND_UNSPECIFIED = 0;
  ADAPTER_KIND_MANUAL = 1;
  ADAPTER_KIND_FILE = 2;
  ADAPTER_KIND_AGGREGATOR = 3;
  ADAPTER_KIND_COMMERCE = 4;
}

message Adapter {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  AdapterKind kind = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  bool enabled = 4;
  google.protobuf.Timestamp last_success_at = 5;
  string availability_reason = 6;
  string cursor = 7;
}

message Receipt {
  string id = 1;
  string adapter_id = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  int32 read = 5;
  int32 written = 6;
  int32 skipped_duplicates = 7;
  string status = 8;
  string error = 9;
  google.protobuf.Timestamp created_at = 10;
}

message Availability {
  string adapter_id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp last_success_at = 3;
}

message RegisterAdapterRequest { Adapter adapter = 1 [(buf.validate.field).required = true]; }
message RegisterAdapterResponse { Adapter adapter = 1; }
message ListAdaptersRequest {}
message ListAdaptersResponse { repeated Adapter adapters = 1; }

// This is the one inbound money-event door. Manual entry uses the same shape
// as every other adapter and is normalized by the service before journaling.
message IngestEventRequest { shared.MoneyEvent event = 1 [(buf.validate.field).required = true]; }
message IngestEventResponse { shared.Posting posting = 1; bool duplicate = 2; Receipt receipt = 3; }

message RunAdapterRequest {
  string adapter_id = 1 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}
message RunAdapterResponse { Receipt receipt = 1; repeated Availability availability = 2; }

// File imports are supplied as UTF-8 CSV so the API never opens an arbitrary
// path on the host. Header: external_id,account_id,book_id,amount_minor,
// currency,occurred_at,description,category.
message ImportFileRequest {
  string adapter_id = 1 [(buf.validate.field).string.min_len = 1];
  bytes csv = 2 [(buf.validate.field).bytes.min_len = 1];
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}
message ImportFileResponse { Receipt receipt = 1; }
enum SourceMode { SOURCE_MODE_UNSPECIFIED = 0; SOURCE_MODE_FIXTURE = 1; SOURCE_MODE_OPERATOR_SUPPLIED = 2; }
message OperatorInputField { string path = 1; string status = 2; bool written = 3; string unit = 4; int32 window_days = 5; google.protobuf.Timestamp observed_at = 6; string kind = 7; string reason = 8; }
message OperatorImportRequest { string source_path = 1; SourceMode source_mode = 2; bool apply = 3; string adapter_id = 4; string book_id = 5; string account_id = 6; bytes source_json = 7; }
message OperatorImportResponse { repeated OperatorInputField fields = 1; int32 read = 2; int32 written = 3; int32 findings = 4; bool applied = 5; }
message OperatorInputStatusRequest { string book_id = 1; }
message OperatorInputStatusResponse { repeated OperatorInputField fields = 1; }

// Untrusted observations are previewed only. This contract never admits a posting.
enum CryptoObservationState {
 CRYPTO_OBSERVATION_STATE_UNSPECIFIED = 0;
 CRYPTO_OBSERVATION_STATE_PENDING = 1;
 CRYPTO_OBSERVATION_STATE_INCLUDED = 2;
 CRYPTO_OBSERVATION_STATE_FINALIZED = 3;
 CRYPTO_OBSERVATION_STATE_REMOVED = 4;
 CRYPTO_OBSERVATION_STATE_REVERTED = 5;
}
enum CryptoLegKind {
 CRYPTO_LEG_KIND_UNSPECIFIED = 0;
 CRYPTO_LEG_KIND_BALANCE = 1;
 CRYPTO_LEG_KIND_DEPOSIT = 2;
 CRYPTO_LEG_KIND_FEE = 3;
 CRYPTO_LEG_KIND_APPROVAL = 4;
}
message PreviewCryptoObservationRequest {
 string network = 1;
 string asset_id = 2;
 string atomic_amount = 3;
 uint32 decimals = 4;
 CryptoObservationState state = 5;
 CryptoLegKind leg_kind = 6;
 string source_reference = 7;
 string transaction_hash = 8;
 string block_hash = 9;
 uint32 leg_index = 10;
 string book_id = 11;
 string account_id = 12;
 string address = 13;
}
message PreviewCryptoObservationResponse {
 string network = 1;
 string asset_id = 2;
 string atomic_amount = 3;
 uint32 decimals = 4;
 CryptoObservationState source_reported_state = 5;
 CryptoLegKind leg_kind = 6;
 string source_reference = 7;
 string occurrence_key = 8;
 string disposition = 9;
 string posting_state = 10;
 string budget_state = 11;
 repeated string holds = 12;
 string book_account_status = 13;
 // A candidate leg interpretation, not accepted inventory or valuation.
 string candidate_effect_atomic = 14;
 bool correction_requires_original_receipt = 15;
 string address = 16;
 // Block-specific chain evidence revision for an economic occurrence. This
 // changes when a transaction is re-included in a different block; the
 // occurrence_key remains stable across that change.
 string inclusion_revision = 17;
}

// Treasury is the chain evidence owner. These identifiers resolve its durable
// check and wallet; source_reference is provenance, never a bearer credential.
message TreasuryReceiptLink {
  string check_id = 1;
  string wallet_id = 2;
  string operator_identity = 3;
  string source_reference = 4;
}

// A declared valuation of the entire occurrence, kept separate from the exact
// token amount. No exchange rate or stablecoin peg is inferred by Money Ledger.
message CryptoValuation {
  int64 amount_minor = 1;
  string currency = 2;
  string basis_reference = 3;
  google.protobuf.Timestamp valued_at = 4;
  shared.Basis basis = 5;
}

// The verified payer address is always retained. Payer identity may be known
// before LPBS creates a funding lot, so the lot ID and owner are optional as a
// pair. An accepted receipt is immutable; a lot created after acceptance is
// linked by Treasury's separate owner-attribution record.
message CryptoPayerAttribution {
  string payer_address = 1;
  string payer_identity = 2;
  string credit_lot_id = 3;
  string credit_lot_owner = 4;
}

enum CryptoReceiptAction {
  CRYPTO_RECEIPT_ACTION_UNSPECIFIED = 0;
  CRYPTO_RECEIPT_ACTION_ORIGINAL = 1;
  CRYPTO_RECEIPT_ACTION_REINCLUSION = 2;
  CRYPTO_RECEIPT_ACTION_REMOVAL = 3;
  CRYPTO_RECEIPT_ACTION_CORRECTION = 4;
}

message AcceptCryptoReceiptRequest {
  PreviewCryptoObservationRequest observation = 1;
  TreasuryReceiptLink source = 2;
  CryptoReceiptAction action = 3;
  // Root accepted original, required for every mutation of that occurrence.
  string original_receipt_id = 4;
  CryptoValuation valuation = 5;
  CryptoPayerAttribution attribution = 6;
  google.protobuf.Timestamp occurred_at = 7;
  string correction_reason = 8;
  // Immediate accepted predecessor. A stale predecessor cannot change funds.
  string previous_receipt_id = 9;
}

// An immutable acceptance, including the signed effects calculated by the
// ledger. Zero deltas are evidence revisions, not a second payment. A replay
// returns this same identity even when Treasury obtained a new check id.
message AcceptedCryptoReceipt {
  string id = 1;
  string posting_id = 2;
  TreasuryReceiptLink source = 3;
  string occurrence_key = 4;
  string inclusion_revision = 5;
  string atomic_delta = 6;
  int64 valuation_delta_minor = 7;
  string currency = 8;
  google.protobuf.Timestamp accepted_at = 9;
  string original_receipt_id = 10;
  CryptoReceiptAction action = 11;
  CryptoPayerAttribution attribution = 12;
  // The rail has no consumer chargeback process. Reorg/removal and accounting
  // corrections remain possible and must retain their accepted-original link.
  bool no_chargeback = 13;
  string previous_receipt_id = 14;
  PreviewCryptoObservationRequest observation = 15;
  CryptoValuation valuation = 16;
  google.protobuf.Timestamp occurred_at = 17;
  string correction_reason = 18;
  string accepted_by = 19;
}
message AcceptCryptoReceiptResponse { AcceptedCryptoReceipt receipt = 1; bool duplicate = 2; }
message GetCryptoReceiptRequest { string id = 1; }
message GetCryptoReceiptResponse { AcceptedCryptoReceipt receipt = 1; }
message ListCryptoReceiptsRequest { string book_id = 1; string wallet_id = 2; string credit_lot_id = 3; uint32 limit = 4; string after_receipt_id = 5; }
message ListCryptoReceiptsResponse { repeated AcceptedCryptoReceipt receipts = 1; string next_after_receipt_id = 2; }

service IngestService {
 rpc PreviewCryptoObservation(PreviewCryptoObservationRequest) returns (PreviewCryptoObservationResponse);
 rpc AcceptCryptoReceipt(AcceptCryptoReceiptRequest) returns (AcceptCryptoReceiptResponse);
 rpc GetCryptoReceipt(GetCryptoReceiptRequest) returns (GetCryptoReceiptResponse);
 rpc ListCryptoReceipts(ListCryptoReceiptsRequest) returns (ListCryptoReceiptsResponse);
  rpc RegisterAdapter(RegisterAdapterRequest) returns (RegisterAdapterResponse);
  rpc ListAdapters(ListAdaptersRequest) returns (ListAdaptersResponse);
  rpc IngestEvent(IngestEventRequest) returns (IngestEventResponse);
  rpc RunAdapter(RunAdapterRequest) returns (RunAdapterResponse);
  rpc ImportFile(ImportFileRequest) returns (ImportFileResponse);
  rpc ImportOperatorInputs(OperatorImportRequest) returns (OperatorImportResponse);
  rpc OperatorInputStatus(OperatorInputStatusRequest) returns (OperatorInputStatusResponse);
}
