syntax = "proto3";

package vrooli.money_ledger.v1.ledger;

import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";
import "money-ledger/v1/shared/ledger_types.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/money-ledger/v1/ledger;ledger_v1";

message Availability {
  string adapter_id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp last_success_at = 3;
}

message Book { string id = 1; string name = 2; string currency = 3; google.protobuf.Timestamp created_at = 4; }
message Account { string id = 1; string book_id = 2; string name = 3; string kind = 4; google.protobuf.Timestamp created_at = 5; }
message Goal { string id = 1; string name = 2; string metric = 3; string comparator = 4; int64 threshold_minor = 5; int32 sustain_periods = 6; double buffer_multiple = 7; string book_id = 8; }
message GoalVerdict { Goal goal = 1; bool met = 2; int32 sustained_periods = 3; string explanation = 4; int32 required_periods = 5; }

message CreateBookRequest { string name = 1; string currency = 2; }
message CreateBookResponse { Book book = 1; }
message ListBooksRequest {}
message ListBooksResponse { repeated Book books = 1; }
message CreateAccountRequest { string book_id = 1; string name = 2; string kind = 3; }
message CreateAccountResponse { Account account = 1; }
message ListAccountsRequest { string book_id = 1; }
message ListAccountsResponse { repeated Account accounts = 1; }
message GetPostingRequest { string posting_id = 1; }
message GetPostingResponse { shared.Posting posting = 1; }
message ListPostingsRequest { string account_id = 1; string book_id = 2; int32 limit = 3; string from = 4; string to = 5; }
message ListPostingsResponse { repeated shared.Posting postings = 1; }
message ReversePostingRequest { string posting_id = 1; string reason = 2; }
message ReversePostingResponse { shared.Posting posting = 1; }
message TransferRequest { string from_account_id = 1; string to_account_id = 2; int64 amount_minor = 3; string currency = 4; string external_id = 5; string description = 6; google.protobuf.Timestamp occurred_at = 7; }
message TransferResponse { repeated shared.Posting postings = 1; }
message PositionRequest { string book_id = 1; string from = 2; string to = 3; }
message PositionInput { string source = 1; shared.Basis basis = 2; int64 age_seconds = 3; bool available = 4; string reason = 5; }
message PositionResponse { int64 cash_minor = 1; int64 revenue_minor = 2; int64 expense_minor = 3; int64 burn_minor = 4; double runway_months = 5; string currency = 6; bool partial = 7; repeated Availability availability = 8; repeated PositionInput inputs = 9; bool runway_available = 10; string runway_reason = 11; }
message StatementRequest { string book_id = 1; string from = 2; string to = 3; }
message StatementResponse { string book_id = 1; string currency = 2; int64 opening_cash_minor = 3; int64 inflow_minor = 4; int64 outflow_minor = 5; int64 closing_cash_minor = 6; int64 revenue_minor = 7; int64 expense_minor = 8; bool partial = 9; repeated Availability availability = 10; int64 assets_minor = 11; int64 liabilities_minor = 12; string from = 13; string to = 14; }
message DeclareGoalRequest { Goal goal = 1 [(buf.validate.field).required = true]; }
message DeclareGoalResponse { Goal goal = 1; }
message ListGoalsRequest { string book_id = 1; }
message ListGoalsResponse { repeated GoalVerdict goals = 1; }

service BooksService {
  rpc CreateBook(CreateBookRequest) returns (CreateBookResponse);
  rpc ListBooks(ListBooksRequest) returns (ListBooksResponse);
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
}
service JournalService {
  rpc GetPosting(GetPostingRequest) returns (GetPostingResponse);
  rpc ListPostings(ListPostingsRequest) returns (ListPostingsResponse);
  rpc ReversePosting(ReversePostingRequest) returns (ReversePostingResponse);
  rpc Transfer(TransferRequest) returns (TransferResponse);
}
service PositionService {
  rpc GetPosition(PositionRequest) returns (PositionResponse);
  rpc GetStatement(StatementRequest) returns (StatementResponse);
  rpc DeclareGoal(DeclareGoalRequest) returns (DeclareGoalResponse);
  rpc ListGoals(ListGoalsRequest) returns (ListGoalsResponse);
}
