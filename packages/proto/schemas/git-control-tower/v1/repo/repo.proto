  string author = 2;
  string date = 3;
  string subject = 4;
  repeated string files = 5;
  repeated CommitCheckRun checks = 6;
}

message GetRepoHistoryResponse {
  string repo_dir = 1;
  repeated string lines = 2;
  repeated RepoHistoryEntry entries = 3;
  int32 limit = 4;
  string grep_pattern = 5;
  string timestamp = 6;
}

message GetApprovedChangesRequest {
