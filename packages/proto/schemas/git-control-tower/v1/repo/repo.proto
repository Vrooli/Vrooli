  int32 behind = 5;
  bool has_upstream = 6;
  bool can_push = 7;
  bool can_pull = 8;
  bool needs_pull = 9;
  bool needs_push = 10;
  bool has_uncommitted_changes = 11;
  repeated string safety_warnings = 12;
  repeated string recommendations = 13;
  bool fetched = 14;
  string fetch_error = 15;
  string timestamp = 16;
}

message GetFilesRequest {
