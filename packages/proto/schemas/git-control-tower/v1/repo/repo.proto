syntax = "proto3";

package vrooli.git_control_tower.v1.repo;

import "buf/validate/validate.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/git-control-tower/v1/repo;repo_v1";

// =============================================================================
// REPO DOMAIN — repository status (Connect-RPC surface)
// =============================================================================
//
// @stability beta
//
// RepoService is the Connect-RPC landing surface for repository operations.
// Typed callers must use this generated service. The remaining REST routes
// are migration residue and are not an alternate writer contract; each must
// either move here or be justified as a documented transport exception.
//
// Transport/domain tests use GitRunner and worktree.Inspector fakes.
// Production-adapter contract tests may use isolated temporary repositories;
// they must never target a live checkout or an external remote.
// =============================================================================

service RepoService {
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc GetActiveRepository(GetActiveRepositoryRequest) returns (GetActiveRepositoryResponse);
  rpc SetActiveRepository(SetActiveRepositoryRequest) returns (RepoMutationResponse);
  rpc OpenRepository(OpenRepositoryRequest) returns (RepoMutationResponse);
  rpc CloneRepository(CloneRepositoryRequest) returns (RepoMutationResponse);
  rpc RemoveRepository(RemoveRepositoryRequest) returns (RemoveRepositoryResponse);
  rpc GetRepoStatus(GetRepoStatusRequest) returns (GetRepoStatusResponse);
  rpc GetRepoDiff(GetRepoDiffRequest) returns (GetRepoDiffResponse);
  rpc GetRepoGroups(GetRepoGroupsRequest) returns (GetRepoGroupsResponse);
  rpc GetSyncStatus(GetSyncStatusRequest) returns (GetSyncStatusResponse);
  rpc GetRepoHistory(GetRepoHistoryRequest) returns (GetRepoHistoryResponse);
  rpc GetApprovedChanges(GetApprovedChangesRequest) returns (GetApprovedChangesResponse);
  rpc GetProvenance(GetProvenanceRequest) returns (GetProvenanceResponse);
  // GetBlame is the bounded typed provenance contract. Native line blame,
  // file/change evidence, and maintenance context remain separate fields.
  rpc GetBlame(GetBlameRequest) returns (GetBlameResponse);
  rpc SearchProvenance(SearchProvenanceRequest) returns (SearchProvenanceResponse);
  rpc GetFiles(GetFilesRequest) returns (GetFilesResponse);
  rpc GetDirectoryContents(GetDirectoryContentsRequest) returns (GetDirectoryContentsResponse);
  rpc GetRelatedFiles(GetRelatedFilesRequest) returns (GetRelatedFilesResponse);
  rpc SearchContent(SearchContentRequest) returns (SearchContentResponse);
  rpc DeletePath(DeletePathRequest) returns (DeletePathResponse);
  rpc SaveFileContent(SaveFileContentRequest) returns (SaveFileContentResponse);
  rpc DiscardFiles(DiscardFilesRequest) returns (DiscardFilesResponse);
  rpc IgnorePath(IgnorePathRequest) returns (IgnorePathResponse);
  rpc InspectPushSafety(InspectPushSafetyRequest) returns (PushSafetyReport);
  rpc GetPushRecovery(GetPushRecoveryRequest) returns (PushRecoveryArtifact);
  rpc PreparePushRecovery(PreparePushRecoveryRequest) returns (PushRecoveryArtifact);
  rpc PushToRemote(PushToRemoteRequest) returns (PushToRemoteResponse);
  rpc PullFromRemote(PullFromRemoteRequest) returns (PullFromRemoteResponse);
  rpc RunUpstreamAction(RunUpstreamActionRequest) returns (RunUpstreamActionResponse);
  rpc GetGroupingRules(GetGroupingRulesRequest) returns (GroupingRulesResponse);
  rpc SaveGroupingRules(SaveGroupingRulesRequest) returns (GroupingRulesResponse);
  rpc GetGitignoreHealth(GetGitignoreHealthRequest) returns (GitignoreHealthResponse);
  rpc MoveGitignoreEntry(MoveGitignoreEntryRequest) returns (MoveGitignoreEntryResponse);
  rpc GetTrackedBinaries(GetTrackedBinariesRequest) returns (TrackedBinariesResponse);
  rpc UntrackBinary(UntrackBinaryRequest) returns (UntrackBinaryResponse);
  rpc GetPrecommitConfig(GetPrecommitConfigRequest) returns (PrecommitConfigResponse);
  rpc SavePrecommitConfig(SavePrecommitConfigRequest) returns (PrecommitConfigResponse);
  rpc RunPrecommit(RunPrecommitRequest) returns (PrecommitRunResponse);
  rpc StageFiles(StageFilesRequest) returns (StageFilesResponse);
  rpc UnstageFiles(UnstageFilesRequest) returns (UnstageFilesResponse);
  rpc CreateCommit(CreateCommitRequest) returns (CreateCommitResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (CredentialsListResponse);
  rpc SaveCredential(SaveCredentialRequest) returns (CredentialSaveResponse);
  rpc DeleteCredential(DeleteCredentialRequest) returns (CredentialDeleteResponse);
  rpc TestCredential(TestCredentialRequest) returns (CredentialTestResponse);
  rpc UpdateRemoteURL(UpdateRemoteURLRequest) returns (RemoteURLUpdateResponse);
  rpc ListSSHKeys(ListSSHKeysRequest) returns (SSHListKeysResponse);
  rpc GenerateSSHKey(GenerateSSHKeyRequest) returns (SSHGenerateKeyResponse);
  rpc GetSSHPublicKey(GetSSHPublicKeyRequest) returns (SSHGetPublicKeyResponse);
  rpc TestSSHConnection(TestSSHConnectionRequest) returns (SSHTestConnectionResponse);
  rpc DeleteSSHKey(DeleteSSHKeyRequest) returns (SSHDeleteKeyResponse);
}

message RepoRecord {
  int64 id = 1;
  string path = 2;
  string name = 3;
  string remote_url = 4;
  string added_at = 5;
  string last_opened_at = 6;
  bool favorite = 7;
}

message ListRepositoriesRequest {}

message ListRepositoriesResponse {
  repeated RepoRecord repos = 1;
  int64 active_id = 2;
  string timestamp = 3;
}

message GetActiveRepositoryRequest {}

message GetActiveRepositoryResponse {
  RepoRecord repo = 1;
  string timestamp = 2;
}

message GetRepoHistoryRequest {
