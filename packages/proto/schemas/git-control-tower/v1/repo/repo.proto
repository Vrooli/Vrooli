message UpdateRemoteURLRequest {
  string repository_id = 1;
  string intent_id = 2;
  string remote = 3;
  string url = 4;
}

message RemoteURLUpdateResponse {
  bool success = 1;
  string old_url = 2;
  string new_url = 3;
  string error = 4;
  string timestamp = 5;
}

message SSHKeyInfo {
  string path = 1;
  string filename = 2;
  string type = 3;
  int32 bits = 4;
  string fingerprint = 5;
  string comment = 6;
  string created_at = 7;
  bool has_public = 8;
}

message ListSSHKeysRequest {}

message SSHListKeysResponse {
  repeated SSHKeyInfo keys = 1;
  string ssh_dir = 2;
  string timestamp = 3;
}

message GenerateSSHKeyRequest {
  string repository_id = 1;
  string intent_id = 2;
  string type = 3;
  int32 bits = 4;
  string comment = 5;
  string filename = 6;
}

message SSHGenerateKeyResponse {
  bool success = 1;
  SSHKeyInfo key = 2;
  string public_key = 3;
  string error = 4;
  string timestamp = 5;
}

message GetSSHPublicKeyRequest {
  string key_path = 1;
}

message SSHGetPublicKeyResponse {
  bool success = 1;
  string public_key = 2;
  string fingerprint = 3;
  string error = 4;
  string timestamp = 5;
}

message TestSSHConnectionRequest {
  string key_path = 1;
}

message SSHTestConnectionResponse {
  bool success = 1;
  string status = 2;
  string message = 3;
  string hint = 4;
  string github_user = 5;
  string fingerprint = 6;
  int64 latency_ms = 7;
  string timestamp = 8;
}

message DeleteSSHKeyRequest {
  string repository_id = 1;
  string intent_id = 2;
  string key_path = 3;
}

message SSHDeleteKeyResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
  bool private_deleted = 4;
  bool public_deleted = 5;
  string timestamp = 6;
}

// Unknown never means safe. Complete covers file sizes, not all remote policies.
message InspectPushSafetyRequest { string repository_id = 1; string remote = 2; string branch = 3; }
message PushSafetyFile { string oid = 1; int64 bytes = 2; repeated string paths = 3; repeated string commits = 4; bool blocked = 5; }
message PushSafetyReport {
 bool complete = 1; string state = 2; string reason = 3;
 string head = 4; string base = 5; string remote = 6; string branch = 7;
 int64 limit = 8; repeated string commits = 9; repeated PushSafetyFile files = 10;
 string fingerprint = 11; bool can_prepare = 12; string recovery_reason = 13;
 // Advisory index snapshot, separate from immutable recovery approval.
 bool staged_complete = 14; string staged_reason = 15; repeated PushSafetyFile staged_files = 16;
}
// Writes only owner-managed isolated artifacts. Never activates or publishes.
message PreparePushRecoveryRequest {
 string repository_id = 1; string intent_id = 2; string remote = 3; string branch = 4;
 string fingerprint = 5;
}
message RecoveryCommitMapping { string original = 1; string replacement = 2; }
message PushRecoveryArtifact {
 string state = 1; string message = 2; string fingerprint = 3;
 string head = 4; string base = 5; string candidate = 6;
 string original_bundle = 7; string repaired_bundle = 8;
 repeated RecoveryCommitMapping mappings = 9; repeated string paths = 10;
 bool signatures_removed = 11;
}

message GetPushRecoveryRequest { string repository_id = 1; string fingerprint = 2; }
