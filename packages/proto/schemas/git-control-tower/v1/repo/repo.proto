message GetBlameRequest {
  string repository_id = 1;
  repeated string paths = 2;
  string revision = 3;
  int32 start_line = 4;
  int32 end_line = 5;
  int32 max_paths = 6;
  int32 max_lines = 7;
  int32 max_bytes = 8;
  bool enrich = 9;
}

message BlameLine {
  int32 line = 1;
  string content = 2;
  string commit = 3;
  string author = 4;
  string author_time = 5;
  string subject = 6;
  int32 original_line = 7;
  string original_path = 8;
}

message ProvenanceWorkReference {
  string kind = 1;
  string id = 2;
  string revision = 3;
  string relationship = 4;
  bool verified = 5;
  string visibility = 6;
  string state = 7;
  string unavailable_reason = 8;
}

message BlameEvidence {
  string run_id = 1;
  string sandbox_id = 2;
  string application_receipt = 3;
  string content_digest = 4;
  string commit_id = 5;
  string visibility = 6;
  string commit_state = 7;
  string run_outcome = 8;
  string conversation_id = 9;
  double cost_usd = 10;
  string committed_at = 11;
  repeated string unavailable = 12;
  repeated ProvenanceWorkReference work_references = 13;
}

message BlameFile {
  string path = 1;
  string status = 2;
  repeated BlameLine lines = 3;
  string content_digest = 4;
  string reason = 5;
  string standing = 6;
  repeated string downgrade_reasons = 7;
  repeated BlameEvidence evidence = 8;
}

message ProvenanceChangeBundle {
  string run_id = 1;
  string sandbox_id = 2;
  repeated string files = 3;
  string run_outcome = 4;
  string conversation_id = 5;
  double cost_usd = 6;
  repeated ProvenanceWorkReference work_references = 7;
  repeated string gaps = 8;
}

message GetBlameResponse {
  string revision = 1;
  repeated BlameFile files = 2;
  bool truncated = 3;
  repeated string warnings = 4;
  repeated ProvenanceChangeBundle change_bundles = 5;
}

message SearchProvenanceRequest {
  int64 repository_id = 1;
  string query = 2;
  int32 limit = 3;
  string scope = 4;
}

message ProvenanceSearchHit {
  string id = 1;
  string title = 2;
  string snippet = 3;
  double score = 4;
  string run_id = 5;
  string sandbox_id = 6;
  string relative_path = 7;
  string evidence_standing = 8;
}

message SearchProvenanceResponse {
  bool available = 1;
  repeated ProvenanceSearchHit results = 2;
  string warning = 3;
}

message SetActiveRepositoryRequest {
  int64 repository_id = 1;
}

message OpenRepositoryRequest {
  string path = 1;
}

message CloneRepositoryRequest {
  string url = 1;
  string destination = 2;
}

message RepoMutationResponse {
  RepoRecord repo = 1;
  string timestamp = 2;
}

message RemoveRepositoryRequest {
  int64 repository_id = 1;
}

message RemoveRepositoryResponse {
  bool removed = 1;
  string timestamp = 2;
}

message GetRepoStatusRequest {
  // Registered repository id. When empty, the server resolves the active
  // repository or the repository containing the request's working directory.
  string repository_id = 1;

  // Absolute path on disk; may be a main or linked worktree of the repo.
  string repo_path = 2;

  // Include the more expensive per-file log-frequency map.
  bool include_hotspots = 3;
}

// WorktreeIdentity captures the Tier-1 passive-awareness fields about
// where the repo_path actually points.
message WorktreeIdentity {
  // True when repo_path is a linked worktree (not the main worktree).
  bool is_linked_worktree = 1;

  // Common repo root (the main `.git` directory's parent). Same value
  // for all worktrees of one repository.
  string common_repo_root = 2;

  // Short name of the current worktree (last path segment).
  string worktree_name = 3;

  // Commit hash currently checked out in this worktree.
  string worktree_head = 4;

  // Total number of worktrees registered for this repo (main + linked).
  int32 linked_worktree_count = 5;
}

message GetRepoStatusResponse {
  // Currently-active branch (empty when detached HEAD).
  string branch = 1;

  // True when HEAD is detached.
  bool detached = 2;

  // Worktree identity fields (Tier 1 passive awareness).
  WorktreeIdentity worktree = 3;

  BranchStatus branch_status = 4;
  FilesStatus files = 5;
  FileStats file_stats = 6;
  map<string, int32> file_hotspots = 7;
  map<string, StringList> scopes = 8;
  StatusSummary summary = 9;
  AuthorStatus author = 10;
  string repo_dir = 11;
  string timestamp = 12;
}

message BranchStatus {
  string head = 1;
  string upstream = 2;
  int32 ahead = 3;
  int32 behind = 4;
  string oid = 5;
}

message FilesStatus {
  repeated string staged = 1;
  repeated string unstaged = 2;
  repeated string untracked = 3;
  repeated string conflicts = 4;
  repeated string binary = 5;
  repeated string ignored = 6;
  map<string, string> statuses = 7;
  map<string, string> renames = 8;
}

message FileStats {
  map<string, DiffStats> staged = 1;
  map<string, DiffStats> unstaged = 2;
  map<string, DiffStats> untracked = 3;
}

message DiffStats {
  int32 additions = 1;
  int32 deletions = 2;
  int32 files = 3;
  int32 net_lines = 4;
  int32 hunk_count = 5;
  int32 largest_hunk = 6;
  double density = 7;
  bool is_binary = 8;
  bool is_rename = 9;
  string old_path = 10;
  int32 comment_additions = 11;
  int32 comment_deletions = 12;
  bool is_new_file = 13;
  bool is_deleted_file = 14;
}

message StringList {
  repeated string values = 1;
}

message StatusSummary {
  int32 staged = 1;
  int32 unstaged = 2;
  int32 untracked = 3;
  int32 conflicts = 4;
  int32 ignored = 5;
}

message AuthorStatus {
  string name = 1;
  string email = 2;
}

message GetRepoDiffRequest {
  string repository_id = 1;
  string repo_path = 2;
  string path = 3;
  bool staged = 4;
  bool untracked = 5;
  string base = 6;
  string commit = 7;
  string mode = 8;
  bool any = 9;
}

message GetRepoDiffResponse {
  string repo_dir = 1;
  string path = 2;
  bool staged = 3;
  bool untracked = 4;
  string base = 5;
  bool has_diff = 6;
  repeated DiffHunk hunks = 7;
  DiffStats stats = 8;
  string raw = 9;
  string full_content = 10;
  string content_hash = 11;
  repeated AnnotatedLine annotated_lines = 12;
  string mode = 13;
  string timestamp = 14;
}

message DiffHunk {
  int32 old_start = 1;
  int32 old_count = 2;
  int32 new_start = 3;
  int32 new_count = 4;
  string header = 5;
  repeated string lines = 6;
}

message AnnotatedLine {
  int32 number = 1;
  string content = 2;
  string change = 3;
  int32 old_number = 4;
}

message GetRepoGroupsRequest {
  string repository_id = 1;
  string repo_path = 2;
}

message GetRepoGroupsResponse {
  repeated ChangeGroup groups = 1;
}

message ChangeGroup {
  string key = 1;
  string kind = 2;
  string id = 3;
  string label = 4;
  string root = 5;
  string source = 6;
  repeated string files = 7;
}

message GetSyncStatusRequest {
  string repository_id = 1;
  string repo_path = 2;
  bool fetch = 3;
  string remote = 4;
}

message GetSyncStatusResponse {
  string branch = 1;
