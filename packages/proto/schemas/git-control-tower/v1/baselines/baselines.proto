syntax = "proto3";

package vrooli.git_control_tower.v1.baselines;

import "test-genie/v1/runs/runs.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/git-control-tower/v1/baselines;baselines_v1";

// =============================================================================
// BASELINES DOMAIN — one immutable Test Genie run per baseline
// =============================================================================
// @layer 5
// @domain baselines
// @stability unstable
//
// Test Genie owns phase descriptors, comparison semantics, and typed evidence.
// GCT stores one comprehensive run identity and forwards the owning messages
// without phase or surface registries.

service BaselinesService {
  rpc SnapshotForBaseline(SnapshotForBaselineRequest) returns (SnapshotForBaselineResponse);
  rpc GetSnapshotStatus(GetSnapshotStatusRequest) returns (GetSnapshotStatusResponse);
  rpc GetBaseline(GetBaselineRequest) returns (GetBaselineResponse);
  rpc ListBaselines(ListBaselinesRequest) returns (ListBaselinesResponse);
  rpc StartDiff(StartDiffRequest) returns (StartDiffResponse);
  rpc GetDiffResult(GetDiffResultRequest) returns (GetDiffResultResponse);
  rpc DeleteBaseline(DeleteBaselineRequest) returns (DeleteBaselineResponse);
  // Collections aggregate existing per-scenario immutable anchors. They do not
  // create a multi-scenario Test Genie run or alter comparison semantics.
  rpc StartCollectionCapture(StartCollectionCaptureRequest) returns (StartCollectionCaptureResponse);
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse);
  // Adds new before-state members to an existing collection. Existing members
  // and source evidence are immutable once capture has started.
  rpc ExtendCollection(ExtendCollectionRequest) returns (ExtendCollectionResponse);
  rpc StartCollectionDiff(StartCollectionDiffRequest) returns (StartCollectionDiffResponse);
  rpc GetCollectionDiff(GetCollectionDiffRequest) returns (GetCollectionDiffResponse);
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);
  // Path snapshots are separately classified source evidence. They never
  // participate in Test Genie regression verdicts.
  rpc EstimatePathSnapshot(EstimatePathSnapshotRequest) returns (EstimatePathSnapshotResponse);
  rpc CapturePathSnapshot(CapturePathSnapshotRequest) returns (CapturePathSnapshotResponse);
  rpc GetPathSnapshot(GetPathSnapshotRequest) returns (GetPathSnapshotResponse);
  rpc DiffPathSnapshots(DiffPathSnapshotsRequest) returns (DiffPathSnapshotsResponse);
  rpc DeletePathSnapshot(DeletePathSnapshotRequest) returns (DeletePathSnapshotResponse);
}

message GitState {
  string sha = 1;
  string branch = 2;
  bool detached = 3;
  bool dirty = 4;
  string dirty_summary = 5;
  string commit_message = 6;
  string commit_author = 7;
  string commit_date = 8;
  bool sandboxed = 9;
}

message RunAnchor {
  string run_id = 1;
  string captured_at = 2;
  string capture_profile = 3;
  string tree_digest = 4;
  string phase_set_digest = 5;
  // Opaque run-owned identity; never a filesystem path.
  string descriptor_snapshot_ref = 6;
  string descriptor_snapshot_digest = 7;
  int32 descriptor_snapshot_schema_version = 8;
}

message MigrationInfo {
  int32 from_schema_version = 1;
  string migrated_at = 2;
  repeated string degraded_reasons = 3;
}

message BaselineManifest {
  string name = 1;
  string scenario = 2;
  string branch = 3;
  string created_at = 4;
  string created_by = 5;
  GitState git = 6;
  RunAnchor run = 7;
  int32 schema_version = 8;
  MigrationInfo migration = 9;
}

message Staleness {
  int32 commits_since = 1;
  int32 files_changed = 2;
  bool likely_stale = 3;
}

message RunArtifactCatalog {
  string run_id = 1;
  int32 schema_version = 2;
  string digest = 3;
  repeated vrooli.test_genie.v1.runs.ArtifactRef artifacts = 4;
  bool legacy_discovered = 5;
  repeated string degraded_reasons = 6;
}

message VisualDelta {
  string page = 1;
  string label = 2;
  string status = 3;
  double changed_fraction = 4;
}

message EvidenceComparison {
  string base_run_id = 1;
  string current_run_id = 2;
  RunArtifactCatalog base_catalog = 3;
  RunArtifactCatalog current_catalog = 4;
  repeated VisualDelta visual_deltas = 5;
  repeated string degraded_reasons = 6;
  repeated string blocking_reasons = 7;
  repeated string advisory_warnings = 8;
  // complete | incomplete
  string evidence_status = 9;
}

message SnapshotForBaselineRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  reserved 4, 5;
  string created_by = 6;
  string reason = 7;
  int64 repo_id = 8;
}

message SnapshotForBaselineResponse {
  string run_id = 1;
  string scenario = 2;
  string name = 3;
  string branch = 4;
  int32 estimated_total_seconds = 5;
  bool eta_known = 6;
  string dirty_warning = 7;
  bool coalesced = 8;
}

message GetSnapshotStatusRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  string run_id = 4;
  int64 repo_id = 5;
  bool wait = 6;
}

message GetSnapshotStatusResponse {
  string status = 1;
  string scenario = 2;
  string name = 3;
  string branch = 4;
  string run_id = 5;
  string run_status = 6;
  BaselineManifest baseline = 7;
  string error = 8;
  repeated string similar_baselines = 9;
  int32 recommended_next_check_seconds = 10;
}

message GetBaselineRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  int64 repo_id = 4;
}

message GetBaselineResponse {
  BaselineManifest baseline = 1;
}

message ListBaselinesRequest {
  string scenario = 1;
  string branch = 2;
  bool all_branches = 3;
  int64 repo_id = 4;
}

message ListBaselinesResponse {
  repeated BaselineManifest baselines = 1;
}

message StartDiffRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  reserved 4;
  int64 repo_id = 5;
}

message StartDiffResponse {
  string run_id = 1;
  string scenario = 2;
  string name = 3;
  string branch = 4;
  int32 estimated_total_seconds = 5;
  bool eta_known = 6;
  bool coalesced = 7;
  bool reused_run = 8;
  string reused_sha = 9;
  string dirty_warning = 10;
}

message GetDiffResultRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  string run_id = 4;
  reserved 5;
  int64 repo_id = 6;
  bool wait = 7;
  bool latest = 8;
}

message GetDiffResultResponse {
  string status = 1;
  DiffResult diff = 2;
  string error = 3;
  int32 recommended_next_check_seconds = 4;
  string run_id = 5;
}

message DiffResult {
  BaselineManifest baseline = 1;
  GitState current_git = 2;
  Staleness staleness = 3;
  reserved 4;
  string verdict = 5;
  string dirty_warning = 6;
  repeated vrooli.test_genie.v1.runs.PhaseDiff phases = 7;
  EvidenceComparison evidence = 8;
}

message RunBusyInfo {
  string scenario = 1;
  string run_id = 2;
  string preset = 3;
}

message DeleteBaselineRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  int64 repo_id = 4;
}

message DeleteBaselineResponse {
  bool deleted = 1;
}

message CollectionTarget {
  string scenario = 1;
  string baseline_name = 2;
  bool required = 3;
}

message CollectionMember {
  string scenario = 1;
  string baseline_name = 2;
  bool required = 3;
  // pending | ready | failed | skipped | stale
  string status = 4;
  string run_id = 5;
  string error = 6;
  string updated_at = 7;
  string git_sha = 8;
}

message CollectionCoverage {
  int32 required = 1;
  int32 ready = 2;
  int32 pending = 3;
  int32 failed = 4;
  int32 skipped = 5;
  int32 stale = 6;
  bool complete = 7;
}

message BaselineCollection {
  string name = 1;
  string branch = 2;
  string created_at = 3;
  string updated_at = 4;
  int32 schema_version = 5;
  repeated CollectionMember members = 6;
  CollectionCoverage coverage = 7;
  // Informational source-evidence snapshots attached at collection capture.
  repeated PathSnapshotReference path_snapshots = 8;
}

message StartCollectionCaptureRequest {
  string name = 1;
  string branch = 2;
  repeated CollectionTarget targets = 3;
  string created_by = 4;
  string reason = 5;
  int64 repo_id = 6;
  // Safe repo-relative globs. Empty means no source evidence requested.
  repeated string path_selections = 7;
  bool include_ignored = 8;
  bool retain_content = 9;
}

message StartCollectionCaptureResponse {
  BaselineCollection collection = 1;
  bool resumed = 2;
}

message GetCollectionRequest {
  string name = 1;
  string branch = 2;
  int64 repo_id = 3;
  // When true, reattach server-side to durable pending member runs before
  // returning the current aggregate coverage.
  bool wait = 4;
}

message GetCollectionResponse {
  BaselineCollection collection = 1;
  CollectionWaitOutcome wait_outcome = 2;
}

message CollectionWaitOutcome {
  // complete | incomplete | member-failed | transport-failed
  string kind = 1;
  repeated string pending_run_ids = 2;
  repeated string recovery_commands = 3;
  string detail = 4;
}

message ExtendCollectionRequest {
  string name = 1;
  string branch = 2;
  repeated CollectionTarget targets = 3;
  string created_by = 4;
  string reason = 5;
  int64 repo_id = 6;
}

message ExtendCollectionResponse {
  BaselineCollection collection = 1;
  repeated string added_scenarios = 2;
  bool resumed = 3;
}

message CollectionDiffMember {
  string scenario = 1;
  bool required = 2;
  // pending | ready | failed | skipped | stale | not-comparable
  string status = 3;
  string run_id = 4;
  string verdict = 5;
  string detail = 6;
}

// Starts only explicitly selected members; an empty selection means every
// collection member. The resulting child run IDs are durable diff handles.
message StartCollectionDiffRequest {
  string name = 1;
  string branch = 2;
  repeated string scenarios = 3;
  int64 repo_id = 4;
  // Required caller-supplied idempotency key for the durable aggregate.
  string operation_id = 5;
}

message StartCollectionDiffResponse {
  BaselineCollection collection = 1;
  repeated CollectionDiffMember members = 2;
  string classification = 3;
  string operation_id = 4;
}

message GetCollectionDiffRequest {
  string name = 1;
  string branch = 2;
  string operation_id = 3;
  int64 repo_id = 4;
  bool wait = 5;
}

message GetCollectionDiffResponse {
  BaselineCollection collection = 1;
  repeated CollectionDiffMember members = 2;
  string classification = 3;
  string operation_id = 4;
  CollectionWaitOutcome wait_outcome = 5;
}

message DeleteCollectionRequest {
  string name = 1;
  string branch = 2;
  int64 repo_id = 3;
}

message DeleteCollectionResponse {
  bool deleted = 1;
}

message PathSnapshotReference {
  string name = 1;
  string branch = 2;
  string created_at = 3;
}

message PathEntry {
  string path = 1;
  uint32 mode = 2;
  string type = 3;
  int64 size = 4;
  string digest = 5;
  // present | excluded | unreadable. Omitted bytes are never returned.
  string state = 6;
  string detail = 7;
}

message PathSnapshot {
  string name = 1;
  string branch = 2;
  string created_at = 3;
  int32 schema_version = 4;
  repeated string selections = 5;
  repeated PathEntry entries = 6;
  string classification = 7;
  // RFC3339 UTC expiry for bounded retained source evidence.
  string expires_at = 8;
  bool include_ignored = 9;
  bool retain_content = 10;
  // Zero is a legacy snapshot; nonzero identifies the source-selection policy.
  int32 policy_version = 11;
}

message PathSnapshotContributor {
  string path = 1;
  int32 files = 2;
  int64 bytes = 3;
}

message PathSnapshotIssue {
  string code = 1;
  string severity = 2;
  string detail = 3;
}

message PathSnapshotRecommendation {
  string selection = 1;
  string reason = 2;
}

// A preflight only. It is the single authority for source selection policy
// used by direct capture and Plan Manager; it never starts Test Genie work.
message PathSnapshotEstimate {
  repeated string selections = 1;
  bool include_ignored = 2;
  bool retain_content = 3;
  int32 eligible_files = 4;
  int64 eligible_bytes = 5;
  int32 excluded_ignored_files = 6;
  int64 excluded_ignored_bytes = 7;
  int32 excluded_sensitive_files = 8;
  int32 excluded_binary_files = 9;
  int32 oversized_files = 10;
  int64 retained_content_bytes = 11;
  repeated PathSnapshotContributor top_contributors = 12;
  repeated PathSnapshotIssue issues = 13;
  repeated PathSnapshotRecommendation recommendations = 14;
  bool repair_required = 15;
  int32 policy_version = 16;
}

message EstimatePathSnapshotRequest {
  repeated string selections = 1;
  int64 repo_id = 2;
  bool include_ignored = 3;
  bool retain_content = 4;
}

message EstimatePathSnapshotResponse {
  PathSnapshotEstimate estimate = 1;
}

// Returned as a typed Connect error detail when capture is refused before any
// source-evidence record is written. Call EstimatePathSnapshot to inspect the
// same report proactively.
message PathSnapshotPolicyViolation {
  PathSnapshotEstimate estimate = 1;
}

message SourceDelta {
  string path = 1;
  // added | deleted | renamed | modified | unchanged | excluded | unreadable
  string status = 2;
  PathEntry before = 3;
  PathEntry after = 4;
}

message CapturePathSnapshotRequest {
  string name = 1;
  string branch = 2;
  repeated string selections = 3;
  int64 repo_id = 4;
  // Optional bounded retention period. Zero selects the seven-day default.
  int64 retention_seconds = 5;
  bool include_ignored = 6;
  bool retain_content = 7;
}

message CapturePathSnapshotResponse {
  PathSnapshot snapshot = 1;
  bool resumed = 2;
}

message GetPathSnapshotRequest {
  string name = 1;
  string branch = 2;
  int64 repo_id = 3;
}

message GetPathSnapshotResponse {
  PathSnapshot snapshot = 1;
}

message DiffPathSnapshotsRequest {
  string before_name = 1;
  string after_name = 2;
  string branch = 3;
  int64 repo_id = 4;
  // Optional safe glob filter for a phase-scoped informational review.
  repeated string selections = 5;
}

message DiffPathSnapshotsResponse {
  string classification = 1;
  repeated SourceDelta deltas = 2;
}

message DeletePathSnapshotRequest {
  string name = 1;
  string branch = 2;
  int64 repo_id = 3;
}

message DeletePathSnapshotResponse {
  bool deleted = 1;
}
