syntax = "proto3";

package vrooli.git_control_tower.v1.baselines;

import "test-genie/v1/runs/runs.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/git-control-tower/v1/baselines;baselines_v1";

// =============================================================================
// BASELINES DOMAIN — one immutable Test Genie run per baseline
// =============================================================================
// @layer 5
// @domain baselines
// @stability unstable
//
// Test Genie owns phase descriptors, comparison semantics, and typed evidence.
// GCT stores one comprehensive run identity and forwards the owning messages
// without phase or surface registries.

service BaselinesService {
  rpc SnapshotForBaseline(SnapshotForBaselineRequest) returns (SnapshotForBaselineResponse);
  rpc GetSnapshotStatus(GetSnapshotStatusRequest) returns (GetSnapshotStatusResponse);
  rpc GetBaseline(GetBaselineRequest) returns (GetBaselineResponse);
  rpc ListBaselines(ListBaselinesRequest) returns (ListBaselinesResponse);
  rpc StartDiff(StartDiffRequest) returns (StartDiffResponse);
  rpc GetDiffResult(GetDiffResultRequest) returns (GetDiffResultResponse);
  rpc DeleteBaseline(DeleteBaselineRequest) returns (DeleteBaselineResponse);
}

message GitState {
  string sha = 1;
  string branch = 2;
  bool detached = 3;
  bool dirty = 4;
  string dirty_summary = 5;
  string commit_message = 6;
  string commit_author = 7;
  string commit_date = 8;
  bool sandboxed = 9;
}

message RunAnchor {
  string run_id = 1;
  string captured_at = 2;
  string capture_profile = 3;
  string tree_digest = 4;
  string phase_set_digest = 5;
  // Opaque run-owned identity; never a filesystem path.
  string descriptor_snapshot_ref = 6;
  string descriptor_snapshot_digest = 7;
  int32 descriptor_snapshot_schema_version = 8;
}

message MigrationInfo {
  int32 from_schema_version = 1;
  string migrated_at = 2;
  repeated string degraded_reasons = 3;
}

message BaselineManifest {
  string name = 1;
  string scenario = 2;
  string branch = 3;
  string created_at = 4;
  string created_by = 5;
  GitState git = 6;
  RunAnchor run = 7;
  int32 schema_version = 8;
  MigrationInfo migration = 9;
}

message Staleness {
  int32 commits_since = 1;
  int32 files_changed = 2;
  bool likely_stale = 3;
}

message RunArtifactCatalog {
  string run_id = 1;
  int32 schema_version = 2;
  string digest = 3;
  repeated vrooli.test_genie.v1.runs.ArtifactRef artifacts = 4;
  bool legacy_discovered = 5;
  repeated string degraded_reasons = 6;
}

message VisualDelta {
  string page = 1;
  string label = 2;
  string status = 3;
  double changed_fraction = 4;
}

message EvidenceComparison {
  string base_run_id = 1;
  string current_run_id = 2;
  RunArtifactCatalog base_catalog = 3;
  RunArtifactCatalog current_catalog = 4;
  repeated VisualDelta visual_deltas = 5;
  repeated string degraded_reasons = 6;
}

message SnapshotForBaselineRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  reserved 4, 5;
  string created_by = 6;
  string reason = 7;
  int64 repo_id = 8;
}

message SnapshotForBaselineResponse {
  string run_id = 1;
  string scenario = 2;
  string name = 3;
  string branch = 4;
  int32 estimated_total_seconds = 5;
  bool eta_known = 6;
  string dirty_warning = 7;
  bool coalesced = 8;
}

message GetSnapshotStatusRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  string run_id = 4;
  int64 repo_id = 5;
  bool wait = 6;
}

message GetSnapshotStatusResponse {
  string status = 1;
  string scenario = 2;
  string name = 3;
  string branch = 4;
  string run_id = 5;
  string run_status = 6;
  BaselineManifest baseline = 7;
  string error = 8;
  repeated string similar_baselines = 9;
  int32 recommended_next_check_seconds = 10;
}

message GetBaselineRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  int64 repo_id = 4;
}

message GetBaselineResponse { BaselineManifest baseline = 1; }

message ListBaselinesRequest {
  string scenario = 1;
  string branch = 2;
  bool all_branches = 3;
  int64 repo_id = 4;
}

message ListBaselinesResponse { repeated BaselineManifest baselines = 1; }

message StartDiffRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  reserved 4;
  int64 repo_id = 5;
}

message StartDiffResponse {
  string run_id = 1;
  string scenario = 2;
  string name = 3;
  string branch = 4;
  int32 estimated_total_seconds = 5;
  bool eta_known = 6;
  bool coalesced = 7;
  bool reused_run = 8;
  string reused_sha = 9;
  string dirty_warning = 10;
}

message GetDiffResultRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  string run_id = 4;
  reserved 5;
  int64 repo_id = 6;
  bool wait = 7;
  bool latest = 8;
}

message GetDiffResultResponse {
  string status = 1;
  DiffResult diff = 2;
  string error = 3;
  int32 recommended_next_check_seconds = 4;
  string run_id = 5;
}

message DiffResult {
  BaselineManifest baseline = 1;
  GitState current_git = 2;
  Staleness staleness = 3;
  reserved 4;
  string verdict = 5;
  string dirty_warning = 6;
  repeated vrooli.test_genie.v1.runs.PhaseDiff phases = 7;
  EvidenceComparison evidence = 8;
}

message RunBusyInfo {
  string scenario = 1;
  string run_id = 2;
  string preset = 3;
}

message DeleteBaselineRequest {
  string scenario = 1;
  string name = 2;
  string branch = 3;
  int64 repo_id = 4;
}

message DeleteBaselineResponse { bool deleted = 1; }
