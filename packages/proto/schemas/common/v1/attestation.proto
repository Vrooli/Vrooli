syntax = "proto3";

package common.v1;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/common/v1;commonv1";

// =============================================================================
// SHARED ATTESTATION CONTRACT
// =============================================================================
//
// @layer 0
// @domain common
// @stability beta
//
// The canonical honesty contract for "understand the codebase" answers: a claim
// carried with its provenance and two orthogonal honesty axes (Basis +
// Sufficiency) so that trust travels INSIDE the result rather than being folded
// into a relevance score. It is the SSOT shared by every producer that emits an
// attested architectural answer (architecture-cartographer and friends) and by
// every consumer that transports or grades one (search-hub, meta-optimization-
// manager). Producers populate it directly for CLI/RPC use and emit it as JSON
// for the federated search router, which maps it generically via
// ResultMapping.attestation_field — the router never interprets it.
//
// The vocabulary (Basis, Sufficiency) is the canonical attestation contract
// defined in meta-optimization-manager/docs/concepts/COVERAGE-MODEL.md; keep
// these enums in lockstep with that document.
// =============================================================================

// AttestedAnswer is the structured payload of an attested architectural answer:
// a claim about the codebase carried with its provenance and two honesty axes.
message AttestedAnswer {
  // The claim about the codebase, rendered for presentation.
  string claim = 1;
  // Provenance pointers behind the claim (file:line / url / command). The
  // conformance lint requires at least one when basis is DERIVED, VALIDATED, or
  // CONTRADICTED.
  repeated Citation citations = 2;
  // How we know it (epistemic provenance).
  Basis basis = 3;
  // Whether the source is even shaped to answer the question (orthogonal to
  // basis).
  Sufficiency sufficiency = 4;
  // Known gaps in this answer — what it does NOT cover.
  repeated string gaps = 5;
  // Suggested next reads / commands to close the gaps or go deeper.
  repeated string suggested_follow_ups = 6;
}

// Citation is a single provenance pointer behind an attested answer.
message Citation {
  // file:line / url / command — where the claim can be verified.
  string locator = 1;
  // code | doc | contract | runtime | external.
  string kind = 2;
  // Optional human note about what this citation establishes.
  string note = 3;
}

// Basis is the epistemic-provenance axis of the attestation contract: how do we
// know the answer? Ordered most-trusted to least. Keep in lockstep with
// meta-optimization-manager/docs/concepts/COVERAGE-MODEL.md.
enum Basis {
  BASIS_UNSPECIFIED = 0;
  BASIS_DERIVED = 1; // computed directly from code (AST/graph/facts)
  BASIS_VALIDATED = 2; // doc claim checked against code; agrees (zero drift)
  BASIS_DECLARED_UNVERIFIED = 3; // doc claim exists but cannot be fully validated
  BASIS_CONTRADICTED = 4; // doc claim disagrees with code (drift)
  BASIS_ABSENT = 5; // no source of truth; pointer-only
}

// Sufficiency is the coverage axis of the attestation contract: is the source
// even shaped to answer the question? Orthogonal to Basis.
enum Sufficiency {
  SUFFICIENCY_UNSPECIFIED = 0;
  SUFFICIENCY_FULL = 1; // source covers the question completely
  SUFFICIENCY_PARTIAL = 2; // answers part; the rest is gapped
  SUFFICIENCY_INSUFFICIENT = 3; // accurate as far as it goes, but lacks conventions
}
