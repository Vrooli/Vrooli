syntax = "proto3";

package vrooli.signal_inbox.v1.shared;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/signal-inbox/v1/shared;shared_v1";

// @stability beta
// Signal is the scenario-local journal record shared by capture and retrieval
// contracts. Its location prevents either product domain from owning the
// other's wire dependency.
enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_URL = 1;
  SOURCE_KIND_TEXT = 2;
  SOURCE_KIND_IMAGE = 3;
}

message Signal {
  string id = 1;
  SourceKind source_kind = 2;
  string source_identity = 3;
  string source_url = 4;
  google.protobuf.Timestamp captured_at = 5;
  string raw_payload_ref = 6;
  string extracted_content = 7;
  string content_hash = 8;
  bool needs_attention = 9;
  string capture_note = 10;
  repeated string tags = 11;
}
