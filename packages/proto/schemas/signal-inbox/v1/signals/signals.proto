syntax = "proto3";

package vrooli.signal_inbox.v1.signals;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/signal-inbox/v1/signals;signals_v1";

// SignalsService owns the immutable journal. A signal is appended once and is
// never updated or deleted; later domains attach their own records instead.
service SignalsService {
  rpc CaptureSignal(CaptureSignalRequest) returns (CaptureSignalResponse);
  rpc GetSignal(GetSignalRequest) returns (GetSignalResponse);
  rpc ListSignals(ListSignalsRequest) returns (ListSignalsResponse);
}

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_URL = 1;
  SOURCE_KIND_TEXT = 2;
  SOURCE_KIND_IMAGE = 3;
}

message Signal {
  string id = 1;
  SourceKind source_kind = 2;
  string source_identity = 3;
  string source_url = 4;
  google.protobuf.Timestamp captured_at = 5;
  string raw_payload_ref = 6;
  string extracted_content = 7;
  string content_hash = 8;
  bool needs_attention = 9;
  string capture_note = 10;
}

// Exactly one source payload is supplied. The service infers SourceKind from
// the populated variant; callers never declare it.
message CaptureSignalRequest {
  oneof source {
    string url = 1;
    string text = 2;
    string image_payload_ref = 3;
  }
  string capture_note = 4;
}

message CaptureSignalResponse {
  Signal signal = 1;
  // True means the content hash was already present and no journal row was
  // appended by this request.
  bool duplicate = 2;
}

// ImageUpload is the proto-typed metadata response for the multipart REST
// exception. Image bytes remain in BlobStore and never enter a Connect payload.
message ImageUpload {
  string payload_ref = 1;
  string content_type = 2;
  int64 size_bytes = 3;
}

message UploadImageResponse {
  ImageUpload image = 1;
}

message GetSignalRequest {
  string id = 1;
}

message GetSignalResponse {
  Signal signal = 1;
}

message ListSignalsRequest {
  uint32 page_size = 1;
}

message ListSignalsResponse {
  repeated Signal signals = 1;
}
