syntax = "proto3";
package vrooli.source_ledger.v1.facets;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/source-ledger/v1/facets;facets_v1";
service FacetsService {
  rpc ListFacets(ListFacetsRequest) returns (ListFacetsResponse);
  rpc AssignFacet(AssignFacetRequest) returns (AssignFacetResponse);
  rpc SetPin(SetPinRequest) returns (SetPinResponse);
  rpc ListPinProposals(ListPinProposalsRequest) returns (ListPinProposalsResponse);
  rpc ListPinCandidates(ListPinCandidatesRequest) returns (ListPinCandidatesResponse);
  rpc ResolvePinProposal(ResolvePinProposalRequest) returns (ResolvePinProposalResponse);
  rpc MarkSuperseded(MarkSupersededRequest) returns (MarkSupersededResponse);
  rpc ResolveThread(ResolveThreadRequest) returns (ResolveThreadResponse);
}
message Facet {
  string id = 1;
  string label = 2;
  string retention_policy = 3;
}
message PinProposal {
  string id = 1;
  repeated string entry_ids = 2;
  string rationale = 3;
}
message ListFacetsRequest { string scope = 1; }
message ListFacetsResponse {
  repeated Facet facets = 1;
}
message AssignFacetRequest {
  string entry_id = 1;
  string facet_id = 2;
  string scope = 3;
}
message AssignFacetResponse {}
message SetPinRequest {
  string entry_id = 1;
  bool pinned = 2;
  string scope = 3;
}
message SetPinResponse {}
message ListPinProposalsRequest { string scope = 1; }
message ListPinProposalsResponse {
  repeated PinProposal proposals = 1;
}
message PinCandidate {
  string entry_id = 1;
  string body = 2;
  int32 recall_count = 3;
  string created_at = 4;
  string last_recalled_at = 5;
}
message ListPinCandidatesRequest { int32 limit = 1; string scope = 2; }
message ListPinCandidatesResponse { repeated PinCandidate candidates = 1; }
message ResolvePinProposalRequest {
  string proposal_id = 1;
  bool accept = 2;
  string scope = 3;
}
message ResolvePinProposalResponse {}
message MarkSupersededRequest {
  string entry_id = 1;
  string replacement_entry_id = 2;
  string scope = 3;
}
message MarkSupersededResponse {}
message ResolveThreadRequest { string entry_id = 1; string scope = 2; }
message ResolveThreadResponse {}
