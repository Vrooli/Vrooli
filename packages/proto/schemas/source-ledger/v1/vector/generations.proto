syntax = "proto3";

package vrooli.source_ledger.v1.vector;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/source-ledger/v1/vector;vector_v1";

// VectorGenerationService is the Source Ledger owner surface for SQLite
// embedding-generation lifecycle operations. Recipe identity, generation
// sizing and disk admission are resolved by the owner and are never request
// fields.
service VectorGenerationService {
  rpc StageGeneration(StageGenerationRequest) returns (GenerationControlResponse);
  rpc CatchUpGeneration(CatchUpGenerationRequest) returns (GenerationControlResponse);
  rpc ValidateGeneration(ValidateGenerationRequest) returns (GenerationControlResponse);
  rpc PromoteGeneration(PromoteGenerationRequest) returns (GenerationControlResponse);
  rpc RollbackGeneration(RollbackGenerationRequest) returns (GenerationControlResponse);
  rpc GetGenerationOperation(GetGenerationOperationRequest) returns (GenerationControlResponse);
  rpc ResumeGenerationOperation(ResumeGenerationOperationRequest) returns (GenerationControlResponse);
  rpc GetActiveGeneration(GetActiveGenerationRequest) returns (GenerationControlResponse);
}

message StageGenerationRequest {
  string operation_id = 1;
}

message CatchUpGenerationRequest {
  string operation_id = 1;
  string generation_id = 2;
}

message ValidateGenerationRequest {
  string generation_id = 1;
}

message PromoteGenerationRequest {
  string operation_id = 1;
  string generation_id = 2;
}

message RollbackGenerationRequest {
  string operation_id = 1;
}

message GetGenerationOperationRequest {
  string operation_id = 1;
}

message ResumeGenerationOperationRequest {
  string operation_id = 1;
}

message GetActiveGenerationRequest {}

message GenerationControlResponse {
  SQLiteGeneration generation = 1;
  GenerationOperation operation = 2;
  GenerationValidation validation = 3;
  bool active_found = 4;
}

message SQLiteGeneration {
  string generation_id = 1;
  string recipe_id = 2;
  int32 dimensions = 3;
  string state = 4;
  string snapshot_id = 5;
  int64 snapshot_watermark = 6;
  int64 catchup_watermark = 7;
  int64 snapshot_cursor = 8;
  string predecessor_id = 9;
  string rollback_expires_at = 10;
  bool protected = 11;
  int64 version = 12;
}

message GenerationOperation {
  string operation_id = 1;
  string operation = 2;
  string generation_id = 3;
  string recipe_id = 4;
  string state = 5;
  string receipt_id = 6;
  int64 peak_bytes = 7;
  string started_at = 8;
  string completed_at = 9;
  string error = 10;
}

message GenerationValidation {
  string generation_id = 1;
  string state = 2;
  bool ready_for_promotion = 3;
  int64 expected_points = 4;
  int64 actual_points = 5;
  int64 missing_points = 6;
  int64 orphaned_points = 7;
  int64 invalid_points = 8;
  int64 pending_changes = 9;
  int64 catchup_watermark = 10;
  int64 current_watermark = 11;
  string recipe_id = 12;
  int32 dimensions = 13;
}
