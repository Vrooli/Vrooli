syntax = "proto3";

package browser_automation_studio.v1;

import "browser-automation-studio/v1/actions/action.proto";
import "browser-automation-studio/v1/base/shared.proto";
import "browser-automation-studio/v1/execution/execution.proto";
import "browser-automation-studio/v1/timeline/container.proto";
import "browser-automation-studio/v1/workflows/definition.proto";
import "buf/validate/validate.proto";
import "common/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/browser-automation-studio/v1/api;api";

// =============================================================================
// WORKFLOW API SERVICE
// =============================================================================
//
// @layer 5
// @domain api
// @imports base, actions, workflows, execution
// @stability stable
//
// gRPC service definition for Browser Automation Studio workflow operations.
// Defines CRUD operations for workflows and execution lifecycle.
//
// This service is designed for both:
//   - gRPC clients: Native protobuf communication
//   - REST clients: HTTP/JSON via grpc-gateway annotations
//
// USAGE CONTEXTS:
//   - UI: Workflow editor, project management
//   - CLI: Headless workflow execution
//   - External integrations: CI/CD pipelines, scheduling systems
//
// =============================================================================

// WorkflowsService declares the core BAS workflow lifecycle operations.
service WorkflowsService {
  // Lists workflows, optionally filtered by project.
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  // Gets a workflow by ID.
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  // Creates a new workflow in a project.
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse);
  // Updates a workflow definition and metadata.
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (UpdateWorkflowResponse);
  // Deletes a workflow by ID.
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (DeleteWorkflowResponse);
  // Executes a persisted workflow by ID/version with optional parameters.
  rpc ExecuteWorkflow(ExecuteWorkflowRequest) returns (ExecuteWorkflowResponse);
  // Executes a workflow definition without persisting it.
  rpc ExecuteAdhocWorkflow(ExecuteAdhocRequest) returns (ExecuteAdhocResponse);
  // Validates a workflow definition and returns warnings/errors.
  rpc ValidateWorkflow(ValidateWorkflowRequest) returns (ValidateWorkflowResponse);
  // Validates a workflow definition that has already had its tokens resolved.
  rpc ValidateResolvedWorkflow(ValidateWorkflowRequest) returns (ValidateWorkflowResponse);
  // Applies an AI modification prompt to a workflow definition and persists it.
  rpc ModifyWorkflow(ModifyWorkflowRequest) returns (UpdateWorkflowResponse);
  // Lists all stored versions of a workflow, ordered newest-first.
  rpc ListWorkflowVersions(ListWorkflowVersionsRequest) returns (WorkflowVersionList);
  // Gets a single stored version of a workflow.
  rpc GetWorkflowVersion(GetWorkflowVersionRequest) returns (WorkflowVersion);
  // Restores a previous version as the current head of the workflow.
  rpc RestoreWorkflowVersion(RestoreWorkflowVersionRequest) returns (RestoreWorkflowVersionResponse);
}

// ExecutionsService declares execution-state queries and lifecycle controls.
// All execution-artifact metadata listings (screenshots, videos, traces, HAR)
// are JSON RPCs here; binary artifact downloads and replay-export streaming
// remain REST under explicit RESTException markers.
service ExecutionsService {
  // Lists executions, optionally filtered by workflow or project.
  rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);
  // Gets a single execution by ID, hydrated from the on-disk snapshot.
  rpc GetExecution(GetExecutionRequest) returns (GetExecutionResponse);
  // Gets the proto timeline (preferred) or the legacy timeline of an execution.
  rpc GetExecutionTimeline(GetExecutionTimelineRequest) returns (ExecutionTimeline);
  // Stops a running execution.
  rpc StopExecution(StopExecutionRequest) returns (StopExecutionResponse);
  // Resumes an interrupted execution from its last checkpoint.
  rpc ResumeExecution(ResumeExecutionRequest) returns (ResumeExecutionResponse);
  // Lists screenshots captured during an execution.
  rpc GetExecutionScreenshots(GetExecutionScreenshotsRequest) returns (GetScreenshotsResponse);
  // Lists recorded video artifacts for an execution.
  rpc GetExecutionRecordedVideos(GetExecutionArtifactsRequest) returns (GetExecutionVideosResponse);
  // Lists recorded Playwright trace artifacts for an execution.
  rpc GetExecutionRecordedTraces(GetExecutionArtifactsRequest) returns (GetExecutionTracesResponse);
  // Lists recorded HAR artifacts for an execution.
  rpc GetExecutionRecordedHar(GetExecutionArtifactsRequest) returns (GetExecutionHarResponse);
  // Schedules deferred seed cleanup for a previously executed seed scenario.
  rpc ScheduleExecutionSeedCleanup(ScheduleSeedCleanupRequest) returns (ScheduleSeedCleanupResponse);
  // Previews (dry-run) which terminal executions and artifact directories a
  // retention sweep would remove. Read-only: performs no deletion.
  rpc PreviewExecutionArtifactRetention(ExecutionArtifactRetentionRequest) returns (ExecutionArtifactRetentionResponse);
  // Runs a retention sweep, deleting matched terminal execution rows and their
  // artifact directories together. Requires confirm=true to mutate.
  rpc RunExecutionArtifactRetention(ExecutionArtifactRetentionRequest) returns (ExecutionArtifactRetentionResponse);
}

// =============================================================================
// WORKFLOW SUMMARY AND VERSIONING
// =============================================================================

// WorkflowSummary captures the primary workflow fields without the full definition.
message WorkflowSummary {
  // Unique workflow identifier.
  // @format uuid
  string id = 1;
  // Project ID the workflow belongs to.
  // @format uuid
  string project_id = 2;
  // Workflow name.
  string name = 3;
  // Folder path within the project.
  string folder_path = 4;
  // Workflow description.
  string description = 5;
  // Tags for categorization.
  repeated string tags = 6;
  // Current version number.
  int32 version = 7;
  // Whether this workflow is a template.
  bool is_template = 8;
  // User who created the workflow.
  string created_by = 9;
  // Source of the last change (manual, autosave, import, ai_generated, recording).
  ChangeSource last_change_source = 10;
  // Description of the last change.
  string last_change_description = 11;
  // When the workflow was created.
  google.protobuf.Timestamp created_at = 12;
  // When the workflow was last updated.
  google.protobuf.Timestamp updated_at = 13;
  // The workflow definition (V2 format).
  WorkflowDefinitionV2 flow_definition = 14;
}

// WorkflowVersion represents a historic version of a workflow.
message WorkflowVersion {
  // Workflow ID this version belongs to.
  // @format uuid
  string workflow_id = 1;
  // Version number.
  int32 version = 2;
  // The workflow definition at this version.
  WorkflowDefinitionV2 flow_definition = 3;
  // Description of changes in this version.
  string change_description = 4;
  // User who created this version.
  string created_by = 5;
  // When this version was created.
  google.protobuf.Timestamp created_at = 6;
}

// WorkflowList is a convenience wrapper for listing workflows.
message WorkflowList {
  repeated WorkflowSummary workflows = 1;
}

// WorkflowVersionList is a convenience wrapper for listing workflow versions.
message WorkflowVersionList {
  repeated WorkflowVersion versions = 1;
}

// =============================================================================
// WORKFLOW CRUD OPERATIONS
// =============================================================================

// ListWorkflowsRequest filters and paginates workflow listings.
message ListWorkflowsRequest {
  // Filter by project ID.
  // @format uuid
  optional string project_id = 1 [(buf.validate.field).string.uuid = true];
  // Filter by folder path.
  optional string folder_path = 2;
  // Pagination: maximum number of results (default: 50, max: 100).
  optional int32 limit = 3 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100
  ];
  // Pagination: offset for results (default: 0).
  optional int32 offset = 4 [(buf.validate.field).int32.gte = 0];
}

// ListWorkflowsResponse returns a list of workflows with pagination.
message ListWorkflowsResponse {
  // List of workflow summaries.
  repeated WorkflowSummary workflows = 1;
  // Total count of matching workflows.
  int32 total = 2;
  // Whether more results are available.
  bool has_more = 3;
}

// GetWorkflowRequest identifies a workflow to retrieve.
message GetWorkflowRequest {
  // Workflow ID to retrieve.
  // @format uuid
  string workflow_id = 1;
  // Specific version to retrieve (latest if not specified).
  optional int32 version = 2;
}

// GetWorkflowResponse returns a single workflow.
message GetWorkflowResponse {
  // The workflow summary with definition.
  WorkflowSummary workflow = 1;
}

// CreateWorkflowRequest creates a new workflow.
message CreateWorkflowRequest {
  // Project ID to create the workflow in.
  // @format uuid
  string project_id = 1;
  // Workflow name.
  string name = 2;
  // Folder path within the project.
  string folder_path = 3;
  // The workflow definition (V2 format).
  WorkflowDefinitionV2 flow_definition = 4;
  // Optional AI prompt used to generate the workflow.
  string ai_prompt = 5;
}

// CreateWorkflowResponse returns the created workflow.
message CreateWorkflowResponse {
  // The created workflow summary.
  WorkflowSummary workflow = 1;
  // The normalized workflow definition.
  WorkflowDefinitionV2 flow_definition = 2;
}

// UpdateWorkflowRequest updates an existing workflow.
message UpdateWorkflowRequest {
  // Updated workflow name.
  string name = 1;
  // Updated description.
  string description = 2;
  // Updated folder path.
  string folder_path = 3;
  // Updated tags.
  repeated string tags = 4;
  // Updated workflow definition (V2 format).
  WorkflowDefinitionV2 flow_definition = 5;
  // Description of this change.
  string change_description = 6;
  // Source of the change (manual, autosave, import, ai_generated, recording).
  ChangeSource source = 7;
  // Expected version for optimistic locking.
  int32 expected_version = 8;
  // Target workflow ID (path param for REST).
  // @format uuid
  optional string workflow_id = 9 [(buf.validate.field).string.uuid = true];
}

// UpdateWorkflowResponse returns the updated workflow.
message UpdateWorkflowResponse {
  // The updated workflow summary.
  WorkflowSummary workflow = 1;
  // The normalized workflow definition.
  WorkflowDefinitionV2 flow_definition = 2;
}

// DeleteWorkflowRequest identifies a workflow to delete.
message DeleteWorkflowRequest {
  // Workflow ID to delete.
  // @format uuid
  string workflow_id = 1;
}

// DeleteWorkflowResponse confirms workflow deletion.
message DeleteWorkflowResponse {
  // Whether the deletion was successful.
  bool success = 1;
  // Workflow ID that was deleted.
  // @format uuid
  string workflow_id = 2;
}

// =============================================================================
// WORKFLOW EXECUTION
// =============================================================================

// ExecuteWorkflowRequest starts a workflow execution.
message ExecuteWorkflowRequest {
  // Reserved fields from migrations:
  // - 1: (removed, purpose unknown)
  // - 3: parameters map (migrated to typed ExecutionParameters)
  reserved 1, 3;
  // Whether to wait for completion before responding.
  bool wait_for_completion = 2;
  // Workflow ID to execute.
  // @format uuid
  string workflow_id = 4 [(buf.validate.field).string.uuid = true];
  // Optional workflow version to execute.
  optional int32 workflow_version = 5;
  // Typed runtime parameters for the execution.
  ExecutionParameters parameters = 6;
  // Optional execution-mode toggles (artifacts, frame streaming, seed apply).
  ExecuteWorkflowOptions options = 7;
}

// ExecuteWorkflowResponse returns the execution status.
message ExecuteWorkflowResponse {
  // The created execution identifier.
  // @format uuid
  string execution_id = 1;
  // Initial execution status.
  ExecutionStatus status = 2;
  // Completion timestamp (null if async or still running).
  optional google.protobuf.Timestamp completed_at = 3;
  // Error message if execution failed.
  optional string error = 4;
}

// ListExecutionsRequest filters and paginates execution listings.
message ListExecutionsRequest {
  // Filter by workflow ID.
  // @format uuid
  optional string workflow_id = 1 [(buf.validate.field).string.uuid = true];
  // Filter by execution status.
  optional ExecutionStatus status = 2;
  // Pagination: maximum number of results (default: 50, max: 100).
  optional int32 limit = 3 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100
  ];
  // Pagination: offset for results (default: 0).
  optional int32 offset = 4 [(buf.validate.field).int32.gte = 0];
  // Filter by project ID.
  // @format uuid
  optional string project_id = 5 [(buf.validate.field).string.uuid = true];
  // Include exportability information for each execution.
  bool include_exportability = 6;
}

// ListExecutionsResponse returns a list of executions with pagination.
message ListExecutionsResponse {
  // List of executions.
  repeated Execution executions = 1;
  // Total count of matching executions.
  int32 total = 2;
  // Whether more results are available.
  bool has_more = 3;
  // Optional exportability info keyed by execution ID. Populated only when
  // ListExecutionsRequest.include_exportability is true.
  map<string, ExecutionExportability> exportability = 4;
}

// ExecutionExportability summarizes which export render-sources are available
// for a single execution. Returned as a sidecar map on ListExecutionsResponse
// when the caller requests it.
message ExecutionExportability {
  // True when a proto timeline file is present.
  bool has_timeline = 1;
  // True when at least one screenshot was captured.
  bool has_screenshots = 2;
  // True when a recorded video artifact is available.
  bool has_recorded_video = 3;
  // True when this execution has enough material to render an export.
  bool is_exportable = 4;
}

// GetExecutionRequest identifies an execution to retrieve.
message GetExecutionRequest {
  // Execution ID to retrieve.
  // @format uuid
  string execution_id = 1;
}

// GetExecutionResponse returns a single execution.
message GetExecutionResponse {
  // The execution details.
  Execution execution = 1;
}

// =============================================================================
// WORKFLOW VALIDATION
// =============================================================================

// ValidateWorkflowRequest contains a workflow definition to validate.
message ValidateWorkflowRequest {
  // The workflow definition to validate.
  WorkflowDefinitionV2 workflow = 1;
}

// ValidateWorkflowResponse wraps the validation result.
message ValidateWorkflowResponse {
  // The validation result.
  WorkflowValidationResult result = 1;
}

// WorkflowValidationIssue represents a validation error or warning.
message WorkflowValidationIssue {
  // Severity level (error, warning, info).
  ValidationSeverity severity = 1;
  // Machine-readable error code.
  string code = 2;
  // Human-readable message.
  string message = 3;
  // Node ID where the issue was found.
  // @format uuid
  string node_id = 4;
  // Node type (action type).
  ActionType node_type = 5;
  // Field name within the node.
  string field = 6;
  // JSON pointer to the problematic field.
  string pointer = 7;
  // Hint for fixing the issue.
  string hint = 8;
}

// WorkflowValidationStats summarizes the validated workflow.
message WorkflowValidationStats {
  // Number of nodes in the workflow.
  int32 node_count = 1;
  // Number of edges in the workflow.
  int32 edge_count = 2;
  // Total number of selectors used.
  int32 selector_count = 3;
  // Number of unique selectors.
  int32 unique_selector_count = 4;
  // Number of element wait operations.
  int32 element_wait_count = 5;
  // Whether the workflow has metadata.
  bool has_metadata = 6;
  // Whether execution viewport is configured.
  bool has_execution_viewport = 7;
}

// WorkflowValidationResult is returned by validation endpoints.
message WorkflowValidationResult {
  // Whether the workflow is valid.
  bool valid = 1;
  // Validation errors (must be fixed).
  repeated WorkflowValidationIssue errors = 2;
  // Validation warnings (should be addressed).
  repeated WorkflowValidationIssue warnings = 3;
  // Statistics about the workflow.
  WorkflowValidationStats stats = 4;
  // Schema version used for validation.
  string schema_version = 5;
  // When validation was performed.
  google.protobuf.Timestamp checked_at = 6;
  // Validation duration in milliseconds.
  int64 duration_ms = 7;
}

// RestoreWorkflowVersionResponse wraps the restored workflow and version metadata.
message RestoreWorkflowVersionResponse {
  // The restored workflow summary.
  WorkflowSummary workflow = 1;
  // The version that was restored.
  WorkflowVersion restored_version = 2;
}

// =============================================================================
// WORKFLOW VERSIONING REQUEST MESSAGES
// =============================================================================

// ListWorkflowVersionsRequest identifies the workflow whose versions to list.
message ListWorkflowVersionsRequest {
  // Workflow ID whose version history to list.
  // @format uuid
  string workflow_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetWorkflowVersionRequest identifies a specific stored version.
message GetWorkflowVersionRequest {
  // Workflow ID.
  // @format uuid
  string workflow_id = 1 [(buf.validate.field).string.uuid = true];
  // Version number (1-based; must be > 0).
  int32 version = 2 [(buf.validate.field).int32.gte = 1];
}

// RestoreWorkflowVersionRequest restores a prior version as the current head.
message RestoreWorkflowVersionRequest {
  // Workflow ID.
  // @format uuid
  string workflow_id = 1 [(buf.validate.field).string.uuid = true];
  // Version number to restore.
  int32 version = 2 [(buf.validate.field).int32.gte = 1];
  // Optional human description of why the restore is happening.
  string change_description = 3;
}

// =============================================================================
// AI MODIFY WORKFLOW
// =============================================================================

// ModifyWorkflowRequest applies an AI-driven modification prompt to an existing
// workflow definition and persists the result as a new version.
message ModifyWorkflowRequest {
  // Workflow ID to modify.
  // @format uuid
  string workflow_id = 1 [(buf.validate.field).string.uuid = true];
  // Natural-language modification prompt.
  string modification_prompt = 2 [(buf.validate.field).string.min_len = 1];
  // Current workflow definition the prompt is being applied to.
  WorkflowDefinitionV2 current_flow = 3;
}

// =============================================================================
// EXECUTIONS SERVICE MESSAGES
// =============================================================================

// GetExecutionTimelineRequest identifies the execution whose timeline should
// be returned.
message GetExecutionTimelineRequest {
  // Execution ID.
  // @format uuid
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
}

// StopExecutionRequest requests cancellation of a running execution.
message StopExecutionRequest {
  // Execution ID to stop.
  // @format uuid
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
}

// StopExecutionResponse acknowledges a stop request.
message StopExecutionResponse {
  // Lifecycle status after the stop request was accepted ("stopped").
  string status = 1;
}

// ResumeExecutionRequest resumes an interrupted execution.
message ResumeExecutionRequest {
  // Execution ID to resume.
  // @format uuid
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
  // Optional override parameters merged with the original execution params.
  common.v1.JsonObject parameters = 2;
  // Optional URL to navigate the browser to before resuming. Useful when the
  // browser state needs to be re-established after session loss.
  string resume_url = 3;
}

// ResumeExecutionResponse returns the new execution record created by the
// resume operation.
message ResumeExecutionResponse {
  // The resumed execution.
  Execution execution = 1;
}

// GetExecutionScreenshotsRequest identifies the execution whose screenshots
// should be listed.
message GetExecutionScreenshotsRequest {
  // Execution ID.
  // @format uuid
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetExecutionArtifactsRequest is shared by all artifact-listing RPCs.
message GetExecutionArtifactsRequest {
  // Execution ID whose artifacts should be listed.
  // @format uuid
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
}

// ExecutionFileArtifact mirrors the JSON shape returned by the legacy REST
// endpoints for recorded HAR, traces, and videos.
message ExecutionFileArtifact {
  // Filename / identifier within the execution-artifacts folder.
  string artifact_id = 1;
  // Optional storage URL when the artifact is served via the asset proxy.
  string storage_url = 2;
  // Resolved content type (e.g. "application/zip", "video/webm").
  string content_type = 3;
  // Human-readable label (filename without extension).
  string label = 4;
  // Size in bytes when known.
  optional int64 size_bytes = 5;
  // Free-form payload metadata (path, size, etc.).
  common.v1.JsonObject payload = 6;
}

// GetExecutionVideosResponse returns recorded video artifacts.
message GetExecutionVideosResponse {
  // Execution ID the artifacts belong to.
  // @format uuid
  string execution_id = 1;
  // Recorded video artifacts.
  repeated ExecutionFileArtifact videos = 2;
}

// GetExecutionTracesResponse returns recorded trace.zip artifacts.
message GetExecutionTracesResponse {
  // Execution ID the artifacts belong to.
  // @format uuid
  string execution_id = 1;
  // Recorded Playwright trace artifacts.
  repeated ExecutionFileArtifact traces = 2;
}

// GetExecutionHarResponse returns recorded HAR archives.
message GetExecutionHarResponse {
  // Execution ID the artifacts belong to.
  // @format uuid
  string execution_id = 1;
  // Recorded HAR artifacts.
  repeated ExecutionFileArtifact har_files = 2;
}

// ScheduleSeedCleanupRequest schedules a deferred seed cleanup for a previous
// execution that ran with seed-apply.
message ScheduleSeedCleanupRequest {
  // Execution ID whose seed should be cleaned up.
  // @format uuid
  string execution_id = 1 [(buf.validate.field).string.uuid = true];
  // Opaque cleanup token returned when the seed was applied.
  string cleanup_token = 2 [(buf.validate.field).string.min_len = 1];
  // Seed scenario identifier. Defaults to "browser-automation-studio".
  string seed_scenario = 3;
}

// ScheduleSeedCleanupResponse acknowledges that the cleanup has been
// scheduled with the seed-cleanup manager.
message ScheduleSeedCleanupResponse {
  // Always "scheduled" on success.
  string status = 1;
}

// =============================================================================
// EXECUTION ARTIFACT RETENTION
// =============================================================================

// ExecutionArtifactRetentionRequest selects terminal executions for an artifact
// retention sweep. The same message drives both the read-only preview and the
// confirmed run; only terminal executions (completed, failed) are ever eligible.
message ExecutionArtifactRetentionRequest {
  // Select executions older than this many days, measured from completed_at when
  // present, otherwise started_at. 0 disables the age filter.
  int32 max_age_days = 1 [(buf.validate.field).int32.gte = 0];
  // Keep this many most-recent terminal executions per workflow, exempt from
  // removal. 0 keeps none beyond what the age filter spares.
  int32 keep_latest = 2 [(buf.validate.field).int32.gte = 0];
  // Optional workflow filter.
  // @format uuid
  optional string workflow_id = 3 [(buf.validate.field).string.uuid = true];
  // Optional project filter.
  // @format uuid
  optional string project_id = 4 [(buf.validate.field).string.uuid = true];
  // Optional terminal-status filter. When set, only that status is considered
  // (must be completed or failed); when unset, both terminal statuses apply.
  optional ExecutionStatus status = 5;
  // Required confirmation for RunExecutionArtifactRetention. Ignored by the
  // preview RPC. The run RPC refuses to delete anything unless confirm=true.
  bool confirm = 6;
}

// ExecutionRetentionItem describes one execution considered by a retention sweep.
message ExecutionRetentionItem {
  // Execution ID.
  // @format uuid
  string execution_id = 1;
  // Execution status (completed, failed, running, pending).
  ExecutionStatus status = 2;
  // Workflow ID the execution belongs to.
  // @format uuid
  string workflow_id = 3;
  // When the execution started.
  optional google.protobuf.Timestamp started_at = 4;
  // When the execution completed, if terminal.
  optional google.protobuf.Timestamp completed_at = 5;
  // Result file path recorded for the execution.
  string result_path = 6;
  // Artifact directory that holds this execution's recordings.
  string artifact_dir = 7;
  // Estimated bytes occupied by the artifact directory.
  int64 estimated_bytes = 8;
  // Reason this item was skipped or errored. Empty for cleanly removed items.
  string reason = 9;
}

// ExecutionArtifactRetentionResponse is the structured report returned by both
// the preview and run RPCs.
message ExecutionArtifactRetentionResponse {
  // True when this report came from a dry-run (no mutation performed).
  bool dry_run = 1;
  // Executions removed by this sweep (or that would be removed in dry-run).
  repeated ExecutionRetentionItem removed = 2;
  // Executions considered but skipped, each carrying a reason.
  repeated ExecutionRetentionItem skipped = 3;
  // Total estimated bytes reclaimed (or reclaimable) across removed items.
  int64 estimated_bytes = 4;
  // Count of removed executions.
  int32 removed_count = 5;
  // Count of skipped executions.
  int32 skipped_count = 6;
  // Count of executions that errored during deletion (run mode only).
  int32 error_count = 7;
  // Per-status counts of removed executions, keyed by lowercase status string.
  map<string, int32> removed_by_status = 8;
}
