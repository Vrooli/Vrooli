syntax = "proto3";

package browser_automation_studio.v1.projects;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "browser-automation-studio/v1/api/service.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/browser-automation-studio/v1/projects;projects";

// =============================================================================
// PROJECTS DOMAIN — project CRUD + project-scoped workflow operations.
// =============================================================================
//
// @layer 5  (api surface)
// @domain projects
// @stability stable
//
// ProjectsService is the canonical transport for project CRUD plus the small
// set of project-scoped bulk operations on workflows (list/bulk-delete/
// execute-all). Each project maps 1:1 with a filesystem directory; workflow
// files inside that directory are managed through ProjectFilesService.
//
// USAGE CONTEXTS:
//   - API:  api/handlers/projects/service.go
//   - UI:   ui/src/api/projects.ts (project list/detail views)
//   - CLI:  bas projects {create|list|get|update|delete|workflows|...}
// =============================================================================

service ProjectsService {
  // CreateProject creates a project index row and (optionally) seeds the
  // project folder with a preset layout.
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);

  // ListProjects returns projects with their computed stats, ordered newest
  // first. limit=0 means use the server default.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);

  // GetProject returns a single project with its computed stats.
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);

  // UpdateProject mutates project name / description / folder_path. Empty
  // fields are ignored (no-op patches).
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);

  // DeleteProject removes the project from the index. When delete_files is
  // true the on-disk folder is also removed.
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);

  // ListProjectWorkflows returns workflows belonging to a project.
  rpc ListProjectWorkflows(ListProjectWorkflowsRequest) returns (browser_automation_studio.v1.ListWorkflowsResponse);

  // BulkDeleteProjectWorkflows deletes multiple workflows from a project in
  // a single transaction.
  rpc BulkDeleteProjectWorkflows(BulkDeleteProjectWorkflowsRequest) returns (BulkDeleteProjectWorkflowsResponse);

  // ExecuteAllProjectWorkflows starts an execution for every workflow in the
  // project. Per-workflow failures are reported in the response, not
  // returned as transport errors.
  rpc ExecuteAllProjectWorkflows(ExecuteAllProjectWorkflowsRequest) returns (ExecuteAllProjectWorkflowsResponse);
}

// =============================================================================
// DATA MESSAGES
// =============================================================================

// Project represents a workspace for organizing related workflows.
//
// Projects map 1:1 with filesystem directories. When a project is created,
// a corresponding folder is created on disk. Workflows within the project
// are stored as JSON files in that folder and synced to the database.
message Project {
  // Unique project identifier. Generated server-side on creation; immutable.
  // @format uuid
  string id = 1;

  // Human-readable project name.
  string name = 2;

  // Optional longer description of the project's purpose.
  string description = 3;

  // Absolute filesystem path where workflow files are stored.
  string folder_path = 4;

  // When the project was created (immutable).
  google.protobuf.Timestamp created_at = 5;

  // When the project was last modified.
  google.protobuf.Timestamp updated_at = 6;
}

// ProjectStats captures computed metrics for a project.
message ProjectStats {
  // Project ID these stats belong to.
  // @format uuid
  string project_id = 1;

  // Total number of workflows in this project.
  int32 workflow_count = 2;

  // Total number of executions across all workflows in this project.
  int32 execution_count = 3;

  // Timestamp of the most recent execution in this project.
  google.protobuf.Timestamp last_execution = 4;
}

// ProjectWithStats bundles a project with its computed statistics.
message ProjectWithStats {
  Project project = 1;
  ProjectStats stats = 2;
}

// ProjectList wraps a collection of projects with their statistics.
//
// Kept for legacy ListProjects callers that pre-date ProjectsService.
message ProjectList {
  repeated ProjectWithStats projects = 1;
}

// =============================================================================
// REQUEST / RESPONSE MESSAGES
// =============================================================================

// PresetKind selects an optional folder layout to materialize alongside the
// new project.
enum PresetKind {
  PRESET_KIND_UNSPECIFIED = 0;
  // EMPTY creates no extra folders beyond the project root.
  PRESET_KIND_EMPTY = 1;
  // RECOMMENDED seeds {actions, flows, cases, assets} subfolders.
  PRESET_KIND_RECOMMENDED = 2;
  // CUSTOM uses the caller-supplied preset_paths list.
  PRESET_KIND_CUSTOM = 3;
}

message CreateProjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2;
  string folder_path = 3 [(buf.validate.field).string.min_len = 1];
  PresetKind preset = 4;
  repeated string preset_paths = 5;
}

message CreateProjectResponse {
  Project project = 1;
  ProjectStats stats = 2;
}

message ListProjectsRequest {
  // 0 means use the server default. Clamped server-side to a safe maximum.
  int32 limit = 1;
  int32 offset = 2;
}

message ListProjectsResponse {
  repeated ProjectWithStats projects = 1;
}

message GetProjectRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetProjectResponse {
  Project project = 1;
  ProjectStats stats = 2;
}

message UpdateProjectRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Empty fields are ignored.
  string name = 2;
  string description = 3;
  string folder_path = 4;
}

message UpdateProjectResponse {
  Project project = 1;
}

message DeleteProjectRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // When true the on-disk project folder is removed as well.
  bool delete_files = 2;
}

message DeleteProjectResponse {
  bool files_deleted = 1;
}

message ListProjectWorkflowsRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  // 0 means use the server default.
  int32 limit = 2;
  int32 offset = 3;
}

message BulkDeleteProjectWorkflowsRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
  repeated string workflow_ids = 2 [(buf.validate.field).repeated.min_items = 1];
}

message BulkDeleteProjectWorkflowsResponse {
  int32 deleted_count = 1;
  repeated string deleted_ids = 2;
}

message ExecuteAllProjectWorkflowsRequest {
  string project_id = 1 [(buf.validate.field).string.uuid = true];
}

// ProjectWorkflowExecutionResult is the per-workflow outcome of
// ExecuteAllProjectWorkflows. status is one of "started" | "failed".
message ProjectWorkflowExecutionResult {
  string workflow_id = 1;
  string workflow_name = 2;
  string execution_id = 3;
  string status = 4;
  string error = 5;
}

message ExecuteAllProjectWorkflowsResponse {
  string message = 1;
  repeated ProjectWorkflowExecutionResult executions = 2;
}
