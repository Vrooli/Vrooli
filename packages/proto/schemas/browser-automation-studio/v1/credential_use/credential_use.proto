syntax = "proto3";

package browser_automation_studio.v1.credential_use;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/browser-automation-studio/v1/credentialuse;credentialuse";

// Browser credential use is a constrained BAS execution mode. The policy
// describes authority-owned bindings; it does not carry a password, TOTP
// secret, cookie, DOM value, or arbitrary script.
enum BrowserExposureClass {
  BROWSER_EXPOSURE_CLASS_UNSPECIFIED = 0;
  BROWSER_EXPOSURE_CLASS_PROTECTED = 1;
  BROWSER_EXPOSURE_CLASS_UNRESTRICTED_SESSION = 2;
}

enum BrowserCredentialActionType {
  BROWSER_CREDENTIAL_ACTION_UNSPECIFIED = 0;
  BROWSER_CREDENTIAL_ACTION_NAVIGATE = 1;
  BROWSER_CREDENTIAL_ACTION_CLICK = 2;
  BROWSER_CREDENTIAL_ACTION_SUBMIT = 3;
  BROWSER_CREDENTIAL_ACTION_COMPLETE = 4;
}

message BrowserSessionPolicy {
  string session_id = 1;
  string origin = 2;
  string account = 3;
  string document_id = 4;
  BrowserExposureClass exposure_class = 5;
  repeated string allowed_operations = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message BrowserCredentialAction {
  BrowserCredentialActionType type = 1;
  string origin = 2;
  string document_id = 3;
  string navigation_url = 4;
  string selector = 5;
}

message BrowserCredentialResult {
  string session_id = 1;
  string status = 2;
  string operation_class = 3;
  string origin = 4;
  string document_id = 5;
  BrowserExposureClass exposure_class = 6;
  repeated string cleared_fields = 7;
}
