syntax = "proto3";

package browser_automation_studio.v1.tools;

import "agent-inbox/v1/domain/manifest.proto";
import "agent-inbox/v1/domain/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/browser-automation-studio/v1/tools;tools";

// =============================================================================
// TOOLS DOMAIN — Tool Discovery + Execution Protocol surface.
// =============================================================================
//
// @layer 5  (api surface)
// @domain tools
// @stability stable
//
// ToolsService is BAS's adapter onto the cross-scenario Tool Discovery
// Protocol defined under agent-inbox. External consumers (agent-inbox, AI
// agents) call List/Get to discover what tools this scenario provides and
// Execute to invoke them. The discovery payloads reuse the canonical
// ToolManifest / ToolDefinition messages from agent_inbox.v1; execution
// uses google.protobuf.Struct for its open-shape arguments/result.
//
// USAGE CONTEXTS:
//   - API:  api/handlers/tools/connect_handler.go
//   - UI:   ui/src/api/tools.ts (agent-inspector tool browser)
//   - CLI:  bas tools list | bas tools get <name> | bas tools execute ...
// =============================================================================

service ToolsService {
  // List returns the complete tool manifest for this scenario.
  rpc List(ListToolsRequest) returns (ListToolsResponse);

  // Get returns a single tool definition by name. Not-found is reported
  // via connect.CodeNotFound (no envelope error field).
  rpc Get(GetToolRequest) returns (GetToolResponse);

  // Execute dispatches a tool invocation. Errors that are tool-level
  // (unknown tool, invalid args, internal failures) come back inside the
  // response envelope so the caller can distinguish them from transport
  // failures.
  rpc Execute(ExecuteToolRequest) returns (ExecuteToolResponse);
}

message ListToolsRequest {}

message ListToolsResponse {
  // Manifest reuses the canonical agent-inbox ToolManifest shape so the
  // discovery protocol stays portable across scenarios.
  agent_inbox.v1.ToolManifest manifest = 1;
}

message GetToolRequest {
  // Tool slug as returned by List. Required, non-empty.
  string name = 1 [(buf.validate.field).string = {min_len: 1}];
}

message GetToolResponse {
  agent_inbox.v1.ToolDefinition tool = 1;
}

message ExecuteToolRequest {
  // Tool slug to invoke. Required, non-empty.
  string tool_name = 1 [(buf.validate.field).string = {min_len: 1}];

  // Free-shape JSON arguments for the tool. Validation lives inside the
  // tool implementation; surface-level validation only enforces presence
  // of tool_name.
  google.protobuf.Struct arguments = 2;
}

// ExecuteToolResponse mirrors the original tool-execution protocol
// envelope so existing tool implementations can be wrapped without
// refactoring their result shapes. The envelope intentionally carries
// the success/code fields rather than relying on connect.Error codes,
// because individual tool implementations need to surface domain error
// codes (unknown_tool, conflict, validation_error, ...) that don't map
// cleanly onto transport codes.
message ExecuteToolResponse {
  // True when the tool executed without error.
  bool success = 1;

  // Free-shape JSON result payload from the tool implementation.
  google.protobuf.Struct result = 2;

  // Human-readable error message when success=false.
  string error = 3;

  // Machine-readable error code when success=false.
  // Vocabulary: unknown_tool, invalid_args, not_found, conflict,
  // internal_error, validation_error.
  string code = 4;

  // True when the tool started a long-running operation. Callers poll
  // status via the run_id (delivered through scenario-specific endpoints,
  // not this service).
  bool is_async = 5;

  // Unique identifier for async operations. Empty for synchronous tools.
  string run_id = 6;

  // Current status for async operations. Vocabulary: pending, running,
  // completed, failed.
  string status = 7;
}
