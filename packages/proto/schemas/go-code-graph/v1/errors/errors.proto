syntax = "proto3";

package vrooli.go_code_graph.v1.errors;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/go-code-graph/v1/errors;errors_v1";

// =============================================================================
// ERROR ENVELOPE — canonical REST-exception non-2xx body + typed codes
// =============================================================================
//
// @layer 5  (api surface)
// @domain errors
// @stability stable
//
// Connect-RPC methods use Connect's canonical error envelope and code set.
// Deliberate REST exceptions (currently only /health) return this shape
// for non-2xx responses. The thin writer at api/internal/httpx/errors.go
// marshals it with protojson; UI and CLI REST clients decode via fromJson
// / protojson.Unmarshal and surface the typed `code` + `message`.
//
// ExtractError and RewriteError enumerate the typed codes the graph and
// rewrite domains may return. Service-level mapping to Connect codes lives
// in api/internal/{graph,rewrite}/service_error_mapping.go.
// =============================================================================

message ErrorEnvelope {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

enum ExtractError {
  EXTRACT_ERROR_UNSPECIFIED = 0;
  EXTRACT_ERROR_NO_GO_MOD_FOUND = 1;
  EXTRACT_ERROR_MULTIPLE_GO_MOD_FILES = 2;
  EXTRACT_ERROR_WORKSPACE_UNSUPPORTED = 3;
  EXTRACT_ERROR_PATH_UNREADABLE = 4;
  EXTRACT_ERROR_INTERNAL = 5;
}

enum RewriteError {
  REWRITE_ERROR_UNSPECIFIED = 0;
  REWRITE_ERROR_NO_OPERATIONS = 1;
  REWRITE_ERROR_MALFORMED_OPERATION = 2;
  REWRITE_ERROR_PLAN_NOT_FOUND = 3;
  REWRITE_ERROR_PATH_MISMATCH = 4;
  REWRITE_ERROR_APPLY_NOT_SET = 5;
  REWRITE_ERROR_INTERNAL = 6;
}
