syntax = "proto3";

package vrooli.go_code_graph.v1.graph;

import "common/v1/code_graph.proto";
import "go-code-graph/v1/rewrite/rewrite.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/go-code-graph/v1/graph;graph_v1";

// =============================================================================
// GO-CODE-GRAPH SERVICE — Extract + Rewrite{Plan,Apply}
// =============================================================================
//
// @layer 5  (api surface)
// @domain graph + rewrite
// @stability stable
//
// One Connect-RPC service so consumer scenarios (architecture-cartographer,
// future Go static-analysis siblings) hold one client and route all three
// RPCs through it. The graph and rewrite domains are split at the
// internal/<domain>/ + handlers/<domain>/ layer, not at the service layer.
//
// All RPCs operate on a single Go module (single go.mod). Workspaces
// (go.work) and ambient multi-module setups are rejected with Unimplemented
// per OT-P0-004.
// =============================================================================

service GoCodeGraphService {
  // Extract produces a deterministic graph for a Go module.
  rpc Extract(ExtractRequest) returns (ExtractResponse) {}

  // RewritePlan validates and normalizes a list of operations and returns
  // a plan_id. No filesystem changes.
  rpc RewritePlan(RewritePlanRequest) returns (RewritePlanResponse) {}

  // RewriteApply executes a previously-planned set of operations against
  // the filesystem. Caller must set apply=true; apply=false is rejected
  // with InvalidArgument so dry-run callers do not accidentally mutate.
  rpc RewriteApply(RewriteApplyRequest) returns (RewriteApplyResponse) {}
}

// -----------------------------------------------------------------------------
// Extract
// -----------------------------------------------------------------------------

// Go-specific NodeKind values. Tags live in the common envelope's reserved
// 100..199 range. Producers attach the typed kind via attributes["kind"] =
// "<GoNodeKind>" on each CodeGraphNode whose primary NodeKind is FILE,
// PACKAGE, or MODULE; the typed-kind enum lives here so consumers can
// validate the value without parsing strings.
enum GoNodeKind {
  GO_NODE_KIND_UNSPECIFIED = 0;
  GO_NODE_KIND_TYPE = 100;
  GO_NODE_KIND_FUNC = 101;
  GO_NODE_KIND_VAR = 102;
  GO_NODE_KIND_CONST = 103;
  GO_NODE_KIND_INTERFACE = 104;
  GO_NODE_KIND_METHOD = 105;
}

message ExtractRequest {
  // Absolute or scenario-relative path to a Go module root. Must contain
  // exactly one go.mod.
  string scenario_path = 1;
  // When false (default) the loader skips vendor/ directories and module
  // cache paths. REQ-P1-003.
  bool include_vendor = 2;
}

message ExtractResponse {
  // The graph in the shared envelope.
  common.v1.CodeGraph graph = 1;
  // Partial-extraction warnings (parse errors, unresolved imports, ...).
  // Catastrophic project errors (no go.mod, workspace, unreadable path)
  // are surfaced as Connect errors, not warnings.
  repeated common.v1.CodeGraphWarning warnings = 2;
  // Wall-clock extraction time in milliseconds.
  int64 extraction_ms = 3;
  // Hex sha256 of the normalized JSON serialization of `graph`. Consumers
  // use this for cache-hit detection without re-diffing. REQ-P1-005.
  string graph_hash = 4;
}

// -----------------------------------------------------------------------------
// Rewrite
// -----------------------------------------------------------------------------

message RewritePlanRequest {
  string scenario_path = 1;
  repeated vrooli.go_code_graph.v1.rewrite.Operation operations = 2;
}

message RewritePlanResponse {
  // sha256 hex of the marshaled, normalized operations list. Stable across
  // identical inputs.
  string plan_id = 1;
  // Operations after normalization (dedup, canonical ordering, path
  // canonicalization). Caller persists this if it wants to display the
  // plan back; the service does not require it on apply.
  repeated vrooli.go_code_graph.v1.rewrite.Operation normalized_operations = 2;
}

message RewriteApplyRequest {
  string scenario_path = 1;
  string plan_id = 2;
  // Must be true. False is rejected with InvalidArgument so dry-run callers
  // never accidentally mutate the working tree.
  bool apply = 3;
}

message RewriteApplyResponse {
  string plan_id = 1;
  repeated vrooli.go_code_graph.v1.rewrite.OperationResult results = 2;
  // True when the request rode in with X-Dry-Run: true. The response
  // mirrors what an apply would have produced but no executor was invoked.
  bool dry_run = 3;
}
