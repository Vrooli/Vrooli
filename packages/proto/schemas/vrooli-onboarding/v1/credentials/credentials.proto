syntax = "proto3";

package vrooli.vrooli_onboarding.v1.credentials;

import "buf/validate/validate.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/vrooli-onboarding/v1/credentials;credentialsv1";

// CredentialsService exposes metadata and diagnosis for onboarding credentials.
// Credential values are write-only: they are accepted by ProvisionCredential
// and are never present in a response, diagnosis, or descriptor.
service CredentialsService {
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc ProvisionCredential(ProvisionCredentialRequest) returns (ProvisionCredentialResponse);
  rpc DiagnoseCredentials(DiagnoseCredentialsRequest) returns (DiagnoseCredentialsResponse);
}

// ListCredentialsRequest resolves the scoped credential metadata projection.
// Individual status checks belong to ReadinessService so this request can
// render declared inputs without waiting for a credential authority probe.
message ListCredentialsRequest { string target = 1; }

message ProvisionCredentialRequest {
  string target = 1;
  string logical_id = 2 [(buf.validate.field).string.min_len = 1];
  string field = 3;
  // The value is accepted only for this write operation and is never copied to
  // a response, log, descriptor, diagnosis, or command argument.
  string value = 4 [(buf.validate.field).string.min_len = 1];
}

message DiagnoseCredentialsRequest { string target = 1; }

message CredentialConsumerProvenance {
  string logical_id = 1;
  string address_pattern = 2;
  string field = 3;
  string kind = 4;
  string consumer = 5;
  string source_ref = 6;
  bool required = 7;
  string reason = 8;
  repeated string tiers = 9;
}

message CredentialApplicabilityMatch {
  string context = 1;
  string setting = 2;
  string operation = 3;
  string role = 4;
  string target = 5;
  string environment = 6;
  string capability = 7;
  string provider = 8;
  string value = 9;
}

message CredentialApplicabilityRule {
  oneof comparison {
    CredentialApplicabilityMatch eq = 1;
    CredentialApplicabilityMatch neq = 2;
  }
}

message CredentialApplicability {
  repeated CredentialApplicabilityRule all = 1;
  repeated CredentialApplicabilityRule any = 2;
  CredentialApplicabilityRule not = 3;
}

message CredentialMigrationDiagnostic {
  string address = 1;
  string code = 2;
  string severity = 3;
  string message = 4;
}

message CredentialProvenance {
  string owner = 1;
  string source_ref = 2;
  string kind = 3;
  string env = 4;
  string label = 5;
  string description = 6;
  string obtain_url = 7;
  string provisioning = 8;
  string derived_from = 9;
  bool required = 10;
  repeated CredentialConsumerProvenance consumers = 11;
  string version = 12;
  string provider = 13;
  CredentialApplicability applies_when = 14;
  string requirement_group = 15;
  repeated string consumer_refs = 16;
  repeated string companion_settings = 17;
  repeated string companion_credentials = 18;
  string acquisition_ref = 19;
  string verification_ref = 20;
  string recovery_ref = 21;
  string help_ref = 22;
  string evidence_policy = 23;
  string provider_version = 24;
  repeated string tiers = 25;
  // Safe, non-secret sample text for an operator input placeholder.
  string placeholder = 26;
}

message Credential {
  string resource = 1;
  string logical_id = 2;
  string field = 3;
  string label = 4;
  string description = 5;
  string obtain_url = 6;
  // Safe, non-secret sample text for an operator input placeholder.
  string placeholder = 32;
  string provisioning = 7;
  string derived_from = 8;
  bool required = 9;
  string status = 10;
  string detail = 11;
  repeated CredentialProvenance provenance = 12;
  string owner = 13;
  string source_ref = 14;
  string kind = 15;
  repeated string consumer_refs = 16;
  string version = 18;
  string provider = 19;
  CredentialApplicability applies_when = 20;
  string requirement_group = 21;
  repeated string companion_settings = 22;
  repeated string companion_credentials = 23;
  string acquisition_ref = 24;
  string verification_ref = 25;
  string recovery_ref = 26;
  string help_ref = 27;
  string evidence_policy = 28;
  string provider_version = 29;
  repeated CredentialMigrationDiagnostic migration_diagnostics = 30;
  repeated string tiers = 31;
}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
  int32 count = 2;
}

message ProvisionCredentialResponse {
  string status = 1;
  string logical_id = 2;
  string field = 3;
  // Opaque active authority version after activation; never a secret value.
  string version = 4;
}

message ProviderDiagnosis {
  string platform = 1;
  string adapter = 2;
  string backend = 3;
  string condition = 4;
  bool available = 5;
  bool writable = 6;
  string explanation = 7;
  string fix = 8;
  string native_storage_caveat = 9;
  string write_condition = 10;
  string write_explanation = 11;
  string write_fix = 12;
  string session_repair = 13;
}

message RecoveryStatus {
  bool receipt_exists = 1;
  string exported_at = 2;
  int32 entry_count = 3;
  repeated string uncovered = 4;
  repeated string required_absent = 5;
  string basis = 6;
  bool managed_instances_included = 7;
  string status = 8;
  int64 age_seconds = 9;
  string freshness_reason = 10;
}

message DiagnoseCredentialsResponse {
  ProviderDiagnosis provider = 1;
  repeated Credential credentials = 2;
  int32 credential_count = 3;
  int32 declaration_site_count = 4;
  string inventory_basis = 5;
  bool managed_instances_included = 6;
  RecoveryStatus recovery = 7;
}
