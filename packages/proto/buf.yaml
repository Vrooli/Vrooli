version: v2
modules:
  - path: schemas
    name: buf.build/vrooli/schemas
  # BSR module deps are vendored under vendor/{googleapis,protovalidate}/
  # and treated as workspace modules so transitive imports resolve without
  # contacting BSR. Refresh via `make refresh-vendor` (the only code path
  # that requires BSR access). See docs/development/proto.md.
  - path: vendor/googleapis
    name: buf.build/googleapis/googleapis
    lint:
      use:
        - MINIMAL
    breaking:
      ignore_unstable_packages: true
  - path: vendor/protovalidate
    name: buf.build/bufbuild/protovalidate
    lint:
      use:
        - MINIMAL
    breaking:
      ignore_unstable_packages: true
lint:
  use:
    - DEFAULT
  except:
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    # The following are needed for domain-based subdirectory organization
    # where multiple directories share the same proto package but have
    # different Go packages for better code organization.
    - PACKAGE_SAME_DIRECTORY
    - PACKAGE_SAME_GO_PACKAGE
breaking:
  use:
    - WIRE
