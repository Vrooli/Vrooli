version: v2
inputs:
  - directory: schemas
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: gen/typescript
    opt:
      - target=ts
      - import_extension=none
  - local: protoc-gen-es
    out: gen/typescript/js
    opt:
      - target=js
      - import_extension=js
  - protoc_builtin: python
    out: gen/python
  - protoc_builtin: pyi
    out: gen/python
