name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Limit permissions to only what's needed
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          # Pinned to the version used for local generation: a newer buf in CI
          # would regenerate differently and fail the drift gate spuriously.
          version: "1.37.0"

      - name: Verify proto generated artifacts
        run: make verify-committed-gen
        working-directory: packages/proto

      - name: Cross-compile OS-evidence packages (darwin/windows)
        run: make cross-compile

      - name: Run evidence-layer tests
        run: |
          go test -count=1 \
            ./internal/network/... \
            ./internal/process/... \
            ./internal/maintenance/... \
            ./internal/ports/... \
            ./internal/runtimesupervisor/... \
            ./internal/scenarioruntime/... \
            ./internal/cli/projectcli/...

      - name: Run scenario-to-desktop runtime tests
        run: go test ./... -count=1
        working-directory: scenarios/scenario-to-desktop/runtime

      - name: Run scenario-to-desktop preflight tests
        run: go test ./... -run TestPreflightBundleHandler -count=1
        working-directory: scenarios/scenario-to-desktop/api
