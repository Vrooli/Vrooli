<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vega</title>
    <meta name="theme-color" content="#0b0e0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Live, durable system observability for Vrooli operators." />
    <meta name="application-name" content="Vega" />

    <!-- Installable PWA / iOS standalone: the home-screen title and icon come
         from these metas and the brand-manager icon block below. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vega" />

    <!-- Open Graph / Twitter link-preview cards. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vega" />
    <meta property="og:title" content="Vega" />
    <meta property="og:description" content="Live, durable system observability for Vrooli operators." />
    <meta property="og:image" content="/public/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vega" />
    <meta name="twitter:description" content="Live, durable system observability for Vrooli operators." />
    <meta name="twitter:image" content="/public/og-image.png" />
    <!-- Fonts are loaded non-render-blocking so they never sit on the critical
         path (a render-blocking font stylesheet — or a CSS @import chained
         behind tokens.css — delays first paint/LCP and inflates TBT). We
         preconnect to the font hosts, then swap the stylesheet from
         media="print" to media="all" once it loads. System-font fallbacks in
         tokens.css render immediately; web fonts swap in (font-display: swap)
         without blocking. <noscript> keeps fonts working without JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Share+Tech+Mono&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Share+Tech+Mono&display=swap"
      />
    </noscript>
    <style>
      /* Prevent flash of unstyled content */
      /* This paints the FIRST FRAME, before tokens.css arrives, so its values
         are duplicated from the dark theme's `--color-background` and
         `--color-text` rather than chosen here. They must be kept in step with
         tokens.css: a mismatch shows as a visible colour flip on every load.
         The previous values (#000000 on #00ff00) matched no theme at all. */
      body {
        margin: 0;
        padding: 0;
        background: #0b0e0f;
        color: #dce4e2;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  <!-- brand-manager:icons:start profile=web-public-v1 brand=vega version=6 -->
<link rel="icon" type="image/svg+xml" href="/public/logo.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/public/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/public/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
<link rel="manifest" href="/public/site.webmanifest" crossorigin="use-credentials" />
<!-- brand-manager:icons:end -->
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
