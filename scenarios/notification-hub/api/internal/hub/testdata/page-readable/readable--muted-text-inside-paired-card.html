<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.card { background: var(--hub-surface); color: var(--hub-fg); border: 1px solid var(--hub-border); }
.card small, .meta { color: var(--hub-muted); }
.chip { background: color-mix(in srgb, var(--hub-primary) 12%, transparent); color: var(--hub-primary); }
.hidden { display: none; }
</style></head><body>
<div class="card"><h2>Back up secrets from now on</h2><p class="meta">12 items · 2.9 GiB</p><span class="chip">Recommended</span><small>Exists nowhere else.</small></div>
<div class="hidden" style="background:#fff;color:#fff">never shown</div>
</body></html>
