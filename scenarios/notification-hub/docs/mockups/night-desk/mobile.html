<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Desk — phone</title>
<link rel="stylesheet" href="night.css">
<style>
  body { background: var(--void); }
  .m { min-height: 100dvh; padding: 0 20px calc(84px + env(safe-area-inset-bottom)); }

  .m-top { display: flex; align-items: center; gap: 10px; padding-top: calc(14px + env(safe-area-inset-top)); }
  .m-brand .brand-name { font-size: 12.5px; }
  .m-brand .brand-sub { font-size: 8.5px; }
  .m-actions { margin-left: auto; display: flex; gap: 0; }
  .m-icon { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; }
  .m-icon:active { background: var(--panel-2); color: var(--moon); }

  .m-hero { padding-top: 26px; }
  .m-hero h1 { font-size: 40px; }
  .m-hero h1 .n { color: var(--cyan); font-variant-numeric: tabular-nums; }
  .m-hero p { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .m-hero p b { color: var(--amber); font-weight: 560; }

  .m-cta { margin-top: 18px; }

  .m-seg { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 16px; border-bottom: 1px solid var(--line); }
  .m-seg button {
    position: relative; height: 40px; border: 0; background: transparent;
    color: var(--faint); font-size: 12px; font-weight: 560; cursor: pointer;
  }
  .m-seg button b { font-family: var(--mono); font-size: 10px; margin-left: 4px; color: inherit; opacity: .8; }
  .m-seg button[aria-selected="true"] { color: var(--moon); }
  .m-seg button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--cyan); }

  .m-lead { display: block; width: 100%; text-align: left; margin-top: 16px; padding: 15px 15px 14px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); box-shadow: var(--shadow-panel); cursor: pointer; }
  .m-lead .meta { display: flex; align-items: center; gap: 6px; font: 560 10px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }
  .m-lead .meta .sep { width: 2px; height: 2px; border-radius: 50%; background: currentColor; }
  .m-lead h2 { margin-top: 9px; font-size: 17px; font-weight: 590; letter-spacing: -0.02em; line-height: 1.28; color: var(--moon); }
  .m-lead .rec { margin-top: 10px; display: flex; align-items: start; gap: 7px; font-size: 12px; line-height: 1.45; color: var(--moon-2); }
  .m-lead .rec svg { flex: none; margin-top: 2px; color: var(--cyan); }
  .m-lead .foot { margin-top: 11px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .m-lead .foot span { font-size: 11px; color: var(--faint); }
  .m-lead .foot b { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 580; color: var(--cyan); }

  .m-list { margin-top: 6px; }
  .m-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
  .m-row:last-child { border-bottom: 0; }
  .m-row .body { min-width: 0; flex: 1; }
  .m-row .t { display: block; font-size: 13.5px; font-weight: 550; letter-spacing: -0.008em; color: var(--moon-2); }
  .m-row .s { display: block; margin-top: 2px; font-size: 11px; color: var(--faint); }
  .m-row .a { font: 560 9.5px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .m-row .a.due { color: var(--amber); }

  .m-group { display: flex; align-items: center; gap: 8px; padding: 16px 2px 4px; }
  .m-group b { font: 600 9.5px/1 var(--mono); letter-spacing: .15em; text-transform: uppercase; color: var(--faint); }
  .m-group i { flex: 1; height: 1px; background: var(--line); }

  .m-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 6px 10px max(6px, env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--void) 88%, transparent);
    border-top: 1px solid var(--line);
    backdrop-filter: blur(16px);
  }
  .m-nav a { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; border-radius: 10px; color: var(--faint); font-size: 10px; font-weight: 560; }
  .m-nav svg { width: 18px; height: 18px; }
  .m-nav a[aria-current="page"] { color: var(--moon); }
  .m-nav a[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 18px; height: 2px; border-radius: 2px; background: var(--cyan); }
  .m-nav .b { position: absolute; top: 5px; right: 50%; margin-right: -23px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px; background: var(--cyan); color: var(--cyan-ink); font: 640 9px/15px var(--mono); text-align: center; }

  @media (max-width: 360px) {
    .m { padding-left: 16px; padding-right: 16px; }
    .m-hero h1 { font-size: 36px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="moon" viewBox="0 0 24 24">
    <defs><mask id="crescent"><rect width="24" height="24" fill="#000"/><circle cx="11.3" cy="12" r="9.4" fill="#fff"/><circle cx="17" cy="11" r="7.5" fill="#000"/></mask></defs>
    <rect width="24" height="24" fill="currentColor" mask="url(#crescent)"/>
    <circle cx="18.3" cy="17.6" r="1.75" fill="var(--cyan)"/>
  </symbol>
</svg>

<div class="m">
  <header class="m-top">
    <a class="brand m-brand" href="#" aria-label="Chimesail">
      <svg class="moon-mark" style="color:var(--moon);width:20px;height:20px"><use href="#moon"/></svg>
      <span><span class="brand-name">Chimesail</span><span class="brand-sub">Night desk</span></span>
    </a>
    <div class="m-actions">
      <button class="m-icon" type="button" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      </button>
      <button class="m-icon" id="theme" type="button" aria-label="Toggle theme">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </header>

  <section class="m-hero" aria-labelledby="m-title">
    <p class="kicker">Tuesday, 24 November</p>
    <h1 id="m-title" class="display" style="margin-top:8px"><span class="n">6</span> waiting</h1>
    <p><b>2 close today</b> · 1 permission · 20 can wait</p>
    <button class="btn primary lg wide m-cta" type="button">Start review
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </section>

  <div class="m-seg" role="tablist" aria-label="Time">
    <button role="tab" aria-selected="true" type="button">Today <b>2</b></button>
    <button role="tab" aria-selected="false" type="button">This week <b>4</b></button>
    <button role="tab" aria-selected="false" type="button">Can wait <b>20</b></button>
  </div>

  <button class="m-lead" type="button">
    <span class="meta"><span style="color:var(--amber)">Due 19:06</span><span class="sep"></span>Structural change<span class="sep"></span>Steward</span>
    <h2>Stop the deletion floors asking the same question twice.</h2>
    <span class="rec">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m4 12 5 5L20 6"/></svg>
      <span>Restructure both floors. Keep the hidden-effect guard.</span>
    </span>
    <span class="foot"><span>2 checks, one cause</span><b>Open <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg></b></span>
  </button>

  <div class="m-group"><b>Today</b><i></i></div>
  <div class="m-list">
    <button class="m-row" type="button">
      <span class="body"><span class="t">Hidden-side-effect guard</span><span class="s">Structural change · Steward</span></span>
      <span class="a due">Today</span>
    </button>
  </div>

  <div class="m-group"><b>This week</b><i></i></div>
  <div class="m-list">
    <button class="m-row" type="button">
      <span class="body"><span class="t">Portal may provision a Memory scope</span><span class="s">Portal completion · 5 days</span></span>
      <span class="a">Yes / No</span>
    </button>
    <button class="m-row" type="button">
      <span class="body"><span class="t">Codex may launch research commissions</span><span class="s">Agent Manager · 4 days</span></span>
      <span class="a">Allow</span>
    </button>
    <button class="m-row" type="button">
      <span class="body"><span class="t">Use LPBS as the signed catalog source</span><span class="s">Research Desk · 6 days</span></span>
      <span class="a">Defer</span>
    </button>
    <button class="m-row" type="button">
      <span class="body"><span class="t">Aquila: choose the next edit base</span><span class="s">Agent run · 5 days</span></span>
      <span class="a">Review</span>
    </button>
  </div>

  <div class="m-group"><b>Can wait</b><i></i></div>
  <div class="m-list">
    <button class="m-row" type="button">
      <span class="body"><span class="t">21 older decisions</span><span class="s">Nothing closes in the next 7 days</span></span>
      <span class="a">—</span>
    </button>
  </div>
</div>

<nav class="m-nav" aria-label="Main">
  <a href="#" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h9M4 18h6"/></svg>
    Needs you <span class="b">6</span>
  </a>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 4h12v16l-6-3.5L6 20V4Z"/></svg>
    Updates
  </a>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v12H7l-3 3V5Z"/></svg>
    History
  </a>
  <a href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 1-.1 1.2l1.9 1.5-2 3.4-2.2-.9a7 7 0 0 1-2 1.2l-.3 2.3h-4l-.3-2.3a7 7 0 0 1-2-1.2l-2.2.9-2-3.4 1.9-1.5A7 7 0 0 1 5 12"/></svg>
    Settings
  </a>
</nav>

<script>
  (function () {
    var root = document.documentElement;
    var requested = new URLSearchParams(location.search).get("theme");
    if (requested === "dark" || requested === "light") root.setAttribute("data-theme", requested);
    document.getElementById("theme").addEventListener("click", function () {
      root.setAttribute("data-theme", root.getAttribute("data-theme") === "light" ? "" : "light");
    });
    document.querySelectorAll(".m-seg button").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll(".m-seg button").forEach(function (o) { o.setAttribute("aria-selected", "false"); });
        b.setAttribute("aria-selected", "true");
      });
    });
  })();
</script>
</body>
</html>
