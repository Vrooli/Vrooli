run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gofumpt
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

linters-settings:
  gofumpt:
    module-path: "scenario-dependency-analyzer"

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
