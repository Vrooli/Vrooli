<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><title>Light-table studio — Settings desktop concept</title><style>
 text {font-family:'Ubuntu',Arial,sans-serif; fill:#252721;} .serif {font-family:'Bitstream Charter','Charter',serif;} .muted {fill:#73746C;} .smallcaps {font-size:11px;font-weight:700;letter-spacing:1.2px;} .btn {font-size:14px;font-weight:700;fill:#fff;} .nav {font-size:14px;font-weight:600;} .hair {stroke:#D6D2C9;stroke-width:1;} .stageText {fill:#D3D1C9;} .meta {font-size:12px;fill:#73746C;}
 </style><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F2EFE8"/><rect x="0" y="0" width="1440" height="72" rx="0" fill="#F2EFE8"/><text x="42" y="45" font-size="23" font-weight="700" class="serif" style="fill:#252721">Device Studio</text><text x="268" y="44" font-size="14" font-weight="500" class="nav" style="fill:#73746C">Projects</text><text x="360" y="44" font-size="14" font-weight="500" class="nav" style="fill:#73746C">Library</text><text x="445" y="44" font-size="14" font-weight="500" class="nav" style="fill:#73746C">Jobs</text><text x="1398" y="44" font-size="13" font-weight="700" style="fill:#252721" text-anchor="end">Settings</text><line x1="1330" y1="66" x2="1398" y2="66" stroke="#B34E32" stroke-width="2"/><line x1="40" y1="71" x2="1400" y2="71" class="hair"/><text x="48" y="128" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">PREFERENCES</text><text x="48" y="172" font-size="38" font-weight="400" class="serif" style="fill:#252721">Settings</text><text x="48" y="199" font-size="13" font-weight="400" style="fill:#73746C">Appearance, rendering, and privacy choices.</text><line x1="48" y1="222" x2="1392" y2="222" class="hair"/><text x="48" y="259" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">APPEARANCE</text><text x="48" y="289" font-size="17" font-weight="400" class="serif" style="fill:#252721">Application theme</text><text x="48" y="315" font-size="12" font-weight="400" style="fill:#73746C">Choose the canvas and stage contrast.</text><rect x="48" y="335" width="124" height="46" rx="5" fill="#E7D0C5" stroke="#B34E32" stroke-width="1"/><text x="110" y="364" font-size="12" font-weight="650" style="fill:#252721" text-anchor="middle">Light table</text><rect x="183" y="335" width="124" height="46" rx="5" fill="#FBFAF7" stroke="#D6D2C9" stroke-width="1"/><text x="245" y="364" font-size="12" font-weight="500" style="fill:#73746C" text-anchor="middle">Evening</text><rect x="318" y="335" width="124" height="46" rx="5" fill="#FBFAF7" stroke="#D6D2C9" stroke-width="1"/><text x="380" y="364" font-size="12" font-weight="500" style="fill:#73746C" text-anchor="middle">System</text><line x1="48" y1="403" x2="666" y2="403" class="hair"/><text x="48" y="439" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">LOCAL RENDERING</text><text x="48" y="469" font-size="17" font-weight="400" class="serif" style="fill:#252721">Default output</text><rect x="48" y="488" width="148" height="46" rx="5" fill="#E7D0C5" stroke="#B34E32" stroke-width="1"/><text x="122" y="517" font-size="12" font-weight="650" style="fill:#252721" text-anchor="middle">PNG still</text><rect x="204" y="488" width="148" height="46" rx="5" fill="#FBFAF7" stroke="#D6D2C9" stroke-width="1"/><text x="278" y="517" font-size="12" font-weight="500" style="fill:#73746C" text-anchor="middle">MP4 clip</text><text x="48" y="562" font-size="12" font-weight="400" style="fill:#73746C">Render work stays on this device by default.</text><line x1="48" y1="593" x2="666" y2="593" class="hair"/><text x="48" y="629" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">OPTIONAL ACCOUNT</text><text x="48" y="659" font-size="17" font-weight="400" class="serif" style="fill:#252721">Vrooli credits, when you need them</text><text x="48" y="684" font-size="12" font-weight="400" style="fill:#73746C">Local projects work offline; sign in for funded provider operations.</text><rect x="48" y="705" width="148" height="46" rx="5" fill="#FBFAF7" stroke="#D6D2C9" stroke-width="1"/><text x="122" y="734" font-size="12" font-weight="650" style="fill:#252721" text-anchor="middle">Sign in</text><line x1="714" y1="246" x2="714" y2="912" class="hair"/><text x="758" y="259" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">PROVIDER &amp; AI</text><text x="758" y="289" font-size="20" font-weight="400" class="serif" style="fill:#252721">Generation is opt-in</text><text x="758" y="316" font-size="12" font-weight="400" style="fill:#73746C">Choose what may be included before a request.</text><text x="758" y="367" font-size="13" font-weight="600" style="fill:#252721">Image generation</text><rect x="1314" y="338" width="60" height="44" rx="0" fill="transparent"/><rect x="1320" y="346" width="48" height="28" rx="14" fill="#C9C9C2"/><rect x="1323" y="349" width="22" height="22" rx="11" fill="#fff"/><text x="758" y="393" font-size="11" font-weight="400" style="fill:#73746C">Off until you choose a provider and enable it.</text><line x1="758" y1="418" x2="1368" y2="418" class="hair"/><text x="758" y="455" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">PROVIDER SELECTION</text><rect x="758" y="472" width="610" height="46" rx="5" fill="#FBFAF7" stroke="#D6D2C9" stroke-width="1"/><text x="780" y="501" font-size="12" font-weight="500" style="fill:#73746C">Choose later</text><text x="1345" y="501" font-size="15" font-weight="500" style="fill:#73746C" text-anchor="end">⌄</text><line x1="758" y1="543" x2="1368" y2="543" class="hair"/><text x="758" y="580" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">REQUEST PRIVACY</text><text x="758" y="608" font-size="12" font-weight="400" style="fill:#252721">Review each request before anything is shared.</text><rect x="758" y="633" width="20" height="20" rx="3" fill="#B34E32"/><text x="768" y="648" font-size="14" font-weight="700" style="fill:#fff" text-anchor="middle">✓</text><text x="788" y="648" font-size="12" font-weight="500" style="fill:#252721">Ask before sending any source image</text><rect x="758" y="680" width="20" height="20" rx="3" fill="#B34E32"/><text x="768" y="695" font-size="14" font-weight="700" style="fill:#fff" text-anchor="middle">✓</text><text x="788" y="695" font-size="12" font-weight="500" style="fill:#252721">Keep project names out of requests</text><rect x="758" y="727" width="20" height="20" rx="3" fill="#B34E32"/><text x="768" y="742" font-size="14" font-weight="700" style="fill:#fff" text-anchor="middle">✓</text><text x="788" y="742" font-size="12" font-weight="500" style="fill:#252721">Include only the selected screen capture</text><text x="758" y="782" font-size="11" font-weight="400" style="fill:#73746C">These choices apply only to an explicitly started request.</text><rect x="758" y="821" width="176" height="46" rx="5" fill="#FBFAF7" stroke="#D6D2C9" stroke-width="1"/><text x="846" y="850" font-size="12" font-weight="650" style="fill:#252721" text-anchor="middle">Privacy details</text><rect x="0" y="960" width="1440" height="40" fill="#E6E1D8"/><text x="28" y="984" font-size="11" font-weight="700" class="smallcaps" style="fill:#53544F">CONCEPT PROPOSAL  /  ILLUSTRATIVE — NOT IMPLEMENTED</text></svg>