 </style><rect x="0" y="0" width="430" height="1000" rx="0" fill="#F2EFE8"/><rect x="0" y="0" width="430" height="68" rx="0" fill="#F2EFE8"/><text x="20" y="39" font-size="19" font-weight="700" class="serif" style="fill:#252721">Device Studio</text><line x1="20" y1="67" x2="410" y2="67" class="hair"/><text x="20" y="98" font-size="13" font-weight="500" class="nav" style="fill:#73746C">Projects</text><text x="130" y="98" font-size="13" font-weight="500" class="nav" style="fill:#73746C">Library</text><text x="235" y="98" font-size="13" font-weight="500" class="nav" style="fill:#73746C">Jobs</text><text x="410" y="98" font-size="13" font-weight="700" style="fill:#252721" text-anchor="end">Settings</text><line x1="364" y1="111" x2="410" y2="111" stroke="#B34E32" stroke-width="2"/><text x="20" y="146" font-size="31" font-weight="400" class="serif" style="fill:#252721">Settings</text><text x="20" y="172" font-size="12" font-weight="400" style="fill:#73746C">Appearance and local-first choices</text><text x="20" y="214" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">APPEARANCE</text><rect x="20" y="226" width="126" height="44" rx="4" fill="#E7D0C5" stroke="#B34E32" stroke-width="1"/><text x="83" y="254" font-size="10" font-weight="650" style="fill:#252721" text-anchor="middle">Light table</text><rect x="152" y="226" width="126" height="44" rx="4" fill="#FBFAF7" stroke="#D6D2C9" stroke-width="1"/><text x="215" y="254" font-size="10" font-weight="500" style="fill:#73746C" text-anchor="middle">Evening</text><rect x="284" y="226" width="126" height="44" rx="4" fill="#FBFAF7" stroke="#D6D2C9" stroke-width="1"/><text x="347" y="254" font-size="10" font-weight="500" style="fill:#73746C" text-anchor="middle">System</text><line x1="20" y1="291" x2="410" y2="291" class="hair"/><text x="20" y="319" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">LOCAL RENDERING</text><text x="20" y="345" font-size="13" font-weight="600" style="fill:#252