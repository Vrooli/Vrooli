" y="691" font-size="11" font-weight="600" style="fill:#252721" text-anchor="end">Choose later  ⌄</text><line x1="20" y1="726" x2="410" y2="726" class="hair"/><text x="20" y="754" font-size="10" font-weight="700" class="smallcaps" style="fill:#73746C">REQUEST PRIVACY</text><text x="20" y="780" font-size="11" font-weight="400" style="fill:#252721">Review each request before sharing.</text><rect x="20" y="796" width="20" height="20" rx="3" fill="#B34E32"/><text x="30" y="811" font-size="14" font-weight="700" style="fill:#fff" text-anchor="middle">✓</text><text x="50" y="811" font-size="12" font-weight="500" style="fill:#252721">Ask before sending a source image</text><rect x="20" y="840" width="20" height="20" rx="3" fill="#B34E32"/><text x="30" y="855" font-size="14" font-weight="700" style="fill:#fff" text-anchor="middle">✓</text><text x="50" y="855" font-size="12" font-weight="500" style="fill:#252721">Keep project names out of requests</text><rect x="20" y="884" width="20" height="20" rx="3" fill="#B34E32"/><text x="30" y="899" font-size="14" font-weight="700" style="fill:#fff" text-anchor="middle">✓</text><text x="50" y="899" font-size="12" font-weight="500" style="fill:#252721">Include only the selected screen</text><rect x="0" y="960" width="430" height="40" fill="#E6E1D8"/><text x="20" y="984" font-size="10" font-weight="700" class="smallcaps" style="fill:#53544F">CONCEPT PROPOSAL  /  ILLUSTRATIVE — NOT IMPLEMENTED</text></svg>