<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">Light-table physical still editor, desktop concept</title><desc id="desc">A candidate-only physical shot editor with guided Scene, Device, Screen, Motion, and Export steps. The stage explicitly has no render yet and shows source metadata rather than a fabricated 3D preview.</desc>
<style>
 text{font-family:Ubuntu,Arial,sans-serif;fill:#252721}.serif{font-family:'Bitstream Charter',Charter,serif}.muted{fill:#73746c}.tiny{font-size:11px;letter-spacing:1px;font-weight:700}.label{font-size:12px;font-weight:700}.body{font-size:14px}.meta{font-size:12px;fill:#73746c}.hair{stroke:#d6d2c9}.panel{fill:#fbfaf7;stroke:#d6d2c9}.step{font-size:13px}.value{font-size:13px;font-weight:600}.stage-muted{fill:#d3d1c9}.stage-strong{fill:#f2efe8}
</style>
<rect width="1440" height="1000" fill="#f2efe8"/><text x="42" y="45" class="serif" font-size="23" font-weight="700">Device Studio</text><text x="268" y="44" font-size="14" font-weight="700">Projects</text><text x="360" y="44" font-size="14" class="muted">Library</text><text x="445" y="44" font-size="14" class="muted">Jobs</text><text x="1398" y="44" font-size="13" class="muted" text-anchor="end">Settings</text><line x1="40" y1="71" x2="1400" y2="71" class="hair"/>
<text x="48" y="105" class="meta">Projects  /  New physical still</text><text x="48" y="143" class="serif" font-size="29">Light-table · phone study</text><rect x="1194" y="114" width="198" height="28" rx="14" fill="#f6e8d7"/><text x="1293" y="133" class="tiny" text-anchor="middle" fill="#7b4b19">CANDIDATE · NOT QUALIFIED</text><line x1="48" y1="163" x2="1392" y2="163" class="hair"/>
<g><text x="52" y="198" class="step muted">1  Scene</text><text x="151" y="198" class="step" font-weight="700">2  Device</text><text x="266" y="198" class="step muted">3  Screen</text><text x="375" y="198" class="step muted">4  Motion</text><text x="488" y="198" class="step muted">5  Export</text><line x1="145" y1="210" x2="224" y2="210" stroke="#b34e32" stroke-width="2"/></g>
<rect x="48" y="226" width="884" height="600" rx="5" fill="#292b29"/><text x="76" y="264" class="tiny stage-muted">SOURCE INPUT</text><rect x="76" y="284" width="828" height="365" rx="4" fill="#202220" stroke="#555750"/><rect x="360" y="319" width="260" height="294" rx="6" fill="#292b29" stroke="#7d7e76" stroke-dasharray="6 5"/><circle cx="490" cy="402" r="24" fill="none" stroke="#bcb9ae" stroke-width="2"/><path d="M490 388v28M476 402h28" stroke="#bcb9ae" stroke-width="2"/><text x="490" y="463" text-anchor="middle" font-size="17" class="stage-strong" font-weight="600">No render yet</text><text x="490" y="490" text-anchor="middle" font-size="13" class="stage-muted">The stage will show verified output here.</text><text x="490" y="513" text-anchor="middle" font-size="12" class="stage-muted">No 3D preview is implied by this source image.</text>
<line x1="76" y1="676" x2="904" y2="676" stroke="#555750"/><text x="78" y="708" class="tiny stage-muted">VERIFIED SCREEN SOURCE</text><text x="78" y="739" font-size="15" class="stage-strong" font-weight="600">Meridian · mobile capture</text><text x="78" y="763" font-size="12" class="stage-muted">source-frame84.png  ·  430 × 880  ·  SHA-256  8e4c…72b1</text><text x="78" y="799" font-size="12" class="stage-muted">Source raster only. Physical composition appears after a verified render.</text>
<rect x="956" y="226" width="436" height="600" rx="5" class="panel"/><text x="984" y="264" class="tiny muted">DEVICE CANDIDATE</text><text x="984" y="300" class="serif" font-size="21">Authored neutral phone</text><text x="984" y="326" class="meta">Revision 1  ·  candidate review  ·  sha 15…1fca</text><rect x="984" y="347" width="376" height="53" rx="4" fill="#f7f2e8" stroke="#e2d5bf"/><text x="1000" y="370" class="label">Candidate, not qualified</text><text x="1000" y="389" font-size="11" class="muted">Review permits local render/edit; it does not qualify output.</text>
<text x="984" y="439" class="label">Reviewed starter</text><rect x="984" y="452" width="376" height="44" rx="4" class="panel"/><text x="1000" y="480" class="body">Authored neutral phone · rev 1</text><path d="M1337 470l6 6 6-6" fill="none" stroke="#73746c" stroke-width="2"/><text x="984" y="528" class="label">Display</text><text x="1360" y="528" class="value" text-anchor="end">main_display</text><text x="984" y="551" class="meta">Screen mapping is resolved from the pinned model.</text><line x1="984" y1="574" x2="1360" y2="574" class="hair"/><text x="984" y="608" class="label">Render backend</text><text x="984" y="632" class="meta">Explicit selection · no automatic fallback</text><rect x="984" y="646" width="116" height="42" rx="4" fill="#e7d0c5" stroke="#b34e32"/><text x="1042" y="672" class="label" text-anchor="middle">OPTIX</text><rect x="1110" y="646" width="116" height="42" rx="4" class="panel"/><text x="1168" y="672" class="label muted" text-anchor="middle">CUDA</text><rect x="1236" y="646" width="124" height="42" rx="4" class="panel"/><text x="1298" y="672" class="label muted" text-anchor="middle">CPU</text><text x="984" y="719" class="meta">Unavailable choice returns an issue; it is never silently changed.</text><text x="984" y="767" class="tiny muted">ADVANCED PLACEMENT</text><text x="984" y="791" class="meta">Metres · quaternion · exact still-motion tick</text>
<line x1="48" y1="850" x2="1392" y2="850" class="hair"/><text x="48" y="883" class="meta">Saved revision 1  ·  Draft changes are not saved</text><rect x="1042" y="864" width="154" height="48" rx="5" fill="#fbfaf7" stroke="#d6d2c9"/><text x="1119" y="894" text-anchor="middle" class="body" font-weight="600">Save revision</text><rect x="1210" y="864" width="182" height="48" rx="5" fill="#b34e32"/><text x="1301" y="894" text-anchor="middle" font-size="14" font-weight="700" style="fill:#fff">Compile shot</text><text x="1390" y="952" text-anchor="end" class="tiny muted">CONCEPT PROPOSAL  /  ILLUSTRATIVE — NOT IMPLEMENTED</text>
