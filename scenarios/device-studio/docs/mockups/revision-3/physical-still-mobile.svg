<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1000" viewBox="0 0 430 1000" role="img" aria-labelledby="title desc">
<title id="title">Light-table physical still editor, mobile concept</title><desc id="desc">A sequential mobile physical editor with a verified source image, candidate-only notice, active device step, and safe-area navigation. There is no fabricated 3D preview.</desc>
