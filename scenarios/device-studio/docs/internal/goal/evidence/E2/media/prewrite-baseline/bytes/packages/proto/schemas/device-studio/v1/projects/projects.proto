syntax = "proto3";

package vrooli.device_studio.v1.projects;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/device-studio/v1/projects;projects_v1";

// Projects are durable roots of Device Studio work. Revision is an
// optimistic-concurrency token for metadata changes such as rename.
service ProjectsService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc RenameProject(RenameProjectRequest) returns (RenameProjectResponse);
}

message Project {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int64 revision = 5;
}

message ListProjectsRequest { int32 page_size = 1; string page_token = 2; }
message ListProjectsResponse { repeated Project projects = 1; string next_page_token = 2; }
message CreateProjectRequest { string name = 1; }
message CreateProjectResponse { Project project = 1; }
message GetProjectRequest { string id = 1; }
message GetProjectResponse { Project project = 1; }
message RenameProjectRequest {
  string id = 1;
  string name = 2;
  int64 expected_revision = 3;
}
message RenameProjectResponse { Project project = 1; }

// ProjectConflict is attached as a Connect error detail when an optimistic
// rename loses a race. Clients can explain the conflict without parsing text.
message ProjectConflict {
  string project_id = 1;
  int64 expected_revision = 2;
  int64 current_revision = 3;
}
