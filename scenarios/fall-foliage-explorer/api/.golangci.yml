run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gofumpt
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - unused
    - path: test_helpers\.go
      linters:
        - errcheck
        - unused
    - path: main\.go
      text: "Error return value of `\\(\\*encoding/json\\.Encoder\\)\\.Encode` is not checked"
      linters:
        - errcheck
