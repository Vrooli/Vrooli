# Architecture Cartographer's own architecture manifest.
#
# Used by the dogfood test (api/internal/conflicts/dogfood_test.go)
# and, once `go-code-graph` ships, by `arch-cart conflicts list
# scenarios/architecture-cartographer` to keep this scenario
# architecturally clean.
#
# Adding a new domain means three things in lockstep: a path glob
# here, an entry under docs/concepts/DOMAINS.md::Domain Inventory, and
# an internal/<name>/ package.
manifest_version: v1
scenario: architecture-cartographer

domains:
  - name: health
    paths:
      - api/handlers/health/**
    glossary:
      - HealthHandler

  - name: graph
    paths:
      - api/internal/graph/**
      - api/handlers/graph/**
      - packages/proto/schemas/architecture-cartographer/v1/graph/**
    glossary:
      - GraphSnapshot
      - FileNode
      - PackageNode
      - SymbolNode
      - ImportEdge
      - CodeGraphAdapter
      - Chunk

  - name: manifest
    paths:
      - api/internal/manifest/**
      - api/handlers/manifest/**
      - packages/proto/schemas/architecture-cartographer/v1/manifest/**
    glossary:
      - ManifestDefinition
      - DomainSpec
      - SignalWeights
      - Threshold
      - TransitionalDeclaration
      - Glossary
    allowed_dependencies:
      - graph

  - name: conflicts
    paths:
      - api/internal/conflicts/**
      - api/handlers/conflicts/**
      - packages/proto/schemas/architecture-cartographer/v1/conflicts/**
    glossary:
      - Conflict
      - Fix
      - Detector
      - Resolver
      - ResolutionStatus
      - AnalyticsRecorder
    allowed_dependencies:
      - graph
      - manifest
      - analytics

  - name: signals
    paths:
      - api/internal/signals/**
      - api/handlers/signals/**
      - packages/proto/schemas/architecture-cartographer/v1/signals/**
    glossary:
      - Signal
      - Score
      - Verdict
      - Tier
      - SignalDescriptor
      - Aggregator
      - GraphContext
    allowed_dependencies:
      - graph
      - manifest

  - name: apply
    paths:
      - api/internal/apply/**
      - api/handlers/apply/**
      - packages/proto/schemas/architecture-cartographer/v1/apply/**
    glossary:
      - Plan
      - Operation
      - OperationKind
      - ApplyRun
      - ApplyStatus
      - BuildBaseline
      - BuildGuard
      - Recipe
    allowed_dependencies:
      - conflicts
      - manifest
      - graph

  - name: analytics
    paths:
      - api/internal/analytics/**
      - api/handlers/analytics/**
      - packages/proto/schemas/architecture-cartographer/v1/analytics/**
    glossary:
      - Event
      - EventKind
      - Placement
      - Override
      - StatsSummary

shared_substrate:
  - api/internal/clock/**
  - api/internal/database/**
  - api/internal/httpc/**
  - api/internal/httpx/**
  - api/internal/middleware/**
  - api/internal/module/**
  - api/internal/modules/**
  - api/internal/server/**
  - api/internal/testutil/**
  - api/internal/git/**
  - api/cmd/**
  - api/main.go

signal_weights: {}
thresholds:
  - tier: auto_place
    min_value: 0.85
  - tier: suggest
    min_value: 0.55
transitional: []
