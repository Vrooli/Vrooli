<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello Desktop</title>
  </head>
  <body>
    <main>
      <h1>Hello Desktop</h1>
      <label>Name <input id="nameInput" value="Desktop User"></label>
      <button id="greetButton">Say Hello</button>
      <p id="result" aria-live="polite"></p>
    </main>
    <script>
      const api = window.API_BASE_URL || 'http://127.0.0.1:23100';
      const input = document.getElementById('nameInput');
      const result = document.getElementById('result');
      async function showGreeting(name, markInteractive = false) {
        const response = await fetch(`${api}/api/greet?name=${encodeURIComponent(name)}`);
        result.textContent = (await response.json()).message;
        if (markInteractive && performance.mark) performance.mark('app-interactive');
      }
      document.getElementById('greetButton').addEventListener('click', async () => {
        await showGreeting(input.value);
      });
      showGreeting(input.value, true).catch((error) => {
        result.textContent = `Unable to load greeting: ${error.message}`;
      });
    </script>
  </body>
</html>
