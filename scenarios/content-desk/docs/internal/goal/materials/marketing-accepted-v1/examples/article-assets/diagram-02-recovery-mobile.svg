<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="2710" viewBox="0 0 900 2710" role="img" aria-labelledby="title desc"><title id="title">Recover from evidence, mobile edition</title><desc id="desc">A missing result triggers inspection of the last confirmed state. Assess whether continuation is known, safe and within approval. If so, perform that known safe step. An uncertain consequential submission or changed scope goes to the owner, who may approve the next step or keep it on hold. Only if proceeding, perform the approved step, then inspect the actual result. A held step does not lead to execution. Attempted does not mean verified. Never blindly duplicate a submission.</desc><defs><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#E66F55"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#666777"/></marker></defs><rect x="0" y="0" width="900" height="2710" rx="0" fill="#FBF6F0"/><text x="65" y="86" font-family="DejaVu Sans" font-size="48" font-weight="600" fill="#272527" text-anchor="start" >Recover from evidence</text><text x="68" y="137" font-family="DejaVu Sans" font-size="38" font-weight="400" fill="#615D62" text-anchor="start" >Proposed recovery design</text><g transform="translate(802,88) scale(1.05)"><circle cx="27.0" cy="0.0" r="13" fill="#E66F55"/><circle cx="23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="23.38268590217984" r="13" fill="#E66F55"/><circle cx="1.6532731788489269e-15" cy="27.0" r="13" fill="#E66F55"/><circle cx="-13.499999999999995" cy="23.382685902179844" r="13" fill="#E66F55"/><circle cx="-23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="-27.0" cy="3.3065463576978537e-15" r="13" fill="#E66F55"/><circle cx="-23.382685902179848" cy="-13.499999999999993" r="13" fill="#E66F55"/><circle cx="-13.500000000000012" cy="-23.382685902179837" r="13" fill="#E66F55"/><circle cx="-4.95981953654678e-15" cy="-27.0" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="-23.38268590217984" r="13" fill="#E66F55"/><circle cx="23.382685902179837" cy="-13.500000000000012" r="13" fill="#E66F55"/><circle cx="0" cy="0" r="32" fill="#E66F55"/><circle cx="-11" cy="-4" r="5" fill="#272527"/><circle cx="13" cy="-4" r="5" fill="#272527"/><circle cx="13" cy="-4" r="12" fill="none" stroke="#272527" stroke-width="3"/><path d="M 24 4 Q 26 18 36 19" fill="none" stroke="#272527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="60" y="191" width="780" height="161" rx="25" fill="#F8E2D9"/><text x="95" y="255" font-family="DejaVu Sans" font-size="45" font-weight="600" fill="#272527" text-anchor="start" >Attempted ≠ verified</text><text x="95" y="314" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >No blind duplicate retries.</text><rect x="60" y="415" width="780" height="245" rx="25" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="2"/><text x="95" y="469" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#615D62" text-anchor="start" >01 · NOTICE</text><text x="95" y="527" font-family="DejaVu Sans" font-size="45" font-weight="600" fill="#272527" text-anchor="start" >The result is missing</text><text x="95" y="583" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Work has not yet</text><text x="95" y="633" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >been verified.</text><path d="M 450 660 V 688" fill="none" stroke="#666777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="60" y="700" width="780" height="245" rx="25" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="2"/><text x="95" y="754" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#615D62" text-anchor="start" >02 · INSPECT</text><text x="95" y="812" font-family="DejaVu Sans" font-size="45" font-weight="600" fill="#272527" text-anchor="start" >The last confirmed state</text><text x="95" y="868" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Establish what actually</text><text x="95" y="918" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >happened before continuing.</text><path d="M 450 945 V 973" fill="none" stroke="#666777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="60" y="985" width="780" height="245" rx="25" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="2"/><text x="95" y="1039" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#615D62" text-anchor="start" >03 · ASSESS</text><text x="95" y="1097" font-family="DejaVu Sans" font-size="45" font-weight="600" fill="#272527" text-anchor="start" >The next step</text><text x="95" y="1153" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Known, safe and within</text><text x="95" y="1203" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >the existing approval?</text><path d="M 450 1230 V 1252 H 245 V 1292" fill="none" stroke="#666777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><path d="M 450 1252 H 655 V 1292" fill="none" stroke="#E66F55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="60" y="1310" width="360" height="485" rx="25" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="2"/><text x="89" y="1370" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#272527" text-anchor="start" >SAFE +</text><text x="89" y="1420" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#272527" text-anchor="start" >IN SCOPE</text><text x="89" y="1507" font-family="DejaVu Sans" font-size="44" font-weight="600" fill="#272527" text-anchor="start" >Perform the</text><text x="89" y="1563" font-family="DejaVu Sans" font-size="44" font-weight="600" fill="#272527" text-anchor="start" >known safe</text><text x="89" y="1619" font-family="DejaVu Sans" font-size="44" font-weight="600" fill="#272527" text-anchor="start" >step</text><text x="89" y="1711" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Within the</text><text x="89" y="1761" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >approval.</text><rect x="480" y="1310" width="360" height="485" rx="25" fill="#E3E3EE"/><text x="509" y="1370" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#272527" text-anchor="start" >OWNER</text><text x="509" y="1420" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#272527" text-anchor="start" >DECISION</text><text x="509" y="1507" font-family="DejaVu Sans" font-size="44" font-weight="600" fill="#272527" text-anchor="start" >Approve the</text><text x="509" y="1563" font-family="DejaVu Sans" font-size="44" font-weight="600" fill="#272527" text-anchor="start" >next step</text><text x="509" y="1619" font-family="DejaVu Sans" font-size="44" font-weight="600" fill="#272527" text-anchor="start" >or hold.</text><text x="509" y="1706" font-family="DejaVu Sans" font-size="39" font-weight="400" fill="#615D62" text-anchor="start" >Uncertain</text><text x="509" y="1756" font-family="DejaVu Sans" font-size="39" font-weight="400" fill="#615D62" text-anchor="start" >action or scope.</text><path d="M 245 1795 V 2270 H 434" fill="none" stroke="#666777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><path d="M 640 1795 V 1846" fill="none" stroke="#E66F55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="480" y="1868" width="360" height="233" rx="25" fill="#F8E2D9"/><text x="506" y="1925" font-family="DejaVu Sans" font-size="38" font-weight="700" fill="#272527" text-anchor="start" >IF PROCEEDING</text><text x="509" y="1990" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#272527" text-anchor="start" >Perform the</text><text x="509" y="2043" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#272527" text-anchor="start" >approved step.</text><path d="M 640 2101 V 2218" fill="none" stroke="#666777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="455" y="2240" width="385" height="268" rx="25" fill="#272527"/><text x="485" y="2303" font-family="DejaVu Sans" font-size="43" font-weight="600" fill="#FFFDF9" text-anchor="start" >Inspect the</text><text x="485" y="2358" font-family="DejaVu Sans" font-size="43" font-weight="600" fill="#FFFDF9" text-anchor="start" >actual result</text><text x="485" y="2429" font-family="DejaVu Sans" font-size="38" font-weight="400" fill="#E3E3EE" text-anchor="start" >Evidence before</text><text x="485" y="2480" font-family="DejaVu Sans" font-size="38" font-weight="400" fill="#E3E3EE" text-anchor="start" >“complete.”</text><text x="60" y="2590" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >A timeout does not prove</text><text x="60" y="2644" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >that nothing happened.</text></svg>