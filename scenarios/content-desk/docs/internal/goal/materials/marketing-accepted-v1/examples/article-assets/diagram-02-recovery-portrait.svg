<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Recover from confirmed state, portrait</title><desc id="desc">A missing result triggers inspection of the last confirmed state. Assess whether continuation is known, safe and within approval. If so, perform that known safe step. An uncertain consequential submission or changed scope goes to the owner, who may approve the next step or keep it on hold. Only if proceeding, perform the approved step, then inspect the actual result. A held step does not lead to execution. Attempted does not mean verified. Never blindly duplicate a submission.</desc><defs><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#E66F55"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#666777"/></marker></defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FBF6F0"/><text x="65" y="86" font-family="DejaVu Sans" font-size="43" font-weight="600" fill="#272527" text-anchor="start" >Recover from confirmed state</text><text x="68" y="137" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#615D62" text-anchor="start" >Proposed recovery design · Attempted ≠ verified</text><g transform="translate(982,88) scale(1.05)"><circle cx="27.0" cy="0.0" r="13" fill="#E66F55"/><circle cx="23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="23.38268590217984" r="13" fill="#E66F55"/><circle cx="1.6532731788489269e-15" cy="27.0" r="13" fill="#E66F55"/><circle cx="-13.499999999999995" cy="23.382685902179844" r="13" fill="#E66F55"/><circle cx="-23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="-27.0" cy="3.3065463576978537e-15" r="13" fill="#E66F55"/><circle cx="-23.382685902179848" cy="-13.499999999999993" r="13" fill="#E66F55"/><circle cx="-13.500000000000012" cy="-23.382685902179837" r="13" fill="#E66F55"/><circle cx="-4.95981953654678e-15" cy="-27.0" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="-23.38268590217984" r="13" fill="#E66F55"/><circle cx="23.382685902179837" cy="-13.500000000000012" r="13" fill="#E66F55"/><circle cx="0" cy="0" r="32" fill="#E66F55"/><circle cx="-11" cy="-4" r="5" fill="#272527"/><circle cx="13" cy="-4" r="5" fill="#272527"/><circle cx="13" cy="-4" r="12" fill="none" stroke="#272527" stroke-width="3"/><path d="M 24 4 Q 26 18 36 19" fill="none" stroke="#272527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="90" y="192" width="900" height="142" rx="24" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="1.5"/><text x="118" y="229" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#615D62" text-anchor="start" >01 · NOTICE</text><text x="118" y="274" font-family="DejaVu Sans" font-size="34" font-weight="600" fill="#272527" text-anchor="start" >The result is missing</text><text x="118" y="308" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#615D62" text-anchor="start" >Work has not yet been verified.</text><path d="M 540 334 V 350" fill="none" stroke="#666777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="90" y="360" width="900" height="142" rx="24" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="1.5"/><text x="118" y="397" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#615D62" text-anchor="start" >02 · INSPECT</text><text x="118" y="442" font-family="DejaVu Sans" font-size="34" font-weight="600" fill="#272527" text-anchor="start" >The last confirmed state</text><text x="118" y="476" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#615D62" text-anchor="start" >Establish what actually happened.</text><path d="M 540 502 V 518" fill="none" stroke="#666777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="90" y="528" width="900" height="142" rx="24" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="1.5"/><text x="118" y="565" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#615D62" text-anchor="start" >03 · ASSESS</text><text x="118" y="610" font-family="DejaVu Sans" font-size="34" font-weight="600" fill="#272527" text-anchor="start" >The next step</text><text x="118" y="644" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#615D62" text-anchor="start" >Known, safe and within approval?</text><path d="M 540 670 V 703 H 273 V 725" fill="none" stroke="#666777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><path d="M 540 703 H 789 V 725" fill="none" stroke="#E66F55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="65" y="745" width="430" height="194" rx="24" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="1.5"/><text x="93" y="782" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#615D62" text-anchor="start" >SAFE + IN SCOPE</text><text x="93" y="827" font-family="DejaVu Sans" font-size="31" font-weight="600" fill="#272527" text-anchor="start" >Perform the known</text><text x="93" y="865" font-family="DejaVu Sans" font-size="31" font-weight="600" fill="#272527" text-anchor="start" >safe step</text><text x="93" y="913" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#615D62" text-anchor="start" >Within existing approval.</text><rect x="555" y="745" width="460" height="194" rx="24" fill="#E3E3EE" stroke="#D7CDD0" stroke-width="1.5"/><text x="583" y="782" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#615D62" text-anchor="start" >OWNER DECISION</text><text x="583" y="827" font-family="DejaVu Sans" font-size="31" font-weight="600" fill="#272527" text-anchor="start" >Approve next step</text><text x="583" y="865" font-family="DejaVu Sans" font-size="31" font-weight="600" fill="#272527" text-anchor="start" >or keep it on hold</text><text x="583" y="913" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#615D62" text-anchor="start" >Uncertain submission or scope.</text><path d="M 273 939 V 971 H 40 V 1230 H 375" fill="none" stroke="#666777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><path d="M 680 939 V 970" fill="none" stroke="#E66F55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-coral)"/><rect x="555" y="990" width="460" height="112" rx="22" fill="#F8E2D9"/><text x="580" y="1028" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#272527" text-anchor="start" >IF PROCEEDING</text><text x="580" y="1072" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#272527" text-anchor="start" >Perform the approved step.</text><path d="M 785 1102 V 1150" fill="none" stroke="#666777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="390" y="1170" width="625" height="125" rx="24" fill="#272527"/><text x="422" y="1216" font-family="DejaVu Sans" font-size="32" font-weight="600" fill="#FFFDF9" text-anchor="start" >Inspect the actual result</text><text x="422" y="1261" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#E3E3EE" text-anchor="start" >Evidence before “complete.”</text><text x="66" y="1047" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#615D62" text-anchor="start" >No blind</text><text x="66" y="1084" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#615D62" text-anchor="start" >duplicate retries.</text></svg>