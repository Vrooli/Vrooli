"#272527" text-anchor="start" >Approve or revise</text><text x="92" y="1554" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Authorize this assignment.</text><path d="M 450 1633 V 1653" fill="none" stroke="#666777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="60" y="1666" width="780" height="254" rx="25" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="2"/><g transform="translate(110,1716) scale(0.7)"><circle cx="27.0" cy="0.0" r="13" fill="#E66F55"/><circle cx="23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="23.38268590217984" r="13" fill="#E66F55"/><circle cx="1.6532731788489269e-15" cy="27.0" r="13" fill="#E66F55"/><circle cx="-13.499999999999995" cy="23.382685902179844" r="13" fill="#E66F55"/><circle cx="-23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="-27.0" cy="3.3065463576978537e-15" r="13" fill="#E66F55"/><circle cx="-23.382685902179848" cy="-13.499999999999993" r="13" fill="#E66F55"/><circle cx="-13.500000000000012" cy="-23.382685902179837" r="13" fill="#E66F55"/><circle cx="-4.95981953654678e-15" cy="-27.0" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="-23.38268590217984" r="13" fill="#E66F55"/><circle cx="23.382685902179837" cy="-13.500000000000012" r="13" fill="#E66F55"/><circle cx="0" cy="0" r="32" fill="#E66F55"/><circle cx="-11" cy="-4" r="5" fill="#272527"/><circle cx="13" cy="-4" r="5" fill="#272527"/><circle cx="13" cy="-4" r="12" fill="none" stroke="#272527" stroke-width="3"/><path d="M 24 4 Q 26 18 36 19" fill="none" stroke="#272527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="156" y="1731" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#615D62" text-anchor="start" >DOT</text><text x="92" y="1788" font-family="DejaVu Sans" font-size="43" font-weight="600" fill="#272527" text-anchor="start" >Execute, check, correct</text><text x="92" y="1841" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Check actual results. Routine</text><text x="92" y="1891" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >fixes stay within approval.</text><path d="M 450 1920 V 1940" fill="none" stroke="#666777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="60" y="1953" width="780" height="254" rx="25" fill="#E3E3EE" stroke="#D7CDD0" stroke-width="2"/><g transform="translate(110,2003) scale(0.7)"><circle cx="0" cy="0" r="37" fill="#272527"/><circle cx="0" cy="-10" r="9" fill="none" stroke="#FFFDF9" stroke-width="3"/><path d="M -17 18 Q -15 0 0 0 Q 15 0 17 18" fill="none" stroke="#FFFDF9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="156" y="2018" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#615D62" text-anchor="start" >YOU</text><text x="92" y="2075" font-family="DejaVu Sans" font-size="43" font-weight="600" fill="#272527" text-anchor="start" >Accept or request rework</text><text x="92" y="2128" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Judge the checked result.</text><text x="92" y="2178" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Rework stays in scope.</text><path d="M 450 2207 V 2227" fill="none" stroke="#666777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="60" y="2240" width="780" height="254" rx="25" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="2"/><g transform="translate(110,2290) scale(0.7)"><circle cx="27.0" cy="0.0" r="13" fill="#E66F55"/><circle cx="23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="23.38268590217984" r="13" fill="#E66F55"/><circle cx="1.65327317884