<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="2900" viewBox="0 0 900 2900" role="img" aria-labelledby="title desc"><title id="title">Work and the next decision, tall mobile edition</title><desc id="desc">Large-type mobile composition of one bounded assignment with a persistent parallel lookahead band. Independent proposals can be prepared while work runs or awaits review. Pending approval calls for surfacing ready owner decisions; dependent execution still waits for approval. Six steps separate owner decisions from dot work and in-scope rework. Wait only when no useful permitted action remains. Resume on an owner answer, task result or named check.</desc><defs><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#E66F55"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#666777"/></marker></defs><rect x="0" y="0" width="900" height="2900" rx="0" fill="#FBF6F0"/><text x="65" y="86" font-family="DejaVu Sans" font-size="48" font-weight="600" fill="#272527" text-anchor="start" >Work + what comes next</text><text x="68" y="137" font-family="DejaVu Sans" font-size="38" font-weight="400" fill="#615D62" text-anchor="start" >Proposed coordination design</text><g transform="translate(802,88) scale(1.05)"><circle cx="27.0" cy="0.0" r="13" fill="#E66F55"/><circle cx="23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="23.38268590217984" r="13" fill="#E66F55"/><circle cx="1.6532731788489269e-15" cy="27.0" r="13" fill="#E66F55"/><circle cx="-13.499999999999995" cy="23.382685902179844" r="13" fill="#E66F55"/><circle cx="-23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="-27.0" cy="3.3065463576978537e-15" r="13" fill="#E66F55"/><circle cx="-23.382685902179848" cy="-13.499999999999993" r="13" fill="#E66F55"/><circle cx="-13.500000000000012" cy="-23.382685902179837" r="13" fill="#E66F55"/><circle cx="-4.95981953654678e-15" cy="-27.0" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="-23.38268590217984" r="13" fill="#E66F55"/><circle cx="23.382685902179837" cy="-13.500000000000012" r="13" fill="#E66F55"/><circle cx="0" cy="0" r="32" fill="#E66F55"/><circle cx="-11" cy="-4" r="5" fill="#272527"/><circle cx="13" cy="-4" r="5" fill="#272527"/><circle cx="13" cy="-4" r="12" fill="none" stroke="#272527" stroke-width="3"/><path d="M 24 4 Q 26 18 36 19" fill="none" stroke="#272527" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="55" y="185" width="790" height="445" rx="26" fill="#F8E2D9"/><text x="88" y="247" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#272527" text-anchor="start" >LOOK AHEAD IN PARALLEL</text><text x="88" y="316" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#272527" text-anchor="start" >While work runs or awaits review,</text><text x="88" y="371" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#272527" text-anchor="start" >prepare independent proposals.</text><text x="88" y="444" font-family="DejaVu Sans" font-size="40" font-weight="600" fill="#272527" text-anchor="start" >Approval pending? Surface ready</text><text x="88" y="499" font-family="DejaVu Sans" font-size="40" font-weight="600" fill="#272527" text-anchor="start" >choices that unlock capacity.</text><text x="88" y="564" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Dependent work waits for</text><text x="88" y="615" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >the owner’s answer.</text><text x="58" y="711" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#272527" text-anchor="start" >ONE ASSIGNMENT WITHIN</text><text x="58" y="761" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#272527" text-anchor="start" >THE ONGOING OBJECTIVE</text><rect x="60" y="805" width="780" height="254" rx="25" fill="#E3E3EE" stroke="#D7CDD0" stroke-width="2"/><g transform="translate(110,855) scale(0.7)"><circle cx="0" cy="0" r="37" fill="#272527"/><circle cx="0" cy="-10" r="9" fill="none" stroke="#FFFDF9" stroke-width="3"/><path d="M -17 18 Q -15 0 0 0 Q 15 0 17 18" fill="none" stroke="#FFFDF9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="156" y="870" font-family="DejaVu Sans" font-size="39" font-weight="700" fill="#615D62" text-anchor="start" >YOU</text><text x="92" y="927" font-family="DejaVu Sans" font-size="43" font-weight="600" fill="#272527" text-anchor="start" >Set the objective</text><text x="92" y="980" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >Name the ongoing job</text><text x="92" y="1030" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#615D62" text-anchor="start" >and its limits.</text><path d="M 450 1059 V 1079" fill="none" stroke="#666777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="60" y="1092" width="780" height="254" rx="25" fill="#FFFDF9" stroke="#D7CDD0" stroke-width="2"/><g transform="translate(110,1142) scale(0.7)"><circle cx="27.0" cy="0.0" r="13" fill="#E66F55"/><circle cx="23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="23.38268590217984" r="13" fill="#E66F55"/><circle cx="1.6532731788489269e-15" cy="27.0" r="13" fill="#E66F55"/><circle cx="-13.499999999999995" cy="23.382685902179844" r="13" fill="#E66F55"/><circle cx="-23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="-27.0" cy="3.3065463576978537e-15" r="13" fill="#E66F55"/><circle cx="-23.382685902179848" cy="-13.499999999999993" r="13" fill="#E66F55"/