ecap="round" stroke-linejoin="round" marker-end="url(#arrow-ink)"/><rect x="60" y="2530" width="780" height="308" rx="25" fill="#272527"/><text x="94" y="2592" font-family="DejaVu Sans" font-size="42" font-weight="600" fill="#FFFDF9" text-anchor="start" >Wait only if no useful</text><text x="94" y="2647" font-family="DejaVu Sans" font-size="42" font-weight="600" fill="#FFFDF9" text-anchor="start" >permitted action remains.</text><text x="94" y="2724" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#E3E3EE" text-anchor="start" >Resume on an owner answer,</text><text x="94" y="2779" font-family="DejaVu Sans" font-size="40" font-weight="400" fill="#E3E3EE" text-anchor="start" >task result, or named check.</text></svg>