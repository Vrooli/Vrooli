<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Work and the next decision, portrait</title><desc id="desc">Parallel lookahead is shown before and alongside one assignment, not after owner acceptance. While work runs or awaits review, prepare independent next proposals and surface ready choices when approval is pending. Dependent work waits for the owner. Six stages show objective, proposal, approval, execution with in-scope correction, owner review and reassessment. Rework and next-proposal returns are explicit arrows. Wait only when no useful permitted action remains, resuming on an owner answer, task result or named check.</desc><defs><marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#E66F55"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#666777"/></marker></defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#FBF6F0"/><text x="65" y="86" font-family="DejaVu Sans" font-size="45" font-weight="600" fill="#272527" text-anchor="start" >Work + the next decision</text><text x="68" y="137" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#615D62" text-anchor="start" >Proposed coordination design</text><g transform="translate(982,88) scale(1.05)"><circle cx="27.0" cy="0.0" r="13" fill="#E66F55"/><circle cx="23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55"/><circle cx="13.500000000000004" cy="23.38268590217984" r="13" fill="#E66F55"/><circle cx="1.6532731788489269e-15" cy="27.0" r="13" fill="#E66F55"/><circle cx="-13.499999999999995" cy="23.382685902179844" r="13" fill="#E66F55"/><circle cx="-23.382685902179844" cy="13.499999999999998" r="13" fill="#E66F55