run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

linters-settings:
  gocyclo:
    min-complexity: 15
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: exported
        disabled: true
      - name: increment-decrement
      - name: var-declaration
      - name: range

issues:
  exclude-dirs:
    - mocks
    - testutil
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
        - gocyclo
    - path: mocks/
      linters:
        - all
  max-issues-per-linter: 0
  max-same-issues: 0
