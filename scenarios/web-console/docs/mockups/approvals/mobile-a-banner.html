<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Approvals — Mobile banner entrance (BannerRegion)</title>
<style>
:root{
  --wc-surface-base:2 6 23; --wc-surface-raised:15 23 42; --wc-surface-input:30 41 59;
  --wc-text-primary:248 250 252; --wc-text-muted:148 163 184; --wc-text-faint:100 116 139;
  --wc-border-default:255 255 255; --wc-accent:34 211 238; --wc-accent-fg:15 23 42;
  --wc-warning:245 178 63; --wc-error-detail:248 113 113;
  --font-sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-ctrl:.375rem;--r-pill:9999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:#0a0f1e;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;color:rgb(var(--wc-text-faint))}
.caption{font-size:12px;text-align:center;max-width:390px}
/* phone */
.phone{width:390px;height:780px;background:rgb(var(--wc-surface-base));border-radius:34px;border:1px solid rgb(var(--wc-border-default)/.12);overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:40}
/* top bar (already crowded — NO new icon added) */
.topbar{height:52px;padding:0 10px 0 14px;display:flex;align-items:center;gap:6px;background:rgb(var(--wc-surface-raised));border-bottom:1px solid rgb(var(--wc-border-default)/.1);padding-top:8px}
.title{font-size:15px;font-weight:600;color:rgb(var(--wc-text-primary))}
.unread{background:rgb(var(--wc-accent));color:rgb(var(--wc-accent-fg));border-radius:var(--r-pill);font-size:10px;font-weight:700;padding:1px 6px}
.tb-sp{flex:1}
.tb-ic{width:34px;height:34px;border-radius:var(--r-ctrl);display:flex;align-items:center;justify-content:center;color:rgb(var(--wc-text-muted));font-size:15px}
/* pending-approvals banner in BannerRegion */
.banner{margin:10px 12px;border-radius:12px;background:rgb(var(--wc-warning)/.12);border:1px solid rgb(var(--wc-warning)/.4);
  padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 2px 10px rgb(var(--wc-warning)/.06)}
.banner .ic{width:34px;height:34px;border-radius:50%;background:rgb(var(--wc-warning)/.2);display:flex;align-items:center;justify-content:center;color:rgb(var(--wc-warning));font-size:17px;flex:none}
.banner .txt{flex:1}
.banner .t1{font-size:14px;font-weight:600;color:rgb(var(--wc-text-primary))}
.banner .t2{font-size:12px;color:rgb(var(--wc-text-muted));margin-top:1px}
.banner .chev{color:rgb(var(--wc-warning));font-size:18px}
/* faint workspace behind */
.ws{padding:14px 12px;display:flex;flex-direction:column;gap:10px;opacity:.5}
.ws .card{background:rgb(var(--wc-surface-raised));border:1px solid rgb(var(--wc-border-default)/.08);border-radius:12px;height:72px}
/* mobile toolbar bottom (thumb zone) */
.bottombar{position:absolute;bottom:0;left:0;right:0;height:62px;background:rgb(var(--wc-surface-raised));border-top:1px solid rgb(var(--wc-border-default)/.1);display:flex;align-items:center;justify-content:space-around;padding-bottom:10px}
.bb{width:40px;height:40px;border-radius:var(--r-ctrl);display:flex;align-items:center;justify-content:center;color:rgb(var(--wc-text-muted));font-size:18px}
.lead{color:rgb(var(--wc-text-faint));font-size:11px;margin-top:14px}
.anno{font-size:11px;color:rgb(var(--wc-accent));position:absolute;background:rgb(var(--wc-surface-base)/.95);border:1px dashed rgb(var(--wc-accent)/.4);border-radius:6px;padding:3px 7px}
</style>
</head>
<body>
<div class="caption">Mobile · primary entrance = a pending-approvals banner in the existing BannerRegion, shown ONLY when pendingCount&gt;0. No new top-bar icon added (bar already crowded). Thumb-reachable tap opens the inbox.</div>
<div class="phone">
  <div class="notch"></div>
  <!-- existing crowded top bar: unread, title, +, devices, settings, account -->
  <div class="topbar">
    <span class="title">web-console</span><span class="unread">3</span>
    <span class="tb-sp"></span>
    <span class="tb-ic">＋</span><span class="tb-ic">🖥</span><span class="tb-ic">⚙</span><span class="tb-ic">◯</span>
  </div>
  <!-- the banner -->
  <div class="banner">
    <div class="ic">✓</div>
    <div class="txt"><div class="t1">3 approvals need you</div><div class="t2">1 expires in 1h 48m · tap to review</div></div>
    <div class="chev">›</div>
  </div>
  <div class="ws">
    <div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div>
  </div>
  <div class="bottombar"><span class="bb">☰</span><span class="bb">✦</span><span class="bb" style="color:rgb(var(--wc-accent))">🎤</span><span class="bb">⤢</span></div>
</div>
</body>
</html>
