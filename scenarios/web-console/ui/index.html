<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport directives — tightly coupled with useAppViewport.ts:
         • interactive-widget=resizes-content: browser shrinks the layout viewport
           when the virtual keyboard opens, so visualViewport.height reflects
           the real visible area.
         • viewport-fit=cover: extends the layout into safe areas (notch, rounded
           corners, home indicator) so env(safe-area-inset-*) has non-zero values.
         • maximum-scale/user-scalable: prevent pinch-zoom which fights our
           fixed-position layout.
         Do NOT remove these without also updating useAppViewport.ts and styles.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Browser-based terminal with pane workspaces, durable sessions, AI command generation, and mobile toolbar." />
    <meta name="application-name" content="Web Console" />

    <!-- Installable PWA / iOS standalone.
         apple-mobile-web-app-status-bar-style only takes effect when the app is
         web-app-capable; without these two metas iOS ignores black-translucent
         and draws an opaque system status bar that cannot show the tinted body
         (see docs/guides/ADAPTIVE_CHROME.md). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Web Console" />

    <!-- Icons + manifest (generated from public/logo.svg via brand-manager). -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Twitter link-preview cards. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Web Console" />
    <meta property="og:title" content="Web Console" />
    <meta property="og:description" content="Browser-based terminal with pane workspaces, durable sessions, AI command generation, and mobile toolbar." />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Web Console" />
    <meta name="twitter:description" content="Browser-based terminal with pane workspaces, durable sessions, AI command generation, and mobile toolbar." />
    <meta name="twitter:image" content="./og-image.png" />

    <title>Web Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
