plugins { id 'com.android.application' }
def metadata = new groovy.json.JsonSlurper().parse(rootProject.file('vrooli-native.json'))
android {
 namespace metadata.namespace ?: metadata.package_name
 compileSdk metadata.target_sdk
 buildToolsVersion '35.0.0'
 defaultConfig {
  applicationId metadata.package_name; minSdk 26; targetSdk metadata.target_sdk; versionCode metadata.version_code; versionName metadata.version_name
  def homeEnabled = metadata.home_enabled == true
  manifestPlaceholders = [appLabel: metadata.app_name, homeEnabled: homeEnabled.toString()]
  buildConfigField 'boolean', 'HOME_ENABLED', homeEnabled.toString()
 }
 buildFeatures { buildConfig true }
 signingConfigs { release { def path = System.getProperty('vrooli.android.signing.properties', ''); if (path) { def p = new Properties(); file(path).withInputStream { p.load(it) }; storeFile file(p['storeFile']); storePassword p['storePassword']; keyAlias p['keyAlias']; keyPassword p['keyPassword'] } } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Exercise the real dependency-free navigation model on every owner build.
// No Android test framework or extra dependency is needed for these policies.
def navigationClasses = layout.buildDirectory.dir('navigation-verification')
tasks.register('compileNavigationVerification', JavaCompile) {
 source file('src/main/java/com/vrooli/portal/tv/NavigationState.java'), rootProject.file('verification/NavigationStateTest.java'), file('src/main/java/com/vrooli/portal/tv/HomeOverridePolicy.java'), rootProject.file('verification/HomeOverridePolicyTest.java')
 classpath = files()
 destinationDirectory = navigationClasses
 sourceCompatibility = '17'; targetCompatibility = '17'
}
tasks.register('verifyNavigation', JavaExec) {
 dependsOn 'compileNavigationVerification'
 classpath = files(navigationClasses)
 mainClass = 'com.vrooli.portal.tv.NavigationStateTest'
}
tasks.named('preBuild').configure { dependsOn 'verifyNavigation' }
tasks.register('verifyHomeOverride', JavaExec) {
 dependsOn 'compileNavigationVerification'
 classpath = files(navigationClasses)
 mainClass = 'com.vrooli.portal.tv.HomeOverridePolicyTest'
 systemProperty 'tv.projectRoot', rootProject.projectDir.absolutePath
}
tasks.named('preBuild').configure { dependsOn 'verifyHomeOverride' }
