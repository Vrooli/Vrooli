# Workspace boundary — this surface is a standalone pnpm project.
#
# pnpm resolves its workspace by walking UP the directory tree until it finds a
# pnpm-workspace.yaml. Without this file, a plain `pnpm install` run here walks
# up to the repo root, silently joins the root packages/* workspace, ignores
# this project's lockfile/overrides, and regenerates stray root artifacts
# (a root package.json, pnpm-lock.yaml, and node_modules).
# This file stops that walk: plain `pnpm install` is now always scoped here,
# with or without the (still harmless) --ignore-workspace flag.
#
# Every scenario node surface needs this, not just ui/ — tools/ sidecars,
# playwright drivers, and platforms/electron all install in place.
packages:
  - .
minimumReleaseAge: 10080
