ed Format)\n1. **Validation Evidence** – Re-run the Quick Validation Loop (status, completeness, auditor, tests, ui-smoke) and list the exact commands plus where logs/output are stored. Include the completeness score before/after your changes and highlight which metrics improved.\n2. **Changes & Files** – Enumerate the operational targets/requirements you advanced and which files you touched (PRD notes, README, requirements modules, docs/PROGRESS.md, code/tests).\n3. **Current Scenario Health** – State what now works, what still fails, and any regressions you observed.\n4. **Next Steps / Risks** – Capture follow-up tasks, blockers, or recommendations so the next agent can pick up instantly.\n\nUse this structure for your final response; ecosystem-manager relies on it to track progress and plan the next iteration.\n\n## Steer focus: Control Surface & Tunable Levers Design\n\nPrioritize designing and refining this scenario’s **control surface**: the small set of **meaningful, safe levers** (config, options, flags, parameters) that shape its behavior.\n\nYour goal is to make it easy for humans and agents to **steer** the scenario without touching internal implementation, while avoiding over-configuration or unnecessary complexity.\n\nDo **not** break functionality, regress tests, or introduce new product features. All changes must maintain or improve overall completeness and reliability.\n\n---\n\n### **1. Discover Implicit Levers**\n\n* **If `docs/reference/configuration.md` exists**, read it first to understand what levers are already documented.\n\n* Scan the scenario for **hard-coded decisions** that meaningfully affect behavior, such as:\n  * thresholds, limits, timeouts, batch sizes\n  * strategy choices, modes, or feature toggles\n  * retry counts, backoff patterns, cache windows\n  * UX behaviors that could reasonably be tuned (e.g. debounce delays, pagination sizes)\n* Identify places where behavior is currently **“baked in”** but could be safely parameterized