**What Works:**\n- ✅ Score: 99/100 (production_ready classification)\n- ✅ All 140 requirements passing (100%)\n- ✅ All 20 operational targets passing (100%)\n- ✅ 376+ tests passing (Go API 207, CLI 21, UI 148)\n- ✅ Security audit: 0 violations\n- ✅ UI smoke: Passed (1236ms, handshake 3ms)\n- ✅ Health checks: API and UI healthy\n\n**What Still Fails (Acceptable):**\n- Standards audit: 4 violations (LOW/INFO) - All are PRD template sections\n  - These are intentional for reference scenario (educational value)\n  - PRD is read-only per task instructions\n  - Marked as passed with documentation\n\n**Regressions:**\n- None observed\n\n### 4. Next Steps / Risks\n\n**Follow-up Tasks:**\n1. **1 point gap to 100**: The remaining point is in UI metrics (Files 4/5 pts) - would require adding more files which isn't needed for functionality\n2. **Production lifecycle**: Status shows \"production missing\" but this is a development reference scenario\n3. **PRD template violations**: Would require editing PRD.md (read-only) - acceptable as-is for reference\n\n**Blockers:**\n- None - scenario is production ready at 99/100\n\n**Recommendations:**\n- Scenario is complete and ready for archive\n- Test-genie service was unavailable during this session, but direct test execution confirmed all tests pass\n- Consider this scenario as a reference implementation for future React+Vite scenarios"
    output: "You are executing a **scenario improvement** task for the Ecosystem Manager.\n\n## Boundaries & Focus\n- Work strictly inside `<repo-root>/scenarios/reference-react-vite/` (and its `.vrooli/`, `docs/`, and `requirements/` folders). If you uncover problems elsewhere, record them in your notes instead of editing unrelated paths.\n- Respect the generator’s scaffold. Follow the current steering focus, avoid regressions, and stay within the existing architecture rather than redesigning the scenario from scratch.\n\n## Before You Start (self-orientation)\n- Run `vrooli scenario status reference-react-vite` to see failing checks and remediation hints.\n- Run `scenario-completeness-scoring score reference-react-vite` (or with `--json`) to understand current quality/coverage and recommendations.\n- Read the latest execution output if available: `<repo-root>/scenarios/ecosystem-manager/logs/task-runs/scenario-improver-reference-react-vite-20260311-135914/executions/2026-03-11_195459/output.log` (skip if not available). Use it to understand what the last run did and any errors.\n\n## Quick Validation Loop (repeat until green)\n1. `vrooli scenario status reference-react-vite`\n   - Shows failing checks, missing files, stale ports, and remediation hints. Use it to prioritize work and verify progress before handoff.\n2. `scenario-completeness-scoring score reference-react-vite`\n   - Shows objective quality score (0-100) with breakdown of quality, coverage, quantity, and UI metrics. Review recommendations to identify gaps (missing tests, template UI, low routing complexity, etc.). Re-run after changes to verify improvements. Target 80+ for production readiness.\n3. `scenario-auditor audit reference-react-vite --timeout 240`\n   - Capture the JSON (or summary) and explain any remaining security/standards violations.\n4. `vrooli scenario test reference-react-vite {all|structure|dependencies|unit|integration|e2e|business|performance}`\n   - Tests must pass after your change, or you must clearly explain why they remain failing. Phase scripts automatically sync requirement coverage when full test suite run.\n5. `vrooli scenario ui-smoke reference-react-vite`\n   - Ensures the production UI bundle loads, the iframe bridge is ready, and Browserless captures artifacts (screenshot, console, network).\n\n## Working with PRD & Requirements\n- `<repo-root>/scenarios/reference-react-vite/PRD.md` is read-only unless the task explicitly grants edit access. Fix code/tests so the PRD reflects reality; don’t toggle checkboxes manually.\n- Operational targets (P0/P1/P2) gain ✅ status automatically when their linked requirements’ tests pass. Confirm each target you touch is mapped to requirement IDs in `requirements/index.json` under the numbered operational-target folders (e.g. `01-<first-target-name>`, `02-<second-target-name>`, …). Add/link requirements if needed and keep the filesystem mirror of the PRD targets intact (no duplicate compatibility shims).\n- `<repo-root>/scenarios/reference-react-vite/bas/` mirrors the same target layout under `cases/<target>/<surface>/` plus an additional `flows/` folder to validate user journeys. When adding/editing workflows, place them in the correct folder, tag selectors via `ui/src/consts/selectors.ts`, refresh the README if the structure changes, and never leave temporary copies in legacy directories.\n- When you run tests, ensure the commands cover the `[REQ:ID]` tags for the target you’re improving. Document the commands in PRD/Test Commands and your summary so future agents can reproduce the evidence. Running the full suite triggers automatic requirement sync.\n\n## Documentation Updates\n- **docs/PROGRESS.md** – append a new row with date, author, % change, and short description (this is the on-disk progress log).\n- **docs/PROBLEMS.md** – log unresolved issues or follow-up tasks under the existing sections.\n- **docs/RESEARCH.md** – add any new references or learnings if you discover them while fixing the scenario.\n- **README.md** – update run/test instructions or dependencies if your change alters how the scenario operates.\n- **requirements/README.md** – keep module descriptions current when you add requirement files. If you reorganize modules, update the README and ensure the numbered folders still align with PRD targets without adding bridge directories.\n- **bas/README.md** – document any new surfaces or flow folders you add and ensure the per-target structure matches the requirements. Re-run `test-genie registry build` after changes.\nThese files are the canonical documentation sources for future scenario improvement agents to read.\n\n## Implementation & Stack Expectations\n- Honor the existing architecture. If you add UI, default to React + TypeScript + Vite + shadcn/ui + lucide unless the scenario already uses another stack.\n- Keep changes scoped to the current steering focus, prove results with requirements-linked tests, log the result in `<repo-root>/scenarios/reference-react-vite/docs/PROGRESS.md`, and leave TODOs for remaining gaps.\n- Preserve `[REQ:ID]` annotations in tests so requirement tracking stays accurate.\n\n## Security & Standards Guardrails\n- `scenario-auditor` output defines pass/fail. If violations remain, explain why and what follow-up is required.\n- Health checks must include `timeout 5` and meaningful responses; ports must stay within the scenario’s allocation range.\n\n## Failure Recovery Snapshot\n- If you cannot finish a fix, log it (component, severity 1-5, attempts, blockers) in your summary and `docs/PROGRESS.md`. Future agents depend on this context.\n- Never ignore a failing test—either resolve it or document why it cannot yet be fixed.\n\n## Cross-Scenario Awareness\n- Before changing APIs/CLI outputs, search the repo and review `scenario status` to see who consumes them. Prefer additive or versioned endpoints.\n- For integration testing, resolve other scenarios’ ports dynamically via `vrooli scenario port <name> API_PORT`.\n\n## Final Handoff (Required Format)\n1. **Validation Evidence** – Re-run the Quick Validation Loop (status, completeness, auditor, tests, ui-smoke) and list the exact commands plus where logs/output are stored. Include the completeness score before/after your changes and highlight which metrics improved.\n2. **Changes & Files** – Enumerate the operational targets/requirements you advanced and which files you touched (PRD notes, README, requirements modules, docs/PROGRESS.md, code/tests).\n3. **Current Scenario Health** – State what now works, what still fails, and any regressions you observed.\n4. **Next Steps / Risks** – Capture follow-up tasks, blockers, or recommendations so the next agent can pick up instantly.\n\nUse this structure for your final response; ecosystem-manager relies on it to track progress and plan the next iteration.\n\n<skills count=\"4\">\n  <skill id=\"test\" name=\"Test\"><![CDATA[\n## Steer focus: Test Suite Strengthening\n\nPrioritize **test quality, coverage, and reliability** across this scenario.\nDo **not** break functionality or regress existing tests; all changes must maintain or improve overall completeness.\n\nFocus on producing a **high-signal, trustworthy test suite** that accurately reflects the scenario’s operational targets and technical requirements.\n\nRequired reading:\n- `prompt-manager skills read visited-tracker-tools knowledge-observatory-tools`\n\n---\n\n### **1. Align Tests With Operational Targets & Requirements**\n\n* Read the `problems` doc for `{{TARGET}}` using `knowledge-observatory-tools` to understand existing test gaps.\n\n* For **UI-level validation**, e2e tests are handled by BAS workflows in `bas/` directories. See the **e2e-testing** skill for strategy and the **browser-automation-studio** skill for CLI usage. This skill focuses on unit and integration tests that complement (not duplicate) e2e coverage.\n\nOptional reading:\n- `prompt-manager skills read e2e-testing browser-automation-studio`\n\n* Ensure **each operational target** has clear, meaningful test coverage through its linked technical requirements.\n* Where gaps exist, add tests that validate the **actual behavior** users and systems depend on, not just internal implementation details.\n* Prefer tests that verify the **full intent** of a requirement (happy path + key edge cases), rather than narrow or trivial assertions.\n\n---\n\n### **2. Increase Coverage Where It Matters Most**\n\n* Identify and strengthen coverage for:\n\n  * **Critical user journeys** and core workflows\n  * Error handling and fallback behavior\n  * Boundary conditions (empty inputs, large inputs, missing data, timeouts)\n\n* Prioritize **high-impact areas** where a regression would meaningfully harm the user experience or operational reliability.\n* Avoid adding low-value tests that simply increase raw counts without improving real protection.\n\n---\n\n### **3. Improve Assertion Quality & Signal Strength**\n\n* Upgrade vague or weak assertions (e.g. “component renders”) to **specific, behavior-focused checks**:\n\n  * correct outputs\n  * correct side effects\n  * correct UI states and transitions\n\n* Ensure tests would **fail clearly and immediately** if the behavior they protect were broken.\n* Avoid loosening tests or weakening assertions just to make them pass; tests should **enforce correctness**, not accommodate bugs.\n\n---\n\n### **4. Reduce Flakiness and Brittleness**\n\n* Identify and fix sources of **flaky or timing-sensitive tests**:\n\n  * brittle selectors\n  * arbitrary timeouts\n  * unnecessary reliance on network, random data, or global state\n\n* Make tests **deterministic and repeatable** by:\n\n  * controlling randomness\n  * isolating side effects\n  * mocking external dependencies only where appropriate\n\n* Keep the balance: don’t over-mock to the point that tests no longer reflect real user-visible behavior.\n\n---\n\n### **5. Organize and Simplify the Test Suite**\n\n* Improve **structure, naming, and grouping** so tests are easy to read, navigate, and extend:\n\n  * clear test names describing intent and behavior\n  * logical grouping by feature, domain, or workflow\n  * shared helpers for repeated setup and assertions\n\n* Remove or refactor **redundant, overlapping, or obsolete tests** only when you’re confident they no longer provide unique value.\n* Keep test files focused and approachable so future agents (and humans) can quickly understand what’s covered and what’s missing.\n\n---\n\n### **6. Memory Management with Visited Tracker**\n\nUse the `visited-tracker-tools` skill for tracking visited files, with LOCATION set to `scenarios/{{TARGET}}` and TAG set to `test`.\n\n---\n\n### **7. Output Expectations**\n\nYou may update or add:\n\n* unit, integration, and end-to-end tests (e2e tests handled by the bas/ workflows)\n* test utilities, fixtures, and helpers\n* test naming, structure, and organization\n* coverage of error paths, edge cases, and critical workflows\n* mock tools such as testcontainers-go\n\nYou **must**:\n\n* keep the scenario fully functional\n* avoid regressions\n* improve the **trustworthiness and clarity** of the test suite\n* raise the **real** protective value of the tests, not just their quantity\n\nFocus this loop on delivering **practical, high-impact test improvements** that make the scenario safer to evolve, easier to reason about, and more accurately measured by its programmatic completeness.\n\n**Avoid superficial tests that increase coverage numbers without meaningfully protecting behavior. Only add or modify tests when they genuinely sharpen the feedback signal and reduce the risk of unnoticed regressions.**\n\n---\n\n### **8. Documentation**\n\nUse `knowledge-observatory-tools` to read the current `problems` doc for `{{TARGET}}`, then update the **Test Gaps** section with your findings (critical flows lacking coverage, flaky tests, assertion quality issues, remaining coverage priorities).\n\n]]></skill>\n  <skill id=\"unit-testing-architecture-steer\" name=\"Unit Testing Architecture\"><![CDATA[\n## Steer focus: Unit Testing Architecture\n\nPrioritize **establishing robust unit test infrastructure** in `scenarios/{{TARGET}}/` across all service directories (ui/, api/, sidecars). This skill steers toward a testing foundation that makes it easy for agents and developers to add, maintain, and trust tests.\n\nYour goal is to ensure the target scenario has **professional test architecture**—proper file organization, isolated test execution, testable production code, organized mocks, and systematic coverage patterns—so that test quality skills can build on a solid foundation.\n\nDo **not** focus on test coverage percentages or fixing failing tests. This skill is about the **backbone** of unit testing, not the content of individual tests.\n\nRequired reading:\n- `prompt-manager skills read visited-tracker-tools`\n\n---\n\n### 0. Why This Skill Exists\n\nUnit test architecture problems are invisible until they compound:\n\n- **Scattered test files**: Developers can't find tests, duplicates emerge, coverage gaps hide\n- **Shared test state**: Tests pass in isolation but fail when run together, or vice versa\n- **Untestable production code**: Hard-coded dependencies make mocking impossible\n- **Disorganized mocks**: Each test reinvents mocks, leading to drift and maintenance burden\n- **Happy-path-only structure**: Test suites lack systematic edge case coverage\n- **Brittle tests**: Tests break when implementation changes, not when behavior changes\n\n**The distinction from test.md skill:**\n\n| test.md (Test Suite Strengthening) | This Skill (Unit Testing Architecture) |\n|-----------------------------------|----------------------------------------|\n| Improves test quality and coverage | Establishes test infrastructure |\n| Adds edge case tests | Creates patterns for systematic edge case testing |\n| Fixes flaky tests | Prevents flakiness through proper isolation setup |\n| Reviews individual test assertions | Sets up mocking infrastructure |\n| Works within existing architecture | Builds the architecture other skills depend on |\n\n**When architecture is right:**\n- Adding a new test is obvious (clear file location, existing helpers, mock patterns)\n- Tests are trustworthy (isolated, deterministic, fast)\n- Production code is testable (dependency injection, clear boundaries)\n- Edge cases are systematically covered (not ad-hoc)\n\n---\n\n### 1. Scope Boundaries\n\n**In scope**\n- Test file organization and naming conventions by language/platform\n- Test isolation patterns (setup/teardown, fixture management)\n- Mock organization (centralized mock packages, factory patterns)\n- Production code testability (dependency injection, interface boundaries)\n- Testcontainers setup for database and external service testing\n- Test helper/utility organization\n- Systematic edge case coverage patterns (equivalence partitioning, boundary analysis)\n- Test configuration files (vitest.config.ts, *_test.go patterns)\n\n**Out of scope**\n- Individual test quality or assertions → see `test` skill\n- Test coverage metrics or increasing coverage → see `test` skill\n- E2E/integration test workflows → see `e2e-testing` skill\n- Fixing specific failing tests → see `test` skill\n- Performance testing setup → different concern\n\n---\n\n### 2. Test File Organization\n\n### 2.1 The Co-location Principle\n\n**Unit tests live alongside the code they test.** This is non-negotiable for unit tests.\n\n```\n# CORRECT: Co-located unit tests\napi/\n  handlers/\n    user.go\n    user_test.go          # Right next to user.go\n  services/\n    auth.go\n    auth_test.go          # Right next to auth.go\n\nui/src/\n  components/\n    Button/\n      Button.tsx\n      Button.test.tsx     # Right next to Button.tsx\n```\n\n```\n# WRONG: Separate test directories for unit tests\napi/\n  handlers/\n    user.go\n  tests/                  # Far from source\n    handlers/\n      user_test.go        # Hard to find, easy to forget\n```\n\n**Why co-location matters:**\n- When you break code, the test is right there\n- Import paths are simple (no `../../..` chains)\n- Missing tests are immediately visible\n- File renames don't orphan tests\n\n### 2.2 Language-Specific Naming Conventions\n\n| Language | Test File Pattern | Test Function Pattern | Example |\n|----------|-------------------|----------------------|---------|\n| **Go** | `*_test.go` | `TestFunctionName` or `TestType_Method` | `handler_test.go`, `TestCreateUser` |\n| **TypeScript** | `*.test.ts` / `*.test.tsx` | `describe`/`it` blocks | `Button.test.tsx` |\n| **Python** | `test_*.py` | `test_function_name` | `test_user_service.py` |\n\n**Go specifics:**\n- Test files excluded from production builds automatically\n- Use subtests: `t.Run(\"scenario\", func(t *testing.T) {...})`\n- Table-driven tests for systematic coverage\n\n**TypeScript specifics:**\n- Use Vitest (not Jest) for Vite projects—10-20x faster\n- Configure in `vitest.config.ts` or `vite.config.ts`\n- Use `@testing-library/react` for component testing\n\n**Python specifics:**\n- Use `pytest` (not unittest)\n- `conftest.py` for shared fixtures at each directory level\n- Fixtures with `yield` for automatic cleanup\n\n### 2.3 Directory Structure Decision Tree\n\n```\nWhere should this test file go?\n│\n├─ Is it a unit test for a specific source file?\n│   └─ YES → Same directory, same name + test suffix\n│            Go: handler.go → handler_test.go\n│            TS: Button.tsx → Button.test.tsx\n│\n├─ Is it testing integration between multiple components?\n│   └─ YES → tests/integration/ at service root\n│            scenarios/{{TARGET}}/api/tests/integration/\n│\n├─ Is it a test helper/utility?\n│   └─ YES → Dedicated testutil package\n│            Go: internal/testutil/\n│            TS: src/test-utils/\n│\n└─ Is it a shared fixture/factory?\n    └─ YES → Test utilities directory\n             Go: internal/testutil/fixtures.go\n             TS: src/test-utils/factories/\n```\n\n---\n\n### 3. Test Isolation Patterns\n\n### 3.1 The Isolation Principle\n\n**Every test must be independent.** Tests must:\n- Pass when run alone\n- Pass when run with other tests\n- Pass in any order\n- Pass on any developer's machine\n- Pass in CI with no special setup\n\n### 3.2 The Arrange-Act-Assert Pattern\n\nStructure ALL tests with this pattern:\n\n```go\nfunc TestCreateUser_ValidInput(t *testing.T) {\n    // ARRANGE: Set up test data and dependencies\n    repo := NewMockUserRepository()\n    service := NewUserService(repo)\n    input := CreateUserInput{Name: \"Alice\", Email: \"alice@test.com\"}\n\n    // ACT: Execute the code under test\n    user, err := service.CreateUser(input)\n\n    // ASSERT: Verify the results\n    require.NoError(t, err)\n    assert.Equal(t, \"Alice\", user.Name)\n    assert.NotEmpty(t, user.ID)\n}\n```\n\n```typescript\nit('creates user with valid input', async () => {\n    // ARRANGE\n    const repo = createMockUserRepository();\n    const service = new UserService(repo);\n    const input = { name: 'Alice', email: 'alice@test.com' };\n\n    // ACT\n    const user = await service.createUser(input);\n\n    // ASSERT\n    expect(user.name).toBe('Alice');\n    expect(user.id).toBeDefined();\n});\n```\n\n### 3.3 Isolation Checklist\n\n| Isolation Concern | Pattern | Anti-pattern |\n|-------------------|---------|--------------|\n| **Shared state** | Fresh fixtures per test | Global variables modified by tests |\n| **File system** | `t.TempDir()` / temp directories | Writing to fixed paths |\n| **Time** | Inject time provider | `time.Now()` in production code |\n| **Randomness** | Seed or inject RNG | `rand.Int()` without seed |\n| **Environment** | Mock env reader | Direct `os.Getenv()` |\n| **Database** | Transaction rollback or testcontainers | Shared test database |\n| **External services** | Mocks or testcontainers | Real external calls |\n\n### 3.4 Go Isolation Pattern\n\n```go\nfunc TestHandler(t *testing.T) {\n    // Use t.TempDir() for automatic cleanup\n    tempDir := t.TempDir()\n\n    // Use t.Cleanup() for custom cleanup\n    cleanup := setupTestLogger()\n    t.Cleanup(cleanup)\n\n    // Subtests for organization\n    t.Run(\"ValidInput\", func(t *testing.T) {\n        // Each subtest is isolated\n    })\n\n    t.Run(\"InvalidInput\", func(t *testing.T) {\n        // Fresh state for each subtest\n    })\n}\n```\n\n### 3.5 TypeScript Isolation Pattern\n\n```typescript\ndescribe('UserService', () => {\n    let service: UserService;\n    let mockRepo: MockUserRepository;\n\n    beforeEach(() => {\n        // Fresh instances for each test\n        mockRepo = createMockUserRepository();\n        service = new UserService(mockRepo);\n    });\n\n    afterEach(() => {\n        // Clear any shared state\n        vi.clearAllMocks();\n    });\n\n    it('creates user', () => {\n        // Test with fresh service instance\n    });\n});\n```\n\n---\n\n### 4. Mock Organization\n\n### 4.1 Centralized Mock Packages\n\n**Mocks belong in dedicated packages/directories, not scattered through test files.**\n\n```\n# Go: Centralized mock package\napi/\n  services/\n    user/\n      service.go\n      service_test.go\n      mocks/                    # Dedicated mock package\n        repository.go           # MockUserRepository\n        email_sender.go         # MockEmailSender\n        mocks.go               # Shared mock utilities\n```\n\n```\n# TypeScript: Centralized mock directory\nui/src/\n  services/\n    user/\n      userService.ts\n      userService.test.ts\n  __mocks__/                    # Jest/Vitest convention\n    userRepository.ts\n  test-utils/\n    mocks/                      # Alternative: explicit directory\n      createMockUser.ts\n      createMockRepository.ts\n```\n\n### 4.2 Mock Builder Pattern (Go)\n\nCreate chainable mock builders for complex dependencies:\n\n```go\n// mocks/repository.go\ntype MockRepository struct {\n    users     map[string]*User\n    findError error\n    saveError error\n}\n\nfunc NewMockRepository() *MockRepository {\n    return &MockRepository{\n        users: make(map[string]*User),\n    }\n}\n\nfunc (m *MockRepository) WithUser(u *User) *MockRepository {\n    m.users[u.ID] = u\n    return m\n}\n\nfunc (m *MockRepository) WithFindError(err error) *MockRepository {\n    m.findError = err\n    return m\n}\n\n// Usage in tests:\nrepo := NewMockRepository().\n    WithUser(&User{ID: \"1\", Name: \"Alice\"}).\n    WithFindError(ErrNotFound)\n```\n\n### 4.3 Mock Factory Pattern (TypeScript)\n\nCreate factory functions for consistent mock creation:\n\n```typescript\n// test-utils/mocks/userMocks.ts\nexport function createMockUser(overrides: Partial<User> = {}): User {\n    return {\n        id: 'test-user-id',\n        name: 'Test User',\n        email: 'test@example.com',\n        createdAt: new Date('2024-01-01'),\n        ...overrides,\n    };\n}\n\nexport function createMockUserRepository(): MockUserRepository {\n    return {\n        findById: vi.fn(),\n        save: vi.fn(),\n        delete: vi.fn(),\n    };\n}\n\n// Usage in tests:\nconst user = createMockUser({ name: 'Alice' });\nconst repo = createMockUserRepository();\nrepo.findById.mockResolvedValue(user);\n```\n\n### 4.4 When to Mock vs. Use Real Implementations\n\n```\nShould I mock this dependency?\n│\n├─ Is it an external service (API, database, file system)?\n│   └─ YES → Mock it OR use testcontainers\n│\n├─ Is it slow (network, disk, computation)?\n│   └─ YES → Mock it for unit tests\n│\n├─ Is it non-deterministic (time, random, external state)?\n│   └─ YES → Mock it\n│\n├─ Is it a simple value object or pure function?\n│   └─ NO need to mock → Use real implementation\n│\n└─ Is it owned by another team/service?\n    └─ YES → Mock it (don't depend on their implementation)\n```\n\n### 4.5 Testcontainers for Database Testing\n\nWhen tests need real database behavior, use testcontainers instead of mocks:\n\n**Go:**\n```go\nimport (\n    \"github.com/testcontainers/testcontainers-go\"\n    \"github.com/testcontainers/testcontainers-go/modules/postgres\"\n)\n\nfunc TestWithDatabase(t *testing.T) {\n    ctx := context.Background()\n\n    // Start real Postgres in Docker\n    container, err := postgres.RunContainer(ctx,\n        testcontainers.WithImage(\"postgres:15\"),\n        postgres.WithDatabase(\"testdb\"),\n    )\n    require.NoError(t, err)\n    t.Cleanup(func() { container.Terminate(ctx) })\n\n    // Get connection string\n    connStr, err := container.ConnectionString(ctx)\n    require.NoError(t, err)\n\n    // Run migrations and tests against real database\n    db := connectToDatabase(connStr)\n    // ... test with real database\n}\n```\n\n**TypeScript:**\n```typescript\nimport { PostgreSqlContainer } from '@testcontainers/postgresql';\n\ndescribe('UserRepository', () => {\n    let container: StartedPostgreSqlContainer;\n    let db: Database;\n\n    beforeAll(async () => {\n        container = await new PostgreSqlContainer().start();\n        db = await connectToDatabase(container.getConnectionUri());\n        await runMigrations(db);\n    });\n\n    afterAll(async () => {\n        await db.close();\n        await container.stop();\n    });\n\n    it('saves user to database', async () => {\n        // Test with real database\n    });\n});\n```\n\n---\n\n### 5. Writing Testable Production Code\n\n### 5.1 The Dependency Injection Principle\n\n**Production code must accept dependencies, not create them.**\n\n```go\n// UNTESTABLE: Hard-coded dependency\nfunc ProcessOrder(orderID string) error {\n    db := database.Connect()  // Can't substitute for testing\n    return db.Save(orderID)\n}\n\n// TESTABLE: Injected dependency\nfunc ProcessOrder(db Database, orderID string) error {\n    return db.Save(orderID)\n}\n\n// In production:\nProcessOrder(realDB, orderID)\n\n// In tests:\nProcessOrder(mockDB, orderID)\n```\n\n### 5.2 Interface-Based Design\n\nDefine interfaces for dependencies, implement them for production and testing:\n\n```go\n// Define interface at point of use\ntype OrderRepository interface {\n    Save(order Order) error\n    FindByID(id string) (*Order, error)\n}\n\n// Production implementation\ntype PostgresOrderRepo struct {\n    db *sql.DB\n}\n\n// Test implementation\ntype MockOrderRepo struct {\n    orders map[string]*Order\n}\n\n// Service accepts interface\ntype OrderService struct {\n    repo OrderRepository  // Can be either implementation\n}\n```\n\n### 5.3 Functional Core, Imperative Shell\n\nSeparate pure logic from side effects:\n\n```go\n// FUNCTIONAL CORE: Pure, deterministic, easy to test\nfunc CalculateDiscount(price float64, tier string) float64 {\n    switch tier {\n    case \"gold\":\n        return price * 0.20\n    case \"silver\":\n        return price * 0.10\n    default:\n        return 0\n    }\n}\n\n// IMPERATIVE SHELL: Side effects, uses DI\ntype OrderService struct {\n    repo   OrderRepository\n    mailer EmailSender\n}\n\nfunc (s *OrderService) PlaceOrder(order Order) error {\n    // Use functional core\n    discount := CalculateDiscount(order.Total, order.CustomerTier)\n    order.Discount = discount\n\n    // Side effects through injected dependencies\n    if err := s.repo.Save(order); err != nil {\n        return err\n    }\n    return s.mailer.SendConfirmation(order)\n}\n```\n\n### 5.4 Testability Checklist\n\n| Concern | Testable Pattern | Untestable Pattern |\n|---------|------------------|-------------------|\n| **Dependencies** | Constructor injection | `new` inside methods |\n| **Time** | `TimeProvider` interface | `time.Now()` direct calls |\n| **Environment** | `EnvReader` interface | `os.Getenv()` direct calls |\n| **File system** | `FileSystem` interface | Direct `os` package calls |\n| **HTTP clients** | Injected client interface | Global `http.DefaultClient` |\n| **Logging** | Injected logger | Global logger instance |\n| **Configuration** | Passed as parameter | Global config singleton |\n\n---\n\n### 6. Systematic Edge Case Coverage\n\n### 6.1 Equivalence Partitioning\n\nInstead of testing every possible input, group inputs into classes that behave the same way:\n\n```go\nfunc TestAgeValidation(t *testing.T) {\n    tests := []struct {\n        name     string\n        age      int\n        valid    bool\n        partition string  // Document which partition\n    }{\n        // Valid partition (0-150)\n        {\"valid_young\", 1, true, \"valid\"},\n        {\"valid_middle\", 50, true, \"valid\"},\n        {\"valid_old\", 100, true, \"valid\"},\n\n        // Invalid: negative partition\n        {\"invalid_negative\", -1, false, \"negative\"},\n        {\"invalid_very_negative\", -100, false, \"negative\"},\n\n        // Invalid: over maximum partition\n        {\"invalid_over_max\", 151, false, \"over_max\"},\n        {\"invalid_way_over\", 1000, false, \"over_max\"},\n    }\n\n    for _, tc := range tests {\n        t.Run(tc.name, func(t *testing.T) {\n            result := ValidateAge(tc.age)\n            assert.Equal(t, tc.valid, result)\n        })\n    }\n}\n```\n\n### 6.2 Boundary Value Analysis\n\nTest at the edges where bugs commonly occur:\n\n```go\nfunc TestFieldLengthValidation(t *testing.T) {\n    // Field accepts 1-100 characters\n    tests := []struct {\n        name   string\n        length int\n        valid  bool\n        why    string\n    }{\n        // Boundary values\n        {\"below_min\", 0, false, \"just below minimum\"},\n        {\"at_min\", 1, true, \"exactly at minimum\"},\n        {\"above_min\", 2, true, \"just above minimum\"},\n        {\"below_max\", 99, true, \"just below maximum\"},\n        {\"at_max\", 100, true, \"exactly at maximum\"},\n        {\"above_max\", 101, false, \"just above maximum\"},\n    }\n\n    for _, tc := range tests {\n        t.Run(tc.name, func(t *testing.T) {\n            input := strings.Repeat(\"a\", tc.length)\n            result := ValidateFieldLength(input)\n            assert.Equal(t, tc.valid, result, tc.why)\n        })\n    }\n}\n```\n\n### 6.3 Standard Edge Case Checklist\n\nEvery function handling external input should have tests for:\n\n| Category | Test Cases |\n|----------|-----------|\n| **Null/Empty** | `nil`, `null`, `undefined`, `\"\"`, `[]`, `{}` |\n| **Boundaries** | min, max, min-1, max+1 |\n| **Type edges** | 0, -1, MAX_INT, MIN_INT, NaN, Infinity |\n| **Strings** | Unicode, emoji, control characters, very long, whitespace-only |\n| **Collections** | Empty, single item, many items, duplicates |\n| **Dates** | Leap years, DST transitions, timezone boundaries |\n| **Concurrency** | Simultaneous calls, race conditions (if applicable) |\n\n### 6.4 Table-Driven Test Template\n\nUse this template to ensure systematic coverage:\n\n```go\nfunc TestFunction(t *testing.T) {\n    tests := []struct {\n        name     string\n        input    InputType\n        expected OutputType\n        wantErr  bool\n        errMsg   string\n        category string  // \"happy_path\", \"boundary\", \"error\", \"edge_case\"\n    }{\n        // Happy path\n        {\"valid_basic\", validInput, expectedOutput, false, \"\", \"happy_path\"},\n\n        // Boundaries\n        {\"at_min_boundary\", minInput, minOutput, false, \"\", \"boundary\"},\n        {\"at_max_boundary\", maxInput, maxOutput, false, \"\", \"boundary\"},\n\n        // Error cases\n        {\"invalid_empty\", emptyInput, zero, true, \"input required\", \"error\"},\n        {\"invalid_over_max\", overMaxInput, zero, true, \"exceeds maximum\", \"error\"},\n\n        // Edge cases\n        {\"unicode_input\", unicodeInput, unicodeOutput, false, \"\", \"edge_case\"},\n    }\n\n    for _, tc := range tests {\n        t.Run(tc.name, func(t *testing.T) {\n            result, err := Function(tc.input)\n\n            if tc.wantErr {\n                require.Error(t, err)\n                assert.Contains(t, err.Error(), tc.errMsg)\n                return\n            }\n\n            require.NoError(t, err)\n            assert.Equal(t, tc.expected, result)\n        })\n    }\n}\n```\n\n---\n\n### 7. Test Helper Organization\n\n### 7.1 Go Test Utilities Package\n\n```\napi/internal/testutil/\n├── helpers.go          # Core utilities\n├── fixtures.go         # Test data factories\n├── assertions.go       # Custom assertions\n└── mocks.go           # Shared mock utilities\n```\n\n```go\n// helpers.go\npackage testutil\n\nimport (\n    \"testing\"\n    \"net/http/httptest\"\n)\n\n// AssertStatus checks HTTP response status\nfunc AssertStatus(t *testing.T, rec *httptest.ResponseRecorder, expected int) {\n    t.Helper()\n    if rec.Code != expected {\n        t.Fatalf(\"expected status %d, got %d: %s\", expected, rec.Code, rec.Body.String())\n    }\n}\n\n// MustDecodeJSON decodes JSON response or fails test\nfunc MustDecodeJSON[T any](t *testing.T, rec *httptest.ResponseRecorder) T {\n    t.Helper()\n    var result T\n    if err := json.NewDecoder(rec.Body).Decode(&result); err != nil {\n        t.Fatalf(\"failed to decode JSON: %v\", err)\n    }\n    return result\n}\n\n// SetupTestEnvironment creates isolated test environment\nfunc SetupTestEnvironment(t *testing.T) *TestEnvironment {\n    t.Helper()\n    tempDir := t.TempDir()\n\n    env := &TestEnvironment{\n        TempDir: tempDir,\n    }\n\n    t.Cleanup(func() {\n        env.Cleanup()\n    })\n\n    return env\n}\n```\n\n### 7.2 TypeScript Test Utilities\n\n```\nui/src/test-utils/\n├── index.ts            # Re-exports\n├── setup.ts            # Test setup (imported by vitest.config.ts)\n├── renderWithProviders.tsx  # Custom render with context providers\n├── factories/\n│   ├── userFactory.ts\n│   └── orderFactory.ts\n└── mocks/\n    ├── handlers.ts     # MSW handlers\n    └── server.ts       # MSW server setup\n```\n\n```typescript\n// test-utils/renderWithProviders.tsx\nimport { render, RenderOptions } from '@testing-library/react';\nimport { QueryClient, QueryClientProvider } from '@tanstack/react-query';\n\ninterface CustomRenderOptions extends RenderOptions {\n    queryClient?: QueryClient;\n}\n\nexport function renderWithProviders(\n    ui: React.ReactElement,\n    options: CustomRenderOptions = {}\n) {\n    const {\n        queryClient = new QueryClient({\n            defaultOptions: {\n                queries: { retry: false },\n            },\n        }),\n        ...renderOptions\n    } = options;\n\n    function Wrapper({ children }: { children: React.ReactNode }) {\n        return (\n            <QueryClientProvider client={queryClient}>\n                {children}\n            </QueryClientProvider>\n        );\n    }\n\n    return render(ui, { wrapper: Wrapper, ...renderOptions });\n}\n```\n\n```typescript\n// test-utils/setup.ts\nimport '@testing-library/jest-dom';\nimport { cleanup } from '@testing-library/react';\nimport { afterEach, vi } from 'vitest';\n\n// Cleanup after each test\nafterEach(() => {\n    cleanup();\n    vi.clearAllMocks();\n});\n\n// Mock ResizeObserver (not available in jsdom)\nglobal.ResizeObserver = vi.fn().mockImplementation(() => ({\n    observe: vi.fn(),\n    unobserve: vi.fn(),\n    disconnect: vi.fn(),\n}));\n```\n\n---\n\n### 8. Unit Testing Architecture Audit\n\nBefore making changes, assess `{{TARGET}}`'s current testing architecture.\n\n### 8.1 Audit Commands\n\n```bash\n# Find test file organization pattern\necho \"=== Test File Locations ===\"\n# Go tests\nfind scenarios/{{TARGET}}/api -name \"*_test.go\" | head -20\n\n# TypeScript tests\nfind scenarios/{{TARGET}}/ui -name \"*.test.ts\" -o -name \"*.test.tsx\" | head -20\n\n# Check for __tests__ directories (inconsistent pattern)\nfind scenarios/{{TARGET}} -type d -name \"__tests__\"\n\n# Find mock organization\necho \"=== Mock Organization ===\"\nfind scenarios/{{TARGET}} -type d -name \"mocks\" -o -name \"__mocks__\"\nfind scenarios/{{TARGET}} -name \"*mock*\" -type f | head -20\n\n# Find test utilities\necho \"=== Test Utilities ===\"\nfind scenarios/{{TARGET}} -type d -name \"testutil\" -o -name \"test-utils\"\nfind scenarios/{{TARGET}} -name \"conftest.py\"\n\n# Check testcontainers usage\necho \"=== Testcontainers ===\"\nrg \"testcontainers\" scenarios/{{TARGET}}/ --type go --type ts -l\n\n# Check for dependency injection patterns\necho \"=== Dependency Injection ===\"\nrg \"interface\\s+\\w+Repository\" scenarios/{{TARGET}}/api --type go\nrg \"interface.*Service\" scenarios/{{TARGET}}/ui --type ts\n\n# Find inline mocks (should be centralized)\necho \"=== Inline Mocks (potential issue) ===\"\nrg \"type mock\\w+ struct\" scenarios/{{TARGET}}/api --type go\nrg \"const mock\\w+ = \" scenarios/{{TARGET}}/ui --type ts\n```\n\n### 8.2 Red Flags Checklist\n\n- [ ] Test files in separate `tests/` directory instead of co-located\n- [ ] Inconsistent naming (`*.test.ts` mixed with `*.spec.ts`)\n- [ ] No dedicated mock package (mocks defined inline in each test file)\n- [ ] No test utilities package (`testutil/` or `test-utils/`)\n- [ ] Hard-coded dependencies in production code (no DI)\n- [ ] Global state used in tests (shared variables between tests)\n- [ ] Database tests that skip when database unavailable (no testcontainers)\n- [ ] Missing `t.Helper()` calls in Go test helpers\n- [ ] Missing `beforeEach`/`afterEach` cleanup in TypeScript tests\n- [ ] No table-driven tests for validation logic\n\n### 8.3 Document Findings\n\nRecord audit results in `scenarios/{{TARGET}}/docs/internal/UNIT_TEST_ARCHITECTURE.md`:\n\n```markdown\n# {{TARGET}} Unit Testing Architecture\n\n## Last Updated\n[Date]\n\n## Test Organization Status\n- [ ] Go tests co-located with source files\n- [ ] TypeScript tests co-located with source files\n- [ ] Consistent naming conventions\n- [ ] Test utilities package exists\n\n## Mock Organization Status\n- [ ] Centralized mock packages\n- [ ] Mock factory/builder patterns\n- [ ] No inline mock definitions in test files\n\n## Testability Status\n- [ ] Dependency injection used throughout\n- [ ] Interfaces defined for external dependencies\n- [ ] Time/environment/filesystem abstracted\n\n## Infrastructure Status\n- [ ] Testcontainers configured for database tests\n- [ ] Test setup files configured\n- [ ] CI runs tests successfully\n\n## Issues Found\n1. [File:line] - Issue description\n2. ...\n\n## Priority Improvements\n1. [Highest impact] - Why\n2. ...\n```\n\n---\n\n### 9. Memory Management with Visited Tracker\n\nUse the `visited-tracker-tools` skill for tracking visited files, with LOCATION set to `scenarios/{{TARGET}}` and TAG set to `unit-test-architecture`.\n\n---\n\n### 10. Output Expectations\n\nYou may update in `scenarios/{{TARGET}}/`:\n- Add mock packages (`api/*/mocks/`, `ui/src/test-utils/mocks/`)\n- Add test utility packages (`api/internal/testutil/`, `ui/src/test-utils/`)\n- Add test configuration files (`vitest.config.ts`, test setup files)\n- Refactor production code for testability (add interfaces, DI patterns)\n- Move test files to proper co-located positions\n- Add testcontainers setup for database-dependent tests\n- Create mock factory/builder patterns\n- Standardize test file naming\n\nYou must:\n- Keep `{{TARGET}}` fully functional and non-regressed\n- Ensure all existing tests still pass\n- Follow language-specific conventions (Go, TypeScript, Python)\n- Create reusable patterns, not one-off solutions\n- Document architecture decisions in `docs/internal/UNIT_TEST_ARCHITECTURE.md`\n\nYou must NOT:\n- Add new tests (focus on infrastructure)\n- Change test assertions or coverage\n- Remove existing tests\n- Add heavyweight DI frameworks (prefer simple constructor injection)\n- Over-abstract (interfaces only where needed for testing)\n\n**Avoid superficial changes that rename files or move code without genuinely improving test architecture.**\n\n]]></skill>\n  <skill id=\"e2e-testing\" name=\"E2E Testing\"><![CDATA[\n## Steer focus: E2E Testing with Browser Automation Studio\n\nPrioritize **end-to-end test coverage** for critical user journeys using BAS workflows.\nDo **not** break functionality or regress existing tests; all changes must maintain or improve completeness.\n\nFocus on validating **requirements and user-visible behavior**, not implementation details.\n\nFor CLI commands and artifact analysis, see the **browser-automation-studio** skill.\n\nRequired reading:\n- `prompt-manager skills read visited-tracker-tools knowledge-observatory-tools`\n\nOptional reading:\n- `prompt-manager skills read browser-automation-studio`\n\n---\n\n### **1. When to Use E2E Testing**\n\n#### Decision Table\n\n| Question | If YES | If NO |\n|----------|--------|-------|\n| Does it involve user-visible UI interaction? | E2E candidate | Unit/integration test |\n| Does it span multiple components/services? | E2E candidate | Unit test |\n| Is it a critical user journey (login, checkout, onboarding)? | E2E required | Consider cost/benefit |\n| Can it be fully validated without a browser? | Unit/integration test | E2E candidate |\n| Is it testing API contracts only? | Integration test | Continue evaluation |\n\n#### Testing Pyramid Position\n\n```\n          ╱╲\n         ╱E2E╲           ← BAS workflows (few, critical paths)\n        ╱──────╲\n       ╱Integration╲      ← API tests, component integration\n      ╱──────────────╲\n     ╱   Unit Tests    ╲   ← Most tests live here (fast, isolated)\n    ╱────────────────────╲\n```\n\n**Principle:** E2E tests validate that the system works **for users**. They should be:\n- **Few** - Only critical paths\n- **Focused** - One journey per test case\n- **Supplemental** - Not replacing faster unit/integration tests\n\n---\n\n### **2. Workflow Hierarchy & Organization**\n\n```\nscenarios/{{TARGET}}/bas/\n├── registry.json          # Auto-generated manifest (DO NOT edit)\n├── cases/                 # Test cases WITH assertions\n│   ├── 01-foundation/     # Core functionality\n│   │   ├── 01-auth/       # Authentication flows\n│   │   │   ├── login-success.json\n│   │   │   └── login-failure.json\n│   │   └── 02-navigation/ # Basic navigation\n│   └── 02-features/       # Feature-specific tests\n│       └── 01-dashboard/\n├── flows/                 # Reusable user journeys (NO assertions)\n│   └── complete-checkout.json\n└── actions/               # Atomic operations (NO assertions)\n    ├── login.json\n    └── open-project.json\n```\n\n#### Hierarchy Rules\n\n| Level | Contains Assertions | Reusable | Purpose |\n|-------|---------------------|----------|---------|\n| `actions/` | NO | YES | Atomic steps (login, navigate, fill form) |\n| `flows/` | NO | YES | Multi-step journeys (checkout process) |\n| `cases/` | YES | NO | Requirement validation with assertions |\n\n#### Ordering Convention\n\n- Use **two-digit prefixes** for folders: `01-foundation/`, `02-features/`\n- This controls execution order during test runs\n- Foundation tests run first to catch basic failures early\n\n#### Debug Order (Critical)\n\nWhen test suites fail, debug **bottom-up**:\n\n1. **Actions first** - Are atomic operations working?\n2. **Flows second** - Do composed journeys complete?\n3. **Cases last** - Are assertions correct for the current behavior?\n\n---\n\n### **3. Selector Registry Integration**\n\nAll UI selectors **must** be defined in a central registry to ensure maintainability.\n\n#### Single Source of Truth\n\n```typescript\n// ui/src/constants/selectors.ts\nconst literalSelectors = {\n  dashboard: {\n    container: \"dashboard-container\",\n    newProjectButton: \"dashboard-new-project-button\",\n    projectList: \"dashboard-project-list\",\n  },\n  auth: {\n    loginForm: \"auth-login-form\",\n    emailInput: \"auth-email-input\",\n    passwordInput: \"auth-password-input\",\n    submitButton: \"auth-submit-button\",\n    errorMessage: \"auth-error-message\",\n  },\n} as const;\n```\n\n#### Component Usage\n\n```tsx\nimport { selectors } from '@/constants/selectors';\n\n<button data-testid={selectors.dashboard.newProjectButton}>\n  New Project\n</button>\n```\n\n#### Workflow Reference\n\nIn BAS workflows, reference selectors with `@selector/` prefix:\n\n```json\n{\n  \"type\": \"click\",\n  \"data\": {\n    \"selector\": \"@selector/dashboard.newProjectButton\"\n  }\n}\n```\n\n#### Dynamic Selectors\n\nFor elements that need parameters:\n\n```typescript\n// In selectors.ts\nconst dynamicSelectorDefinitions = {\n  projects: {\n    cardByName: defineDynamicSelector({\n      description: \"Project card by name\",\n      selectorPattern: '[data-testid=\"project-card\"][data-project-name=\"${name}\"]',\n      params: { name: { type: \"string\" } },\n    }),\n  },\n} as const;\n```\n\nIn workflows:\n\n```json\n{\n  \"type\": \"click\",\n  \"data\": {\n    \"selector\": \"@selector/projects.cardByName(name=My Project)\"\n  }\n}\n```\n\n**Benefits:**\n- Workflows survive UI refactors\n- Single place to update when selectors change\n- Type-safe references catch typos early\n\n---\n\n### **4. Requirements Integration**\n\nLink E2E tests to requirements using the `automation` validation type.\n\n#### In Requirements JSON\n\n```json\n{\n  \"id\": \"REQ-AUTH-001\",\n  \"description\": \"User can log in with valid credentials\",\n  \"validation\": [\n    {\n      \"type\": \"automation\",\n      \"ref\": \"bas/cases/01-foundation/01-auth/login-success.json\",\n      \"scenario\": \"{{TARGET}}\",\n      \"phase\": \"integration\",\n      \"status\": \"implemented\"\n    }\n  ]\n}\n```\n\n#### In Workflow Metadata\n\n```json\n{\n  \"metadata\": {\n    \"description\": \"Verify successful login flow\",\n    \"labels\": {\n      \"requirements_json\": \"[\\\"REQ-AUTH-001\\\"]\"\n    }\n  }\n}\n```\n\n#### Validation Types\n\n| Type | Tool | When to Use |\n|------|------|-------------|\n| `automation` | BAS workflow | UI interactions, visual validation |\n| `test` | Unit/integration test | Code-level behavior |\n| `manual` | Human verification | Last resort only |\n\n**If using manual validation**, log it with:\n```bash\nvrooli scenario requirements manual-log {{TARGET}} REQ-XXX \"Reason for manual check\"\n```\nThen build a BAS workflow as soon as possible.\n\n---\n\n### **5. Workflow Authoring Patterns**\n\n#### Minimal Workflow Structure\n\n```json\n{\n  \"metadata\": {\n    \"description\": \"Verify login success redirects to dashboard\",\n    \"version\": 1,\n    \"reset\": \"none\"\n  },\n  \"settings\": {\n    \"executionViewport\": {\n      \"width\": 1440,\n      \"height\": 900,\n      \"preset\": \"desktop\"\n    }\n  },\n  \"nodes\": [\n    {\n      \"id\": \"navigate-login\",\n      \"type\": \"navigate\",\n      \"position\": { \"x\": 0, \"y\": 0 },\n      \"data\": {\n        \"label\": \"Go to login page\",\n        \"destinationType\": \"scenario\",\n        \"scenario\": \"{{TARGET}}\",\n        \"scenarioPath\": \"/login\",\n        \"waitUntil\": \"networkidle0\"\n      }\n    },\n    {\n      \"id\": \"type-email\",\n      \"type\": \"type\",\n      \"position\": { \"x\": 220, \"y\": 0 },\n      \"data\": {\n        \"label\": \"Enter email\",\n        \"selector\": \"@selector/auth.emailInput\",\n        \"text\": \"test@example.com\",\n        \"clearExisting\": true\n      }\n    },\n    {\n      \"id\": \"type-password\",\n      \"type\": \"type\",\n      \"position\": { \"x\": 440, \"y\": 0 },\n      \"data\": {\n        \"label\": \"Enter password\",\n        \"selector\": \"@selector/auth.passwordInput\",\n        \"text\": \"password123\",\n        \"clearExisting\": true\n      }\n    },\n    {\n      \"id\": \"click-submit\",\n      \"type\": \"click\",\n      \"position\": { \"x\": 660, \"y\": 0 },\n      \"data\": {\n        \"label\": \"Click submit\",\n        \"selector\": \"@selector/auth.submitButton\"\n      }\n    },\n    {\n      \"id\": \"assert-dashboard\",\n      \"type\": \"assert\",\n      \"position\": { \"x\": 880, \"y\": 0 },\n      \"data\": {\n        \"label\": \"Verify dashboard visible\",\n        \"selector\": \"@selector/dashboard.container\",\n        \"assertMode\": \"exists\",\n        \"timeoutMs\": 10000,\n        \"failureMessage\": \"Dashboard should be visible after login\"\n      }\n    }\n  ],\n  \"edges\": [\n    { \"id\": \"e1\", \"source\": \"navigate-login\", \"target\": \"type-email\", \"type\": \"smoothstep\" },\n    { \"id\": \"e2\", \"source\": \"type-email\", \"target\": \"type-password\", \"type\": \"smoothstep\" },\n    { \"id\": \"e3\", \"source\": \"type-password\", \"target\": \"click-submit\", \"type\": \"smoothstep\" },\n    { \"id\": \"e4\", \"source\": \"click-submit\", \"target\": \"assert-dashboard\", \"type\": \"smoothstep\" }\n  ]\n}\n```\n\n#### Node Types Quick Reference\n\n| Type | Purpose | Key Data Fields |\n|------|---------|-----------------|\n| `navigate` | Go to URL/scenario | `scenario`, `scenarioPath`, `waitUntil` |\n| `click` | Click element | `selector`, `clickCount` |\n| `type` | Enter text | `selector`, `text`, `clearExisting` |\n| `assert` | Verify condition | `selector`, `assertMode`, `expectedText` |\n| `wait` | Pause execution | `durationMs` or `selector` + `state` |\n| `screenshot` | Capture state | `fullPage`, `captureDomSnapshot` |\n| `evaluate` | Run JavaScript | `expression`, `store_result` |\n\n#### Assert Modes\n\n| Mode | Validates |\n|------|-----------|\n| `exists` | Element is present in DOM |\n| `not_exists` | Element is NOT in DOM |\n| `visible` | Element is visible (not hidden) |\n| `contains_text` | Element contains expected text |\n| `exact_text` | Element text matches exactly |\n\n#### Resilience Settings\n\nFor flaky elements or slow pages:\n\n```json\n{\n  \"type\": \"click\",\n  \"data\": {\n    \"selector\": \"@selector/cta.primary\",\n    \"resilience\": {\n      \"maxAttempts\": 3,\n      \"delayMs\": 1500,\n      \"backoffFactor\": 1.5,\n      \"preconditionSelector\": \"@selector/app.ready\",\n      \"preconditionTimeoutMs\": 10000,\n      \"successSelector\": \"@selector/nextStep.visible\",\n      \"successTimeoutMs\": 15000\n    }\n  }\n}\n```\n\n---\n\n### **6. Authenticated Testing Patterns**\n\nFor tests requiring authentication, use **shared sign-in actions** rather than persisted session profiles. This ensures test isolation and reproducibility.\n\n#### Shared Sign-In Action Pattern\n\nSign-in is an **atomic operation** that lives in `actions/login.json`:\n\n```json\n{\n  \"metadata\": {\n    \"description\": \"Sign in with provided credentials\",\n    \"version\": 1\n  },\n  \"nodes\": [\n    {\n      \"id\": \"navigate-login\",\n      \"type\": \"navigate\",\n      \"data\": { \"destinationType\": \"scenario\", \"scenarioPath\": \"/login\" }\n    },\n    {\n      \"id\": \"type-email\",\n      \"type\": \"type\",\n      \"data\": { \"selector\": \"@selector/auth.emailInput\", \"text\": \"${@params/username}\", \"clearExisting\": true }\n    },\n    {\n      \"id\": \"type-password\",\n      \"type\": \"type\",\n      \"data\": { \"selector\": \"@selector/auth.passwordInput\", \"text\": \"${@params/password}\", \"clearExisting\": true }\n    },\n    {\n      \"id\": \"click-submit\",\n      \"type\": \"click\",\n      \"data\": { \"selector\": \"@selector/auth.submitButton\" }\n    },\n    {\n      \"id\": \"wait-redirect\",\n      \"type\": \"wait\",\n      \"data\": { \"selector\": \"@selector/dashboard.container\", \"state\": \"visible\", \"timeoutMs\": 10000 }\n    }\n  ],\n  \"edges\": [\n    { \"id\": \"e1\", \"source\": \"navigate-login\", \"target\": \"type-email\" },\n    { \"id\": \"e2\", \"source\": \"type-email\", \"target\": \"type-password\" },\n    { \"id\": \"e3\", \"source\": \"type-password\", \"target\": \"click-submit\" },\n    { \"id\": \"e4\", \"source\": \"click-submit\", \"target\": \"wait-redirect\" }\n  ]\n}\n```\n\n#### Test Cases Call Sign-In as Subflow\n\nCases that need authentication call the shared action:\n\n```json\n{\n  \"nodes\": [\n    {\n      \"id\": \"sign-in\",\n      \"type\": \"subflow\",\n      \"data\": {\n        \"workflowPath\": \"actions/login.json\",\n        \"params\": {\n          \"username\": \"${@params/username}\",\n          \"password\": \"${@params/password}\"\n        }\n      }\n    },\n    {\n      \"id\": \"assert-dashboard\",\n      \"type\": \"assert\",\n      \"data\": { \"selector\": \"@selector/dashboard.container\", \"assertMode\": \"exists\" }\n    }\n  ],\n  \"edges\": [\n    { \"id\": \"e1\", \"source\": \"sign-in\", \"target\": \"assert-dashboard\" }\n  ]\n}\n```\n\n#### Test Isolation\n\n- Each test run gets a **fresh browser context** (no session profiles)\n- Credentials passed via `--initial-params`\n- Session state is **not persisted** between test runs\n\n#### CLI Usage\n\n```bash\nbrowser-automation-studio workflow execute \\\n  --from-file bas/cases/01-foundation/01-auth/login-success.json \\\n  --initial-params '{\"username\":\"test@example.com\",\"password\":\"secret\"}' \\\n  --wait\n```\n\n#### Example Directory Structure\n\n```\nbas/\n  actions/\n    login.json                    # Atomic sign-in action (params: username, password)\n    logout.json\n    open-project.json\n  flows/\n    complete-checkout.json        # Multi-step journey using actions\n  cases/\n    01-foundation/01-auth/\n      login-success.json          # Calls actions/login.json, then asserts dashboard\n      login-failure.json          # Tests invalid credentials\n    02-features/\n      admin-dashboard.json        # Calls login with admin creds, tests admin features\n```\n\n#### Why Not Session Profiles for Tests?\n\n| Session Profiles | Subflow-Based Auth |\n|------------------|-------------------|\n| State may be stale (expired cookies) | Always fresh login |\n| Test depends on profile existence | Test is self-contained |\n| Harder to debug failures | Full login flow in trace |\n| Not CI-friendly | Works anywhere |\n\n**Rule:** Session profiles are for **manual testing and debugging**, not automated test suites.\n\n---\n\n### **7. Memory Management with Visited Tracker**\n\nUse the `visited-tracker-tools` skill for tracking visited files, with LOCATION set to `scenarios/{{TARGET}}/bas` and TAG set to `e2e`.\n\n---\n\n### **8. Documentation**\n\nUse `knowledge-observatory-tools` to read the current `problems` doc for `{{TARGET}}`, then update the **E2E Issues** section with your findings (critical user journeys lacking coverage, flaky tests and root causes, selector registry gaps, requirement validation status).\n\n---\n\n### **10. Output Expectations**\n\nYou may update:\n* Workflow JSON files in `bas/cases/`, `bas/flows/`, `bas/actions/`\n* Selector registry in `ui/src/constants/selectors.ts`\n* Component `data-testid` attributes\n* Requirements validation references\n* Test documentation via `knowledge-observatory-tools`\n\nYou **must**:\n* Keep workflows focused on user-visible behavior\n* Link workflows to requirements where applicable\n* Use selector registry (never hardcode selectors in workflows)\n* Document coverage gaps\n* Avoid testing implementation details\n* Maintain debug order: actions → flows → cases\n\nFocus this loop on delivering **practical, high-impact e2e coverage** that validates critical user journeys and catches regressions before they reach users.\n\n**Avoid superficial workflows that increase coverage numbers without validating real user behavior. Only add tests that would catch meaningful regressions.**\n\n]]></skill>\n  <skill id=\"seam-discovery-and-enforcement\" name=\"Testing Seam Discovery &amp; Enforcement\"><![CDATA[\n## Steer focus: Seam Discovery & Enforcement\n\nPrioritize **discovering, strengthening, and enforcing “seams”** in this scenario.\n\nA **seam** is a deliberate boundary where behavior can vary or be substituted without invasive changes (e.g. for testing, swapping implementations, isolating integrations, or controlling side effects).\n\nYour goal is to make the scenario **easier to test, safer to change, and more modular** by improving where and how seams exist.\n\nDo **not** break functionality, regress tests, or introduce new features. All changes must maintain or improve completeness and reliability.\n\nRequired reading:\n- `prompt-manager skills read knowledge-observatory-tools`\n\n---\n\n### **1. Understand Core Flows & Variation Points**\n\n* Review the scenario’s **main workflows and responsibilities** (from PRD, operational targets, requirements, and tests).\n* Identify where behavior naturally **varies or could need to vary**:\n  * external services or resources\n  * I/O operations (network, storage, filesystem, browser automation, etc.)\n  * environment-specific behavior\n  * feature flags or conditional branches\n  * expensive operations or long-running tasks\n* Note where these concerns are currently **entangled with core logic** instead of being isolated behind clear boundaries.\n\nKeep these natural variation points in mind as prime candidates for stronger seams.\n\n---\n\n### **2. Discover Existing Seams**\n\n* Scan the code for **existing boundaries** where behavior is already somewhat isolated, such as:\n  * wrapper functions or adapters around integrations\n  * helper utilities that encapsulate side effects\n  * modules that centralize certain decisions or operations\n* Evaluate whether these seams are:\n  * well-named and clearly documented, or confusing\n  * actually respected throughout the codebase, or bypassed\n  * easy to use in tests, or awkward and brittle\n\nWhere seams exist but are weak or frequently violated, plan to **clarify and reinforce** them.\n\n---\n\n### **3. Identify Missing or Eroded Seams**\n\nLook for areas where code is hard to test or change because seams are missing or have eroded:\n\n* core logic directly performing side effects\n* repeated low-level calls scattered across many places\n* components or handlers reaching deeply into multiple layers\n* duplicated integration code instead of going through a single boundary\n* tests that require excessive setup because there is no clean place to substitute behavior\n\nThese are good candidates for **introducing or restoring seams** in a focused, incremental way.\n\n---\n\n### **4. Strengthen & Enforce Seams**\n\nWhere appropriate, improve seams so they are **clear, robust, and easy to use**:\n\n* Group related side effects or integration calls behind **well-named, focused modules or functions**.\n* Ensure callers depend on **stable, intention-revealing boundaries**, not low-level details.\n* Avoid leaking external or infrastructure-specific details into core logic and UI layers.\n* Make seams practical for testing:\n  * callers should have a straightforward way to control or substitute behavior in tests\n  * tests should be able to exercise core logic without triggering unnecessary external work\n\nFavor **small, incremental improvements** over sweeping refactors. Improve the most impactful seams first.\n\n---\n\n### **5. Improve Testability & Variation at Seams**\n\n* When you strengthen or create a seam, ensure tests take advantage of it:\n  * add or refine tests that exercise core logic through the seam\n  * adjust existing tests to rely on the clearer boundary instead of fragile setups\n* Keep tests **expressive and intent-focused**:\n  * avoid over-mocking internal details\n  * prefer tests that emphasize behavior at the seam (inputs/outputs) rather than internal wiring\n\nThe goal is to make it **easy for future loops** to test new behavior by using the seams you’ve clarified.\n\n---\n\n### **6. Safe Refactoring Guidelines**\n\nYou may:\n\n* rename or relocate modules to better reflect their boundary role\n* extract integration or side-effectful code into more focused units\n* consolidate duplicated integration logic behind a seam\n* adjust call sites to use existing or newly improved seams\n* update tests to reflect the new, clearer boundaries\n\nYou must:\n\n* preserve observable behavior and user-facing workflows\n* avoid changes that require broad configuration or deployment shifts in this loop\n* not weaken test coverage or delete meaningful tests to “force” refactors through\n* introduce seams incrementally, avoiding large, risky rewrites\n\nIf you detect a seam that **should** exist but requires a major redesign, document it clearly (in comments or notes) rather than applying a risky partial change.\n\n---\n\n### **7. Documentation**\n\nUse `knowledge-observatory-tools` to read the current `seams` doc for `{{TARGET}}`, then update it with your findings (discovered seams, strengthened boundaries, remaining weak points).\n\n---\n\n### **9. Output Expectations**\n\nBy the end of this loop, the scenario should:\n\n* have **clearer, more intentional seams** at key variation points\n* be easier to test without heavy, brittle setup\n* isolate integrations and side effects behind obvious boundaries\n* reduce the risk that future changes accidentally bypass or break important boundaries\n\nAvoid superficial changes (e.g. renaming things without clarifying boundaries, or shuffling code without improving testability).\n\nFocus this loop on **practical, targeted seam improvements** that make the scenario easier to evolve safely, especially around external dependencies, side effects, and behavior that may need to vary over time.\n\n]]></skill>\n</skills>\n\n### Phase Progress\n\nPhase 20 of 20\nIteration: 3 of 3 (max)\n\n### Completed Phases\n\nThe following phases have been completed:\n\n**Phase 1: Screaming Architecture +2 more** (1 iterations)\n- Completed: max_iterations\n\n**Phase 2: Documentation Health** (1 iterations)\n- Completed: max_iterations\n\n**Phase 3: Testing Seam Discovery & Enforcement +1 more** (1 iterations)\n- Completed: max_iterations\n\n**Phase 4: Progress** (1 iterations)\n- Completed: max_iterations\n\n**Phase 5: Control Surface & Tunable Levers +1 more** (1 iterations)\n- Completed: max_iterations\n\n**Phase 6: Failure Topography & Graceful Degradation +2 more** (1 iterations)\n- Completed: max_iterations\n\n**Phase 7: Intent Clarification +2 more** (1 iterations)\n- Complet