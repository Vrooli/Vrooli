        ### **5. Workflow Authoring Patterns**

        #### Minimal Workflow Structure

        ```json
        {
          "metadata": {
            "description": "Verify login success redirects to dashboard",
            "version": 1,
            "reset": "none"
          },
          "settings": {
            "executionViewport": {
