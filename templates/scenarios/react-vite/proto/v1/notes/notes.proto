syntax = "proto3";

package vrooli.{{SCENARIO_ID_SNAKE}}.v1.notes;

option go_package = "github.com/vrooli/vrooli/packages/proto/gen/go/{{SCENARIO_ID}}/v1/notes;notes_v1";

// =============================================================================
// NOTES DOMAIN — CRUD reference
// =============================================================================
//
// @layer 5  (api surface)
// @domain notes
// @stability stable
//
// Wire contract for /api/v1/notes (list, create, get-by-id). Ships as the
// canonical CRUD reference: every layer downstream of this proto (handler,
// store, UI client, CLI domain) is the pattern new scenarios copy when
// they add their first non-trivial mutation. Keep that role in mind when
// extending — additions land here, then ripple to the layers in turn.
//
// Consumed by:
//   - API: handlers/notes/handler_test.go decodes responses via
//          assertx.MustUnmarshalProto into the messages below and asserts
//          on typed fields.
//   - UI:  ui/src/api/notes.ts wraps `fetch` with `fromJson(NoteSchema, ...)`
//          through the shared proto JSON client so the wire shape and runtime
//          type agree.
//   - CLI: cli/domains/notes/handlers.go decodes the same JSON via
//          protojson.Unmarshal into the generated proto types and renders
//          via cliapp.ListReport / MutationReport.
// =============================================================================

// Note is the canonical wire shape for a single note resource.
message Note {
  // UUID assigned by the API on create.
  string id = 1;

  // Human-supplied title. Required on create; non-empty enforced server-side.
  string title = 2;

  // Optional body. Empty string is the default.
  string body = 3;

  // RFC3339 server time at the moment the note was first persisted.
  string created_at = 4;

  // RFC3339 server time at the moment the note was last persisted.
  // Equals created_at on first insert.
  string updated_at = 5;
}

// ListNotesResponse is the body returned by GET /api/v1/notes.
message ListNotesResponse {
  // Notes ordered newest-first by created_at.
  repeated Note notes = 1;
}

// CreateNoteRequest is the body accepted by POST /api/v1/notes.
message CreateNoteRequest {
  string title = 1;
  string body = 2;
}

// CreateNoteResponse is the body returned by a successful create.
message CreateNoteResponse {
  Note note = 1;
}

// GetNoteResponse is the body returned by GET /api/v1/notes/{id}.
message GetNoteResponse {
  Note note = 1;
}
