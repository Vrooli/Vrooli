version: '3.8'

services:
  kokoro:
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:latest}
    container_name: ${KOKORO_CONTAINER_NAME:-kokoro}
    hostname: kokoro
    restart: unless-stopped
    ports:
      - "${KOKORO_BIND_ADDRESS:-127.0.0.1}:${KOKORO_PORT:-8880}:8880"
    volumes:
      - kokoro_models:/app/api/src/voices:rw
    networks:
      - kokoro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/v1/audio/voices"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # GPU support
    deploy:
      resources:
        limits:
          memory: ${KOKORO_MEMORY_LIMIT:-16G}
        reservations:
          memory: ${KOKORO_MEMORY_RESERVATION:-8G}
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Required for GPU support
    runtime: nvidia

volumes:
  kokoro_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: "${KOKORO_VOICES_DIR:-$HOME/.kokoro/voices}"

networks:
  kokoro-network:
    name: ${KOKORO_NETWORK_NAME:-kokoro-network}
    driver: bridge
