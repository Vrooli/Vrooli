services:
  kokoro:
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu@sha256:79d81c41d8883611291c5785e47db2ba00765e9b89dd59de05d9f28e1945f905}
    container_name: ${KOKORO_CONTAINER_NAME:-kokoro}
    hostname: kokoro
    restart: unless-stopped
    ports:
      - "${KOKORO_BIND_ADDRESS:-127.0.0.1}:${KOKORO_PORT:-8880}:8880"
    networks:
      - kokoro-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/v1/audio/voices"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # GPU support
    deploy:
      resources:
        limits:
          memory: ${KOKORO_MEMORY_LIMIT:-16G}
        reservations:
          memory: ${KOKORO_MEMORY_RESERVATION:-8G}
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Required for GPU support
    runtime: nvidia

networks:
  kokoro-network:
    name: ${KOKORO_NETWORK_NAME:-kokoro-network}
    driver: bridge
