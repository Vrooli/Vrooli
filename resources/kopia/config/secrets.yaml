# Kopia Resource Secrets Declaration
version: "1.0"
resource: "kopia"
description: "Per-repository encryption passphrases and optional S3/MinIO credentials for the kopia backup engine. Encryption is non-negotiable: every repository the resource creates is encrypted, and the passphrase is the secret that unlocks it. Secrets are sourced exclusively through the vault resource (resource-vault) — never from config files or committed env."

secrets:
  # Per-repository encryption passphrases. The resource generates a 32+ char
  # random passphrase on `repo create` and stores it here; it is never typed by
  # a user and never written to a config file. Path is templated per repo name.
  passphrases:
    - name: "repo_passphrase"
      path: "secret/resources/kopia/repo/{repo-name}/passphrase"
      key: "passphrase"
      description: "Client-side encryption passphrase for a kopia repository (one per Vrooli destination)"
      required: true
      format: "string"
      default_env: "KOPIA_PASSWORD"
      auto_generate: true
      notes: "Generated by `resource-kopia repo create`. Never falls back to a default/empty value. Required for any operation against the repo (snapshot, restore, status, maintenance)."

  # Optional S3/MinIO credentials, only for repositories created with
  # --backend s3. Gate S3 repos only — filesystem repos need no S3 creds.
  s3_credentials:
    - name: "s3_access_key"
      path: "secret/resources/kopia/s3/{repo-name}"
      key: "access_key"
      description: "S3/MinIO access key id for an S3-backed repository"
      required: false
      format: "string"
      default_env: "AWS_ACCESS_KEY_ID"
    - name: "s3_secret_key"
      path: "secret/resources/kopia/s3/{repo-name}"
      key: "secret_key"
      description: "S3/MinIO secret access key for an S3-backed repository"
      required: false
      format: "string"
      default_env: "AWS_SECRET_ACCESS_KEY"

# Secret dependencies on other resources
dependencies:
  - resource: "vault"
    secrets: ["repo_passphrase"]
    purpose: "Vault is the sole source of repository passphrases and S3 credentials. The resource fails closed if vault is unavailable — it never proceeds with a default or empty passphrase."

# Initialization hints
initialization:
  auto_generate:
    - name: "repo_passphrase"
      type: "random-32"
      path: "secret/resources/kopia/repo/{repo-name}/passphrase"

# Rotation policy
rotation:
  passphrases:
    recommended_frequency: "never-without-migration"
    method: "manual"
    notes: "Rotating a repository passphrase requires re-keying the repository with `kopia repository change-password`; do not rotate the vault value alone or the repo becomes unopenable. Out of scope for this resource version."
