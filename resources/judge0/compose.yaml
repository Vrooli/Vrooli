services:
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: vrooli-judge0-server
    restart: unless-stopped
    ports:
      - "2358:2358"
    environment:
      JUDGE0_AUTHENTICATION_TOKEN: "${JUDGE0_API_KEY:-vrooli-judge0-dev-token}"
      ENABLE_SUBMISSION_DELETE: "true"
      ENABLE_BATCHED_SUBMISSIONS: "true"
      ENABLE_WAIT_RESULT: "true"
      ENABLE_CALLBACKS: "false"
      CPU_TIME_LIMIT: "10"
      WALL_TIME_LIMIT: "20"
      MEMORY_LIMIT: "262144"
      MAX_PROCESSES_AND_OR_THREADS: "30"
      MAX_FILE_SIZE: "4096"
      STACK_LIMIT: "128000"
      NUMBER_OF_WORKERS: "2"
      REDIS_HOST: judge0-redis
      REDIS_PORT: "6379"
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0-data:/var/judge0
      - ${HOME}/.vrooli/resources/judge0/submissions:/judge0/submissions
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: vrooli-judge0-workers
    command:
      - bash
      - -lc
      - |
        isolate --cleanup >/dev/null 2>&1 || true
        isolate --init >/dev/null 2>&1 || true
        exec ./scripts/workers
    restart: unless-stopped
    privileged: true
    environment:
      JUDGE0_AUTHENTICATION_TOKEN: "${JUDGE0_API_KEY:-vrooli-judge0-dev-token}"
      ENABLE_NETWORK: "false"
      CPU_TIME_LIMIT: "10"
      WALL_TIME_LIMIT: "20"
      MEMORY_LIMIT: "262144"
      MAX_PROCESSES_AND_OR_THREADS: "30"
      MAX_FILE_SIZE: "4096"
      STACK_LIMIT: "128000"
      REDIS_HOST: judge0-redis
      REDIS_PORT: "6379"
      POSTGRES_HOST: judge0-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      ISOLATE_INIT_OPTIONS: "--cg --cg-mem --cg-timing"
      RUN_COMMAND_PREFIX: ""
      DISABLE_ISOLATE: "false"
      QUEUE: "*"
      COUNT: "5"
    volumes:
      - judge0-data:/var/judge0
      - ${HOME}/.vrooli/resources/judge0/submissions:/judge0/submissions
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /tmp:/tmp:rw
    tmpfs:
      - /box:exec,mode=1777
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:15-alpine
    container_name: vrooli-judge0-server-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    container_name: vrooli-judge0-server-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - judge0-redis-data:/data

volumes:
  judge0-data:
  judge0-postgres-data:
  judge0-redis-data:
