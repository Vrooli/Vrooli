services:
  reranker:
    # Prebuilt HuggingFace Text-Embeddings-Inference image — we write NO inference
    # code. TEI auto-detects bge-reranker-v2-m3 as a cross-encoder and exposes
    # POST /rerank. This base compose runs the CPU image; the GPU overlay
    # (docker-compose.gpu.yml) swaps to the CUDA tag + adds the device request.
    image: ${RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.7}
    container_name: ${RERANKER_CONTAINER_NAME:-reranker}
    hostname: reranker
    restart: unless-stopped
    ports:
      - "${RERANKER_BIND_ADDRESS:-127.0.0.1}:${RERANKER_PORT:-11453}:80"
    volumes:
      # TEI caches downloaded models under /data (HUGGINGFACE_HUB_CACHE).
      # Keep the cache in the resource storage contract so storage-manager can
      # measure and operators can relocate it safely.
      - ${RESOURCE_DATA_DIR}/model-cache:/data:rw
    environment:
      # TEI reads each router arg from an env var; MODEL_ID is auto-pulled from
      # the HF Hub on first start. No HF token needed (public model).
      - MODEL_ID=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - PORT=80
      - HOSTNAME=0.0.0.0
    networks:
      - reranker-network
    # No container-level healthcheck: the TEI image does not bundle curl/wget,
    # so readiness is gated by the Vrooli host-level http health_check in
    # resource.json (GET /health), not an in-container probe.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${RERANKER_MEMORY_LIMIT:-6G}
        reservations:
          memory: ${RERANKER_MEMORY_RESERVATION:-3G}

networks:
  reranker-network:
    name: ${RERANKER_NETWORK_NAME:-reranker-network}
    driver: bridge
