apiVersion: vrooli.com/v1
kind: ResourceCapability
metadata:
  name: minio
  category: storage
  description: "Checksum-verified MinIO object storage supervised as a native managed service."
  maturity: M4
spec:
  commands:
    - name: info
      implementation: cli-core-standard-lifecycle
      test: cli/main_test.go
    - name: status
      implementation: cli-core-standard-lifecycle
      test: cli/main_test.go
    - name: install
      implementation: internal/resources/drivers_managed_service.go
      test: cli/main_test.go
    - name: start
      implementation: internal/resources/drivers_managed_service.go
      test: cli/main_test.go
    - name: stop
      implementation: internal/resources/drivers_managed_service.go
      test: cli/main_test.go
    - name: restart
      implementation: cli-core-standard-lifecycle
      test: cli/main_test.go
    - name: logs
      implementation: internal/resources/drivers_managed_service.go
      test: cli/main_test.go
    - name: uninstall
      implementation: internal/resources/drivers_managed_service.go
      test: cli/main_test.go
  interfaces:
    - name: s3-api
      endpoint: /
      test: resource.json health_checks[0]
    - name: readiness
      endpoint: /minio/health/ready
      test: resource.json health_checks[0]
  testing:
    unit_test: cli/main_test.go
    contract_test: internal/resources/fleet_contract_test.go
