# Claude Code Resource Secrets Declaration
version: "1.0"
resource: "claude-code"
description: "Optional API credentials for Claude Code model providers"

secrets:
  providers:
    - name: "openrouter_api_key"
      path: "secret/resources/claude-code/providers/openrouter"
      key: "api_key"
      description: "OpenRouter API key for accessing multiple AI models"
      required: false
      format: "string"
      default_env: "OPENROUTER_API_KEY"
      fallback: "env:OPENROUTER_API_KEY"

    - name: "anthropic_api_key"
      path: "secret/resources/claude-code/providers/anthropic"
      key: "api_key"
      description: "Anthropic API key for Claude models"
      required: false
      format: "string"
      default_env: "ANTHROPIC_API_KEY"
      fallback: "env:ANTHROPIC_API_KEY"

    - name: "openai_api_key"
      path: "secret/resources/claude-code/providers/openai"
      key: "api_key"
      description: "OpenAI API key for GPT models"
      required: false
      format: "string"
      default_env: "OPENAI_API_KEY"
      fallback: "env:OPENAI_API_KEY"

    - name: "google_api_key"
      path: "secret/resources/claude-code/providers/google"
      key: "api_key"
      description: "Google API key for Gemini models"
      required: false
      format: "string"
      default_env: "GEMINI_API_KEY"
      fallback: "env:GEMINI_API_KEY"

quotas:
  daily_token_limit: 1000000
  monthly_cost_limit: 100.00

security:
  rotate_keys_days: 90
  require_encryption: true
