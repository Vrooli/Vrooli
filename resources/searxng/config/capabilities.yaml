apiVersion: vrooli.com/v1
kind: ResourceCapability
metadata:
  name: searxng
  category: search
  subcategory: metasearch
  description: Privacy-respecting local metasearch over the SearXNG HTTP API.
  maturity: stable
  complexity: simple
spec:
  capabilities:
    primary:
      - metasearch-aggregation
      - privacy-preserving-search
      - json-api-output
    secondary:
      - html-search-ui
      - engine-health-diagnostics
      - typed-configuration-migration
  interfaces:
    - name: search-api
      endpoint: /search
      method: [GET]
      inputTypes: []
      outputTypes: [application/json, text/html]
      description: JSON and HTML search; consumers use format=json for structured results.
    - name: runtime-health
      endpoint: /stats
      method: [GET]
      inputTypes: []
      outputTypes: [application/json]
      description: Container health endpoint; engine-health supplements it with a canary query.
  dependencies:
    required: [docker, internet-connection]
    optional: []
    incompatible: []
  scenarios:
    primary: [web-search]
    secondary: []
  technical:
    ports: [8280]
    protocols: [http]
    data_formats: [json, html]
    resource_requirements:
      database:
        required: false
        recommended: false
        supported: []
  testing:
    test_file: resources/searxng/cli
    test_coverage: [configuration-migration, json-api-contract, engine-health]
    integration_tests: [manifest-docker-contract, web-search-consumer]
  documentation:
    readme: resources/searxng/README.md
    api_reference: resources/searxng/docs/API.md
    configuration: resources/searxng/docs/CONFIGURATION.md
    operations: resources/searxng/docs/OPERATIONS.md
labels:
  resource.vrooli.com/category: search
  resource.vrooli.com/type: metasearch
  resource.vrooli.com/maturity: stable
  resource.vrooli.com/privacy-focused: "true"
